  </g>
  <ellipse cx="548.5" cy="268" rx="39.5" ry="9" fill="#dce6ff" fill-opacity=".1" stroke="#f5f8ff" stroke-width="2.5"/>
  <path d="M517 278L522 337" stroke="#ffffff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
  <path d="M519 347C532 352 562 352 577 348" stroke="#f5f8ff" stroke-width="2" stroke-linecap="round"/>
</svg>
