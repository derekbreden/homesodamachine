  <path d="M535 223V265" stroke="#ffffff" stroke-opacity=".65" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="550" cy="351" rx="44" ry="8" fill="#10319c" fill-opacity=".13"/>
  <path d="M509 268L515 344C516 359 580 359 581 344L588 268" fill="#dce6ff" fill-opacity=".12" stroke="#f5f8ff" stroke-width="2.5"/>
  <g clip-path="url(#glass-clip)">
    <path d="M510 288C527 282 570 282 587 288V349H510Z" fill="url(#drink)"/>
    <ellipse cx="548" cy="288" rx="38" ry="7" fill="#ffd2a8"/>
    <g fill="#ffffff" fill-opacity=".58">
      <circle cx="531" cy="319" r="2.2"/>
      <circle cx="553" cy="327" r="2"/>
      <circle cx="566" cy="306" r="1.8"/>
      <circle cx="543" cy="303" r="1.5"/>
      <circle cx="538" cy="338" r="1.5"/>
      <circle cx="568" cy="337" r="1.5"/>
      <circle cx="522" cy="299" r="1.5"/>
      <circle cx="557" cy="297" r="1.4"/>
