  <path d="M640 319L637 326L646 326L650 318Z" fill="#10319c" fill-opacity=".4"/>
  <path d="M548 127C546 126 543 127 542 130L518 190C516 195 519 198 523 200L547 210C551 212 555 210 557 206L582 145C584 141 582 138 578 136Z" fill="#b7caf8"/>
  <path d="M545 133L574 144L550 204L522 193Z" fill="#10319c"/>
  <path d="M548 141L566 148L548 194L530 187Z" fill="#1749d1"/>
  <path d="M546 149L559 154L553 168L540 163Z" fill="#dce6ff"/>
  <path d="M538 170L551 175L545 188L532 183Z" fill="#dce6ff" fill-opacity=".6"/>
