<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" fill="none">
  <title>A soda faucet above the counter. The machine below.</title>
  <desc>Illustration of the kitchen appliance in development: a dedicated faucet pours cold carbonated soda into a glass, connected to a slim machine and a carbon dioxide cylinder inside the cabinet below the kitchen counter.</desc>
  <!-- The enclosure silhouette follows the current machine's installation-guide
       geometry. The kitchen, connections and finishes are simplified illustration. -->
  <defs>
    <linearGradient id="counter" x1="477" y1="314" x2="477" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#dce6ff"/>
    </linearGradient>
    <linearGradient id="faucet" x1="624" y1="168" x2="689" y2="173" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b7caf8"/>
      <stop offset=".38" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#dce6ff"/>
    </linearGradient>
    <linearGradient id="front" x1="129" y1="215" x2="260" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#dce6ff"/>
    </linearGradient>
    <linearGradient id="side" x1="257" y1="277" x2="472" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8c0f5"/>
      <stop offset="1" stop-color="#c7d7ff"/>
    </linearGradient>
    <linearGradient id="cylinder" x1="450" y1="591" x2="516" y2="591" gradientUnits="userSpaceOnUse">
      <stop stop-color="#abc3f7"/>
      <stop offset=".38" stop-color="#eaf0ff"/>
      <stop offset="1" stop-color="#b7caf8"/>
    </linearGradient>
    <linearGradient id="drink" x1="541" y1="285" x2="541" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb681"/>
      <stop offset="1" stop-color="#ff9152"/>
    </linearGradient>
    <clipPath id="glass-clip">
      <path d="M509 268H588L581 344C580 355 516 355 515 344Z"/>
    </clipPath>
  </defs>

  <!-- A quiet room outline puts the fixture in a kitchen, without competing with it. -->
  <path d="M170 117V293M170 293H460" stroke="#dce6ff" stroke-opacity=".18" stroke-width="2"/>
  <path d="M210 167H370M210 186H308" stroke="#dce6ff" stroke-opacity=".14" stroke-width="2" stroke-linecap="round"/>

  <!-- The cabinet is drawn open so the above/below-counter arrangement is visible. -->
  <path d="M107 379H843V785H107Z" fill="#10319c" fill-opacity=".4"/>
  <path d="M133 397H812V710H133Z" stroke="#dce6ff" stroke-opacity=".2" stroke-width="2"/>
  <path d="M133 710H812L850 784H107Z" fill="#dce6ff" fill-opacity=".09"/>
  <path d="M843 379H873V777L843 785Z" fill="#dce6ff" fill-opacity=".18"/>
  <path d="M107 379H132V782H107Z" fill="#dce6ff" fill-opacity=".24"/>
  <path d="M107 781H843V799H107Z" fill="#dce6ff" fill-opacity=".3"/>
  <path d="M108 803V820M842 803V820" stroke="#dce6ff" stroke-opacity=".42" stroke-width="6" stroke-linecap="round"/>

  <!-- The sink and its drain are contextual outlines. -->
  <path d="M195 371C201 423 235 450 313 450C388 450 423 423 432 371" fill="#10319c" fill-opacity=".5" stroke="#b7caf8" stroke-opacity=".48" stroke-width="2.5"/>
  <path d="M307 451V524C307 540 320 551 336 551H360C376 551 385 562 385 576V593C385 610 371 622 353 622H334" stroke="#dce6ff" stroke-opacity=".23" stroke-width="12" stroke-linecap="round"/>
  <path d="M302 451H313" stroke="#dce6ff" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>

  <!-- One bundled connection links the under-counter appliance to its faucet. -->
  <path d="M663 377V416C663 438 714 437 745 458C762 470 769 480 769 507" stroke="#10319c" stroke-width="18" stroke-linecap="round"/>
  <path d="M663 377V416C663 438 714 437 745 458C762 470 769 480 769 507" stroke="#dce6ff" stroke-opacity=".66" stroke-width="7" stroke-linecap="round"/>
  <path d="M663 378V414C663 438 714 437 745 458C762 470 769 480 769 507" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>

