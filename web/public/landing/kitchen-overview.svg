  <ellipse cx="482" cy="762" rx="42" ry="12" fill="#10319c" fill-opacity=".75"/>
  <path d="M451 535C451 515 461 503 472 499V486H492V499C505 504 516 516 516 535V743C516 761 451 761 451 743Z" fill="url(#cylinder)"/>
