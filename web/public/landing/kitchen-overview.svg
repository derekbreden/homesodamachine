    <path d="M181 127L282 166C284 167 286 167 288 166L347 131" stroke="#ffffff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
    <path d="M188.755 138.004L266.68 167.904L232.79 215.706L154.865 185.806Z" fill="#10319c"/>
    <path d="M192.969 147.29L253.747 170.611L228.482 206.247L167.704 182.927Z" fill="#1749d1"/>
    <path d="M196 159L236 174L226 189L186 174Z" fill="#dce6ff" fill-opacity=".88"/>
    <path d="M191 181L216 191" stroke="#ff9152" stroke-width="4" stroke-linecap="round"/>
    <path d="M129.161 250.443L255.414 298.887L472.629 168.658" stroke="#10319c" stroke-opacity=".24" stroke-width="2"/>
    <path d="M145 264L238 300L237 358L144 322Z" fill="#10319c" fill-opacity=".035" stroke="#10319c" stroke-opacity=".18" stroke-width="2"/>
    <path d="M178 289L205 299" stroke="#10319c" stroke-opacity=".48" stroke-width="3" stroke-linecap="round"/>
    <path d="M300 290L438 207V283L300 366Z" fill="#10319c" fill-opacity=".13"/>
    <g stroke="#10319c" stroke-opacity=".36" stroke-width="3" stroke-linecap="round">
      <path d="M313 291V345M325 284V338M337 277V331M349 270V324M361 263V317M373 256V310M385 249V303M397 242V296M409 235V289M421 228V282"/>
    </g>
    <path d="M132 385L146 390V400L132 394ZM237 424L251 429V439L237 434ZM456 310L470 302V313L456 321Z" fill="#10319c"/>
  </g>

  <!-- A continuous worktop creates the most legible division in the illustration. -->
  <path d="M78 350H843L916 319H151Z" fill="url(#counter)"/>
  <path d="M78 350H843V379H78Z" fill="#dce6ff"/>
  <path d="M843 350L916 319V347L843 379Z" fill="#b7caf8"/>
  <path d="M79 350H843L915 319" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M79 378H843" stroke="#10319c" stroke-opacity=".13" stroke-width="2"/>

  <!-- An inset sink keeps the arrangement recognizable as a kitchen counter. -->
  <ellipse cx="314" cy="341" rx="143" ry="25" fill="#a8c0f5"/>
  <ellipse cx="314" cy="339" rx="133" ry="20" fill="#10319c" fill-opacity=".55"/>
  <path d="M190 343C237 325 387 325 438 342" stroke="#dce6ff" stroke-opacity=".65" stroke-width="2"/>
  <path d="M185 347C226 363 394 366 446 348" stroke="#f5f8ff" stroke-width="3" stroke-linecap="round"/>

  <!-- The dedicated faucet uses the current gooseneck, tip display and lever form. -->
