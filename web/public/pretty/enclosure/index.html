<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b25">
  <title>Studio · Full enclosure · Home Soda Machine</title>
  <meta name="description" content="Explore the complete home soda machine under soft studio lighting. Open the shell to see the refrigeration, pumps, plumbing and wiring.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../studio.css">
  <link rel="icon" href="/pwa-icons/favicon-32.png">
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js","three/":"https://cdn.jsdelivr.net/npm/three@0.181.1/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.5/build/index.module.js"}}
  </script>
</head>
<body>
  <main id="enclosure-studio" data-pretty-studio data-assembly>
    <header class="pretty-heading">
      <div>
        <p class="pretty-eyebrow">Home Soda Machine · Studio</p>
        <h1>Full enclosure</h1>
        <p class="pretty-subtitle">Refrigeration · pumps · plumbing · wiring</p>
      </div>
      <nav class="pretty-links" aria-label="Studio"><a class="pretty-home" href="../">Reducer</a><a class="pretty-home" href="/">Home</a></nav>
    </header>
    <div class="pretty-stage" data-stage role="img" aria-label="Interactive three-dimensional cutaway of the complete home soda machine.">
      <p class="pretty-loading" data-loading>Opening the assembly…</p>
    </div>
    <fieldset class="pretty-toolbar" data-assembly-controls disabled aria-label="Model controls">
      <label class="pretty-shell">Shell <select data-cutaway><option value="rear">Rear open</option><option value="front">Front open</option><option value="open">All open</option><option value="closed">Closed</option></select></label>
      <div class="pretty-actions" role="group" aria-label="Drag action">
        <button class="btn cursor-interaction" type="button" data-mode="rotate" aria-pressed="true">Rotate</button>
        <button class="btn cursor-interaction" type="button" data-mode="pan" aria-pressed="false">Pan</button>
      </div>
      <div class="pretty-actions" role="group" aria-label="Zoom and view">
        <button class="btn cursor-interaction" type="button" data-zoom="out" aria-label="Zoom out">−</button>
        <button class="btn cursor-interaction" type="button" data-zoom="in" aria-label="Zoom in">+</button>
        <button class="btn cursor-interaction" type="button" data-reset>Reset view</button>
      </div>
      <label class="form-check pretty-core"><input class="form-check-input" type="checkbox" data-core><span class="form-check-label">Core insulation</span></label>
      <label class="form-check pretty-soft"><input class="form-check-input" type="checkbox" data-soft checked><span class="form-check-label">Soft light</span></label>
    </fieldset>
    <p class="pretty-view-note" data-view-note aria-live="polite">Rear two panels and core insulation hidden.</p>
    <div class="pretty-caption">
      <p data-help>Drag to rotate · scroll to zoom · right-drag to pan</p>
      <p data-status role="status" aria-live="polite">Studio lighting</p>
    </div>
  </main>
  <script type="module">
    import { mountStudio } from '../studio.js';
    import { loadEnclosure } from '../enclosure.js';
    import { createInlineMobileTheme } from '../theme.js';
    const root = document.getElementById('enclosure-studio');
    loadEnclosure().then(model => {
      mountStudio(root, model, createInlineMobileTheme(root));
      root.querySelector('[data-assembly-controls]').disabled = false;
    }).catch(error => {
      root.querySelector('[data-loading]').textContent = 'The assembly could not load. Please reload to try again.';
      console.error(error);
    });
  </script>
</body>
</html>
