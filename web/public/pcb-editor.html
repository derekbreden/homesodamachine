<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCB Editor — dev</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --text: #e0e0e0;
      --dim: #888;
      --accent: #7ec8e3;
      --accent-dim: #3a6b7e;
      --red: #e05555;
      --green: #5c9e5c;
      --silk: #c0c090;  /* silk screen — warm off-white, like real silkscreen */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Toolbar */
    #toolbar {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: var(--surface); border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0; z-index: 10;
    }
    #toolbar label { font-size: 13px; color: var(--dim); }
    select {
      background: var(--bg); color: var(--text); border: 1px solid #444;
      border-radius: 4px; padding: 4px 8px; font-size: 13px;
    }
    #status { font-size: 13px; color: var(--dim); margin-left: auto; }
    #coords { font-size: 13px; color: var(--accent); min-width: 140px; text-align: right; }
    .spacer { flex: 1; }
    button {
      background: var(--accent-dim); color: var(--text); border: none;
      border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    button:hover { background: var(--accent); color: #111; }
    .snap-label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 4px; }
    .snap-label input { width: 48px; background: var(--bg); color: var(--text); border: 1px solid #444; border-radius: 3px; padding: 3px 5px; font-size: 12px; text-align: right; }

    /* Canvas area */
    #canvas-wrap {
      flex: 1; position: relative; overflow: hidden;
      touch-action: none; background: #0d0d1a;
    }
    svg.pcb-edit-svg {
      display: block; position: absolute;
      background: #0d0d1a;
    }

    /* Component shapes */
    .comp-shape { cursor: grab; }
    .comp-shape:active { cursor: grabbing; }
    .comp-shape .shape { stroke-width: 0.12; }
    .comp-shape .label { font-family: monospace; font-size: 0.7px; fill: #ccc; pointer-events: none; user-select: none; }
    .comp-shape.dragging .shape { stroke: var(--accent); stroke-width: 0.3; }
    .comp-shape.dragging .label { fill: var(--accent); }

    /* Category colors */
    .cat-chip .shape { fill: #1a3a5c; stroke: #4a8ab5; }
    .cat-module .shape { fill: #1a3a5c; stroke: #7eb8da; }
    .cat-connector .shape { fill: #2a2a2a; stroke: #777; }
    .cat-capacitor .shape { fill: #1a3a1a; stroke: #4a8a4a; }
    .cat-resistor .shape { fill: #3a2a1a; stroke: #b58a4a; }
    .cat-coincell .shape { fill: #2a2a3a; stroke: #888; }
    .cat-electrolytic .shape { fill: #1a2a3a; stroke: #5a7a9a; }
    .cat-buzzer .shape { fill: #2a2a2a; stroke: #666; }
    .cat-unknown .shape { fill: #1a1a1a; stroke: #555; }

    /* Board outline */
    .board-outline { fill: none; stroke: #333; stroke-width: 0.15; }

    /* Grid */
    .grid-line { stroke: #1a1a30; stroke-width: 0.03; }
    .grid-line.major { stroke: #222240; stroke-width: 0.06; }
  </style>
</head>
<body>
  <div id="toolbar">
    <label>Board</label>
    <select id="board-select"><option value="">-- choose --</option></select>
    <button id="reload-btn" disabled>Reload</button>
    <span class="snap-label">
      Snap <input id="snap-input" type="number" value="0.05" step="0.01" min="0" max="5"> mm
    </span>
    <span class="spacer"></span>
    <span id="coords"></span>
    <span id="status"></span>
  </div>
  <div id="canvas-wrap">
    <svg id="edit-svg" class="pcb-edit-svg"></svg>
  </div>

  <script src="/pan-zoom.js"></script>
  <script type="module" src="/js/pcb-editor.js"></script>
</body>
</html>
