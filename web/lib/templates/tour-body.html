<link rel="stylesheet" href="{{TOUR_ASSET_ROOT}}/css/viewer.css">
<link rel="stylesheet" href="{{TOUR_ASSET_ROOT}}/css/tour.css">

<!-- The stage is the page: the shared Three.js canvases move in here at boot
     and stay. `.cad-wrapper` is what dresses them (viewer.css) — the same
     rules that dress the parts viewer's modal, so the canvas, the ViewCube and
     the loading scrim land where they always do. -->
<div id="tour-stage" class="cad-wrapper tour-stage" data-tour-version="{{TOUR_ASSET_VERSION}}">
  <div id="tour-hud-host"></div>
</div>

<!-- scene.js parks the renderer and gizmo canvases here at module load, before
     anything has a stage to put them on. It is never visible. -->
<div id="cad-canvas-host" style="display: none;"></div>

<script type="module" src="{{TOUR_ASSET_ROOT}}/js/tour/main.js"></script>
