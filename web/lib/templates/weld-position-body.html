<main id="weld-position">
  <div class="weld-heading">
    <h1>Gun at the joint</h1>
    <span class="weld-note">Tube, recessed endcap, gun</span>
  </div>
  <div class="weld-controls" aria-label="Camera views">
    <button type="button" data-view="overall" aria-pressed="true">3D</button>
    <button type="button" data-view="top" aria-pressed="false">Top</button>
    <button type="button" data-view="joint" aria-pressed="false">Joint</button>
    <label class="weld-roll">Roll <output data-roll-value>35°</output>
      <input type="range" data-roll min="0" max="80" step="1" value="35" aria-label="Roll about the line from laser dot to grip base">
    </label>
  </div>
  <div class="weld-stage" role="img" aria-label="Interactive 3D view of a carbonator tube, recessed endcap and welding gun. The wire and laser are shown separately.">
    <span class="weld-loading" role="status">Loading 3D…</span>
  </div>
  <div class="weld-key">
    <span><i class="wire-key"></i>External wire feed</span>
    <span><i class="laser-key"></i>Laser / schematic sweep</span>
    <span><i class="tangent-key"></i>Roll axis: dot to grip base</span>
  </div>
  <p class="weld-note">Drag to orbit · Scroll to zoom · Gun and sweep are schematic</p>
</main>
<script type="module" src="/js/weld-position/main.js"></script>
