<main id="weld-position">
  <div class="weld-heading">
    <h1>Gun at the joint</h1>
    <span class="weld-note">Tube, recessed endcap, gun</span>
  </div>
  <div class="weld-controls" aria-label="Camera views and gun rotation">
    <button type="button" data-view="overall" aria-pressed="true">3D</button>
    <button type="button" data-view="top" aria-pressed="false">Top</button>
    <button type="button" data-view="joint" aria-pressed="false">Joint</button>
    <div class="weld-rotations">
      <label class="weld-roll">Grip axis <output data-roll-value>45°</output>
        <input type="range" data-roll min="0" max="80" step="1" value="45" aria-label="Roll about the line from laser dot to grip base">
      </label>
      <label class="weld-roll">Hole axis <output data-hole-roll-value>30°</output>
        <input type="range" data-hole-roll min="-25" max="95" step="1" value="30" aria-label="Roll about the hole axis, aligned through both holes at zero vertical-axis rotation">
      </label>
      <label class="weld-roll">Vertical axis <output data-vertical-value>−15°</output>
        <input type="range" data-vertical min="-90" max="90" step="1" value="-15" aria-label="Turn about the vertical line through the laser dot">
      </label>
    </div>
  </div>
  <div class="weld-stage" role="img" aria-label="Interactive 3D view of a carbonator tube, recessed endcap and welding gun. Three rotation controls share the laser dot: grip axis, hole axis and vertical axis. The vertical axis turns the gun away from its tangent approach while the tube and endcap stay fixed.">
    <span class="weld-loading" role="status">Loading 3D…</span>
  </div>
  <div class="weld-key">
    <span><i class="wire-key"></i>External wire feed</span>
    <span><i class="laser-key"></i>Laser / schematic sweep</span>
    <span><i class="tangent-key"></i>Grip axis: dot to base</span>
    <span><i class="hole-axis-key"></i>Hole axis</span>
    <span><i class="vertical-axis-key"></i>Vertical axis: through dot</span>
  </div>
  <p class="weld-note">Drag to orbit · Scroll to zoom · Gun and sweep are schematic</p>
</main>
<script type="module" src="/js/weld-position/main.js"></script>
