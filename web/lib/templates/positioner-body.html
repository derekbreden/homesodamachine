<main id="positioner">
  <div class="positioner-heading">
    <div>
      <h1>PGFUN positioner</h1>
      <p>Two inline 50:1 gearboxes · Swivel and pivot · Gun supported from below</p>
    </div>
    <nav class="positioner-links" aria-label="Assembly files">
      <a href="/3d#step:printed-parts%2Ffixtures%2Fpgfun-positioner%2Fassembly.step">Fixture CAD</a>
      <a href="/3d#step:printed-parts%2Ffixtures%2Fweld-rotator%2Fweld-rotator-assembly.step">Rotator CAD</a>
      <a href="/docs/gun-positioner-guide/gun-positioner-guide.pdf">Assembly guide</a>
    </nav>
  </div>
  <div class="positioner-controls" aria-label="Assembly motion">
    <label class="positioner-axis" for="positioner-swivel">
      <span>Swivel <output for="positioner-swivel" id="positioner-swivel-value">0.00°</output></span>
      <input id="positioner-swivel" type="range" min="-1" max="1" step="0.01" value="0" disabled>
    </label>
    <label class="positioner-axis" for="positioner-pivot">
      <span>Pivot <output for="positioner-pivot" id="positioner-pivot-value">0.00°</output></span>
      <input id="positioner-pivot" type="range" min="-1" max="1" step="0.01" value="0" disabled>
    </label>
    <label class="positioner-aux"><input id="positioner-aux" type="checkbox" disabled> Camera and cable support</label>
  </div>
  <div class="positioner-stage" role="img" aria-label="Interactive CAD assembly of the PGFUN swivel and pivot fixture, welding gun and rotator. Swivel turns the fork about the vertical gearbox axis. Pivot tips the gun and cradle about the horizontal gearbox axis.">
    <span class="positioner-loading" role="status">Loading assembly…</span>
  </div>
  <div class="positioner-caption">
    <p>Drag to orbit · Scroll or pinch to zoom · Click a part to identify it</p>
    <p>Working travel: ±1° per axis</p>
  </div>
  <p id="positioner-selection" aria-live="polite">Gun, printed fixture and existing rotator</p>
  <noscript><p>Enable JavaScript to explore the assembly, or open the assembly guide above.</p></noscript>
</main>
<script type="module" src="/js/positioner.js"></script>
