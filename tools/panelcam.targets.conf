# panelcam targets — one camera and one pixel rectangle per display on the machine.
#
#   <target>  device  <AVFoundation index from `tools/panelcam.sh list`>
#   <target>  size    <capture resolution the camera actually offers>
#   <target>  crop    <w:h:x:y — ffmpeg crop, in captured pixels>
#
# TO AIM A TARGET: shoot it --full, open the frame, read the panel's rectangle off it, and
# write that rectangle here. The crop is the aim; the arm only has to hold still.
#
# A crop wider than the panel by a few millimetres of bezel is the useful one — the bezel edge
# in frame is how a later shot proves the rig has not been knocked, and a panel cropped to its
# own edge cannot tell a drifted camera from a changed screen.

front   device  0
front   size    1280x720
front   crop    1280:720:0:0

faucet  device  0
faucet  size    1280x720
faucet  crop    1280:720:0:0
