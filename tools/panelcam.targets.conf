# panelcam targets — one camera, one rectangle, and one focus range per display.
#
#   <target>  match        <substring of the camera's name, from `tools/panelcam.sh list`>
#   <target>  format       <sensor size to stream, from `tools/panelcam.sh list`>
#   <target>  score        <w:h:x:y — the panel's bounding box, in captured pixels>
#   <target>  corners      <TLx,TLy TRx,TRy BRx,BRy BLx,BLy — the panel's corners, in captured pixels>
#   <target>  panel        <WxH — the panel's own pixel grid>
#   <target>  scale        <saved px per panel px; the saved picture is W*scale by H*scale>
#   <target>  focus-range  <lo:hi:step — the focus values walked, upward, while frames are scored>
#   <target>  dwell        <seconds of frames scored at each focus value>
#   <target>  uvc          <control=value … written once the stream runs, and read back>
#   <target>  floor        <a best score under this is not a picture of the panel: the shot is retaken once>
#   <target>  max          <seconds the sweep may take>
#   <target>  wake         <console port told a finger landed, so the panel is lit; optional>
#
# A CAMERA IS NAMED, NOT NUMBERED. AVFoundation's indices move when anything else is plugged in or
# wakes up, and a USB reset brings this camera back on a different one.
#
# THE CODING IS THE DRIVER'S DECODE OF THE CAMERA'S JPEG. `list` also shows yuvs at 4656x3496; on
# this camera's USB 2.0 link that coding arrives torn into stripes, at under one frame a second.
#
# THE SHUTTER IS 4 ms. The panel's white measures 229 of the coding's 235 at absolute_exposure_time
# 40, with the dark navy of its background at 27 over the 16 of black; at 64 the white is a flat 235
# and every light colour on it is gone. The panel paints at 39 Hz (16 MHz pixel clock over 820 by
# 500) and a shutter shorter than its 25.6 ms paint shows no banding: row-to-row swings in a flat
# field stay under half a level from 2 ms to 26 ms.
#
# WHITE BALANCE IS FIXED AT 6500. The panel's white then reads Cb +1 Cr −3 of ±128, the same as the
# camera's automatic setting finds and the nearest of its fixed ones, and it no longer moves with
# whatever the panel happens to show. sharpness 3 is the camera's neutral: 0 softens the panel's
# pixel grid away and 6 rings around every edge.
#
# SCORE IS THE PANEL, NOT THE FRAME. The panel is a fifth of the picture and the rest is unlit
# countertop, so a score taken over the whole frame ranks frames by the countertop.
#
# FOCUS IS WALKED UPWARD, AND THE SHARPEST FRAME IS THE PICTURE. The lens moves only when the
# register changes and parks when the stream starts, and where it lands for a number depends on
# the direction it came from, by about sixty units. The sweep parks it below the range and walks
# up in steps of 20 — a step of 10 does not overcome the lens's static friction, and nine of them
# in a row moved nothing. The peak for this rig arrives near 530 from below; the range holds the
# peak after a knock, and the sweep stops once the score has halved past it.
#
# THE PICTURE IS THE PANEL'S OWN GRID. A shot is the frame warped from `corners` onto `panel` at
# `scale`, in one resampling: the 1.6 deg the rig is rotated, the 3.7 deg the left edge leans
# against the right, and the panel's own pixels, wider than tall, all come out as 3x3 squares.
#
# TO AIM A TARGET: `tools/panelcam.sh aim front`. It shoots the full frame at 16 ms, reads the lit
# panel's four edges against the bezel, and writes their corners here, with their bounding box as
# `score`. It then lays that frame onto the grid and reads the period of the panel's pixel lattice
# off it: 3.000 at scale 3 says the corners span exactly 800 panel px. A rig that has been knocked
# since shows in a shot as a dark band along one edge and content cut off the other: aim it again.

front   match        16MP
front   format       4656x3496
front   score        2700:1581:911:946
front   corners      1004.2,947.0 3607.0,995.2 3610.8,2526.8 911.5,2422.2
front   panel        800x480
front   scale        3
front   focus-range  400:700:20
front   dwell        0.3
front   floor        0.05
front   max          30
front   uvc          auto_focus=0 auto_exposure_mode=1 absolute_exposure_time=40 gain=0 white_balance_temperature_auto=0 white_balance_temperature=6500 sharpness=3
front   wake         /dev/cu.usbserial-10
