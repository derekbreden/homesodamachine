# panelcam targets — one camera, one set of camera settings, and one rectangle per display.
#
#   <target>  match   <substring of the camera's name, from `tools/panelcam.sh list`>
#   <target>  warmup  <frames discarded before the one that is kept>
#   <target>  crop    <w:h:x:y — ffmpeg crop, in captured pixels>
#   <target>  uvc     <control=value …, applied before every frame>
#   <target>  wake    <console port told a finger landed, so the panel is lit; optional>
#
# A CAMERA IS NAMED, NOT NUMBERED. AVFoundation's indices move when anything else is plugged in
# or wakes up — the iPhone alone shifts every index below it by two. A substring of the name
# survives that; an index silently starts pointing at the FaceTime camera.
#
# THE EXPOSURE IS ONE PANEL REFRESH, AND THAT IS THE WHOLE REASON FOR THE NUMBER. At 7 ms the
# shutter is open for less than the 4.3B's 16.7 ms paint, so each frame catches a different part
# of one and sharpness measured over four shots swung by 2905. At 167 (16.7 ms, one full refresh)
# the same four spread by 8. Any exposure here should stay a multiple of the panel's refresh.
#
# THE FOCUS IS MEASURED, NOT GUESSED, and the peak is narrow: 480 scores 0.180 where 360 scores
# 0.009. Re-aim the rig and this is stale — sweep `absolute_focus` again and rank the frames by
# edge energy over mean brightness, because raw edge energy just picks the most overexposed one.
#
# TO AIM A TARGET: shoot it --full, open the frame, read the panel's rectangle off it, and write
# that rectangle here. The crop is the aim; the arm only has to hold still.
#
# A crop wider than the panel by a few millimetres of bezel is the useful one — the bezel edge in
# frame is how a later shot proves the rig has not been knocked, and a panel cropped to its own
# edge cannot tell a drifted camera from a changed screen.

front   match   16MP
front   warmup  20
front   crop    1265:735:430:190
front   uvc     auto_exposure_mode=1 absolute_exposure_time=167 gain=0 auto_focus=0 absolute_focus=480
front   wake    /dev/cu.usbserial-10
