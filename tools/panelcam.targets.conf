# panelcam targets — one camera, one rectangle, and one focus range per display.
#
#   <target>  match        <substring of the camera's name, from `tools/panelcam.sh list`>
#   <target>  format       <sensor size to stream, from `tools/panelcam.sh list`>
#   <target>  score        <w:h:x:y — the panel's rectangle, in captured pixels>
#   <target>  crop         <w:h:x:y — what the saved frame keeps>
#   <target>  focus-range  <lo:hi:step — the focus values walked while frames are scored>
#   <target>  dwell        <seconds spent at each focus value, moving and then scoring>
#   <target>  uvc          <control=value … held for as long as the stream is open>
#   <target>  floor        <a best score under this is a wedged lens: reset and take it again>
#   <target>  wake         <console port told a finger landed, so the panel is lit; optional>
#
# A CAMERA IS NAMED, NOT NUMBERED. AVFoundation's indices move when anything else is plugged in or
# wakes up, and a USB reset brings this camera back on a different one.
#
# THE EXPOSURE IS ONE PANEL REFRESH. At 7 ms the shutter is open for less than the 4.3B's 16.7 ms
# paint and each frame catches a different part of one; sharpness measured over four shots swung by
# 2905. At 167 (16.7 ms) the same four spread by 8.
#
# SCORE IS THE PANEL, NOT THE FRAME. The panel is a fifth of the picture and the rest is unlit
# countertop, so a score taken over the whole frame ranks frames by the countertop.
#
# FOCUS IS WALKED, NOT SET. absolute_focus reads back the number last written while the lens stands
# somewhere else — held at 420 and 580 this panel measures 752 and 697, held at 500 and 660 it
# measures 126 and 130. The range is walked instead, and the sharpest frame is the picture.
#
# TO AIM A TARGET: shoot it --full, open the frame, read the panel's rectangle off it, and write
# that rectangle here as both `score` and (with a margin) `crop`. A crop wider than the panel by a
# few millimetres of bezel is the useful one — the bezel edge in frame is how a later shot proves
# the rig has not been knocked.

front   match        16MP
front   format       4656x3496
front   score        2850:1590:1125:970
front   crop         2980:1720:1080:930
front   focus-range  300:820:40
front   dwell        0.3
front   floor        0.035
front   uvc          auto_focus=0 auto_exposure_mode=1 absolute_exposure_time=167 gain=0
front   wake         /dev/cu.usbserial-10
front   target       0.05
front   max          40
