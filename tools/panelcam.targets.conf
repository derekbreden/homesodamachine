# panelcam targets — one camera, one rectangle, and one focus range per display.
#
#   <target>  match        <substring of the camera's name, from `tools/panelcam.sh list`>
#   <target>  format       <sensor size to stream, from `tools/panelcam.sh list`>
#   <target>  score        <w:h:x:y — the panel's bounding box, in captured pixels>
#   <target>  corners      <TLx,TLy TRx,TRy BRx,BRy BLx,BLy — the panel's corners, in captured pixels>
#   <target>  panel        <WxH — the panel's own pixel grid>
#   <target>  scale        <saved px per panel px; the saved picture is W*scale by H*scale>
#   <target>  palette      <NAME:drawn:captured … — each colour the firmware draws, and how the camera
#                           renders it; read off the test screen by an aim>
#   <target>  focus-range  <lo:hi:step — the focus values walked, upward, while frames are scored>
#   <target>  dwell        <seconds of frames scored at each focus value>
#   <target>  uvc          <control=value … written once the stream runs, and read back>
#   <target>  floor        <a best score under this is not a picture of the panel: the shot is retaken once>
#   <target>  max          <seconds the sweep may take>
#   <target>  console      <the main board's console port: told a finger landed before a shot, so the
#                           panel is lit, and asked for the test screen by an aim; optional for shots>
#
# A CAMERA IS NAMED, NOT NUMBERED. AVFoundation's indices move when anything else is plugged in or
# wakes up, and a USB reset brings this camera back on a different one.
#
# THE CODING IS THE DRIVER'S DECODE OF THE CAMERA'S JPEG. `list` also shows yuvs at 4656x3496; on
# this camera's USB 2.0 link that coding arrives torn into stripes, at under one frame a second.
#
# THE SHUTTER IS 8 ms. At absolute_exposure_time 80, the test screen's white and pale ice
# remain distinct, and its navy is separated from black. The panel paints at 39 Hz (16 MHz
# pixel clock over 820 by 500); this exposure keeps the one-pixel test stripes distinct.
#
# WHITE BALANCE IS FIXED AT 6500. The panel's white then reads Cb +1 Cr −3 of ±128, the same as the
# camera's automatic setting finds and the nearest of its fixed ones, and it no longer moves with
# whatever the panel happens to show. sharpness 3 is the camera's neutral: 0 softens the panel's
# pixel grid away and 6 rings around every edge.
#
# SCORE IS THE PANEL, NOT THE FRAME. The panel is two fifths of the picture and the rest is unlit
# countertop, so a score taken over the whole frame ranks frames by the countertop.
#
# FOCUS IS WALKED UPWARD, AND THE SHARPEST FRAME IS THE PICTURE. The lens moves only when the
# register changes and parks when the stream starts, and where it lands for a number depends on
# the direction it came from, by about sixty units. The sweep parks it below the range and walks
# up in steps of 20 — a step of 10 does not overcome the lens's static friction, and nine of them
# in a row moved nothing. The peak for this rig arrives near 620 from below; the range holds the
# peak after a knock, and the sweep stops once the score has halved past it.
#
# THE PICTURE IS THE PANEL'S OWN GRID. A shot is the frame warped from `corners` onto `panel` at
# `scale`, in one resampling: the 0.04 deg the rig is rotated, the 1.4 deg the left edge leans
# against the right, and the panel's own pixels, wider than tall, all come out as 3x3 squares. The
# camera reads the panel at 4.2 px across and 4.0 down per panel pixel, so the grid is resampled
# from more than it keeps.
#
# TO AIM A TARGET: `tools/panelcam.sh aim front`. It has the console put the test screen up, shoots
# the full frame, finds the screen's four white squares, whose centres are at panel (32,32) (768,32)
# (768,448) (32,448), and writes the panel's corners here from them, with their bounding box as
# `score`. It then lays that frame onto the grid and reads the screen back off the picture: its one
# pixel stripes as alternate columns, and the panel's pixel lattice at 3.000 px per panel px. Its
# palette row is read too, as `palette`: what the camera makes of each colour the firmware draws,
# so a shot can say which pixels are which colour. A rig that has been knocked since shows in a
# shot as a dark band along one edge and content cut off the other: aim it again.

front   match        16MP
front   format       4656x3496
front   score        3614:2089:573:1108
front   corners      574.8,1108.8 4186.7,1188.7 4092.8,3196.4 573.8,3109.5
front   panel        800x480
front   scale        3
front   palette      THEME_BG:1749d1:1248ae COL_CARD:10319c:06276d COL_CARD_ON:315fdb:195fc0 COL_ACCENT:ff9152:b37231 COL_TEXT:ffffff:c3e2e5 COL_DIM:dce6ff:94d5e3 COL_OFF:6287e0:2385ce COL_GOOD:ff9152:b5732c COL_WARN:ffb183:b19860 gray:808080:3a5250 black:000000:090401 white:ffffff:b6dde1
front   focus-range  400:760:20
front   dwell        0.3
front   floor        0.05
front   max          30
front   uvc          auto_focus=0 auto_exposure_mode=1 absolute_exposure_time=80 gain=0 white_balance_temperature_auto=0 white_balance_temperature=6500 sharpness=3
front   console      /dev/cu.usbserial-110
