<div id="grid"></div>

<!-- Hidden host for the Three.js renderer + gizmo canvases. They live here
     when no part is open and get moved into the modal wrapper when a STEP
     or DXF is opened (both use the same renderer + camera + gizmo). -->
<div id="cad-canvas-host" style="display: none;"></div>

<script src="/pan-zoom.js"></script>
<script src="/content-viewer.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

mermaid.initialize({
  startOnLoad: false,
  theme: "dark",
  themeVariables: {
    darkMode: true,
    background: "#1a1a2e",
    primaryColor: "#2a2a4a",
    primaryTextColor: "#ffffff",
    primaryBorderColor: "#3a3a5a",
    lineColor: "#999999",
    secondaryColor: "#232342",
    tertiaryColor: "#1a1a2e",
    fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif",
    fontSize: "14px",
  },
  flowchart: { htmlLabels: true, curve: "basis", padding: 12 },
});

// --- occt-import-js loader (no importmap support, loaded manually) ---
let occtReady;
const occtPromise = new Promise((resolve) => { occtReady = resolve; });
const occtScript = document.createElement("script");
occtScript.src = "https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js";
occtScript.onload = () => {
  window.occtimportjs().then((occt) => occtReady(occt));
};
document.head.appendChild(occtScript);

// --- State ---
let allFiles = [];       // STEP files
let mmdFiles = [];       // Mermaid files
let dxfFiles = [];       // DXF files
let currentFile = null;  // STEP detail (file shown in modal)
let currentMmd = null;   // Mermaid detail
let currentDxf = null;   // DXF detail
let currentMmdContent = null;
let mountedStepFile = null; // STEP file currently rendered into the 3D scene
let mountedDxfFile = null;  // DXF file currently rendered into the 3D scene
let currentCadWrapper = null;        // host div inside the modal (parent of canvases)
let currentCadResizeObserver = null; // ResizeObserver on currentCadWrapper
const thumbnailCache = new Map();  // STEP file -> dataURL
const mmdThumbCache = new Map();   // Mermaid file -> svgHTML
const dxfThumbCache = new Map();   // DXF file -> dataURL
const stepEtags = new Map();       // file -> last loaded ETag (for refetch dedupe)
const dxfEtags = new Map();        // file -> last loaded ETag
const dxfMeta = new Map();         // DXF file -> {thickness_mm, material} from sidecar (hardware/PARTS.md)

// --- Detail view: Three.js setup ---
// renderer/scene/camera/controls/gizmo* are created ONCE at module load and
// reused across opens. The two canvases (renderer.domElement and
// gizmoCanvas) live in #cad-canvas-host when no detail is open, and get
// appendChild'd into the modal wrapper inside openDetail. This keeps
// OrbitControls listeners (bound to renderer.domElement) alive across
// open/close cycles and avoids reparsing GL state.
const canvasHost = document.getElementById("cad-canvas-host");

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1a1a2e);
renderer.domElement.id = "viewport";
renderer.domElement.classList.add("cad-viewport");
canvasHost.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 10000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 2, 1.5);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
dirLight2.position.set(-1, -0.5, -1);
scene.add(dirLight2);

let currentGroup = null;

// Exposed for headless render tooling (tools/render/render-step.js).
// Tiny escape hatch so Puppeteer can pose the camera and trigger a render
// without needing to drive OrbitControls via synthetic events.
window.__hsm = { THREE, renderer, scene, camera, controls, loadStepFile, get currentGroup() { return currentGroup; }, get mountedStepFile() { return mountedStepFile; } };

// --- ViewCube ---
// Each cube face's projected hit area is roughly gizmoSize/2 — Apple HIG
// asks for 44pt minimum touch targets, so we size to comfortably exceed
// that on every face. The pointer-events:none on the canvas passes empty
// corners through to OrbitControls; the visible cube IS the touch
// target, so growing the canvas grows the touch area too.
const gizmoSize = window.innerWidth < 600 ? 140 : 180;
const gizmoRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
gizmoRenderer.setPixelRatio(window.devicePixelRatio);
gizmoRenderer.setSize(gizmoSize, gizmoSize);
gizmoRenderer.setClearColor(0x000000, 0);
const gizmoCanvas = gizmoRenderer.domElement;
gizmoCanvas.id = "gizmoCanvas";
// .cad-gizmo: position:absolute inside the wrapper (top-right, safe-area
// padded), pointer-events:none so empty corners pass touches through to
// OrbitControls. Hits on the rendered cube are picked up via document-level
// raycast handlers below.
gizmoCanvas.classList.add("cad-gizmo");
canvasHost.appendChild(gizmoCanvas);

const gizmoScene = new THREE.Scene();
const gizmoCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const gizmoRaycaster = new THREE.Raycaster();

// Face definitions: label, normal (camera direction to see that face), material index
const cubeFaces = [
  { label: "Right",  normal: new THREE.Vector3( 1, 0, 0), index: 0 },
  { label: "Left",   normal: new THREE.Vector3(-1, 0, 0), index: 1 },
  { label: "Top",    normal: new THREE.Vector3( 0, 1, 0), index: 2 },
  { label: "Bottom", normal: new THREE.Vector3( 0,-1, 0), index: 3 },
  { label: "Front",  normal: new THREE.Vector3( 0, 0, 1), index: 4 },
  { label: "Back",   normal: new THREE.Vector3( 0, 0,-1), index: 5 },
];

function makeFaceTexture(label, isHovered) {
  const canvas = document.createElement("canvas");
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext("2d");
  const bg = isHovered ? "#3a3a5a" : "#232342";
  const border = "#3a3a5a";
  const radius = 16;

  // Rounded rect fill
  ctx.beginPath();
  ctx.roundRect(2, 2, 252, 252, radius);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.font = "52px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = isHovered ? "#ffffff" : "#999999";
  ctx.fillText(label, 128, 128);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const cubeMaterials = cubeFaces.map((f) =>
  new THREE.MeshBasicMaterial({ map: makeFaceTexture(f.label, false) })
);
const cubeGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
const cubeMesh = new THREE.Mesh(cubeGeo, cubeMaterials);
// No offset — cube centered at origin, axes start from its corner
gizmoScene.add(cubeMesh);

// Axis lines + labels from bottom-left-front corner of cube
const axisOrigin = new THREE.Vector3(-0.275, -0.275, 0.275);
const axisLen = 0.7;

function makeAxisLine(origin, dir, color) {
  const end = origin.clone().add(new THREE.Vector3().copy(dir).multiplyScalar(axisLen));
  const geo = new THREE.BufferGeometry().setFromPoints([origin, end]);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({ color }));
}

function makeAxisLabel(text, position, color) {
  const canvas = document.createElement("canvas");
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext("2d");
  ctx.font = "bold 48px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(text, 32, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sprite.position.copy(position);
  sprite.scale.set(0.3, 0.3, 1);
  return sprite;
}

gizmoScene.add(makeAxisLine(axisOrigin, new THREE.Vector3(1, 0, 0), 0xe74c3c));
gizmoScene.add(makeAxisLine(axisOrigin, new THREE.Vector3(0, 1, 0), 0x2ecc71));
gizmoScene.add(makeAxisLine(axisOrigin, new THREE.Vector3(0, 0, -1), 0x3498db));
const labelOffset = axisLen + 0.15;
gizmoScene.add(makeAxisLabel("X", axisOrigin.clone().add(new THREE.Vector3(labelOffset, 0, 0)), "#e74c3c"));
gizmoScene.add(makeAxisLabel("Y", axisOrigin.clone().add(new THREE.Vector3(0, labelOffset, 0)), "#2ecc71"));
gizmoScene.add(makeAxisLabel("Z", axisOrigin.clone().add(new THREE.Vector3(0, 0, -labelOffset)), "#3498db"));

// Hover + click tracking. Listeners are document-level (capture phase) so we
// can decide whether the gesture belongs to the gizmo *before* OrbitControls
// sees it. The canvas itself is pointer-events:none, so any tap that doesn't
// raycast-hit the cube falls straight through to the 3D viewport underneath.
let hoveredFaceIndex = -1;
let armedAtPointerDown = false;          // true when pointerdown landed on the cube

function gizmoRaycastFromEvent(e) {
  const rect = gizmoCanvas.getBoundingClientRect();
  if (
    e.clientX < rect.left || e.clientX > rect.right ||
    e.clientY < rect.top  || e.clientY > rect.bottom
  ) return null;
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1,
  );
  gizmoRaycaster.setFromCamera(mouse, gizmoCam);
  const hits = gizmoRaycaster.intersectObject(cubeMesh);
  return hits.length > 0 ? hits[0] : null;
}

document.addEventListener("mousemove", (e) => {
  const hit = gizmoRaycastFromEvent(e);
  const newIndex = hit ? hit.face.materialIndex : -1;
  if (newIndex !== hoveredFaceIndex) {
    if (hoveredFaceIndex >= 0) {
      cubeMaterials[hoveredFaceIndex].map = makeFaceTexture(cubeFaces[hoveredFaceIndex].label, false);
      cubeMaterials[hoveredFaceIndex].needsUpdate = true;
    }
    if (newIndex >= 0) {
      cubeMaterials[newIndex].map = makeFaceTexture(cubeFaces[newIndex].label, true);
      cubeMaterials[newIndex].needsUpdate = true;
    }
    hoveredFaceIndex = newIndex;
  }
});

// Capture-phase pointerdown: if the tap raycast-hits the cube, claim the
// gesture and keep OrbitControls from seeing it. Otherwise the event flows
// through normally to OrbitControls / drag-to-orbit.
document.addEventListener("pointerdown", (e) => {
  const hit = gizmoRaycastFromEvent(e);
  if (!hit) { armedAtPointerDown = false; return; }
  armedAtPointerDown = true;
  e.stopPropagation();
  e.preventDefault();
}, true);

// Capture-phase pointerup: complete the snap if our pointerdown landed on
// the cube AND this pointerup also lands on the cube (so a drag off the
// cube cancels rather than snaps).
document.addEventListener("pointerup", (e) => {
  if (!armedAtPointerDown) return;
  armedAtPointerDown = false;
  const hit = gizmoRaycastFromEvent(e);
  e.stopPropagation();
  e.preventDefault();
  if (!hit) return;
  const face = cubeFaces[hit.face.materialIndex];
  snapCameraToFace(face.normal);
}, true);

function snapCameraToFace(normal) {
  const target = controls.target.clone();
  const dist = camera.position.distanceTo(target);
  const dest = target.clone().add(normal.clone().multiplyScalar(dist));

  // Up vector: use Y-up unless looking along Y axis, then use Z-up
  const up = Math.abs(normal.y) > 0.9
    ? new THREE.Vector3(0, 0, normal.y > 0 ? -1 : 1)
    : new THREE.Vector3(0, 1, 0);

  const startPos = camera.position.clone();
  const startUp = camera.up.clone();
  const duration = 300;
  const startTime = performance.now();

  function animateSnap() {
    const t = Math.min((performance.now() - startTime) / duration, 1);
    const ease = t * (2 - t); // ease-out quad
    camera.position.lerpVectors(startPos, dest, ease);
    camera.up.lerpVectors(startUp, up, ease).normalize();
    camera.lookAt(target);
    controls.update();
    if (t < 1) requestAnimationFrame(animateSnap);
  }
  animateSnap();
}

function renderGizmo() {
  // Mirror main camera orientation
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  gizmoCam.position.copy(dir).multiplyScalar(-3);
  gizmoCam.up.copy(camera.up);
  gizmoCam.lookAt(0, 0, 0);
  gizmoRenderer.render(gizmoScene, gizmoCam);
}

// Size the renderer to the canvas's parent (the modal wrapper when open,
// the hidden host when not — but the host has display:none, so we only
// expect this to do useful work when the modal is open). Falls back to
// window size if the parent has no measured rect (e.g. headless tools that
// drove openDetail and may inspect the canvas before layout settles).
function resizeRenderer() {
  const parent = renderer.domElement.parentElement;
  let w = 0, h = 0;
  if (parent && parent !== canvasHost) {
    const r = parent.getBoundingClientRect();
    w = Math.floor(r.width);
    h = Math.floor(r.height);
  }
  if (w === 0 || h === 0) {
    w = window.innerWidth;
    h = window.innerHeight;
  }
  renderer.setSize(w, h, false);
  // Also re-apply CSS size — setSize(...,false) doesn't touch style, and we
  // want the canvas to actually fill the wrapper's content box.
  renderer.domElement.style.width = w + "px";
  renderer.domElement.style.height = h + "px";
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

let animating = false;
let animateRafId = 0;
function animate() {
  if (!animating) { animateRafId = 0; return; }
  animateRafId = requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  renderGizmo();
}
function startAnimate() {
  if (animating) return;
  animating = true;
  animate();
}
function stopAnimate() {
  animating = false;
  if (animateRafId) {
    cancelAnimationFrame(animateRafId);
    animateRafId = 0;
  }
}

// --- STEP parsing ---
async function parseStep(buffer) {
  const occt = await occtPromise;
  return occt.ReadStepFile(buffer, null);
}

function buildMesh(result) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.1, roughness: 0.6 });
  const matBack = new THREE.MeshStandardMaterial({ color: 0x667788, metalness: 0.1, roughness: 0.6, side: THREE.BackSide });

  for (const mesh of result.meshes) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(mesh.attributes.position.array), 3));
    if (mesh.attributes.normal) {
      geo.setAttribute("normal", new THREE.Float32BufferAttribute(new Float32Array(mesh.attributes.normal.array), 3));
    }
    if (mesh.index) {
      geo.setIndex(new THREE.BufferAttribute(new Uint32Array(mesh.index.array), 1));
    }
    geo.computeBoundingBox();

    // Front + back face so thin parts are visible from behind
    group.add(new THREE.Mesh(geo, mat));
    group.add(new THREE.Mesh(geo, matBack));
  }

  // Edge lines for CAD look
  for (const edge of (result.brpieces || [])) {
    // Not all versions expose edges — skip if absent
  }

  return group;
}

function resetCamera(group) {
  const box = new THREE.Box3().setFromObject(group);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim * 2.5;

  // Isometric angles
  const el = Math.atan(1 / Math.sqrt(2)); // ~35.26 deg
  const az = Math.PI / 4;
  camera.position.set(
    center.x + dist * Math.cos(el) * Math.cos(az),
    center.y + dist * Math.sin(el),
    center.z + dist * Math.cos(el) * Math.sin(az)
  );
  camera.lookAt(center);
  controls.target.copy(center);
  controls.update();
}

async function loadStepFile(file, { preserveCamera = false } = {}) {
  // Loading pill lives inside the current step wrapper (or none if the
  // headless tool drove loadStepFile directly). Tolerate either.
  const loadingEl = currentCadWrapper && currentCadWrapper.querySelector(".cad-loading");
  if (loadingEl) loadingEl.style.display = "block";

  try {
    // If we're refetching the same file that's already in the scene, send
    // If-None-Match so the server can answer 304 when bytes are unchanged
    // (avoids the visible re-render flash on a deploy that didn't touch
    // this STEP file).
    const headers = {};
    const prevEtag = stepEtags.get(file);
    if (mountedStepFile === file && prevEtag) {
      headers["If-None-Match"] = prevEtag;
    }
    const resp = await fetch(`/steps/${file}`, { headers });
    if (resp.status === 304) return;
    if (!resp.ok) return;
    const etag = resp.headers.get("etag");
    if (etag) stepEtags.set(file, etag);

    const buf = new Uint8Array(await resp.arrayBuffer());
    const result = await parseStep(buf);

    if (currentGroup) {
      scene.remove(currentGroup);
      currentGroup.traverse((c) => { if (c.geometry) c.geometry.dispose(); });
    }

    currentGroup = buildMesh(result);
    scene.add(currentGroup);
    mountedStepFile = file;
    if (!preserveCamera) resetCamera(currentGroup);
  } finally {
    if (loadingEl) loadingEl.style.display = "none";
  }
}

// --- Thumbnail rendering ---
const thumbRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
thumbRenderer.setSize(400, 400);
thumbRenderer.setPixelRatio(1);
thumbRenderer.setClearColor(0x1a1a2e);
const thumbScene = new THREE.Scene();
const thumbCam = new THREE.PerspectiveCamera(45, 1, 0.01, 10000);
thumbScene.add(new THREE.AmbientLight(0xffffff, 0.5));
const tl = new THREE.DirectionalLight(0xffffff, 0.8);
tl.position.set(1, 2, 1.5);
thumbScene.add(tl);
const tl2 = new THREE.DirectionalLight(0xffffff, 0.3);
tl2.position.set(-1, -0.5, -1);
thumbScene.add(tl2);

async function renderThumbnail(file) {
  if (thumbnailCache.has(file)) return thumbnailCache.get(file);

  try {
    const resp = await fetch(`/steps/${file}`);
    if (!resp.ok) return null;
    const buf = new Uint8Array(await resp.arrayBuffer());
    const result = await parseStep(buf);
    const group = buildMesh(result);
    thumbScene.add(group);

    const box = new THREE.Box3().setFromObject(group);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim * 2.5;
    const el = Math.atan(1 / Math.sqrt(2));
    const az = Math.PI / 4;
    thumbCam.position.set(
      center.x + dist * Math.cos(el) * Math.cos(az),
      center.y + dist * Math.sin(el),
      center.z + dist * Math.cos(el) * Math.sin(az)
    );
    thumbCam.lookAt(center);

    thumbRenderer.render(thumbScene, thumbCam);
    const dataURL = thumbRenderer.domElement.toDataURL();

    thumbScene.remove(group);
    group.traverse((c) => { if (c.geometry) c.geometry.dispose(); });

    thumbnailCache.set(file, dataURL);
    return dataURL;
  } catch {
    return null;
  }
}

// --- DXF parsing + meshing ---
//
// DXF is a text format of repeating (group code, value) line pairs. We
// only handle the entity types that appear in this project's CAM-exported
// sheet-metal files: LINE, CIRCLE, ARC, LWPOLYLINE. Bigger DXFs (3DSOLID,
// SPLINE, INSERT/blocks, HATCH, TEXT) would need a real library; if a
// future part needs them, swap this for npm dxf-parser. For now the inline
// parser is ~80 lines and avoids a CDN/bundler dependency.
//
// Files lay flat on the world XY plane at Z=0. The shared scene + camera
// + OrbitControls + ViewCube already work for that — orbiting around a
// flat plate is the same UX Fusion 360 / Onshape give you when you import
// a 2D DXF onto a sketch plane. (Thickness extrusion is a future polish:
// if the user wants extruded plates, walk closed loops + ExtrudeGeometry.)
// $INSUNITS group code 70 in the HEADER section. Files in this project
// come from CadQuery (mm, INSUNITS=4) and SendCutSend (often INSUNITS=1
// inches), so we normalize to mm before handing to the viewer.
const DXF_UNIT_TO_MM = {
  0: 1,        // unitless — treat as mm
  1: 25.4,     // inches
  2: 304.8,    // feet
  4: 1,        // mm
  5: 10,       // cm
  6: 1000,     // meters
};

function parseDxf(text) {
  const lines = text.split(/\r?\n/);
  // Group codes come in pairs: [code, value], one per line each. Code
  // lines have leading whitespace ("  0", " 10"); values can be anything.
  const pairs = [];
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const code = parseInt(lines[i].trim(), 10);
    if (Number.isNaN(code)) continue;
    pairs.push({ code, value: lines[i + 1] });
  }

  const entities = [];
  let insUnits = 0;
  let pendingHeaderVar = null;
  let inHeader = false;
  let inEntities = false;
  let cur = null;
  for (let i = 0; i < pairs.length; i++) {
    const { code, value } = pairs[i];
    const v = value.trim();

    if (code === 0 && v === "SECTION") {
      const next = pairs[i + 1];
      if (next && next.code === 2) {
        const sec = next.value.trim();
        inHeader = sec === "HEADER";
        inEntities = sec === "ENTITIES";
      }
      continue;
    }
    if (code === 0 && v === "ENDSEC") {
      if (inEntities && cur) { entities.push(cur); cur = null; }
      inHeader = false;
      inEntities = false;
      continue;
    }

    if (inHeader) {
      if (code === 9) pendingHeaderVar = v;
      else if (pendingHeaderVar === "$INSUNITS" && code === 70) {
        insUnits = parseInt(v, 10) || 0;
        pendingHeaderVar = null;
      }
      continue;
    }

    if (!inEntities) continue;

    if (code === 0) {
      if (cur) entities.push(cur);
      cur = null;
      if (v === "LINE" || v === "CIRCLE" || v === "ARC") {
        cur = { type: v };
      } else if (v === "LWPOLYLINE") {
        cur = { type: v, vertices: [], flags: 0 };
      }
      continue;
    }
    if (!cur) continue;

    const num = parseFloat(v);
    if (cur.type === "LWPOLYLINE") {
      // For LWPOLYLINE, codes 10/20 repeat per vertex (no Z).
      if (code === 10) cur.vertices.push({ x: num, y: 0 });
      else if (code === 20) {
        const last = cur.vertices[cur.vertices.length - 1];
        if (last) last.y = num;
      } else if (code === 70) cur.flags = num;
      continue;
    }
    if (code === 10) cur.x = num;
    else if (code === 20) cur.y = num;
    else if (code === 11) cur.x2 = num;
    else if (code === 21) cur.y2 = num;
    else if (code === 40) cur.r = num;
    else if (code === 50) cur.startAngle = num;
    else if (code === 51) cur.endAngle = num;
  }
  if (cur) entities.push(cur);

  // Normalize coordinates to mm so the rest of the viewer (and the
  // sidecar's thickness_mm) all share one unit. SendCutSend exports come
  // in inches (INSUNITS=1); CadQuery generators write mm (INSUNITS=4).
  const scale = DXF_UNIT_TO_MM[insUnits] ?? 1;
  if (scale !== 1) {
    for (const e of entities) {
      if ("x" in e) e.x *= scale;
      if ("y" in e) e.y *= scale;
      if ("x2" in e) e.x2 *= scale;
      if ("y2" in e) e.y2 *= scale;
      if ("r" in e) e.r *= scale;
      if (e.vertices) for (const v of e.vertices) { v.x *= scale; v.y *= scale; }
    }
  }

  return { entities, units: insUnits, scale };
}

const DXF_ARC_SEGS = 96;
const DXF_CHAIN_TOL = 0.005; // mm — endpoint-match tolerance for chaining LINE+ARC into closed loops

function entityEndpoints(e) {
  if (e.type === "LINE") {
    return [{ x: e.x, y: e.y }, { x: e.x2, y: e.y2 }];
  }
  if (e.type === "ARC") {
    const startA = (e.startAngle ?? 0) * Math.PI / 180;
    let endA = (e.endAngle ?? 360) * Math.PI / 180;
    while (endA <= startA) endA += Math.PI * 2;
    return [
      { x: e.x + e.r * Math.cos(startA), y: e.y + e.r * Math.sin(startA) },
      { x: e.x + e.r * Math.cos(endA),   y: e.y + e.r * Math.sin(endA) },
    ];
  }
  if (e.type === "LWPOLYLINE" && (e.flags & 1) !== 1 && e.vertices.length > 0) {
    const v = e.vertices;
    return [{ x: v[0].x, y: v[0].y }, { x: v[v.length - 1].x, y: v[v.length - 1].y }];
  }
  return null;
}

function ptKey(x, y) {
  return Math.round(x / DXF_CHAIN_TOL) + "," + Math.round(y / DXF_CHAIN_TOL);
}
function ptsEqual(a, b) {
  return Math.abs(a.x - b.x) < DXF_CHAIN_TOL && Math.abs(a.y - b.y) < DXF_CHAIN_TOL;
}

// Tessellate one chained entity into points, given which endpoint we
// entered from. Pushed onto `pts` (excluding the entry point itself —
// that was already pushed by the previous step or the loop-start).
function appendEntityPoints(pts, e, enteredAt) {
  if (e.type === "LINE") {
    const eps = entityEndpoints(e);
    pts.push(ptsEqual(eps[0], enteredAt) ? eps[1] : eps[0]);
    return;
  }
  if (e.type === "ARC") {
    const cx = e.x, cy = e.y, r = e.r;
    const startA = (e.startAngle ?? 0) * Math.PI / 180;
    let endA = (e.endAngle ?? 360) * Math.PI / 180;
    while (endA <= startA) endA += Math.PI * 2;
    const eps = entityEndpoints(e);
    const forward = ptsEqual(eps[0], enteredAt);
    const span = endA - startA;
    const segs = Math.max(8, Math.ceil((span / (Math.PI * 2)) * DXF_ARC_SEGS));
    for (let i = 1; i <= segs; i++) {
      const t = i / segs;
      const a = forward ? (startA + span * t) : (endA - span * t);
      pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
    }
    return;
  }
  if (e.type === "LWPOLYLINE") {
    const eps = entityEndpoints(e);
    const forward = ptsEqual(eps[0], enteredAt);
    const verts = forward ? e.vertices.slice(1) : e.vertices.slice(0, -1).reverse();
    for (const v of verts) pts.push({ x: v.x, y: v.y });
    return;
  }
}

// Walk LINE / ARC / open-LWPOLYLINE entities and find closed loops by
// matching endpoints (within DXF_CHAIN_TOL). Each loop comes back as an
// ordered array of {x,y} points around its perimeter — ready to feed
// into THREE.Shape / THREE.Path.
function findClosedChains(openEntities) {
  if (openEntities.length === 0) return [];
  for (let i = 0; i < openEntities.length; i++) openEntities[i]._id = i;

  const adjacency = new Map(); // ptKey -> [{entity, endpointIdx}]
  for (const e of openEntities) {
    const eps = entityEndpoints(e);
    if (!eps) continue;
    for (let i = 0; i < 2; i++) {
      const k = ptKey(eps[i].x, eps[i].y);
      if (!adjacency.has(k)) adjacency.set(k, []);
      adjacency.get(k).push({ entity: e, endpointIdx: i });
    }
  }

  const used = new Set();
  const loops = [];
  for (const startEntity of openEntities) {
    if (used.has(startEntity._id)) continue;
    const startEps = entityEndpoints(startEntity);
    if (!startEps) { used.add(startEntity._id); continue; }

    const points = [{ x: startEps[0].x, y: startEps[0].y }];
    appendEntityPoints(points, startEntity, startEps[0]);
    used.add(startEntity._id);

    let currentEnd = startEps[1];
    let safety = openEntities.length + 1;
    let closed = false;
    while (safety-- > 0) {
      if (ptsEqual(currentEnd, startEps[0])) { closed = true; break; }
      const k = ptKey(currentEnd.x, currentEnd.y);
      const candidates = (adjacency.get(k) || []).filter((c) => !used.has(c.entity._id));
      if (candidates.length === 0) break; // dead end → not a closed loop
      const next = candidates[0];
      used.add(next.entity._id);
      const nextEps = entityEndpoints(next.entity);
      const enteredAt = nextEps[next.endpointIdx];
      const exitAt = next.endpointIdx === 0 ? nextEps[1] : nextEps[0];
      appendEntityPoints(points, next.entity, enteredAt);
      currentEnd = exitAt;
    }
    if (closed) {
      // Drop the trailing duplicate of the start point if the last appended point matches.
      if (points.length > 1 && ptsEqual(points[points.length - 1], points[0])) points.pop();
      loops.push(points);
    }
  }
  return loops;
}

function pointsFromCircle(e) {
  const pts = [];
  const cx = e.x, cy = e.y, r = e.r;
  for (let i = 0; i < DXF_ARC_SEGS; i++) {
    const a = (i / DXF_ARC_SEGS) * Math.PI * 2;
    pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
  }
  return pts;
}

function signedArea(pts) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    a += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
  }
  return a / 2;
}
function pointsArea(pts) { return Math.abs(signedArea(pts)); }
function ensureWinding(pts, wantCCW) {
  return (signedArea(pts) > 0) === wantCCW ? pts : pts.slice().reverse();
}

// Wireframe fallback — LINE / CIRCLE / ARC / LWPOLYLINE rendered as
// LineSegments at Z=0. Used when there's no thickness sidecar (or no
// closed loops to extrude).
function buildDxfWireframe(parsed) {
  const positions = [];
  const pushSeg = (x1, y1, x2, y2) => positions.push(x1, y1, 0, x2, y2, 0);
  for (const e of parsed.entities) {
    if (e.type === "LINE") {
      pushSeg(e.x ?? 0, e.y ?? 0, e.x2 ?? 0, e.y2 ?? 0);
    } else if (e.type === "CIRCLE") {
      const cx = e.x ?? 0, cy = e.y ?? 0, r = e.r ?? 0;
      let prev = null;
      for (let i = 0; i <= DXF_ARC_SEGS; i++) {
        const a = (i / DXF_ARC_SEGS) * Math.PI * 2;
        const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
        if (prev) pushSeg(prev.x, prev.y, x, y);
        prev = { x, y };
      }
    } else if (e.type === "ARC") {
      const cx = e.x ?? 0, cy = e.y ?? 0, r = e.r ?? 0;
      const start = (e.startAngle ?? 0) * Math.PI / 180;
      let end = (e.endAngle ?? 360) * Math.PI / 180;
      while (end <= start) end += Math.PI * 2;
      const span = end - start;
      const segs = Math.max(8, Math.ceil((span / (Math.PI * 2)) * DXF_ARC_SEGS));
      let prev = null;
      for (let i = 0; i <= segs; i++) {
        const a = start + span * (i / segs);
        const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
        if (prev) pushSeg(prev.x, prev.y, x, y);
        prev = { x, y };
      }
    } else if (e.type === "LWPOLYLINE") {
      const verts = e.vertices;
      for (let i = 0; i < verts.length - 1; i++) {
        pushSeg(verts[i].x, verts[i].y, verts[i + 1].x, verts[i + 1].y);
      }
      if ((e.flags & 1) === 1 && verts.length > 1) {
        const a = verts[verts.length - 1], b = verts[0];
        pushSeg(a.x, a.y, b.x, b.y);
      }
    }
  }
  const group = new THREE.Group();
  if (positions.length === 0) return group;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(positions), 3));
  group.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0x88ccff })));
  return group;
}

// Extruded DXF: collect closed loops (CIRCLE, closed LWPOLYLINE, plus
// LINE+ARC chains that close), pick the largest as outer, the rest as
// holes, build THREE.Shape, extrude by thickness_mm. Falls back to
// wireframe if there's no thickness or no closed loops.
function buildDxfMesh(parsed, thicknessMm) {
  const closedLoops = []; // array of point arrays
  const openEntities = [];
  for (const e of parsed.entities) {
    if (e.type === "CIRCLE") {
      closedLoops.push(pointsFromCircle(e));
    } else if (e.type === "LWPOLYLINE" && (e.flags & 1) === 1) {
      closedLoops.push(e.vertices.map((v) => ({ x: v.x, y: v.y })));
    } else if (e.type === "LINE" || e.type === "ARC" || e.type === "LWPOLYLINE") {
      openEntities.push(e);
    }
  }
  for (const loop of findClosedChains(openEntities)) closedLoops.push(loop);

  if (!thicknessMm || closedLoops.length === 0) return buildDxfWireframe(parsed);

  // Largest = outer, rest = holes. THREE.Shape wants outer CCW, holes CW.
  closedLoops.sort((a, b) => pointsArea(b) - pointsArea(a));
  const outerPts = ensureWinding(closedLoops[0], true);
  const holesPts = closedLoops.slice(1).map((p) => ensureWinding(p, false));

  const shape = new THREE.Shape(outerPts.map((p) => new THREE.Vector2(p.x, p.y)));
  for (const hole of holesPts) {
    shape.holes.push(new THREE.Path(hole.map((p) => new THREE.Vector2(p.x, p.y))));
  }

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thicknessMm,
    bevelEnabled: false,
    curveSegments: 64,
  });
  geo.computeVertexNormals();

  // Steel-blue plate — matched to STEP's neutral metal look so prints
  // and cuts read as part of the same family in the viewer.
  const mat = new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.2, roughness: 0.55 });
  const mesh = new THREE.Mesh(geo, mat);

  // Edge wireframe at 30° threshold — picks out the perimeter top/bottom
  // and any sharp corners without showing the triangulation of curves.
  const edges = new THREE.EdgesGeometry(geo, 30);
  const edgeLines = new THREE.LineSegments(
    edges,
    new THREE.LineBasicMaterial({ color: 0xaaccff, transparent: true, opacity: 0.7 }),
  );

  const group = new THREE.Group();
  group.add(mesh);
  group.add(edgeLines);
  return group;
}

async function loadDxfFile(file, { preserveCamera = false } = {}) {
  const loadingEl = currentCadWrapper && currentCadWrapper.querySelector(".cad-loading");
  if (loadingEl) loadingEl.style.display = "block";

  try {
    const headers = {};
    const prevEtag = dxfEtags.get(file);
    if (mountedDxfFile === file && prevEtag) {
      headers["If-None-Match"] = prevEtag;
    }
    const resp = await fetch(`/dxfs/${file}`, { headers });
    if (resp.status === 304) return;
    if (!resp.ok) return;
    const etag = resp.headers.get("etag");
    if (etag) dxfEtags.set(file, etag);

    const text = await resp.text();
    const parsed = parseDxf(text);

    if (currentGroup) {
      scene.remove(currentGroup);
      currentGroup.traverse((c) => { if (c.geometry) c.geometry.dispose(); });
    }

    const meta = dxfMeta.get(file) || {};
    const thickness = typeof meta.thickness_mm === "number" ? meta.thickness_mm : null;
    currentGroup = buildDxfMesh(parsed, thickness);
    scene.add(currentGroup);
    mountedDxfFile = file;
    mountedStepFile = null;
    if (!preserveCamera) resetDxfCamera(currentGroup, !!thickness);
  } finally {
    if (loadingEl) loadingEl.style.display = "none";
  }
}

// DXF lives on the world XY plane (extrudes upward in +Z when there's a
// thickness). For extruded plates we land on a 3/4 isometric so the
// thickness is visible from the moment the modal opens — that's the
// whole point of the sidecar. For wireframe-only (no sidecar) we fall
// back to top-down since there's nothing to see edge-on. Distance is
// aspect-aware so a wide plate doesn't clip in a narrow phone viewport.
function resetDxfCamera(group, hasThickness) {
  resizeRenderer(); // make sure camera.aspect reflects the wrapper

  const box = new THREE.Box3().setFromObject(group);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const sx = Math.max(size.x, 1);
  const sy = Math.max(size.y, 1);
  const sz = Math.max(size.z, 0);
  const fovRad = camera.fov * Math.PI / 180;
  const aspect = camera.aspect || 1;
  // Project the bounding box onto the camera plane for whichever view
  // we're picking, then size the distance so it fits in BOTH dimensions.
  const distFor = (hView, vView) => {
    const distH = vView / (2 * Math.tan(fovRad / 2));
    const distW = hView / (aspect * 2 * Math.tan(fovRad / 2));
    return Math.max(distH, distW);
  };

  if (hasThickness) {
    // Isometric — camera offset by (1,1,1) normalized from the bbox
    // center. `center` is already the middle of the extruded volume
    // (i.e. z = thickness/2), so no extra Z bias is needed.
    const planar = Math.max(sx, sy);
    const dist = distFor(planar, planar * 0.85 + sz) * 1.2;
    const off = dist / Math.sqrt(3);
    camera.position.set(center.x + off, center.y + off, center.z + off);
    camera.up.set(0, 0, 1);
    camera.lookAt(center);
    controls.target.copy(center);
  } else {
    // Top-down for the un-sidecar'd wireframe case.
    const dist = distFor(sx, sy) * 1.15;
    camera.position.set(center.x, center.y, center.z + dist);
    camera.up.set(0, 1, 0);
    camera.lookAt(center);
    controls.target.copy(center);
  }
  controls.update();
}

async function renderDxfThumbnail(file) {
  if (dxfThumbCache.has(file)) return dxfThumbCache.get(file);

  try {
    const resp = await fetch(`/dxfs/${file}`);
    if (!resp.ok) return null;
    const text = await resp.text();
    const parsed = parseDxf(text);
    const meta = dxfMeta.get(file) || {};
    const thickness = typeof meta.thickness_mm === "number" ? meta.thickness_mm : null;
    const group = buildDxfMesh(parsed, thickness);
    thumbScene.add(group);

    const box = new THREE.Box3().setFromObject(group);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxPlanar = Math.max(size.x, size.y, 1);
    if (thickness) {
      // Same iso framing as the detail view, so thumbs and the modal
      // open look like the same part.
      const dist = maxPlanar * 1.6;
      const off = dist / Math.sqrt(3);
      thumbCam.position.set(center.x + off, center.y + off, center.z + off + size.z);
      thumbCam.up.set(0, 0, 1);
      thumbCam.lookAt(center.x, center.y, center.z + size.z / 2);
    } else {
      // Wireframe → top-down, edge-on iso would show nothing.
      thumbCam.position.set(center.x, center.y, center.z + maxPlanar * 1.4);
      thumbCam.up.set(0, 1, 0);
      thumbCam.lookAt(center);
    }

    thumbRenderer.render(thumbScene, thumbCam);
    const dataURL = thumbRenderer.domElement.toDataURL();

    thumbScene.remove(group);
    group.traverse((c) => { if (c.geometry) c.geometry.dispose(); });

    dxfThumbCache.set(file, dataURL);
    return dataURL;
  } catch {
    return null;
  }
}

// --- Mermaid detail view ---
// The detail opens inside ContentViewer; PanZoom drives pan/zoom; we persist
// {scale,panX,panY} per-file in localStorage and restore on reopen. The
// wrapper / SVG host stays mounted so SSE re-renders can swap the SVG
// without recreating PanZoom (preserves the user's pan/zoom).
let mmdRenderCounter = 0;
let currentMmdWrapper = null; // host div inside the modal (PanZoom container)
let currentMmdPz = null;      // PanZoom handle for currentMmdWrapper

function mmdTransformKey(file) { return `mmd-transform:${file}`; }

function mmdSaveTransform(file, t) {
  try { localStorage.setItem(mmdTransformKey(file), JSON.stringify(t)); } catch {}
}
function mmdLoadTransform(file) {
  try {
    const raw = localStorage.getItem(mmdTransformKey(file));
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (typeof s.scale !== "number") return null;
    return s;
  } catch { return null; }
}

// Render `content` to an SVG element with explicit width/height (so PanZoom
// can measure natural size). Returns the SVGSVGElement, or throws.
async function mmdRenderSvg(content) {
  const id = `mmd-detail-${++mmdRenderCounter}`;
  const { svg } = await mermaid.render(id, content);
  const tmp = document.createElement("div");
  tmp.innerHTML = svg;
  const svgEl = tmp.querySelector("svg");
  if (!svgEl) throw new Error("mermaid produced no <svg>");
  // Mermaid sets width="100%"; lock to natural viewBox dims so PanZoom can
  // fit-to-container correctly.
  const vb = svgEl.viewBox?.baseVal;
  if (vb && vb.width && vb.height) {
    svgEl.setAttribute("width", vb.width);
    svgEl.setAttribute("height", vb.height);
  }
  svgEl.style.display = "block";
  svgEl.style.maxWidth = "none";
  svgEl.style.maxHeight = "none";
  return svgEl;
}

// Replace the SVG inside the open modal's wrapper without touching PanZoom.
// Used by the SSE re-render path so the user's pan/zoom is preserved.
async function reRenderOpenMmd(content) {
  if (!currentMmdWrapper || !currentMmdPz) return;
  let svgEl;
  try {
    svgEl = await mmdRenderSvg(content);
  } catch (err) {
    currentMmdWrapper.innerHTML = `<pre style="color:#c44;padding:20px;font-size:13px;">${err.message || err}</pre>`;
    return;
  }
  // Clear the wrapper but keep PanZoom listeners (they're on the wrapper, not
  // the SVG). Re-wrap the new SVG against the same wrapper, then restore the
  // previous transform so the swap is invisible.
  const prev = currentMmdPz.getTransform();
  currentMmdPz.destroy();
  currentMmdWrapper.innerHTML = "";
  currentMmdWrapper.appendChild(svgEl);
  currentMmdPz = PanZoom.wrap(svgEl, {
    container: currentMmdWrapper,
    initialFit: false,
    onTransformChange: (t) => mmdSaveTransform(currentMmd, t),
  });
  currentMmdPz.setTransform(prev);
}

// --- Mermaid thumbnail rendering ---
async function renderMmdThumbnail(file) {
  if (mmdThumbCache.has(file)) return mmdThumbCache.get(file);
  try {
    const resp = await fetch(`/api/mermaid-content/${file}`);
    if (!resp.ok) return null;
    const content = await resp.text();
    const id = `mmd-thumb-${file.replace(/[^a-zA-Z0-9]/g, "-")}`;
    const { svg } = await mermaid.render(id, content);
    mmdThumbCache.set(file, svg);
    return svg;
  } catch { return null; }
}

// --- Grid ---
const gridEl = document.getElementById("grid");

function shortName(file, ext = ".step") {
  const parts = file.split("/");
  const name = parts.pop().replace(ext, "");
  const dir = parts.join("/");
  return { name, dir };
}

// One viewer page area at a time. The path determines which section the
// grid renders.
function currentSection() {
  const tail = location.pathname.replace(/\/$/, "");
  if (tail === "/charts") return "charts";
  return "parts";
}

function setupNav() {
  // The shell already renders the nav with absolute hrefs (/3d, /charts);
  // this just sets the active class for client-side navigation cases.
  const section = currentSection();
  for (const a of document.querySelectorAll("#site-nav a[data-nav]")) {
    a.classList.toggle("active", a.dataset.nav === section);
  }

  const titleMap = {
    parts: "Parts · Home Soda Machine",
    charts: "Charts · Home Soda Machine",
  };
  document.title = titleMap[section] || document.title;
}

function buildGrid() {
  gridEl.innerHTML = "";
  const section = currentSection();

  if (section === "parts") {
    // Two subsections: Prints (STEP, 3D-printable) then Cuts (DXF, laser-
    // cut sheet). Headers always render so the structure is explicit even
    // when a subsection is empty; the empty-state replaces the would-be
    // card grid for that subsection.
    const printsHeader = document.createElement("div");
    printsHeader.className = "section-header";
    printsHeader.textContent = "Prints";
    gridEl.appendChild(printsHeader);
    if (allFiles.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No prints yet.";
      gridEl.appendChild(empty);
    }
    for (const file of allFiles) {
      const { name, dir } = shortName(file, ".step");
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.file = file;
      card.dataset.type = "step";
      card.innerHTML = `<div class="placeholder" data-file="${file}">loading...</div><div class="label"><span class="dir">${dir}</span>${name}</div>`;
      card.addEventListener("click", () => openDetail(file));
      gridEl.appendChild(card);
    }

    const cutsHeader = document.createElement("div");
    cutsHeader.className = "section-header";
    cutsHeader.textContent = "Cuts";
    gridEl.appendChild(cutsHeader);
    if (dxfFiles.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No cuts yet.";
      gridEl.appendChild(empty);
    }
    for (const file of dxfFiles) {
      const { name, dir } = shortName(file, ".dxf");
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.file = file;
      card.dataset.type = "dxf";
      card.innerHTML = `<div class="placeholder" data-file="${file}">loading...</div><div class="label"><span class="dir">${dir}</span>${name}</div>`;
      card.addEventListener("click", () => openDxfDetail(file));
      gridEl.appendChild(card);
    }
  }

  if (section === "charts") {
    if (mmdFiles.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No charts yet.";
      gridEl.appendChild(empty);
    }
    for (const file of mmdFiles) {
      const { name, dir } = shortName(file, ".mmd");
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.file = file;
      card.dataset.type = "mmd";
      card.innerHTML = `<div class="mmd-thumb" data-file="${file}"><div class="placeholder">loading...</div></div><div class="label"><span class="dir">${dir}</span>${name}</div>`;
      card.addEventListener("click", () => openMmdDetail(file));
      gridEl.appendChild(card);
    }
  }

  // Lazy-load STEP thumbnails
  const stepObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      stepObserver.unobserve(entry.target);
      const file = entry.target.dataset.file;
      renderThumbnail(file).then((url) => {
        if (!url) {
          entry.target.querySelector(".placeholder").textContent = "error";
          return;
        }
        const img = document.createElement("img");
        img.src = url;
        const placeholder = entry.target.querySelector(".placeholder");
        if (placeholder) placeholder.replaceWith(img);
      });
    }
  }, { rootMargin: "200px" });

  for (const card of gridEl.querySelectorAll('.card[data-type="step"]')) {
    stepObserver.observe(card);
  }

  // Lazy-load DXF thumbnails (top-down render of the line geometry).
  const dxfObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      dxfObserver.unobserve(entry.target);
      const file = entry.target.dataset.file;
      renderDxfThumbnail(file).then((url) => {
        if (!url) {
          entry.target.querySelector(".placeholder").textContent = "error";
          return;
        }
        const img = document.createElement("img");
        img.src = url;
        const placeholder = entry.target.querySelector(".placeholder");
        if (placeholder) placeholder.replaceWith(img);
      });
    }
  }, { rootMargin: "200px" });

  for (const card of gridEl.querySelectorAll('.card[data-type="dxf"]')) {
    dxfObserver.observe(card);
  }

  // Lazy-load Mermaid thumbnails
  const mmdObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      mmdObserver.unobserve(entry.target);
      const file = entry.target.dataset.file;
      renderMmdThumbnail(file).then((svg) => {
        const thumbEl = entry.target.querySelector(".mmd-thumb");
        if (!thumbEl) return;
        if (!svg) { thumbEl.innerHTML = `<div class="placeholder">error</div>`; return; }
        thumbEl.innerHTML = svg;
      });
    }
  }, { rootMargin: "200px" });

  for (const card of gridEl.querySelectorAll('.card[data-type="mmd"]')) {
    mmdObserver.observe(card);
  }
}

// open/close functions take a `pushHistory` flag. UI-driven calls push;
// popstate-driven calls don't (the URL already changed).
function openDetail(file, pushHistory = true) {
  // Set currentFile BEFORE touching location.hash. In Puppeteer (and some
  // browser configurations) setting location.hash can fire a popstate that
  // runs synchronously before this function returns; the popstate handler
  // dispatches on currentFile, so it must already reflect this open or it
  // re-enters openDetail and we end up with a duplicate ContentViewer.
  currentFile = file;
  if (pushHistory) location.hash = "step:" + encodeURIComponent(file);

  // Build the modal wrapper. Renderer canvas + gizmo canvas get moved out
  // of the hidden host into here; on close they go back. The wrapper also
  // hosts a centered loading pill that loadStepFile toggles.
  const wrapper = document.createElement("div");
  wrapper.className = "cad-wrapper";
  wrapper.appendChild(renderer.domElement);
  wrapper.appendChild(gizmoCanvas);
  const loadingEl = document.createElement("div");
  loadingEl.className = "cad-loading";
  loadingEl.textContent = "Loading...";
  wrapper.appendChild(loadingEl);

  currentCadWrapper = wrapper;

  // Re-fit the renderer whenever the wrapper's content box changes
  // (modal show, window resize, orientation change). The first observation
  // fires synchronously after observe(), which gives us a correct initial
  // size as soon as the modal lays out.
  currentCadResizeObserver = new ResizeObserver(() => {
    if (renderer.domElement.parentElement === wrapper) resizeRenderer();
  });
  currentCadResizeObserver.observe(wrapper);

  ContentViewer.open({
    content: wrapper,
    filename: shortName(file, ".step").name,
    onOpen: () => {
      // Wrapper has its real size now — size the renderer + start the loop.
      resizeRenderer();
      startAnimate();
    },
    onClose: () => {
      // Persist camera state defensively. The debounced save (controls
      // "change" handler) usually has already fired, but if the user
      // dismissed mid-gesture the trailing save may not have. Use the
      // captured `file` rather than currentFile — closeDetail(false)
      // clears currentFile before invoking us, so we'd otherwise miss
      // the save on popstate-driven closes.
      saveCameraState(file);
      // Whether this onClose was triggered by a UI-driven dismissal
      // (Escape / X / backdrop / swipe) or by closeDetail(false) from the
      // popstate path. The popstate path clears currentFile before close
      // fires; UI-driven closes leave currentFile set.
      const wasUiDriven = currentFile === file;
      stopAnimate();
      // Disconnect ResizeObserver before moving canvases (otherwise it
      // fires once more for the move into the hidden host).
      if (currentCadResizeObserver) {
        try { currentCadResizeObserver.disconnect(); } catch {}
        currentCadResizeObserver = null;
      }
      // Move canvases back to the hidden host so they stay mounted for
      // the next open. Don't dispose anything Three.js — renderer/scene/
      // controls are reused.
      try { canvasHost.appendChild(renderer.domElement); } catch {}
      try { canvasHost.appendChild(gizmoCanvas); } catch {}
      // Drop the loaded mesh — fresh load on next open.
      if (currentGroup) {
        scene.remove(currentGroup);
        currentGroup.traverse((c) => { if (c.geometry) c.geometry.dispose(); });
        currentGroup = null;
      }
      currentCadWrapper = null;
      currentFile = null;
      mountedStepFile = null;
      // Pop the hash if the user dismissed the modal directly. popstate
      // already moved the URL, so don't double-pop.
      if (wasUiDriven && location.hash) history.back();
    },
  });

  loadStepFile(file).then(() => applyCameraState(file));
}

// closeDetail is the entry point for the popstate path; UI-driven closes
// (Escape / X / backdrop / swipe) go through ContentViewer directly and run
// the modal's onClose. All teardown lives there.
function closeDetail(pushHistory = true) {
  if (!ContentViewer.isOpen()) {
    // Already closed by the user — normalize state.
    currentFile = null;
    mountedStepFile = null;
    return;
  }
  // pushHistory=false comes from popstate (the URL already changed). Clear
  // currentFile first so the onClose handler sees it as null and skips the
  // history.back() that would double-pop the stack.
  if (!pushHistory) {
    currentFile = null;
  }
  ContentViewer.close();
}

// DXF detail open/close. Mirrors openDetail/closeDetail above; same
// renderer + camera + gizmo, different geometry producer (loadDxfFile).
function openDxfDetail(file, pushHistory = true) {
  currentDxf = file;
  if (pushHistory) location.hash = "dxf:" + encodeURIComponent(file);

  const wrapper = document.createElement("div");
  wrapper.className = "cad-wrapper";
  wrapper.appendChild(renderer.domElement);
  wrapper.appendChild(gizmoCanvas);
  const loadingEl = document.createElement("div");
  loadingEl.className = "cad-loading";
  loadingEl.textContent = "Loading...";
  wrapper.appendChild(loadingEl);

  currentCadWrapper = wrapper;

  currentCadResizeObserver = new ResizeObserver(() => {
    if (renderer.domElement.parentElement === wrapper) resizeRenderer();
  });
  currentCadResizeObserver.observe(wrapper);

  ContentViewer.open({
    content: wrapper,
    filename: shortName(file, ".dxf").name,
    onOpen: () => {
      resizeRenderer();
      startAnimate();
    },
    onClose: () => {
      saveCameraState(file);
      const wasUiDriven = currentDxf === file;
      stopAnimate();
      if (currentCadResizeObserver) {
        try { currentCadResizeObserver.disconnect(); } catch {}
        currentCadResizeObserver = null;
      }
      try { canvasHost.appendChild(renderer.domElement); } catch {}
      try { canvasHost.appendChild(gizmoCanvas); } catch {}
      if (currentGroup) {
        scene.remove(currentGroup);
        currentGroup.traverse((c) => { if (c.geometry) c.geometry.dispose(); });
        currentGroup = null;
      }
      currentCadWrapper = null;
      currentDxf = null;
      mountedDxfFile = null;
      if (wasUiDriven && location.hash) history.back();
    },
  });

  loadDxfFile(file).then(() => applyCameraState(file));
}

function closeDxfDetail(pushHistory = true) {
  if (!ContentViewer.isOpen()) {
    currentDxf = null;
    mountedDxfFile = null;
    return;
  }
  if (!pushHistory) {
    currentDxf = null;
  }
  ContentViewer.close();
}

async function openMmdDetail(file, pushHistory = true) {
  // Set currentMmd BEFORE touching location.hash. In some browser
  // configurations (notably Puppeteer) setting location.hash fires a
  // popstate that runs synchronously before this function returns; the
  // popstate handler dispatches on currentMmd, so it must already reflect
  // this open or it re-enters openMmdDetail and we end up with a duplicate
  // ContentViewer (whose singleton-replacement strips the hash).
  currentMmd = file;
  if (pushHistory) location.hash = "mmd:" + encodeURIComponent(file);

  const resp = await fetch(`/api/mermaid-content/${file}`);
  if (!resp.ok) return;
  const content = await resp.text();

  let svgEl;
  try {
    svgEl = await mmdRenderSvg(content);
  } catch (err) {
    // Render the error inside the modal too so the user sees something.
    const errWrapper = document.createElement("div");
    errWrapper.style.cssText = "overflow:hidden;position:relative;width:100%;height:100%;";
    errWrapper.innerHTML = `<pre style="color:#c44;padding:20px;font-size:13px;white-space:pre-wrap;">${err.message || err}</pre>`;
    ContentViewer.open({
      content: errWrapper,
      filename: shortName(file, ".mmd").name,
      onClose: () => {
        currentMmd = null;
        currentMmdContent = null;
        currentMmdWrapper = null;
        currentMmdPz = null;
        if (location.hash) history.back();
      },
    });
    currentMmd = file;
    currentMmdContent = content;
    return;
  }

  const wrapper = document.createElement("div");
  wrapper.style.cssText = "overflow:hidden;position:relative;width:100%;height:100%;";
  wrapper.appendChild(svgEl);

  const pz = PanZoom.wrap(svgEl, {
    container: wrapper,
    initialFit: true,
    onTransformChange: (t) => mmdSaveTransform(file, t),
  });

  currentMmd = file;
  currentMmdContent = content;
  currentMmdWrapper = wrapper;
  currentMmdPz = pz;

  ContentViewer.open({
    content: wrapper,
    filename: shortName(file, ".mmd").name,
    onOpen: () => {
      // Container's real layout box is only known after the dialog has been
      // shown. Re-fit now (PanZoom's initialFit ran before showModal made the
      // wrapper measurable) and then apply any saved transform on top.
      pz.fit();
      const saved = mmdLoadTransform(file);
      if (saved) pz.setTransform(saved);
    },
    onClose: () => {
      try { pz.destroy(); } catch {}
      currentMmd = null;
      currentMmdContent = null;
      currentMmdWrapper = null;
      currentMmdPz = null;
      if (location.hash) history.back();
    },
  });
}

function closeMmdDetail(pushHistory = true) {
  // Closing is driven by ContentViewer (backdrop tap / Escape / X / swipe).
  // The onClose handler above clears state and pops history. This wrapper
  // exists for the popstate path, which calls us with pushHistory=false to
  // dismiss the modal without re-popping (the URL already changed).
  if (!ContentViewer.isOpen()) {
    // Already closed by the user — just normalize state.
    currentMmd = null;
    currentMmdContent = null;
    currentMmdWrapper = null;
    currentMmdPz = null;
    return;
  }
  // Suppress the onClose-driven history.back() so popstate-driven closes
  // don't double-pop the history stack.
  if (!pushHistory) {
    const wrapper = currentMmdWrapper;
    const pz = currentMmdPz;
    currentMmd = null;
    currentMmdContent = null;
    currentMmdWrapper = null;
    currentMmdPz = null;
    try { pz?.destroy(); } catch {}
    ContentViewer.close();
    return;
  }
  ContentViewer.close();
}

// Browser/OS back button: navigate to whatever the new hash represents.
// ContentViewer handles Escape / X / backdrop / swipe-down on its own.
window.addEventListener("popstate", () => {
  const hash = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
  const want = hash.startsWith("step:") ? { type: "step", file: hash.slice(5) }
             : hash.startsWith("dxf:")  ? { type: "dxf",  file: hash.slice(4) }
             : hash.startsWith("mmd:")  ? { type: "mmd",  file: hash.slice(4) }
             : { type: null };
  if (want.type === "step") {
    if (currentDxf) closeDxfDetail(false);
    if (currentMmd) closeMmdDetail(false);
    if (currentFile !== want.file) openDetail(want.file, false);
  } else if (want.type === "dxf") {
    if (currentFile) closeDetail(false);
    if (currentMmd) closeMmdDetail(false);
    if (currentDxf !== want.file) openDxfDetail(want.file, false);
  } else if (want.type === "mmd") {
    if (currentFile) closeDetail(false);
    if (currentDxf) closeDxfDetail(false);
    if (currentMmd !== want.file) openMmdDetail(want.file, false);
  } else {
    if (currentFile) closeDetail(false);
    if (currentDxf) closeDxfDetail(false);
    if (currentMmd) closeMmdDetail(false);
  }
});

// --- Live update bridge ---
//
// SSE connection is owned by HEAD_TAGS (lib/shell.js) — one EventSource
// per page, used for both the toast (page-global) and per-file refresh
// (viewer-only). HEAD_TAGS dispatches:
//
//   hsm:files-changed (detail.files = [...]) — fired by both dev chokidar
//     saves and prod boot-diff. Same wire format both sides.
//   hsm:deploy — fired when the SSE `hello` commit fingerprint changes,
//     meaning a fresh server build is up. Files added or removed in the
//     deploy aren't covered by hsm:files-changed, so we refetch the list.
//
// Per-file work is split by extension so the same handler covers .step,
// .dxf, and .mmd uniformly.

function refreshStepCard(file) {
  thumbnailCache.delete(file);
  const card = gridEl.querySelector(`.card[data-type="step"][data-file="${CSS.escape(file)}"]`);
  if (!card) { fetchFiles(); return; }
  const img = card.querySelector("img");
  if (img) {
    const ph = document.createElement("div");
    ph.className = "placeholder";
    ph.dataset.file = file;
    ph.textContent = "updating...";
    img.replaceWith(ph);
  }
  renderThumbnail(file).then((url) => {
    if (!url) return;
    const target = card.querySelector(".placeholder");
    if (target) {
      const newImg = document.createElement("img");
      newImg.src = url;
      target.replaceWith(newImg);
    } else {
      const existing = card.querySelector("img");
      if (existing) existing.src = url;
    }
  });
}

function refreshDxfCard(file) {
  dxfThumbCache.delete(file);
  const card = gridEl.querySelector(`.card[data-type="dxf"][data-file="${CSS.escape(file)}"]`);
  if (!card) { fetchFiles(); return; }
  const img = card.querySelector("img");
  if (img) {
    const ph = document.createElement("div");
    ph.className = "placeholder";
    ph.dataset.file = file;
    ph.textContent = "updating...";
    img.replaceWith(ph);
  }
  renderDxfThumbnail(file).then((url) => {
    if (!url) return;
    const target = card.querySelector(".placeholder");
    if (target) {
      const newImg = document.createElement("img");
      newImg.src = url;
      target.replaceWith(newImg);
    } else {
      const existing = card.querySelector("img");
      if (existing) existing.src = url;
    }
  });
}

function refreshMmdCard(file) {
  mmdThumbCache.delete(file);
  const card = gridEl.querySelector(`.card[data-type="mmd"][data-file="${CSS.escape(file)}"]`);
  if (!card) { fetchFiles(); return; }
  const thumbEl = card.querySelector(".mmd-thumb");
  if (thumbEl) thumbEl.innerHTML = `<div class="placeholder">updating...</div>`;
  renderMmdThumbnail(file).then((svg) => {
    if (!thumbEl) return;
    thumbEl.innerHTML = svg ? svg : `<div class="placeholder">error</div>`;
  });
}

async function refetchOpenMmd(file) {
  const resp = await fetch(`/api/mermaid-content/${file}`);
  if (!resp.ok) return;
  const content = await resp.text();
  if (content === currentMmdContent) return;
  currentMmdContent = content;
  await reRenderOpenMmd(content);
}

window.addEventListener("hsm:files-changed", (e) => {
  for (const file of (e.detail && e.detail.files) || []) {
    if (file.endsWith(".step")) {
      refreshStepCard(file);
      if (currentFile === file) loadStepFile(file, { preserveCamera: true });
    } else if (file.endsWith(".dxf")) {
      refreshDxfCard(file);
      if (currentDxf === file) loadDxfFile(file, { preserveCamera: true });
    } else if (file.endsWith(".mmd")) {
      refreshMmdCard(file);
      if (currentMmd === file) refetchOpenMmd(file);
    }
  }
});

// On a fresh deploy, the file list itself may have additions/removals
// that per-file `hsm:files-changed` events don't cover (we only diff
// content of files still on disk). Refetch the list to pick those up.
window.addEventListener("hsm:deploy", () => { fetchFiles(); });

// --- Init ---
async function fetchFiles() {
  const [stepResp, mmdResp, dxfResp] = await Promise.all([
    fetch("/api/steps"),
    fetch("/api/mermaid"),
    fetch("/api/dxf"),
  ]);
  allFiles = (await stepResp.json()).sort();
  mmdFiles = (await mmdResp.json()).sort();
  // /api/dxf returns objects with thickness_mm + material from each
  // part's sidecar (hardware/PARTS.md). Cache the metadata so the
  // viewer can extrude on open without a second round-trip.
  const dxfData = await dxfResp.json();
  dxfMeta.clear();
  for (const d of dxfData) dxfMeta.set(d.path, d);
  dxfFiles = dxfData.map((d) => d.path).sort();
  buildGrid();
}

// --- Per-file camera persistence ---
// Saves position/up/target to localStorage on every settled change so
// reopening the file (or following a push notification) restores the same
// view. Keys are namespaced by file path.
function saveCameraState(file) {
  if (!file) return;
  try {
    localStorage.setItem(`step-camera:${file}`, JSON.stringify({
      p: camera.position.toArray(),
      u: camera.up.toArray(),
      t: controls.target.toArray(),
    }));
  } catch {}
}

function applyCameraState(file) {
  try {
    const raw = localStorage.getItem(`step-camera:${file}`);
    if (!raw) return false;
    const s = JSON.parse(raw);
    camera.position.fromArray(s.p);
    camera.up.fromArray(s.u);
    controls.target.fromArray(s.t);
    controls.update();
    return true;
  } catch {
    return false;
  }
}

let cameraSaveTimer = null;
controls.addEventListener("change", () => {
  // Save the camera for whichever file is open. Both STEP and DXF use
  // the same camera, scoped per-file in localStorage.
  const openFile = currentFile || currentDxf;
  if (!openFile) return;
  clearTimeout(cameraSaveTimer);
  cameraSaveTimer = setTimeout(() => saveCameraState(openFile), 250);
});

setupNav();
fetchFiles();

// --- Initial route ---
// Prefer ?file=<step|dxf|mmd> (notification deep link), fall back to hash.
// Extension drives which detail surface opens.
const initialParams = new URLSearchParams(location.search);
const initialFile = initialParams.get("file");
if (initialFile) {
  if (initialFile.endsWith(".mmd")) {
    setTimeout(() => openMmdDetail(initialFile, true), 100);
  } else if (initialFile.endsWith(".dxf")) {
    setTimeout(() => openDxfDetail(initialFile, true), 100);
  } else {
    occtPromise.then(() => setTimeout(() => openDetail(initialFile, true), 100));
  }
} else if (location.hash) {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash.startsWith("step:")) {
    const file = hash.slice(5);
    occtPromise.then(() => setTimeout(() => openDetail(file, false), 100));
  } else if (hash.startsWith("dxf:")) {
    const file = hash.slice(4);
    setTimeout(() => openDxfDetail(file, false), 100);
  } else if (hash.startsWith("mmd:")) {
    const file = hash.slice(4);
    setTimeout(() => openMmdDetail(file, false), 100);
  } else {
    // Legacy hash format (just a step file path)
    occtPromise.then(() => setTimeout(() => openDetail(hash, false), 100));
  }
}
</script>
