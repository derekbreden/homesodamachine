<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap">
<style>
/* One canvas, one lettered viewport per slice, all under one camera; colour is the commanded feed. */
:root {
  --ground: #f3f5fa;
  --paper: #ffffff;
  --ink: #111a33;
  --muted: #56607a;
  --rule: #d6dbe8;
  --accent: #10319c;
  --stage: #10319c;
  --stage-ink: #e8edff;
  --tag: rgba(8, 16, 48, 0.82);
  --face: Montserrat, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --text: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --data: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0a0f1f; --paper: #121a31; --ink: #e6eaf5; --muted: #9aa3bd; --rule: #252e4a;
    --accent: #8aa4ff; --stage: #0c2477; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0a0f1f; --paper: #121a31; --ink: #e6eaf5; --muted: #9aa3bd; --rule: #252e4a;
  --accent: #8aa4ff; --stage: #0c2477; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; padding-inline: 16px; padding-block: 20px 28px; background: var(--ground); color: var(--ink); font: 15px/1.5 var(--text); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font: 600 22px/1.25 var(--face); letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 2px 0 0; color: var(--muted); max-width: 80ch; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; }
.bar button { font: 500 13px/1 var(--text); color: var(--ink); background: var(--paper); border: 1px solid var(--rule);
  border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.stage { position: relative; width: 100%; height: min(70vh, 620px); min-height: 420px; background: var(--stage);
  border-radius: 10px; overflow: hidden; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.cap { position: absolute; color: var(--stage-ink); font: 13px/1.3 var(--text); pointer-events: none; padding: 8px 10px; }
.cap b { font: 600 14px/1.2 var(--face); display: block; }
.tag { position: absolute; font: 600 12px/1.3 var(--text); color: #fff; background: var(--tag); padding: 4px 7px;
  border-radius: 6px; white-space: nowrap; pointer-events: none; transform: translate(-100%, -50%) translateX(-12px); }
.tag small { display: block; font-weight: 500; opacity: 0.85; }
.ramp { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 13px/1.3 var(--text); flex-wrap: wrap; }
.grad { width: min(320px, 70vw); height: 10px; border-radius: 5px; border: 1px solid var(--rule); }
.ticks { display: flex; justify-content: space-between; width: min(320px, 70vw); font: 11px/1 var(--data); color: var(--muted); }
.foot { color: var(--muted); font: 12px/1.5 var(--data); overflow-wrap: anywhere; }
.note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--stage-ink); padding: 24px; text-align: center; }
</style>

<div class="wrap">
  <div>
    <h1>{{TITLE}}</h1>
    <p class="lede">{{LEDE}}</p>
  </div>
  <div class="bar">
    <button type="button" data-view="left">Left</button>
    <button type="button" data-view="front">Front</button>
    <button type="button" data-view="right">Right</button>
    <button type="button" data-view="back">Back</button>
    <button type="button" data-view="iso">Iso</button>
  </div>
  <div class="stage" id="stage"><div class="note" id="note">Loading toolpaths…</div></div>
  <div class="ramp"><span>Commanded speed</span>
    <div><div class="grad" id="grad"></div><div class="ticks" id="ticks"></div></div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script type="application/json" id="speed-data">/*DATA*/</script>
<script>
  setTimeout(function () {
    if (window.__vizBoot) return;
    document.getElementById("note").textContent = "The 3D view could not start here: scripts or cdn.jsdelivr.net are blocked in this viewer.";
    window.__vizReady = true;
  }, 15000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

window.__vizBoot = true;
const data = JSON.parse(document.getElementById("speed-data").textContent);
const bytes = (b64) => { const s = atob(b64), o = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o.buffer; };

// slow = pale, fast = hot, across the page's scale
const [LO, HI] = data.scale_mm_s;
const HUES = ["#e9eef8", "#ffd166", "#f78c40", "#e63946", "#9d0b28"];
const STOPS = HUES.map((c, i) => [LO + (HI - LO) * i / (HUES.length - 1), new THREE.Color(c)]);
function ramp(v, out) {
  if (v <= STOPS[0][0]) return out.copy(STOPS[0][1]);
  for (let i = 1; i < STOPS.length; i++) {
    if (v <= STOPS[i][0]) { const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i]; return out.copy(ca).lerp(cb, (v - a) / (b - a)); }
  }
  return out.copy(STOPS[STOPS.length - 1][1]);
}
document.getElementById("grad").style.background = `linear-gradient(90deg, ${HUES.map((c, i) => `${c} ${i * 100 / (HUES.length - 1)}%`).join(", ")})`;
document.getElementById("ticks").innerHTML = STOPS.map(([v], i) => `<span>${+v.toFixed(1)}${i === STOPS.length - 1 ? " mm/s" : ""}</span>`).join("");

function wallMesh(p) {
  const paths = new Int16Array(bytes(p.paths)), speeds = new Uint16Array(bytes(p.speeds));
  const offsets = new Uint32Array(bytes(p.offsets)), heights = new Uint8Array(bytes(p.heights));
  const n = paths.length / 3, pos = new Float32Array(n * 6), nor = new Float32Array(n * 6), col = new Float32Array(n * 6);
  const idx = [], c = new THREE.Color();
  for (let r = 0; r + 1 < offsets.length; r++) {
    const a = offsets[r], b = offsets[r + 1], h = heights[r] / 100;
    for (let i = a; i < b; i++) {
      const x = paths[3 * i] / 100, y = paths[3 * i + 1] / 100, z = paths[3 * i + 2] / 100;
      const pi = Math.max(a, i - 1), qi = Math.min(b - 1, i + 1);
      let tx = (paths[3 * qi] - paths[3 * pi]) / 100, ty = (paths[3 * qi + 1] - paths[3 * pi + 1]) / 100;
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      ramp(speeds[i] / 100, c);  // the speed of the move leaving this point
      pos.set([x, y, z, x, y, z - h * 0.92], 6 * i);
      nor.set([ty, -tx, 0, ty, -tx, 0], 6 * i);
      col.set([c.r, c.g, c.b, c.r, c.g, c.b], 6 * i);
      if (i + 1 < b) { const v = 2 * i; idx.push(v, v + 1, v + 2, v + 1, v + 3, v + 2); }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx), 1));
  g.computeBoundingBox();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
}

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setScissorTest(true);
stage.prepend(renderer.domElement);

const panels = data.panels.map((p) => {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404a66, 1.25));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  scene.add(key);
  const mesh = wallMesh(p);
  scene.add(mesh);
  const cap = document.createElement("div");
  cap.className = "cap";
  cap.innerHTML = `<b>${p.letter} · ${p.name}</b>`;
  stage.appendChild(cap);
  let tag = null, anchor = null;
  if (p.mark) {
    const lo = Math.min(...p.mark.speeds), hi = Math.max(...p.mark.speeds);
    tag = document.createElement("div");
    tag.className = "tag";
    tag.innerHTML = `${p.mark.place} ${lo === hi ? lo.toFixed(1) : lo.toFixed(1) + "–" + hi.toFixed(1)} mm/s<small>layers ${p.mark.layers[0]}–${p.mark.layers[1]}</small>`;
    stage.appendChild(tag);
    anchor = new THREE.Vector3(...p.mark.at);
  }
  return { scene, key, mesh, cap, tag, anchor, rect: null };
});

const box = panels[0].mesh.geometry.boundingBox.clone();
panels.forEach((q) => box.union(q.mesh.geometry.boundingBox));
const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 4000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.addEventListener("change", draw);

// [azimuth from +X toward +Y, elevation] on the plate; front is the printer's -Y side
const VIEWS = { left: [180, 6], front: [-90, 6], right: [0, 6], back: [90, 6], iso: [-135, 24] };
function setView(name, elevation) {
  const [az, el0] = VIEWS[name], el = elevation ?? el0;
  const r = Math.max(size.x, size.y, size.z) / (2 * Math.tan(THREE.MathUtils.degToRad(15))) * 1.25;
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  camera.position.set(center.x + r * Math.cos(e) * Math.cos(a), center.y + r * Math.cos(e) * Math.sin(a), center.z + r * Math.sin(e));
  controls.target.copy(center);
  controls.update();
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
  draw();
}
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));

function layout() {
  const w = stage.clientWidth, h = stage.clientHeight, n = panels.length, wide = w >= 640;
  renderer.setSize(w, h, false);
  panels.forEach((q, i) => {
    q.rect = wide ? { x: (w / n) * i, y: 0, w: w / n, h } : { x: 0, y: (h / n) * i, w, h: h / n };
    Object.assign(q.cap.style, { left: q.rect.x + "px", top: q.rect.y + "px", maxWidth: q.rect.w + "px" });
  });
  camera.aspect = panels[0].rect.w / panels[0].rect.h;
  camera.updateProjectionMatrix();
  draw();
}
let pending = false;
function draw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    const H = stage.clientHeight, v = new THREE.Vector3();
    for (const q of panels) {
      const { x, y, w, h } = q.rect;
      renderer.setViewport(x, H - y - h, w, h);
      renderer.setScissor(x, H - y - h, w, h);
      q.key.position.copy(camera.position).add(new THREE.Vector3(0, 0, 30));
      renderer.render(q.scene, camera);
      if (q.tag) {
        v.copy(q.anchor).project(camera);
        const px = x + (v.x + 1) / 2 * w;
        q.tag.style.left = px + "px";
        q.tag.style.top = y + (1 - v.y) / 2 * h + "px";
        q.tag.hidden = v.z > 1 || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1;
        // sit left of the mark unless that would leave the panel
        q.tag.style.transform = px - q.tag.offsetWidth - 12 < x ? "translate(12px, -50%)" : "";
      }
    }
  });
}
new ResizeObserver(layout).observe(stage);
document.getElementById("note").remove();
document.getElementById("foot").textContent = data.panels.map((p) => `${p.letter}: ${p.source} · ${p.runs} outer-wall runs · ${p.points.toLocaleString()} points`).join("  ·  ") + "  ·  plate coordinates, mm";
layout();
setView(data.view, data.elevation);
requestAnimationFrame(() => requestAnimationFrame(() => { window.__vizReady = true; }));
</script>
