[package]
name = "hsm-manifold-layout"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "manifold-layout"
path = "../../../hardware/manifold-layout/manifold_layout.rs"

[dependencies]
anyhow.workspace = true
hsm-kernel = { path = "../kernel" }
hsm-manifold-numbers = { path = "../manifold-numbers" }
hsm-print-payload = { path = "../print-payload" }
hsm-shared-data = { path = "../shared-data" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
