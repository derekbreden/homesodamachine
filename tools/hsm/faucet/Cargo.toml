[package]
name = "hsm-faucet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Each part's program sits beside the Python module that holds its numbers.
[[bin]]
name = "faucet-shell"
path = "../../../hardware/printed-parts/faucet/faucet-shell/faucet_shell.rs"

[[bin]]
name = "faucet-assembly"
path = "../../../hardware/faucet-layout/faucet_assembly.rs"

[[bin]]
name = "faucet-industrial-assembly"
path = "../../../hardware/faucet-layout/faucet_industrial_assembly.rs"

[[bin]]
name = "industrial-faucet"
path = "../../../hardware/printed-parts/faucet/industrial/industrial_faucet.rs"

[[bin]]
name = "faucet-display-cover"
path = "../../../hardware/printed-parts/faucet/faucet-display-cover/faucet_display_cover.rs"

[dependencies]
anyhow.workspace = true
hsm-kernel = { path = "../kernel" }
serde_json.workspace = true
