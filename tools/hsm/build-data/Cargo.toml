[package]
name = "hsm-build-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
regex = "1"
hsm-kernel = { path = "../kernel", default-features = false }
hsm-geometry = { path = "../geometry" }
hsm-documents = { path = "../documents" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libloading = "0.8.9"
crc32fast = "1.5.0"
libc = "0.2"
