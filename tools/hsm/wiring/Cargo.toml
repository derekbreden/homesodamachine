[package]
name = "hsm-wiring"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "hsm-wiring"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex = "1"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hsm-kernel = { path = "../kernel" }
hsm-model-export = { path = "../model-export" }
hsm-documents = { path = "../documents" }
hsm-enclosure-numbers = { path = "../enclosure-numbers" }
hsm-cold-core-interface = { path = "../cold-core-interface" }
hsm-print-payload = { path = "../print-payload" }
hsm-run-slots = { path = "../run-slots" }
