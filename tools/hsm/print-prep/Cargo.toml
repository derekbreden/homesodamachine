[package]
name = "hsm-print-prep"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "incline-support-plates"
path = "../../../hardware/print-tests/petgf-dense-roofs/inclines/prepare.rs"

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hsm-shared-data = { path = "../shared-data" }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hsm-faucet-numbers = { path = "../faucet-numbers" }
hsm-run-slots = { path = "../run-slots" }
hsm-fake-countertop-numbers = { path = "../fake-countertop-numbers" }
