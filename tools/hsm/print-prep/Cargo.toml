[package]
name = "hsm-print-prep"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
hsm-shared-data = { path = "../shared-data" }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hsm-faucet-numbers = { path = "../faucet-numbers" }
hsm-run-slots = { path = "../run-slots" }

[[bin]]
name = "petgf-cooling"
path = "../../../hardware/printed-parts/cadlib/petgf_cooling.rs"

[[bin]]
name = "faucet-print-project"
path = "../../../hardware/printed-parts/faucet/faucet_print_project.rs"

[[bin]]
name = "enclosure-print-prep"
path = "../../../hardware/printed-parts/enclosure/trial-preparation/prepare.rs"

[[bin]]
name = "enclosure-labels"
path = "../../../hardware/printed-parts/enclosure/trial-preparation/labels.rs"

[[bin]]
name = "enclosure-print-review"
path = "../../../hardware/printed-parts/enclosure/trial-preparation/review.rs"

[[bin]]
name = "support-audit"
path = "../../../hardware/printed-parts/cadlib/support_audit.rs"
