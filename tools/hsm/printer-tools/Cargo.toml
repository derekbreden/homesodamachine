[package]
name = "hsm-printer-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc = "0.2"
regex = "1"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
md-5 = "0.11"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
native-tls = "0.2"

[[bin]]
name = "hsm-printer"
path = "src/main.rs"
