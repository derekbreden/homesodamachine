[package]
name = "hsm-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["manifold"]
# Booleans, plane splits and file simplification through the Manifold C++ library.
# Without it the kernel is pure Rust and builds for wasm32.
manifold = ["dep:manifold-csg"]

[dependencies]
anyhow.workspace = true
libm = "0.2"
miniz_oxide = "0.8"
npyz = "0.9.1"
serde_json.workspace = true
sha2.workspace = true
spade = "2"
ttf-parser = "0.25"
manifold-csg = { version = "0.4.1", default-features = false, features = ["parallel"], optional = true }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
hsm-run-slots = { path = "../run-slots" }

[dev-dependencies]
hsm-geometry = { path = "../geometry" }
manifold-csg = { version = "0.4.1", default-features = false, features = ["parallel"] }
