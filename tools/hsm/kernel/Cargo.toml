[package]
name = "hsm-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["manifold"]
# Booleans, plane splits and simplification through the Rust Manifold engine.
manifold = ["dep:hsm-manifold"]

[dependencies]
anyhow.workspace = true
libm = "0.2"
miniz_oxide = "0.8"
npyz = "0.9.1"
serde_json.workspace = true
sha2.workspace = true
spade = "2"
ttf-parser = "0.25"
hsm-manifold = { path = "../manifold", optional = true }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
hsm-run-slots = { path = "../run-slots" }

[dev-dependencies]
hsm-geometry = { path = "../geometry" }
hsm-manifold = { path = "../manifold" }
