[package]
name = "hsm-faucet-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "faucet-data"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
hsm-documents = { path = "../documents" }
hsm-bulkhead-ring-numbers = { path = "../bulkhead-ring-numbers" }
hsm-kernel = { path = "../kernel" }
hsm-faucet = { path = "../faucet" }
hsm-lever-replica-numbers = { path = "../lever-replica-numbers" }
hsm-tpu-o-ring-numbers = { path = "../tpu-o-ring-numbers" }
hsm-tube-collar-numbers = { path = "../tube-collar-numbers" }
hsm-under-counter-plate-numbers = { path = "../under-counter-plate-numbers" }
hsm-umbilical-organizer-numbers = { path = "../umbilical-organizer-numbers" }
libloading = "0.8.9"
hsm-shared-data = { path = "../shared-data" }
png = "0.18.1"
