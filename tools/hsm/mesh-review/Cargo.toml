[package]
name = "hsm-mesh-review"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
parry3d-f64.workspace = true
hsm-kernel = { path = "../kernel" }
hsm-geometry = { path = "../geometry" }
hsm-build-data = { path = "../build-data" }
hsm-faucet-numbers = { path = "../faucet-numbers" }
npyz = "0.9.1"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "geometry-lint"
path = "src/main.rs"
