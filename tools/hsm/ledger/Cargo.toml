[package]
name = "hsm-ledger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ledger-data"
path = "src/main.rs"

[[bin]]
name = "purchases"
path = "../../../hardware/ledger/purchases.rs"

[[bin]]
name = "ledger-analysis"
path = "src/evidence_main.rs"

[dependencies]
anyhow.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde.workspace = true
sha2.workspace = true
regex = "1"
num-bigint = "0.4"
num-traits = "0.2"
hsm-kernel = { path = "../kernel" }
hsm-documents = { path = "../documents" }
