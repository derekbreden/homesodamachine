[workspace]
members = ["geometry", "engine", "kernel", "render", "refrigeration", "cold-core", "faucet", "funnel", "run-slots", "run-native", "machine", "enclosure-components", "enclosure-shell", "tooling", "documents", "ledger", "assembly-docs", "cold-core-data", "faucet-data", "enclosure-data", "machine-data", "part-data", "layout-data", "shared-data", "guides", "build-data", "build-plan"]
resolver = "2"
exclude = ["vendor/manifold-csg-sys"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
parry3d-f64 = { version = "0.25.1", features = ["enhanced-determinism"] }

[profile.release]
debug = 1

# Generated recipe modules spend their time in hsm-documents' value runtime, which stays
# optimized. Unoptimized, these two recompile in a fraction of the CPU time and run about
# as fast.
[profile.release.package.hsm-enclosure-data]
opt-level = 0
debug = 0

[profile.release.package.hsm-cold-core-data]
opt-level = 0
debug = 0

[patch.crates-io]
manifold-csg-sys = { path = "vendor/manifold-csg-sys" }
