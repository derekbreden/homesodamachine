[workspace]
members = ["geometry", "engine", "kernel", "render", "refrigeration", "cold-core", "faucet", "funnel", "run-slots", "run-native", "machine", "enclosure-components", "enclosure-shell", "tooling", "documents", "ledger", "assembly-docs", "cold-core-data", "faucet-data", "enclosure-data", "machine-data", "part-data", "layout-data", "shared-data", "guides", "guide-native", "build-data", "build-plan", "model-export", "enclosure-numbers", "enclosure-dock-numbers", "enclosure-retainer-numbers", "enclosure-solid", "enclosure-quadrants", "enclosure-front", "enclosure-front-bottom", "enclosure-front-top", "enclosure-back-bottom", "enclosure-back-top", "enclosure-pump-retainer", "enclosure-pump-tube-setting-jig", "enclosure", "carbonator-tube-numbers", "aero-float-numbers", "endcap-circular-numbers", "endcap-circular", "print-payload", "enclosure-interface", "bulkhead-ring-numbers", "valve-seat-numbers", "cold-core-interface", "sandbox", "installed-machine", "cold-core-catalog", "prv-shroud-numbers", "prv-shroud", "cold-core-layout", "faucet-numbers", "tpu-o-ring-numbers", "tpu-o-ring", "umbilical-organizer-numbers", "umbilical-organizer", "reservoir-numbers", "reservoir", "foam-shell-numbers", "foam-shell", "faucet-display-cover-numbers", "industrial-faucet-numbers", "faucet-shell", "above-counter-plate", "above-counter-gasket", "faucet-display-cover", "industrial-faucet", "magnetic-float-numbers", "magnetic-float", "all-aero-float", "coil-numbers", "coil-mandrel-numbers", "coil-mandrel", "reed-bridge-numbers", "reed-bridge", "manifold-numbers", "manifold-layout", "fluid-topology", "rear-equipment-caps"]
resolver = "2"
exclude = ["vendor/manifold-csg-sys"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
parry3d-f64 = { version = "0.25.1", features = ["enhanced-determinism"] }

[profile.release]
debug = 1

# Generated recipe modules spend their time in hsm-documents' value runtime, which stays
# optimized. Unoptimized, these four recompile in a fraction of the CPU time and run about
# as fast. The guides' hand-written mesh and mask loops are in hsm-guide-native, which keeps
# the release optimization.
[profile.release.package.hsm-enclosure-data]
opt-level = 0
debug = 0

[profile.release.package.hsm-cold-core-data]
opt-level = 0
debug = 0

[profile.release.package.hsm-machine-data]
opt-level = 0
debug = 0

[profile.release.package.hsm-guides]
opt-level = 0
debug = 0

[profile.release.package.hsm-enclosure-interface]
debug = 0

[profile.release.package.hsm-enclosure-numbers]
debug = 0

[profile.release.package.hsm-enclosure-dock-numbers]
debug = 0

[profile.release.package.hsm-enclosure-retainer-numbers]
debug = 0

[profile.release.package.hsm-enclosure-solid]
debug = 0

[profile.release.package.hsm-print-payload]
debug = 0

[profile.release.package.hsm-enclosure-quadrants]
debug = 0

[profile.release.package.hsm-enclosure-front]
debug = 0

[profile.release.package.hsm-enclosure-front-bottom]
debug = 0

[profile.release.package.hsm-enclosure-front-top]
debug = 0

[profile.release.package.hsm-enclosure-back-bottom]
debug = 0

[profile.release.package.hsm-enclosure-back-top]
debug = 0

[profile.release.package.hsm-enclosure-pump-retainer]
debug = 0

[profile.release.package.hsm-enclosure-pump-tube-setting-jig]
debug = 0

[profile.release.package.hsm-enclosure]
debug = 0

[patch.crates-io]
manifold-csg-sys = { path = "vendor/manifold-csg-sys" }
