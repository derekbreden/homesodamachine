[package]
name = "hsm-machine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "machine-assembly-model"
path = "../../../hardware/manifold-layout/enclosure_assembly.rs"

[[bin]]
name = "installed-wires"
path = "../../../hardware/wiring/installed/wire_geometry.rs"

[[bin]]
name = "manifold-layout"
path = "../../../hardware/manifold-layout/manifold_layout.rs"

[[bin]]
name = "machine-export"
path = "../../../hardware/assembly/scenes/machine_export.rs"

[dependencies]
anyhow.workspace = true
hsm-kernel = { path = "../kernel" }
hsm-geometry = { path = "../geometry" }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
