[package]
name = "hsm-pgfun-positioner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hsm-kernel = { path = "../kernel" }
hsm-print-payload = { path = "../print-payload" }
npyz = "0.9.1"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"
flate2 = "1"

[lib]
path = "../../../hardware/printed-parts/fixtures/pgfun-positioner/lib.rs"

[[bin]]
name = "pgfun-positioner"
path = "../../../hardware/printed-parts/fixtures/pgfun-positioner/pgfun_positioner.rs"

[[bin]]
name = "pgfun-check"
path = "../../../hardware/printed-parts/fixtures/pgfun-positioner/check.rs"

[[bin]]
name = "positioner-view"
path = "../../../tools/positioner_view.rs"
