<style>

  --face: Montserrat, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

  --data: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0a0f1f;
    --paper: #121a31;
    --ink: #e6eaf5;
    --muted: #9aa3bd;
    --rule: #252e4a;
    --accent: #8aa4ff;
    --accent-ink: #0a0f1f;
    --pick: #ffb655;
    --pick-ink: #2b1a00;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0a0f1f;
  --paper: #121a31;
  --ink: #e6eaf5;
  --muted: #9aa3bd;
  --rule: #252e4a;
  --accent: #8aa4ff;

}
* { box-sizing: border-box; }
body {
  margin: 0;

  padding-block: 20px 28px;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.5 var(--text);
}
.viz { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.viz-head h1 {
  margin: 0;
  font: 600 22px/1.25 var(--face);
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.viz-lede { margin: 6px 0 0; color: var(--muted); max-width: 72ch; }
.viz-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.viz-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

  outline: 2px solid var(--pick);

}

}

<script>
  // A page whose module never starts says so in each stage, rather than reading "Loading" forever.
  setTimeout(function () {
    if (window.__vizBoot) return;
    document.querySelectorAll(".viz-stage[data-3d] .viz-note").forEach(function (n) {
      n.textContent = "The 3D view could not start here: scripts or cdn.jsdelivr.net are blocked in this viewer.";
      n.classList.add("is-error");
    });
    window.__vizReady = true;
  }, 15000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

window.__vizBoot = true;
const spec = JSON.parse(document.getElementById("viz-spec").textContent);

// The /3d viewer's own look: its ground, its selection amber, its default solid, its tone curve
// and light rig (web/public/js/viewer/scene.js, step.js), on the same Z-up axis.
const GROUND = 0x10319c, SEL = 0xffa733, PLAIN = 0x8899aa, EDGE = 0x0b1433, BACK_DARKEN = 0.75;
const KEY_DIR = new THREE.Vector3(1, -1.2, 2).normalize();
const FILL_DIR = new THREE.Vector3(-1.2, 0.8, 0.3).normalize();
// [azimuth, elevation] in degrees; azimuth from +X toward +Y, so front (the user's side) is -90.
const VIEWS = { iso: [-45, 35.264], front: [-90, 0], back: [90, 0], left: [180, 0], right: [0, 0], top: [-90, 89.5], bottom: [-90, -89.5] };
const FOV = 30;

const shared = viewFrom(spec.view);
let synced = spec.sync !== false;
let edgesOn = spec.edges !== false;
const panels = [];

// `pan` is how far the view's target has been moved off the frame's centre, in model millimetres.
function viewFrom(v) {
  if (v && typeof v === "object") return { az: v.az ?? -45, el: v.el ?? 35.264, zoom: v.zoom ?? 1, pan: [0, 0, 0] };
  const [az, el] = VIEWS[v] || VIEWS.iso;
  return { az, el, zoom: 1, pan: [0, 0, 0] };
}

const bytes = new Map();
function modelBytes(id) {
  if (!bytes.has(id)) {
    bytes.set(id, (async () => {
      const text = document.getElementById("viz-mesh-" + id).textContent.replace(/\s+/g, "");
      const bin = atob(text);
      const raw = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(stream).arrayBuffer();
    })());
  }
  return bytes.get(id);
}

function darkenBackFaces(shader) {
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <color_fragment>",
    `#include <color_fragment>
    if ( !gl_FrontFacing ) diffuseColor.rgb *= ${BACK_DARKEN.toFixed(3)};`,
  );
}

function material(color, finish, role) {
  const m = new THREE.MeshStandardMaterial({
    color,
    roughness: finish ? finish[0] : 0.6,
    metalness: finish ? finish[1] : 0.1,
    side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    transparent: role === "ghost",
    opacity: role === "ghost" ? 0.16 : 1,
    depthWrite: role !== "ghost",
  });
  m.onBeforeCompile = darkenBackFaces;
  m.customProgramCacheKey = () => "viz-back-darken";
  return m;
}

const edgeMat = new THREE.LineBasicMaterial({ color: EDGE, transparent: true, opacity: 0.5 });

// Feature edges are built the first time they are shown: on a million triangles the pass costs
// seconds, and a page that opens with them off should not pay it.
function showEdges(panel, on) {
  if (!panel.group) return;
  if (on && !panel.edgesBuilt) {
    for (const solid of [...panel.group.children]) {
      if (!solid.isMesh || solid.userData.ghost || solid.geometry.index.count / 3 > 150000) continue;
      const lines = new THREE.LineSegments(new THREE.EdgesGeometry(solid.geometry, 28), edgeMat);
      lines.userData.edge = true;
      panel.group.add(lines);
    }
    panel.edgesBuilt = true;
  }
  panel.group.children.forEach((c) => { if (c.userData.edge) c.visible = on; });
}

async function buildGroup(p) {
  const group = new THREE.Group();
  for (const use of p.models) {
    const buf = await modelBytes(use.model);
    const meta = spec.models[use.model];
    meta.meshes.forEach((mesh, i) => {
      const role = (use.roles && use.roles[i]) || "plain";
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(buf, mesh.pos[0], mesh.pos[1]), 3));
      geo.setIndex(new THREE.BufferAttribute(new Uint32Array(buf, mesh.idx[0], mesh.idx[1]), 1));
      geo.computeVertexNormals();
      const color = role === "hi" ? new THREE.Color(SEL)
        : use.color ? new THREE.Color(use.color)
        : mesh.color ? new THREE.Color(mesh.color[0], mesh.color[1], mesh.color[2])
        : new THREE.Color(PLAIN);
      const solid = new THREE.Mesh(geo, material(color, role === "hi" ? [0.5, 0.05] : mesh.finish, role));
      solid.name = mesh.name || "";
      solid.userData.ghost = role === "ghost";
      group.add(solid);
    });
  }
  return group;
}

// THE SAME CAMERA MEANS THE SAME TARGET AND THE SAME SPAN. Panels drawn in one frame (the scene
// STEPs all stand in the machine's coordinates) are aimed at the centre of everything the page
// shows, so a part that moved between panels is seen to move; aimed each at its own centre, the
// motion would be framed away. `"frame": "each"` is for models that do not share a frame, and
// a panel's own `focus` aims it at one feature of a large piece.
function frameFor(panel) {
  if (panel.focus) return panel.focus;
  if (spec.frame === "each") return panel.sphere;
  const box = new THREE.Box3();
  for (const p of panels) if (p.box) box.union(p.box);
  return box.isEmpty() ? panel.sphere : box.getBoundingSphere(new THREE.Sphere());
}

function place(panel) {
  const v = synced ? shared : panel.own;
  const az = THREE.MathUtils.degToRad(v.az), el = THREE.MathUtils.degToRad(v.el);
  const dir = new THREE.Vector3(Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el));
  const { center: middle, radius } = frameFor(panel);
  const center = middle.clone().add(new THREE.Vector3(...(v.pan || [0, 0, 0])));
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(FOV / 2)) * 1.08 / v.zoom;
  const cam = panel.camera;
  cam.up.set(0, 0, 1);
  if (Math.abs(v.el) > 89) cam.up.set(-Math.cos(az), -Math.sin(az), 0);
  cam.position.copy(center).addScaledVector(dir, dist);
  const reach = cam.position.distanceTo(middle);
  cam.near = Math.max(reach - radius * 2.5, dist / 200);
  cam.far = reach + radius * 2.5;
  cam.lookAt(center);
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld();
  panel.target = center;
  panel.dist = dist;
  panel.key.position.copy(center).addScaledVector(KEY_DIR, dist);
  panel.key.target.position.copy(center);
  panel.fill.position.copy(center).addScaledVector(FILL_DIR, dist);
  panel.fill.target.position.copy(center);
}

// A mark is a label pinned to a point of the model: its dot stays on the point as the panel
// turns, and the label stands its own pixel offset away on a leader.
const SVGNS = "http://www.w3.org/2000/svg";
function addMarks(panel, marks) {
  const layer = document.createElement("div");
  layer.className = "viz-marks";
  const svg = document.createElementNS(SVGNS, "svg");
  layer.append(svg);
  panel.marks = marks.map((m) => {
    const [halo, line, dot] = ["line", "line", "circle"].map((tag) => document.createElementNS(SVGNS, tag));
    halo.setAttribute("class", "viz-mark-halo");
    line.setAttribute("class", "viz-mark-line");
    dot.setAttribute("class", "viz-mark-dot");
    dot.setAttribute("r", "3.5");
    svg.append(halo, line, dot);
    const label = document.createElement("div");
    label.className = "viz-mark";
    label.textContent = m.text;
    layer.append(label);
    return { at: new THREE.Vector3(...m.at), dx: m.dx ?? 18, dy: m.dy ?? -18, parts: [halo, line, dot, label] };
  });
  panel.stage.append(layer);
}

function placeMarks(panel) {
  if (!panel.marks) return;
  const r = panel.stage.getBoundingClientRect();
  const placed = [];
  for (const m of panel.marks) {
    const v = m.at.clone().project(panel.camera);
    const shown = v.z > -1 && v.z < 1;
    m.parts.forEach((el) => { el.style.display = shown ? "" : "none"; });
    if (!shown) continue;
    const [halo, line, dot, label] = m.parts;
    const x = (v.x + 1) / 2 * r.width, y = (1 - v.y) / 2 * r.height;
    // The label keeps inside the stage, however narrow, and its leader follows it there.
    const w = label.offsetWidth, h = label.offsetHeight;
    const lx = Math.max(4, Math.min(r.width - w - 4, x + m.dx - (m.dx < 0 ? w : 0)));
    const fit = (v) => Math.max(4, Math.min(r.height - h - 4, v));
    // Nor does it sit on a label already placed: it steps above or below the one in its way,
    // its own side first, wherever the stage leaves room.
    const clear = (v) => placed.every((b) => lx >= b.x + b.w + 3 || lx + w + 3 <= b.x || v >= b.y + b.h + 3 || v + h + 3 <= b.y);
    const want = fit(y + m.dy - h / 2);
    const tries = [want];
    for (const b of placed) {
      const above = b.y - h - 4, below = b.y + b.h + 4;
      tries.push(...(m.dy < 0 ? [above, below] : [below, above]));
    }
    const ly = tries.find((v) => v === fit(v) && clear(v)) ?? want;
    placed.push({ x: lx, y: ly, w, h });
    const ex = m.dx < 0 ? lx + w : lx, ey = ly + h / 2;
    for (const el of [halo, line]) {
      el.setAttribute("x1", x); el.setAttribute("y1", y);
      el.setAttribute("x2", ex); el.setAttribute("y2", ey);
    }
    dot.setAttribute("cx", x);
    dot.setAttribute("cy", y);
    label.style.transform = `translate(${lx}px, ${ly}px)`;
  }
}

// A mark whose point the piece itself hides from this camera is drawn faint, on a dashed leader:
// it says where the feature is without claiming it can be seen. Read once the view settles, since
// a ray through the whole piece costs more than a frame.
const ray = new THREE.Raycaster();
function hideMarks(panel) {
  if (!panel.marks) return;
  const solids = panel.group.children.filter((c) => c.isMesh && !c.userData.ghost);
  for (const m of panel.marks) {
    const to = m.at.clone().sub(panel.camera.position);
    const dist = to.length();
    ray.set(panel.camera.position, to.normalize());
    ray.far = dist;
    const hit = ray.intersectObjects(solids, false)[0];
    const behind = !!hit && hit.distance < dist - Math.max(0.5, dist * 0.004);
    m.parts.forEach((el) => el.classList.toggle("is-behind", behind));
  }
}

function draw(panel) {
  if (!panel.renderer) return;
  place(panel);
  panel.renderer.render(panel.scene, panel.camera);
  placeMarks(panel);
  if (panel.marks) {
    clearTimeout(panel.settle);
    panel.settle = setTimeout(() => hideMarks(panel), 150);
  }
}

function drawAll() { for (const p of panels) draw(p); }

function resize(panel) {
  const r = panel.stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  panel.renderer.setSize(r.width, r.height, false);
  panel.camera.aspect = r.width / r.height;
  draw(panel);
}

const ZOOM = [0.3, 40];
const aim = new THREE.Raycaster();

// The model's point under (px, py) on the stage; off the model, the point there on the plane
// through the target square to the view.
function pointAt(panel, px, py) {
  const r = panel.stage.getBoundingClientRect();
  aim.setFromCamera(new THREE.Vector2(px / r.width * 2 - 1, 1 - py / r.height * 2), panel.camera);
  const hit = aim.intersectObjects(panel.group.children.filter((c) => c.isMesh && !c.userData.ghost), false)[0];
  if (hit) return hit.point;
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(panel.camera.getWorldDirection(new THREE.Vector3()), panel.target);
  return aim.ray.intersectPlane(plane, new THREE.Vector3()) || panel.target.clone();
}

// Moves the target across the screen with a drag of (dx, dy) pixels: the model follows the pointer.
function pan(panel, v, dx, dy) {
  const per = 2 * panel.dist * Math.tan(THREE.MathUtils.degToRad(FOV / 2)) / (panel.stage.getBoundingClientRect().height || 1);
  const move = new THREE.Vector3().setFromMatrixColumn(panel.camera.matrixWorld, 0).multiplyScalar(-dx * per)
    .addScaledVector(new THREE.Vector3().setFromMatrixColumn(panel.camera.matrixWorld, 1), dy * per);
  v.pan = [v.pan[0] + move.x, v.pan[1] + move.y, v.pan[2] + move.z];
}

// Zooms by `k` about `point`, which keeps its place on the screen; without one, about the target.
function zoomAt(panel, v, k, point) {
  const next = Math.max(ZOOM[0], Math.min(ZOOM[1], v.zoom * k));
  if (point) {
    const s = 1 - v.zoom / next;
    v.pan = v.pan.map((c, i) => c + (point.getComponent(i) - panel.target.getComponent(i)) * s);
  }
  v.zoom = next;
}

// A drag turns the view. A right or middle drag, or one with Shift, Ctrl or Cmd held, moves it
// across; two fingers move it and pinch it. The wheel zooms on the point under the pointer, so a
// part is reached by pointing at it and scrolling.
function orbit(panel) {
  const canvas = panel.renderer.domElement;
  const view = () => (synced ? shared : panel.own);
  const changed = () => (synced ? drawAll() : draw(panel));
  const down = new Map();
  let mode = null, last = null, aimed = null;
  const at = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const gesture = () => {
    const ps = [...down.values()];
    return { x: ps.reduce((s, p) => s + p.x, 0) / ps.length, y: ps.reduce((s, p) => s + p.y, 0) / ps.length,
             spread: ps.length > 1 ? Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y) : 0 };
  };
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    down.set(e.pointerId, at(e));
    mode = down.size > 1 ? "pinch" : (e.button === 1 || e.button === 2 || e.shiftKey || e.ctrlKey || e.metaKey) ? "pan" : "turn";
    last = gesture();
    if (mode === "pinch") aimed = { point: pointAt(panel, last.x, last.y) };
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!down.has(e.pointerId)) return;
    down.set(e.pointerId, at(e));
    const now = gesture(), v = view();
    if (mode === "turn") {
      v.az -= (now.x - last.x) * 0.4;
      v.el = Math.max(-89.5, Math.min(89.5, v.el + (now.y - last.y) * 0.4));
    } else {
      if (mode === "pinch" && last.spread && now.spread) zoomAt(panel, v, now.spread / last.spread, aimed.point);
      place(panel);
      pan(panel, v, now.x - last.x, now.y - last.y);
    }
    last = now;
    changed();
  });
  const end = (e) => {
    down.delete(e.pointerId);
    if (mode === "pinch") mode = down.size > 1 ? "pinch" : "pan";
    last = down.size ? gesture() : null;
  };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const p = at(e);
    if (!aimed || aimed.x === undefined || Math.hypot(p.x - aimed.x, p.y - aimed.y) > 2 || e.timeStamp - aimed.t > 400)
      aimed = { ...p, point: pointAt(panel, p.x, p.y) };
    aimed.t = e.timeStamp;
    zoomAt(panel, view(), Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), aimed.point);
    changed();
  }, { passive: false });
  panel.stage.addEventListener("keydown", (e) => {
    const v = view();
    const step = { ArrowLeft: ["az", 15], ArrowRight: ["az", -15], ArrowUp: ["el", 10], ArrowDown: ["el", -10] }[e.key];
    if (step) {
      e.preventDefault();
      v[step[0]] += step[1];
      v.el = Math.max(-89.5, Math.min(89.5, v.el));
    } else if (e.key === "+" || e.key === "=") zoomAt(panel, v, 1.2);
    else if (e.key === "-") zoomAt(panel, v, 1 / 1.2);
    else return;
    changed();
  });
}

async function mount(el, p, hint) {
  const stage = el.querySelector(".viz-stage");
  const note = stage.querySelector(".viz-note");
  const panel = { el, stage, own: p.view ? viewFrom(p.view) : { ...shared } };
  if (p.focus) panel.focus = new THREE.Sphere(new THREE.Vector3(...p.focus.center), p.focus.radius);
  panels.push(panel);
  try {
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.setClearColor(GROUND);
    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.45;
    scene.add(new THREE.AmbientLight(0xffffff, 0.12));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    const fill = new THREE.DirectionalLight(0xffffff, 0.3);
    const hemi = new THREE.HemisphereLight(0xffffff, 0x333340, 0.35);
    hemi.position.set(0, 0, 1);
    scene.add(key, key.target, fill, fill.target, hemi);
    const group = await buildGroup(p);
    scene.add(group);
    const box = new THREE.Box3();
    group.children.forEach((c) => { if (c.isMesh && !c.userData.ghost) box.expandByObject(c); });
    if (box.isEmpty()) box.setFromObject(group);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    if (!sphere.radius) sphere.radius = 1;
    Object.assign(panel, {
      renderer, scene, key, fill, group, box, sphere,
      camera: new THREE.PerspectiveCamera(FOV, 4 / 3, 1, 1000),
    });
    showEdges(panel, edgesOn);
    stage.prepend(renderer.domElement);
    if (p.marks && p.marks.length) addMarks(panel, p.marks);
    note.textContent = hint ? "Drag to turn · right-drag or Shift-drag to pan · scroll to zoom where you point" : "";
    note.classList.remove("is-error");
    orbit(panel);
    new ResizeObserver(() => { resize(panel); if (synced) drawAll(); }).observe(stage);
    resize(panel);
  } catch (err) {
    note.textContent = "The 3D view could not start: " + (err && err.message ? err.message : err);
    note.classList.add("is-error");
    console.error(err);
  }
}

function setPressed(buttons, active) {
  buttons.forEach((b) => b.setAttribute("aria-pressed", String(b === active)));
}

const viewButtons = [...document.querySelectorAll("[data-view]")];
viewButtons.forEach((b) => b.addEventListener("click", () => {
  const next = viewFrom(b.dataset.view);
  Object.assign(shared, next);
  panels.forEach((p) => Object.assign(p.own, next));
  setPressed(viewButtons, b);
  drawAll();
}));
const syncButton = document.querySelector("[data-sync]");
if (syncButton) syncButton.addEventListener("click", () => {
  synced = !synced;
  if (synced) panels.forEach((p) => Object.assign(p.own, shared));
  syncButton.setAttribute("aria-pressed", String(synced));
  drawAll();
});
const edgeButton = document.querySelector("[data-edges]");
if (edgeButton) edgeButton.addEventListener("click", () => {
  edgesOn = !edgesOn;
  panels.forEach((p) => showEdges(p, edgesOn));
  edgeButton.setAttribute("aria-pressed", String(edgesOn));
  drawAll();
});
document.querySelectorAll("[data-wide]").forEach((b) => b.addEventListener("click", () => {
  const panel = b.closest(".viz-panel");
  const wide = panel.classList.toggle("is-wide");
  b.textContent = wide ? "Shrink" : "Enlarge";
  b.setAttribute("aria-pressed", String(wide));
}));

const mounts = [];
document.querySelectorAll(".viz-panel[data-panel]").forEach((el) => {
  const p = spec.panels[Number(el.dataset.panel)];
  if (p && p.models && p.models.length) mounts.push(mount(el, p, mounts.length === 0));
});
Promise.allSettled(mounts).then(() => {
  drawAll();
  panels.forEach(hideMarks);
  requestAnimationFrame(() => { window.__vizReady = true; });
});
</script>
