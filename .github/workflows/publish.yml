name: publish

on:
  # NOT ON PUSH. `publish_now.py` cuts and pins from the machine that changed the tree,
  # detached from `.githooks/post-commit`, and the running container adopts the lock it
  # writes without a deploy — a lock commit reached homesodamachine.com in 17s, measured
  # 2026-08-26. A run here lands the same lock minutes later under a commit this checkout
  # never made, and a local commit made in that window is replayed onto it: reconciliation
  # that costs the thing it reconciles.
  #
  # `cad-image.yml` and `derive.yml` start this by hand, and it is the lane for a cut the
  # laptop cannot make.
  workflow_dispatch:
    inputs:
      targets:
        description: Extra Bazel targets to union with unpublished source debt
        required: false
        type: string
      all:
        description: Rebuild every artifact rule (toolchain recovery or explicit audit)
        required: false
        default: false
        type: boolean
      source_only:
        description: Advance a zero-CAD source while preserving unpaid Quick Start debt
        required: false
        default: false
        type: boolean

# ONE PUBLISH AT A TIME, AND EVERY ONE OF THEM FINISHES. A run ends by writing the lock — the
# receipt naming the source commit and the bundle built from it — and that receipt is how new
# GEOMETRY reaches the site, so a run that does not finish is a solid that never arrives. The
# site's own code does not come this way (`render.yaml`'s buildFilter names `web/**` too), so a
# page waits on nobody here; what waits is the artwork this run redraws.
# Several sessions commit into this checkout at once and a run takes minutes, so requests do pile
# up behind the one building; GitHub holds a single request there and collapses the rest to the
# newest, which is the one worth the runner.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  packages: read

jobs:
  # THE MACHINE THAT PINS THE LOCK MUST BE THE MACHINE THAT CUTS, and for this repo there is
  # only one of those. A bundle is content-addressed over its members, so the lock converges
  # only while one OpenCASCADE writes it — `cad-requirements.txt` says the canonicalization
  # holds "across runs of ONE OCC build", and `cadquery-ocp 7.8.1.1.post1` ships a
  # macosx_11_0_arm64 wheel and a manylinux_2_31_x86_64 one at that same pin. Two publishers on
  # two wheels do not converge, they alternate: measured over four consecutive publishes on
  # 2026-08-23, the same 95 of 124 members flipped on every handoff, both directions.
  #
  # SO THIS LANE IS arm64 macOS, which is what the Mac that cuts these is. Measured head to
  # head on run 32726925012, same commit and same lock: macos-arm64 differs from the lock on 12
  # of 124 members, ubuntu-x64 on 95. `macos-latest` is macos-26-arm64, Apple M1, so it resolves
  # the same wheel rather than merely a similar one.
  #
  # AND IT NEEDS NO CONTAINER, WHICH IS WHY THIS IS AFFORDABLE. `container:` is Linux-only, and
  # the ci-image exists for tools this job never reaches: blender and rsvg-convert are for
  # `//:appliance-model` and the freestyle sieve, and `//:appliance-model` is an rdep of nothing
  # but `//:everything`. What publish actually builds is the artifact slice and `//:cad-art`,
  # and what those want is CadQuery, node, gh, ImageMagick and rsvg-convert. `derive` still runs
  # in the image on Linux because it builds the whole graph, blender included — and it pins no
  # solids, so it cannot move the lock.
  publish:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # THE BROWSER IS NOT IN node_modules AND SO IS NOT RESTORED WITH IT. puppeteer downloads
    # Chrome to a cache directory beside the package, not inside it, and `//:cad-art` drives a
    # real one through `render-step-posed.js`. Naming the directory inside the workspace is
    # what lets one `actions/cache` entry hold the browser and the modules together — the
    # image did the same thing with PUPPETEER_CACHE_DIR=/opt/hsm/puppeteer. `.bazelrc` already
    # passes this name through to every action, so the genrule looks where this points.
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # macOS SHIPS BASH 3.2 AND THIS WORKFLOW IS WRITTEN IN BASH 4. `/bin/bash` here is
      # 3.2.57 from 2007, held at the last GPLv2 release, and `mapfile` arrived in 4.0 — five
      # steps use it and the first one is 300 lines down, so on 3.2 this lane walks all the way
      # to "Commit the artifact lock" and dies there with `mapfile: command not found` and exit
      # 127, having already uploaded a bundle. Measured, on run 32729516384.
      #
      # ITS OWN SHELL IS PINNED TO /bin/bash BECAUSE IT IS THE STEP THAT INSTALLS THE OTHER ONE,
      # and it uses nothing 3.2 lacks. Everything after it takes `defaults.run.shell: bash`,
      # which resolves through the PATH this prepends.
      - name: A bash that has mapfile
        shell: /bin/bash -e {0}
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # AND SAY SO IF IT IS STILL 3.2, rather than letting the run reach the publish and fail
      # on a builtin. This is the first step under the resolved shell, so it is where the
      # question can be asked at all.
      - name: The shell is one this workflow is written for
        run: |
          echo "bash ${BASH_VERSION} at $(command -v bash)"
          [ "${BASH_VERSINFO[0]}" -ge 4 ] || {
            echo "::error title=bash::this lane resolved bash ${BASH_VERSION}; the workflow needs 4+ for mapfile"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # THE 840 MB THE IMAGE USED TO CARRY. Keyed on the files that name the environment, which
      # is what the OCI digest was doing before — Bazel cannot see the CAD interpreter as an
      # action input, so the environment has to namespace its own caches. `hashFiles` is
      # evaluated at step time, after checkout, which a job-level `env:` would not be.
      - name: The CAD environment, cached
        id: cadenv
        uses: actions/cache@v4
        with:
          path: |
            tools/cad-venv
            tools/render/node_modules
            web/node_modules
            .cache/puppeteer
          key: cadenv-macos-arm64-v2-${{ hashFiles('tools/cad-requirements.txt', 'tools/cad-venv-site/**', 'tools/render/package-lock.json', 'web/package-lock.json') }}

      # rsvg-convert IS NOT AN OPTIONAL TOOL, IT IS A SILENT ONE. `appliance_quickstart.py`
      # shells out to it and catches the missing binary — "rsvg-convert not found on PATH;
      # skipping PDF generation." A runner without it does not fail, it produces less and
      # reports green, which is the worse of the two.
      - name: The CAD environment
        run: |
          brew list librsvg    >/dev/null 2>&1 || brew install librsvg
          brew list imagemagick >/dev/null 2>&1 || brew install imagemagick
          # `python`, NOT `python3.13`: setup-python puts the interpreter on PATH under the
          # plain name and the versioned one is not guaranteed. This is the form run
          # 32726925012 built the whole graph with.
          if [ ! -x tools/cad-venv/bin/python ]; then
            python -m venv tools/cad-venv
            tools/cad-venv/bin/pip install --quiet --upgrade pip
            tools/cad-venv/bin/pip install --quiet -r tools/cad-requirements.txt
          fi
          tools/cad-venv/bin/python -c "import sys; assert sys.version_info[:2]==(3,13), sys.version"
          tools/cad-venv/bin/python tools/cad-venv-site/install.py
          [ -d tools/render/node_modules ] || npm --prefix tools/render ci --no-audit --no-fund
          [ -d web/node_modules ] || npm --prefix web ci --omit=dev --no-audit --no-fund
          # ASKED FOR SEPARATELY, BECAUSE A RESTORED node_modules DOES NOT CARRY THE BROWSER.
          # puppeteer's postinstall is what fetches Chrome, so a cache hit that skips `npm ci`
          # skips the download too — and `//:cad-art` then dies 473 s into the build with
          # "Could not find Chrome", which is run 32730234942. The command is idempotent and
          # returns immediately when the browser is already in PUPPETEER_CACHE_DIR.
          mkdir -p "$PUPPETEER_CACHE_DIR"
          ( cd tools/render && npx --no-install puppeteer browsers install chrome )
          tools/cad-venv/bin/python tools/cad-venv-site/install.py --check
          tools/cad-venv/bin/python -c "import cadquery; print('cadquery', cadquery.__version__)"
          rsvg-convert --version
          magick -version | head -1
          mkdir -p .cache "$HOME/.cache/bazel-disk"

      # `.bazelrc` NAMES TWO MOUNT PAIRS AND BAZEL REFUSES ONE WHOSE SOURCE IS ABSENT. On this
      # runner /opt/homebrew is the real brew prefix and already there; /usr/local/bin may not
      # be, and an empty directory satisfies the pair either way.
      - name: The sandbox mount pairs
        run: sudo mkdir -p /opt/homebrew/bin /usr/local/bin

      # WRITTEN ONCE SO EVERY BAZEL IN THIS JOB READS IT. Passing --disk_cache on the build
      # command line and not on `sync_tree`'s `--check_up_to_date` makes the two disagree about
      # the same outputs: nine stale actions on //:tpu-o-ring measured locally, twenty-two on
      # //:cad-art in run 32731505916, on a build that had completed successfully seconds
      # earlier. `.bazelrc` try-imports this, so the flag reaches the checks and the queries too.
      - name: The flags every bazel in this job reads
        run: |
          printf 'build --disk_cache=%s/.cache/bazel-disk\n' "$HOME" > .bazelrc.ci
          cat .bazelrc.ci

      - name: The locked inputs
        run: node web/scripts/fetch-cad-artifacts.mjs

      - name: The checked build graph
        # NOTHING HERE HOLDS THE PUBLISH. `gen_build.py` has already written the current graph
        # to this checkout's BUILD.bazel, so the drift is named and the run builds the
        # regenerated file. Refusing here stopped the bundle, the lock and the deploy over a
        # file this very step had already brought current on the disk.
        run: |
          tools/cad-venv/bin/python tools/bazel/gen_build.py
          if ! git diff --quiet -- BUILD.bazel; then
            echo "::warning title=build-graph::BUILD.bazel is behind tools/bazel/gen_build.py — this run builds the regenerated graph"
            git --no-pager diff --stat -- BUILD.bazel
          fi

      # The CAD lock source and the Quick Start sidecar provenance are independent accumulation
      # points. A canceled producer loses no debt, and an unrelated source can advance without
      # falsely claiming that an unrendered guide was published.
      - name: The affected artifact rules
        id: scope
        env:
          REQUESTED: ${{ inputs.targets }}
          SOURCE_ONLY: ${{ inputs.source_only }}
        run: |
          : > /tmp/cad-requested
          if [ -n "$REQUESTED" ]; then
            printf '%s\n' "$REQUESTED" | tr ', ' '\n\n' | sed '/^$/d' | \
              awk '{ if ($0 ~ /^\/\//) print; else { sub(/^:/, ""); print "//:" $0 } }' | \
              sort -u > /tmp/cad-requested
          fi

          quickstart=false
          quickstart_art=false
          source_only=${SOURCE_ONLY:-false}
          # `everything` is the normal aggregate rdep beside concrete targets. The selector
          # emits it alone only when a risky input cannot be scoped to a producer.
          only_aggregate() {
            [ "$(sed '/^[[:space:]]*$/d')" = '//:everything' ]
          }
          if [ "$source_only" = true ] && \
             { [ -n "$REQUESTED" ] || [ "${{ inputs.all }}" = true ]; }; then
            echo "source_only cannot request build targets or a full rebuild" >&2
            exit 1
          fi
          if grep -qx '//:quickstart-build' /tmp/cad-requested; then
            quickstart=true
            grep -vx '//:quickstart-build' /tmp/cad-requested \
              > /tmp/cad-requested.without-quickstart || true
            mv /tmp/cad-requested.without-quickstart /tmp/cad-requested
          fi
          if grep -qx '//:cad-art' /tmp/cad-requested; then
            quickstart_art=true
            grep -vx '//:cad-art' /tmp/cad-requested \
              > /tmp/cad-requested.without-quickstart-art || true
            mv /tmp/cad-requested.without-quickstart-art /tmp/cad-requested
          fi

          base=$(tools/cad-venv/bin/python -c \
            'import json; print(json.load(open("hardware/cad-artifacts.lock.json")).get("source", {}).get("commit", ""))')
          if [ -n "$base" ]; then
            git cat-file -e "$base^{commit}" 2>/dev/null || \
              git fetch --no-tags --depth=1 origin "$base"
            git cat-file -e "$base^{commit}"
          fi
          quickstart_base=""
          quickstart_art_base=""
          if [ "$source_only" != true ]; then
            quickstart_base=$(tools/cad-venv/bin/python -c \
              'import json; d=json.load(open("hardware/quickstart/quick-start.pdf.json")); print(d.get("provenance", {}).get("sheet", {}).get("commit", ""))')
            quickstart_art_base=$(tools/cad-venv/bin/python -c \
              'import json; d=json.load(open("hardware/quickstart/quick-start.pdf.json")); print(d.get("provenance", {}).get("art", {}).get("commit", ""))')
            if [ -z "$quickstart_base" ]; then
              # Bootstrap the independent producer marker from the last committed canonical
              # PDF. Once the first migrated bind lands, the sidecar carries this directly.
              git fetch --deepen=100 origin main
              quickstart_base=$(git log -1 --format=%H -- \
                hardware/quickstart/quick-start.pdf)
            fi
            if [ -n "$quickstart_base" ]; then
              git cat-file -e "$quickstart_base^{commit}" 2>/dev/null || \
                git fetch --no-tags --depth=1 origin "$quickstart_base"
              git cat-file -e "$quickstart_base^{commit}"
            fi
            if [ -n "$quickstart_art_base" ]; then
              git cat-file -e "$quickstart_art_base^{commit}" 2>/dev/null || \
                git fetch --no-tags --depth=1 origin "$quickstart_art_base"
              git cat-file -e "$quickstart_art_base^{commit}"
            fi
          fi

          : > /tmp/quickstart-sources
          if [ "$source_only" != true ] && [ -n "$quickstart_base" ]; then
            git diff --name-only --no-renames "$quickstart_base" "$GITHUB_SHA" | while IFS= read -r path; do
              case "$path" in
                hardware/quickstart/studies/*|hardware/quickstart/art/*|\
                hardware/quickstart/README.md|\
                hardware/quickstart/quick-start.cover.png|\
                hardware/quickstart/quick-start.pdf|\
                hardware/quickstart/quick-start.pdf.json) ;;
                hardware/quickstart/*) printf '%s\n' "$path" ;;
              esac
            done > /tmp/quickstart-sources
            if [ -s /tmp/quickstart-sources ]; then
              quickstart=true
            fi
          fi
          # The tracked artwork is the materialized boundary between product CAD and the
          # sheets. Once the migration run refreshes it explicitly, this source range proves
          # whether its real producer inputs moved. Layout-only work reaches quickstart-build,
          # never cad-art, and therefore binds the current bytes without recutting CAD.
          : > /tmp/quickstart-debt
          : > /tmp/quickstart-art-debt
          if [ "$source_only" != true ]; then
            if [ -z "$quickstart_base" ]; then
              quickstart=true
            else
              tools/cad-venv/bin/python tools/bazel/affected.py \
                --base "$quickstart_base" --head "$GITHUB_SHA" > /tmp/quickstart-debt
              # `//:everything` is the repository aggregate and is an rdep of every
              # declared source. It is not evidence that either Quick Start producer
              # moved. The concrete label preserves the sheet/art boundary.
              if grep -qx '//:quickstart-build' /tmp/quickstart-debt; then
                quickstart=true
              fi
              if only_aggregate < /tmp/quickstart-debt; then
                echo "ambiguous Quick Start dependency change; rebuilding both producers" >&2
                quickstart=true
                quickstart_art=true
              fi
            fi
            if [ -z "$quickstart_art_base" ]; then
              # One migration refresh establishes the independently tracked artwork cut.
              quickstart_art=true
            else
              tools/cad-venv/bin/python tools/bazel/affected.py \
                --base "$quickstart_art_base" --head "$GITHUB_SHA" \
                > /tmp/quickstart-art-debt
              if grep -qx '//:cad-art' /tmp/quickstart-art-debt; then
                quickstart_art=true
              fi
              if only_aggregate < /tmp/quickstart-art-debt; then
                echo "ambiguous Quick Start artwork dependency change; rebuilding art" >&2
                quickstart_art=true
              fi
            fi
          fi
          if [ "$quickstart_art" = true ]; then
            quickstart=true
          fi
          if [ -z "$base" ] || [ "${{ inputs.all }}" = "true" ]; then
            tools/cad-venv/bin/python tools/bazel/affected.py --all-artifacts \
              > /tmp/cad-accumulated
          else
            tools/cad-venv/bin/python tools/bazel/affected.py \
              --base "$base" --head "$GITHUB_SHA" --artifacts > /tmp/cad-accumulated
          fi
          # Scorecards are generated outputs, so ordinary source-range analysis deliberately
          # ignores their publication commits. Their hashes answer the remaining question:
          # legacy/mismatched evidence explicitly rebuilds only its owning producers.
          tools/cad-venv/bin/python tools/cad-artifacts/pack.py --sidecar-debt \
            > /tmp/cad-sidecar-debt
          cat /tmp/cad-accumulated /tmp/cad-requested /tmp/cad-sidecar-debt | \
            sed '/^[[:space:]]*$/d' | sort -u > /tmp/cad-targets
          count=$(wc -l < /tmp/cad-targets | tr -d ' ')
          if [ "$source_only" = true ] && [ "$count" != 0 ]; then
            echo "source_only refused: this source owes $count CAD artifact target(s)" >&2
            cat /tmp/cad-targets >&2
            exit 1
          fi
          {
            echo "count=$count"
            echo "quickstart=$quickstart"
            echo "quickstart_art=$quickstart_art"
            echo 'targets<<CAD_TARGETS'
            cat /tmp/cad-targets
            echo 'CAD_TARGETS'
          } >> "$GITHUB_OUTPUT"
          echo "$count artifact target(s)"
          sed 's/^/  /' /tmp/cad-targets
          if [ "$quickstart" = true ]; then
            echo "canonical Quick Start owed by:"
            sed 's/^/  /' /tmp/quickstart-sources
          fi
          if [ "$quickstart_art" = true ]; then
            echo "canonical Quick Start artwork is owed"
          fi

      - name: Restore the drawn solids
        if: steps.scope.outputs.count != '0' || steps.scope.outputs.quickstart == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/realized
            .cache/boxes
            .cache/meshes
          key: realized-macos-arm64-${{ hashFiles('tools/cad-requirements.txt', '.bazelversion') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: realized-macos-arm64-${{ hashFiles('tools/cad-requirements.txt', '.bazelversion') }}-

      - name: Restore the Bazel disk cache
        if: steps.scope.outputs.count != '0' || steps.scope.outputs.quickstart == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-macos-arm64-${{ hashFiles('tools/cad-requirements.txt', '.bazelversion') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bazel-macos-arm64-${{ hashFiles('tools/cad-requirements.txt', '.bazelversion') }}-

      - name: Build the affected artifact rules
        if: steps.scope.outputs.count != '0'
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          mapfile -t targets < <(printf '%s\n' "$TARGETS" | sed '/^[[:space:]]*$/d')
          [ "${#targets[@]}" -gt 0 ] || exit 0
          bazel build "${targets[@]}"

      - name: Build the canonical Quick Start artwork
        if: steps.scope.outputs.quickstart_art == 'true'
        run: bazel build //:cad-art

      - name: Carry the canonical Quick Start artwork
        if: steps.scope.outputs.quickstart_art == 'true'
        run: |
          tools/cad-venv/bin/python tools/bazel/sync_tree.py --write \
            --targets //:cad-art
          # NAMED, NOT REFUSED. The commit step below stages the artwork by its declared
          # `writes`, so a file outside them is reported here and reaches no commit either
          # way — and holding the whole publish over it kept the bundle, the lock and every
          # solid in this cut off the site.
          unexpected=$(git diff --name-only -- hardware/quickstart | \
            grep -Ev '^hardware/quickstart/art/' || true)
          if [ -n "$unexpected" ]; then
            echo "the Quick Start artwork carry moved files outside its declared directory:" >&2
            sed 's/^/  /' <<< "$unexpected" >&2
            echo "::warning title=quickstart-art-carry::the artwork carry moved files outside hardware/quickstart/art/; they are not staged"
          fi

      - name: Verify and carry the complete cut
        if: steps.scope.outputs.count != '0'
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          set +e
          tools/cad-venv/bin/python tools/cad-artifacts/cut_vs_lock.py \
            --annotate --assume-fresh --targets "$TARGETS"
          rc=$?
          set -e
          [ "$rc" -le 1 ]
          tools/cad-venv/bin/python tools/bazel/sync_tree.py --write --runtime-only \
            --targets "$TARGETS"

      - name: Bind only the canonical Quick Start
        if: steps.scope.outputs.quickstart == 'true'
        run: |
          bind_root=$(mktemp -d)
          trap 'rm -rf "$bind_root"' EXIT
          HSM_BIND_ROOT="$bind_root" tools/cad-venv/bin/python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path.cwd()
          target = Path(os.environ["HSM_BIND_ROOT"])
          node = json.loads((source / "tools/bazel/graph.json").read_text())[
              "hardware/quickstart/_build.py"
          ]
          outputs = set(node["writes"])
          for rel in node["reads"]:
              if rel in outputs:
                  continue
              src = source / rel
              if not src.is_file():
                  raise SystemExit(f"declared Quick Start input is absent: {rel}")
              dst = target / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY
          for d in tools/render/node_modules web/node_modules hardware/pcb/pcba/node_modules; do
            mkdir -p "$bind_root/$(dirname "$d")"
            ln -sfn "$GITHUB_WORKSPACE/$d" "$bind_root/$d"
          done
          (
            cd "$bind_root"
            HSM_REPO_ROOT="$bind_root" HSM_NO_BUILD_LOCK=1 \
              "$GITHUB_WORKSPACE/tools/cad-venv/bin/python" \
              hardware/quickstart/_build.py
          )
          art_source=$(tools/cad-venv/bin/python -c \
            'import json; d=json.load(open("hardware/quickstart/quick-start.pdf.json")); print(d.get("provenance", {}).get("art", {}).get("commit", ""))')
          if [ "${{ steps.scope.outputs.quickstart_art }}" = true ]; then
            art_source="$GITHUB_SHA"
          fi
          # RECOVERED FROM HISTORY BEFORE IT IS CALLED MISSING. The art commit accumulates in the
          # tracked sidecar, and `_build.py` declares that sidecar among its writes — so a carry
          # of a sandbox build, which has no git and writes no provenance, lands a copy without
          # it. Anyone who then commits that has armed this step to stop the next publish over a
          # fact still sitting in the previous commit. Read it from there instead.
          if [ -z "$art_source" ]; then
            art_source=$(git show HEAD:hardware/quickstart/quick-start.pdf.json 2>/dev/null | \
              tools/cad-venv/bin/python -c \
              'import json,sys; print(json.load(sys.stdin).get("provenance", {}).get("art", {}).get("commit", ""))' \
              2>/dev/null || true)
            if [ -n "$art_source" ]; then
              echo "::warning title=quickstart-provenance::the working sidecar names no artwork provenance; recovered ${art_source} from HEAD"
            fi
          fi
          if [ -z "$art_source" ]; then
            echo "the canonical Quick Start bind has no artwork provenance, and HEAD names none either" >&2
            exit 1
          fi
          HSM_BIND_ROOT="$bind_root" HSM_SHEET_SOURCE="$GITHUB_SHA" \
            HSM_ART_SOURCE="$art_source" tools/cad-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          sidecar = Path(os.environ["HSM_BIND_ROOT"]) / \
              "hardware/quickstart/quick-start.pdf.json"
          data = json.loads(sidecar.read_text())
          data["provenance"] = {
              "sheet": {"commit": os.environ["HSM_SHEET_SOURCE"]},
              "art": {"commit": os.environ["HSM_ART_SOURCE"]},
          }
          sidecar.write_text(json.dumps(data, indent=2) + "\n")
          PY
          cp "$bind_root/hardware/quickstart/quick-start.cover.png" \
            hardware/quickstart/quick-start.cover.png
          cp "$bind_root/hardware/quickstart/quick-start.pdf" \
            hardware/quickstart/quick-start.pdf
          cp "$bind_root/hardware/quickstart/quick-start.pdf.json" \
            hardware/quickstart/quick-start.pdf.json
          allowed='^(hardware/quickstart/quick-start\.cover\.png|hardware/quickstart/quick-start\.pdf|hardware/quickstart/quick-start\.pdf\.json)$'
          if [ "${{ steps.scope.outputs.quickstart_art }}" = true ]; then
            allowed='^(hardware/quickstart/art/.*|hardware/quickstart/quick-start\.cover\.png|hardware/quickstart/quick-start\.pdf|hardware/quickstart/quick-start\.pdf\.json)$'
          fi
          # NAMED, NOT REFUSED, for the same reason as the artwork carry above: the commit
          # step stages this bind's three outputs by name, so an extra file is reported and
          # committed by nothing, and the lock still reaches the site.
          unexpected=$(git diff --name-only -- hardware/quickstart | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "the Quick Start bind moved files outside its declared outputs:" >&2
            sed 's/^/  /' <<< "$unexpected" >&2
            echo "::warning title=quickstart-bind::the bind moved files outside its declared outputs; they are not staged"
          fi

      # This also advances source.commit on a zero-artifact hardware change, so Render can
      # deploy served hardware only after the artifact lock covers its source.
      - name: Publish the bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--prune` TAKES RETIRED OUTPUTS OUT OF THE TREE; `--write` PUBLISHES, AND THE SECOND
        # DOES NOT WAIT ON THE FIRST. Neither is `--retire`, which takes assets off the GitHub
        # release: the word is the same and the two operations share nothing.
        # A prune that declines to retire an output without a changed producing source (exit 2)
        # has said so, and leaving the retirement standing costs a stale pin. Failing the step
        # cost the whole cut: no bundle, no lock, no deploy.
        run: |
          set +e
          tools/cad-venv/bin/python tools/cad-artifacts/pack.py --prune
          rc=$?
          set -e
          if [ "$rc" != 0 ]; then
            echo "::warning title=prune::pack.py --prune declined (exit $rc); publishing this cut with the retirement standing"
          fi
          tools/cad-venv/bin/python tools/cad-artifacts/pack.py --write

      - name: Commit the artifact lock
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t sidecar_outputs < <(
            tools/cad-venv/bin/python -c \
              'import json; [print(path) for path in json.load(open("hardware/cad-artifacts.lock.json")).get("sidecars", {})]'
          )
          sidecar_targets=(//:cold-core-assembly //:enclosure-assembly)

          quickstart_sources_between() {
            git diff --name-only --no-renames "$1" "$2" | while IFS= read -r path; do
              case "$path" in
                hardware/quickstart/studies/*|hardware/quickstart/art/*|\
                hardware/quickstart/README.md|\
                hardware/quickstart/quick-start.cover.png|\
                hardware/quickstart/quick-start.pdf|\
                hardware/quickstart/quick-start.pdf.json) ;;
                hardware/quickstart/*) printf '%s\n' "$path" ;;
              esac
            done
          }

          queue_latest() {
            echo "queueing publication from the current main tip"
            if [ "$#" -gt 0 ]; then
              requested=$(IFS=,; echo "$*")
              gh workflow run publish.yml --ref main -f targets="$requested"
            else
              gh workflow run publish.yml --ref main
            fi
            echo "queued=true" >> "$GITHUB_OUTPUT"
          }

          lock_sidecars_are_pinned() {
            ref=$1
            git show "$ref:hardware/cad-artifacts.lock.json" > /tmp/candidate-lock.json || \
              return 1
            candidate_count=$(tools/cad-venv/bin/python -c \
              'import json; print(len(json.load(open("/tmp/candidate-lock.json")).get("sidecars", {})))')
            [ "$candidate_count" = "${#sidecar_outputs[@]}" ] || return 1
            for path in "${sidecar_outputs[@]}"; do
              expected=$(PATH_IN_LOCK="$path" tools/cad-venv/bin/python -c \
                'import json,os; print(json.load(open("/tmp/candidate-lock.json")).get("sidecars", {}).get(os.environ["PATH_IN_LOCK"], ""))')
              [ -n "$expected" ] || return 1
              git show "$ref:$path" > /tmp/candidate-sidecar.json 2>/dev/null || return 1
              actual=$(sha256sum /tmp/candidate-sidecar.json | awk '{print $1}')
              [ "$actual" = "$expected" ] || return 1
            done
          }

          git config user.name  "Derek Bredensteiner"
          git config user.email "derekbreden@gmail.com"
          git add hardware/cad-artifacts.lock.json
          # The lock says exactly which public scorecards belong to this cut. Stage no general
          # JSON/docs output here; a scoped CAD publication stays a viewer-runtime lane.
          if [ "${#sidecar_outputs[@]}" -gt 0 ]; then
            git add -- "${sidecar_outputs[@]}"
          fi
          mapfile -t retired_sidecar_outputs < <(
            git diff --name-only --diff-filter=D -- \
              ':(glob)hardware/**/*.scorecard.json'
          )
          if [ "${#retired_sidecar_outputs[@]}" -gt 0 ]; then
            git add -u -- "${retired_sidecar_outputs[@]}"
          fi
          # The Quick Start's sheet and pictures are members of the bundle `pack.py --write`
          # just uploaded, and `.gitignore` holds them out of the index. Staging them here is
          # `git add` against an ignored path.
          if git diff --cached --quiet; then
            echo "the lock and canonical Quick Start already cover this source"
            exit 0
          fi
          git commit -m "Publish ${GITHUB_SHA:0:8}"
          base="$GITHUB_SHA"

          for attempt in 1 2 3; do
            git fetch --deepen=100 origin main
            tip=$(git rev-parse origin/main)
            if [ "$tip" != "$base" ]; then
              if ! git diff --quiet "$base" "$tip" -- hardware/cad-artifacts.lock.json; then
                source=$(git show "$tip:hardware/cad-artifacts.lock.json" | \
                  tools/cad-venv/bin/python -c \
                    'import json,sys; print(json.load(sys.stdin).get("source", {}).get("commit", ""))')
                if [ -n "$source" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$source" && \
                   lock_sidecars_are_pinned "$tip"; then
                  echo "a newer artifact lock already covers this source"
                  lock_commit=$(git log -1 --format=%H "$base..$tip" -- \
                    hardware/cad-artifacts.lock.json)
                  echo "published=$lock_commit" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                queue_latest "${sidecar_targets[@]}"
                exit 0
              fi

              if [ "${#sidecar_outputs[@]}" -gt 0 ] && \
                 ! git diff --quiet "$base" "$tip" -- "${sidecar_outputs[@]}"; then
                echo "a generated scorecard moved outside this lock cut"
                queue_latest "${sidecar_targets[@]}"
                exit 0
              fi

              newer=$(tools/cad-venv/bin/python tools/bazel/affected.py \
                --base "$base" --head "$tip" --artifacts)
              if [ -n "$newer" ]; then
                echo "newer CAD inputs reached main"
                queue_latest
                exit 0
              fi

              newer_quickstart=$(quickstart_sources_between "$base" "$tip")
              if [ -n "$newer_quickstart" ]; then
                echo "newer Quick Start sources reached main:"
                sed 's/^/  /' <<< "$newer_quickstart"
                queue_latest
                exit 0
              fi

              newer_affected=$(tools/cad-venv/bin/python tools/bazel/affected.py \
                --base "$base" --head "$tip")
              newer_quickstart=$(grep -E '^//:(quickstart-build|cad-art)$' \
                <<< "$newer_affected" || true)
              if [ -n "$newer_quickstart" ]; then
                echo "newer Quick Start producer inputs reached main"
                mapfile -t newer_quickstart_targets <<< "$newer_quickstart"
                queue_latest "${newer_quickstart_targets[@]}"
                exit 0
              fi
              if [ "$(sed '/^[[:space:]]*$/d' <<< "$newer_affected")" = \
                   '//:everything' ]; then
                echo "newer inputs cannot be scoped to a concrete Quick Start producer"
                queue_latest
                exit 0
              fi

              SOURCE_COMMIT="$tip" tools/cad-venv/bin/python -c \
                'import json,os; from pathlib import Path; p=Path("hardware/cad-artifacts.lock.json"); d=json.loads(p.read_text()); d["source"]={"commit":os.environ["SOURCE_COMMIT"]}; p.write_text(json.dumps(d, indent=2)+"\n")'
              git add hardware/cad-artifacts.lock.json
              git commit --amend --no-edit
              git rebase origin/main
              base="$tip"
            fi
            if git push origin HEAD:main; then
              echo "published=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved under the lock push — retrying ($attempt/3)"
          done
          echo "could not publish the artifact lock after three tries" >&2
          exit 1

      # Persistence starts after the lock push, outside the public stale-window critical path.
      - name: Save the drawn solids
        if: always() && (steps.scope.outputs.count != '0' || steps.scope.outputs.quickstart == 'true')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/realized
            .cache/boxes
            .cache/meshes
          key: realized-macos-arm64-${{ hashFiles('tools/cad-requirements.txt', '.bazelversion') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the Bazel disk cache
        if: always() && (steps.scope.outputs.count != '0' || steps.scope.outputs.quickstart == 'true')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-macos-arm64-${{ hashFiles('tools/cad-requirements.txt', '.bazelversion') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify the production deployment
        if: steps.commit.outputs.published != ''
        env:
          EXPECTED: ${{ steps.commit.outputs.published }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_QUICKSTART: ${{ steps.scope.outputs.quickstart }}
        run: |
          published_mesh=$(git show "$EXPECTED:hardware/cad-artifacts.lock.json" | \
            tools/cad-venv/bin/python -c \
              'import json,sys; print(json.load(sys.stdin)["solids"]["hardware/manifold-layout/enclosure-assembly.step.mesh"])')
          published_scorecard=$(git show "$EXPECTED:hardware/cad-artifacts.lock.json" | \
            tools/cad-venv/bin/python -c \
              'import json,sys; print(json.load(sys.stdin)["sidecars"]["hardware/manifold-layout/enclosure-assembly.scorecard.json"])')
          published_quickstart=""
          if [ "$VERIFY_QUICKSTART" = true ]; then
            published_quickstart=$(git show \
              "$EXPECTED:hardware/quickstart/quick-start.pdf" | sha256sum | awk '{print $1}')
          fi
          for attempt in $(seq 1 90); do
            live=$(curl -fsS https://homesodamachine.com/api/version 2>/dev/null | \
              tools/cad-venv/bin/python -c \
                'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)
            covered=false
            [ "$live" = "$EXPECTED" ] && covered=true
            if [ -n "$live" ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED...$live" \
                --jq .status 2>/dev/null || true)
              if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
                covered=true
              fi
            fi
            if [ "$covered" = true ]; then
              expected_mesh="$published_mesh"
              expected_scorecard="$published_scorecard"
              expected_quickstart="$published_quickstart"
              if [ "$live" != "$EXPECTED" ]; then
                rm -f /tmp/live-lock.json
                gh api -H 'Accept: application/vnd.github.raw+json' \
                  "repos/$GITHUB_REPOSITORY/contents/hardware/cad-artifacts.lock.json?ref=$live" \
                  > /tmp/live-lock.json 2>/dev/null || true
                expected_mesh=$( \
                  tools/cad-venv/bin/python -c \
                    'import json; print(json.load(open("/tmp/live-lock.json"))["solids"]["hardware/manifold-layout/enclosure-assembly.step.mesh"])' \
                  2>/dev/null || true)
                expected_scorecard=$( \
                  tools/cad-venv/bin/python -c \
                    'import json; print(json.load(open("/tmp/live-lock.json"))["sidecars"]["hardware/manifold-layout/enclosure-assembly.scorecard.json"])' \
                  2>/dev/null || true)
                if [ "$VERIFY_QUICKSTART" = true ]; then
                  expected_quickstart=""
                  if gh api -H \
                    'Accept: application/vnd.github.raw+json' \
                    "repos/$GITHUB_REPOSITORY/contents/hardware/quickstart/quick-start.pdf?ref=$live" \
                    > /tmp/expected-quick-start.pdf 2>/dev/null; then
                    expected_quickstart=$(sha256sum /tmp/expected-quick-start.pdf | \
                      awk '{print $1}')
                  fi
                fi
              fi
              mesh=""
              if curl -fsS \
                https://homesodamachine.com/meshes/manifold-layout/enclosure-assembly.step.mesh \
                -o /tmp/live-enclosure-assembly.step.mesh; then
                mesh=$(sha256sum /tmp/live-enclosure-assembly.step.mesh | awk '{print $1}')
              fi
              quickstart=""
              scorecard=""
              if curl -fsS \
                https://homesodamachine.com/api/step-scorecard/manifold-layout/enclosure-assembly.scorecard.json \
                -o /tmp/live-enclosure-assembly.scorecard.json; then
                scorecard=$(sha256sum /tmp/live-enclosure-assembly.scorecard.json | \
                  awk '{print $1}')
              fi
              quickstart_ok=true
              if [ "$VERIFY_QUICKSTART" = true ]; then
                quickstart_ok=false
                if curl -fsS https://homesodamachine.com/docs/quickstart/quick-start.pdf \
                  -o /tmp/live-quick-start.pdf; then
                  quickstart=$(sha256sum /tmp/live-quick-start.pdf | awk '{print $1}')
                fi
                if [ -n "$expected_quickstart" ] && \
                   [ "$quickstart" = "$expected_quickstart" ]; then
                  quickstart_ok=true
                fi
              fi
              if [ -n "$expected_mesh" ] && [ "$mesh" = "$expected_mesh" ] && \
                 [ -n "$expected_scorecard" ] && [ "$scorecard" = "$expected_scorecard" ] && \
                 [ "$quickstart_ok" = true ]; then
                echo "production serves $live with locked assembly mesh $mesh and scorecard $scorecard"
                if [ "$VERIFY_QUICKSTART" = true ]; then
                  echo "production serves canonical Quick Start PDF $quickstart"
                fi
                exit 0
              fi
              echo "production version is covered; waiting for assembly mesh (expected ${expected_mesh:-unavailable}; got ${mesh:-unavailable})"
              echo "waiting for current assembly scorecard (expected ${expected_scorecard:-unavailable}; got ${scorecard:-unavailable})"
              if [ "$VERIFY_QUICKSTART" = true ]; then
                echo "waiting for canonical Quick Start PDF (expected ${expected_quickstart:-unavailable}; got ${quickstart:-unavailable})"
              fi
            else
              echo "waiting for Render ($attempt/90; live ${live:-unavailable})"
            fi
            sleep 10
          done
          echo "Render did not serve the published lock and verified public assets within 15 minutes" >&2
          exit 1
