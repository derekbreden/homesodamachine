# WHICH CLOUD RUNNER CUTS THIS GEOMETRY FASTEST, measured rather than reasoned about.
#
# MEASURED, run 32441067918, both lanes carrying the whole toolchain:
#
#   local Mac      8 cores               269 s wall   259 s critical path
#   macos-latest   M1, 3 cores           526 s wall   315 s critical path
#   ubuntu-latest  EPYC 7763, 4 cores    766 s wall   454 s critical path
#
# macOS wins on both figures. Two things those numbers teach that no single one of them does:
#
# CORE COUNT AND CLOCK BOTH MATTER, AND WHICH ONE DOMINATES DEPENDS ON THE BOX. On this Mac
# wall and critical path are 269 and 259, so the parallel work hides under the chain and it is
# easy to conclude cores are free. On a 3-core runner the same work stands 200 s clear of the
# chain. "96% critical path" is a fact about an 8-core machine, not about this build.
#
# AND A FIGURE FROM THIS BENCH IS OF THE GRAPH THAT ACTUALLY EXECUTED. A generator that
# catches a missing binary and skips its output rather than failing leaves a run that is
# green, short, and of less work than the name suggests — a runner without `rsvg-convert`
# once cost this bench 80 s on macOS that way. Read the action count beside any wall time.
#
# WHAT THIS BENCH DOES NOT MEASURE, and neither number should be read as though it does:
#
#   A QUEUE. This times one lane alone. `derive` runs the same lane behind
#   `concurrency: group: derive`, and a run there has sat sixteen minutes waiting. The queued
#   figure is the one anybody waiting on the site actually feels.
#
#   WHETHER A TARGET IS GREEN ANYWHERE ELSE. This lane installs its toolchain; `derive` pulls
#   an image; this Mac has had both for months. A target can be red in one and green in the
#   other for reasons that touch no line of the code it builds — //:cards-build failed on a
#   runner with `Could not find Chrome` while rendering every card cleanly here, because a
#   bazel action sees only the environment `.bazelrc` names and PUPPETEER_CACHE_DIR was not
#   in it. A green here is evidence about here.
#
#   BYTES. This asserts on seconds only. It cannot tell whether a linux OCC writes the STEP
#   bytes a macOS OCC writes, and an assertion added here would not either without
#   `tools/bazel/sync_tree.py` between the build and the assertion — bazel cuts into
#   `bazel-bin` and this repo commits its tree, so without the carry every check reads the
#   solids `fetch-cad-artifacts.mjs` put there and compares the lock against the lock.
#
# IT IS `workflow_dispatch` ON PURPOSE. It is an instrument, not a gate — nothing should be
# waiting on it, and it should not fire on every push while we are still choosing a lane.
#
# TWO LANES, BECAUSE THE PIN LEAVES TWO. `tools/cad-requirements.txt` names the cp313 wheels
# that have to exist, and between them they rule out both of the runners you would otherwise
# reach for:
#
#   ubuntu-24.04-arm  free, 4 vCPU, 16 GB — cadquery-ocp 7.8.1.1.post1 publishes no
#                     linux aarch64 wheel, so the toolchain cannot be installed at all.
#   macos-*-intel     free, 4 vCPU, 14 GB — nlopt 2.10.0 publishes macosx arm64,
#                     manylinux x86_64 and win_amd64, and no macosx x86_64.
#
# Both were tried in run 32439389331 and both failed on exactly that. What remains is Apple
# Silicon and Linux x86_64, and the repo is public, so both are free and unlimited.
#
# THE TWO LANES ARE NOT EQUALLY IMPROVABLE, which matters when reading their seconds against
# each other. GitHub Actions `container:` jobs are Linux-only, so the Linux lane can pull a
# prebuilt image and delete its toolchain rows outright, while macos-latest must install the
# toolchain on every run for as long as it is used. Compare cold-build seconds between the
# lanes; compare the install rows only against zero.

name: cad-runner-bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The platform the build is already written for: `.bazelrc` mounts /opt/homebrew,
          # the sandbox is darwin-sandbox, the wheels are macosx_11_0_arm64. Nothing to port.
          - runner: macos-latest
            label: macos-arm64-m1
          # The free 4 vCPU / 16 GB Linux lane. Needs an empty /opt/homebrew to satisfy the
          # mount pair in `.bazelrc`; blender and node come from the image or apt.
          - runner: ubuntu-latest
            label: ubuntu-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Report the silicon
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          else
            grep -m1 'model name' /proc/cpuinfo || true
            nproc; free -g | head -2
          fi

      # THE SANDBOX MOUNT PAIR IS THE ONLY THING IN THE TREE THAT IS NOT PORTABLE. `.bazelrc`
      # names /opt/homebrew so an action can reach the brew prefix, and bazel refuses a mount
      # pair whose source is absent. An empty directory satisfies it; blender resolves from
      # /usr/bin, which that same action PATH already carries.
      - name: Satisfy the brew mount pair (Linux)
        if: runner.os == 'Linux'
        run: sudo mkdir -p /opt/homebrew/bin

      # rsvg-convert IS NOT AN OPTIONAL TOOL, IT IS A SILENT ONE. `appliance_quickstart.py`
      # shells out to it for the PDF and catches the missing binary — "rsvg-convert not found
      # on PATH; skipping PDF generation." So a runner without it does not fail, it produces
      # less and reports green, which is the worse of the two. Neither lane had it before this.
      - name: Time the system toolchain
        id: sys
        run: |
          start=$(date +%s)
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install --cask blender
            brew install librsvg
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq blender librsvg2-bin
          fi
          command -v blender || ls -d /Applications/Blender.app
          command -v rsvg-convert
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Time the CadQuery install
        id: pip
        run: |
          start=$(date +%s)
          python -m venv tools/cad-venv
          tools/cad-venv/bin/pip install -q --upgrade pip
          tools/cad-venv/bin/pip install -q -r tools/cad-requirements.txt
          tools/cad-venv/bin/python -c "import cadquery; print('cadquery', cadquery.__version__)"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "venv=$(du -sh tools/cad-venv | cut -f1)" >> "$GITHUB_OUTPUT"

      # A CLONE HAS NO SOLIDS. `.gitignore` holds `*.step` out of the tree, so what a checkout
      # carries is `cad-artifacts.lock.json` and not the geometry it names — and the graph
      # declares solids it does not produce, the reference parts among them. Bazel calls that
      # a missing input file and stops before it starts. This is the step Render already runs
      # for the same reason (render.yaml `buildCommand`), and the script imports node builtins
      # only, so it needs no `npm ci` ahead of it.
      - name: Time the locked-solid fetch
        id: fetch
        run: |
          start=$(date +%s)
          node web/scripts/fetch-cad-artifacts.mjs
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      # `//:cards-build` DRIVES A REAL CHROME. `tools/render/browser.js` imports puppeteer, so
      # the card deck needs `tools/render/node_modules` and the Chromium puppeteer downloads on
      # install — neither in the tree, both assumed present by every local build. This is the
      # second thing a clean checkout turned out to need that no machine holding it can notice.
      - name: Time the card renderer toolchain
        id: cards
        run: |
          start=$(date +%s)
          npm --prefix tools/render ci
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      # `.bazelrc.paths` carries this checkout's absolute paths and no other's, so a fresh
      # clone builds nothing until gen_build.py writes one. On a runner that is every run.
      - name: Time gen_build
        id: gen
        run: |
          start=$(date +%s)
          tools/cad-venv/bin/python tools/bazel/gen_build.py
          cat .bazelrc.paths
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      # THE NUMBER. No bazel cache, no .cache/realized — the figure to hold against the local
      # cold 269 s, and what a runner without a persistent disk pays EVERY run.
      #
      # `--keep_going` BECAUSE THE CARD DECK IS A STANDING RED. Bazel's default is to stop the
      # build at the first failed action, which truncates the elapsed figure at whatever the
      # deck happened to fail at and measures nothing. Keeping going times the whole graph and
      # still returns non-zero, which the verdict step below reads.
      #
      # A TIMING STEP MUST NOT REPORT GREEN ON A BUILD THAT FAILED. The exit code is captured
      # so the elapsed figure survives a failure, and carried to the verdict step, which fails
      # the job. Run 32439389331 passed two lanes on a build that never started; that is what
      # this shape exists to prevent.
      - name: Time a cold full build
        id: build
        run: |
          start=$(date +%s)
          set +e; bazel build --keep_going //:everything 2>&1 | tail -40; code=${PIPESTATUS[0]}; set -e
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      # What a runner WITH a persistent disk pays instead: the caches are on disk now, so a
      # second build with nothing changed is the floor a sticky disk or actions/cache buys.
      - name: Time a warm no-op build
        id: warm
        if: always()
        run: |
          start=$(date +%s)
          set +e; bazel build --keep_going //:everything 2>&1 | tail -8; set -e
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Cache sizes the warm lane would have to carry
        if: always()
        run: du -sh .cache/* 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.label }} (\`${{ matrix.runner }}\`)"
            echo ""
            echo "| step | seconds |"
            echo "|---|---:|"
            echo "| system toolchain (blender) | ${{ steps.sys.outputs.seconds }} |"
            echo "| CadQuery install (${{ steps.pip.outputs.venv }}) | ${{ steps.pip.outputs.seconds }} |"
            echo "| card renderer (puppeteer + chromium) | ${{ steps.cards.outputs.seconds }} |"
            echo "| locked-solid fetch | ${{ steps.fetch.outputs.seconds }} |"
            echo "| gen_build | ${{ steps.gen.outputs.seconds }} |"
            echo "| **cold \`//:everything\`** | **${{ steps.build.outputs.seconds }}** |"
            echo "| warm no-op | ${{ steps.warm.outputs.seconds }} |"
            echo ""
            echo "Build exit code: \`${{ steps.build.outputs.exit }}\`"
            echo ""
            echo "Reference, run 32441067918: local 269/259 · macos-latest 526/315 · ubuntu-latest 766/454 (wall/critical path)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          test "${{ steps.build.outputs.exit }}" = "0" \
            || { echo "::error::cold build exited ${{ steps.build.outputs.exit }}"; exit 1; }
