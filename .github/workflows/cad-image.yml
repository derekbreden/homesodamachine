# The image supplies native build and rendering dependencies for derived outputs.
name: cad-image

on:
  push:
    branches: [main]
    paths:
      - tools/ci-image/Dockerfile
      - tools/hsm/cargo-config/**
      - tools/render/package.json
      - tools/render/package-lock.json
      - web/package.json
      - web/package-lock.json
      - .dockerignore
  workflow_dispatch:

concurrency:
  group: cad-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: The tag the inputs name
        id: tag
        run: |
          sha=$(cargo run --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm-cargo-config --bin hsm-ci-image-digest -- --root "$GITHUB_WORKSPACE")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-cad" >> "$GITHUB_OUTPUT"
          echo "cad-$sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: tools/ci-image/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:latest
            ${{ steps.tag.outputs.image }}:cad-${{ steps.tag.outputs.sha }}
          build-args: |
            HSM_REQ_SHA=${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What it costs to pull
        run: |
          docker pull -q "${{ steps.tag.outputs.image }}:latest"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`cad-${{ steps.tag.outputs.sha }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| compressed | $(docker manifest inspect "${{ steps.tag.outputs.image }}:latest" \
                 | awk '/"size":/ {gsub(/[^0-9]/,"",$2); s+=$2} END {printf "%.0f MB", s/1048576}') |"
            echo "| on disk | $(docker image inspect "${{ steps.tag.outputs.image }}:latest" \
                 --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1048576}') |"
          } >> "$GITHUB_STEP_SUMMARY"
