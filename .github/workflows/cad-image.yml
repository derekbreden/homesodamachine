# THE PREBUILT CAD ENVIRONMENT, published to this repo's own registry.
#
# `derive` runs INSIDE this image, so everything it would otherwise install on every run is
# already on the disk when the job starts: the 840 MB CadQuery toolchain at its pin, the
# renderers and the Chromium the card deck drives, express for the scene server, blender and
# rsvg-convert for the two targets that shell out to them, and bazel at `.bazelversion`.
#
# It rebuilds when one of its declared inputs moves, independently of the design loop. Manual
# dispatch remains available for registry recovery. A derive run also compares `HSM_REQ_SHA`
# against its checkout, so an image that lags is named rather than silently accepted.
#
# The content tag is the digest of every copied toolchain input, so `:latest` moves with a build and the
# content tag is what a run can be held against afterwards.
#
# THE LAYER CACHE IS THE POINT OF `type=gha`. The apt layers and the pip layer are the whole
# cost, and they are keyed on the files copied into them — a lockfile bump reinstalls node
# modules and leaves the 840 MB pip layer alone.

name: cad-image

on:
  push:
    branches: [main]
    paths:
      - tools/ci-image/Dockerfile
      - tools/ci-image/digest.py
      - tools/cad-requirements.txt
      - tools/cad-venv-site/**
      - tools/render/package.json
      - tools/render/package-lock.json
      - web/package.json
      - web/package-lock.json
      - .dockerignore
      - .bazelversion
  workflow_dispatch:

concurrency:
  group: cad-image
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # THE DIGEST OF WHAT THE IMAGE IS MADE OF. `derive` recomputes this
      # from its own checkout and holds the image it pulled against it, so a run that lands
      # while the image is still rebuilding says so instead of quietly using yesterday's.
      - name: The tag the inputs name
        id: tag
        run: |
          sha=$(python3 tools/ci-image/digest.py)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-cad" >> "$GITHUB_OUTPUT"
          echo "cad-$sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: tools/ci-image/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:latest
            ${{ steps.tag.outputs.image }}:cad-${{ steps.tag.outputs.sha }}
          build-args: |
            HSM_REQ_SHA=${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What it costs to pull
        run: |
          docker pull -q "${{ steps.tag.outputs.image }}:latest"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`cad-${{ steps.tag.outputs.sha }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| compressed | $(docker manifest inspect "${{ steps.tag.outputs.image }}:latest" \
                 | awk '/"size":/ {gsub(/[^0-9]/,"",$2); s+=$2} END {printf "%.0f MB", s/1048576}') |"
            echo "| on disk | $(docker image inspect "${{ steps.tag.outputs.image }}:latest" \
                 --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1048576}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # A toolchain-changing source push starts publication in parallel. Once the exact image
      # exists, this explicit dispatch guarantees a fresh run even if the first was waiting or
      # was canceled; a GITHUB_TOKEN push cannot be trusted to trigger another workflow.
      - name: Publish with this image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-cad.yml --ref main -f all=true
