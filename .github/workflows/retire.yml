# Scheduled release maintenance keeps retirement outside interactive publication.
name: retire

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: retire
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Release occupancy needs no source history or native compilation.
      - name: What the release holds
        id: room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cap=$(jq -r .RELEASE_ASSET_CAP tools/hsm/publication/config.json)
          tag=$(jq -r .RELEASE_TAG tools/hsm/publication/config.json)
          held=$(gh release view "$tag" --json assets --jq '.assets | length')
          free=$(( cap - held ))
          floor=400
          echo "release holds $held of $cap; $free free (sweep under $floor)"
          if [ "$free" -lt "$floor" ]; then echo "sweep=true" >> "$GITHUB_OUTPUT";
          else echo "sweep=false" >> "$GITHUB_OUTPUT"; fi

      # Reach reads every committed pointer; a shallow sweep is refused.
      - name: The whole history
        if: steps.room.outputs.sweep == 'true'
        run: git fetch --unshallow --quiet

      - uses: actions/cache@v4
        if: steps.room.outputs.sweep == 'true'
        with:
          path: tools/hsm/target
          key: ${{ runner.os }}-hsm-retire-${{ hashFiles('tools/hsm/Cargo.lock', 'tools/hsm/publication/**', 'tools/hsm/build-data/**', 'tools/hsm/geometry/**', 'tools/hsm/kernel/**', 'tools/hsm/documents/**', 'tools/hsm/run-slots/**') }}
          restore-keys: ${{ runner.os }}-hsm-retire-

      # The runner bootstraps itself, then coordinates the publisher's compilation.
      - name: The native publisher
        if: steps.room.outputs.sweep == 'true'
        run: |
          cargo build --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm-run-slots --bin hsm-run
          tools/hsm/target/release/hsm-run -- cargo build --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm-publication --bin hsm-pack

      - name: The sweep
        if: steps.room.outputs.sweep == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/hsm/target/release/hsm-pack --retire
