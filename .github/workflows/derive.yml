# Everything derived from the geometry, computed off the agent's machine.
#
# THE AGENT'S COMMIT CARRIES THE GEOMETRY. This carries what follows from it: the ledger's
# masses, costs and hours, the docs' figures, the card deck, the full-tree build, and the
# solids bundle the deploy fetches. None of it is a decision — every step is a number that
# needs copying — and every one of them takes `_run_lock.py`'s global CAD lock, which is one
# build at a time across the whole repo. Run here, three agents in one tree stop queueing
# behind each other for work that informs none of their choices.
#
# A RED CHECK DOES NOT HOLD THIS, the same way it does not hold a commit. The full-tree build
# reports and the derived commit lands anyway; a card that spills is the next commit's work,
# not a reason for the ledger to go stale.
#
# THE PUSH-BACK DOES NOT RETRIGGER. GitHub does not start a workflow run for a push made with
# the repository's own GITHUB_TOKEN, so the derived commit needs no `[skip ci]` marker and the
# log keeps the voice the rest of the history has.

name: derive

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # ONE RUNNING, ONE WAITING, AND EVERYTHING ELSE DISCARDED. `cancel-in-progress: false` buys
  # exactly one thing: a run already executing is not killed when a push lands behind it. It
  # says nothing about pending runs — GitHub holds at most ONE per group and cancels it the
  # moment another is queued. So under a burst of pushes most runs never execute at all, and
  # eight of ten did not in the twenty-five minutes this was written in.
  #
  # THAT IS THE RIGHT OUTCOME AND THE WRONG WORD FOR IT. Only the newest tree is worth
  # deriving, so discarding the ones overtaken costs nothing — while killing a RUNNING derive
  # every time a push arrives would leave the lock stale for as long as the agents worked,
  # which is what this setting exists to prevent. It is not a queue and it never was.
  #
  # AND A `workflow_dispatch` CANNOT JUMP IT. The group is a bare string with no event key,
  # so a dispatched run competes for the same single pending slot as every push. Forcing a
  # green run during a burst is not available; a lull is what delivers one.
  #
  # THE GROUP STAYS WHOLE. Splitting it by event or by SHA puts two derives in flight, and
  # both reach `pack.py --write` and the commit-back — the race the single group prevents.
  group: derive
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  derive:
    runs-on: ubuntu-latest
    # A HUNG RUN HOLDS THE WHOLE LANE, and with no timeout it holds it for GitHub's default
    # SIX HOURS. Only one run is pending at a time, so a build that never returns does not
    # merely lose itself — every push behind it is cancelled out of the slot and nothing
    # derives at all. One did exactly that for an hour and a half: `//:render-scenes` boots a
    # server and drives a browser, and neither has a timeout of its own.
    timeout-minutes: 75
    # A CONTAINER JOB'S DEFAULT SHELL IS `sh -e`, NOT BASH. GitHub picks bash on a hosted
    # runner and drops to sh inside a container, because it cannot assume the image has one —
    # and noble's sh is dash, which has no `pipefail`. Every `run:` here was written against
    # bash, so name it rather than write to the smaller shell.
    defaults:
      run:
        shell: bash
    # THE ENVIRONMENT IS PULLED, NOT INSTALLED. `cad-image` bakes the CadQuery pin, the
    # renderers with the Chromium the deck drives, `web`'s runtime deps for the scene
    # server, bazel at `.bazelversion`, and blender and rsvg-convert — which a stock runner
    # does not have AT ALL, so `//:appliance-model` and the freestyle sieve could never have
    # built here. `sudo mkdir -p /opt/homebrew` satisfied `.bazelrc`'s mount pair with an
    # empty directory and the binaries the pair exists to reach were never on the disk.
    # `credentials` because a package published from a workflow starts private, and this
    # keeps working whichever way that setting goes.
    container:
      image: ghcr.io/derekbreden/homesodamachine-cad:latest
      # A CONTAINER'S /dev/shm IS 64 MB AND A CARD IS BIGGER THAN THAT. The tools deck captures
      # 3300x2550 at dpr 1.2 — 12.1 MP, ~48 MB raw before compositing — and Chrome puts its
      # frames in shared memory. At the default size it falls back to `/tmp`, which here is the
      # overlay filesystem, so the capture becomes disk I/O and the page stops answering.
      # The decks that fail are the big ones and only the big ones: main captures 2.2 MP and
      # renders all 103, the manual's cover 6.1 MP and the tools deck 12.1 MP both time out.
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # DEPTH, NOT HISTORY. The pack is 2.08 GiB and a full clone was the largest step in
      # the job; nothing under `tools/`, `hardware/scripts/` or `web/scripts/` reads a log,
      # a tag or a rev-list. Twenty is what the commit-back's rebase needs a merge base in.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      # THE IMAGE IS THE ENVIRONMENT AND THE CHECKOUT IS THE TREE, and this is what ties
      # them. The three baked trees are linked into the paths the build names — both are
      # gitignored, so the links dirty nothing and `git add -A` below cannot sweep them —
      # and `HSM_REQ_SHA`, the digest of the five files the image was built from, is held
      # against the same digest recomputed here. They differ for exactly as long as
      # `cad-image` takes to catch up with a pin bump, and a run inside the old environment
      # should say so rather than derive quietly from the wrong CadQuery.
      - name: The environment the image carries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ln -sfn "$HSM_CAD_VENV"       tools/cad-venv
          ln -sfn "$HSM_RENDER_MODULES" tools/render/node_modules
          ln -sfn "$HSM_WEB_MODULES"    web/node_modules
          tools/cad-venv/bin/python -c "import cadquery; print('cadquery', cadquery.__version__)"
          blender --version | head -1
          rsvg-convert --version
          # NOT `ls … && echo`. A failing left side of `&&` does not trip `set -e`, so that
          # form printed nothing and carried on — a check that reports only success.
          ls -d "$PUPPETEER_CACHE_DIR"/chrome* >/dev/null
          echo "chromium: baked"
          want=$(cat tools/ci-image/Dockerfile tools/cad-requirements.txt \
                     tools/render/package-lock.json web/package-lock.json .bazelversion \
                 | sha256sum | cut -c1-16)
          echo "image cad-$HSM_REQ_SHA / tree cad-$want"
          [ "$HSM_REQ_SHA" = "$want" ] || echo "::warning title=cad-image::the image lags this tree — this run holds the environment from before the change"

      # The two caches that decide what this costs. `.cache/realized` is keyed on each part's
      # description plus the full text of every module it transitively imports, so a run that
      # moved one generator redraws only what that generator's shape depends on — exactly the
      # property that makes the local loop fast. Keyed on the tree's own python so a source
      # edit rolls the key forward and still restores the run before it.
      - name: Restore the drawn solids
        uses: actions/cache@v4
        with:
          path: .cache/realized
          key: realized-${{ hashFiles('hardware/**/*.py') }}
          restore-keys: realized-

      - name: Restore the bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ hashFiles('BUILD.bazel', 'tools/bazel/graph.json') }}
          restore-keys: bazel-

      # `.bazelrc.paths` mounts the workspace's own .cache and bazel refuses a mount pair
      # whose source is absent. The cache action makes this on a hit; this makes it on a
      # miss. The other two pairs — /opt/homebrew and /usr/local — are directories the image
      # carries, with blender and rsvg-convert actually in them.
      - name: A mount point for the sandbox
        run: mkdir -p .cache

      # `.bazelrc.paths` is THIS CHECKOUT'S OWN, gitignored by design, and it carries
      # `HSM_WORKSPACE` — which every genrule's shell reads and which is unset in a checkout
      # that has never had it written. A runner is exactly that checkout. `gen_build.py` is
      # what writes it, and it rewrites BUILD.bazel from the traced graph at the same time:
      # a no-op when the tree already names what it makes, and a real diff worth committing
      # when it does not.
      # THE TREE DOES NOT CARRY EVERY SOLID IT BUILDS FROM. 35 of the lock's 100 are under
      # `hardware/reference/` — a supplier's model, gitignored like every other `.step` — and
      # a genrule that reads one wants it present as an INPUT, not as something to cut. The
      # deploy already solves this: `fetch-cad-artifacts.mjs` puts every locked solid on the
      # disk and holds each to its own sha256. Same script, same lock, one step earlier.
      # Node builtins only, so it needs no install of its own.
      - name: The solids the lock already names
        run: node web/scripts/fetch-cad-artifacts.mjs

      - name: This checkout's own paths
        run: tools/cad-venv/bin/python tools/bazel/gen_build.py

      - name: Build everything this tree makes
        id: build
        continue-on-error: true
        # BOUNDED SHORTER THAN THE JOB, on purpose. A build that runs out here is a FAILED
        # STEP rather than a killed job, so `continue-on-error` carries it to the verdict
        # below and the ledger, the docs and the deck still run off the solids it did cut —
        # the same treatment a red target gets. A job-level timeout alone would take those
        # with it and derive nothing.
        timeout-minutes: 45
        # `--keep_going` IS THE DOCTRINE, NOT A LENIENCY. Bazel stops the whole build at the
        # first failing target, so a deck that spills two cards halts every generator behind
        # it and the solids never get cut — which is how three runs ended `lock names this
        # tree` while reading nothing but what the fetch had put there. A red target here is
        # the next commit's work; everything that does not depend on it still owes its output.
        #
        # NO `--output_user_root`. `sync_tree.py` re-invokes a bare `bazel` to ask
        # `--check_up_to_date`, and an output base only this line knows about is a base that
        # invocation never sees — it analysed an empty one and answered "not up to date",
        # which is the carry refusing on a build that had in fact just run. The two have to
        # be the same bazel or the guard reads the wrong tree.
        # NOT `--jobs`. Capping parallelism was measured and did not move this: `//:tools-build`
        # took 270 s and 1926 s at four concurrent actions and 1905 s at two, and at two the
        # failure SPREAD to a second card and to the manual's cover. What decides it is the size
        # of the capture, not how many run at once, which is what `--shm-size` above addresses.
        # WHICH TARGETS FAILED IS WRITTEN DOWN HERE BECAUSE THIS IS WHERE IT IS KNOWN. The carry
        # below holds back the outputs of a target that failed, and nothing downstream of bazel
        # can tell one from a target that simply did not need to run — `--check_up_to_date` asks
        # about inputs, not about whether an action ran. `set +o pipefail` keeps the tee from
        # deciding the step; bazel's own status does.
        run: |
          set +o pipefail
          bazel build --keep_going --disk_cache="$HOME/.cache/bazel-disk" //:everything 2>&1 \
            | tee /tmp/bazel-build.log
          rc=${PIPESTATUS[0]}
          failed=$(grep -oE 'Executing genrule //[A-Za-z0-9_:.-]+ failed' /tmp/bazel-build.log \
                   | grep -oE '//[A-Za-z0-9_:.-]+' | sed 's|^//:||' | sort -u | paste -sd, -)
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "targets that failed: ${failed:-none}"
          exit "$rc"

      # BAZEL CUTS INTO `bazel-bin` AND THIS REPO COMMITS ITS TREE, and `sync_tree.py` is the
      # only thing that carries one to the other — `hardware/README.md` names it as the step
      # after a build. Without it the sequence is: the fetch puts the LOCKED solids in the
      # tree, bazel cuts fresh ones into `bazel-bin`, nothing moves them across, and the
      # ledger, the docs, the deck and `pack.py` all read what the fetch put there. Every
      # layer agrees with every other and all of them describe the commit BEFORE this one.
      #
      # WHAT A FAILED TARGET CUT IS HELD BACK, AND ONLY THAT. Bazel keeps what a target cut the
      # last time it succeeded, so a red target's `bazel-bin` is some earlier run's bytes and
      # carrying them writes stale over correct — the one move here that cannot be taken back.
      # `--check_up_to_date` does not see it: it asks whether an output matches its inputs, not
      # whether the action ran, and it answers "up to date" for a target that failed minutes
      # ago. So the build names its failures above and this holds those outputs back by name.
      #
      # A GREEN TARGET STILL OWES ITS OWN. Holding the whole carry on any red target is what
      # kept every derived output a commit behind for a night — the ledger, the docs, the deck
      # and `pack.py` all reading the solids the fetch put there, agreeing with each other and
      # describing the commit before. One card that will not draw does not make the geometry
      # unknowable, and the step below says which happened either way.
      - name: Carry what the build cut into the tree
        id: sync
        continue-on-error: true
        run: tools/cad-venv/bin/python tools/bazel/sync_tree.py --write \
               --failed "${{ steps.build.outputs.failed }}"

      # A RED BUILD DOES NOT HOLD THIS, but it must not be silent either: `continue-on-error`
      # reports the step as a success, so a build that cut no solids reached the ledger and
      # died there naming a missing STEP instead of naming itself. This says which happened.
      - name: What the build said
        run: |
          echo "full-tree build: ${{ steps.build.outcome }}"
          echo "carry into the tree: ${{ steps.sync.outcome }}"
          [ "${{ steps.sync.outcome }}" = "success" ] || \
            echo "::warning title=derived from the commit before this one::sync_tree carried nothing, so everything below reads the solids the fetch put in the tree — this commit's geometry is in bazel-bin and no step above reaches it. A lock that reads clean here is comparing the fetch to the lock it came from."
          [ "${{ steps.build.outcome }}" = "success" ] || \
            echo "::warning title=full-tree build::did not complete — what follows derives from the solids it did cut, and a lock reading clean off a build that cut none is reading only what the fetch sha256-verified on the way in"

      # The ledger, in the order the modules document: masses price the totals, and the
      # totals' §7 feeds the print hours.
      - name: The ledger
        run: |
          tools/cad-venv/bin/python hardware/scripts/_bom_masses.py
          tools/cad-venv/bin/python hardware/scripts/_bom_totals.py
          tools/cad-venv/bin/python hardware/scripts/_labor_totals.py
          tools/cad-venv/bin/python hardware/scripts/_machine_time.py
          tools/cad-venv/bin/python hardware/scripts/_build_time.py

      - name: The docs
        run: |
          tools/cad-venv/bin/python hardware/assembly/_enclosure_mechanical_sync.py
          tools/cad-venv/bin/python hardware/printed-parts/enclosure/_enclosure_dimensions.py

      - name: The card deck
        continue-on-error: true
        run: tools/cad-venv/bin/python hardware/assembly/cards/_cards_sync.py

      # The solids, as one content-addressed release asset the deploy fetches. `--write` is a
      # no-op on a tree whose geometry has not moved: it lands on the same asset name and the
      # same bytes, and never rewrites one already on the release.
      #
      # AND WHICH OF THE TWO HAPPENED IS THE SITE'S LATENCY, so it is worth saying out loud.
      # `render.yaml`'s buildFilter carries `hardware/**`, and the lock lives there, so a
      # geometry commit and a lock commit each fire their own deploy. A commit that carried
      # its own lock — which `CLAUDE.md` requires and which costs 1.62 s on the machine that
      # just cut the solids — deploys ONCE, with the geometry and the solids together, and
      # this step is the no-op that confirms it. A commit that did not deploys twice: the
      # first serving the previous bundle, and the site stays stale for as long as this whole
      # run takes. `lock is behind` here is that, and it is the only line in the job that
      # measures how long homesodamachine.com served the wrong solids.
      - name: The bundle, and the lock that names it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          tools/cad-venv/bin/python tools/cad-artifacts/pack.py --write 2>&1 | tee /tmp/pack.log
          # `lock is behind` HAS TWO CAUSES AND THEY ARE OPPOSITE READINGS. Before the carry
          # ran, the solids on this disk are the ones the fetch put there, so a lock that
          # disagrees with them is a commit that moved geometry without repinning — an agent's
          # missed step, and the site served the old bundle until now.
          #
          # AFTER A CARRY THAT SUCCEEDED, THE SOLIDS ON THIS DISK ARE THE ONES LINUX JUST CUT.
          # A lock that disagrees with THOSE is not a missed step by anybody: it is this
          # pipeline's whole question answered no — a linux OCC does not write the bytes the
          # machine that pinned them wrote. Which also means the repin below replaces a Mac's
          # bytes with a Linux one's, and the next hand repin replaces them back.
          if grep -q "lock is behind" /tmp/pack.log; then
            if [ "${{ steps.sync.outcome }}" = "success" ]; then
              echo "::warning title=byte answer::THE BYTES DIFFER. The carry ran, so these are linux-cut solids, and the lock does not name them. This is not a missed repin — the kernel here writes a STEP the machine that pinned these did not. The repin below pins the linux bytes, and a repin on that machine will pin them back."
            else
              echo "::warning title=lock::the commit that triggered this run did not carry its own lock — the site served the previous bundle until now, and the derived commit below is a second deploy"
            fi
          elif [ "${{ steps.sync.outcome }}" != "success" ]; then
            # AND `lock names this tree` MEANS NOTHING WHEN THE CARRY DID NOT HAPPEN. The
            # solids on this disk are the ones `fetch-cad-artifacts.mjs` put there, each
            # already held to its own sha256 on the way in, so pack is comparing the fetch
            # to the lock the fetch came from. The one question this job exists to settle —
            # whether a linux OCC writes the bytes a macOS OCC writes — is answered by this
            # line only on a run whose build finished and whose carry ran.
            echo "::notice title=lock::circular — pack read the fetched solids, not built ones. The byte question is still open."
          fi

      - name: Commit what moved
        run: |
          git config user.name  "Derek Bredensteiner"
          git config user.email "derekbreden@gmail.com"
          # `git add -A` is forbidden on a working machine, where it sweeps a peer's
          # half-finished edit into your commit. It is right HERE and only here: this is a
          # clean clone that nothing else touches, so everything dirty in it is something
          # this job put there — including a derived file that is new rather than moved,
          # which `git diff` cannot see.
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing derived moved — the tree already names what it makes"
            exit 0
          fi
          git status --porcelain | sed 's/^/  /'
          git add -A
          git commit -F - <<'MSG'
          the tree names what it makes

          The ledger, the docs, the deck and the lock, re-derived off the geometry in the
          commit before this one.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          MSG
          # Three agents share this branch, so the tip can move while this runs.
          # A rebase that CONFLICTS is a derived file two runs disagree about, and the run
          # that answers it is the next one — over the tree as it then stands, not over a
          # merge of two halves. So abort and fail; the push that lands next re-derives.
          for i in 1 2 3; do
            # The clone is shallow, so deepen before rebasing — a merge base outside the
            # boundary is a rebase that fails on history rather than on a derived file.
            git fetch --deepen=50 origin main || true
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "a derived file conflicts with main — the next push re-derives it" >&2
              exit 1
            fi
            git push origin HEAD:main && exit 0
            echo "main moved under the push — retrying"
          done
          echo "could not land the derived commit after three tries" >&2
          exit 1
