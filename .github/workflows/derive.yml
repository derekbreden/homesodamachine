# Native derivation refreshes requested website and manufacturing outputs outside the local edit loop.
name: derive

on:
  workflow_dispatch:
    inputs:
      trace:
        description: Re-trace the native build graph first (all = every producer)
        required: false
        default: none
        type: choice
        options: [none, all]
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: derive
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  packages: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      identity: ${{ steps.resolve.outputs.identity }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: The image inputs
        id: source
        run: |
          echo "sha=$(cargo run --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm-cargo-config --bin hsm-ci-image-digest -- --root "$GITHUB_WORKSPACE")" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-cad" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: The exact published image
        id: resolve
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          tag="$IMAGE:cad-$SHA"
          for attempt in $(seq 1 90); do
            report=$(docker buildx imagetools inspect "$tag" 2>/dev/null || true)
            digest=$(awk '$1 == "Digest:" {print $2; exit}' <<< "$report")
            if [[ "$digest" == sha256:* ]]; then
              echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
              echo "identity=${digest/:/-}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "the exact CAD image did not become available" >&2
          exit 1

  derive:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.trace == 'all' && 360 || 105 }}
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: The environment the image carries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ln -sfn "$HSM_RENDER_MODULES" tools/render/node_modules
          ln -sfn "$HSM_WEB_MODULES"    web/node_modules
          convert -version | head -1
          rsvg-convert --version
          ls -d "$PUPPETEER_CACHE_DIR"/chrome* >/dev/null
          echo "chromium: baked"
          want="${{ needs.image.outputs.sha }}"
          echo "image cad-$HSM_REQ_SHA / tree cad-$want"
          [ "$HSM_REQ_SHA" = "$want" ]

      - name: Restore the drawn solids
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .cache/realized
          key: realized-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: realized-${{ needs.image.outputs.identity }}-

      - name: Restore the bazel disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bazel-${{ needs.image.outputs.identity }}-

      - name: Restore the Rust programs and dependencies
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: tools/hsm/target
          key: hsm-target-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hsm-target-${{ needs.image.outputs.identity }}-

      - name: Native build commands
        run: |
          cargo build --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm-run-slots --bin hsm-run
          tools/run -- cargo build --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm-build-plan -p hsm-cargo-config -p hsm-publication --bins
          echo "$GITHUB_WORKSPACE/tools/hsm/target/release" >> "$GITHUB_PATH"

      - name: A mount point for the sandbox
        run: mkdir -p .cache

      - name: The solids the pointer file already names
        env:
          R2_PUBLIC_URL: https://objects.homesodamachine.com
        run: node web/scripts/fetch-cad-artifacts.mjs --for-build

      - name: Re-trace every generator
        if: inputs.trace == 'all'
        timeout-minutes: 260
        run: |
          hsm-build-plan trace-inputs --all

      - name: This checkout's own paths
        run: |
          hsm-build-plan write
          if ! git diff --quiet -- BUILD.bazel; then
            echo "::warning title=build-graph::BUILD.bazel is behind hsm-build-plan — this run builds the regenerated graph"
            git --no-pager diff --stat -- BUILD.bazel
          fi

      - name: Build everything this tree makes
        timeout-minutes: 70
        id: cut
        run: |
          set +e
          tools/run -- bazel build --keep_going --disk_cache="$HOME/.cache/bazel-disk" \
            --build_event_json_file="$RUNNER_TEMP/bep.json" //:everything
          built=$?
          set -e
          named=$(hsm-build-plan failed-targets "$RUNNER_TEMP/bep.json")
          failed="$named"
          if [ -n "$named" ]; then
            union=$(tr ',' '\n' <<< "$named" | paste -sd'+' -)
            standing=$(bazel query "kind(rule, rdeps(deps(//:everything), $union))" \
              2>/dev/null | paste -sd',' - || true)
            if [ -n "$standing" ]; then
              failed="$standing"
            fi
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "::warning title=build::$(tr ',' '\n' <<< "$named" | wc -l | tr -d ' ') target(s) did not complete, $(tr ',' '\n' <<< "$failed" | wc -l | tr -d ' ') held back with what stood on them; the rest carry"
            tr ',' '\n' <<< "$named" | sed 's/^/  /'
          fi
          [ -n "$failed" ] || [ "$built" -eq 0 ]

      - name: Save the drawn solids
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/realized
          key: realized-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the Bazel disk cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the Rust programs and dependencies
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tools/hsm/target
          key: hsm-target-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: The complete cut against the pointer file
        run: |
          set +e
          hsm-cut-vs-pointers \
            --annotate --assume-fresh --failed "${{ steps.cut.outputs.failed }}"
          rc=$?
          set -e
          [ "$rc" -le 1 ]

      - name: Carry what the build cut into the tree
        run: |
          hsm-build-plan sync-tree --write --derived-only \
            --failed "${{ steps.cut.outputs.failed }}"

      - name: The ledger
        run: |
          tools/hsm/target/release/bom --totals
          tools/hsm/target/release/machine-time

      - name: Artifact publication status
        run: |
          set +e
          hsm-pack --check
          rc=$?
          set -e
          [ "$rc" -le 1 ]

      - name: Commit what moved
        run: |
          git config user.name  "Derek Bredensteiner"
          git config user.email "derekbreden@gmail.com"
          hsm-build-plan sync-tree --derived-only --stage
          if git diff --cached --quiet; then
            echo "nothing derived moved — the tree already names what it makes"
            exit 0
          fi
          git diff --cached --stat
          git commit -F - <<'MSG'
          the tree names what it makes

          The ledger, the docs and the deck, re-derived off the geometry in the
          commit before this one.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          MSG
          base="$GITHUB_SHA"
          for i in 1 2 3; do
            git fetch --deepen=50 origin main
            tip=$(git rev-parse origin/main)
            if [ "$tip" != "$base" ]; then
              newer=$(hsm-build-plan affected \
                --base "$base" --head "$tip")
              if [ -n "$newer" ]; then
                echo "main has newer build inputs; queueing a derive at its tip"
                GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
                  gh workflow run derive.yml --ref main
                exit 0
              fi
              if ! git rebase origin/main; then
                mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
                if [ "${#conflicts[@]}" -eq 0 ]; then
                  git rebase --abort || true
                  exit 1
                fi
                git checkout --ours -- "${conflicts[@]}"
                git add -- "${conflicts[@]}"
                GIT_EDITOR=true git rebase --continue
              fi
              base="$tip"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved under the push — retrying"
          done
          echo "could not land the derived commit after three tries" >&2
          exit 1

      - name: Report incomplete build
        if: ${{ always() && steps.cut.outputs.failed != '' }}
        env:
          FAILED_TARGETS: ${{ steps.cut.outputs.failed }}
        run: |
          echo "::error title=Incomplete build::Some targets failed; their outputs were held back. Successful derived outputs were processed above."
          tr ',' '\n' <<< "$FAILED_TARGETS"
          exit 1
