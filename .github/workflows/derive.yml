# Everything derived from the geometry, computed off the agent's machine.
#
# THE AGENT'S COMMIT CARRIES THE GEOMETRY. This carries what follows from it: the ledger's
# masses, costs and hours, the docs' figures, the card deck, the full-tree build, and the
# solids bundle the deploy fetches. None of it is a decision — every step is a number that
# needs copying — and every one of them takes `_run_lock.py`'s global CAD lock, which is one
# build at a time across the whole repo. Run here, three agents in one tree stop queueing
# behind each other for work that informs none of their choices.
#
# A RED CHECK DOES NOT HOLD THIS, the same way it does not hold a commit. The full-tree build
# reports and the derived commit lands anyway; a card that spills is the next commit's work,
# not a reason for the ledger to go stale.
#
# THE PUSH-BACK DOES NOT RETRIGGER. GitHub does not start a workflow run for a push made with
# the repository's own GITHUB_TOKEN, so the derived commit needs no `[skip ci]` marker and the
# log keeps the voice the rest of the history has.

name: derive

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One derive at a time, and they QUEUE rather than cancel. Cancelling reads better — only
  # the newest tree matters — but three agents share this branch, and a push arriving inside
  # a run would cancel it every time, so the lock would go stale for as long as they were
  # working. A queued run costs minutes this repo does not pay for; a starved one costs the
  # deploy its solids.
  group: derive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/cad-requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: The CAD environment, at its pin
        run: |
          python3 -m venv tools/cad-venv
          tools/cad-venv/bin/pip install --quiet --upgrade pip
          tools/cad-venv/bin/pip install --quiet -r tools/cad-requirements.txt
          tools/cad-venv/bin/python -c "import cadquery; print('cadquery', cadquery.__version__)"

      - name: The renderers
        run: npm ci --prefix tools/render

      # `//:render-scenes` boots `web/server.js` to draw against, and that imports express.
      # `--omit=dev` is what render.yaml installs for the deploy, and it is enough here for
      # the same reason: nothing in the scene render reaches a dev dependency.
      - name: What the scene renderer serves from
        run: npm ci --omit=dev --prefix web

      # The two caches that decide what this costs. `.cache/realized` is keyed on each part's
      # description plus the full text of every module it transitively imports, so a run that
      # moved one generator redraws only what that generator's shape depends on — exactly the
      # property that makes the local loop fast. Keyed on the tree's own python so a source
      # edit rolls the key forward and still restores the run before it.
      - name: Restore the drawn solids
        uses: actions/cache@v4
        with:
          path: .cache/realized
          key: realized-${{ hashFiles('hardware/**/*.py') }}
          restore-keys: realized-

      - name: Restore the bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ hashFiles('BUILD.bazel', 'tools/bazel/graph.json') }}
          restore-keys: bazel-

      # `.bazelrc` mounts /opt/homebrew into the sandbox, and bazel refuses a mount pair whose
      # source is absent — which it is on any runner. An empty directory satisfies it, and the
      # tools that path exists for resolve from /usr/bin, which the same `--action_env=PATH`
      # already carries. Done here rather than in `.bazelrc`, which other work is holding.
      # (`cad-runner-bench` found this; its Linux lane does the same.)
      - name: A mount point for the sandbox
        run: |
          sudo mkdir -p /opt/homebrew /usr/local
          # `.bazelrc.paths` mounts the workspace's own .cache, and a mount pair whose source
          # is absent is refused the same way. The cache action makes this on a hit; this
          # makes it on a miss.
          mkdir -p .cache

      # `.bazelrc.paths` is THIS CHECKOUT'S OWN, gitignored by design, and it carries
      # `HSM_WORKSPACE` — which every genrule's shell reads and which is unset in a checkout
      # that has never had it written. A runner is exactly that checkout. `gen_build.py` is
      # what writes it, and it rewrites BUILD.bazel from the traced graph at the same time:
      # a no-op when the tree already names what it makes, and a real diff worth committing
      # when it does not.
      # THE TREE DOES NOT CARRY EVERY SOLID IT BUILDS FROM. 35 of the lock's 100 are under
      # `hardware/reference/` — a supplier's model, gitignored like every other `.step` — and
      # a genrule that reads one wants it present as an INPUT, not as something to cut. The
      # deploy already solves this: `fetch-cad-artifacts.mjs` puts every locked solid on the
      # disk and holds each to its own sha256. Same script, same lock, one step earlier.
      # Node builtins only, so it needs no install of its own.
      - name: The solids the lock already names
        run: node web/scripts/fetch-cad-artifacts.mjs

      - name: This checkout's own paths
        run: tools/cad-venv/bin/python tools/bazel/gen_build.py

      - name: Build everything this tree makes
        id: build
        continue-on-error: true
        # `--keep_going` IS THE DOCTRINE, NOT A LENIENCY. Bazel stops the whole build at the
        # first failing target, so a deck that spills two cards halts every generator behind
        # it and the solids never get cut — which is how three runs ended `lock names this
        # tree` while reading nothing but what the fetch had put there. A red target here is
        # the next commit's work; everything that does not depend on it still owes its output.
        run: bazel --output_user_root=/tmp/bzl build --keep_going --disk_cache="$HOME/.cache/bazel-disk" //:everything

      # A RED BUILD DOES NOT HOLD THIS, but it must not be silent either: `continue-on-error`
      # reports the step as a success, so a build that cut no solids reached the ledger and
      # died there naming a missing STEP instead of naming itself. This says which happened.
      - name: What the build said
        run: |
          echo "full-tree build: ${{ steps.build.outcome }}"
          [ "${{ steps.build.outcome }}" = "success" ] || \
            echo "::warning title=full-tree build::did not complete — what follows derives from the solids it did cut"

      # The ledger, in the order the modules document: masses price the totals, and the
      # totals' §7 feeds the print hours.
      - name: The ledger
        run: |
          tools/cad-venv/bin/python hardware/scripts/_bom_masses.py
          python3 hardware/scripts/_bom_totals.py
          python3 hardware/scripts/_labor_totals.py
          python3 hardware/scripts/_machine_time.py
          python3 hardware/scripts/_build_time.py

      - name: The docs
        run: |
          tools/cad-venv/bin/python hardware/assembly/_enclosure_mechanical_sync.py
          tools/cad-venv/bin/python hardware/printed-parts/enclosure/_enclosure_dimensions.py

      - name: The card deck
        continue-on-error: true
        run: tools/cad-venv/bin/python hardware/assembly/cards/_cards_sync.py

      # The solids, as one content-addressed release asset the deploy fetches. `--write` is a
      # no-op on a tree whose geometry has not moved: it lands on the same asset name and the
      # same bytes, and never rewrites one already on the release.
      - name: The bundle, and the lock that names it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/cad-venv/bin/python tools/cad-artifacts/pack.py --write

      - name: Commit what moved
        run: |
          git config user.name  "Derek Bredensteiner"
          git config user.email "derekbreden@gmail.com"
          # `git add -A` is forbidden on a working machine, where it sweeps a peer's
          # half-finished edit into your commit. It is right HERE and only here: this is a
          # clean clone that nothing else touches, so everything dirty in it is something
          # this job put there — including a derived file that is new rather than moved,
          # which `git diff` cannot see.
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing derived moved — the tree already names what it makes"
            exit 0
          fi
          git status --porcelain | sed 's/^/  /'
          git add -A
          git commit -F - <<'MSG'
          the tree names what it makes

          The ledger, the docs, the deck and the lock, re-derived off the geometry in the
          commit before this one.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          MSG
          # Three agents share this branch, so the tip can move while this runs.
          # A rebase that CONFLICTS is a derived file two runs disagree about, and the run
          # that answers it is the next one — over the tree as it then stands, not over a
          # merge of two halves. So abort and fail; the push that lands next re-derives.
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "a derived file conflicts with main — the next push re-derives it" >&2
              exit 1
            fi
            git push origin HEAD:main && exit 0
            echo "main moved under the push — retrying"
          done
          echo "could not land the derived commit after three tries" >&2
          exit 1
