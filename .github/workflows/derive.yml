# Native derivation refreshes requested website and manufacturing outputs outside the local edit loop.
name: derive

on:
  workflow_dispatch:
    inputs:
      trace:
        description: Re-trace the native build graph first (all = every producer)
        required: false
        default: none
        type: choice
        options: [none, all]
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: derive
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  packages: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      identity: ${{ steps.resolve.outputs.identity }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: The image inputs
        id: source
        run: |
          echo "sha=$(cargo run --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm-cargo-config --bin hsm-ci-image-digest -- --root "$GITHUB_WORKSPACE")" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-cad" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: The exact published image
        id: resolve
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          tag="$IMAGE:cad-$SHA"
          for attempt in $(seq 1 90); do
            report=$(docker buildx imagetools inspect "$tag" 2>/dev/null || true)
            digest=$(awk '$1 == "Digest:" {print $2; exit}' <<< "$report")
            if [[ "$digest" == sha256:* ]]; then
              echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
              echo "identity=${digest/:/-}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "the exact CAD image did not become available" >&2
          exit 1

  derive:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.trace == 'all' && 360 || 105 }}
    defaults:
      run:
        shell: bash
    env:
      # Native cache records remain reusable between scheduled derivations.
      HSM_KEEP_HOURS: "168"
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: The environment the image carries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ln -sfn "$HSM_RENDER_MODULES" tools/render/node_modules
          ln -sfn "$HSM_WEB_MODULES"    web/node_modules
          convert -version | head -1
          rsvg-convert --version
          ls -d "$PUPPETEER_CACHE_DIR"/chrome* >/dev/null
          echo "chromium: baked"
          want="${{ needs.image.outputs.sha }}"
          echo "image cad-$HSM_REQ_SHA / tree cad-$want"
          [ "$HSM_REQ_SHA" = "$want" ]
          echo "HSM_STORE=$GITHUB_WORKSPACE/.cache/hsm" >> "$GITHUB_ENV"

      - name: Restore native programs and completed geometry
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/hsm/parts
            .cache/hsm/import
            .cache/realized
            .cache/meshes
            .cache/boxes
          key: native-geometry-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-geometry-${{ needs.image.outputs.identity }}-

      - name: Restore the Rust programs and dependencies
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: tools/hsm/target
          key: hsm-target-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hsm-target-${{ needs.image.outputs.identity }}-

      - name: Native build commands
        run: |
          cargo build --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm-run-slots --bin hsm-run
          tools/run -- cargo build --release --locked -j 2 --manifest-path tools/hsm/Cargo.toml -p hsm -p hsm-build-plan -p hsm-print-build -p hsm-cargo-config -p hsm-publication -p hsm-git-tools --bins
          tools/hsm/target/release/hsm-run --install-hsm "$GITHUB_WORKSPACE" tools/hsm/target/release/hsm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/tools/hsm/target/release" >> "$GITHUB_PATH"

      - name: Native cache storage
        run: mkdir -p .cache

      - name: The solids the pointer file already names
        env:
          R2_PUBLIC_URL: https://objects.homesodamachine.com
        run: node web/scripts/fetch-cad-artifacts.mjs --for-build

      - name: Re-trace every native producer
        if: inputs.trace == 'all'
        timeout-minutes: 260
        run: |
          tools/run -- hsm-build-plan trace-inputs --all

      - name: Build wanted outputs through the native cache
        timeout-minutes: 70
        id: cut
        run: |
          set +e
          tools/run -- hsm-print-build --no-publish \
            --run-dir "$RUNNER_TEMP/native-build" -- //:everything
          built=$?
          set -e
          receipt="$RUNNER_TEMP/native-build/receipt.json"
          failed=""
          if [ -f "$receipt" ]; then
            failed=$(hsm-build-plan failed-targets "$receipt")
            echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=build::The native build produced no completed output receipt"
            built=1
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "exit_code=$built" >> "$GITHUB_OUTPUT"
          if [ "$built" -ne 0 ] || [ -n "$failed" ]; then
            echo "::warning title=build::The native build did not complete; successful independent outputs remain available"
            tr ',' '\n' <<< "$failed" | sed '/^$/d; s/^/  /'
          fi

      - name: Save native programs and completed geometry
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/hsm/parts
            .cache/hsm/import
            .cache/realized
            .cache/meshes
            .cache/boxes
          key: native-geometry-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the Rust programs and dependencies
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tools/hsm/target
          key: hsm-target-${{ needs.image.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: The complete cut against the pointer file
        if: steps.cut.outputs.receipt != ''
        run: |
          set +e
          hsm-cut-vs-pointers \
            --annotate --receipt "${{ steps.cut.outputs.receipt }}" \
            --assume-fresh --failed "${{ steps.cut.outputs.failed }}"
          rc=$?
          set -e
          [ "$rc" -le 1 ]

      - name: Carry what the build cut into the tree
        if: steps.cut.outputs.receipt != ''
        run: |
          hsm-build-plan sync-tree --receipt "${{ steps.cut.outputs.receipt }}" \
            --write --derived-only

      - name: Artifact publication status
        run: |
          set +e
          hsm-pack --check
          rc=$?
          set -e
          [ "$rc" -le 1 ]

      - name: Commit what moved
        if: steps.cut.outputs.receipt != ''
        run: |
          git config user.name  "Derek Bredensteiner"
          git config user.email "derekbreden@gmail.com"
          hsm-build-plan sync-tree --derived-only --stage \
            --receipt "${{ steps.cut.outputs.receipt }}"
          if git diff --cached --quiet; then
            echo "nothing derived moved — the tree already names what it makes"
            exit 0
          fi
          git diff --cached --stat
          git commit -F - <<'MSG'
          the tree names what it makes

          The ledger, the docs and the deck, re-derived off the geometry in the
          commit before this one.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          MSG
          base="$GITHUB_SHA"
          for i in 1 2 3; do
            git fetch --deepen=50 origin main
            tip=$(git rev-parse origin/main)
            if [ "$tip" != "$base" ]; then
              newer=$(hsm-build-plan affected \
                --base "$base" --head "$tip")
              if [ -n "$newer" ]; then
                echo "main has newer build inputs; queueing a derive at its tip"
                GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
                  gh workflow run derive.yml --ref main
                exit 0
              fi
              if ! git rebase origin/main; then
                mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
                if [ "${#conflicts[@]}" -eq 0 ]; then
                  git rebase --abort || true
                  exit 1
                fi
                git checkout --ours -- "${conflicts[@]}"
                git add -- "${conflicts[@]}"
                GIT_EDITOR=true git rebase --continue
              fi
              base="$tip"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved under the push — retrying"
          done
          echo "could not land the derived commit after three tries" >&2
          exit 1

      - name: Report incomplete build
        if: ${{ always() && (steps.cut.outputs.failed != '' || steps.cut.outputs.exit_code != '0') }}
        env:
          FAILED_TARGETS: ${{ steps.cut.outputs.failed }}
        run: |
          echo "::error title=Incomplete build::The native build did not finish. Failed or blocked outputs were held back; completed independent outputs were processed above."
          tr ',' '\n' <<< "$FAILED_TARGETS"
          exit 1
