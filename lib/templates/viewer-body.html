<link rel="stylesheet" href="/css/viewer.css">

<div id="grid"></div>

<!-- Hidden host for the Three.js renderer + gizmo canvases. They live here
     when no part is open and get moved into the modal wrapper when a STEP
     or DXF is opened (both use the same renderer + camera + gizmo). -->
<div id="cad-canvas-host" style="display: none;"></div>

<script src="/pan-zoom.js"></script>
<script src="/content-viewer.js"></script>

<!-- Importmap MUST live in the page; browsers ignore importmaps inside
     imported modules. Bare specifiers ("three", "three/addons/...") in
     the viewer module graph resolve via this map. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module" src="/js/viewer/main.js"></script>
