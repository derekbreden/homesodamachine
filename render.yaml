databases:
  - name: homesodamachine-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: homesodamachine
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # The web app lives in /web. Render scopes buildCommand and
    # startCommand to this directory, so `npm install` and `npm start`
    # see web/package.json. The hardware/posts trees the server reads
    # from stay at the repo root and are accessed via path.join("..",
    # "hardware") in web/server.js.
    rootDir: web
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    # rootDir is web/, so Render's default auto-deploy only fires on
    # commits that touch web/. The server also reads hardware/, posts/,
    # and pie-in-the-sky/lite/ at request time (CAD parts, blog posts,
    # and the viewer's Lite-edition content root), so commits to those
    # trees must trigger a deploy too. buildFilter.paths is an allowlist:
    # once any path is listed, Render auto-ignores every non-matching
    # path, so each served tree has to be enumerated here or its commits
    # are silently skipped (a pie-in-the-sky/lite/ commit was skipped
    # exactly this way before the entry below was added). render.yaml
    # always redeploys regardless, and is listed for completeness.
    buildFilter:
      paths:
        - web/**
        - hardware/**
        - posts/**
        - pie-in-the-sky/lite/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homesodamachine-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Firebase Cloud Messaging — set values in the Render dashboard.
      # Web config (public — embedded in client bundle):
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # Server-side credential — full service-account.json as a string:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
