databases:
  - name: homesodamachine-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: homesodamachine
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # The web app lives in /web. Render scopes buildCommand and
    # startCommand to this directory, so `npm install` and `npm start`
    # see web/package.json. The hardware tree the server reads from
    # stays at the repo root and is accessed via path.join("..",
    # "hardware") in web/server.js.
    rootDir: web
    # `npm ci`, not `npm install`: it installs web/package-lock.json exactly and
    # refuses to run at all when the lockfile and package.json disagree. `npm install`
    # re-resolves the `^` ranges against the registry on every build, so two deploys of
    # one commit can ship different code and nothing in the tree says which one is out
    # there. The pre-commit gate keeps the two files in sync, so the hard failure here
    # is one a commit cannot reach.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    # rootDir is web/, so Render's default auto-deploy only fires on
    # commits that touch web/. The server also reads every edition's
    # content root at request time — the CAD parts the viewer serves per
    # request — so commits to those trees must trigger a deploy too. buildFilter.paths is an allowlist: once
    # any path is listed, Render auto-ignores every non-matching path,
    # so a served tree that is missing here has its commits silently
    # skipped — the site keeps serving that tree as of the last deploy
    # some *other* tree happened to trigger. Every `dir` in
    # web/lib/editions.js must therefore appear below, and a new edition
    # is an entry here as well as there. render.yaml always redeploys
    # regardless, and is listed for completeness.
    buildFilter:
      paths:
        - web/**
        # one per edition (web/lib/editions.js): kitchen
        - hardware/**
        - updates/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homesodamachine-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Firebase Cloud Messaging — set values in the Render dashboard.
      # Web config (public — embedded in client bundle):
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # Server-side credential — full service-account.json as a string:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
