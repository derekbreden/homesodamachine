databases:
  - name: homesodamachine-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: homesodamachine
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # The service stays rooted at the repository so the build filter below can name paths in
    # either tree. Commands enter /web explicitly; the server still reads the sibling
    # hardware tree through path.join("..", "hardware") in web/server.js.
    # `npm ci` installs web/package-lock.json exactly, and stops when it disagrees with
    # package.json. That lockfile is what this build ships; web/README.md carries it.
    #
    # The fetch then puts the generated solids on this disk. The clone carries
    # hardware/cad-artifacts.json rather than the `.step` files themselves, and the
    # viewer serves those off the tree at request time (web/lib/viewer-routes.js), so the
    # build is where they arrive. A hash that disagrees with the pointer file ends the build and
    # leaves the previous deploy serving.
    buildCommand: cd web && npm ci --omit=dev && node scripts/fetch-cad-artifacts.mjs && node scripts/fetch-firmware.mjs
    startCommand: cd web && npm start
    healthCheckPath: /
    autoDeploy: true
    # A DEPLOY IS FOR CODE. A push that changes the site itself — its code, its posts, this file
    # — deploys on that push, serving whatever bundle the pointer file currently names. Nothing about it
    # waits for CAD: the solids it stands on are the ones already published.
    #
    # THE CAD POINTER FILE IS NOT A PATH HERE, AND THAT IS THE POINT. Geometry is data, and it reaches a
    # running container without one: `web/lib/artifacts-live.js` adopts a pointer file that moved, brings
    # its members down and pushes them to open pages on the `files-changed` frame, which the
    # viewer answers by reloading the open model in place. On a working day the pointer file moves 40
    # times against 15 pushes of everything else, and every one of those 40 used to be an `npm
    # ci`, a 65 MB fetch and a restart, none of which ran in parallel with the next.
    #
    # A CONTAINER STILL STARTS WITH WHAT ITS OWN CLONE NAMES — `buildCommand` and `prestart` both
    # run `fetch-cad-artifacts.mjs` — so a deploy for any reason lands holding the pointed-at solids,
    # and the adoption carries it forward from there.
    #
    # THE FIRMWARE POINTER FILE STAYS, because nothing carries it forward: `/api/firmware` serves images
    # off this disk that only `buildCommand` puts there.
    #
    # SO A WEB PUSH CAN LAND AHEAD OF THE ARTWORK IT CHANGES. `render-step-posed-runtime` and
    # `quickstart-art` stand this same viewer to draw the assembly cards, so a viewer change is
    # an input to those pictures — the page moves on the push, the pictures move when the
    # publish that redraws them lands, and the site is briefly newer than them. That window is
    # the price of the fast lane and it closes itself.
    buildFilter:
      paths:
        - firmware/firmware-images.json
        - web/**
        - updates/**
        - render.yaml
        # THE HARDWARE PATHS THAT DEPLOY, AND WHY THEY ARE THE ONLY ONES. Everything else under
        # `hardware/` reaches a running container as data — the artifact pointer file moves and
        # `web/lib/artifacts-live.js` brings its members down without a restart. This
        # directory holds a hand-drawn build guide whose PDF, cover and sidecar are in git
        # rather than in that pointer file, so a clone is what carries them and a deploy is what makes a
        # clone. It changes when a person redraws it, which is rarely.
        - hardware/weld-rotator-guide/**
        # The owner quick start, frozen the same way: PDF, cover and
        # sidecar in git, so a clone carries them and a deploy is what makes a clone.
        - hardware/quickstart-codex/**
        - hardware/install-guide/**
      ignoredPaths:
        # THE VERDICT IS DATA UNDER A CODE PATH. `checks_now.py` pins a reading after every
        # commit, and under `web/**` each one was an `npm ci`, a fetch and a restart — 24 of the
        # 24 deploying commits in six hours, serialized, which is how a reading lands twenty
        # minutes after the tree it describes. `web/lib/artifacts-live.js` carries it onto the
        # running container on the same look that adopts the artifact pointer file.
        - web/public/checks.json
        # AND THE SUITE IS NOT SHIPPED. `buildCommand` runs `npm ci --omit=dev`, so the
        # dependencies these need are not installed and no step of a deploy runs them — a
        # container cannot behave differently for a test that changed, because it never had
        # the test. A commit that only touches them was buying an `npm ci`, a fetch and a
        # restart for code that never leaves this disk, and standing in front of the next
        # push while it did.
        #
        # WHAT ACTUALLY HOLDS THEM IS THE BOARD. `tools/check_web_tests.py` runs the suite
        # against the tree and `checks_now.py` pins the reading after every commit, so a
        # broken test reddens the gear on the same look it always did. The deploy was never
        # the thing asking.
        - web/tests/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homesodamachine-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # THE OBJECT STORE IS CLOUDFLARE R2 (web/lib/store.js), and this service carries no disk:
      # every member the pointer file names is held in the bucket by hash, put there by whichever
      # machine cut it, and read straight from the bucket's public URL. A service without a disk
      # deploys without stopping, so a push that touches the site costs no window.
      #
      # The account, bucket and public read URL are plain values; the key pair is created in the
      # Cloudflare dashboard (R2 → Manage API tokens, Object Read & Write, this bucket) and
      # pasted into Render, never committed.
      - key: R2_ACCOUNT_ID
        value: e74c6ab34db572feede34d4b76bc3256
      - key: R2_BUCKET
        value: homesodamachine-objects
      # THE BUCKET'S ADDRESS ON THE INTERNET, and the reason the geometry does not come off this
      # instance. A custom domain makes every object a stable public URL named by the hash of
      # its own bytes, so `immutable` is the truth about it: the browser keeps a repeat open out
      # of the network entirely, and Cloudflare's edge serves a first open from wherever the
      # reader is. A half-CPU box in Oregon is then out of the path for the 586 MB of solids,
      # which is both the slowest thing a visitor waits on and the likeliest way this instance
      # falls over. `/api/objects` hands the page these URLs; web/lib/store.js refuses an
      # `r2.dev` value here, because that address is rate-limited past what a deploy asks of it.
      - key: R2_PUBLIC_URL
        value: https://objects.homesodamachine.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Firebase Cloud Messaging — set values in the Render dashboard.
      # Web config (public — embedded in client bundle):
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # Server-side credential — full service-account.json as a string:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
