databases:
  - name: homesodamachine-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: homesodamachine
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # The web app lives in /web. Render scopes buildCommand and
    # startCommand to this directory, so `npm install` and `npm start`
    # see web/package.json. The hardware/posts trees the server reads
    # from stay at the repo root and are accessed via path.join("..",
    # "hardware") in web/server.js.
    rootDir: web
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    # With rootDir set, Render's default auto-deploy only fires on
    # commits that touch the rootDir (web/). That misses commits to
    # hardware/ and posts/ — which the running server reads at request
    # time, so a new .step file or blog post in those trees doesn't
    # reach production until SOMETHING in web/ also changes. Listing
    # them here makes any commit touching one of these paths trigger
    # an auto-deploy. render.yaml is included so future changes to
    # this file (which always live at the repo root, outside rootDir)
    # also trigger a deploy.
    buildFilter:
      paths:
        - web/**
        - hardware/**
        - posts/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homesodamachine-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Firebase Cloud Messaging — set values in the Render dashboard.
      # Web config (public — embedded in client bundle):
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # Server-side credential — full service-account.json as a string:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
