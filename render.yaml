databases:
  - name: homesodamachine-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: homesodamachine
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # The service stays rooted at the repository so the build filter below can name paths in
    # either tree. Commands enter /web explicitly; the server still reads the sibling
    # hardware tree through path.join("..", "hardware") in web/server.js.
    # `npm ci` installs web/package-lock.json exactly, and stops when it disagrees with
    # package.json. That lockfile is what this build ships; web/README.md carries it.
    #
    # The fetch then puts the generated solids on this disk. The clone carries
    # hardware/cad-artifacts.lock.json rather than the `.step` files themselves, and the
    # viewer serves those off the tree at request time (web/lib/viewer-routes.js), so the
    # build is where they arrive. A hash that disagrees with the lock ends the build and
    # leaves the previous deploy serving.
    buildCommand: cd web && npm ci --omit=dev && node scripts/fetch-cad-artifacts.mjs && node scripts/fetch-firmware.mjs
    startCommand: cd web && npm start
    healthCheckPath: /
    autoDeploy: true
    # A DEPLOY IS FOR CODE. A push that changes the site itself — its code, its posts, this file
    # — deploys on that push, serving whatever bundle the lock currently names. Nothing about it
    # waits for CAD: the solids it stands on are the ones already published.
    #
    # THE CAD LOCK IS NOT A PATH HERE, AND THAT IS THE POINT. Geometry is data, and it reaches a
    # running container without one: `web/lib/artifacts-live.js` adopts a lock that moved, brings
    # its members down and pushes them to open pages on the `files-changed` frame, which the
    # viewer answers by reloading the open model in place. On a working day the lock moves 40
    # times against 15 pushes of everything else, and every one of those 40 used to be an `npm
    # ci`, a 65 MB fetch and a restart, none of which ran in parallel with the next.
    #
    # A CONTAINER STILL STARTS WITH WHAT ITS OWN CLONE NAMES — `buildCommand` and `prestart` both
    # run `fetch-cad-artifacts.mjs` — so a deploy for any reason lands holding the locked solids,
    # and the adoption carries it forward from there.
    #
    # THE FIRMWARE LOCK STAYS, because nothing carries it forward: `/api/firmware` serves images
    # off this disk that only `buildCommand` puts there.
    #
    # SO A WEB PUSH CAN LAND AHEAD OF THE ARTWORK IT CHANGES. `render-step-posed-runtime` and
    # `quickstart-art` stand this same viewer to draw the assembly cards, so a viewer change is
    # an input to those pictures — the page moves on the push, the pictures move when the
    # publish that redraws them lands, and the site is briefly newer than them. That window is
    # the price of the fast lane and it closes itself.
    buildFilter:
      paths:
        - firmware/firmware.lock.json
        - web/**
        - updates/**
        - render.yaml
      ignoredPaths:
        # THE VERDICT IS DATA UNDER A CODE PATH. `checks_now.py` pins a reading after every
        # commit, and under `web/**` each one was an `npm ci`, a fetch and a restart — 24 of the
        # 24 deploying commits in six hours, serialized, which is how a reading lands twenty
        # minutes after the tree it describes. `web/lib/artifacts-live.js` carries it onto the
        # running container on the same look that adopts the artifact lock.
        - web/public/checks.json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homesodamachine-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Firebase Cloud Messaging — set values in the Render dashboard.
      # Web config (public — embedded in client bundle):
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # Server-side credential — full service-account.json as a string:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
