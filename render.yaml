databases:
  - name: homesodamachine-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: homesodamachine
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # The service stays rooted at the repository so the lock-only build filter is the sole
    # deploy trigger. Commands enter /web explicitly; the server still reads the sibling
    # hardware tree through path.join("..", "hardware") in web/server.js.
    # `npm ci` installs web/package-lock.json exactly, and stops when it disagrees with
    # package.json. That lockfile is what this build ships; web/README.md carries it.
    #
    # The fetch then puts the generated solids on this disk. The clone carries
    # hardware/cad-artifacts.lock.json rather than the `.step` files themselves, and the
    # viewer serves those off the tree at request time (web/lib/viewer-routes.js), so the
    # build is where they arrive. A hash that disagrees with the lock ends the build and
    # leaves the previous deploy serving.
    buildCommand: cd web && npm ci --omit=dev && node scripts/fetch-cad-artifacts.mjs
    startCommand: cd web && npm start
    healthCheckPath: /
    autoDeploy: true
    # Hardware deploys at the publication boundary. A source push first runs
    # publish, whose lock-only commit names the exact source and bundle; deploying the
    # source commit itself would briefly serve its new pages with the preceding CAD bundle.
    # Even a hardware-only change with no artifact targets advances the lock's source, so every
    # served commit reaches Render through this one path. The publisher also advances the lock
    # for web, update and Render-config changes, so a mixed source commit cannot bypass the
    # boundary through a second matching path.
    buildFilter:
      paths:
        - hardware/cad-artifacts.lock.json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homesodamachine-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Firebase Cloud Messaging — set values in the Render dashboard.
      # Web config (public — embedded in client bundle):
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # Server-side credential — full service-account.json as a string:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
