<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sheet tee-sheet">
  <header class="guide-head">
    <h1>Add the water tee</h1>
    <p class="page-number">4 / 5</p>
  </header>

  <p class="guide-note">Push every tube in until it stops. Tug once on each tube to confirm it is locked.</p>

  <section class="push-story" aria-label="One new push-connect tee is added between the existing household fitting and its original tube, with the white filtered appliance line in the third port.">
    <article class="push-scene" role="img" aria-label="A short supplied tube is pushed into the open existing household push fitting.">
      <h2><span>1</span> Push in the short tube.</h2>
      <div class="scene-media">
        <img src="plumbing/modern/art/modern-tee-jumper.png" alt="">
        <svg class="scene-motion tee-jumper" viewBox="0 0 180 100" aria-hidden="true">
          <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
        </svg>
      </div>
    </article>

    <article class="push-scene" role="img" aria-label="The new black push-connect tee is pushed onto the exposed end of the short supplied tube.">
      <h2><span>2</span> Push on the tee.</h2>
      <div class="scene-media">
        <img src="plumbing/modern/art/modern-tee-mounted.png" alt="">
        <svg class="scene-motion tee-mounted" viewBox="0 0 180 100" aria-hidden="true">
          <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
        </svg>
      </div>
    </article>

    <article class="push-scene" role="img" aria-label="The original household tube is pushed into the open run port of the new tee.">
      <h2><span>3</span> Reconnect the existing tube.</h2>
      <div class="scene-media">
        <img src="plumbing/modern/art/modern-tee-existing.png" alt="">
        <svg class="scene-motion tee-existing" viewBox="0 0 180 100" aria-hidden="true">
          <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
        </svg>
      </div>
    </article>

    <article class="push-scene" role="img" aria-label="The new white tube that continues through the supplied filter is pushed into the tee's third port.">
      <h2><span>4</span> Push in the new white tube.</h2>
      <div class="scene-media">
        <img src="plumbing/modern/art/modern-tee-complete.png" alt="">
        <svg class="scene-motion tee-branch" viewBox="0 0 180 100" aria-hidden="true">
          <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
        </svg>
      </div>
    </article>
  </section>
</main>
</body>
</html>
