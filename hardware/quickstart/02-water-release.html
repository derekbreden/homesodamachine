<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sheet release-sheet">
  <header class="guide-head">
    <h1>Disconnect the tap-water line</h1>
    <p class="page-number">3 / 5</p>
  </header>

  <p class="guide-note">Water must be completely off.</p>

  <section class="mechanic-pair" aria-label="The existing plastic tube is released from its push fitting without loosening or removing the fitting.">
    <figure class="mechanic-scene" role="img" aria-label="The connected tube remains still while the fitting's small release ring is pressed square toward the fitting body.">
      <figcaption><span>1</span> Press the small ring in.</figcaption>
      <div class="scene-media">
        <img src="plumbing/modern/art/modern-release-pressed.png" alt="">
        <svg class="scene-motion release-press" viewBox="0 0 180 100" aria-hidden="true">
          <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
        </svg>
      </div>
    </figure>

    <figure class="mechanic-scene" role="img" aria-label="The release ring stays pressed while the existing plastic tube is pulled straight out of the fitting.">
      <figcaption><span>2</span> Hold it in. Pull the tube straight out.</figcaption>
      <div class="scene-media">
        <img src="plumbing/modern/art/modern-release-withdrawn.png" alt="">
        <svg class="scene-motion release-pull" viewBox="0 0 180 100" aria-hidden="true">
          <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
        </svg>
      </div>
    </figure>
  </section>
</main>
</body>
</html>
