<main class="sheet connect-sheet">

    <svg class="connection-arrow" viewBox="0 0 140 100" aria-hidden="true">
      <path d="M8 37H88V17L134 50L88 83V63H8Z"/>

    <figure class="connection-scene" role="img" aria-label="The identical rear view with the blue soda tube, both black flavor tubes, and the RJ11 signal plug fully connected.">

      <img src="art/connect-rear-connected.png" alt="">
    </figure>
