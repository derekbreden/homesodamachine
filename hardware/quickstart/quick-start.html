<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="sheet">
  <section class="story mount-story">
    <figure class="scene mount-drop">
      <svg class="motion lower" viewBox="0 0 100 390" aria-hidden="true">
        <path d="M38 18H62V286H88L50 368L12 286H38Z"/>
      </svg>
    </figure>
    <figure class="scene mount-lowered"></figure>
    <figure class="scene mount-slide"></figure>
    <figure class="scene mount-tighten"></figure>
  </section>

  <section class="story water-story">
    <figure class="scene water water-on"></figure>
    <svg class="motion transition water-transition" viewBox="0 0 160 112" aria-hidden="true">
      <path d="M8 41H101V18L152 56L101 94V71H8Z"/>
    </svg>
    <figure class="scene water water-off"></figure>
    <figure class="scene release release-pressed">
      <svg class="motion action release-in" viewBox="0 0 180 100" aria-hidden="true">
        <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
      </svg>
    </figure>
    <figure class="scene release release-withdrawn">
      <svg class="motion action release-out" viewBox="0 0 180 100" aria-hidden="true">
        <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
      </svg>
    </figure>
  </section>

  <section class="story tee-story">
    <figure class="scene tee tee-jumper">
      <svg class="motion action tee-jumper-arrow" viewBox="0 0 180 100" aria-hidden="true">
        <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
      </svg>
    </figure>
    <figure class="scene tee tee-mounted">
      <svg class="motion action tee-mounted-arrow" viewBox="0 0 180 100" aria-hidden="true">
        <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
      </svg>
    </figure>
    <figure class="scene tee tee-existing">
      <svg class="motion action tee-existing-arrow" viewBox="0 0 180 100" aria-hidden="true">
        <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
      </svg>
    </figure>
    <figure class="scene tee tee-complete">
      <svg class="motion action tee-branch-arrow" viewBox="0 0 180 100" aria-hidden="true">
        <path d="M8 37H116V16L174 50L116 84V63H8Z"/>
      </svg>
    </figure>
  </section>

  <section class="story connect-story">
    <figure class="scene connect connect-open"></figure>
    <svg class="motion transition connect-transition" viewBox="0 0 160 112" aria-hidden="true">
      <path d="M8 41H101V18L152 56L101 94V71H8Z"/>
    </svg>
    <figure class="scene connect connect-complete"></figure>
  </section>
</main>
</body>
</html>
