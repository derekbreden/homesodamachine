<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="motion-defs" aria-hidden="true">
  <defs>
    <marker id="motion-head-halo" viewBox="0 0 52 52" refX="48" refY="26"
            markerWidth="52" markerHeight="52" markerUnits="userSpaceOnUse" orient="auto">
      <path class="motion-head-halo" d="M4 4L48 26L4 48Z"/>
    </marker>
    <marker id="motion-head" viewBox="0 0 52 52" refX="48" refY="26"
            markerWidth="52" markerHeight="52" markerUnits="userSpaceOnUse" orient="auto">
      <path class="motion-head" d="M4 4L48 26L4 48Z"/>
    </marker>
    <symbol id="motion-straight" viewBox="0 0 180 100">
      <path class="motion-halo" d="M20 50H160" marker-end="url(#motion-head-halo)"/>
      <path class="motion-line" d="M20 50H160" marker-end="url(#motion-head)"/>
    </symbol>
    <symbol id="motion-turn-under" viewBox="0 0 180 120">
      <path class="motion-halo" d="M22 74C22 39 158 39 158 74"/>
      <path class="motion-head-halo" d="M136 60L158 74L180 60Z"/>
      <path class="motion-line" d="M22 74C22 39 158 39 158 74"/>
      <path class="motion-head" d="M136 60L158 74L180 60Z"/>
    </symbol>
    <symbol id="motion-turn-water" viewBox="0 0 360 130">
      <path class="motion-halo" d="M24 84C24 14 336 14 336 84"/>
      <path class="motion-head-halo" d="M314 68L336 84L358 68Z"/>
      <path class="motion-line" d="M24 84C24 14 336 14 336 84"/>
      <path class="motion-head" d="M314 68L336 84L358 68Z"/>
    </symbol>
  </defs>
</svg>
<main class="sheet">
  <section class="story mount-story">
    <figure class="scene mount-drop">
      <svg class="cue cue-straight mount-drop-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene mount-lowered"></figure>
    <figure class="scene mount-slide">
      <svg class="cue cue-straight mount-slide-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene mount-tighten">
      <svg class="cue cue-turn mount-tighten-cue" viewBox="0 0 180 120" aria-hidden="true">
        <use href="#motion-turn-under"/>
      </svg>
    </figure>
  </section>

  <section class="story water-story">
    <figure class="scene water water-on">
      <svg class="cue cue-turn water-turn-cue" viewBox="0 0 360 130" aria-hidden="true">
        <use href="#motion-turn-water"/>
      </svg>
    </figure>
    <figure class="scene water water-off"></figure>
    <figure class="scene release release-ready">
      <svg class="cue cue-straight release-press-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
      <svg class="cue cue-straight release-withdraw-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene release release-withdrawn"></figure>
  </section>

  <section class="story tee-story">
    <figure class="scene tee tee-jumper">
      <svg class="cue cue-straight tee-jumper-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene tee tee-mounted">
      <svg class="cue cue-straight tee-mounted-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene tee tee-existing">
      <svg class="cue cue-straight tee-existing-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene tee tee-complete">
      <svg class="cue cue-straight tee-branch-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
  </section>

  <section class="story connect-story">
    <figure class="scene connect connect-open"></figure>
    <figure class="scene connect connect-complete"></figure>
  </section>
</main>
</body>
</html>
