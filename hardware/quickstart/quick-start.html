<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="motion-defs" aria-hidden="true">
  <defs>
    <marker id="motion-head-halo" viewBox="-12 -12 114 104" refX="58" refY="40"
            markerWidth="114" markerHeight="104" markerUnits="userSpaceOnUse" orient="auto"
            overflow="visible">
      <path class="motion-head-halo" d="M-8 -2L90 40L-8 82Z"/>
    </marker>
    <marker id="motion-head" viewBox="-12 -12 114 104" refX="58" refY="40"
            markerWidth="114" markerHeight="104" markerUnits="userSpaceOnUse" orient="auto"
            overflow="visible">
      <path class="motion-head" d="M0 5L82 40L0 75Z"/>
    </marker>
    <marker id="motion-turn-head-halo" viewBox="-12 -12 94 108" refX="36" refY="42"
            markerWidth="94" markerHeight="108" markerUnits="userSpaceOnUse" orient="auto"
            overflow="visible">
      <path class="motion-turn-head-halo" d="M14 6L64 42L14 78Z"/>
    </marker>
    <marker id="motion-turn-head" viewBox="-12 -12 94 108" refX="36" refY="42"
            markerWidth="94" markerHeight="108" markerUnits="userSpaceOnUse" orient="auto"
            overflow="visible">
      <path class="motion-head" d="M14 6L64 42L14 78Z"/>
    </marker>
    <symbol id="motion-straight" viewBox="0 0 180 100">
      <path class="motion-halo" d="M18 50H150" marker-end="url(#motion-head-halo)"/>
      <path class="motion-line" d="M18 50H150" marker-end="url(#motion-head)"/>
    </symbol>
    <symbol id="motion-turn-under" viewBox="0 0 180 120" overflow="visible">
      <path class="motion-halo"
            d="M-89.4 37.9A136 52.5 0 1 1 138.1 88.6"
            marker-end="url(#motion-turn-head-halo)"/>
      <path class="motion-line"
            d="M-89.4 37.9A136 52.5 0 1 1 138.1 88.6"
            marker-end="url(#motion-turn-head)"/>
    </symbol>
    <symbol id="motion-turn-water" viewBox="0 0 360 130" overflow="visible">
      <path class="motion-halo"
            d="M29.3 64.4A156 52.5 0 1 1 290.3 115.1"
            marker-end="url(#motion-turn-head-halo)"/>
      <path class="motion-line"
            d="M29.3 64.4A156 52.5 0 1 1 290.3 115.1"
            marker-end="url(#motion-turn-head)"/>
    </symbol>
  </defs>
</svg>
<main class="sheet">
  <section class="story mount-story">
    <figure class="scene mount-drop">
      <svg class="cue cue-straight mount-drop-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene mount-lowered"></figure>
    <figure class="scene mount-slide">
      <svg class="cue cue-straight mount-slide-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene mount-tighten">
      <svg class="cue cue-turn mount-tighten-cue" viewBox="0 0 180 120" aria-hidden="true">
        <use href="#motion-turn-under"/>
      </svg>
    </figure>
  </section>

  <section class="story water-story">
    <figure class="scene water water-on">
      <svg class="cue cue-turn water-turn-cue" viewBox="0 0 360 130" aria-hidden="true">
        <use href="#motion-turn-water"/>
      </svg>
    </figure>
    <figure class="scene water water-off"></figure>
    <figure class="scene release release-ready">
      <svg class="cue cue-straight release-press-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
      <svg class="cue cue-straight release-withdraw-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene release release-withdrawn"></figure>
  </section>

  <section class="story tee-story">
    <figure class="scene tee tee-assembly-ready">
      <svg class="cue cue-straight tee-assembly-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene tee tee-line-ready">
      <svg class="cue cue-straight tee-line-cue" viewBox="0 0 180 100" aria-hidden="true">
        <use href="#motion-straight"/>
      </svg>
    </figure>
    <figure class="scene tee tee-complete"></figure>
  </section>

  <section class="story connect-story">
    <figure class="scene connect connect-open"></figure>
    <figure class="scene connect connect-complete"></figure>
  </section>
</main>
</body>
</html>
