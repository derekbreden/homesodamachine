<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="art/colors.css">
</head>
<body>
<main class="sheet mount-sheet">
  <header class="guide-head">
    <h1>Mount the faucet</h1>
    <p class="page-number">1 / 2</p>
  </header>

  <p class="guide-note">Keep the washer and nut on the assembly.</p>

  <section class="mount-story" aria-label="Four model states show the complete faucet lowering, seating, receiving the under-counter plate, and being hand-tightened.">
    <article class="mount-scene mount-scene-lower">
      <h2><span>1</span> Lower through the opening.</h2>
      <figure role="img" aria-label="The complete faucet assembly is directly above the prepared countertop opening.">
        <img src="art/mount-drop.png" alt="">
        <svg class="lower-arrow" viewBox="0 0 100 390" aria-hidden="true">
          <path d="M38 18H62V286H88L50 368L12 286H38Z"/>
        </svg>
      </figure>
    </article>

    <article class="mount-scene">
      <h2><span>2</span> Seat the faucet.</h2>
      <figure role="img" aria-label="The same complete faucet assembly is seated on the countertop.">
        <img src="art/mount-lowered-clean.png" alt="">
      </figure>
    </article>

    <article class="mount-scene">
      <h2><span>3</span> Slide the plate around the tubes.</h2>
      <figure role="img" aria-label="The open under-counter plate is clearly separated from the washer and slides sideways around the shank and attached tubes.">
        <img src="art/mount-under-slide-clean.png" alt="">
      </figure>
    </article>

    <article class="mount-scene">
      <h2><span>4</span> Hand-tighten the nut.</h2>
      <figure role="img" aria-label="The plate, washer, and captive nut are seated against the underside of the counter, and the nut turns by hand.">
        <img src="art/mount-under-tighten-clean.png" alt="">
      </figure>
    </article>
  </section>
</main>
</body>
</html>
