<body>
<main class="sheet action-sheet">
  <header class="guide-head">
    <h1>Add the water tee - 1/4-inch tube</h1>
    <p class="page-number">4 / 5</p>
  </header>

  <p class="guide-note">Use only for an existing 1/4-inch plastic cold-water line. The white tube continues through the supplied filter.</p>

  <section class="action-pair" aria-label="A black push-fit tee is added inline to an existing one-quarter-inch cold-water tube.">
    <figure class="action-scene" role="img" aria-label="The existing line has two square-cut ends, with the black tee and new white appliance tube staged nearby.">
      <figcaption><span>1</span> Cut the tube square.</figcaption>
      <img src="plumbing/modern/art/modern-inline-tee-before.png" alt="">
    </figure>

    <svg class="transition-arrow" viewBox="0 0 160 112" aria-hidden="true">
      <path d="M8 41H101V18L152 56L101 94V71H8Z"/>
    </svg>

    <figure class="action-scene" role="img" aria-label="Both existing line ends and the new white appliance tube are fully seated in the black push-fit tee.">
      <figcaption><span>2</span> Push all three tubes fully into the tee.</figcaption>
      <img src="plumbing/modern/art/modern-inline-tee-after.png" alt="">
    </figure>
  </section>
</main>
