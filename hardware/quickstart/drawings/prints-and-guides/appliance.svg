<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431.8 279.4" width="431.8mm" height="279.4mm">
  <rect width="100%" height="100%" fill="white" />
  <rect x="0.5" y="0.5" width="430.8" height="278.4" fill="none" stroke="#e5e5e5" stroke-width="0.3" />
<rect x="14.00" y="14.00" width="197.90" height="94.93" fill="#fafafa" stroke="#bdbdbd" stroke-width="0.4" stroke-dasharray="2,2" rx="2" />
<text x="205.90" y="23.00" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#888888" text-anchor="end" font-style="italic">placeholder</text>
<text x="20.00" y="24.20" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">Front 3/4 view of the appliance. The CO2 cylinder sits in the foreground beside the</text>
<text x="20.00" y="28.40" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">appliance, regulator on top, hose extending toward the front-panel CO2 inlet. Single red</text>
<text x="20.00" y="32.60" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">arrow at the front-panel CO2 inlet.</text>
<text x="112.95" y="129.67" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Connect the CO2.</text>
<rect x="219.90" y="14.00" width="197.90" height="94.93" fill="#fafafa" stroke="#bdbdbd" stroke-width="0.4" stroke-dasharray="2,2" rx="2" />
<text x="411.80" y="23.00" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#888888" text-anchor="end" font-style="italic">placeholder</text>
<text x="225.90" y="24.20" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">Under-counter view. The customer's angle stop comes out of the wall with its outlet now</text>
<text x="225.90" y="28.40" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">empty. The existing supply line dangles disconnected beside it. The tee floats in the gap,</text>
<text x="225.90" y="32.60" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">with the 3/8" tube pre-attached to one outlet, extending across the drawing toward the</text>
<text x="225.90" y="36.80" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">appliance's back-panel water inlet. Gray rotation arrow on the angle stop. Two gray stub-</text>
<text x="225.90" y="41.00" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">arrows pointing inward at the tee's two open outlets. Gray arrow at the appliance water</text>
<text x="225.90" y="45.20" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">inlet.</text>
<text x="318.85" y="129.67" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Tee into the water. Run the tube to the device.</text>
<rect x="14.00" y="143.70" width="197.90" height="94.93" fill="#fafafa" stroke="#bdbdbd" stroke-width="0.4" stroke-dasharray="2,2" rx="2" />
<text x="205.90" y="152.70" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#888888" text-anchor="end" font-style="italic">placeholder</text>
<text x="20.00" y="153.90" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">Two foreground subjects side by side at the same scale: the CO2 cylinder with its top valve</text>
<text x="20.00" y="158.10" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">handle, and the angle stop with the tee on it and its shutoff handle. Red rotation arrow at</text>
<text x="20.00" y="162.30" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">the CO2 cylinder valve. Gray rotation arrow at the angle stop handle.</text>
<text x="112.95" y="259.37" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Open the CO2. Open the water.</text>
<rect x="219.90" y="143.70" width="197.90" height="94.93" fill="#fafafa" stroke="#bdbdbd" stroke-width="0.4" stroke-dasharray="2,2" rx="2" />
<text x="411.80" y="152.70" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#888888" text-anchor="end" font-style="italic">placeholder</text>
<text x="225.90" y="153.90" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">3/4 top view of the appliance, hopper lid lifted, funnel visible. One SodaStream concentrate</text>
<text x="225.90" y="158.10" font-family="Helvetica, Arial, sans-serif" font-size="3.6" fill="#888888">bottle inverted over the funnel. One plain motion arrow on the bottle.</text>
<text x="318.85" y="259.37" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Empty a flavor into the hopper.</text>
</svg>
