<main class="sheet action-sheet">
  <header class="guide-head">
    <h1>Add the water tee - braided hose</h1>
    <p class="page-number">3 / 5</p>
  </header>

  <p class="guide-note">For a 3/8-inch braided faucet hose. Keep a towel below. The white tube continues through the supplied filter.</p>

  <section class="action-pair" aria-label="A brass tee is added between a cold-water angle stop and an existing braided faucet supply hose.">
    <figure class="action-scene" role="img" aria-label="With the valve off, the braided faucet hose is removed and the brass tee and white appliance tube are staged nearby.">
      <figcaption><span>1</span> Remove the faucet hose.</figcaption>
      <img src="plumbing/art/plumbing-pre-tee.png" alt="">
    </figure>

    <svg class="transition-arrow" viewBox="0 0 160 112" aria-hidden="true">
      <path d="M8 41H101V18L152 56L101 94V71H8Z"/>
    </svg>

    <figure class="action-scene" role="img" aria-label="The brass tee is installed on the closed valve, with the braided faucet hose reconnected above and the white appliance tube connected to the side outlet.">
      <figcaption><span>2</span> Thread on the tee. Reconnect both lines.</figcaption>
      <img src="plumbing/art/plumbing-tee-installed.png" alt="">
    </figure>
  </section>
