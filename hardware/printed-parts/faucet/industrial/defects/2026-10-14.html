  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  };

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }

                pendingStateWrites.delete(id);

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

      }

    },
    { capture: true },
  );

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;

        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(async () =&gt; {
  const root = document.getElementById(&#x27;faucet-defects-oct14&#x27;);
  const stage = root.querySelector(&#x27;.fd-stage&#x27;);
  const canvas = root.querySelector(&#x27;canvas&#x27;);
  const overlay = root.querySelector(&#x27;.fd-annotations&#x27;);
  const status = root.querySelector(&#x27;.fd-loading&#x27;);
  const evidence = root.querySelector(&#x27;.fd-evidence&#x27;);
  const buttons = [...root.querySelectorAll(&#x27;[data-view]&#x27;)];
  const keys = [...root.querySelectorAll(&#x27;[data-key]&#x27;)];
  const photoData = JSON.parse(root.querySelector(&#x27;[data-photos]&#x27;).textContent);
  const detail = {
    1:{point:[0,30.0,14.2],name:&#x27;Foot shoulder&#x27;,short:&#x27;Rear midpoint only&#x27;,photoStart:0,color:&#x27;--viz-series-2&#x27;},
    2:{point:[0,-32.37,237.33],name:&#x27;Tip joint lip&#x27;,short:&#x27;Full circumference&#x27;,photoStart:3,color:&#x27;--viz-series-4&#x27;},
    3:{point:[0,29.8,0.4],name:&#x27;Lower foot rim&#x27;,short:&#x27;Full circumference&#x27;,photoStart:6,color:&#x27;--viz-series-6&#x27;}
  };
  let selected=0, scene, camera, renderer, controlsReady=false;
  let yaw=0.94, elevation=0.23, span=294, target;
  let viewWidth=0, viewHeight=0, dragging=null, tween=0;
  let materials=[], highlights=[], lights=[], plateSeam;
  const saved=window.openai?.widgetState;
  const restored=Number(saved?.modelContent?.selectedDefect);
  if ([0,1,2,3].includes(restored)) selected=restored;
  const cssColor = variable =&gt; {
    const probe=document.createElement(&#x27;span&#x27;);
    probe.style.color=&#x27;var(&#x27;+variable+&#x27;)&#x27;;
    root.appendChild(probe);
    const c=getComputedStyle(probe).color;
    probe.remove();
    return c;
  };
  function lightColor() {
    const a=new THREE.Color(cssColor(&#x27;--background&#x27;)), b=new THREE.Color(cssColor(&#x27;--foreground&#x27;));
    return a.r+a.g+a.b &gt; b.r+b.g+b.b ? a : b;
  }
  function housingColor() {
    const value=cssColor(&#x27;--muted-foreground&#x27;);
    const color=new THREE.Color(value), match=value.match(/^rgba\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\)/);
    if(match) color.lerp(new THREE.Color(cssColor(&#x27;--background&#x27;)),1-Number(match[1]));
    return color;
  }
  const persist=()=&gt;{
    window.openai?.setWidgetState({modelContent:{selectedDefect:selected},privateContent:{yaw,elevation,span}})?.catch(()=&gt;{});
  };
  function showPhotos() {
    const numbers=selected ? [detail[selected].photoStart+1,detail[selected].photoStart+2,detail[selected].photoStart+3] : [3,6,9];
    evidence.replaceChildren(...numbers.map(n=&gt;{
      const f=document.createElement(&#x27;figure&#x27;);
      const img=document.createElement(&#x27;img&#x27;);
      img.src=photoData[n-1];
      img.alt=&#x27;Reference photo &#x27;+n+&#x27; showing &#x27;+detail[Math.ceil(n/3)].name.toLowerCase();
      const caption=document.createElement(&#x27;figcaption&#x27;);
      caption.className=&#x27;text-small&#x27;;
      caption.textContent=&#x27;Photo &#x27;+n;
      f.append(img,caption);
      return f;
    }));
    keys.forEach(key=&gt;key.hidden=selected!==0 &amp;&amp; Number(key.dataset.key)!==selected);
    buttons.forEach(button=&gt;button.setAttribute(&#x27;aria-pressed&#x27;,String(Number(button.dataset.view)===selected)));
  }
  function syncCamera() {
    if(!controlsReady || viewWidth&lt;=0 || viewHeight&lt;=0) return;
    const aspect=viewWidth/viewHeight;
    const shift=selected===0 &amp;&amp; viewWidth&gt;520 ? 0.11 : 0;
    camera.left=-span*aspect*(0.5-shift);
    camera.right=span*aspect*(0.5+shift);
    camera.top=span/2; camera.bottom=-span/2;
    camera.position.set(target.x+Math.cos(elevation)*Math.sin(yaw)*650,
      target.y+Math.cos(elevation)*Math.cos(yaw)*650,target.z+Math.sin(elevation)*650);
    camera.lookAt(target);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    renderer.render(scene,camera);
    annotations();
  }
  function annotations() {
    overlay.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+viewWidth+&#x27; &#x27;+viewHeight);
    const fg=cssColor(&#x27;--foreground&#x27;),bg=cssColor(&#x27;--background&#x27;);
    let markup=&#x27;&#x27;;
    const active=selected ? [selected] : [1,2,3];
    for (const id of active) {
      const d=detail[id],p=new THREE.Vector3(...d.point).project(camera);
      const x=(p.x+1)*viewWidth/2, y=(1-p.y)*viewHeight/2;
      if(x &lt; -10 || x&gt;viewWidth+10 || y&lt; -10 || y&gt;viewHeight+10) continue;
      const color=cssColor(d.color);
      const hasRoom=viewWidth&gt;520;
      let lx,ly;
      if(selected) { lx=viewWidth&gt;520 ? viewWidth-181 : 15; ly=selected===2 ? 52 : 46; }
      else if(hasRoom) { lx=viewWidth-181; ly=id===2 ? 66 : id===1 ? 304 : 389; }
      else { lx=id===2 ? Math.max(15,viewWidth-148) : 15; ly=id===2 ? 45 : id===1 ? 283 : 351; }
      const numberX=lx+12,numberY=ly;
      const textX=lx+31;
      markup+=&#x27;&lt;path d=&quot;M &#x27;+x.toFixed(1)+&#x27; &#x27;+y.toFixed(1)+&#x27; L &#x27;+(numberX-1)+&#x27; &#x27;+numberY+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+color+&#x27;&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27;;
      markup+=&#x27;&lt;circle cx=&quot;&#x27;+x.toFixed(1)+&#x27;&quot; cy=&quot;&#x27;+y.toFixed(1)+&#x27;&quot; r=&quot;4&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27;;
      markup+=&#x27;&lt;circle cx=&quot;&#x27;+numberX+&#x27;&quot; cy=&quot;&#x27;+numberY+&#x27;&quot; r=&quot;11&quot; fill=&quot;&#x27;+bg+&#x27;&quot; stroke=&quot;&#x27;+color+&#x27;&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
      markup+=&#x27;&lt;text x=&quot;&#x27;+numberX+&#x27;&quot; y=&quot;&#x27;+(numberY+4)+&#x27;&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+id+&#x27;&lt;/text&gt;&#x27;;
      markup+=&#x27;&lt;text x=&quot;&#x27;+textX+&#x27;&quot; y=&quot;&#x27;+(numberY+4)+&#x27;&quot;&gt;&#x27;+d.name+&#x27;&lt;/text&gt;&#x27;;
      if(hasRoom) markup+=&#x27;&lt;text x=&quot;&#x27;+textX+&#x27;&quot; y=&quot;&#x27;+(numberY+23)+&#x27;&quot;&gt;&#x27;+d.short+&#x27;&lt;/text&gt;&#x27;;
    }
    overlay.innerHTML=markup;
  }
  const presets={
    0:{t:[0,-47,119],s:294,y:0.94,e:0.23},
    1:{t:[0,6,25],s:96,y:0.28,e:0.21},
    2:{t:[0,-33,225],s:78,y:0.48,e:0.31},
    3:{t:[0,3,6],s:88,y:0.38,e:0.10}
  };
  function focus(id,animate=true) {
    selected=id; showPhotos();
    if(!controlsReady) return;
    cancelAnimationFrame(tween);
    const p=presets[id];
    const before={t:target.clone(),s:span,y:yaw,e:elevation};
    const duration=animate&amp;&amp;!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches ? 450 : 0;
    const started=performance.now();
    function frame(now) {
      const k=duration?Math.min(1,(now-started)/duration):1, u=k*k*(3-2*k);
      target.lerpVectors(before.t,new THREE.Vector3(...p.t),u);
      span=before.s+(p.s-before.s)*u; yaw=before.y+(p.y-before.y)*u; elevation=before.e+(p.e-before.e)*u;
      highlights.forEach(h=&gt;h.material.opacity=h.userData.opacity*(selected===0||selected===h.userData.defect?1:0.15));
      syncCamera();
      if(k&lt;1) tween=requestAnimationFrame(frame);
    }
    frame(started);
  }
  function repaint() {
    if(!controlsReady) return;
    const color=housingColor();
    materials.forEach(m=&gt;{
      m.color.copy(color);
