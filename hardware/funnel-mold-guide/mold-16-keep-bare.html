<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<article class="card">
  <header>
    <div class="eyebrow"><span class="phase">Finish</span><span class="folio">16</span></div>
    <h1>Two faces get coated</h1>
    <i class="rule"></i>
  </header>
  <main>
    <p>Everything the silicone touches gets the film. Everything that slides, seats, registers
      or breathes stays bare. Mask against this page, not against memory.</p>

    <figure>
      <div class="panel" style="padding:34px 30px 20px">
        <svg viewBox="0 0 2100 2040" role="img" aria-label="Coat and keep-bare map, both halves">
          <style>
            .blk  { fill: none; stroke: #1d1d26; stroke-width: 5; }
            .coat { fill: #2b7c94; opacity: .22; stroke: #2b7c94; stroke-width: 5; }
            .coatc{ fill: #d3922e; opacity: .28; stroke: #d3922e; stroke-width: 5; }
            .bare { fill: #ffffff; stroke: #1d1d26; stroke-width: 5; }
            .band { fill: #eceef1; stroke: #1d1d26; stroke-width: 4; }
            .ttl  { font: 700 46px "IBM Plex Sans", sans-serif; fill: #1d1d26; }
            .sub  { font: 400 34px "IBM Plex Sans", sans-serif; fill: #6d6a74; }
            .key  { font: 600 36px "IBM Plex Sans", sans-serif; fill: #1d1d26; }
            .ldr  { stroke: #d64050; stroke-width: 3.5; fill: none; }
            .cl   { font: 600 36px "IBM Plex Mono", monospace; fill: #d64050; }
            .cs   { font: 400 31px "IBM Plex Sans", sans-serif; fill: #6d6a74; }
          </style>

          <!-- CAVITY, plan from above. 3.0 px/mm about (465,495). -->
          <text class="ttl" x="60" y="52">Cavity &middot; from above</text>
          <text class="sub" x="600" y="52">the face the outside of the funnel is cast against</text>
          <rect class="blk" x="60" y="90" width="810" height="810" rx="10"/>
          <rect class="band" x="181" y="211" width="568" height="568"/>
          <rect class="coat" x="205" y="235" width="520" height="520"/>
          <circle class="coat" cx="465" cy="495" r="13"/>
          <circle class="bare" cx="822" cy="453" r="38"/><circle class="bare" cx="108" cy="537" r="38"/>
          <circle class="bare" cx="423" cy="138" r="38"/><circle class="bare" cx="507" cy="852" r="38"/>
          <rect class="bare" x="803" y="518" width="38" height="122"/>
          <rect class="bare" x="89"  y="350" width="38" height="122"/>
          <rect class="bare" x="488" y="119" width="122" height="38"/>
          <rect class="bare" x="320" y="833" width="122" height="38"/>
          <g class="ldr">
            <path d="M749 240 L960 190"/><path d="M860 453 L960 400"/>
            <path d="M841 610 L960 610"/><path d="M478 495 L960 810"/>
          </g>
          <text class="cl" x="980" y="200">registration band</text>
          <text class="cs" x="980" y="244">and both parting lands &mdash; datum faces</text>
          <text class="cl" x="980" y="410">washer pocket &times;4</text>
          <text class="cs" x="980" y="454">the screw tip bears here</text>
          <text class="cl" x="980" y="620">guide bearing &times;4</text>
          <text class="cs" x="980" y="664">0.6 mm total clearance</text>
          <text class="cl" x="980" y="820">spout pocket</text>
          <text class="cs" x="980" y="864">coated &mdash; and the place a coat pools</text>

          <!-- CORE, plan from below. Same scale, about (465,1435). -->
          <text class="ttl" x="60" y="992">Core &middot; from below</text>
          <text class="sub" x="540" y="992">the plug that makes the inside, and the brim</text>
          <rect class="blk" x="60" y="1030" width="810" height="810" rx="10"/>
          <rect class="band" x="205" y="1175" width="520" height="520"/>
          <rect class="coatc" x="227" y="1197" width="476" height="476"/>
          <circle class="bare" cx="465" cy="1435" r="11"/>
          <circle class="bare" cx="225" cy="1195" r="24"/>
          <circle class="bare" cx="705" cy="1195" r="9"/><circle class="bare" cx="225" cy="1675" r="9"/>
          <circle class="bare" cx="705" cy="1675" r="9"/><circle class="bare" cx="225" cy="1435" r="9"/>
          <circle class="bare" cx="705" cy="1435" r="9"/>
          <circle class="bare" cx="822" cy="1417" r="10"/><circle class="bare" cx="108" cy="1453" r="10"/>
          <circle class="bare" cx="447" cy="1078" r="10"/><circle class="bare" cx="483" cy="1792" r="10"/>
          <rect class="bare" x="803" y="1458" width="38" height="122"/>
          <rect class="bare" x="89"  y="1290" width="38" height="122"/>
          <rect class="bare" x="488" y="1059" width="122" height="38"/>
          <rect class="bare" x="320" y="1773" width="122" height="38"/>
          <g class="ldr">
            <path d="M249 1195 L960 1130"/><path d="M476 1435 L960 1340"/>
            <path d="M714 1435 L960 1550"/><path d="M841 1519 L960 1760"/>
          </g>
          <text class="cl" x="980" y="1140">pour throat</text>
          <text class="cs" x="980" y="1184">bore bare, dish bare</text>
          <text class="cl" x="980" y="1350">rod socket</text>
          <text class="cs" x="980" y="1394">nominal &mdash; nothing goes in it</text>
          <text class="cl" x="980" y="1560">silicone vent &times;5</text>
          <text class="cs" x="980" y="1604">corners and the two mid-sides</text>
          <text class="cl" x="980" y="1770">guide blade &times;4</text>
          <text class="cs" x="980" y="1814">and four square-nut slots above them</text>

          <g transform="translate(60,1962)">
            <rect class="coat" x="0" y="-34" width="52" height="42"/>
            <text class="key" x="72" y="0">coat</text>
            <rect class="bare" x="210" y="-34" width="52" height="42"/>
            <text class="key" x="282" y="0">keep bare</text>
            <text class="sub" x="520" y="0">schematic plan, both halves at one scale &middot;
              each station repeats at 90&deg;</text>
          </g>
        </svg>
      </div>
      <figcaption>Coat the cavity's bowl and the core's plug, out to the edge of the forming
        face &mdash; and stop there. The brim recess in the core plate's underside is forming
        surface too.</figcaption>
    </figure>
  </main>
  <footer>
    <div class="src">README.md &sect; Measure the finish, step 5 &middot; extraction.md</div>
  </footer>
</article>
</body>
</html>
