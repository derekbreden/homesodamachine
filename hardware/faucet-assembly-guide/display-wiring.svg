<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="750" viewBox="0 0 520 375" role="img" aria-labelledby="title desc">
<title id="title">Faucet display wiring, rear view with USB-C at top</title>
<desc id="desc">Waveshare ESP32-S3-Touch-LCD-1.47. The top four left pads are VBUS, GND, TXD, RXD: P1 pins 1, 3, 5, 7. Connect main board J3 V5 to VBUS; GND to GND; IO35 RX to display GPIO43 TX; IO33 TX to display GPIO44 RX. Signal levels are 3.3 V TTL; power is 5 V. This is a rear view, not mirrored. In the installed faucet, USB-C points toward the dispense face; the opposite end points up the gooseneck. The inset shows this in a side section.</desc>
