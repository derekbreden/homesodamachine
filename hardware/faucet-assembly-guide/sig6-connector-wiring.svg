<line x1="268" y1="85" x2="315" y2="85" stroke="#272A30" stroke-width="4"/>
<text x="278" y="70" font-size="10" font-weight="600" text-anchor="end" fill="#202337">C2 / GND</text>
<ellipse cx="300" cy="145" rx="7" ry="7" fill="#FCFCFA" stroke="#E49127" stroke-width="1.5"/>
<line x1="296" y1="149" x2="304" y2="141" stroke="#E49127" stroke-width="2"/>
<rect x="318" y="118" width="20" height="24" fill="#FCFCFA" stroke="#202337" stroke-width="1.5"/>
<text x="328" y="134" font-size="12" font-weight="600" text-anchor="middle" fill="#202337">2</text>
<line x1="268" y1="130" x2="315" y2="130" stroke="#272A30" stroke-width="4"/>
<text x="278" y="115" font-size="10" font-weight="600" text-anchor="end" fill="#202337">C1 / V5</text>
<ellipse cx="300" cy="190" rx="7" ry="7" fill="#FCFCFA" stroke="#258D62" stroke-width="1.5"/>
<line x1="296" y1="194" x2="304" y2="186" stroke="#258D62" stroke-width="2"/>
<rect x="318" y="163" width="20" height="24" fill="#FCFCFA" stroke="#202337" stroke-width="1.5"/>
<text x="328" y="179" font-size="12" font-weight="600" text-anchor="middle" fill="#202337">1</text>
<text x="278" y="179" font-size="9.5" font-weight="600" text-anchor="end" fill="#606A78">open</text>
<ellipse cx="441" cy="100" rx="7" ry="7" fill="#FCFCFA" stroke="#1777BE" stroke-width="1.5"/>
<line x1="437" y1="104" x2="445" y2="96" stroke="#1777BE" stroke-width="2"/>
<rect x="411" y="73" width="20" height="24" fill="#FCFCFA" stroke="#202337" stroke-width="1.5"/>
<text x="421" y="89" font-size="12" font-weight="600" text-anchor="middle" fill="#202337">4</text>
<line x1="477" y1="85" x2="434" y2="85" stroke="#272A30" stroke-width="4"/>
<text x="465" y="70" font-size="10" font-weight="600" text-anchor="start" fill="#202337">C3 / IO35</text>
<ellipse cx="441" cy="145" rx="7" ry="7" fill="#E49127" stroke="#E49127" stroke-width="1.5"/>
<rect x="411" y="118" width="20" height="24" fill="#FCFCFA" stroke="#202337" stroke-width="1.5"/>
<text x="421" y="134" font-size="12" font-weight="600" text-anchor="middle" fill="#202337">5</text>
<line x1="477" y1="130" x2="434" y2="130" stroke="#272A30" stroke-width="4"/>
<text x="465" y="115" font-size="10" font-weight="600" text-anchor="start" fill="#202337">C4 / IO33</text>
<ellipse cx="441" cy="190" rx="7" ry="7" fill="#258D62" stroke="#258D62" stroke-width="1.5"/>
<rect x="411" y="163" width="20" height="24" fill="#FCFCFA" stroke="#202337" stroke-width="1.5"/>
<text x="421" y="179" font-size="12" font-weight="600" text-anchor="middle" fill="#202337">6</text>
<text x="465" y="179" font-size="9.5" font-weight="600" text-anchor="start" fill="#606A78">open</text>
<rect x="303" y="208" width="142" height="42" fill="#30353D" stroke="#202337" stroke-width="1.5"/>
<rect x="329" y="219" width="90" height="21" fill="#11151B" stroke="#202337" stroke-width="1.5"/>
<rect x="360" y="231" width="28" height="13" fill="#11151B" stroke="#11151B" stroke-width="1.5"/>
<text x="374" y="270" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1749D1">FRONT / PLUG OPENING</text>
<text x="374" y="293" font-size="10.2" font-weight="600" text-anchor="middle" fill="#606A78">Colors are labels on the jack.</text>
<text x="374" y="311" font-size="10.2" font-weight="600" text-anchor="middle" fill="#202337">The connected wires are BLACK.</text>
