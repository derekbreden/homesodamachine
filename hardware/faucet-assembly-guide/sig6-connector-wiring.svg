<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 520 325" role="img" aria-labelledby="title desc">
<title id="title">SIG-6 RJ11 plug and RiteAV punchdown jack wiring</title>
<desc id="desc">Plug gold contacts toward viewer, nose up, cable down, latch behind. C1-C4 occupy pins 2-5 left to right. All wires are black; C1 has an added white edge mark. Jack punchdown side up, front opening toward bottom: rear row 3 and 4, middle 2 and 5, front 1 and 6 unused. J3 pin 3 V5 goes to jack 2 white/orange; J3 pin 4 GND to jack 3 blue; J3 pin 2 IO35 RX to jack 4 white/blue; J3 pin 1 IO33 TX to jack 5 orange. Colored symbols reproduce labels on the jack, not wire insulation.</desc>
<rect width="520" height="325" fill="#FFFFFF"/>
<g font-family="IBM Plex Sans, Arial, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="5" y="18" font-size="10.2" font-weight="600" text-anchor="start" fill="#1749D1">PLUG / GOLD CONTACTS FACE YOU</text>
<text x="5" y="36" font-size="9.8" font-weight="400" text-anchor="start" fill="#606A78">Nose up · cable down · latch behind</text>
<rect x="31" y="65" width="141" height="143" fill="#E4E8EE" stroke="#202337" stroke-width="1.5"/>
<rect x="42" y="87" width="119" height="112" fill="#FCFCFA" stroke="#202337" stroke-width="1.5"/>
<polyline points="82,173 82,211 121,211 121,173" fill="none" stroke="#606A78" stroke-width="1"/>
<text x="11" y="81" font-size="8" font-weight="600" text-anchor="start" fill="#1749D1">PIN</text>
<text x="53" y="81" font-size="12" font-weight="600" text-anchor="middle" fill="#1749D1">1</text>
<rect x="49" y="94" width="8" height="25" fill="#E4E8EE" stroke="#DCE2EB" stroke-width="1.5"/>
<text x="71" y="81" font-size="12" font-weight="600" text-anchor="middle" fill="#1749D1">2</text>
<rect x="67" y="94" width="8" height="25" fill="#C89542" stroke="#202337" stroke-width="1.5"/>
<text x="89" y="81" font-size="12" font-weight="600" text-anchor="middle" fill="#1749D1">3</text>
<rect x="85" y="94" width="8" height="25" fill="#C89542" stroke="#202337" stroke-width="1.5"/>
<text x="107" y="81" font-size="12" font-weight="600" text-anchor="middle" fill="#1749D1">4</text>
<rect x="103" y="94" width="8" height="25" fill="#C89542" stroke="#202337" stroke-width="1.5"/>
<text x="125" y="81" font-size="12" font-weight="600" text-anchor="middle" fill="#1749D1">5</text>
<rect x="121" y="94" width="8" height="25" fill="#C89542" stroke="#202337" stroke-width="1.5"/>
<text x="143" y="81" font-size="12" font-weight="600" text-anchor="middle" fill="#1749D1">6</text>
<rect x="139" y="94" width="8" height="25" fill="#E4E8EE" stroke="#DCE2EB" stroke-width="1.5"/>
<line x1="71" y1="119" x2="71" y2="252" stroke="#272A30" stroke-width="8"/>
<text x="71" y="271" font-size="10.5" font-weight="600" text-anchor="middle" fill="#202337">C1</text>
<line x1="89" y1="119" x2="89" y2="252" stroke="#272A30" stroke-width="8"/>
<text x="89" y="271" font-size="10.5" font-weight="600" text-anchor="middle" fill="#202337">C2</text>
<line x1="107" y1="119" x2="107" y2="252" stroke="#272A30" stroke-width="8"/>
<text x="107" y="271" font-size="10.5" font-weight="600" text-anchor="middle" fill="#202337">C3</text>
<line x1="125" y1="119" x2="125" y2="252" stroke="#272A30" stroke-width="8"/>
<text x="125" y="271" font-size="10.5" font-weight="600" text-anchor="middle" fill="#202337">C4</text>
<line x1="71" y1="226" x2="71" y2="244" stroke="#FCFCFA" stroke-width="2.5"/>
<line x1="60" y1="166" x2="136" y2="166" stroke="#E95A2C" stroke-width="10"/>
<line x1="186" y1="166" x2="145" y2="166" stroke="#E95A2C" stroke-width="1.4"/>
<polygon points="145,166 148.51,164.082 148.51,167.918" fill="#E95A2C" stroke="none" stroke-width="1.5"/>
<text x="190" y="160" font-size="9.5" font-weight="600" text-anchor="start" fill="#E95A2C">grip</text>
<text x="190" y="175" font-size="9.5" font-weight="600" text-anchor="start" fill="#E95A2C">jacket</text>
<text x="102" y="293" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1749D1">C1 = white edge mark</text>
<text x="102" y="311" font-size="10" font-weight="600" text-anchor="middle" fill="#606A78">1 and 6: empty positions</text>
<text x="243" y="18" font-size="10.2" font-weight="600" text-anchor="start" fill="#1749D1">JACK / PUNCHDOWN SIDE UP</text>
<text x="243" y="36" font-size="9.8" font-weight="400" text-anchor="start" fill="#606A78">Plug opening toward bottom of picture</text>
