<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>One less errand. — Home Soda Machine</title>
  <style>
    @font-face { font-family: Montserrat; src: url("Montserrat.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
    :root { font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f7f8fc; background: #0d1422; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1600px, calc(100% - 96px)); margin: 0 auto; padding: 38px 0 35px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 28px; margin-bottom: 30px; }
    .brand { color: #dce6ff; text-decoration: none; display: inline-flex; gap: 15px; align-items: center; font-size: 14px; font-weight: 550; line-height: 1.35; }
    .brand img { width: 155px; height: auto; display: block; }
    .edition { color: #93a3be; font-size: 10px; letter-spacing: .17em; text-transform: uppercase; }
    h1 { font-size: clamp(27px, 3vw, 43px); font-weight: 450; letter-spacing: -.045em; line-height: 1.1; margin: 0; }
    .intro { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 23px; }
    .duration { color: #8e9eb9; font-size: 12px; white-space: nowrap; letter-spacing: .015em; }
    .screen { background: #1749d1; aspect-ratio: 16/9; border-radius: 3px; overflow: hidden; box-shadow: 0 20px 65px #03071155; }
    video { display: block; width: 100%; height: 100%; background: #1749d1; object-fit: contain; }
    video::cue { color: #fff; background: #0d1422dd; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 90%; }
    .below { display: flex; align-items: start; justify-content: space-between; gap: 25px; padding-top: 22px; }
    nav { display: flex; gap: 7px; flex-wrap: wrap; }
    button { display: inline-flex; gap: 9px; align-items: center; font: inherit; font-size: 11px; line-height: 1.5; background: transparent; border: 1px solid #27334a; border-radius: 30px; padding: 8px 13px; color: #b9c6dd; cursor: pointer; transition: background .2s, border-color .2s, color .2s; }
    button span { color: #7587a7; font-variant-numeric: tabular-nums; font-size: 10px; }
    button:hover { color: #fff; border-color: #6c83ad; }
    button[aria-current="true"] { background: #1749d1; border-color: #1749d1; color: #fff; }
    button[aria-current="true"] span { color: #dce6ff; }
    a:focus-visible, button:focus-visible, video:focus-visible { outline: 2px solid #ff9152; outline-offset: 5px; }
    .downloads { display: flex; gap: 17px; align-items: center; white-space: nowrap; padding-top: 10px; font-size: 11px; }
    .downloads a { color: #c9d5eb; text-decoration-color: #465775; text-underline-offset: 4px; }
    .downloads a:hover { color: #fff; text-decoration-color: #fff; }
    footer { display: flex; justify-content: space-between; gap: 24px; color: #7384a1; font-size: 10px; line-height: 1.6; margin-top: 31px; padding-top: 19px; border-top: 1px solid #202b40; }
    footer a { color: #95a8c8; text-decoration: none; }
    @media (min-width: 901px) { main { max-width: calc((100dvh - 290px) * 16 / 9); } }
    @media (max-width: 900px) { main { width: calc(100% - 40px); padding-top: 25px; } .below { flex-direction: column; gap: 13px; } header { margin-bottom: 35px; } .downloads { padding-top: 0; } }
    @media (max-width: 520px) { main { width: calc(100% - 28px); padding-top: 20px; } header { margin-bottom: 32px; } .edition { font-size: 8px; letter-spacing: .09em; max-width: 110px; text-align: right; line-height: 1.5; } .intro { align-items: start; flex-direction: column; gap: 9px; margin-bottom: 17px; } .brand { font-size: 12px; gap: 9px; } .brand svg { width: 29px; height: 29px; } nav { gap: 6px; } button { font-size: 10px; padding: 7px 10px; } footer { flex-direction: column; gap: 6px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="https://homesodamachine.com" aria-label="Home Soda Machine website">
        <img src="brand.svg" width="155" height="59" alt="Home Soda Machine">
      </a>
      <span class="edition">In development · Design film</span>
    </header>
    <div class="intro"><h1>One less errand.</h1><span class="duration">1:04 &nbsp; / &nbsp; 1080p · 24 fps</span></div>
    <div class="screen">
      <video id="film" controls playsinline preload="metadata" poster="poster.jpg" aria-label="One less errand, a Home Soda Machine design film">
        <source src="film.mp4" type="video/mp4">
        <track src="film.vtt" kind="captions" srclang="en" label="English">
        Your browser cannot play this video. <a href="film.mp4">Download the film.</a>
      </video>
    </div>
    <div class="below">
      <nav aria-label="Film chapters">
        <button type="button" data-time="0" aria-current="true"><span>0:00</span>The routine</button>
        <button type="button" data-time="19.25"><span>0:19</span>At home</button>
        <button type="button" data-time="30.75"><span>0:31</span>On tap</button>
        <button type="button" data-time="47.5"><span>0:48</span>Your style</button>
        <button type="button" data-time="58.5"><span>0:59</span>One less errand</button>
      </nav>
      <div class="downloads"><a href="film.mp4" download="home-soda-machine-one-less-errand.mp4">Download film ↗</a><a href="film.srt" download="one-less-errand.srt">Captions ↗</a></div>
    </div>
    <footer><span>A kitchen appliance in development. Product visualizations show the intended design.</span><a href="https://homesodamachine.com">homesodamachine.com ↗</a></footer>
  </main>
  <script>
    const film = document.getElementById('film');
    const chapters = [...document.querySelectorAll('nav button')];
    chapters.forEach(button => button.addEventListener('click', () => {
      film.currentTime = Number(button.dataset.time);
      film.play().catch(() => {});
    }));
    film.addEventListener('timeupdate', () => {
      chapters.forEach((button, index) => {
        const active = film.currentTime >= Number(button.dataset.time) &&
          (!chapters[index + 1] || film.currentTime < Number(chapters[index + 1].dataset.time));
        button.setAttribute('aria-current', String(active));
      });
    });
  </script>
</body>
</html>
