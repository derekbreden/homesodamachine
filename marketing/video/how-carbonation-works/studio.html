<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How carbonation works — Home Soda Machine</title>
<style>
@font-face{font-family:Archivo;src:url('assets/Archivo-latin-variable.woff2');font-style:normal;font-weight:100 900}@font-face{font-family:Plex;src:url('assets/IBMPlexMono-latin-regular.woff2');font-style:normal;font-weight:400}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08152f;color:#dce6ff;font-family:Archivo,sans-serif}
#film{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:top left;background:radial-gradient(ellipse at 72% 34%,#193b69 0%,#0d2346 34%,#08152f 70%)}
#picture{display:block;position:absolute;inset:0;width:1920px;height:1080px}
#wash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,21,47,.97) 0,rgba(8,21,47,.95) 620px,rgba(8,21,47,.6) 760px,rgba(8,21,47,.15) 870px,transparent 960px);pointer-events:none}
#brand{position:absolute;left:96px;top:58px;display:flex;align-items:center;gap:18px;color:#dce6ff;font:20px Plex;letter-spacing:3px}
#brand img{width:50px;height:50px}
#type{position:absolute;left:96px;top:240px;width:555px}
#eyebrow{font:22px Plex;letter-spacing:4px;text-transform:uppercase;color:#9cb8e9;margin-bottom:30px}
#headline{font:600 88px/.99 Archivo;letter-spacing:-3.5px;white-space:pre-line;margin:0;color:#f4f8ff}
#detail{font:400 32px/1.4 Archivo;white-space:pre-line;margin:29px 0 0;color:#a9c5ed}
#accent{width:62px;height:4px;background:#ff9152;margin-top:37px}
#captions{position:absolute;bottom:42px;left:200px;right:200px;text-align:center;font:500 36px/1.3 Archivo;color:#fff;text-shadow:0 2px 7px #08152f;pointer-events:none}
#captions span{display:inline;background:rgba(5,14,31,.78);padding:5px 13px;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:3px}
#disclosure{position:absolute;left:96px;bottom:43px;font:18px Plex;color:#708db9;letter-spacing:.5px;opacity:.8}
#url{position:absolute;left:96px;top:757px;font:24px Plex;color:#c4d9ff;letter-spacing:1px;opacity:0}
#callouts{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
#callouts text{font:25px Plex;fill:#dce6ff;letter-spacing:.5px}#callouts path{stroke:#8faedb;stroke-width:1.4;fill:none}#callouts circle{fill:#ff9152}
#fade{position:absolute;inset:0;background:#08152f;opacity:0;pointer-events:none}
</style>
</head>
<body>
<main id="film">
 <canvas id="picture" width="1920" height="1080" aria-label="Engineering animation of the Home Soda Machine carbonator"></canvas>
 <div id="wash"></div>
 <div id="brand"><img src="assets/mark.svg" alt="">HOME SODA MACHINE</div>
 <div id="type"><div id="eyebrow"></div><h1 id="headline"></h1><p id="detail"></p><div id="accent"></div></div>
 <svg id="callouts" viewBox="0 0 1920 1080"></svg>
 <div id="url">homesodamachine.com</div>
 <div id="disclosure">Engineering visualization</div>
 <div id="captions"></div>
 <div id="fade"></div>
</main>
<script src="out/vendor/three.min.js"></script>
<script src="carbonator.js"></script>
<script src="scene.js"></script>
</body>
</html>
