<style>

  /* A flavor's own page. The ratio card floats on the surface; the row of faces it can
     wear is a cream band laid across the liquid under it.
     Pressed element: the + stepper (gold). */
  .num   { position: absolute; font-size: 64px; line-height: 1; color: var(--ink); }
  .backl { position: absolute; left: 8px; top: 14px; width: 174px; height: 64px;
           background: var(--cream); border-radius: 6px;
           display: flex; align-items: center; }
  .backl svg { stroke: var(--liq); margin-left: 10px; }
  .backl .w { font-weight: 700; font-size: 20px; letter-spacing: .1em;
              color: var(--liq); margin-left: 4px; }
  .band  { position: absolute; background: var(--cream); border-radius: 6px; }
  .win   { position: absolute; overflow: hidden; }

</style>
