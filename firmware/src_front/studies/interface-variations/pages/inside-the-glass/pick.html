<style>

  /* Fill a flavor. Both channels are under the line here — this screen arms nothing, it
     asks which one you are pouring into. The funnel is a cream disc struck over the face.
     Pressed element: the left channel's funnel (gold). */
  .pcard { position: absolute; background: var(--cream); border-radius: 6px; }
  .disc  { position: absolute; width: 104px; height: 104px; border-radius: 50%;
           background: var(--cream); display: flex; align-items: center;
           justify-content: center; }
  .disc svg { stroke: var(--liq); }
  .bsq   { position: absolute; background: var(--cream); border-radius: 6px;
           display: flex; align-items: center; justify-content: center; }
  .bsq svg { stroke: var(--liq); }

</style>
