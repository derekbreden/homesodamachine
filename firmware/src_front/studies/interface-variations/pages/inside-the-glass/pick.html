     Pressed element: the left card (gold rim). */
  .pcard { position: absolute; background: var(--cream); border-radius: 6px; }
  .disc  { position: absolute; width: 96px; height: 96px; border-radius: 50%;
           background: var(--cream); display: flex; align-items: center;
           justify-content: center; }
  .disc svg { stroke: var(--liq); }
  .bsq   { position: absolute; background: var(--cream); border-radius: 6px;
           display: flex; align-items: center; justify-content: center; }
  .bsq svg { stroke: var(--liq); }
