<style>

  /* Choose — selection IS the liquid line. The armed channel is under it: wet, full
     colour, bubbles clinging to its label. The other is above it, in the headspace, dry.
     Pressed element: the CLEAN rail destination (gold). */
  .card    { width: 280px; height: 210px; }
  .col     { position: absolute; left: 128px; width: 142px; }
  .st-on   { font-size: 26px; color: var(--ink); line-height: 1; }
  .st-off  { font-weight: 700; font-size: 13px; letter-spacing: .15em;
             color: var(--dim); line-height: 1; }
  .ratio   { font-size: 36px; line-height: 1; color: var(--ink); }
  .ratio.dry { color: var(--dim); }
  .ontap   { position: absolute; font-size: 34px; letter-spacing: .26em;
             color: var(--cream); font-weight: 700; text-align: center; line-height: 1; }
  .pour    { position: absolute; width: 3px; background: var(--cream); }
  .setmark { position: absolute; width: 64px; height: 64px; border-radius: 8px;
             box-shadow: inset 0 0 0 2px var(--cream); color: var(--cream);
             display: flex; align-items: center; justify-content: center; }
  .setmark svg { stroke: var(--cream); }

</style>
</head>
