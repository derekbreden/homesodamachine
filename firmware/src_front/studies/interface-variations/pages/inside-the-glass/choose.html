<style>

  /* Choose — selection is the liquid line. The armed channel is under it, wet and
     full colour, with bubbles clinging to its label. The other is above it, dry.
     Pressed element: the PRIME rail destination (gold). */
  .card    { width: 280px; height: 210px; }
  .cface   { left: 10px; top: 10px; width: 102px; height: 190px; }
  .col     { position: absolute; left: 128px; width: 142px; }
  .st-on   { font-size: 23px; color: var(--ink); line-height: 1; }
  .st-off  { font-weight: 700; font-size: 14px; letter-spacing: .16em;
             color: var(--dim); line-height: 1; }
  .ratio   { font-size: 40px; line-height: 1; color: var(--ink); }
  .ratio.dry { color: var(--dim); }
  .ontap   { position: absolute; font-size: 30px; letter-spacing: .24em;
             color: var(--cream); font-weight: 700; text-align: center; }
  .pour    { position: absolute; width: 2px; background: var(--cream); }
  .setmark { position: absolute; width: 64px; height: 64px; border-radius: 8px;
             box-shadow: inset 0 0 0 2px var(--cream);
             display: flex; align-items: center; justify-content: center; }
  .setmark svg { stroke: var(--cream); }

</style>
</head>
