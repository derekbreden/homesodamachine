<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inside The Glass — Choose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@72,700,50&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>

  /* Choose — the selection IS the liquid line. Both channels get the same card in the same
     place; what differs is which side of the line it is on. The armed one is submerged:
     full colour, bubbles clinging to its label, ink numerals. The other stands in the
     headspace above the line, dry: washed face, dim numerals.
     Pressed element: the CLEAN rail destination (gold). */
  .card  { width: 470px; height: 180px; }
  .state { position: absolute; font-size: 26px; line-height: 1; color: var(--ink); }
  .state.dry { color: var(--dim); }
  .ratio { position: absolute; font-size: 40px; line-height: 1; color: var(--ink); }
  .ratio.dry { color: var(--dim); }
  .bar   { position: absolute; height: 20px; }
  .go    { position: absolute; width: 30px; height: 30px; }
  .go svg { stroke: currentColor; }
  .setmark { position: absolute; width: 64px; height: 64px; border-radius: 8px;
             box-shadow: inset 0 0 0 2px var(--cream); color: var(--cream);
             display: flex; align-items: center; justify-content: center; }
  .setmark svg { stroke: var(--cream); }

</style>
</head>
<body>
