  .lmin { position: absolute; font-size: 40px; line-height: 1; color: var(--warn); }
  .lsub { position: absolute; font-weight: 500; font-size: 20px; color: var(--dim);
          line-height: 1; }
  .mark { position: absolute; width: 0; height: 0;
          border-top: 9px solid transparent; border-bottom: 9px solid transparent; }

</style>
