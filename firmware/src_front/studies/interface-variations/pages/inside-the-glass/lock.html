<style>

  /* The operation lock. The glass is filling and the fill IS the progress bar: at 40% the
     line sits at y 288 across the whole panel. The channel being cleaned stands half
     submerged — full colour under the line, washed above it — and the modal label hangs
     from the same top edge, its foot resting on the surface.
     No pressed element on this screen: STOP is the one way out and it is drawn at rest. */
  .lt   { position: absolute; font-size: 40px; line-height: 1; color: var(--ink); }
  .lsub { position: absolute; font-weight: 500; font-size: 22px; color: var(--dim);
          line-height: 1; }
  .lmin { position: absolute; font-weight: 700; font-size: 20px; color: var(--warn);
          letter-spacing: .1em; line-height: 1; }

</style>
</head>
