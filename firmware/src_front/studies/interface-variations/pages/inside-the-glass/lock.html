  /* The operation lock. The glass is filling and the fill IS the progress bar: the line
     sits 40% up the whole 800px panel. The channel being cleaned stands half submerged,
     full colour under the line and washed above it.
     Pressed element: STOP (gold). */
  .lt   { position: absolute; font-size: 42px; line-height: 1; color: var(--ink); }
  .lmin { position: absolute; font-size: 42px; line-height: 1; color: var(--warn); }
  .lsub { position: absolute; font-weight: 500; font-size: 19px; color: var(--dim);
          line-height: 1; }
  .mark { position: absolute; width: 0; height: 0;
          border-top: 7px solid transparent; border-bottom: 7px solid transparent; }

</style>
