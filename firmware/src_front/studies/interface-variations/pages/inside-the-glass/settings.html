<style>

  /* Settings. The machine in section, its three vessels holding real liquid at the level
     its sensors read. A closed sensor is a solid bar, an open one is hollow.
     Pressed element: PUMP SERVICE (gold). */
  .backl { position: absolute; left: 8px; top: 14px; width: 174px; height: 64px;
           background: var(--cream); border-radius: 6px;
           display: flex; align-items: center; }
  .backl svg { stroke: var(--liq); margin-left: 10px; }
  .backl .w { font-weight: 700; font-size: 20px; letter-spacing: .1em;
              color: var(--liq); margin-left: 4px; }
  .area  { position: absolute; left: 8px; width: 174px; height: 118px;
           background: var(--cream); border-radius: 6px; color: var(--liq); }
  .area svg { stroke: var(--liq); position: absolute; left: 14px; top: 14px; }
  .area .w { position: absolute; left: 14px; right: 12px; bottom: 13px;
             font-weight: 700; font-size: 19px; line-height: 1.15; color: var(--liq); }
  .area.pressed { color: var(--ink); }
  .area.pressed svg { stroke: var(--ink); }
  .area.pressed .w { color: var(--ink); }
  .verd  { position: absolute; width: 52px; height: 52px; border-radius: 50%;
           background: var(--good); display: flex; align-items: center;
           justify-content: center; }
  .verd svg { stroke: var(--cream); }
  .vt    { position: absolute; font-size: 30px; line-height: 1; color: var(--ink); }
  .key   { position: absolute; display: flex; align-items: center; }
  .key .sw { width: 36px; height: 13px; border-radius: 7px; margin-right: 12px; }
  .key .sw.shut { background: var(--ink); }
  .key .sw.open { background: var(--cream); box-shadow: inset 0 0 0 3px var(--rule2); }
  .key .k { font-weight: 700; font-size: 13px; letter-spacing: .13em; color: var(--dim); }

</style>
</head>
