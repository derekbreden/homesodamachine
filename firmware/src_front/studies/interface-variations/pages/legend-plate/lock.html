<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cleaning — Legend Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <!-- ── the plate stays; the pane becomes one window. no rail: nothing else is reachable ── -->
  <span class="lamp on lk-lamp"></span>
  <div class="legend lk-title">CLEANING</div>
  <div class="win lk-well">
    <div class="lk-face"><img class="face" src="../../assets/flavor_1.png" alt=""></div>
    <div class="lk-time"><span class="n">11</span><span class="u">MIN LEFT</span></div>
    <div class="legend lk-stage">1 OF 3 &middot; WATER IN</div>
    <div class="lk-cells">
      <div class="cell wlit" style="left:172px"></div>
      <div class="cell wlit" style="left:208px"></div>
      <div class="cell wlit" style="left:244px"></div>
      <div class="cell wlit" style="left:280px"></div>
      <div class="cell wlit" style="left:316px"></div>
      <div class="cell wlit" style="left:352px"></div>
      <div class="cell wunlit" style="left:388px"></div>
      <div class="cell wunlit" style="left:424px"></div>
      <div class="cell wunlit" style="left:460px"></div>
      <div class="cell wunlit" style="left:496px"></div>
      <div class="cell wunlit" style="left:532px"></div>
      <div class="cell wunlit" style="left:568px"></div>
      <div class="cell wunlit" style="left:604px"></div>
      <div class="cell wunlit" style="left:640px"></div>
      <div class="cell wunlit" style="left:676px"></div>
    </div>
    <!-- the cycle's own mark, printed on the readout: busy, without a word -->
    <div class="lk-mark"><svg width="136" height="136" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24.2 15.6A10.5 10.5 0 1 1 20.4 6.2"/><path d="M14.6 4.6l6.4 1.3-1.3 6.4"/><path d="M14 11.5c0 0-4 4.6-4 7.1a4 4 0 0 0 8 0c0-2.5-4-7.1-4-7.1z"/></svg></div>
  </div>

  <!-- ── the cycle annunciator, printed on the plate ── -->
  <div class="legend lk-slab">STAGE</div>
  <div class="lk-ann">
    <span class="lamp on sm" style="left:32px"></span>
    <span class="n" style="left:66px;color:var(--text)">1</span>
    <span class="lamp off" style="left:112px"></span>
    <span class="n" style="left:146px;color:var(--dim)">2</span>
    <span class="lamp off" style="left:192px"></span>
    <span class="n" style="left:226px;color:var(--dim)">3</span>
  </div>

  <!-- ── the one way out, on the plate outside the well, at rest ── -->
  <div class="lk-stop">STOP</div>

</div>
</body>
</html>
