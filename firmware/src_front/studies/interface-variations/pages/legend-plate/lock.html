<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cleaning — Legend Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <!-- ── the plate stays; the pane becomes one window. no rail: nothing else is reachable ── -->
  <span class="lamp on lk-lamp"></span>
  <div class="legend lk-title">CLEANING</div>
  <div class="win lk-well">
    <div class="lk-face"><img class="face" src="../../assets/flavor_1.png" alt=""></div>
    <div class="lk-time"><span class="n">11</span><span class="u">MIN LEFT</span></div>
    <div class="legend lk-stage">1 OF 3 &middot; WATER IN</div>
    <div class="lk-cells">
      <div class="cell wlit" style="left:206px"></div>
      <div class="cell wlit" style="left:243px"></div>
      <div class="cell wlit" style="left:280px"></div>
      <div class="cell wlit" style="left:317px"></div>
      <div class="cell wlit" style="left:354px"></div>
      <div class="cell wlit" style="left:391px"></div>
      <div class="cell wunlit" style="left:428px"></div>
      <div class="cell wunlit" style="left:465px"></div>
      <div class="cell wunlit" style="left:502px"></div>
      <div class="cell wunlit" style="left:539px"></div>
      <div class="cell wunlit" style="left:576px"></div>
      <div class="cell wunlit" style="left:613px"></div>
      <div class="cell wunlit" style="left:650px"></div>
      <div class="cell wunlit" style="left:687px"></div>
      <div class="cell wunlit" style="left:724px"></div>
    </div>
  </div>

  <!-- ── the cycle annunciator, printed on the plate ── -->
  <div class="legend lk-slab">STAGE</div>
  <div class="lk-ann">
    <span class="lamp on sm" style="left:32px"></span>
    <span class="n" style="left:66px;color:var(--text)">1</span>
    <span class="lamp off" style="left:112px"></span>
    <span class="n" style="left:146px;color:var(--dim)">2</span>
    <span class="lamp off" style="left:192px"></span>
    <span class="n" style="left:226px;color:var(--dim)">3</span>
  </div>

  <!-- ── the one way out, on the plate outside the well. drawn pressed ── -->
  <div class="lk-stop pressed">STOP</div>

</div>
</body>
</html>
