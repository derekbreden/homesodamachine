<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System — Legend Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <!-- ── header band: printed name, west BACK, SYSTEM ── -->
  <div class="comp back">
    <span class="mk"><svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 14H6"/><path d="M13 7l-7 7 7 7"/></svg></span>
    <span class="cond">BACK</span>
  </div>
  <div class="legend pagename">SYSTEM</div>
  <div class="comp sysbtn"><span class="lamp on sm"></span><span class="mk"><svg width="30" height="30" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 24V10.5L10.5 4H24v20z"/></svg></span></div>
  <div class="cond syslabel here">SYSTEM</div>
  <div class="rule hdrrule"></div>

  <!-- ── rail: four moulded compartments. one lamp lit, no fills ── -->
  <div class="comp rail-item r0">
    <span class="lamp off"></span>
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="8" height="20" rx="2" fill="currentColor" stroke="none"/><rect x="17" y="5" width="7" height="18" rx="2"/></svg></span>
    <span class="cond">CHOOSE</span>
  </div>
  <div class="comp rail-item r1">
    <span class="lamp off"></span>
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.5c0 0-7.5 8.6-7.5 13.3a7.5 7.5 0 0 0 15 0C21.5 12.1 14 3.5 14 3.5z"/></svg></span>
    <span class="cond">PRIME</span>
  </div>
  <div class="comp rail-item r2">
    <span class="lamp off"></span>
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h21l-8 9.5v9l-5-3v-6z"/></svg></span>
    <span class="cond">FILL</span>
  </div>
  <div class="comp rail-item r3">
    <span class="lamp off"></span>
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24.2 15.6A10.5 10.5 0 1 1 20.4 6.2"/><path d="M14.6 4.6l6.4 1.3-1.3 6.4"/><path d="M14 11.5c0 0-4 4.6-4 7.1a4 4 0 0 0 8 0c0-2.5-4-7.1-4-7.1z"/></svg></span>
    <span class="cond">CLEAN</span>
  </div>

  <!-- ── system status: the machine along X, every reed a lamp ── -->
  <div class="win st-well">
    <svg class="st-diag" width="328" height="256" viewBox="0 0 462 361" fill="none" aria-hidden="true"><path d="M2 359 V61.9 L61.9 2 H460 V359 Z" stroke="#8a929c" stroke-width="4" stroke-linejoin="round"/><rect x="173" y="101.6" width="283" height="253.4" rx="4" stroke="#4c525a" stroke-width="3"/><rect x="251" y="170.6" width="127" height="152.4" rx="12" stroke="#4c525a" stroke-width="3"/><rect x="183" y="141.6" width="53" height="211.4" rx="6" stroke="#4c525a" stroke-width="3"/><rect x="393" y="141.6" width="53" height="211.4" rx="6" stroke="#4c525a" stroke-width="3"/><circle cx="180" cy="303.5" r="15" fill="none" stroke="#145f3c" stroke-width="4"/><circle cx="180" cy="303.5" r="13" fill="#17a35c"/><circle cx="180" cy="258.5" r="15" fill="none" stroke="#145f3c" stroke-width="4"/><circle cx="180" cy="258.5" r="13" fill="#17a35c"/><circle cx="180" cy="213.5" r="11" fill="#2c3036" stroke="#6b7480" stroke-width="4"/><circle cx="180" cy="168.5" r="11" fill="#2c3036" stroke="#6b7480" stroke-width="4"/><circle cx="449" cy="303.5" r="15" fill="none" stroke="#145f3c" stroke-width="4"/><circle cx="449" cy="303.5" r="13" fill="#17a35c"/><circle cx="449" cy="258.5" r="15" fill="none" stroke="#145f3c" stroke-width="4"/><circle cx="449" cy="258.5" r="13" fill="#17a35c"/><circle cx="449" cy="213.5" r="11" fill="#2c3036" stroke="#6b7480" stroke-width="4"/><circle cx="449" cy="168.5" r="11" fill="#2c3036" stroke="#6b7480" stroke-width="4"/><circle cx="379.25" cy="261.9" r="15" fill="none" stroke="#145f3c" stroke-width="4"/><circle cx="379.25" cy="261.9" r="13" fill="#17a35c"/><circle cx="379.25" cy="233.7" r="11" fill="#2c3036" stroke="#6b7480" stroke-width="4"/></svg>
    <div class="legend st-lab st-lab1">STATUS</div>
    <span class="lamp green"></span>
    <div class="legend st-verd">READY</div>
    <div class="rule inwell st-r1"></div>
    <div class="legend st-lab st-lab2">REED STATE</div>
    <span class="lamp green kg" style="box-shadow:0 0 0 4px #145f3c"></span>
    <div class="legend st-key st-k1">CLOSED</div>
    <span class="lamp offw ko"></span>
    <div class="legend st-key st-k2">OPEN</div>
  </div>

  <!-- ── the areas: one moulded row across the pane. A second area adds a
       second row; nothing empty is ever drawn. This one is drawn pressed. ── -->
  <div class="comp st-area pressed">
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="14" r="9.2"/><circle cx="14" cy="7.6" r="2.2" fill="currentColor" stroke="none"/><circle cx="8.5" cy="17.2" r="2.2" fill="currentColor" stroke="none"/><circle cx="19.5" cy="17.2" r="2.2" fill="currentColor" stroke="none"/></svg></span>
    <span class="cond">PUMP SERVICE</span>
    <span class="mk go"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5l9 9-9 9"/></svg></span>
  </div>

</div>
</body>
</html>
