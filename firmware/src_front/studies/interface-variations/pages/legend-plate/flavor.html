<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strength · Face — Legend Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <!-- ── header band: printed name, west BACK, SYSTEM ── -->
  <div class="comp back">
    <span class="mk"><svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 14H6"/><path d="M13 7l-7 7 7 7"/></svg></span>
    <span class="cond">BACK</span>
  </div>
  <div class="legend pagename">STRENGTH &middot; FACE</div>
  <div class="comp sysbtn"><span class="lamp off"></span><span class="mk"><svg width="30" height="30" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 24V10.5L10.5 4H24v20z"/></svg></span></div>
  <div class="cond syslabel">SYSTEM</div>
  <div class="rule hdrrule"></div>

  <!-- ── rail: four moulded compartments. one lamp lit, no fills ── -->
  <div class="comp rail-item r0 on">
    <span class="lamp on sm"></span>
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="8" height="20" rx="2" fill="currentColor" stroke="none"/><rect x="17" y="5" width="7" height="18" rx="2"/></svg></span>
    <span class="cond">CHOOSE</span>
  </div>
  <div class="comp rail-item r1">
    <span class="lamp off"></span>
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.5c0 0-7.5 8.6-7.5 13.3a7.5 7.5 0 0 0 15 0C21.5 12.1 14 3.5 14 3.5z"/></svg></span>
    <span class="cond">PRIME</span>
  </div>
  <div class="comp rail-item r2">
    <span class="lamp off"></span>
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h21l-8 9.5v9l-5-3v-6z"/></svg></span>
    <span class="cond">FILL</span>
  </div>
  <div class="comp rail-item r3">
    <span class="lamp off"></span>
    <span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24.2 15.6A10.5 10.5 0 1 1 20.4 6.2"/><path d="M14.6 4.6l6.4 1.3-1.3 6.4"/><path d="M14 11.5c0 0-4 4.6-4 7.1a4 4 0 0 0 8 0c0-2.5-4-7.1-4-7.1z"/></svg></span>
    <span class="cond">CLEAN</span>
  </div>

  <!-- ── west anchor: this channel, at the faucet's own aspect ── -->
  <div class="win fl-anchor">
    <div class="facebox"><img class="face" src="../../assets/flavor_1.png" alt=""></div>
    <div class="strip"><span class="lvl"><span class="n">3</span><span class="of">OF</span><span class="n">4</span></span></div>
  </div>

  <!-- ── strength: two compartments and one readout window ── -->
  <div class="legend fl-lab fl-lab1">STRENGTH</div>
  <div class="comp fl-minus"><span class="mk"><svg width="44" height="44" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 14h18"/></svg></span></div>
  <div class="win fl-read"><span>1:20</span></div>
  <div class="comp fl-plus"><span class="mk"><svg width="44" height="44" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 14h18"/><path d="M14 5v18"/></svg></span></div>
  <div class="fl-range">RANGE 1:10 &mdash; 1:30</div>
  <div class="rule fl-rule"></div>

  <!-- ── the face row: eight, the third chosen. ▶ is drawn pressed ── -->
  <div class="legend fl-lab fl-lab2">FACE</div>
  <div class="comp fl-left"><span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5l-9 9 9 9"/></svg></span></div>
  <div class="win fl-tile t0">
    <div class="facebox"><img class="face" src="../../assets/flavor_4.png" alt=""><div class="scrim"></div></div>
  </div>
  <div class="win fl-tile t1 chosen">
    <div class="facebox"><img class="face" src="../../assets/flavor_1.png" alt=""></div>
  </div>
  <div class="win fl-tile t2">
    <div class="facebox"><img class="face" src="../../assets/flavor_2.png" alt=""><div class="scrim"></div></div>
  </div>
  <div class="comp fl-right pressed"><span class="mk"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5l9 9-9 9"/></svg></span></div>
  <div class="fl-track">
    <div class="cell unlit k0"></div>
    <div class="cell unlit k1"></div>
    <div class="cell lit k2"></div>
    <div class="cell unlit k3"></div>
    <div class="cell unlit k4"></div>
    <div class="cell unlit k5"></div>
    <div class="cell unlit k6"></div>
    <div class="cell unlit k7"></div>
  </div>

</div>
</body>
</html>
