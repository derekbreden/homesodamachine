<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adjust</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- pressed state drawn on this screen: the + key -->
<div class="field">
  <div class="pagename">Adjust</div>
  <div class="badge chA" style="right:24px"><span class="cap">On tap</span><span class="chip"></span><span class="mono">1:20</span></div>
  <div class="framed chA" style="left:24px;top:100px;width:176px;height:324px"><img class="face" src="../../assets/flavor_1.png" alt=""><span class="flag"></span></div>
  <div class="lbl abs" style="left:224px;top:100px">Ratio</div>
  <div class="num abs" style="left:224px;top:120px;font-size:72px;line-height:72px">1:20</div>
  <div class="well ctr" style="left:424px;top:120px;width:72px;height:72px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M3 12 H21"/></svg></div>
  <div class="well ctr pressed" style="left:512px;top:120px;width:72px;height:72px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M3 12 H21"/><path class="st" d="M12 3 V21"/></svg></div>
  <div class="abs lbl" style="left:224px;top:196px">1:10 to 1:30</div>
  <div class="abs hr" style="left:224px;top:224px;width:360px"></div>
  <div class="lbl abs" style="left:224px;top:232px">Face</div>
  <div class="strip" style="left:224px;top:256px;width:284px;height:164px">
    <div class="framed dimtile" style="left:-96px;top:0;width:90px;height:164px"><img class="face" src="../../assets/flavor_3.png" alt=""></div>
    <div class="framed dimtile" style="left:0px;top:0;width:90px;height:164px"><img class="face" src="../../assets/flavor_4.png" alt=""></div>
    <div class="framed chA" style="left:96px;top:0;width:90px;height:164px"><img class="face" src="../../assets/flavor_1.png" alt=""><span class="flag"></span></div>
    <div class="framed dimtile" style="left:192px;top:0;width:90px;height:164px"><img class="face" src="../../assets/flavor_2.png" alt=""></div>
    <div class="framed dimtile" style="left:288px;top:0;width:90px;height:164px"><img class="face" src="../../assets/flavor_3.png" alt=""></div>
    <div class="framed dimtile" style="left:384px;top:0;width:90px;height:164px"><img class="face" src="../../assets/flavor_4.png" alt=""></div>
    <div class="framed dimtile" style="left:480px;top:0;width:90px;height:164px"><img class="face" src="../../assets/flavor_1.png" alt=""></div>
    <div class="framed dimtile" style="left:576px;top:0;width:90px;height:164px"><img class="face" src="../../assets/flavor_2.png" alt=""></div>
  </div>
  <div class="track" style="left:224px;top:420px;width:284px"><div class="seen" style="left:36px;width:106px"></div></div>
  <div class="well ctr col" style="left:520px;top:256px;width:64px;height:164px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M4 5 L11 12 L4 19"/><path class="st" d="M13 5 L20 12 L13 19"/></svg><span class="t2">Drag</span></div>
</div>
<div class="corner"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M15 3 L6 12 L15 21"/></svg></div>
<div class="rail">
  <div class="sk hot" style="top:16px;height:136px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect class="sf" x="2.5" y="2.5" width="8" height="19"/><rect class="st" x="13.5" y="2.5" width="8" height="19" fill="none"/></svg><div class="t">CHOOSE</div></div>
  <div class="sk" style="top:154px;height:102px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M12 2 V12"/><path class="st" d="M7 8 L12 13 L17 8"/><path class="st" d="M3.5 16.5 H20.5 V21.5 H3.5 Z"/></svg><div class="t">PRIME</div></div>
  <div class="sk" style="top:258px;height:102px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M2.5 3.5 H21.5 L14 12.5 V21.5 L10 19.5 V12.5 Z"/></svg><div class="t">FILL</div></div>
  <div class="sk" style="top:362px;height:102px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M21.5 12.5 A9.5 9.5 0 1 1 12 3"/><polygon class="sf" points="12,-0.5 12,6.5 6,3"/><path class="sf" d="M12 7.5 L16.4 14.2 A4.4 4.4 0 1 1 7.6 14.2 Z"/></svg><div class="t">CLEAN</div></div>
  <div class="skdiv" style="top:152px"></div>
  <div class="skdiv" style="top:256px"></div>
  <div class="skdiv" style="top:360px"></div>
</div>
</body>
</html>
