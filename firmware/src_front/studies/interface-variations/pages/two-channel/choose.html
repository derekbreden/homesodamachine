<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- pressed state drawn on this screen: the ADJUST key under the armed channel -->
<div class="field">
  <div class="pagename">Choose</div>
  <div class="badge chA" style="right:24px"><span class="cap">On tap</span><span class="chip"></span><span class="mono">1:20</span></div>
  <div class="block chA on" style="left:0px">
    <div class="rule"></div>
    <div class="framed chA" style="left:24px;top:36px;width:133px;height:244px"><img class="face" src="../../assets/flavor_1.png" alt=""><span class="flag"></span></div>
    <div class="lamp" style="left:237px;top:36px"></div>
    <div class="lbl abs" style="left:176px;top:104px">Ratio</div>
    <div class="num abs" style="left:176px;top:124px;font-size:34px;line-height:40px">1:20</div>
    <div class="lbl abs" style="left:176px;top:192px">Level</div>
    <div class="seg" style="left:176px;top:218px;width:105px"></div>
    <div class="seg lit" style="left:176px;top:236px;width:105px"></div>
    <div class="seg lit" style="left:176px;top:254px;width:105px"></div>
    <div class="seg lit" style="left:176px;top:272px;width:105px"></div>
    <div class="well pressed" style="left:24px;top:304px;width:257px;height:64px"><span class="t">Adjust</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M9 4 L17 12 L9 20"/></svg></div>
  </div>
  <div class="block chB off" style="left:305px">
    <div class="rule"></div>
    <div class="framed chB" style="left:24px;top:36px;width:133px;height:244px"><img class="face" src="../../assets/flavor_2.png" alt=""><span class="flag"></span></div>
    <div class="lamp" style="left:237px;top:36px"></div>
    <div class="lbl abs" style="left:176px;top:104px">Ratio</div>
    <div class="num abs" style="left:176px;top:124px;font-size:34px;line-height:40px">1:14</div>
    <div class="lbl abs" style="left:176px;top:192px">Level</div>
    <div class="seg" style="left:176px;top:218px;width:105px"></div>
    <div class="seg" style="left:176px;top:236px;width:105px"></div>
    <div class="seg" style="left:176px;top:254px;width:105px"></div>
    <div class="seg low" style="left:176px;top:272px;width:105px"></div>
    <div class="abs key warn" style="left:176px;top:290px">Low</div>
    <div class="well" style="left:24px;top:304px;width:257px;height:64px"><span class="t">Adjust</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M9 4 L17 12 L9 20"/></svg></div>
  </div>
</div>
<div class="corner"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M2 6 H22"/><path class="st" d="M2 12 H22"/><path class="st" d="M2 18 H22"/><rect class="sf" x="14" y="2.5" width="5" height="7"/><rect class="sf" x="6" y="8.5" width="5" height="7"/><rect class="sf" x="15" y="14.5" width="5" height="7"/></svg></div>
<div class="rail">
  <div class="sk hot" style="top:16px;height:136px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect class="sf" x="2.5" y="2.5" width="8" height="19"/><rect class="st" x="13.5" y="2.5" width="8" height="19" fill="none"/></svg><div class="t">CHOOSE</div></div>
  <div class="sk" style="top:154px;height:102px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M12 2 V12"/><path class="st" d="M7 8 L12 13 L17 8"/><path class="st" d="M3.5 16.5 H20.5 V21.5 H3.5 Z"/></svg><div class="t">PRIME</div></div>
  <div class="sk" style="top:258px;height:102px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M2.5 3.5 H21.5 L14 12.5 V21.5 L10 19.5 V12.5 Z"/></svg><div class="t">FILL</div></div>
  <div class="sk" style="top:362px;height:102px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path class="st" d="M21.5 12.5 A9.5 9.5 0 1 1 12 3"/><polygon class="sf" points="12,-0.5 12,6.5 6,3"/><path class="sf" d="M12 7.5 L16.4 14.2 A4.4 4.4 0 1 1 7.6 14.2 Z"/></svg><div class="t">CLEAN</div></div>
  <div class="skdiv" style="top:152px"></div>
  <div class="skdiv" style="top:256px"></div>
  <div class="skdiv" style="top:360px"></div>
</div>
</body>
</html>
