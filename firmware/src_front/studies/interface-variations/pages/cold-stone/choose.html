<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose — cold-stone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <!-- ── Gutter: four pictograms, no words. CHOOSE is the tab. ─────────── -->
  <div class="gutter">
    <div class="cell c0 on">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="5" vector-effect="non-scaling-stroke">
        <rect x="9" y="9" width="13" height="4" fill="currentColor" stroke="none"/>
        <rect x="9" y="16" width="13" height="24" vector-effect="non-scaling-stroke"/>
        <rect x="27" y="16" width="13" height="24" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c1">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M24 7C24 7 38 22 38 31A14 14 0 0 1 10 31C10 22 24 7 24 7Z"
              vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c2">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M8 10H40L27 28V40L21 44V28Z" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c3">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M39 24A15 15 0 1 1 24 9" vector-effect="non-scaling-stroke"/>
        <polyline points="18,3 24.5,9 18,15" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
  </div>
  <!-- the rule at x=96, broken where the tab crosses it -->
  <div class="rule-v" style="top:0;height:20px"></div>
  <div class="rule-v" style="top:130px;height:350px"></div>

  <!-- ── Pane ───────────────────────────────────────────────────────────── -->
  <div class="screen" style="position:absolute;left:0;top:0">

    <div class="title pgname" style="top:29px">Choose</div>

    <!-- Settings: a mark, no word, no rail slot -->
    <div class="gear">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linecap="round">
        <circle cx="22" cy="22" r="11" vector-effect="non-scaling-stroke"/>
        <circle cx="22" cy="22" r="4.5" vector-effect="non-scaling-stroke"/>
        <g vector-effect="non-scaling-stroke">
          <line x1="33.5" y1="22" x2="39.5" y2="22" vector-effect="non-scaling-stroke"/>
          <line x1="30.13" y1="30.13" x2="34.37" y2="34.37" vector-effect="non-scaling-stroke"/>
          <line x1="22" y1="33.5" x2="22" y2="39.5" vector-effect="non-scaling-stroke"/>
          <line x1="13.87" y1="30.13" x2="9.63" y2="34.37" vector-effect="non-scaling-stroke"/>
          <line x1="10.5" y1="22" x2="4.5" y2="22" vector-effect="non-scaling-stroke"/>
          <line x1="13.87" y1="13.87" x2="9.63" y2="9.63" vector-effect="non-scaling-stroke"/>
          <line x1="22" y1="10.5" x2="22" y2="4.5" vector-effect="non-scaling-stroke"/>
          <line x1="30.13" y1="13.87" x2="34.37" y2="9.63" vector-effect="non-scaling-stroke"/>
        </g>
      </svg>
    </div>

    <!-- ── The armed channel: a white slab 12 px taller and 12 px wider than
            its neighbour, capped by a 6 px ink bar. ──────────────────────── -->
    <div class="card sel">
      <div class="cap6"></div>
      <div class="gauge" style="left:52px;top:18px">
        <i class="seg"></i><i class="seg on"></i><i class="seg on"></i><i class="seg on"></i>
      </div>
      <svg class="drop" style="left:51px;top:318px" viewBox="0 0 48 48" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
        <path d="M24 7C24 7 38 22 38 31A14 14 0 0 1 10 31C10 22 24 7 24 7Z"
              vector-effect="non-scaling-stroke"/>
      </svg>
      <img class="face" src="../../assets/flavor_1.png" width="172" height="320"
           style="position:absolute;left:84px;top:18px" alt="">
      <div class="foot">
        <span class="ratio-sm">1:20</span>
        <span class="sp"></span>
        <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3" stroke-linecap="round"
             stroke-linejoin="round">
          <polyline points="9,5 16,12 9,19" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
    </div>

    <!-- ── The other channel: no slab, a 2 px frame, all type at 400 in dim.
            Its one filled level segment is the panel's only hue. ────────── -->
    <div class="card un">
      <div class="gauge" style="left:46px;top:6px">
        <i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg warn"></i>
      </div>
      <svg class="drop" style="left:45px;top:306px" viewBox="0 0 48 48" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
        <path d="M24 7C24 7 38 22 38 31A14 14 0 0 1 10 31C10 22 24 7 24 7Z"
              vector-effect="non-scaling-stroke"/>
      </svg>
      <img class="face" src="../../assets/flavor_2.png" width="172" height="320"
           style="position:absolute;left:78px;top:6px" alt="">
      <!-- PRESSED: this foot is the one pressed element on this screen -->
      <div class="foot press">
        <span class="ratio-sm">1:14</span>
        <span class="sp"></span>
        <span class="low" style="margin-right:14px">Low</span>
        <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3" stroke-linecap="round"
             stroke-linejoin="round">
          <polyline points="9,5 16,12 9,19" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
    </div>

  </div>
</div>
</body>
</html>
