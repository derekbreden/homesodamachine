<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose — cold-stone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Nothing on this screen is drawn pressed: the one thing it has to say is
     which channel is armed, and a press device that fills an element would
     argue with the cap that says it. -->
<div class="screen">

  <!-- ── Gutter: four pictograms, no words. CHOOSE is the tab. ─────────── -->
  <div class="gutter">
    <div class="cell c0 on">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="currentColor">
        <rect x="9" y="8" width="13" height="4"/>
        <rect x="9" y="15" width="13" height="25"/>
        <rect x="27" y="15" width="13" height="25"/>
      </svg>
    </div>
    <div class="cell c1">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M24 7C24 7 38 22 38 31A14 14 0 0 1 10 31C10 22 24 7 24 7Z"
              vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c2">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M8 10H40L27 28V40L21 44V28Z" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c3">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M39 24A15 15 0 1 1 24 9" vector-effect="non-scaling-stroke"/>
        <polyline points="18,3 24.5,9 18,15" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
  </div>
  <!-- the rule at x=96, broken where the tab crosses it -->
  <div class="rule-v" style="top:0;height:20px"></div>
  <div class="rule-v" style="top:130px;height:350px"></div>

  <!-- ── Pane ───────────────────────────────────────────────────────────── -->
  <div class="screen" style="position:absolute;left:0;top:0">

    <div class="title pgname" style="top:25px">Choose</div>

    <!-- Settings: a mark, no word, no rail slot -->
    <div class="gear">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linejoin="round">
      <path d="M33.91 17.9 L40.65 18.37 L40.65 25.63 L33.91 26.1 A12.6 12.6 0 0 1 33.32 27.52 L37.75 32.62 L32.62 37.75 L27.52 33.32 A12.6 12.6 0 0 1 26.1 33.91 L25.63 40.65 L18.37 40.65 L17.9 33.91 A12.6 12.6 0 0 1 16.48 33.32 L11.38 37.75 L6.25 32.62 L10.68 27.52 A12.6 12.6 0 0 1 10.09 26.1 L3.35 25.63 L3.35 18.37 L10.09 17.9 A12.6 12.6 0 0 1 10.68 16.48 L6.25 11.38 L11.38 6.25 L16.48 10.68 A12.6 12.6 0 0 1 17.9 10.09 L18.37 3.35 L25.63 3.35 L26.1 10.09 A12.6 12.6 0 0 1 27.52 10.68 L32.62 6.25 L37.75 11.38 L33.32 16.48 A12.6 12.6 0 0 1 33.91 17.9 Z" vector-effect="non-scaling-stroke"/>
      <circle cx="22" cy="22" r="5.5" vector-effect="non-scaling-stroke"/>
    </svg>
    </div>

    <!-- ── The armed channel: a white slab 12 px taller and 12 px wider than
            its neighbour, under a 26 px ink cap across its full top edge —
            the only solid black mass on the panel, and the only thing here
            that is still legible from across the kitchen. ───────────────── -->
    <div class="card sel">
      <div class="capbar" style="height:26px"></div>
      <div class="gauge" style="left:52px;top:30px">
        <i class="seg"></i><i class="seg on"></i><i class="seg on"></i><i class="seg on"></i>
      </div>
      <svg class="drop" style="left:51px;top:330px" viewBox="0 0 48 48" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
        <path d="M24 7C24 7 38 22 38 31A14 14 0 0 1 10 31C10 22 24 7 24 7Z"
              vector-effect="non-scaling-stroke"/>
      </svg>
      <img class="face" src="../../assets/flavor_1.png" width="172" height="320"
           style="position:absolute;left:84px;top:30px" alt="">
      <div class="foot">
        <span class="ratio-sm">1:20</span>
        <span class="sp"></span>
        <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3" stroke-linecap="round"
             stroke-linejoin="round">
          <polyline points="9,5 16,12 9,19" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
    </div>

    <!-- ── The other channel: no slab, no cap, a 2 px frame, all type at 400
            in dim. Its one filled level segment is the panel's only hue. ── -->
    <div class="card un">
      <div class="gauge" style="left:46px;top:18px">
        <i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg warn"></i>
      </div>
      <svg class="drop" style="left:45px;top:318px" viewBox="0 0 48 48" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
        <path d="M24 7C24 7 38 22 38 31A14 14 0 0 1 10 31C10 22 24 7 24 7Z"
              vector-effect="non-scaling-stroke"/>
      </svg>
      <img class="face" src="../../assets/flavor_2.png" width="172" height="320"
           style="position:absolute;left:78px;top:18px" alt="">
      <div class="foot">
        <span class="ratio-sm">1:14</span>
        <span class="sp"></span>
        <span class="low" style="margin-right:14px">Low</span>
        <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3" stroke-linecap="round"
             stroke-linejoin="round">
          <polyline points="9,5 16,12 9,19" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>
    </div>

  </div>
</div>
</body>
</html>
