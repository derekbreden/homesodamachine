<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock — cold-stone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <!-- The operation lock. No gutter, nothing else on the panel is reachable.
       The slab is being eaten by the job: 40% of its width is solid ink, and
       every element the boundary crosses inverts. Two identical copies of the
       content — the lower ink-on-white, the upper white-on-ink clipped to the
       filled region. There is no loop and no illustration: the moving thing
       is the panel being consumed. -->
  <div class="lockslab">

    <div class="lc lc-a">
    <img class="face" src="../../assets/flavor_1.png" width="129" height="240"
         style="position:absolute;left:32px;top:85px" alt="">

    <div class="locktitle" style="left:193px;top:156px">CLEANING</div>
    <div class="lockstep" style="left:193px;top:226px">1 of 3 &middot; water in</div>

    <div class="mins" style="left:436px;top:166px;width:300px">11 MIN LEFT</div>
    <div style="position:absolute;left:496px;top:214px;width:240px;height:2px;
                background:currentColor"></div>

    <!-- The one way out, drawn at rest: solid, 240x88, in the corner the fill
         reaches last. Nothing on this screen is drawn pressed — the abort is
         already the most findable object on it, and a lock is the one screen
         where a demonstration press would be a lie. -->
    <div class="stopkey" style="top:290px">STOP</div>

    <!-- the cycle read as a scale: the boundary is 40% along it -->
    <svg style="position:absolute;left:0;top:420px" width="768" height="24"
         stroke="currentColor" stroke-width="2" fill="none">
      <g vector-effect="non-scaling-stroke">
        <line x1="1.0" y1="8" x2="1.0" y2="24"/>
        <line x1="38.4" y1="16" x2="38.4" y2="24"/>
        <line x1="76.8" y1="16" x2="76.8" y2="24"/>
        <line x1="115.2" y1="16" x2="115.2" y2="24"/>
        <line x1="153.6" y1="16" x2="153.6" y2="24"/>
        <line x1="192.0" y1="8" x2="192.0" y2="24"/>
        <line x1="230.4" y1="16" x2="230.4" y2="24"/>
        <line x1="268.8" y1="16" x2="268.8" y2="24"/>
        <line x1="307.2" y1="16" x2="307.2" y2="24"/>
        <line x1="345.6" y1="16" x2="345.6" y2="24"/>
        <line x1="384.0" y1="8" x2="384.0" y2="24"/>
        <line x1="422.4" y1="16" x2="422.4" y2="24"/>
        <line x1="460.8" y1="16" x2="460.8" y2="24"/>
        <line x1="499.2" y1="16" x2="499.2" y2="24"/>
        <line x1="537.6" y1="16" x2="537.6" y2="24"/>
        <line x1="576.0" y1="8" x2="576.0" y2="24"/>
        <line x1="614.4" y1="16" x2="614.4" y2="24"/>
        <line x1="652.8" y1="16" x2="652.8" y2="24"/>
        <line x1="691.2" y1="16" x2="691.2" y2="24"/>
        <line x1="729.6" y1="16" x2="729.6" y2="24"/>
        <line x1="767.0" y1="8" x2="767.0" y2="24"/>
      </g>
    </svg>
    </div>

    <div class="lc lc-b">
    <img class="face" src="../../assets/flavor_1.png" width="129" height="240"
