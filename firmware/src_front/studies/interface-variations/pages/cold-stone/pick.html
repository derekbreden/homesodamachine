<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick — cold-stone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="gutter">
    <div class="cell c0">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3">
        <rect x="9" y="9" width="13" height="4" fill="currentColor" stroke="none"/>
        <rect x="9" y="16" width="13" height="24" vector-effect="non-scaling-stroke"/>
        <rect x="27" y="16" width="13" height="24" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c1">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M24 7C24 7 38 22 38 31A14 14 0 0 1 10 31C10 22 24 7 24 7Z"
              vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c2 on">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="5" stroke-linejoin="round">
        <path d="M8 10H40L27 28V40L21 44V28Z" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c3">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M39 24A15 15 0 1 1 24 9" vector-effect="non-scaling-stroke"/>
        <polyline points="18,3 24.5,9 18,15" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
  </div>
  <div class="rule-v" style="top:0;height:240px"></div>
  <div class="rule-v" style="top:350px;height:130px"></div>

  <div class="key backkey" style="left:116px;top:14px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15,5 8,12 15,19" vector-effect="non-scaling-stroke"/>
    </svg>
    <span class="t">Choose</span>
  </div>

  <div class="title pgname" style="top:35px;left:312px">Fill a flavor</div>

  <div class="gear">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round">
      <circle cx="22" cy="22" r="11" vector-effect="non-scaling-stroke"/>
      <circle cx="22" cy="22" r="4.5" vector-effect="non-scaling-stroke"/>
      <line x1="33.5" y1="22" x2="39.5" y2="22" vector-effect="non-scaling-stroke"/>
      <line x1="30.13" y1="30.13" x2="34.37" y2="34.37" vector-effect="non-scaling-stroke"/>
      <line x1="22" y1="33.5" x2="22" y2="39.5" vector-effect="non-scaling-stroke"/>
      <line x1="13.87" y1="30.13" x2="9.63" y2="34.37" vector-effect="non-scaling-stroke"/>
      <line x1="10.5" y1="22" x2="4.5" y2="22" vector-effect="non-scaling-stroke"/>
      <line x1="13.87" y1="13.87" x2="9.63" y2="9.63" vector-effect="non-scaling-stroke"/>
      <line x1="22" y1="10.5" x2="22" y2="4.5" vector-effect="non-scaling-stroke"/>
      <line x1="30.13" y1="13.87" x2="34.37" y2="9.63" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

  <!-- PRESSED: the left channel. A pressed target inverts, whole. -->
  <div class="pickcard press" style="left:188px">
    <img class="face" src="../../assets/flavor_1.png" width="172" height="320"
         style="position:absolute;left:20px;top:21px" alt="">
    <div class="badge" style="left:62px;top:137px">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M8 10H40L27 28V40L21 44V28Z" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
  </div>

  <div class="pickcard" style="left:492px">
    <img class="face" src="../../assets/flavor_2.png" width="172" height="320"
         style="position:absolute;left:20px;top:21px" alt="">
    <div class="badge" style="left:62px;top:137px">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M8 10H40L27 28V40L21 44V28Z" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
