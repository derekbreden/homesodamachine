<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — cold-stone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <!-- Settings is not a rail destination, so nothing in the gutter is lit and
       the rule runs unbroken: you are nowhere in the rail. -->
  <div class="gutter">
    <div class="cell c0">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3">
        <rect x="9" y="9" width="13" height="4" fill="currentColor" stroke="none"/>
        <rect x="9" y="16" width="13" height="24" vector-effect="non-scaling-stroke"/>
        <rect x="27" y="16" width="13" height="24" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c1">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M24 7C24 7 38 22 38 31A14 14 0 0 1 10 31C10 22 24 7 24 7Z"
              vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c2">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round">
        <path d="M8 10H40L27 28V40L21 44V28Z" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="cell c3">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M39 24A15 15 0 1 1 24 9" vector-effect="non-scaling-stroke"/>
        <polyline points="18,3 24.5,9 18,15" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
  </div>
  <div class="rule-v" style="top:0;height:480px"></div>

  <div class="key backkey" style="left:116px;top:14px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15,5 8,12 15,19" vector-effect="non-scaling-stroke"/>
    </svg>
    <span class="t">Back</span>
  </div>

  <div class="title pgname" style="top:35px;left:312px">Settings</div>

  <!-- ── System status: the machine's own side profile, a dimension drawing
          on a white slab. ────────────────────────────────────────────────── -->
  <div class="slab" style="left:116px;top:94px;width:448px;height:366px"></div>

  <div class="cap" style="position:absolute;left:136px;top:114px">System status</div>

  <div class="legend" style="left:300px;top:112px;width:244px;justify-content:flex-end">
    <span class="dotf"></span><span class="lbl">Closed</span>
    <span class="doto" style="margin-left:14px"></span><span class="lbl">Open</span>
  </div>

  <div style="position:absolute;left:156px;top:150px">
      <svg class="diagram" width="368" height="290" viewBox="-6 -6 474 373" fill="none" aria-hidden="true">
        <!-- the shell: front wall, 61.87 mm facet off the top-front arris, back wall -->
        <polygon points="0,361.0 0,61.87 61.87,0 462,0 462,361.0" stroke="#101619" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <!-- the cold core at the back of the floor -->
        <rect x="173" y="101.6" width="283" height="253.4" stroke="#58636a" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <!-- the carbonator tube in the middle of it -->
        <rect x="251" y="170.6" width="127" height="152.4" rx="10" stroke="#58636a" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <!-- a reservoir pocket at either end -->
        <rect x="183" y="141.6" width="53" height="211.4" rx="6" stroke="#58636a" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <rect x="393" y="141.6" width="53" height="211.4" rx="6" stroke="#58636a" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <!-- ten reeds. Closed is a filled ink disc, open a ring: fill against ring
             at 16 px is the one reed cue that works with no hue. -->
        <circle cx="183" cy="303.5" r="10.3" fill="#101619"/>
        <circle cx="183" cy="258.5" r="10.3" fill="#101619"/>
        <circle cx="183" cy="213.5" r="10.3" stroke="#9aa5ac" stroke-width="3" vector-effect="non-scaling-stroke"/>
        <circle cx="183" cy="168.5" r="10.3" stroke="#9aa5ac" stroke-width="3" vector-effect="non-scaling-stroke"/>
        <circle cx="446" cy="303.5" r="10.3" fill="#101619"/>
        <circle cx="446" cy="258.5" r="10.3" fill="#101619"/>
        <circle cx="446" cy="213.5" r="10.3" stroke="#9aa5ac" stroke-width="3" vector-effect="non-scaling-stroke"/>
        <circle cx="446" cy="168.5" r="10.3" stroke="#9aa5ac" stroke-width="3" vector-effect="non-scaling-stroke"/>
        <!-- the carbonator low and high, on the tube aft wall -->
        <circle cx="378" cy="261.9" r="10.3" fill="#101619"/>
        <circle cx="378" cy="233.7" r="10.3" stroke="#9aa5ac" stroke-width="3" vector-effect="non-scaling-stroke"/>
      </svg>
  </div>

  <!-- ── The areas a person can go into. Room for more. ──────────────────── -->
  <div class="cap" style="position:absolute;left:588px;top:114px">Areas</div>

  <!-- PRESSED: the one pressed element on this screen -->
  <div class="key areakey press" style="top:146px">
    <svg width="40" height="40" viewBox="0 0 44 44" fill="none" stroke="currentColor"
         stroke-width="3">
      <circle cx="22" cy="22" r="16" vector-effect="non-scaling-stroke"/>
      <circle cx="22" cy="22" r="11" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <circle cx="22" cy="33" r="3.5" fill="currentColor" stroke="none"/>
      <circle cx="12.47" cy="16.5" r="3.5" fill="currentColor" stroke="none"/>
      <circle cx="31.53" cy="16.5" r="3.5" fill="currentColor" stroke="none"/>
    </svg>
    <span class="keylabel">Pump<br>Service</span>
  </div>

</div>
</body>
</html>
