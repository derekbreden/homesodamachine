<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock — bronze-fascia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="stage">

    <!-- The machine has taken the panel away: the fascia is unlit, and the
         one mark in the corner says so without a word. -->
    <div class="corner">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <rect x="9" y="19" width="26" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14.5 19 V13.5 a7.5 7.5 0 0 1 15 0 V19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 26 V31" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    </div>

    <img class="face" src="../../assets/flavor_1.png" alt=""
         style="left:20px;top:80px;width:129px;height:240px">

    <div class="abs ltitle" style="left:194px;top:66px">Cleaning</div>

    <div class="abs num brass" style="left:194px;top:148px">11</div>
    <div class="abs brass" style="left:278px;top:186px;font-size:32px;line-height:34px;font-weight:400;letter-spacing:.06em">MIN LEFT</div>

    <!-- Progress is weight, not fill: a hairline across the whole cycle that
         thickens to brass across what is done. -->
    <div class="abs prog-track" style="left:194px;top:271px;width:586px"></div>
    <div class="abs prog-done"  style="left:194px;top:268px;width:234px"></div>
    <div class="abs prog-edge"  style="left:428px;top:258px;height:28px"></div>

    <div class="abs body dim" style="left:194px;top:296px">1 of 3 &middot; water in</div>

  </div>

  <div class="fascia dark">
    <div class="stopkey press">STOP</div>
  </div>

</div>
</body>
</html>
