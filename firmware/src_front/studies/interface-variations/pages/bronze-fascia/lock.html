<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock — bronze-fascia</title>
<!-- No press is drawn: STOP is shown at rest, which is how it waits. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="stage">

    <!-- The machine has taken the panel away, and says so without a word. -->
    <!-- Settings is not a customer destination: a hairline mark in the
         stage's corner, at the head's own centre line, never on the fascia.
         The 44px mark sits in a 64px target. -->
    <div class="corner">
<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <rect x="9" y="19" width="26" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14.5 19 V13.5 a7.5 7.5 0 0 1 15 0 V19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 26 V31" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    </div>

    <img class="face" src="../../assets/flavor_1.png" alt=""
         style="left:20px;top:84px;width:148px;height:275px">

    <div class="abs ltitle" style="left:194px;top:78px">Cleaning</div>

    <div class="abs timerow" style="left:194px;top:146px">
      <span class="num brass">11</span>
      <span class="brass minleft">MIN LEFT</span>
    </div>

    <!-- Progress is weight: a hairline across the whole cycle that thickens
         to brass across what is done, the step between them the leading edge. -->
    <div class="abs prog-track" style="left:194px;top:267px;width:586px"></div>
    <div class="abs prog-done"  style="left:194px;top:264px;width:234px"></div>
    <div class="abs prog-edge"  style="left:428px;top:254px;height:28px"></div>

    <div class="abs body dim" style="left:194px;top:335px">1 of 3 &middot; water in</div>

  </div>

  <!-- The fascia unlights. One key is left in it: the way out. -->
  <div class="fascia dark">
    <div class="stopkey">STOP</div>
  </div>

</div>
</body>
</html>
