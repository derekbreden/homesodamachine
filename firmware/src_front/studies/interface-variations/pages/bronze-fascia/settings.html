<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — bronze-fascia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="stage">

    <div class="head">
      <div class="backkey" style="left:0"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5 L6.5 12 L14.5 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></div>
      <div class="pname" style="left:188px">Settings</div>
    </div>

    <div class="panelcard" style="left:20px;top:84px;width:440px;height:272px"></div>
    <svg class="abs" width="270" height="212" viewBox="0 0 270.2 212.0"
             style="left:105px;top:96px" aria-hidden="true">
          <!-- the shell, front on the left, the display's 45° facet cut off
               the top-front arris and drawn in brass: you are standing here -->
          <polyline points="2.0,210.0 2.0,37.6 37.6,2.0 268.2,2.0 268.2,210.0 2.0,210.0" fill="none" stroke="#6a5f4e" stroke-width="2"
                    stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M2.0 37.6 L37.6 2.0"
                stroke="#c39b4a" stroke-width="3" stroke-linecap="round" fill="none"/>

          <!-- the cold core at the back of the floor -->
          <rect x="102.3" y="61.3" width="161.9" height="144.6"
                rx="2" fill="none" stroke="#3a3228" stroke-width="2"/>
          <!-- the carbonator's tube in the middle of it -->
          <rect x="147.8" y="100.5" width="71.4" height="87.6"
                rx="6" fill="none" stroke="#3a3228" stroke-width="2"/>
          <!-- a reservoir pocket at either end -->
          <rect x="108.0" y="83.8" width="30.0" height="121.0"
                rx="3" fill="none" stroke="#3a3228" stroke-width="2"/>
          <rect x="228.4" y="83.8" width="30.0" height="121.0"
                rx="3" fill="none" stroke="#3a3228" stroke-width="2"/>

          <circle cx="108.0" cy="176.9" r="7" fill="#7fa86a"/>
          <circle cx="108.0" cy="150.9" r="7" fill="#7fa86a"/>
          <circle cx="108.0" cy="125.0" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
          <circle cx="108.0" cy="99.1" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
          <circle cx="258.4" cy="176.9" r="7" fill="#7fa86a"/>
          <circle cx="258.4" cy="150.9" r="7" fill="#7fa86a"/>
          <circle cx="258.4" cy="125.0" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
          <circle cx="258.4" cy="99.1" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
          <circle cx="219.2" cy="152.9" r="7" fill="#7fa86a"/>
          <circle cx="219.2" cy="136.7" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
        </svg>
    <div class="abs legend-dot closed" style="left:122px;top:318px"></div>
    <div class="abs cap" style="left:146px;top:318px;letter-spacing:.10em">Closed</div>
    <div class="abs legend-dot open" style="left:254px;top:318px"></div>
    <div class="abs cap" style="left:278px;top:318px;letter-spacing:.10em">Open</div>

    <div class="abs cap" style="left:480px;top:84px">Areas</div>
    <div class="abs key press" style="left:480px;top:116px;width:300px;height:88px">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="15" r="11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="17.00" cy="8.20" r="3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="22.89" cy="18.40" r="3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="11.11" cy="18.40" r="3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 30.5 H31" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      <span>Pump service</span>
    </div>
    <div class="abs seam" style="left:480px;top:228px;width:300px"></div>

  </div>

  <!-- The fascia: the four customer destinations, and nothing else. -->
  <div class="fascia">
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="3.5" y="3.5" width="9" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="25" width="10" height="3" fill="currentColor"/>
        <rect x="18.5" y="7.5" width="8" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CHOOSE</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M8 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 25 V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 13.5 L15 9 L19.5 13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">PRIME</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M4 5 H26 L17.5 15.5 V25 L12.5 27.5 V15.5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">FILL</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M17.5 9 C17.5 9 24 17 24 21 A6.5 6.5 0 0 1 11 21 C11 17 17.5 9 17.5 9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 3.5 V10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 7 H9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CLEAN</div>
    </div>
  </div>

</div>
</body>
</html>
