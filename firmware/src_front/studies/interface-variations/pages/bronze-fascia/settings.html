<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — bronze-fascia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="stage">

    <div class="head">
      <div class="backkey" style="left:0"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5 L6.5 12 L14.5 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></div>
      <div class="pname abs" style="left:188px">Settings</div>
    </div>

    <!-- Full is the sage disc, empty the hairline ring: a level, not a dot
         that happens to be on. No key is needed to read it. -->
    <div class="abs cap" style="left:20px;top:84px">System status</div>
    <div class="panelcard" style="left:20px;top:116px;width:360px;height:240px"></div>
    <svg class="abs" width="280" height="220" viewBox="0 0 280.4 220.0"
             style="left:60px;top:126px" aria-hidden="true">
          <!-- the shell, front on the left; the display's 45 degree facet off
               the top-front arris, in brass: this glass is standing there -->
          <polyline points="2.0,218.0 2.0,39.0 39.0,2.0 278.4,2.0 278.4,218.0 2.0,218.0" fill="none" stroke="#6a5f4e" stroke-width="2"
                    stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M2.0 39.0 L39.0 2.0"
                stroke="#c39b4a" stroke-width="3" stroke-linecap="round" fill="none"/>

          <!-- the cold core at the back of the floor -->
          <rect x="106.1" y="63.6" width="168.1" height="150.2"
                rx="2" fill="none" stroke="#3a3228" stroke-width="2"/>
          <!-- the carbonator's tube in the middle of it -->
          <rect x="153.4" y="104.3" width="74.2" height="90.9"
                rx="6" fill="none" stroke="#3a3228" stroke-width="2"/>
          <!-- a reservoir pocket at either end: the vessels the reed
               columns are reading, so they carry the drawing's stronger line -->
          <rect x="112.1" y="87.0" width="31.1" height="125.7"
                rx="3" fill="none" stroke="#6a5f4e" stroke-width="2"/>
          <rect x="237.1" y="87.0" width="31.1" height="125.7"
                rx="3" fill="none" stroke="#6a5f4e" stroke-width="2"/>

          <circle cx="112.1" cy="183.6" r="7" fill="#7fa86a"/>
          <circle cx="112.1" cy="156.7" r="7" fill="#7fa86a"/>
          <circle cx="112.1" cy="129.7" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
          <circle cx="112.1" cy="102.8" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
          <circle cx="268.3" cy="183.6" r="7" fill="#7fa86a"/>
          <circle cx="268.3" cy="156.7" r="7" fill="#7fa86a"/>
          <circle cx="268.3" cy="129.7" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
          <circle cx="268.3" cy="102.8" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
          <circle cx="227.6" cy="158.7" r="7" fill="#7fa86a"/>
          <circle cx="227.6" cy="141.8" r="6" fill="#201c17" stroke="#6a5f4e" stroke-width="2"/>
        </svg>

    <div class="abs cap" style="left:400px;top:84px">Areas</div>
    <div class="abs key press" style="left:400px;top:116px;width:380px;height:120px">
        <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="10.5" r="3" fill="currentColor"/>
        <circle cx="24.5" cy="21.8" r="3" fill="currentColor"/>
        <circle cx="11.5" cy="21.8" r="3" fill="currentColor"/>
        <path d="M1 18 H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 18 H35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Pump service</span>
    </div>
    <!-- the seam the next area lands on -->
    <div class="abs seam" style="left:400px;top:260px;width:380px"></div>

  </div>

  <!-- The fascia: the four customer destinations, and nothing else. -->
  <div class="fascia">
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="3.5" y="3.5" width="9" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="25" width="10" height="3" fill="currentColor"/>
        <rect x="18.5" y="7.5" width="8" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CHOOSE</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M8 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 25 V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 13.5 L15 9 L19.5 13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">PRIME</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M4 5 H26 L17.5 15.5 V25 L12.5 27.5 V15.5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">FILL</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M17.5 9 C17.5 9 24 17 24 21 A6.5 6.5 0 0 1 11 21 C11 17 17.5 9 17.5 9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 3.5 V10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 7 H9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CLEAN</div>
    </div>
  </div>

</div>
</body>
</html>
