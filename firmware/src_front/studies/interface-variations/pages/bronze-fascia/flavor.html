<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flavor — bronze-fascia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="stage">

    <div class="head">
      <div class="backkey" style="left:0"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5 L6.5 12 L14.5 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></div>
    </div>

    <!-- Which flavor this is, said in the picture. 148×275 is 43:80. -->
    <img class="face" src="../../assets/flavor_1.png" alt=""
         style="left:20px;top:84px;width:148px;height:275px">

    <div class="abs cap" style="left:194px;top:84px">Ratio</div>
    <div class="abs step" style="left:194px;top:112px"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 16 H25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <div class="abs num brass" style="left:290px;top:114px;width:190px;text-align:center">1:20</div>
    <div class="abs step press" style="left:494px;top:112px"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 16 H25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M16 7 V25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <div class="abs body dim" style="left:598px;top:141px">1:10 – 1:30</div>

    <div class="abs cap" style="left:194px;top:200px">Face</div>

    <!-- The row is wider than the strip; the keys travel it and the track
         says where in it you are. At the row's head the left key is dead. -->
    <div class="abs travel off" style="left:194px;top:245px"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 L7 12 L15 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="strip" style="left:260px;top:229px;width:454px;height:120px">
      <img class="tile" src="../../assets/flavor_1.png" alt="" style="left:10px;top:12px;width:54px;height:100px">
      <img class="tile" src="../../assets/flavor_2.png" alt="" style="left:78px;top:12px;width:54px;height:100px">
      <img class="tile pick" src="../../assets/flavor_3.png" alt="" style="left:146px;top:6px;width:54px;height:100px">
      <img class="tile" src="../../assets/flavor_4.png" alt="" style="left:214px;top:12px;width:54px;height:100px">
      <img class="tile" src="../../assets/flavor_1.png" alt="" style="left:282px;top:12px;width:54px;height:100px">
      <img class="tile" src="../../assets/flavor_2.png" alt="" style="left:350px;top:12px;width:54px;height:100px">
      <img class="tile" src="../../assets/flavor_3.png" alt="" style="left:418px;top:12px;width:54px;height:100px">
      <img class="tile" src="../../assets/flavor_4.png" alt="" style="left:486px;top:12px;width:54px;height:100px">
    </div>
    <div class="abs travel" style="left:724px;top:245px"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5 L17 12 L9 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="abs track" style="left:260px;top:355px;width:454px"></div>
    <div class="abs thumb" style="left:260px;top:355px;width:375px"></div>

  </div>

  <!-- The fascia: the four customer destinations, and nothing else. -->
  <div class="fascia">
    <div class="fkey on">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="3.5" y="3.5" width="9" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="25" width="10" height="3" fill="currentColor"/>
        <rect x="18.5" y="7.5" width="8" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CHOOSE</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M8 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 25 V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 13.5 L15 9 L19.5 13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">PRIME</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M4 5 H26 L17.5 15.5 V25 L12.5 27.5 V15.5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">FILL</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M17.5 9 C17.5 9 24 17 24 21 A6.5 6.5 0 0 1 11 21 C11 17 17.5 9 17.5 9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 3.5 V10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 7 H9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CLEAN</div>
    </div>
  </div>

</div>
</body>
</html>
