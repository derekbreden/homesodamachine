<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flavor — bronze-fascia</title>
<!-- The pressed element on this screen is the ratio + key. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="stage">

    <div class="head">
      <div class="backkey" style="left:0"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5 L6.5 12 L14.5 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></div>
      <div class="abs cap" style="left:174px;top:30px">Ratio</div>
    </div>

    <!-- Which flavor this is, said in the picture. 148×275 is 43:80. -->
    <img class="face" src="../../assets/flavor_1.png" alt=""
         style="left:20px;top:84px;width:148px;height:275px">

    <div class="abs step" style="left:194px;top:84px"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 16 H25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <div class="abs num brass" style="left:282px;top:88px;width:196px;text-align:center">1:20</div>
    <div class="abs step press" style="left:480px;top:84px"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 16 H25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M16 7 V25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <div class="abs body dim" style="left:596px;top:112px">1:10 – 1:30</div>

    <div class="abs cap" style="left:260px;top:178px">Face</div>

    <!-- The row is wider than the strip. The travel keys are as tall as the
         row they move, the track says where in it you are, and at the row's
         head the left key is dead brass because it cannot travel. -->
    <div class="abs travel off" style="left:188px;top:210px"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 L7 12 L15 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="strip" style="left:260px;top:210px;width:448px;height:139px">
      <img class="tile" src="../../assets/flavor_1.png" alt="" style="left:10px;top:14px;width:60px;height:112px">
      <img class="tile" src="../../assets/flavor_2.png" alt="" style="left:86px;top:14px;width:60px;height:112px">
      <img class="tile pick" src="../../assets/flavor_3.png" alt="" style="left:162px;top:8px;width:60px;height:112px">
      <img class="tile" src="../../assets/flavor_4.png" alt="" style="left:238px;top:14px;width:60px;height:112px">
      <img class="tile" src="../../assets/flavor_1.png" alt="" style="left:314px;top:14px;width:60px;height:112px">
      <img class="tile" src="../../assets/flavor_2.png" alt="" style="left:390px;top:14px;width:60px;height:112px">
      <img class="tile" src="../../assets/flavor_3.png" alt="" style="left:466px;top:14px;width:60px;height:112px">
      <img class="tile" src="../../assets/flavor_4.png" alt="" style="left:542px;top:14px;width:60px;height:112px">
    </div>
    <div class="abs travel" style="left:716px;top:210px"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5 L17 12 L9 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="abs track" style="left:260px;top:355px;width:448px"></div>
    <div class="abs thumb" style="left:260px;top:355px;width:328px"></div>

  </div>

  <!-- The fascia: the four customer destinations, and nothing else. -->
  <div class="fascia">
    <div class="fkey on">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="3.5" y="3.5" width="9" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="25" width="10" height="3" fill="currentColor"/>
        <rect x="18.5" y="7.5" width="8" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CHOOSE</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M8 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 25 V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 13.5 L15 9 L19.5 13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">PRIME</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M4 5 H26 L17.5 15.5 V25 L12.5 27.5 V15.5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">FILL</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M17.5 9 C17.5 9 24 17 24 21 A6.5 6.5 0 0 1 11 21 C11 17 17.5 9 17.5 9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 3.5 V10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 7 H9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CLEAN</div>
    </div>
  </div>

</div>
</body>
</html>
