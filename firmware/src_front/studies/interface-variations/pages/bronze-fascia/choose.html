<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose — bronze-fascia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="stage">

    <div class="head"><div class="pname">Choose a flavor</div></div>
    <!-- Settings: a hairline mark in the stage's corner, never on the fascia. -->
    <div class="corner">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <rect x="19.6" y="3" width="4.8" height="7" fill="currentColor" transform="rotate(0 22 22)"/>
      <rect x="19.6" y="3" width="4.8" height="7" fill="currentColor" transform="rotate(45 22 22)"/>
      <rect x="19.6" y="3" width="4.8" height="7" fill="currentColor" transform="rotate(90 22 22)"/>
      <rect x="19.6" y="3" width="4.8" height="7" fill="currentColor" transform="rotate(135 22 22)"/>
      <rect x="19.6" y="3" width="4.8" height="7" fill="currentColor" transform="rotate(180 22 22)"/>
      <rect x="19.6" y="3" width="4.8" height="7" fill="currentColor" transform="rotate(225 22 22)"/>
      <rect x="19.6" y="3" width="4.8" height="7" fill="currentColor" transform="rotate(270 22 22)"/>
      <rect x="19.6" y="3" width="4.8" height="7" fill="currentColor" transform="rotate(315 22 22)"/>
      <circle cx="22" cy="22" r="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="22" cy="22" r="5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    </div>

  <div class="card on" style="left:20px;top:68px;width:360px;height:288px"></div>
  <img class="face" src="../../assets/flavor_1.png" alt="" style="left:40px;top:109px;width:129px;height:240px">
  <div class="abs cap" style="left:193px;top:109px">Ratio</div>
  <div class="abs num sm brass" style="left:193px;top:135px">1:20</div>
  <div class="abs cap" style="left:193px;top:201px">Level</div>
  <div class="abs seg good" style="left:193px;top:229px"></div>
  <div class="abs seg good" style="left:238px;top:229px"></div>
  <div class="abs seg good" style="left:283px;top:229px"></div>
  <div class="abs seg off" style="left:328px;top:229px"></div>
  <div class="abs key press" style="left:193px;top:277px;width:167px;height:72px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 8 H21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 16 H21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15.5" cy="16" r="3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Adjust</span>
    </div>

  <div class="card" style="left:420px;top:92px;width:360px;height:264px"></div>
  <img class="face" src="../../assets/flavor_2.png" alt="" style="left:440px;top:109px;width:129px;height:240px">
  <div class="abs cap" style="left:593px;top:109px">Ratio</div>
  <div class="abs num sm dimc" style="left:593px;top:135px">1:14</div>
  <div class="abs cap" style="left:593px;top:201px">Level</div>
  <div class="abs cap warnc" style="left:712px;top:201px;letter-spacing:.10em">Low</div>
  <div class="abs seg warn" style="left:593px;top:229px"></div>
  <div class="abs seg off" style="left:638px;top:229px"></div>
  <div class="abs seg off" style="left:683px;top:229px"></div>
  <div class="abs seg off" style="left:728px;top:229px"></div>
  <div class="abs key mute" style="left:593px;top:277px;width:167px;height:72px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 8 H21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 16 H21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15.5" cy="16" r="3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Adjust</span>
    </div>

  </div>

  <!-- The fascia: the four customer destinations, and nothing else. -->
  <div class="fascia">
    <div class="fkey on">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="3.5" y="3.5" width="9" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="25" width="10" height="3" fill="currentColor"/>
        <rect x="18.5" y="7.5" width="8" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CHOOSE</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M8 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 3 V27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 25 V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 13.5 L15 9 L19.5 13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">PRIME</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M4 5 H26 L17.5 15.5 V25 L12.5 27.5 V15.5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">FILL</div>
    </div>
    <div class="fkey">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M17.5 9 C17.5 9 24 17 24 21 A6.5 6.5 0 0 1 11 21 C11 17 17.5 9 17.5 9 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 3.5 V10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 7 H9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="fw">CLEAN</div>
    </div>
  </div>

</div>
</body>
</html>
