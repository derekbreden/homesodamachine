<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tap House — Cleaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* The operation lock. The panel is withheld: hazard banding top and bottom,
     the cycle read off a brass gauge, and one way out. */
  body { background: var(--bg); }
  .hazard { position: absolute; left: 0; width: 800px; height: 10px;
            background: repeating-linear-gradient(45deg,
              #d2a24c 0 9px, #241a12 9px 18px); }
  .gauge { position: absolute; left: 40px; top: 22px; }
  .mount { position: absolute; left: 94px; top: 258px; width: 132px; height: 198px;
           display: flex; align-items: center; justify-content: center; }
  .op   { position: absolute; left: 320px; top: 34px; font-size: 44px; line-height: 1; }
  .step { position: absolute; left: 320px; top: 112px; font-size: 22px;
          font-weight: 500; color: var(--dim); letter-spacing: .02em; }
  .bar  { position: absolute; left: 320px; top: 164px; width: 456px; height: 22px;
          background: var(--recess); box-shadow: inset 0 0 0 1px var(--bronze); }
  .bar .fill { position: absolute; left: 0; top: 0; width: 182px; height: 22px; background: var(--brass); }
  .bar .div  { position: absolute; top: 0; width: 2px; height: 22px; background: var(--bg); }
  .mins { left: 320px; top: 212px; width: 456px; height: 64px;
          font-size: 30px; font-weight: 700; letter-spacing: .10em; text-transform: uppercase; }
  .stop { position: absolute; left: 320px; top: 332px; width: 456px; height: 92px;
          background: var(--stop); border: 2px solid var(--cream); box-sizing: border-box;
          display: flex; align-items: center; justify-content: center; gap: 20px;
          color: var(--cream); font-size: 34px; font-weight: 700; letter-spacing: .18em; }
  .stop.pressed { background: #5e2720;
                  box-shadow: inset 2px 2px 0 rgba(0,0,0,.55), inset -2px -2px 0 rgba(244,236,224,.18); }
</style>
</head>

  <div class="plate mount">

</html>
