<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tap House — Cleaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* The operation lock. The panel is withheld: hazard banding top and bottom,
     the cycle read off a brass gauge, and one way out. Both columns land on
     one floor at y=444. The needle is the only thing that moves; 40% here.
     Pressed element: STOP. */
  .hazard { position: absolute; left: 0; width: 800px; height: 10px;
            background: repeating-linear-gradient(45deg, #d2a24c 0 9px, #241a12 9px 18px); }
  .gauge { position: absolute; left: 40px; top: 18px; }
  .op   { position: absolute; left: 320px; top: 18px; font-size: 44px; line-height: 1; }
  .cyc  { position: absolute; left: 320px; top: 92px; font-size: 22px;
          font-weight: 500; color: var(--dim); letter-spacing: .02em; }
  .bar  { position: absolute; left: 320px; top: 140px; width: 456px; height: 24px;
          background: var(--recess); box-shadow: inset 0 0 0 1px var(--bronze); }
  /* the instrument column's edge — the brass rail's job on the other four pages */
  .divide { position: absolute; left: 296px; top: 18px; width: 2px; height: 426px;
            background: var(--bronze); }
  .bar .fill { position: absolute; left: 0; top: 0; width: 182px; height: 24px; background: var(--brass); }
  /* the one fact a person standing in the kitchen wants, engraved in brass */
  .mins { left: 320px; top: 184px; width: 330px; height: 80px; justify-content: flex-start;
          padding-left: 28px; box-sizing: border-box;
          font-size: 36px; letter-spacing: .05em; text-transform: uppercase; }
  /* the abort is larger than any commit on this machine, and it is the only
     thing on the lock a touch can reach */
  .stop { position: absolute; left: 320px; top: 304px; width: 456px; height: 140px;
          background: var(--stop); border: 2px solid var(--cream); box-sizing: border-box;
          display: flex; align-items: center; justify-content: center; gap: 24px;
          color: var(--cream); font-size: 44px; letter-spacing: .16em; text-transform: uppercase; }
  .stop.pressed { background: #5b2620; padding-top: 4px;
                  box-shadow: inset 5px 5px 0 rgba(0,0,0,.55), inset -5px -5px 0 rgba(244,236,224,.14); }
</style>
</head>
<body>
<div class="screen">
  <div class="hazard" style="top:0"></div>
  <div class="hazard" style="top:470px"></div>
  <div class="divide"></div>
  <svg class="gauge" width="240" height="240" viewBox="0 0 240 240" fill="none">
    <circle cx="120" cy="120" r="112" fill="#1a120c"/>
    <circle cx="120" cy="120" r="116" stroke="#d2a24c" stroke-width="5"/>
    <circle cx="120" cy="120" r="108" stroke="#7d5a34" stroke-width="1"/>
    <line x1="33.4" y1="170.0" x2="49.0" y2="161.0" stroke="#d2a24c" stroke-width="3.5"/>
    <line x1="25.8" y1="153.5" x2="35.2" y2="150.1" stroke="#7d5a34" stroke-width="2"/>
    <line x1="21.3" y1="135.9" x2="31.1" y2="134.3" stroke="#7d5a34" stroke-width="2"/>
    <line x1="20.0" y1="117.7" x2="30.0" y2="118.0" stroke="#7d5a34" stroke-width="2"/>
    <line x1="22.1" y1="99.7" x2="31.9" y2="101.7" stroke="#7d5a34" stroke-width="2"/>
    <line x1="27.4" y1="82.3" x2="36.7" y2="86.0" stroke="#7d5a34" stroke-width="2"/>
    <line x1="35.8" y1="66.1" x2="44.2" y2="71.5" stroke="#7d5a34" stroke-width="2"/>
    <line x1="46.9" y1="51.7" x2="54.2" y2="58.6" stroke="#7d5a34" stroke-width="2"/>
    <line x1="60.5" y1="39.6" x2="66.4" y2="47.7" stroke="#7d5a34" stroke-width="2"/>
    <line x1="76.0" y1="30.2" x2="80.4" y2="39.2" stroke="#7d5a34" stroke-width="2"/>
    <line x1="93.0" y1="23.7" x2="95.7" y2="33.3" stroke="#7d5a34" stroke-width="2"/>
    <line x1="110.9" y1="20.4" x2="111.8" y2="30.4" stroke="#7d5a34" stroke-width="2"/>
    <line x1="129.1" y1="20.4" x2="128.2" y2="30.4" stroke="#7d5a34" stroke-width="2"/>
    <line x1="147.0" y1="23.7" x2="144.3" y2="33.3" stroke="#7d5a34" stroke-width="2"/>
    <line x1="164.0" y1="30.2" x2="159.6" y2="39.2" stroke="#7d5a34" stroke-width="2"/>
    <line x1="179.5" y1="39.6" x2="173.6" y2="47.7" stroke="#7d5a34" stroke-width="2"/>
    <line x1="193.1" y1="51.7" x2="185.8" y2="58.6" stroke="#7d5a34" stroke-width="2"/>
    <line x1="204.2" y1="66.1" x2="195.8" y2="71.5" stroke="#7d5a34" stroke-width="2"/>
    <line x1="212.6" y1="82.3" x2="203.3" y2="86.0" stroke="#7d5a34" stroke-width="2"/>
    <line x1="217.9" y1="99.7" x2="208.1" y2="101.7" stroke="#7d5a34" stroke-width="2"/>
    <line x1="220.0" y1="117.7" x2="210.0" y2="118.0" stroke="#7d5a34" stroke-width="2"/>
    <line x1="218.7" y1="135.9" x2="208.9" y2="134.3" stroke="#7d5a34" stroke-width="2"/>
    <line x1="214.2" y1="153.5" x2="204.8" y2="150.1" stroke="#7d5a34" stroke-width="2"/>
    <line x1="206.6" y1="170.0" x2="191.0" y2="161.0" stroke="#d2a24c" stroke-width="3.5"/>
    <path d="M 213.49 110.17 A 94 94 0 0 1 201.41 167.00" stroke="#8c3b2e" stroke-width="9"/>
    <!-- cream numerals only at the two ends, each on its own tick's radius -->
    <text x="57.6" y="161.5" fill="#f4ece0" font-family="Work Sans" font-size="16" font-weight="600" text-anchor="middle">0</text>
    <text x="182.4" y="161.5" fill="#f4ece0" font-family="Work Sans" font-size="16" font-weight="600" text-anchor="middle">100</text>
    <text x="120" y="186" fill="#a9967c" font-family="Work Sans" font-size="15" font-weight="600" letter-spacing="2.6" text-anchor="middle">CYCLE</text>
    <line x1="128.95" y1="140.10" x2="89.09" y2="50.57" stroke="#d2a24c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="13" fill="#d2a24c"/>
    <circle cx="120" cy="120" r="5" fill="#1a120c"/>
  </svg>
  <div class="badge b-s" style="position:absolute; left:108px; top:266px"><span class="riv t"></span><span class="riv b"></span><i><img src="../../assets/flavor_1.png" alt=""></i></div>
  <div class="op display">Cleaning</div>
  <div class="rule" style="left:320px; top:78px; width:456px"></div>
  <div class="cyc">1 of 3 &middot; water in</div>
  <div class="bar"><div class="fill"></div></div>
  <div class="engrave mins display num">11 min left</div>
  <div class="stop display pressed">
    <svg width="54" height="54" viewBox="0 0 32 32"><path d="M10.5 2h11L30 10.5v11L21.5 30h-11L2 21.5v-11Z" fill="#f4ece0"/></svg>
    <span>Stop</span>
  </div>
</div>
</body>
</html>
