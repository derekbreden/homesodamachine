<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock — soft-clay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="flood"></div>
  <!-- No press is drawn here: STOP is the one way out and is shown at rest,
       the only terracotta object inside the oat card. -->
  <div class="lockcard">
    <div class="inlay seated" style="left:36px;top:36px;width:86px;height:160px;border-radius:16px;border-width:3px"><img src="../../assets/flavor_1.png" alt=""></div>
    <div class="at" style="left:150px;top:62px;color:var(--acc)"><svg class="mk" width="56" height="56" viewBox="0 0 24 24" stroke-width="1.9" aria-hidden="true"><path d="M4.2 12.9h15.6v2.8a5.6 5.6 0 0 1-5.6 5.6h-4.4a5.6 5.6 0 0 1-5.6-5.6z"/><circle cx="8.9" cy="6.7" r="2.5"/><circle cx="14.9" cy="8.5" r="1.8"/><circle cx="12.3" cy="3.2" r="1.3"/></svg></div>
    <div class="at n64" style="left:224px;top:52px">Cleaning</div>
    <div class="at note" style="left:224px;top:142px">1 of 3 &middot; water in</div>
    <div class="at n40" style="left:36px;top:232px;color:var(--acc)">11 MIN LEFT</div>
    <div class="trough" style="left:36px;top:292px;width:320px;height:28px"><b style="width:40%"></b></div>
    <div class="btn acc" style="left:384px;top:228px;width:220px;height:96px;border-radius:48px"><span class="w" style="font-size:26px;font-weight:700;letter-spacing:.08em">STOP</span></div>
  </div>
</div>
</body>
</html>
