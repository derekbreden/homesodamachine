<!doctype html>
<html lang="en">
<head>

  <div class="pane">
    <div class="btn up" style="left:24px;top:16px;width:140px;height:60px;border-radius:26px"><svg class="mk" width="24" height="24" viewBox="0 0 24 24" stroke-width="2.3" aria-hidden="true"><path d="M10.6 5.2 3.8 12l6.8 6.8"/><path d="M4.4 12h15.8"/></svg><span class="w">BACK</span></div>
    <div class="at legend" style="left:184px;top:33px">SETTINGS</div>
    <div class="at up" style="left:24px;top:96px;width:366px;height:360px;border-radius:28px">
      <div class="at legend" style="left:20px;top:18px">SYSTEM STATUS</div>
      <div class="at" style="left:20px;top:50px"><svg width="326" height="255" viewBox="-9 -9 480 379" aria-hidden="true">
        <!-- the enclosure seen along X: 462 mm deep, 361 mm tall, front at the
             left, the display's 45 degree facet off the top-front arris -->
        <polygon points="0,361 0,61.87 61.87,0 462,0 462,361"
                 fill="#f2ece1" stroke="#8a8176" stroke-width="5" stroke-linejoin="round"/>

        <rect x="174" y="103" width="281" height="250" rx="8"
              fill="none" stroke="#cfc5b3" stroke-width="4"/>
        <!-- the carbonator's tube, standing in the middle of it -->
        <rect x="253" y="173" width="124" height="149" rx="16"
              fill="#e7dfd0" stroke="#cfc5b3" stroke-width="4"/>
        <path d="M257 249h116v69a12 12 0 0 1-12 12H269a12 12 0 0 1-12-12z" fill="#6f8a7a"/>
        <!-- a reservoir pocket at either end -->
        <rect x="185" y="143" width="50" height="209" rx="12"
              fill="#e7dfd0" stroke="#cfc5b3" stroke-width="4"/>
        <path d="M189 241h42v103a8 8 0 0 1-8 8h-26a8 8 0 0 1-8-8z" fill="#4b7f5c"/>
        <rect x="394" y="143" width="50" height="209" rx="12"
              fill="#e7dfd0" stroke="#cfc5b3" stroke-width="4"/>
        <path d="M398 241h42v103a8 8 0 0 1-8 8h-26a8 8 0 0 1-8-8z" fill="#4b7f5c"/>
        <!-- ten reeds: solid is closed, a rim is open -->
        <rect x="164.5" y="296.5" width="30" height="14" rx="7" fill="#33302b"/><rect x="164.5" y="251.5" width="30" height="14" rx="7" fill="#33302b"/><rect x="164.5" y="206.5" width="30" height="14" rx="7" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/><rect x="164.5" y="161.5" width="30" height="14" rx="7" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/><rect x="434.5" y="296.5" width="30" height="14" rx="7" fill="#33302b"/><rect x="434.5" y="251.5" width="30" height="14" rx="7" fill="#33302b"/><rect x="434.5" y="206.5" width="30" height="14" rx="7" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/><rect x="434.5" y="161.5" width="30" height="14" rx="7" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/><rect x="364.0" y="254.9" width="30" height="14" rx="7" fill="#33302b"/><rect x="364.0" y="226.7" width="30" height="14" rx="7" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/>
      </svg></div>
      <div class="at" style="left:20px;top:316px;display:flex;align-items:center;gap:12px"><span style="display:block;width:30px;height:14px;border-radius:7px;background:var(--text)"></span><span class="legend">CLOSED</span><span style="display:block;width:30px;height:14px;border-radius:7px;background:var(--surf);border:3px solid var(--dim);margin-left:22px"></span><span class="legend">OPEN</span></div>
    </div>
    <div class="at legend" style="left:414px;top:96px">AREAS</div><div class="at up sunk shift" style="left:414px;top:128px;width:172px;height:120px;border-radius:32px"><div class="at" style="left:20px;top:18px;color:var(--acc)"><svg class="mk" width="34" height="34" viewBox="0 0 24 24" stroke-width="2.0" aria-hidden="true"><circle cx="12" cy="10.4" r="8"/><circle cx="12" cy="10.4" r="2.7"/><circle cx="12" cy="4.5" r="1.9"/><circle cx="17.1" cy="13.4" r="1.9"/><circle cx="6.9" cy="13.4" r="1.9"/><path d="M4.4 20.8h15.2"/></svg></div><div class="at" style="left:20px;top:58px;font-size:20px;font-weight:700;letter-spacing:.05em;line-height:24px">PUMP<br>SERVICE</div></div><div class="at recess" style="left:414px;top:264px;width:172px;height:88px;border-radius:30px"></div><div class="at recess" style="left:414px;top:368px;width:172px;height:88px;border-radius:30px"></div>
  </div>
