<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — soft-clay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="well"></div>
  <div class="peb flush" style="top:16px"><svg class="mk" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><rect x="2.6" y="2.4" width="8.4" height="15.2" rx="2.8" fill="currentColor" stroke="none"/><rect x="13.4" y="6.8" width="8.4" height="15.2" rx="2.8"/></svg><span class="w">CHOOSE</span></div>
  <div class="peb flush" style="top:106px"><svg class="mk" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><path d="M12 1.3c0 0-2.7 3.2-2.7 4.7a2.7 2.7 0 0 0 5.4 0c0-1.5-2.7-4.7-2.7-4.7z" fill="currentColor" stroke="none"/><rect x="8.6" y="9.4" width="6.8" height="12.9" rx="3.4"/><path d="M10.2 14.6h3.6v4.3a1.8 1.8 0 0 1-1.8 1.8 1.8 1.8 0 0 1-1.8-1.8z" fill="currentColor" stroke="none"/></svg><span class="w">PRIME</span></div>
  <div class="peb flush" style="top:196px"><svg class="mk" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><path d="M3.8 4.4h16.4a1 1 0 0 1 .78 1.63L14.6 13.4v5.9a1 1 0 0 1-1.42.9l-2.3-1.1a1 1 0 0 1-.58-.9V13.4L3.02 6.03A1 1 0 0 1 3.8 4.4z"/></svg><span class="w">FILL</span></div>
  <div class="peb flush" style="top:286px"><svg class="mk" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><path d="M4.2 12.9h15.6v2.8a5.6 5.6 0 0 1-5.6 5.6h-4.4a5.6 5.6 0 0 1-5.6-5.6z"/><circle cx="8.9" cy="6.7" r="2.5"/><circle cx="14.9" cy="8.5" r="1.8"/><circle cx="12.3" cy="3.2" r="1.3"/></svg><span class="w">CLEAN</span></div>
  <div class="gearpeb here" style="top:400px"><svg class="mk" width="28" height="28" viewBox="0 0 24 24" stroke-width="2.0" aria-hidden="true"><path d="M3.6 6.6h16.8M3.6 12h16.8M3.6 17.4h16.8"/><circle cx="8.6" cy="6.6" r="2.6" fill="currentColor" stroke="none"/><circle cx="15.4" cy="12" r="2.6" fill="currentColor" stroke="none"/><circle cx="7" cy="17.4" r="2.6" fill="currentColor" stroke="none"/></svg></div>
  <!-- No press is drawn here: PUMP SERVICE is the only area there is, and
       an area shown sunk would read as one that is already open. -->
  <div class="pane">
    <div class="btn up" style="left:24px;top:16px;width:140px;height:68px;border-radius:28px"><svg class="mk" width="24" height="24" viewBox="0 0 24 24" stroke-width="2.3" aria-hidden="true"><path d="M10.6 5.2 3.8 12l6.8 6.8"/><path d="M4.4 12h15.8"/></svg><span class="w">BACK</span></div>
    <div class="at legend" style="left:184px;top:37px">SETTINGS</div>
    <div class="at legend" style="left:24px;top:96px">SYSTEM STATUS</div>
    <div class="at up" style="left:24px;top:128px;width:366px;height:328px;border-radius:28px">
      <div class="at" style="left:18px;top:18px"><svg width="330" height="260" viewBox="-9 -9 480 379" aria-hidden="true">
        <!-- the enclosure seen along X: 462 mm deep, 361 mm tall, front at the
             left, the display's 45 degree facet off the top-front arris -->
        <polygon points="0,361 0,61.87 61.87,0 462,0 462,361"
                 fill="#ebe4d8" stroke="#8a8176" stroke-width="5" stroke-linejoin="round"/>
        <!-- the cold core, at the back of the floor -->
        <rect x="160" y="103" width="295" height="255" rx="10" fill="#ddd4c4"/>
        <!-- the carbonator's tube, standing in the middle of it -->
        <rect x="245" y="173" width="124" height="149" rx="16"
              fill="#f2ece1" stroke="#a89c88" stroke-width="5"/>
        <path d="M247 249H367V306a14 14 0 0 1-14 14H261a14 14 0 0 1-14-14Z" fill="#6f8a7a"/>
        <!-- a reservoir pocket at either end -->
        <rect x="177" y="143" width="50" height="209" rx="12"
              fill="#f2ece1" stroke="#a89c88" stroke-width="5"/>
        <path d="M179 241H225V340a10 10 0 0 1-10 10H189a10 10 0 0 1-10-10Z" fill="#4b7f5c"/>
        <rect x="386" y="143" width="50" height="209" rx="12"
              fill="#f2ece1" stroke="#a89c88" stroke-width="5"/>
        <path d="M388 241H434V340a10 10 0 0 1-10 10H398a10 10 0 0 1-10-10Z" fill="#4b7f5c"/>
        <!-- this panel, on the facet you are reading it from -->
        <path d="M13 62 60 15" stroke="#c2603f" stroke-width="14" stroke-linecap="round"/>
        <!-- the empty upper volume carries what each vessel holds -->
        <g fill="#33302b" font-size="30" font-weight="500"
           text-anchor="middle" font-family="Zen Maru Gothic, sans-serif">
          <text x="202" y="90">SYRUP</text>
          <text x="404" y="90">SYRUP</text>
          <text x="307" y="150">WATER</text>
        </g>
        <!-- ten reeds: solid is closed, a rim is open -->
        <rect x="163" y="294.5" width="28" height="18" rx="9" fill="#33302b"/><rect x="163" y="249.5" width="28" height="18" rx="9" fill="#33302b"/><rect x="163" y="204.5" width="28" height="18" rx="9" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/><rect x="163" y="159.5" width="28" height="18" rx="9" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/><rect x="422" y="294.5" width="28" height="18" rx="9" fill="#33302b"/><rect x="422" y="249.5" width="28" height="18" rx="9" fill="#33302b"/><rect x="422" y="204.5" width="28" height="18" rx="9" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/><rect x="422" y="159.5" width="28" height="18" rx="9" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/><rect x="357" y="252.9" width="24" height="18" rx="9" fill="#33302b"/><rect x="357" y="224.7" width="24" height="18" rx="9" fill="#f7f2e9" stroke="#8a8176" stroke-width="3.5"/>
      </svg></div>
      <div class="at" style="left:24px;top:290px;display:flex;align-items:center;gap:12px"><span style="display:block;width:19px;height:12px;border-radius:6px;background:var(--text)"></span><span class="legend">CLOSED</span><span style="display:block;width:19px;height:12px;border-radius:6px;background:var(--surf);border:2.5px solid var(--dim);margin-left:22px"></span><span class="legend">OPEN</span></div>
    </div>
    <div class="at legend" style="left:414px;top:96px">AREAS</div><div class="at up" style="left:414px;top:128px;width:172px;height:328px;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px"><div style="color:var(--acc)"><svg class="mk" width="80" height="80" viewBox="0 0 24 24" stroke-width="1.3" aria-hidden="true"><circle cx="12" cy="10.4" r="8"/><circle cx="12" cy="10.4" r="2.7"/><circle cx="12" cy="4.5" r="1.9"/><circle cx="17.1" cy="13.4" r="1.9"/><circle cx="6.9" cy="13.4" r="1.9"/><path d="M4.4 20.8h15.2"/></svg></div><div class="h26" style="text-align:center;letter-spacing:.04em">PUMP<br>SERVICE</div></div>
  </div>
</div>
</body>
</html>
