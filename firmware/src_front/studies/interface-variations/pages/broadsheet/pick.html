<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fill a Flavor — broadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pg">

  <!-- ════ MASTHEAD — FILL is the section; CHOOSE carries the ← ════ -->
  <div class="mast">
    <div class="slot" style="left:0">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2.5" y="4" width="12" height="24" fill="#1b1a17"/>
        <rect x="18.5" y="4.75" width="10.5" height="22.5" fill="none" stroke="#1b1a17" stroke-width="1.5"/>
      </svg></div>
      <div class="word">
        <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M9.5 2.5 L3.5 8 L9.5 13.5" fill="none" stroke="#1b1a17" stroke-width="2.4"/></svg>
        <span class="caps-22">Choose</span>
      </div>
    </div>
    <div class="slot" style="left:200px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 15 V27 H25 V15" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
        <path d="M16 2 L21.5 10.5 A6.6 6.6 0 1 1 10.5 10.5 Z" fill="#1b1a17"/>
      </svg></div>
      <div class="word"><span class="caps-22">Prime</span></div>
    </div>
    <div class="slot" style="left:400px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3.5 6 H28.5 L19 17.5 V28 H13 V17.5 Z" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
      </svg></div>
      <div class="word"><span class="caps-22">Fill</span></div>
      <div class="bar"></div>
    </div>
    <div class="slot" style="left:600px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 15 V27 H25 V15" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
        <path d="M10.5 2 V10.5 M16 2 V10.5 M21.5 2 V10.5" stroke="#1b1a17" stroke-width="2.2"/>
      </svg></div>
      <div class="word"><span class="caps-22">Clean</span></div>
    </div>
    <div class="vdiv" style="left:200px"></div>
    <div class="vdiv" style="left:400px"></div>
    <div class="vdiv" style="left:600px"></div>
  </div>
  <div class="mastrule"></div>

  <div class="folio-l caps">Fill a Flavor</div>
  <div class="folio-r caps dim">Settings</div>

  <!-- ════ WEST HALF-COLUMN — pressed. The whole column is the target. ════ -->
  <div class="unit pressed" style="left:32px; top:128px; width:356px; height:320px"></div>

  <div class="plate pressed" style="left:32px; top:128px; width:172px; height:320px">
    <img src="../../assets/flavor_1.png" alt="">
  </div>
  <div style="position:absolute; left:228px; top:128px">
    <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M4 7 H44 L29 26 V41 H19 V26 Z" fill="none" stroke="#1b1a17" stroke-width="3" stroke-linejoin="miter"/>
    </svg>
  </div>
  <div class="rule-1" style="left:228px; top:196px; width:160px"></div>
  <div class="caps" style="position:absolute; left:228px; top:210px">1:20</div>
  <div class="lvl" style="left:228px; top:246px; gap:8px">
    <i class="on" style="width:32px; height:12px"></i>
    <i class="on" style="width:32px; height:12px"></i>
    <i class="on" style="width:32px; height:12px"></i>
    <i style="width:32px; height:12px"></i>
  </div>
  <div class="rule-10" style="left:228px; top:438px; width:160px"></div>

  <!-- ════ EAST HALF-COLUMN ════ -->
  <div class="plate" style="left:412px; top:128px; width:172px; height:320px">
    <img src="../../assets/flavor_2.png" alt="">
  </div>
  <div style="position:absolute; left:608px; top:128px">
    <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M4 7 H44 L29 26 V41 H19 V26 Z" fill="none" stroke="#1b1a17" stroke-width="3" stroke-linejoin="miter"/>
    </svg>
  </div>
  <div class="rule-1" style="left:608px; top:196px; width:160px"></div>
  <div class="caps" style="position:absolute; left:608px; top:210px">1:14</div>
  <div class="lvl" style="left:608px; top:246px; gap:8px">
    <i class="on" style="width:32px; height:12px"></i>
    <i style="width:32px; height:12px"></i>
    <i style="width:32px; height:12px"></i>
    <i style="width:32px; height:12px"></i>
  </div>
  <div class="caps verm" style="position:absolute; left:608px; top:274px">Low</div>
  <div class="rule-10" style="left:608px; top:438px; width:160px"></div>

</div>
</body>
</html>
