<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cleaning — broadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The page is reprinted in reverse: ink field, paper type. Nothing moves, and
     nothing else on the panel exists while this is up. -->
<div class="pg rev">

  <div class="caps-32" style="position:absolute; left:40px; top:40px">Cleaning</div>
  <div class="rule-1" style="left:40px; top:88px; width:560px"></div>

  <!-- the channel being cleaned, named by the face it wears -->
  <div class="plate" style="left:631px; top:40px; width:129px; height:240px">
    <img src="../../assets/flavor_1.png" alt="">
  </div>

  <!-- the minutes and their unit are set on one baseline, as one line of type -->
  <div style="position:absolute; left:24px; top:104px; display:flex; align-items:baseline; gap:22px">
    <span class="disp d220">11</span>
    <span class="caps-28">Min Left</span>
  </div>

  <!-- the whole cycle -->
  <div class="bar-track" style="left:40px; top:304px; width:720px">
    <div class="bar-fill" style="width:288px"></div>
    <div class="bar-tick" style="left:240px"></div>
    <div class="bar-tick" style="left:480px"></div>
  </div>

  <div class="caps-22" style="position:absolute; left:40px; top:385px; opacity:.7">1 of 3 &middot; Water In</div>

  <!-- the one way out: the only paper-filled object on the ink field -->
  <div class="stop caps-32" style="left:480px; top:352px; width:280px; height:88px">Stop</div>

</div>
</body>
</html>
