<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flavor — broadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pg">

  <!-- ════ MASTHEAD — CHOOSE carries the ← : it is both the section and the way back ════ -->
  <div class="mast">
    <div class="slot" style="left:0">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2.5" y="4" width="12" height="24" fill="#1b1a17"/>
        <rect x="18.5" y="4.75" width="10.5" height="22.5" fill="none" stroke="#1b1a17" stroke-width="1.5"/>
      </svg></div>
      <div class="word">
        <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M9.5 2.5 L3.5 8 L9.5 13.5" fill="none" stroke="#1b1a17" stroke-width="2.4"/></svg>
        <span class="caps-22">Choose</span>
      </div>
      <div class="bar"></div>
    </div>
    <div class="slot" style="left:200px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 15 V27 H25 V15" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
        <path d="M16 2 L21.5 10.5 A6.6 6.6 0 1 1 10.5 10.5 Z" fill="#1b1a17"/>
      </svg></div>
      <div class="word"><span class="caps-22">Prime</span></div>
    </div>
    <div class="slot" style="left:400px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3.5 6 H28.5 L19 17.5 V28 H13 V17.5 Z" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
      </svg></div>
      <div class="word"><span class="caps-22">Fill</span></div>
    </div>
    <div class="slot" style="left:600px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 15 V27 H25 V15" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
        <path d="M10.5 2 V10.5 M16 2 V10.5 M21.5 2 V10.5" stroke="#1b1a17" stroke-width="2.2"/>
      </svg></div>
      <div class="word"><span class="caps-22">Clean</span></div>
    </div>
    <div class="vdiv" style="left:200px"></div>
    <div class="vdiv" style="left:400px"></div>
    <div class="vdiv" style="left:600px"></div>
  </div>
  <div class="mastrule"></div>

  <div class="folio-l caps">Strength &amp; Face</div>
  <div class="folio-r caps dim">Settings</div>

  <!-- ════ THE FLAVOR — said in the picture ════ -->
  <div class="plate" style="left:32px; top:128px; width:172px; height:320px">
    <img src="../../assets/flavor_1.png" alt="">
  </div>

  <!-- ════ RATIO ════ -->
  <div class="caps" style="position:absolute; left:228px; top:128px">Ratio</div>
  <div class="caps dim" style="position:absolute; right:32px; top:128px">1:10 &ndash; 1:30</div>
  <div class="rule-10" style="left:228px; top:152px; width:540px"></div>

  <div class="disp d96" style="position:absolute; left:228px; top:166px">1:20</div>

  <div class="key" style="left:592px; top:166px; width:80px; height:80px">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect x="4" y="20" width="36" height="4" fill="#1b1a17"/></svg>
  </div>
  <!-- pressed element on this screen: the + key -->
  <div class="key pressed" style="left:688px; top:166px; width:80px; height:80px">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <rect x="4" y="20" width="36" height="4" fill="#1b1a17"/>
      <rect x="20" y="4" width="4" height="36" fill="#1b1a17"/>
    </svg>
  </div>

  <!-- ════ FACE — the row is wider than the window; the position is the target.
            The word and the count sit clear of the keys' column. ════ -->
  <div class="caps" style="position:absolute; left:228px; top:262px">Face</div>

  <div style="position:absolute; left:552px; top:250px; width:216px; height:64px; display:flex; align-items:flex-start; justify-content:flex-end; gap:12px; white-space:nowrap">
    <svg style="flex:none; margin-top:12px" width="16" height="20" viewBox="0 0 16 20" aria-hidden="true"><path d="M11 3 L4 10 L11 17" fill="none" stroke="#1b1a17" stroke-width="2.6"/></svg>
    <span class="caps" style="margin-top:12px">Drag &nbsp;3 of 8</span>
    <svg style="flex:none; margin-top:12px" width="16" height="20" viewBox="0 0 16 20" aria-hidden="true"><path d="M5 3 L12 10 L5 17" fill="none" stroke="#1b1a17" stroke-width="2.6"/></svg>
  </div>

  <!-- The row runs off both ends of its window, which is how it says there is
       more of it. The chosen face is the one printed at full ink inside a 3px
       frame; the rest are washed, exactly as the second item is on Choose. -->
  <div class="strip" style="left:228px; top:288px; width:540px; height:160px">
    <div class="run" style="left:-40px; width:832px">
      <div class="plate wash" style="left:0;   top:0; width:86px; height:160px"><img src="../../assets/flavor_2.png" alt=""></div>
      <div class="plate wash" style="left:104px;top:0; width:86px; height:160px"><img src="../../assets/flavor_3.png" alt=""></div>
      <div class="plate chosen" style="left:208px;top:0; width:86px; height:160px"><img src="../../assets/flavor_1.png" alt=""></div>
      <div class="plate wash" style="left:312px;top:0; width:86px; height:160px"><img src="../../assets/flavor_4.png" alt=""></div>
      <div class="plate wash" style="left:416px;top:0; width:86px; height:160px"><img src="../../assets/flavor_2.png" alt=""></div>
      <div class="plate wash" style="left:520px;top:0; width:86px; height:160px"><img src="../../assets/flavor_3.png" alt=""></div>
      <div class="plate wash" style="left:624px;top:0; width:86px; height:160px"><img src="../../assets/flavor_1.png" alt=""></div>
      <div class="plate wash" style="left:728px;top:0; width:86px; height:160px"><img src="../../assets/flavor_4.png" alt=""></div>
    </div>
  </div>

</div>
</body>
</html>
