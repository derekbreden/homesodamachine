<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose — broadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pg">

  <!-- ════ MASTHEAD — the four destinations, 200×92 each, ink hairlines between ════ -->
  <div class="mast">
    <div class="slot" style="left:0">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2.5" y="4" width="12" height="24" fill="#1b1a17"/>
        <rect x="18.5" y="4.75" width="10.5" height="22.5" fill="none" stroke="#1b1a17" stroke-width="1.5"/>
      </svg></div>
      <div class="word"><span class="caps-22">Choose</span></div>
      <div class="bar"></div>
    </div>
    <div class="slot" style="left:200px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 15 V27 H25 V15" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
        <path d="M16 2 L21.5 10.5 A6.6 6.6 0 1 1 10.5 10.5 Z" fill="#1b1a17"/>
      </svg></div>
      <div class="word"><span class="caps-22">Prime</span></div>
    </div>
    <div class="slot" style="left:400px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3.5 6 H28.5 L19 17.5 V28 H13 V17.5 Z" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
      </svg></div>
      <div class="word"><span class="caps-22">Fill</span></div>
    </div>
    <div class="slot" style="left:600px">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 15 V27 H25 V15" fill="none" stroke="#1b1a17" stroke-width="2.2" stroke-linejoin="miter"/>
        <path d="M10.5 2 V10.5 M16 2 V10.5 M21.5 2 V10.5" stroke="#1b1a17" stroke-width="2.2"/>
      </svg></div>
      <div class="word"><span class="caps-22">Clean</span></div>
    </div>
    <div class="vdiv" style="left:200px"></div>
    <div class="vdiv" style="left:400px"></div>
    <div class="vdiv" style="left:600px"></div>
  </div>
  <div class="mastrule"></div>

  <!-- ════ FOLIO — Settings is a 20px word hung off the masthead rule, flush right,
            smaller than every destination ════ -->
  <div class="folio-r caps dim">Settings</div>

  <!-- ════ LEAD ITEM — the armed flavor. C1 plate 172×320 · C2 deck ════ -->
  <div class="plate" style="left:32px; top:128px; width:172px; height:320px">
    <img src="../../assets/flavor_1.png" alt="">
  </div>

  <div class="rule-10" style="left:228px; top:128px; width:264px"></div>
  <div class="caps" style="position:absolute; left:228px; top:146px">On Tap</div>
  <div class="disp d96" style="position:absolute; left:228px; top:176px">1:20</div>

  <div class="caps" style="position:absolute; left:228px; top:296px">Level 3 of 4</div>
  <div class="lvl" style="left:228px; top:330px; gap:12px">
    <i class="on" style="width:57px; height:16px"></i>
    <i class="on" style="width:57px; height:16px"></i>
    <i class="on" style="width:57px; height:16px"></i>
    <i style="width:57px; height:16px"></i>
  </div>

  <!-- pressed element on this screen: the lead item's doorway -->
  <div class="door pressed" style="left:228px; top:384px; width:264px">
    <div class="w caps">Strength &amp; Face</div>
    <div class="a"><svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true">
      <path d="M4 2 L11 9 L4 16" fill="none" stroke="#1b1a17" stroke-width="2.6"/>
    </svg></div>
  </div>

  <!-- ════ SECOND ITEM — not armed. Quarter the area, 55% ink, 1px rule ════ -->
  <div class="rule-1" style="left:516px; top:128px; width:252px"></div>

  <div class="plate wash" style="left:516px; top:140px; width:86px; height:160px">
    <img src="../../assets/flavor_2.png" alt="">
  </div>

  <div class="disp d48" style="position:absolute; left:618px; top:146px">1:14</div>
  <div class="caps" style="position:absolute; left:618px; top:212px">Level 1 of 4</div>
  <div class="caps verm" style="position:absolute; left:618px; top:240px">Low</div>
  <div class="lvl" style="left:618px; top:274px; gap:8px">
    <i class="on" style="width:30px; height:12px"></i>
    <i style="width:30px; height:12px"></i>
    <i style="width:30px; height:12px"></i>
    <i style="width:30px; height:12px"></i>
  </div>

  <div class="door" style="left:516px; top:384px; width:252px">
    <div class="w caps">Strength &amp; Face</div>
    <div class="a"><svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true">
      <path d="M4 2 L11 9 L4 16" fill="none" stroke="#1b1a17" stroke-width="2.6"/>
    </svg></div>
  </div>

</div>
</body>
</html>
