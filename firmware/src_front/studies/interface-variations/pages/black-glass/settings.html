<!doctype html>
<meta charset="utf-8">
<title>Black Glass &mdash; Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<div class="panel">

  <!-- no rail: settings is not a customer destination -->

  <div class="key" style="left:32px;top:16px;width:172px;height:72px">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 4l-8 8 8 8"/></svg>
    <span class="kw">BACK</span>
  </div>
  <div class="page-name" style="position:absolute;left:228px;top:16px;height:72px;line-height:72px">SETTINGS</div>

  <div class="caption" style="position:absolute;left:32px;top:112px">SYSTEM STATUS</div>
  <div class="caption" style="position:absolute;left:462px;top:112px">AREAS</div>

  <svg style="position:absolute;left:32px;top:136px" width="363" height="284" viewBox="-4 -4 470 368">
    <!-- the shell, front on the left; the 45 degree facet off the top-front arris is this panel -->
    <path d="M0 361H462V0H90L0 90Z" fill="none" stroke="#4d585d" stroke-width="2"
          stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <!-- the cold core lies at the back of the floor -->
    <rect x="246" y="149" width="206" height="212" fill="#0e1113" stroke="none"/>
    <!-- what stands in the vessels -->
    <g fill="#1c3a33" stroke="none">
      <rect x="257" y="236" width="58" height="116"/>
      <rect x="383" y="236" width="58" height="116"/>
      <rect x="337.5" y="248" width="23" height="92" rx="10"/>
    </g>
    <!-- a reservoir pocket at either end, the carbonator's tube in the middle -->
    <g fill="none" stroke="#4d585d" stroke-width="2">
      <rect x="256" y="155" width="60" height="198" vector-effect="non-scaling-stroke"/>
      <rect x="382" y="155" width="60" height="198" vector-effect="non-scaling-stroke"/>
      <rect x="336" y="161" width="26" height="180" rx="13" vector-effect="non-scaling-stroke"/>
    </g>
    <path d="M90 0L0 90" fill="none" stroke="#f2f5f6" stroke-width="3" stroke-linecap="butt"
          vector-effect="non-scaling-stroke"/>
    <!-- reeds: a filled disc is closed, a ring is open -->
    <g fill="#3fbf8f">
      <circle cx="256" cy="303.5" r="9.06"/>
      <circle cx="256" cy="258.5" r="9.06"/>
      <circle cx="442" cy="303.5" r="9.06"/>
      <circle cx="442" cy="258.5" r="9.06"/>
      <circle cx="362" cy="261.9" r="9.06"/>
    </g>
    <g fill="#060708" stroke="#7c878c" stroke-width="2">
      <circle cx="256" cy="213.5" r="9.06" vector-effect="non-scaling-stroke"/>
      <circle cx="256" cy="168.5" r="9.06" vector-effect="non-scaling-stroke"/>
      <circle cx="442" cy="213.5" r="9.06" vector-effect="non-scaling-stroke"/>
      <circle cx="442" cy="168.5" r="9.06" vector-effect="non-scaling-stroke"/>
      <circle cx="362" cy="233.7" r="9.06" vector-effect="non-scaling-stroke"/>
    </g>
  </svg>

  <!-- the key to the drawing, under the drawing -->
  <div class="legend" style="left:32px;top:424px">
    <span class="dot closed"></span><span class="lbl">Closed</span>
    <span style="width:18px"></span>
    <span class="dot open"></span><span class="lbl">Open</span>
  </div>

  <!-- the pressed state on this screen: the one area a person can go into -->
  <div class="key press" style="left:462px;top:136px;width:306px;height:112px">
    <svg viewBox="0 0 44 44" width="40" height="40">
      <path d="M14 35.9A16 16 0 1 1 30 35.9"/>
      <path d="M14 35.9V42M30 35.9V42"/>
      <circle cx="22" cy="22" r="8.5"/>
      <circle class="solid" cx="22" cy="13.5" r="2.3"/>
      <circle class="solid" cx="29.4" cy="26.3" r="2.3"/>
      <circle class="solid" cx="14.6" cy="26.3" r="2.3"/>
    </svg>
    <span class="kw">PUMP SERVICE</span>
  </div>

</div>
