  <!-- ── Pane ── -->
  <div class="pane">
    <div class="title t28">SETTINGS</div>

    <div class="scard">
      <div class="cc">
        <div class="abs t20 dim" style="left:0;top:0">SYSTEM STATUS</div>

        <!-- The enclosure seen along X. 462 mm deep by 361 mm tall over a
             344-wide field with a 2 px margin: scale (344 - 4) / 462
             = 0.735930736 px/mm. Every figure below is that arithmetic. -->
        <svg class="diagram" width="344" height="270" viewBox="0 0 344 270" aria-hidden="true">
          <!-- Profile: (0,0) → (0, 361 − 61.87) → (61.87, 361) → (462, 361) → (462, 0) -->
          <polyline points="2,268 2,48 48,2 342,2 342,268 2,268"
                    fill="none" stroke="#8888aa" stroke-width="3"
                    stroke-linejoin="round" stroke-linecap="round"/>

          <!-- The cold core: depth 173…456, height 6…259.4. mkOutline draws
               every internal outline in COL_OFF; only the profile is COL_DIM. -->
          <rect x="130" y="78" width="207" height="184" rx="3" fill="none" stroke="#3a3a55" stroke-width="2"/>

          <!-- The carbonator's tube: 127 mm on depth 314.5, height 38…190.4 -->
          <rect x="188" y="129" width="91" height="110" rx="9" fill="none" stroke="#3a3a55" stroke-width="2"/>

          <!-- Reservoir pockets: depth 183…236 and 393…446, height 8…219.4 -->
          <rect x="138" y="107" width="37" height="154" rx="5" fill="none" stroke="#3a3a55" stroke-width="2"/>
          <rect x="292" y="107" width="37" height="154" rx="5" fill="none" stroke="#3a3a55" stroke-width="2"/>

          <!-- Reeds, 14 px. Closed reads filled; open reads as a ring. -->
          <!-- Aft pocket, depth 449 — heights 63.5, 108.5 closed; 153.5, 198.5 open -->
          <circle cx="332" cy="221" r="7" fill="#37c98b"/>
          <circle cx="332" cy="188" r="7" fill="#37c98b"/>
          <circle cx="332" cy="155" r="6" fill="#242440" stroke="#8888aa" stroke-width="2"/>
          <circle cx="332" cy="122" r="6" fill="#242440" stroke="#8888aa" stroke-width="2"/>
          <!-- Forward pocket, depth 180 -->
          <circle cx="134" cy="221" r="7" fill="#37c98b"/>
          <circle cx="134" cy="188" r="7" fill="#37c98b"/>
          <circle cx="134" cy="155" r="6" fill="#242440" stroke="#8888aa" stroke-width="2"/>
          <circle cx="134" cy="122" r="6" fill="#242440" stroke="#8888aa" stroke-width="2"/>
          <!-- The tube's aft wall, depth 379.25 — low 105.1 closed, high 133.3 open -->
          <circle cx="281" cy="190" r="7" fill="#37c98b"/>
          <circle cx="281" cy="170" r="6" fill="#242440" stroke="#8888aa" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <!-- The areas a person can go into, one target each -->
    <div class="area mid t20" style="top:76px">PUMP SERVICE</div>

  </div>

</div>
