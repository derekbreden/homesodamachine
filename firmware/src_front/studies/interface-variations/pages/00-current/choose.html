<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose — 00-current</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <!-- ── Rail: CHOOSE · PRIME · FILL · CLEAN. CHOOSE is the page you are on. ── -->
  <div class="rail-item r0 on">
    <div class="ico">
      <!-- hand-pointer, FA f25a -->
      <svg width="48" height="48" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path d="M448 240v96c0 3.084-.356 6.159-1.063 9.162l-32 136C410.686 499.23 394.562 512 376 512H168a40.004 40.004 0 0 1-32.35-16.473l-127.997-176c-12.993-17.866-9.043-42.883 8.822-55.876 17.867-12.994 42.884-9.043 55.877 8.823L104 315.992V40c0-22.091 17.908-40 40-40s40 17.909 40 40v200h8v-40c0-22.091 17.908-40 40-40s40 17.909 40 40v40h8v-24c0-22.091 17.908-40 40-40s40 17.909 40 40v24h8c0-22.091 17.908-40 40-40s40 17.909 40 40z"/></svg>
    </div>
    <div class="word t20">CHOOSE</div>
  </div>
  <div class="rail-item r1">
    <div class="ico">
      <!-- tint, FA f043 -->
      <svg width="48" height="48" viewBox="0 0 352 512" fill="currentColor" aria-hidden="true"><path d="M205.22 22.09c-7.94-28.78-49.44-30.12-58.44 0C102.5 179.85 0 222.72 0 333.91 0 432.35 78.72 512 176 512s176-79.65 176-178.09c0-111.75-102.62-153.6-146.78-311.82zM176 448c-53.02 0-96-42.98-96-96 0-30.2 15.66-52.75 33.12-78.08 8.39-12.18 26.03-9.98 31.55 3.75l14.94 37.22c4.31 10.74 19.7 10.51 23.68-.35l25.66-69.95c5.44-14.83 25.44-16.75 33.43-3.13C260.4 275.35 272 309.34 272 352c0 52.94-42.98 96-96 96z"/></svg>
    </div>
    <div class="word t20">PRIME</div>
  </div>
  <div class="rail-item r2">
    <div class="ico">
      <!-- filter (funnel), FA f0b0 -->
      <svg width="48" height="48" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M487.976 0H24.028C2.71 0-8.047 25.866 7.058 40.971L192 225.941V432c0 7.831 3.821 15.17 10.237 19.662l80 55.98C298.02 518.69 320 507.493 320 487.98V225.941l184.947-184.97C520.021 25.896 509.338 0 487.976 0z"/></svg>
    </div>
    <div class="word t20">FILL</div>
  </div>
  <div class="rail-item r3">
    <div class="ico">
      <!-- soap, FA e06d -->
      <svg width="48" height="48" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true">
        <circle cx="378" cy="92" r="60"/>
        <circle cx="286" cy="198" r="38"/>
        <circle cx="428" cy="222" r="28"/>
        <rect x="36" y="268" width="296" height="208" rx="44"/>
      </svg>
    </div>
    <div class="word t20">CLEAN</div>
  </div>

  <!-- ── Settings, in the corner rather than on the rail ── -->
  <div class="gearbtn">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
      <defs><mask id="g1"><rect width="24" height="24" fill="#fff"/><circle cx="12" cy="12" r="3.2" fill="#000"/></mask></defs>
      <g fill="currentColor" mask="url(#g1)">
        <circle cx="12" cy="12" r="7.4"/>
        <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3"/>
        <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(45 12 12)"/>
        <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(90 12 12)"/>
        <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(135 12 12)"/>
      </g>
    </svg>
  </div>

  <!-- ── Pane ── -->
  <div class="pane">
    <div class="title t28">CHOOSE A FLAVOR</div>

    <!-- Flavor 1 — the selected card -->
    <div class="hcard sel" style="left:0">
      <div class="cc">
        <img class="face-card" style="left:0;top:18px" src="../../assets/flavor_1.png" alt="">
        <div class="abs t20 dim" style="left:145px;top:101px">RATIO</div>
        <div class="abs t40"     style="left:145px;top:130px">1:20</div>
        <div class="abs t20 dim" style="left:145px;top:181px">LEVEL</div>
        <div class="seg good" style="left:145px;top:211px"></div>
        <div class="seg good" style="left:173px;top:211px"></div>
        <div class="seg good" style="left:201px;top:211px"></div>
        <div class="seg"      style="left:229px;top:211px"></div>
        <div class="badge">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3.5,10.5 8,15.2 16.5,5"/></svg>
        </div>
      </div>
    </div>

    <!-- Flavor 2 — not selected -->
    <div class="hcard" style="left:297px">
      <div class="cc">
        <img class="face-card" style="left:0;top:18px" src="../../assets/flavor_2.png" alt="">
        <div class="abs t20 dim" style="left:145px;top:101px">RATIO</div>
        <div class="abs t40"     style="left:145px;top:130px">1:14</div>
        <div class="abs t20 dim" style="left:145px;top:181px">LEVEL</div>
        <div class="seg warn" style="left:145px;top:211px"></div>
        <div class="seg"      style="left:173px;top:211px"></div>
        <div class="seg"      style="left:201px;top:211px"></div>
        <div class="seg"      style="left:229px;top:211px"></div>
      </div>
    </div>

    <!-- Each card's own settings target, on the pane's floor -->
    <div class="hgear mid t20" style="left:0">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <defs><mask id="g2"><rect width="24" height="24" fill="#fff"/><circle cx="12" cy="12" r="3.2" fill="#000"/></mask></defs>
        <g fill="currentColor" mask="url(#g2)">
          <circle cx="12" cy="12" r="7.4"/>
          <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3"/>
          <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(45 12 12)"/>
          <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(90 12 12)"/>
          <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(135 12 12)"/>
        </g>
      </svg>
      <span>SETTINGS</span>
    </div>
    <div class="hgear mid t20" style="left:297px">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <defs><mask id="g3"><rect width="24" height="24" fill="#fff"/><circle cx="12" cy="12" r="3.2" fill="#000"/></mask></defs>
        <g fill="currentColor" mask="url(#g3)">
          <circle cx="12" cy="12" r="7.4"/>
          <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3"/>
          <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(45 12 12)"/>
          <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(90 12 12)"/>
          <rect x="10.6" y="1.6" width="2.8" height="20.8" rx="1.3" transform="rotate(135 12 12)"/>
        </g>
      </svg>
      <span>SETTINGS</span>
    </div>
  </div>

</div>
</body>
</html>
