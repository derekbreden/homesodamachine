<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strength &amp; Face — Enamel Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="rail">
    <div class="gear">
      <svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
        <path d="M6 13 H42"/><path d="M6 24 H42"/><path d="M6 35 H42"/><rect x="12" y="8" width="10" height="10" fill="currentColor" stroke="none"/><rect x="28" y="19" width="10" height="10" fill="currentColor" stroke="none"/><rect x="18" y="30" width="10" height="10" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="rail-nav">
      <div class="rail-item on">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <rect x="7" y="7" width="15" height="34" fill="currentColor"/><rect x="28" y="7" width="13" height="34"/>
        </svg>
        <div class="legend">CHOOSE</div>
      </div>
      <div class="rail-item svc">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M24 6 C24 6 11 21 11 30 A13 13 0 0 0 37 30 C37 21 24 6 24 6 Z"/>
        </svg>
        <div class="legend">PRIME</div>
      </div>
      <div class="rail-item svc">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M7 9 H41 L28 25 V39 L20 34 V25 Z"/>
        </svg>
        <div class="legend">FILL</div>
      </div>
      <div class="rail-item svc">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M30.34 10.41 A15 15 0 1 1 17.66 10.41"/><path d="M23.10 7.87 L17.97 15.79 L13.73 6.73 Z" fill="currentColor" stroke="none"/>
        </svg>
        <div class="legend">CLEAN</div>
      </div>
    </div>
  </div>

  <div class="pagename name">Strength &amp; face</div>
  <div class="datum"></div>
  <div class="back chip">
    <svg width="18" height="18" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter"><path d="M30 9 L15 24 L30 39"/></svg>
    <span class="legend">Back</span>
  </div>

  <!-- The anchor: this flavor, said in the picture. Its rim starts the west
       column at 128 and lands it on the floor both columns share, y 456. -->
  <div class="anchor fr cob"><img src="../../assets/flavor_1.png" width="172" height="320" alt=""></div>

  <div class="legend t-dim" style="position:absolute;left:396px;top:96px">Strength</div>
  <div class="legend t-dim ra" style="position:absolute;left:396px;top:96px;width:388px">1:10 – 1:30</div>

  <div class="ratio field"></div>
  <div class="ratioval num64">1:20</div>
  <div class="step minus chip">
    <svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5"><path d="M11 24 H37"/></svg>
  </div>
  <!-- PRESSED, and the only pressed state drawn in this direction: the +
       stepper. The chip's ground and its ink trade places; nothing moves. -->
  <div class="step plus chip pressed">
    <svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5"><path d="M24 11 V37 M11 24 H37"/></svg>
  </div>

  <div class="legend t-dim" style="position:absolute;left:396px;top:248px">The face it wears</div>
  <div class="legend t-blue ra" style="position:absolute;left:396px;top:248px;width:388px">3 of 8</div>

  <!-- The row is wider than its window: two chips drag it, and the track
       under the whole column says where in the eight you are. -->
  <div class="arrow l chip">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter"><path d="M30 9 L15 24 L30 39"/></svg>
  </div>
  <div class="stripwin">
    <div class="strip">
      <div class="cell"><div class="fr thin"><img src="../../assets/flavor_1.png" width="86" height="160" alt=""></div></div>
      <div class="cell"><div class="fr thin"><img src="../../assets/flavor_2.png" width="86" height="160" alt=""></div></div>
      <div class="cell"><div class="fr sel"><img src="../../assets/flavor_3.png" width="86" height="160" alt=""></div></div>
      <div class="cell"><div class="fr thin"><img src="../../assets/flavor_4.png" width="86" height="160" alt=""></div></div>
      <div class="cell"><div class="fr thin"><img src="../../assets/flavor_1.png" width="86" height="160" alt=""></div></div>
      <div class="cell"><div class="fr thin"><img src="../../assets/flavor_2.png" width="86" height="160" alt=""></div></div>
      <div class="cell"><div class="fr thin"><img src="../../assets/flavor_3.png" width="86" height="160" alt=""></div></div>
      <div class="cell"><div class="fr thin"><img src="../../assets/flavor_4.png" width="86" height="160" alt=""></div></div>
    </div>
  </div>
  <div class="arrow r chip">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter"><path d="M18 9 L33 24 L18 39"/></svg>
  </div>
  <div class="track"><b></b></div>

</div>
</body>
</html>
