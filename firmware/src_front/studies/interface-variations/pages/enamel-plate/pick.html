<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fill a flavor — Enamel Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="rail">
    <div class="gear">
      <svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
        <circle cx="24" cy="24" r="15"/><path d="M24 24 L33.5 14.5"/><path d="M24 4 V9"/><path d="M42 24 H37"/><path d="M6 24 H11"/>
      </svg>
    </div>
    <div class="rail-nav">
      <div class="rail-item">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <rect x="7" y="7" width="15" height="34" fill="currentColor"/><rect x="28" y="7" width="13" height="34"/>
        </svg>
        <div class="legend">CHOOSE</div>
      </div>
      <div class="rail-item">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M24 6 C24 6 11 21 11 30 A13 13 0 0 0 37 30 C37 21 24 6 24 6 Z"/>
        </svg>
        <div class="legend">PRIME</div>
      </div>
      <div class="rail-item on">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M7 9 H41 L28 25 V39 L20 34 V25 Z"/>
        </svg>
        <div class="legend">FILL</div>
      </div>
      <div class="rail-item">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M24 9 A15 15 0 1 1 9 24"/><path d="M17 3 L24 9 L17 15"/>
        </svg>
        <div class="legend">CLEAN</div>
      </div>
    </div>
  </div>

  <div class="pagename name">Fill a flavor</div>
  <div class="datum"></div>
  <div class="back">
    <svg width="18" height="18" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter"><path d="M30 9 L15 24 L30 39"/></svg>
    <span class="legend">Back</span>
  </div>

  <!-- PRESSED: the left channel. The body ground goes cobalt, the header band
       inverts, and nothing moves. -->
  <div class="pick one pressed">
    <div class="hdr">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
        <path d="M7 9 H41 L28 25 V39 L20 34 V25 Z"/>
      </svg>
    </div>
    <div class="body"><img class="face" src="../../assets/flavor_1.png" width="145" height="270" alt=""></div>
  </div>

  <div class="pick two">
    <div class="hdr">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
        <path d="M7 9 H41 L28 25 V39 L20 34 V25 Z"/>
      </svg>
    </div>
    <div class="body"><img class="face" src="../../assets/flavor_2.png" width="145" height="270" alt=""></div>
  </div>

</div>
</body>
</html>
