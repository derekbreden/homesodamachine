<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean cycle — Enamel Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="lock">
    <!-- The one dark plate in the system. The hatched bands say "withheld"
         before a single word is read. -->
    <div class="hazard" style="top:0"></div>
    <div class="hazard" style="top:466px"></div>
    <div class="hazard v" style="left:0"></div>
    <div class="hazard v" style="left:786px"></div>

    <img class="face k-cream" src="../../assets/flavor_1.png" width="172" height="320"
         style="position:absolute;left:40px;top:80px" alt="">

    <div class="num64 t-cream" style="position:absolute;left:252px;top:84px">Cleaning</div>
    <div class="timechip"><span class="num44">11 min left</span></div>
    <div class="legend t-dimb" style="position:absolute;left:252px;top:244px">1 of 3 &middot; water in</div>

    <div class="bar">
      <u></u>
      <s style="left:169px"></s>
      <s style="left:339px"></s>
    </div>

    <svg style="position:absolute;left:256px;top:330px" width="116" height="116" viewBox="0 0 48 48"
         fill="none" stroke="#f2ece0" color="#f2ece0" stroke-width="4" stroke-linejoin="miter" aria-hidden="true">
      <path d="M30.34 10.41 A15 15 0 1 1 17.66 10.41"/><path d="M23.10 7.87 L17.97 15.79 L13.73 6.73 Z" fill="currentColor" stroke="none"/>
    </svg>

    <!-- PRESSED: STOP. The only cream-filled object on the plate, and the one
         place enamel red is allowed to become a ground. -->
    <div class="stop pressed"><span>STOP</span></div>
  </div>
</div>
</body>
</html>
