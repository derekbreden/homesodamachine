<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean cycle — Enamel Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="lock">
    <!-- The one dark plate in the system. The whole panel inverting is what
         says "the machine has taken this away from you" before a word is
         read; the printed rim makes it a plate rather than a dialog. -->
    <div class="rim"></div>

    <div class="fr crm" style="position:absolute;left:40px;top:76px;width:180px;height:328px">
      <img src="../../assets/flavor_1.png" width="172" height="320" alt="">
    </div>

    <div class="num64 t-cream" style="position:absolute;left:252px;top:84px">Cleaning</div>
    <div class="timechip"><span class="num44">11 min left</span></div>
    <div class="legend t-dimb" style="position:absolute;left:252px;top:244px">1 of 3 &middot; water in</div>

    <!-- the whole cycle, 40% through, with the three rounds marked off -->
    <div class="bar">
      <u></u>
      <s style="left:169px"></s>
      <s style="left:338px"></s>
    </div>

    <!-- the cycle mark: the wordless half of "deliberately busy" -->
    <svg style="position:absolute;left:252px;top:340px" width="96" height="97" viewBox="7 6.5 34 34.5"
         fill="none" stroke="#f2ece0" color="#f2ece0" stroke-width="4" stroke-linejoin="miter" aria-hidden="true">
      <path d="M30.34 10.41 A15 15 0 1 1 17.66 10.41"/><path d="M23.10 7.87 L17.97 15.79 L13.73 6.73 Z" fill="currentColor" stroke="none"/>
    </svg>

    <!-- The one way out, and the only cream-filled object on the plate. -->
    <div class="stop"><span>STOP</span></div>
  </div>
</div>
</body>
</html>
