<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — Enamel Plate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="rail">
    <!-- Settings is not a rail destination: no compartment is lit, and the
         chip in the corner is the only thing that goes cream. -->
    <div class="gear on">
      <svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
        <path d="M6 13 H42"/><path d="M6 24 H42"/><path d="M6 35 H42"/><rect x="12" y="8" width="10" height="10" fill="currentColor" stroke="none"/><rect x="28" y="19" width="10" height="10" fill="currentColor" stroke="none"/><rect x="18" y="30" width="10" height="10" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="rail-nav">
      <div class="rail-item">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <rect x="7" y="7" width="15" height="34" fill="currentColor"/><rect x="28" y="7" width="13" height="34"/>
        </svg>
        <div class="legend">CHOOSE</div>
      </div>
      <div class="rail-item svc">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M24 6 C24 6 11 21 11 30 A13 13 0 0 0 37 30 C37 21 24 6 24 6 Z"/>
        </svg>
        <div class="legend">PRIME</div>
      </div>
      <div class="rail-item svc">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M7 9 H41 L28 25 V39 L20 34 V25 Z"/>
        </svg>
        <div class="legend">FILL</div>
      </div>
      <div class="rail-item svc">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
          <path d="M30.34 10.41 A15 15 0 1 1 17.66 10.41"/><path d="M23.10 7.87 L17.97 15.79 L13.73 6.73 Z" fill="currentColor" stroke="none"/>
        </svg>
        <div class="legend">CLEAN</div>
      </div>
    </div>
  </div>

  <div class="pagename name">Settings</div>
  <div class="datum"></div>
  <div class="back chip">
    <svg width="18" height="18" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter"><path d="M30 9 L15 24 L30 39"/></svg>
    <span class="legend">Back</span>
  </div>

  <div class="legend t-dim" style="position:absolute;left:206px;top:92px">System status</div>
  <div class="legend t-dim" style="position:absolute;left:612px;top:92px">Areas</div>

  <div class="status plate"></div>

  <!-- The machine seen along X: 462 mm deep, 361 mm tall, front on the left,
       the display's 45° facet off the top-front arris. The cold core lies at
       the back of the floor — the carbonator's tube in the middle of it and a
       reservoir pocket at either end. Every reed is a chip laid into the
       vessel's wall: solid green closed, hollow open, at the same fill-and-
       void the level gauge on Choose is drawn in. -->
  <svg style="position:absolute;left:222px;top:147px" width="358" height="282" viewBox="-6 -6 474 373"
       fill="none" stroke="#18458f" stroke-linejoin="miter">
    <path d="M0,361 L0,61.87 L61.87,0 L462,0 L462,361 Z" fill="#e2d9c6" stroke-width="3" vector-effect="non-scaling-stroke"/>

    <rect x="173" y="101.6" width="283" height="253.4" rx="4" stroke-width="2" vector-effect="non-scaling-stroke"/>

    <!-- the carbonator's tube, water standing at its closed low reed -->
    <rect x="251" y="170.6" width="127" height="152.4" rx="10" fill="#fbf7ef" stroke="none"/>
    <rect x="253" y="261.9" width="123" height="59.1" rx="6" fill="#8fbfa2" stroke="none"/>
    <rect x="251" y="170.6" width="127" height="152.4" rx="10" stroke-width="2" vector-effect="non-scaling-stroke"/>

    <!-- the two reservoir pockets, syrup standing at their highest closed reed -->
    <rect x="183" y="141.6" width="53" height="211.4" rx="6" fill="#fbf7ef" stroke="none"/>
    <rect x="393" y="141.6" width="53" height="211.4" rx="6" fill="#fbf7ef" stroke="none"/>
    <rect x="185" y="258.5" width="49" height="92.5" rx="4" fill="#8fbfa2" stroke="none"/>
    <rect x="395" y="258.5" width="49" height="92.5" rx="4" fill="#8fbfa2" stroke="none"/>
    <rect x="183" y="141.6" width="53" height="211.4" rx="6" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <rect x="393" y="141.6" width="53" height="211.4" rx="6" stroke-width="2" vector-effect="non-scaling-stroke"/>

    <!-- closed: 57.5 and 102.5 mm up each pocket wall, and the carbonator's
         low reed at 99.1 mm -->
    <g fill="#2f7d55" stroke="#fbf7ef" stroke-width="2" vector-effect="non-scaling-stroke">
      <rect x="170" y="292.5" width="26" height="22" rx="5"/>
      <rect x="170" y="247.5" width="26" height="22" rx="5"/>
      <rect x="433" y="292.5" width="26" height="22" rx="5"/>
      <rect x="433" y="247.5" width="26" height="22" rx="5"/>
      <rect x="365" y="250.9" width="26" height="22" rx="5"/>
    </g>
    <!-- open: 147.5 and 192.5 mm up each wall, and the carbonator's high reed
         at 127.3 mm -->
    <g fill="#fbf7ef" stroke="#18458f" stroke-width="3" vector-effect="non-scaling-stroke">
      <rect x="170" y="202.5" width="26" height="22" rx="5"/>
      <rect x="170" y="157.5" width="26" height="22" rx="5"/>
      <rect x="433" y="202.5" width="26" height="22" rx="5"/>
      <rect x="433" y="157.5" width="26" height="22" rx="5"/>
      <rect x="365" y="222.7" width="26" height="22" rx="5"/>
    </g>
  </svg>

  <!-- The one area a person can go into from here. Room beside it for more. -->
  <div class="area chip">
    <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="miter">
      <circle cx="24" cy="24" r="15"/>
      <circle cx="24" cy="13.5" r="4" fill="currentColor" stroke="none"/>
      <circle cx="33" cy="29.2" r="4" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="29.2" r="4" fill="currentColor" stroke="none"/>
    </svg>
    <div class="legend">Pump<br>service</div>
  </div>

  <!-- what the two states on the drawing mean; a field, so it reads as
       something to look at rather than something to press -->
  <div class="key field">
    <div class="r1">
      <svg width="20" height="16"><rect x="1" y="1" width="18" height="14" rx="4" fill="#2f7d55"/></svg>
      <span class="legend t-dim">Closed</span>
    </div>
    <div class="r2">
      <svg width="20" height="16"><rect x="1.5" y="1.5" width="17" height="13" rx="4" fill="#fbf7ef" stroke="#18458f" stroke-width="3"/></svg>
      <span class="legend t-dim">Open</span>
    </div>
  </div>

</div>
</body>
</html>
