<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — Flavor Flood</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="stage">

    <!-- ══ The machine, seen along X, front at left ══ -->
    <div style="position:absolute;left:24px;top:24px;width:432px;height:348px;background:var(--alt);border:3px solid var(--ink)">
      <div class="label dim" style="position:absolute;left:18px;bottom:16px">Side view · front at left</div>
    </div>

    <svg style="position:absolute;left:58px;top:40px" width="364" height="284" viewBox="0 0 462 361">
      <g stroke="#14110d" stroke-width="4" fill="none" stroke-linejoin="miter" stroke-linecap="butt">
        <!-- shell, with the display's 45° facet off the top-front arris -->
        <path d="M0 361 L0 96 L96 0 L462 0 L462 361 Z" fill="#faf7f1"/>
        <path d="M20 94 L90 24" stroke-width="12"/>
        <path d="M0 345 H462" stroke-width="3"/>

        <!-- what is in the cold core, read as vessels holding something -->
        <rect x="234" y="126" width="208" height="219" fill="#eae4d9"/>

        <rect x="234" y="146" width="54" height="199" fill="#faf7f1" stroke="none"/>
        <rect x="300" y="134" width="68" height="211" fill="#faf7f1" stroke="none"/>
        <rect x="388" y="146" width="54" height="199" fill="#faf7f1" stroke="none"/>

        <rect x="234" y="236" width="54" height="109" fill="#c2213f" stroke="none"/>
        <rect x="388" y="236" width="54" height="109" fill="#3faa2b" stroke="none"/>
        <rect x="300" y="248" width="68" height="97"  fill="#c9c0b2" stroke="none"/>
        <rect x="234" y="146" width="54"  height="199"/>
        <rect x="300" y="134" width="68"  height="211"/>
        <rect x="388" y="146" width="54"  height="199"/>

        <!-- ten reeds: filled is closed, open is a keyline -->
        <rect x="221" y="290.5" width="26" height="26" fill="#14110d" stroke="none"/>
        <rect x="221" y="245.5" width="26" height="26" fill="#14110d" stroke="none"/>
        <rect x="221" y="200.5" width="26" height="26" fill="#faf7f1"/>
        <rect x="221" y="155.5" width="26" height="26" fill="#faf7f1"/>

        <rect x="429" y="290.5" width="26" height="26" fill="#14110d" stroke="none"/>
        <rect x="429" y="245.5" width="26" height="26" fill="#14110d" stroke="none"/>
        <rect x="429" y="200.5" width="26" height="26" fill="#faf7f1"/>
        <rect x="429" y="155.5" width="26" height="26" fill="#faf7f1"/>

        <rect x="355" y="248.9" width="26" height="26" fill="#14110d" stroke="none"/>
        <rect x="355" y="220.7" width="26" height="26" fill="#faf7f1"/>
      </g>
    </svg>

    <!-- ══ Is my machine all right ══ -->
    <div class="label dim" style="position:absolute;left:480px;top:24px">System status</div>
    <div class="loud loud-72" style="position:absolute;left:480px;top:72px;text-transform:uppercase">Normal</div>
    <div style="position:absolute;left:480px;top:158px;width:296px;height:10px;background:var(--ink)"></div>

    <div style="position:absolute;left:480px;top:192px;display:flex;align-items:center;gap:10px">
      <div style="width:20px;height:20px;background:var(--ink)"></div>
      <span class="label dim">Closed</span>
      <div style="width:20px;height:20px;box-shadow:inset 0 0 0 3px var(--ink);margin-left:24px"></div>
      <span class="label dim">Open</span>
    </div>

    <div style="position:absolute;left:480px;top:230px;width:296px;height:3px;background:var(--ink)"></div>

    <!-- The one area a person can go into from here, an ink slab like every
         other act. The paper above it is room for the next one. -->
    <div class="btn act" style="left:480px;top:284px;width:296px;height:88px">
      <svg class="mark" width="36" height="36" viewBox="0 0 48 48">
        <circle cx="24" cy="21" r="14"/>
        <circle class="solid" cx="24" cy="11" r="3.5"/>
        <circle class="solid" cx="15.5" cy="26" r="3.5"/>
        <circle class="solid" cx="32.5" cy="26" r="3.5"/>
        <path d="M3 42 H45"/>
      </svg>
      <span class="label" style="font-size:24px">Pump service</span>
    </div>

  </div>

  <!-- Settings is where you are: the corner tab is inked, and it is still
       not one of the four destinations. -->
  <div class="corner inked">
    <svg class="mark" width="32" height="32" viewBox="0 0 48 48">
      <path d="M4 16 H44"/><path d="M4 32 H44"/>
      <rect class="solid" x="13" y="10" width="12" height="12"/>
      <rect class="solid" x="27" y="26" width="12" height="12"/>
    </svg>
  </div>

  <div class="bar">
    <div class="dest">
      <svg class="mark" width="40" height="40" viewBox="0 0 48 48" stroke-width="5">
        <path d="M31 6 L13 24 L31 42"/>
      </svg>
      <span class="label">Choose</span>
    </div>
    <div class="dest">
      <svg class="mark" width="40" height="40" viewBox="0 0 48 48">
        <path class="solid" d="M24 4 L35 21 A13 13 0 1 1 13 21 Z"/>
        <path d="M6 45 H42"/>
      </svg>
      <span class="label">Prime</span>
    </div>
    <div class="dest">
      <svg class="mark" width="40" height="40" viewBox="0 0 48 48">
        <path d="M5 7 H43 L28 27 V43 H20 V27 Z"/>
      </svg>
      <span class="label">Fill</span>
    </div>
    <div class="dest">
      <svg class="mark" width="40" height="40" viewBox="0 0 48 48">
        <path d="M24 3 V13"/>
        <path d="M9 17 H39 V44 H9 Z"/>
        <path d="M12 32 q7 -8 14 0 t13 -1"/>
      </svg>
      <span class="label">Clean</span>
    </div>
  </div>

</div>
</body>
</html>
