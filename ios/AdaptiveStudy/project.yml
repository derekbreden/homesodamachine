name: SodaMachineStudy
options:
  bundleIdPrefix: com.derekbreden
  deploymentTarget:
    iOS: "18.0"
targets:
  SodaMachineStudy:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../SodaMachine/SodaMachine/Theme.swift
      - path: ../SodaMachine/SodaMachine/Assets.xcassets
      - path: ../SodaMachine/SodaMachine/FlavorImages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derekbreden.SodaMachineStudy
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Soda Study
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
