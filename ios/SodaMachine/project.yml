name: SodaMachine
options:
  bundleIdPrefix: com.derekbreden
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

targets:
  SodaMachine:
    type: application
    platform: iOS
    sources:
      - SodaMachine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derekbreden.SodaMachine
        # The team on this machine's only signing identity, read off its OU.
        # Automatic signing so a build to a device fetches its own profile.
        DEVELOPMENT_TEAM: T5WDQ2QJCS
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Written rather than generated from build settings: GENERATE_INFOPLIST_FILE
    # carries only the keys Xcode has an INFOPLIST_KEY_ for, and UIBackgroundModes
    # is not one of them — it is accepted as a setting and dropped from the plist.
    info:
      path: SodaMachine/Info.plist
      properties:
        CFBundleDisplayName: Soda Machine
        # A machine is added through the system's own sheet (MachineAccess.swift):
        # the person taps the one at hand and the app is handed that machine,
        # with no Bluetooth prompt. The sheet looks for the Nordic UART service,
        # the one thing every machine's primary advertisement carries; FFFF is
        # the company id its manufacturer block is written under. A picker item
        # that asks for anything not named here stops the app, and so does any
        # of these keys left with an empty list.
        NSAccessorySetupKitSupports:
          - Bluetooth
        NSAccessorySetupBluetoothServices:
          - "6E400001-B5A3-F393-E0A9-E50E24DCCA9E"
        NSAccessorySetupBluetoothCompanyIdentifiers:
          - "FFFF"
        # Never shown while the keys above are declared: the sheet stands in for
        # the prompt. CoreBluetooth still carries every word to the machine, and
        # a phone that gave an earlier build Bluetooth access keeps it.
        NSBluetoothAlwaysUsageDescription: "This app uses Bluetooth to connect to your soda machine for managing display images, maintenance, and usage statistics."
        UILaunchStoryboardName: LaunchScreen
        # An update is minutes of pulling one chunk at a time, and a phone whose
        # screen has gone off is a suspended app with a stalled transfer behind
        # it. The machine is told to keep its panel down and not be unplugged
        # while that happens, so the phone has to keep answering.
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
