; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; platformio.ini stays at the repo root, where PlatformIO reads it; every
; other firmware artifact lives under firmware/. The [platformio] section
; below points the standard PlatformIO directories (src/, include/, lib/,
; test/) at it. Partition tables, the pre-build script, and the
; build_src_filter / -I paths in per-env blocks name the same tree.
;
; src_dir is firmware/ itself, so each environment names its own source
; tree in its own build_src_filter. What each tree runs on is
; `firmware/README.md`.

[platformio]
src_dir = firmware
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test

; Pure policy tests run on the build host. Nothing in this environment reaches
; Arduino, a serial port, or a connected board.
[env:native]
platform = native@1.2.1
test_framework = unity
test_filter =
    test_flavor_selection
    test_machine_policy
    test_pcba_expanders
    test_weld_rotator_policy
lib_deps = throwtheswitch/Unity@2.6.1
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -Wpedantic
    -Werror

; Dedicated bench controller for the cap-weld tube rotator.  It uses one stock
; ESP32-DevKitC-32E, the purchased DM542T/NEMA 23 drive, and a dry-contact
; deadman pedal; it is not appliance firmware.
[env:weld_rotator]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<src_weld_rotator/*>

; The appliance's own controller, on the PCBA's WROOM (U1), flashed
; through the board's CH340C over USB-C at J14.
[env:appliance]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = firmware/partitions_esp32.csv
board_build.filesystem = littlefs
extra_scripts = pre:firmware/pre_build.py
build_src_filter = -<*> +<src_appliance/*>
; J9 carries the same TinyProto transport the bring-up console speaks.
lib_deps =
    https://github.com/lexus2k/tinyproto.git#425b1b64caf86aacf5f95ebc2ac50cd45a522d2a

; The under-counter prototype's main controller: L298N drivers, two
; dispense valves + two clean solenoids, and the RP2040 + 1.28" S3
; displays it talks to over TinyProto.
[env:prototype]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = firmware/partitions_esp32.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = images/factory_manifest.json
extra_scripts = pre:firmware/pre_build.py
build_src_filter = -<*> +<src_prototype/*>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    https://github.com/lexus2k/tinyproto.git#425b1b64caf86aacf5f95ebc2ac50cd45a522d2a
    adafruit/RTClib@2.1.4
    symlink://${PROJECT_DIR}/../PersistentLog

[env:rp2040_display]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0dcdd94eead72fdf56ea59a3d7c8aa2f379
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1.5m
monitor_speed = 115200
extra_scripts = pre:firmware/pre_build.py
build_src_filter = -<*> +<src_display/*>
lib_deps =
    moononournation/GFX Library for Arduino@1.6.5
    https://github.com/lexus2k/tinyproto.git#425b1b64caf86aacf5f95ebc2ac50cd45a522d2a

[env:esp32s3_config]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
board_build.partitions = firmware/partitions_s3.csv
board_build.filesystem = littlefs
extra_scripts = pre:firmware/pre_build.py
build_src_filter = -<*> +<src_config/*>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Ifirmware/src_config
lib_deps =
    moononournation/GFX Library for Arduino@1.6.5
    lvgl/lvgl@8.4.0
    https://github.com/lexus2k/tinyproto.git#425b1b64caf86aacf5f95ebc2ac50cd45a522d2a
    h2zero/NimBLE-Arduino@2.5.0
    symlink://${PROJECT_DIR}/../PersistentLog

[env:esp32s3_faucet]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
board_build.partitions = firmware/partitions_s3_faucet.csv
board_build.filesystem = littlefs
extra_scripts = pre:firmware/pre_build.py
build_src_filter = -<*> +<src_faucet/*>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Ifirmware/src_faucet
lib_deps =
    moononournation/GFX Library for Arduino@1.6.5
    lvgl/lvgl@8.4.0
    https://github.com/lexus2k/tinyproto.git#425b1b64caf86aacf5f95ebc2ac50cd45a522d2a
    h2zero/NimBLE-Arduino@2.5.0

[env:esp32s3_front]
; Waveshare ESP32-S3-Touch-LCD-4.3B — the appliance front-face display.
; ESP32-S3-WROOM-1-N16R8 (16 MB flash / 8 MB octal PSRAM), 800x480 IPS RGB
; parallel panel, GT911 capacitive touch + CH422G I/O expander. The board def
; below enables OPI PSRAM (needed for the RGB framebuffer) and matches the
; module's USB hwid 0x303A:0x1001.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
; 16 MB layout with a large app slot — the loading-animation frames are
; compiled in and overflow the shared 4 MB partitions_s3.csv app slot.
board_build.partitions = firmware/partitions_s3_front.csv
board_build.filesystem = littlefs
extra_scripts = pre:firmware/pre_build.py
build_src_filter = -<*> +<src_front/*>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Ifirmware/src_front
; The RGB panel is driven through esp_lcd directly (double framebuffer +
; bounce buffer for tear-free output), not Arduino_GFX — so LVGL, plus the
; TinyProto transport this board speaks to the base over RS485.
lib_deps =
    lvgl/lvgl@8.4.0
    https://github.com/lexus2k/tinyproto.git#425b1b64caf86aacf5f95ebc2ac50cd45a522d2a

; Bring-up console for the JLCPCB-assembled pcba controller board — runs on the
; board's own WROOM (U1), flashed through its on-board CH340C over USB-C. It
; runs pre_build for the TinyProto patching, which is applied per environment.
[env:pcba_bench]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<src_pcba_bench/*>
extra_scripts = pre:firmware/pre_build.py
; J9 carries the same TinyProto transport the appliance uses between boards.
lib_deps =
    https://github.com/lexus2k/tinyproto.git#425b1b64caf86aacf5f95ebc2ac50cd45a522d2a
