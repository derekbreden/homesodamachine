; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; platformio.ini stays at the repo root (PlatformIO requires it), but
; every other firmware artifact lives under firmware/ to keep the root
; honest about the repo containing more than this firmware project.
; The [platformio] section below redirects each of the standard PlatformIO
; directories (src/, include/, lib/, test/) into firmware/. Partition
; tables, the pre-build script, and the build_src_filter / -I paths in
; per-env blocks reflect the same relocation.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = firmware/partitions_esp32.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = images/factory_manifest.json
extra_scripts = pre:firmware/pre_build.py
lib_deps =
    bblanchon/ArduinoJson
    https://github.com/lexus2k/tinyproto.git
    adafruit/RTClib
    symlink://${PROJECT_DIR}/../PersistentLog

[env:rp2040_display]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1.5m
monitor_speed = 115200
extra_scripts = pre:firmware/pre_build.py
; build_src_filter is relative to src_dir (firmware/src), so ../src_display
; resolves to firmware/src_display.
build_src_filter = -<*> +<../src_display/*>
lib_deps =
    moononournation/GFX Library for Arduino
    https://github.com/lexus2k/tinyproto.git

[env:esp32s3_config]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
board_build.partitions = firmware/partitions_s3.csv
board_build.filesystem = littlefs
extra_scripts = pre:firmware/pre_build.py
; Same convention as rp2040_display above — relative to firmware/src.
build_src_filter = -<*> +<../src_config/*>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Ifirmware/src_config
lib_deps =
    moononournation/GFX Library for Arduino
    lvgl/lvgl@^8.4.0
    https://github.com/lexus2k/tinyproto.git
    h2zero/NimBLE-Arduino@^2.2.1
    symlink://${PROJECT_DIR}/../PersistentLog

[env:esp32s3_faucet]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
board_build.partitions = firmware/partitions_s3.csv
board_build.filesystem = littlefs
extra_scripts = pre:firmware/pre_build.py
; Same convention as rp2040_display above — relative to firmware/src.
build_src_filter = -<*> +<../src_faucet/*>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Ifirmware/src_faucet
lib_deps =
    moononournation/GFX Library for Arduino
    lvgl/lvgl@^8.4.0

[env:esp32s3_front]
; Waveshare ESP32-S3-Touch-LCD-4.3B — the appliance front-face display.
; ESP32-S3-WROOM-1-N16R8 (16 MB flash / 8 MB octal PSRAM), 800x480 IPS RGB
; parallel panel, GT911 capacitive touch + CH422G I/O expander. The board def
; below enables OPI PSRAM (needed for the RGB framebuffer) and matches the
; module's USB hwid 0x303A:0x1001.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
; 16 MB layout with a large app slot — the loading-animation frames are
; compiled in and overflow the shared 4 MB partitions_s3.csv app slot.
board_build.partitions = firmware/partitions_s3_front.csv
board_build.filesystem = littlefs
extra_scripts = pre:firmware/pre_build.py
; Same convention as the other displays — relative to firmware/src.
build_src_filter = -<*> +<../src_front/*>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_LOOP_STACK_SIZE=16384
    -Ifirmware/src_front
lib_deps =
    moononournation/GFX Library for Arduino
    lvgl/lvgl@^8.4.0

; ── Throwaway bench rigs ──────────────────────────────────────────────
; Standalone firmware for fiddling with one peripheral on a spare ESP32,
; deliberately kept apart from the production firmware above: no custom
; partition table, no littlefs, no pre_build, no PersistentLog. Each has a
; README and a tear-down note in its src_*_bench/ folder. Delete when done.

[env:servo_bench]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_servo_bench/*>
lib_deps =
    madhephaestus/ESP32Servo

[env:reed_bench]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_reed_bench/*>
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library
