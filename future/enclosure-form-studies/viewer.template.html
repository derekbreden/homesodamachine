<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enclosure exterior studies</title>
  <style>
    :root{color-scheme:light dark;--background:light-dark(#fff,#181818);--foreground:light-dark(#222,#eee);--muted-foreground:light-dark(#666,#aaa);--viz-series-1:light-dark(#266c9c,#6eaacb);--viz-series-2:light-dark(#a14d27,#d69766);--viz-series-3:light-dark(#428058,#85b69a);--viz-series-4:light-dark(#976393,#bf91bb);--viz-series-5:light-dark(#b69429,#d6bb69);--viz-series-6:light-dark(#478b87,#81b9b5)}
    *{box-sizing:border-box}body{margin:0;padding:24px;max-width:1360px;margin-inline:auto;background:var(--background);color:var(--foreground);font:14px/1.5 system-ui,sans-serif}
    .viz-controls{display:flex;gap:12px 18px;align-items:end;flex-wrap:wrap}.form-label{display:flex;flex-direction:column;gap:4px}.form-select{font:inherit;padding:4px 22px 4px 7px;border:1px solid light-dark(#ccc,#555);border-radius:4px;background:var(--background);color:var(--foreground)}
    .form-check{display:flex;align-items:center;gap:5px;min-height:32px}.text-small{font-size:12px}.text-muted{color:var(--muted-foreground)}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(pointer:coarse){.form-select,.form-check{min-height:44px}.form-select{font-size:16px}}@media(max-width:580px){body{padding:16px}}
  </style>
</head>
<body>
__VIEWER__
</body>
</html>
