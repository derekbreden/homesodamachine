<text x="25.0" y="624.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">Other ways to the same end</text>
<text x="30.0" y="646.0" font-size="11" fill="#111" text-anchor="start">(a') no board change: J4 by pin block (4P = pins 1-4, 3P = pins 5-7); J7 with GND on the 3P. Straight; the far end peels at more places.</text>
<text x="30.0" y="661.0" font-size="11" fill="#111" text-anchor="start">(b) one ribbon, one housing: J1 -&gt; XHP-5 + XHP-4, J2 -&gt; XHP-2 + XHP-3, J4 -&gt; XHP-4 + XHP-3, J7 -&gt; XHP-5 + XHP-2; ~9-11 mm more board edge;</text>
<text x="51.0" y="676.0" font-size="11" fill="#111" text-anchor="start">4P into XHP-4 becomes 7 of 14 ends; no pair is ever fed edge to edge.</text>
<text x="30.0" y="691.0" font-size="11" fill="#111" text-anchor="start">(c) one loom, one ribbon: 6P, 7P, 9P ribbon in pin order; the crossing moves to the hand-made far end (ribbon availability unchecked).</text>
