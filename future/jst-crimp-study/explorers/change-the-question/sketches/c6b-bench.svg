<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
<text x="20" y="24" font-size="16" font-weight="bold" fill="#111">c6b By hand this week: pre-form, snap, and a flag seat with a lamp on the SN-2549</text>
<text x="20" y="42" fill="#555">schematic, not to scale; numbers from c6b and the cited calc</text>
<rect x="15.0" y="55.0" width="970.0" height="190.0" rx="0" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="25.0" y="74.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">1. The bench, left to right on one printed baseplate (top view)</text>
<rect x="30.0" y="80.0" width="210.0" height="150.0" rx="0" fill="#f7f4ea" stroke="#8a6d1f" stroke-width="1.5"/>
<text x="40.0" y="100.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">1 Pre-former</text>
<text x="40.0" y="120.0" font-size="11" fill="#111" text-anchor="start">toggle clamp (Prime, $18.25)</text>
<text x="40.0" y="135.0" font-size="11" fill="#111" text-anchor="start">steel nest or cut XHP stub</text>
<text x="40.0" y="150.0" font-size="11" fill="#111" text-anchor="start">mandrel from the measured jacket</text>
<text x="40.0" y="165.0" font-size="11" fill="#111" text-anchor="start">round pin or flat blade</text>
<text x="40.0" y="180.0" font-size="11" fill="#111" text-anchor="start">-&gt; loom-order stick</text>
<rect x="270.0" y="80.0" width="210.0" height="150.0" rx="0" fill="#f7f4ea" stroke="#8a6d1f" stroke-width="1.5"/>
<text x="280.0" y="100.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">2 Snap block</text>
<text x="280.0" y="120.0" font-size="11" fill="#111" text-anchor="start">steel-floored pocket</text>
<text x="280.0" y="135.0" font-size="11" fill="#111" text-anchor="start">box stop + tip stop</text>
<text x="280.0" y="150.0" font-size="11" fill="#111" text-anchor="start">backlit window</text>
<text x="280.0" y="165.0" font-size="11" fill="#111" text-anchor="start">thumb tool: rear tine on</text>
<text x="280.0" y="180.0" font-size="11" fill="#111" text-anchor="start">jacket, front tine on strands</text>
<rect x="510.0" y="80.0" width="210.0" height="150.0" rx="0" fill="#f7f4ea" stroke="#8a6d1f" stroke-width="1.5"/>
<text x="520.0" y="100.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">3 SN-2549 in a cradle</text>
<text x="520.0" y="120.0" font-size="11" fill="#111" text-anchor="start">lower handle clamped</text>
<text x="520.0" y="135.0" font-size="11" fill="#111" text-anchor="start">flag seat on the lower</text>
<text x="520.0" y="150.0" font-size="11" fill="#111" text-anchor="start">jaw's M4 screw</text>
<text x="520.0" y="165.0" font-size="11" fill="#111" text-anchor="start">leaf stop + coin-cell lamp</text>
<text x="520.0" y="180.0" font-size="11" fill="#111" text-anchor="start">one hand squeezes</text>
<rect x="750.0" y="80.0" width="210.0" height="150.0" rx="0" fill="#f7f4ea" stroke="#8a6d1f" stroke-width="1.5"/>
<text x="760.0" y="100.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">4 i5 sensing nest</text>
<text x="760.0" y="120.0" font-size="11" fill="#111" text-anchor="start">housing on a real header</text>
<text x="760.0" y="135.0" font-size="11" fill="#111" text-anchor="start">posts are inputs</text>
<text x="760.0" y="150.0" font-size="11" fill="#111" text-anchor="start">lit cavity, lever seats</text>
<text x="760.0" y="165.0" font-size="11" fill="#111" text-anchor="start">the post that closes</text>
<text x="760.0" y="180.0" font-size="11" fill="#111" text-anchor="start">names the cavity</text>
<line x1="240.0" y1="155.0" x2="268.0" y2="155.0" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="480.0" y1="155.0" x2="508.0" y2="155.0" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="720.0" y1="155.0" x2="748.0" y2="155.0" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<rect x="15.0" y="255.0" width="970.0" height="330.0" rx="0" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="25.0" y="274.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">2. The flag seat in the open SN-2549 (side section along the nest axis)</text>
<rect x="330.0" y="470.0" width="170.0" height="40.0" rx="0" fill="#9a9a9a" stroke="#333" stroke-width="1.5"/>
<text x="390.0" y="496.0" font-size="11" fill="#fff" text-anchor="start">anvil (lower jaw)</text>
<rect x="330.0" y="300.0" width="170.0" height="45.0" rx="0" fill="#c8c8c8" stroke="#333" stroke-width="1.5"/>
<text x="342.0" y="328.0" font-size="11" fill="#111" text-anchor="start">punch (upper jaw), open</text>
<line x1="415.0" y1="350.0" x2="415.0" y2="372.0" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<rect x="500.0" y="404.0" width="60.0" height="26.0" rx="0" fill="none" stroke="#b87333" stroke-width="3"/>
<text x="516.0" y="398.0" font-size="11" fill="#8a4b10" text-anchor="start">box</text>
<path d="M505.0,430.0 L520.0,446.0" fill="none" stroke="#b87333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="520.0" y="460.0" font-size="11" fill="#8a4b10" text-anchor="start">lance</text>
<path d="M350.0,430.0 L500.0,430.0" fill="none" stroke="#b87333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M425.0,430.0 L425.0,412.0" fill="none" stroke="#b87333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M480.0,430.0 L480.0,412.0" fill="none" stroke="#b87333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M350.0,430.0 L350.0,400.0" fill="none" stroke="#b87333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M400.0,430.0 L400.0,400.0" fill="none" stroke="#b87333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="160.0" y="400.0" width="230.0" height="22.0" rx="0" fill="#333" stroke="#333" stroke-width="1.5"/>
<line x1="390.0" y1="416.0" x2="500.0" y2="416.0" stroke="#999" stroke-width="4"/>
<text x="170.0" y="392.0" font-size="11" fill="#111" text-anchor="start">jacket, snapped into the pre-formed barrel</text>
<line x1="460.0" y1="432.0" x2="460.0" y2="468.0" stroke="#1f5fa8" stroke-width="1"/>
<text x="430.0" y="462.0" font-size="12" font-weight="bold" fill="#1f5fa8" text-anchor="start">h</text>
<rect x="270.0" y="422.0" width="40.0" height="12.0" rx="0" fill="#e8d9a8" stroke="#8a6d1f" stroke-width="1.5"/>
<path d="M290.0,434.0 L286.0,444.0 L294.0,452.0 L286.0,460.0 L290.0,490.0" fill="none" stroke="#555" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40.0" y="470.0" font-size="11" fill="#111" text-anchor="start">rear U guide on the jacket,</text>
<text x="40.0" y="485.0" font-size="11" fill="#111" text-anchor="start">at h on a 1-3 N spring</text>
<rect x="502.0" y="432.0" width="58.0" height="10.0" rx="0" fill="#e8d9a8" stroke="#8a6d1f" stroke-width="1.5"/>
<line x1="502.0" y1="431.0" x2="560.0" y2="431.0" stroke="#555" stroke-width="2"/>
<path d="M530.0,442.0 L526.0,452.0 L534.0,460.0 L526.0,468.0 L530.0,490.0" fill="none" stroke="#555" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="562.0" y="390.0" width="6.0" height="52.0" rx="0" fill="#6b8fb3" stroke="#333" stroke-width="1.5"/>
<text x="580.0" y="300.0" font-size="11" fill="#111" text-anchor="start">front: open-topped slot keyed to box and lance,</text>
<text x="580.0" y="315.0" font-size="11" fill="#111" text-anchor="start">floor strip (electrode), at h on a 1-3 N spring;</text>
<text x="580.0" y="330.0" font-size="11" fill="#111" text-anchor="start">a cut kit XHP-2 on a flexure can be the slot</text>
<text x="580.0" y="352.0" font-size="11" fill="#111" text-anchor="start">leaf stop, insulated, preloaded 10-30 N:</text>
<text x="580.0" y="367.0" font-size="11" fill="#111" text-anchor="start">the person's push (at most the flag's grip,</text>
<text x="580.0" y="382.0" font-size="11" fill="#111" text-anchor="start">0.1-3.5 N) cannot move it; the barrel's growth</text>
<text x="580.0" y="397.0" font-size="11" fill="#111" text-anchor="start">under coining (80-520 N) can [w3 s3]</text>
<circle cx="750.0" cy="440.0" r="9.0" fill="#ffd84a" stroke="#a88a10" stroke-width="1.5"/>
<rect x="770.0" y="432.0" width="24.0" height="16.0" rx="0" fill="#ccc" stroke="#666" stroke-width="1.5"/>
<line x1="568.0" y1="400.0" x2="741.0" y2="440.0" stroke="#6b8fb3" stroke-width="1"/>
<line x1="560.0" y1="431.0" x2="770.0" y2="448.0" stroke="#6b8fb3" stroke-width="1"/>
<text x="730.0" y="470.0" font-size="11" fill="#111" text-anchor="start">LED + coin cell: the box bridges</text>
<text x="730.0" y="485.0" font-size="11" fill="#111" text-anchor="start">strip and leaf -&gt; lit: stop pushing</text>
<text x="40.0" y="540.0" font-size="11" fill="#111" text-anchor="start">h = 1.1-1.7 mm clears the lance on entry (lance + 0.2 = 0.8-1.1 mm) and gives the 1.0-1.7 mm lift a crimped lance needs to be drawn back.</text>
<text x="40.0" y="555.0" font-size="11" fill="#111" text-anchor="start">Opening needed at the nest: 3.5-4.3 mm (keyhole), 3.6-4.9 mm (tall shapes) [htq s4]; unmeasured on the SN-2549. Dragged on the anvil, the</text>
<text x="40.0" y="570.0" font-size="11" fill="#111" text-anchor="start">lance folds at 1-5 N, above the flag's grip, and the contact slides back along its jacket unseen. The seat is hand-tool-as-press's (a6b).</text>
</svg>
