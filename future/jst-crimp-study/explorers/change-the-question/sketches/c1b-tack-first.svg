<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold" fill="#111">c1b Tack first: a light gang stroke pins every contact; the heavy crimp comes later, anywhere</text>
  <text x="20" y="42" fill="#555">schematic, not to scale</text>

  <!-- Panel 1: end view of the tack -->
  <rect x="15" y="55" width="480" height="450" fill="none" stroke="#bbb"/>
  <text x="25" y="75" font-weight="bold" fill="#111">1. End view at the insulation barrels: one light stroke</text>
  <!-- tack comb plate -->
  <path d="M80,110 L290,110 L290,178 L270,178 Q253,148 236,178 L202,178 Q185,148 168,178 L134,178 Q117,148 100,178 L80,178 Z" fill="#c8c8c8" stroke="#333"/>
  <text x="300" y="124" font-size="11" fill="#111">tack comb: one 1.2-1.5 mm steel</text>
  <text x="300" y="137" font-size="11" fill="#111">plate; with wide clone wings,</text>
  <text x="300" y="150" font-size="11" fill="#111">profiles at 6.8 mm, two passes</text>
  <text x="300" y="163" font-size="11" fill="#111">(odd, shift 3.4, even); laser-cut or EDM</text>
  <!-- contacts open (insulation wings) -->
  <g fill="none" stroke="#b87333" stroke-width="2.5">
    <path d="M98,210 l4,30 l30,0 l4,-30"/>
    <path d="M166,210 l4,30 l30,0 l4,-30"/>
    <path d="M234,210 l4,30 l30,0 l4,-30"/>
  </g>
  <g fill="#555"><circle cx="117" cy="228" r="11"/><circle cx="185" cy="228" r="11"/><circle cx="253" cy="228" r="11"/></g>
  <text x="300" y="222" fill="#8a4b10">open insulation wings around</text>
  <text x="300" y="236" fill="#8a4b10">the silicone (1.7 mm OD)</text>
  <!-- anvil strip -->
  <rect x="80" y="241" width="210" height="14" fill="#888" stroke="#333"/>
  <text x="300" y="253" fill="#111">steel anvil strip under the</text>
  <text x="300" y="267" fill="#111">insulation barrels (printed would yield)</text>
  <!-- pallet -->
  <rect x="80" y="255" width="210" height="30" fill="#e8d9a8" stroke="#8a6d1f"/>
  <text x="300" y="290" fill="#6b5310">row pallet from c1, 3.4 mm pitch</text>
  <line x1="117" y1="300" x2="185" y2="300" stroke="#333"/>
  <text x="128" y="314" fill="#333">3.4 mm</text>
  <line x1="185" y1="92" x2="185" y2="108" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="30" y="345" fill="#111">force for the whole half-row: 66-660 N for 2-5 barrels [calc 5]</text>
  <text x="30" y="361" fill="#111">driven by a printed lever, a toggle clamp, or a small lead screw</text>
  <text x="30" y="377" fill="#111">a hard stop sets a deliberately LOOSE tack height</text>
  <text x="30" y="405" fill="#111">conductor barrels stay open; strands lie in them,</text>
  <text x="30" y="421" fill="#111">held by the tacked insulation behind</text>
  <text x="30" y="449" fill="#111">what the tack fixes, for good: axial position (tip stop),</text>
  <text x="30" y="465" fill="#111">roll (pocket), which conductor has which contact (web)</text>

  <!-- Panel 2: what leaves -->
  <rect x="505" y="55" width="480" height="450" fill="none" stroke="#bbb"/>
  <text x="515" y="75" font-weight="bold" fill="#111">2. What leaves the machine, and the heavy crimp</text>
  <!-- ribbon with flagged contacts -->
  <line x1="530" y1="140" x2="620" y2="140" stroke="#111" stroke-width="10"/>
  <g stroke="#111" stroke-width="5" fill="none">
    <path d="M620,134 C650,120 660,110 700,106"/>
    <path d="M620,138 C650,134 660,130 700,130"/>
    <path d="M620,142 C650,146 660,150 700,154"/>
    <path d="M620,146 C650,160 660,170 700,178"/>
  </g>
  <g fill="#b87333">
    <rect x="700" y="100" width="36" height="12"/>
    <rect x="700" y="124" width="36" height="12"/>
    <rect x="700" y="148" width="36" height="12"/>
    <rect x="700" y="172" width="36" height="12"/>
  </g>
  <text x="750" y="120" fill="#111">every contact tacked on:</text>
  <text x="750" y="134" fill="#111">a flag on its own wire,</text>
  <text x="750" y="148" fill="#111">conductor barrel still open</text>

  <line x1="700" y1="200" x2="700" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <text x="525" y="266" font-weight="bold" fill="#111">heavy conductor crimp, one at a time, any of:</text>
  <text x="525" y="288" font-size="11" fill="#111">a) Derek with the SN-2549: the flag carried level on a sprung seat,</text>
  <text x="540" y="301" font-size="11" fill="#111">lance clear of the anvil, box-first to a leaf stop with a lamp (c6b),</text>
  <text x="540" y="314" font-size="11" fill="#111">then squeeze; no "one click, then feed the wire" juggling</text>
  <text x="525" y="330" fill="#111">b) JST WC-110: its flap locator takes the box</text>
  <text x="525" y="354" fill="#111">c) a single-die station (force-and-form f9), or in the row (c1c): only contact-to-die</text>
  <text x="540" y="370" fill="#111">location matters now; contact-to-wire location is already fixed</text>
  <text x="525" y="398" fill="#111">the final die re-forms the insulation barrel to its own profile</text>

  <!-- tiny hand tool icon -->
  <path d="M600,440 L700,420 L710,430 L610,460 Z" fill="#d44" stroke="#822"/>
  <path d="M600,470 L700,450 L710,440 L610,480 Z" fill="#d44" stroke="#822"/>
  <circle cx="712" cy="436" r="8" fill="#ccc" stroke="#333"/>
  <text x="730" y="450" fill="#555">hand tool, frame press, or</text>
  <text x="730" y="464" fill="#555">another explorer's crimp head</text>
</svg>
