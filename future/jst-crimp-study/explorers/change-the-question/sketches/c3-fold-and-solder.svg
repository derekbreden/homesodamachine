<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold" fill="#111">c3 Fold and solder: light fold, solder makes the joint (NOT a crimp; outside JST's support)</text>
  <text x="20" y="42" fill="#555">schematic, not to scale</text>

  <!-- station 1: fold -->
  <rect x="15" y="55" width="310" height="370" fill="none" stroke="#bbb"/>
  <text x="25" y="75" font-weight="bold" fill="#111">1. Fold (end view)</text>
  <rect x="120" y="95" width="30" height="40" fill="#ddd" stroke="#333"/>
  <text x="158" y="110" fill="#111">servo lever or small</text>
  <text x="158" y="124" fill="#111">lead screw, ~0.1-0.3 kN</text>
  <path d="M90,135 L180,135 L180,175 L162,175 Q135,205 108,175 L90,175 Z" fill="#c8c8c8" stroke="#333"/>
  <text x="188" y="165" fill="#111">folder arch, no coining</text>
  <text x="188" y="179" fill="#111">land; sheet steel in a printed</text><text x="188" y="193" fill="#111">holder (wing edges gouge plastic)</text>
  <path d="M108,210 l4,26 l46,0 l4,-26" fill="none" stroke="#b87333" stroke-width="3"/>
  <g fill="#b87333"><circle cx="128" cy="228" r="3"/><circle cx="135" cy="224" r="3"/><circle cx="142" cy="228" r="3"/><circle cx="135" cy="231" r="3"/><circle cx="128" cy="220" r="3"/><circle cx="142" cy="220" r="3"/></g>
  <rect x="112" y="236" width="46" height="14" fill="#888" stroke="#333"/>
  <text x="170" y="236" fill="#111">steel pin anvil</text>
  <text x="30" y="280" fill="#111">wings curled around the strands,</text>
  <text x="30" y="296" fill="#111">stopped ~0.2-0.3 mm above a crimp</text>
  <text x="30" y="312" fill="#111">height: enclosed, not compacted</text>
  <text x="30" y="340" fill="#111">no hardened B-profile, no kN frame,</text>
  <text x="30" y="356" fill="#111">no bottom-dead-centre precision</text>

  <!-- station 2: solder -->
  <rect x="335" y="55" width="330" height="370" fill="none" stroke="#bbb"/>
  <text x="345" y="75" font-weight="bold" fill="#111">2. Solder (side view)</text>
  <!-- iron -->
  <path d="M470,95 L520,95 L510,190 L492,205 L480,190 Z" fill="#999" stroke="#333"/>
  <text x="528" y="112" fill="#111">Hakko FX-888D tip</text>
  <text x="528" y="126" fill="#111">on a Z slide</text>
  <!-- solder feeder -->
  <path d="M380,120 C420,150 440,190 455,215" fill="none" stroke="#aaa" stroke-width="4"/>
  <text x="350" y="112" fill="#111">stepper solder feeder,</text>
  <text x="350" y="126" fill="#111">0.5 mm flux-core</text>
  <!-- contact side view -->
  <line x1="355" y1="232" x2="430" y2="232" stroke="#111" stroke-width="10"/>
  <line x1="430" y1="232" x2="470" y2="232" stroke="#b87333" stroke-width="4"/>
  <rect x="402" y="222" width="22" height="20" fill="none" stroke="#b87333" stroke-width="2.5"/>
  <rect x="440" y="224" width="22" height="16" fill="#e0a060" stroke="#b87333" stroke-width="2.5"/>
  <rect x="480" y="220" width="44" height="24" fill="none" stroke="#b87333" stroke-width="2.5"/>
  <text x="400" y="262" fill="#8a4b10">ins.</text><text x="438" y="262" fill="#8a4b10">cond.</text><text x="490" y="262" fill="#8a4b10">box</text>
  <text x="345" y="292" fill="#111">metered solder at the brush, 1-3 s dwell;</text>
  <text x="345" y="308" fill="#111">~6 J to heat contact + 10 mm of wire [calc 6]</text>
  <text x="345" y="336" fill="#b00">watch: flux running forward into the box;</text>
  <text x="345" y="352" fill="#b00">solder wicking back under the silicone</text>
  <text x="345" y="380" fill="#111">silicone does not melt or shrink back</text>

  <!-- station 3: check -->
  <rect x="675" y="55" width="310" height="370" fill="none" stroke="#bbb"/>
  <text x="685" y="75" font-weight="bold" fill="#111">3. Check</text>
  <text x="690" y="105" fill="#111">camera: fillet at the brush, no solder</text>
  <text x="690" y="121" fill="#111">on the box or the insulation barrel</text>
  <text x="690" y="149" fill="#111">4-wire milliohms: box to the</text>
  <text x="690" y="165" fill="#111">conductor's far end (~1 mOhm steps)</text>
  <text x="690" y="193" fill="#111">pull to 39.2 N (JST's 22 AWG minimum)</text>
  <text x="690" y="235" fill="#111">no crimp height to measure: that is</text>
  <text x="690" y="251" fill="#111">the point, and the problem</text>
  <text x="690" y="295" fill="#555">shares its fold station with the c1b</text>
  <text x="690" y="311" fill="#555">tack comb</text>
</svg>
