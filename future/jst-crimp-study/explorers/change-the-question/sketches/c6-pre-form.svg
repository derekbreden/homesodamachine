<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold" fill="#111">c6 Pre-form the contact: a keyhole insulation barrel, made in bulk with no wire, that the conductor snaps into</text>
  <text x="20" y="42" fill="#555">schematic; end views drawn at roughly 40 px per mm from the cited dimensions, everything else not to scale</text>

  <!-- ===== Panel 1: open vs pre-formed, end view ===== -->
  <rect x="15" y="55" width="480" height="250" fill="none" stroke="#bbb"/>
  <text x="25" y="74" font-weight="bold" fill="#111">1. End view of the insulation barrel, before and after</text>
  <!-- open U, clone: 2.8 wide, 3.0 tall -->
  <path d="M64,110 L72,222 Q72,236 86,236 L150,236 Q164,236 164,222 L172,110" fill="none" stroke="#b87333" stroke-width="8"/>
  <text x="50" y="258" fill="#8a4b10">open, clone drawings:</text>
  <text x="50" y="272" fill="#8a4b10">2.46-3.25 mm wide,</text>
  <text x="50" y="286" fill="#8a4b10">2.75-3.2 mm tall</text>
  <line x1="64" y1="100" x2="172" y2="100" stroke="#333"/>
  <text x="92" y="95" fill="#333">~2.8 mm</text>
  <!-- arrow -->
  <line x1="190" y1="175" x2="240" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="186" y="165" fill="#333">pre-form</text>
  <!-- keyhole: bore r = 0.79 mm -> 32 px; centre 330,200 -->
  <circle cx="330" cy="200" r="31" fill="#e0e0e0" stroke="#666" stroke-dasharray="3,2"/>
  <path d="M300,181 A36 36 0 1 0 360,181" fill="none" stroke="#b87333" stroke-width="8"/>
  <text x="318" y="204" fill="#333">pin</text>
  <line x1="304" y1="170" x2="356" y2="170" stroke="#333"/>
  <text x="292" y="162" fill="#333">throat 1.3-1.5</text>
  <line x1="290" y1="248" x2="370" y2="248" stroke="#333"/>
  <text x="280" y="264" fill="#333">outside 1.96-2.14 mm</text>
  <text x="380" y="178" fill="#111" font-size="11">bore = mandrel +</text><text x="380" y="191" fill="#111" font-size="11">0.02-0.05 springback;</text><text x="380" y="204" fill="#111" font-size="11">mandrel chosen from</text><text x="380" y="217" fill="#111" font-size="11">the measured jacket:</text><text x="380" y="230" fill="#111" font-size="11">1.56-1.57 for 1.70</text>
  <text x="250" y="284" fill="#111">conductor barrel and box: unchanged</text>
  <text x="250" y="298" fill="#111">about JST's 1.95 mm catalog envelope [w2 §2]</text>

  <!-- ===== Panel 2: the pre-former, side view ===== -->
  <rect x="505" y="55" width="480" height="250" fill="none" stroke="#bbb"/>
  <text x="515" y="74" font-weight="bold" fill="#111">2. The pre-former, side view: no wire, 10-80 N</text>
  <!-- nest block -->
  <rect x="540" y="200" width="260" height="40" fill="#999" stroke="#333"/>
  <text x="560" y="258" fill="#111">steel nest: box slot, lance relief, front stop</text>
  <!-- contact: box, conductor barrel, insulation barrel -->
  <rect x="560" y="168" width="60" height="32" fill="none" stroke="#b87333" stroke-width="3"/>
  <text x="572" y="160" fill="#8a4b10">box</text>
  <path d="M628,200 L628,178 M676,200 L676,178" stroke="#b87333" stroke-width="3"/>
  <line x1="628" y1="200" x2="676" y2="200" stroke="#b87333" stroke-width="3"/>
  <text x="630" y="160" fill="#8a4b10">cond. U</text>
  <path d="M690,200 L690,168 M740,200 L740,168" stroke="#b87333" stroke-width="3"/>
  <line x1="690" y1="200" x2="740" y2="200" stroke="#b87333" stroke-width="3"/>
  <text x="690" y="160" fill="#8a4b10">ins. barrel</text>
  <rect x="548" y="166" width="10" height="36" fill="#555"/>
  <text x="510" y="150" fill="#333">front stop</text>
  <!-- mandrel from behind -->
  <rect x="686" y="182" width="200" height="10" fill="#666"/>
  <line x1="930" y1="187" x2="892" y2="187" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="820" y="176" fill="#111">mandrel pin in from behind,</text>
  <text x="820" y="212" fill="#111">along the axis (above the tab</text>
  <text x="820" y="226" fill="#111">if on strip); out the same way</text>
  <!-- jaws -->
  <path d="M684,96 L746,96 L746,132 L736,142 L694,142 L684,132 Z" fill="#c8c8c8" stroke="#333"/>
  <line x1="715" y1="80" x2="715" y2="94" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="752" y="124" fill="#111">keyhole jaw(s), steel,</text>
  <text x="752" y="138" fill="#111">over the insulation barrel only;</text>
  <text x="752" y="152" fill="#111">servo lever or toggle clamp</text>
  <text x="530" y="284" fill="#111">then a plunger pushes the contact forward, box first, into a loom-order stick</text>

  <!-- ===== Panel 3: the snap ===== -->
  <rect x="15" y="315" width="480" height="245" fill="none" stroke="#bbb"/>
  <text x="25" y="334" font-weight="bold" fill="#111">3. Placing it on the conductor: a snap, like a punchdown</text>
  <!-- before -->
  <circle cx="110" cy="385" r="34" fill="#333"/>
  <circle cx="110" cy="385" r="15" fill="#b8b8b8"/>
  <text x="30" y="392" fill="#111">jacket</text>
  <text x="30" y="406" fill="#111">1.7 mm</text>
  <path d="M80,431 A36 36 0 1 0 140,431" fill="none" stroke="#b87333" stroke-width="7"/>
  <rect x="60" y="480" width="100" height="14" fill="#e8d9a8" stroke="#8a6d1f"/>
  <text x="60" y="512" fill="#6b5310">pocket</text>
  <path d="M96,344 L96,351 L124,351 L124,344" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="110" y1="338" x2="110" y2="349" stroke="#1f5fa8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="132" y="356" fill="#1f5fa8">presser tine</text>
  <!-- after -->
  <line x1="180" y1="430" x2="225" y2="430" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="290" cy="444" r="33" fill="#333"/>
  <circle cx="290" cy="444" r="15" fill="#b8b8b8"/>
  <path d="M260,425 A36 36 0 1 0 320,425" fill="none" stroke="#b87333" stroke-width="7"/>
  <rect x="240" y="480" width="100" height="14" fill="#e8d9a8" stroke="#8a6d1f"/>
  <text x="352" y="420" fill="#111">held against lifting</text>
  <text x="352" y="434" fill="#111">by the throat; along the</text>
  <text x="352" y="448" fill="#111">wire by a 5-7 % squeeze</text>
  <text x="352" y="462" fill="#111">(0.1-3.5 N [w3b §3])</text>
  <text x="30" y="530" fill="#111">push-in ~0.3-30 N, a few N central [w2 §4]; across the wire onto a supported</text>
  <text x="30" y="546" fill="#111">contact, so nothing buckles. A front tine lays the strands into the open conductor U.</text>

  <!-- ===== Panel 4: side by side ===== -->
  <rect x="505" y="315" width="480" height="245" fill="none" stroke="#bbb"/>
  <text x="515" y="334" font-weight="bold" fill="#111">4. Side by side: open clones vs pre-formed [w2 §2]</text>
  <text x="520" y="358" fill="#111">at 2.5 mm pitch</text>
  <text x="700" y="358" fill="#555">(20 px per mm)</text>
  <g fill="none" stroke="#b87333" stroke-width="4">
    <path d="M530,366 L534,418 L582,418 L586,366"/>
    <path d="M580,366 L584,418 L632,418 L636,366"/>
    <path d="M630,366 L634,418 L682,418 L686,366"/>
  </g>
  <text x="520" y="440" fill="#a33">open clones: wings overlap</text>
  <text x="520" y="454" fill="#a33">by 0.30-0.75 mm</text>
  <g fill="none" stroke="#b87333" stroke-width="4">
    <path d="M745,390 A18 18 0 1 0 775,390"/>
    <path d="M795,390 A18 18 0 1 0 825,390"/>
    <path d="M845,390 A18 18 0 1 0 875,390"/>
  </g>
  <text x="740" y="440" fill="#2a7a2a">pre-formed: 0.36-0.54 mm</text>
  <text x="740" y="454" fill="#2a7a2a">clear</text>
  <text x="520" y="480" fill="#111">at 3.4 mm pitch, beside a pre-formed neighbour, an ordinary one-nest punch</text>
  <text x="520" y="496" fill="#111">has 0.23-0.42 mm to spare at the insulation section and 0.33-0.65 mm at the</text>
  <text x="520" y="512" fill="#111">conductor section: crimp in the row, no lift (c1c). At 2.5 mm the room is</text>
  <text x="520" y="528" fill="#111">1.32-1.50 mm half-width: only punches up to ~2.6-3.0 mm wide.</text>

  <!-- ===== Panel 5: stick ===== -->
  <rect x="15" y="570" width="970" height="215" fill="none" stroke="#bbb"/>
  <text x="25" y="589" font-weight="bold" fill="#111">5. Loom-order sticks: pre-formed contacts stack nose to tail without nesting [w2 §5]</text>
  <rect x="40" y="620" width="620" height="50" fill="#f3efe2" stroke="#8a6d1f"/>
  <g fill="none" stroke="#b87333" stroke-width="3">
    <rect x="50" y="630" width="40" height="30"/><rect x="92" y="638" width="40" height="14"/><rect x="136" y="632" width="42" height="26" rx="10"/>
    <rect x="190" y="630" width="40" height="30"/><rect x="232" y="638" width="40" height="14"/><rect x="276" y="632" width="42" height="26" rx="10"/>
    <rect x="330" y="630" width="40" height="30"/><rect x="372" y="638" width="40" height="14"/><rect x="416" y="632" width="42" height="26" rx="10"/>
    <rect x="470" y="630" width="40" height="30"/><rect x="512" y="638" width="40" height="14"/><rect x="556" y="632" width="42" height="26" rx="10"/>
  </g>
  <text x="50" y="690" fill="#8a4b10">box | conductor U | keyhole</text>
  <text x="680" y="636" fill="#111">printed channel 2.1 x 2.6 mm with a lance groove;</text>
  <text x="680" y="652" fill="#111">4 contacts for a T4 end (23-27 mm), 9 for J1;</text>
  <text x="680" y="668" fill="#111">J2's stick has a blank spacer at position 3,</text>
  <text x="680" y="684" fill="#111">so the stick is the build list</text>
  <text x="40" y="720" fill="#111">A box (1.85-1.95 wide) cannot enter a keyhole (throat 1.3-1.5, bore ~1.5-1.7) from above or from behind. Open clone wings (2.46-3.25)</text>
  <text x="40" y="736" fill="#111">admit a box, which is why loose kit contacts nest in a bag or a tube. Orientation by the wide wings (rail, pocket plate, post) comes first;</text>
  <text x="40" y="752" fill="#111">the pre-former comes after it in the line. The keyhole is one of three pre-forms: see c6-shapes.svg for the final crimp of each.</text>
</svg>
