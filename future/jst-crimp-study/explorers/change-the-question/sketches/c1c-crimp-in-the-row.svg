<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="1000" height="820" fill="#ffffff"/>
<text x="20" y="24" font-size="16" font-weight="bold" fill="#111">c1c Half-rows crimped where they lie: narrowed neighbours, a fixed press, both rows before either is inserted</text>
<text x="20" y="42" fill="#555">schematic, not to scale except the end view (30 px per mm at the insulation barrels); combination of c1, c6 or c1b, and other explorers' presses and rules</text>
<rect x="15.0" y="55.0" width="480.0" height="360.0" rx="0" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="25.0" y="74.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">1. Top view (front = housing side, up)</text>
<rect x="40.0" y="370.0" width="420.0" height="10.0" rx="0" fill="#bbb" stroke="#666" stroke-width="1.5"/>
<text x="50.0" y="398.0" font-size="11" fill="#111" text-anchor="start">MGN12 rail behind the clamp; the slide body reaches forward</text>
<rect x="80.0" y="300.0" width="230.0" height="30.0" rx="0" fill="#9ab" stroke="#345" stroke-width="1.5"/>
<text x="95.0" y="320.0" font-size="11" fill="#123" text-anchor="start">web clamp (ribbon's reference)</text>
<line x1="130.0" y1="300.0" x2="130.0" y2="215.0" stroke="#111" stroke-width="5"/>
<line x1="164.0" y1="300.0" x2="164.0" y2="215.0" stroke="#111" stroke-width="5"/>
<line x1="198.0" y1="300.0" x2="198.0" y2="215.0" stroke="#111" stroke-width="5"/>
<line x1="232.0" y1="300.0" x2="232.0" y2="215.0" stroke="#111" stroke-width="5"/>
<rect x="110.0" y="190.0" width="145.0" height="45.0" rx="0" fill="#e8d9a8" stroke="#8a6d1f" stroke-width="1.5"/>
<rect x="123.0" y="195.0" width="14.0" height="35.0" rx="0" fill="none" stroke="#b87333" stroke-width="2"/>
<rect x="157.0" y="195.0" width="14.0" height="35.0" rx="0" fill="none" stroke="#b87333" stroke-width="2"/>
<rect x="191.0" y="195.0" width="14.0" height="35.0" rx="0" fill="none" stroke="#b87333" stroke-width="2"/>
<rect x="225.0" y="195.0" width="14.0" height="35.0" rx="0" fill="none" stroke="#b87333" stroke-width="2"/>
<text x="28.0" y="205.0" font-size="11" fill="#6b5310" text-anchor="start">pallet A</text>
<text x="28.0" y="218.0" font-size="11" fill="#6b5310" text-anchor="start">(B parked</text>
<text x="28.0" y="231.0" font-size="11" fill="#6b5310" text-anchor="start">below)</text>
<rect x="130.0" y="140.0" width="95.0" height="18.0" rx="0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="40.0" y="153.0" font-size="11" fill="#111" text-anchor="start">housing nest</text>
<rect x="144.0" y="95.0" width="40.0" height="22.0" rx="0" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="5,3"/>
<line x1="150.0" y1="117.0" x2="150.0" y2="205.0" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
<line x1="178.0" y1="117.0" x2="178.0" y2="205.0" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="235.0" y="90.0" font-size="11" fill="#111" text-anchor="start">dashed: the fixed steel C at the press's X.</text>
<text x="235.0" y="105.0" font-size="11" fill="#111" text-anchor="start">Spine in front of the housing nest's path;</text>
<text x="235.0" y="120.0" font-size="11" fill="#111" text-anchor="start">arms reach back 20-26 mm over and under</text>
<text x="235.0" y="135.0" font-size="11" fill="#111" text-anchor="start">the working carrier. The slide carries the</text>
<text x="235.0" y="150.0" font-size="11" fill="#111" text-anchor="start">work through its throat; tail and parked</text>
<text x="235.0" y="165.0" font-size="11" fill="#111" text-anchor="start">pallets stay behind, outside it.</text>
<rect x="380.0" y="185.0" width="100.0" height="95.0" rx="0" fill="none" stroke="#2a7a2a" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="385.0" y="203.0" font-size="11" fill="#2a7a2a" text-anchor="start">second station</text>
<text x="385.0" y="218.0" font-size="11" fill="#2a7a2a" text-anchor="start">at another X:</text>
<text x="385.0" y="233.0" font-size="11" fill="#2a7a2a" text-anchor="start">cam plate +</text>
<text x="385.0" y="248.0" font-size="11" fill="#2a7a2a" text-anchor="start">pushers (A), or</text>
<text x="385.0" y="263.0" font-size="11" fill="#2a7a2a" text-anchor="start">sort comb (B)</text>
<line x1="262.0" y1="232.0" x2="372.0" y2="232.0" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="40.0" y="352.0" font-size="11" fill="#111" text-anchor="start">the slide steps 3.4 mm per carrier and never carries crimp force</text>
<rect x="505.0" y="55.0" width="480.0" height="360.0" rx="0" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="515.0" y="74.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">2. Side section at the press (front left)</text>
<rect x="530.0" y="110.0" width="30.0" height="250.0" rx="0" fill="#aaa" stroke="#333" stroke-width="1.5"/>
<rect x="530.0" y="110.0" width="230.0" height="34.0" rx="0" fill="#aaa" stroke="#333" stroke-width="1.5"/>
<rect x="530.0" y="326.0" width="230.0" height="34.0" rx="0" fill="#aaa" stroke="#333" stroke-width="1.5"/>
<text x="549" y="235" font-size="11" fill="#111" transform="rotate(-90 549 235)" text-anchor="middle">spine</text>
<rect x="700.0" y="144.0" width="30.0" height="58.0" rx="0" fill="#c8c8c8" stroke="#333" stroke-width="1.5"/>
<text x="736.0" y="170.0" font-size="11" fill="#111" text-anchor="start">punch</text>
<rect x="703.0" y="262.0" width="24.0" height="64.0" rx="0" fill="#777" stroke="#333" stroke-width="1.5"/>
<text x="733.0" y="300.0" font-size="11" fill="#111" text-anchor="start">anvil &lt;= 1.90 wide,</text>
<text x="733.0" y="314.0" font-size="11" fill="#111" text-anchor="start">front edge behind the lance</text>
<rect x="680.0" y="300.0" width="18.0" height="26.0" rx="0" fill="#444" stroke="#333" stroke-width="1.5"/>
<text x="600.0" y="318.0" font-size="11" fill="#111" text-anchor="start">hard stop</text>
<rect x="575.0" y="236.0" width="60.0" height="26.0" rx="0" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="580.0" y="230.0" font-size="11" fill="#111" text-anchor="start">housing nest</text>
<rect x="655.0" y="262.0" width="90.0" height="10.0" rx="0" fill="#e8d9a8" stroke="#8a6d1f" stroke-width="1.5"/>
<rect x="660.0" y="244.0" width="30.0" height="18.0" rx="0" fill="none" stroke="#b87333" stroke-width="3"/>
<path d="M695.0,262.0 L740.0,262.0" fill="none" stroke="#b87333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="645.0" y="238.0" width="8.0" height="26.0" rx="0" fill="#6b8fb3" stroke="#333" stroke-width="1.5"/>
<text x="575.0" y="91.0" font-size="11" fill="#111" text-anchor="start">retracting front stop (blue): seated before a crimp, backs off</text>
<text x="575.0" y="104.0" font-size="11" fill="#111" text-anchor="start">0.3 mm at capture, out of the way while the slide steps</text>
<line x1="740.0" y1="256.0" x2="960.0" y2="256.0" stroke="#111" stroke-width="5"/>
<text x="800.0" y="248.0" font-size="11" fill="#111" text-anchor="start">to the web clamp, outside the C</text>
<text x="530.0" y="386.0" font-size="11" fill="#111" text-anchor="start">12 mm arm, 15-25 mm wide: 11-41 um at 3 kN; the stop beside the anvil</text>
<text x="530.0" y="401.0" font-size="11" fill="#111" text-anchor="start">makes that travel, not crimp height [htq s7]</text>
<rect x="15.0" y="425.0" width="480.0" height="380.0" rx="0" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="25.0" y="444.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">3. End view at the press: crimp in the row, no lift</text>
<path d="M168.6,646.9 L169.8,649.4 L170.8,652.1 L171.5,654.8 L171.9,657.6 L172.0,660.4 L171.8,663.2 L171.3,665.9 L170.6,668.6 L169.6,671.2 L168.3,673.7 L166.7,676.0 L164.9,678.2 L162.9,680.2 L160.8,681.9 L158.4,683.4 L155.9,684.7 L153.3,685.7 L150.6,686.4 L147.8,686.9 L145.0,687.0 L142.2,686.9 L139.4,686.4 L136.7,685.7 L134.1,684.7 L131.6,683.4 L129.2,681.9 L127.1,680.2 L125.1,678.2 L123.3,676.0 L121.7,673.7 L120.4,671.2 L119.4,668.6 L118.7,665.9 L118.2,663.2 L118.0,660.4 L118.1,657.6 L118.5,654.8 L119.2,652.1 L120.2,649.4 L121.4,646.9" fill="none" stroke="#b87333" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
