<ellipse cx="349.0" cy="658.5" rx="24.0" ry="24.9" fill="#333" stroke="none" stroke-width="1.5"/>
<path d="M181.0,470.0 L313.0,470.0 L313.0,575.0 L277.0,600.0 L217.0,600.0 L181.0,575.0 Z" fill="#c8c8c8" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="322.0" y="470.0" font-size="10" fill="#111" text-anchor="start">one-nest punch,</text>
<text x="322.0" y="484.0" font-size="10" fill="#111" text-anchor="start">half-width 1.75-2.0;</text>
<text x="322.0" y="498.0" font-size="10" fill="#111" text-anchor="start">or an SN nest cut</text>
<text x="322.0" y="512.0" font-size="10" fill="#111" text-anchor="start">to a tongue &lt;= 4.45,</text>
<text x="322.0" y="526.0" font-size="10" fill="#111" text-anchor="start">narrow to 2.1-2.3</text>
<text x="322.0" y="540.0" font-size="10" fill="#111" text-anchor="start">above the anvil</text>
<text x="322.0" y="554.0" font-size="10" fill="#111" text-anchor="start">(2.6-3.3 beside tall</text>
<text x="322.0" y="568.0" font-size="10" fill="#111" text-anchor="start">pre-forms) [htq s5]</text>
<rect x="219.0" y="694.0" width="56.0" height="40.0" rx="0" fill="#888" stroke="#333" stroke-width="1.5"/>
<text x="283.0" y="720.0" font-size="11" fill="#111" text-anchor="start">anvil blade &lt;= 1.90 mm</text>
<line x1="145.0" y1="745.0" x2="247.0" y2="745.0" stroke="#333" stroke-width="1.5"/>
<text x="180.0" y="760.0" font-size="11" fill="#111" text-anchor="start">3.4 mm</text>
<line x1="247.0" y1="745.0" x2="349.0" y2="745.0" stroke="#333" stroke-width="1.5"/>
<text x="282.0" y="760.0" font-size="11" fill="#111" text-anchor="start">3.4 mm</text>
<text x="30.0" y="778.0" font-size="11" fill="#111" text-anchor="start">beside keyhole neighbours: 0.23-0.42 mm spare (insulation), 0.33-0.65 (conductor)</text>
<text x="30.0" y="793.0" font-size="11" fill="#111" text-anchor="start">[w2 s2]; the pallet floats in X on a flexure and the punch's flare centres each contact</text>
<rect x="505.0" y="425.0" width="480.0" height="380.0" rx="0" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="515.0" y="444.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">4. One ribbon end</text>
<text x="515.0" y="468.0" font-size="11" fill="#111" text-anchor="start">1 clamp; strip flat; interlaced jaws split odd (A) from even (B);</text>
<text x="529.0" y="483.0" font-size="11" fill="#111" text-anchor="start">park B down and back</text>
<text x="515.0" y="498.0" font-size="11" fill="#111" text-anchor="start">2 pallet A up; presser comb snaps every jacket and lays every</text>
<text x="529.0" y="513.0" font-size="11" fill="#111" text-anchor="start">strand bundle (or lays open contacts; tack comb, two passes);</text>
<text x="529.0" y="528.0" font-size="11" fill="#111" text-anchor="start">one tine can be held back to lay a crossing in a second stroke</text>
<text x="515.0" y="543.0" font-size="11" fill="#111" text-anchor="start">3 camera checks every U; per carrier: the anvil electrode names</text>
<text x="529.0" y="558.0" font-size="11" fill="#111" text-anchor="start">the conductor; stop seats; punch to the hard stop; stop backs off</text>
<text x="515.0" y="573.0" font-size="11" fill="#111" text-anchor="start">4 park A; lay and crimp row B the same way</text>
<text x="515.0" y="588.0" font-size="11" fill="#111" text-anchor="start">5 proof pull ~20 N per contact, row by row, into the slide</text>
<text x="515.0" y="603.0" font-size="11" fill="#111" text-anchor="start">6 at the second station, one of two endings:</text>
<text x="529.0" y="618.0" font-size="11" fill="#111" text-anchor="start">A: cam spread 3.4 -&gt; 5.0; housing moves 7 mm onto row A;</text>
<text x="543.0" y="633.0" font-size="11" fill="#111" text-anchor="start">row B, bowed 4.6-8.6 mm when it parked, pushed 7 mm in</text>
<text x="529.0" y="648.0" font-size="11" fill="#111" text-anchor="start">B: sort both rows into one 2.5 mm comb, push the housing on</text>
<text x="543.0" y="663.0" font-size="11" fill="#111" text-anchor="start">(into-the-housing k8): no cam plate, nothing stored</text>
<text x="515.0" y="678.0" font-size="11" fill="#111" text-anchor="start">7 real XH wafer test: order, opens, shorts, J2's empty cavity</text>
<text x="515.0" y="706.0" font-size="11" fill="#555" text-anchor="start">split: 6-12 mm (T4), 15-26 mm (J1) for ending A [w2 s6]</text>
<text x="515.0" y="721.0" font-size="11" fill="#555" text-anchor="start">person: sticks or strip, housings, one ribbon end per call;</text>
<text x="515.0" y="736.0" font-size="11" fill="#555" text-anchor="start">J4/J7 crossings at the lay (A), none (B, or c7's pin map)</text>
</svg>
