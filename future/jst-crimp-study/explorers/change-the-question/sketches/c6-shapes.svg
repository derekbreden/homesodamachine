<text x="242.0" y="232.0" font-size="11" fill="#555" text-anchor="start">1.8</text>
<text x="170.0" y="104.0" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">Open, as bought (clone drawings)</text>
<text x="170.0" y="320.0" font-size="11" fill="#111" text-anchor="middle">2.46-3.25 wide, 2.75-3.2 tall</text>
<text x="170.0" y="335.0" font-size="11" fill="#111" text-anchor="middle">the jacket drops in and lifts out:</text>
<text x="170.0" y="350.0" font-size="11" fill="#111" text-anchor="middle">no hold before the crimp</text>
