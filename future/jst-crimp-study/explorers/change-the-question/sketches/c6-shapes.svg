<text x="20" y="24" font-size="16" font-weight="bold" fill="#111">c6 Three pre-forms, and what the final crimp does to each</text>
<text x="20" y="42" fill="#555">schematic; end views at the insulation barrel drawn at 40 px per mm from clone drawings and the calc; heights in mm above the contact's underside</text>
<rect x="15.0" y="55.0" width="970.0" height="300.0" rx="0" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="25.0" y="74.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">1. Pre-formed, with the jacket snapped in (end view at the insulation barrel)</text>
<rect x="15.0" y="365.0" width="970.0" height="300.0" rx="0" fill="none" stroke="#bbb" stroke-width="1"/>
<text x="25.0" y="384.0" font-size="12" font-weight="bold" fill="#111" text-anchor="start">2. After the final stroke of a B-profile die closing to ~1.8 mm (blue dashed; assumed, the SN-2549's is unmeasured)</text>
<path d="M118.0,184.0 L118.0,286.0 L126.0,296.0 L214.0,296.0 L222.0,286.0 L222.0,184.0" fill="none" stroke="#b87333" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
