<text x="572.0" y="232.0" font-size="11" fill="#555" text-anchor="start">1.8</text>
<text x="500.0" y="104.0" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">Keyhole (round mandrel), c6</text>
<text x="500.0" y="320.0" font-size="11" fill="#111" text-anchor="middle">1.96-2.14 wide; throat 1.3-1.5; metal ends at</text>
<text x="500.0" y="335.0" font-size="11" fill="#111" text-anchor="middle">1.28-1.66, under 1.8; the jacket stands ~1.9 [htq s1]</text>
<text x="500.0" y="350.0" font-size="11" fill="#111" text-anchor="middle">retention 0.15-30 N; axial grip 0.1-3.5 N [w3b s3-4]</text>
