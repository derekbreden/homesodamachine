<text x="500.0" y="580.0" font-size="11" fill="#a33" text-anchor="middle">the walls pinch the ring: throat to ~0.75-1.4 with a</text>
<text x="500.0" y="595.0" font-size="11" fill="#a33" text-anchor="middle">1.8-1.9 die, untouched at 2.0 [w3b s1]; the arches</text>
<text x="500.0" y="610.0" font-size="11" fill="#a33" text-anchor="middle">never reach the tips: an O with a gap, not a B</text>
