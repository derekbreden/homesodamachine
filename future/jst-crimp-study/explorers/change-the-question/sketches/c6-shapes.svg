<text x="830.0" y="580.0" font-size="11" fill="#2a7a2a" text-anchor="middle">the arches meet the tips above 1.8 and</text>
<text x="830.0" y="595.0" font-size="11" fill="#2a7a2a" text-anchor="middle">finish the B the die was made for</text>
<text x="30.0" y="695.0" font-size="12" fill="#111" text-anchor="start">Where each is made: the keyhole and the tall keyhole in c6's steel pre-former (mandrel chosen 0.08-0.12 mm under the measured jacket OD);</text>
<text x="30.0" y="710.0" font-size="12" fill="#111" text-anchor="start">the crimper-made U by the SN-2549 closed to click k (hand-tool-as-press a6b, a1b), if its insulation wings meet the die first (0.65-1.7 mm</text>
<text x="30.0" y="725.0" font-size="12" fill="#111" text-anchor="start">of die travel on the edge model, possibly none on the apex model [htq s3]).</text>
<text x="30.0" y="740.0" font-size="12" fill="#111" text-anchor="start">Stick channel: 2.1 x 2.6 mm for keyholes, ~2.1-2.2 x 3.1-3.2 mm for the tall shapes. None nests: a 1.85-1.95 mm box enters no throat or U.</text>
</svg>
