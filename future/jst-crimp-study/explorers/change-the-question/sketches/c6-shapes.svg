<text x="902.0" y="232.0" font-size="11" fill="#555" text-anchor="start">1.8</text>
<text x="830.0" y="104.0" font-size="12" fill="#111" text-anchor="middle">Tall shapes: blade mandrel (dashed),</text>
<text x="830.0" y="119.0" font-size="12" fill="#111" text-anchor="middle">or the crimper's own stroke stopped early</text>
<text x="830.0" y="320.0" font-size="11" fill="#111" text-anchor="middle">1.82-2.05 wide, 2.3-3.0 tall; tips above 1.8</text>
<text x="830.0" y="335.0" font-size="11" fill="#111" text-anchor="middle">axial grip 0.02-3.5 N; retention by friction (tips</text>
<text x="830.0" y="350.0" font-size="11" fill="#111" text-anchor="middle">vertical) up to 0.3-27 N once curled [w3b s2]</text>
