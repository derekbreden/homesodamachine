<text x="170.0" y="580.0" font-size="11" fill="#111" text-anchor="middle">a B: the arches carry the tips over</text>
<text x="170.0" y="595.0" font-size="11" fill="#111" text-anchor="middle">and drive them down into the jacket</text>
