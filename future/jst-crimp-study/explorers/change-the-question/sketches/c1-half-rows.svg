<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold" fill="#111">c1 Half-rows: crimp at ribbon pitch, splay with the contacts on, fill the housing in two pushes</text>
  <text x="20" y="42" fill="#555">schematic, not to scale except where a dimension is written</text>

  <!-- ============ Panel 1a: side view ============ -->
  <rect x="15" y="55" width="470" height="175" fill="none" stroke="#bbb"/>
  <text x="25" y="74" font-weight="bold" fill="#111">1a. Side view: split into two planes, park B, lay A into its pallet</text>
  <rect x="30" y="118" width="90" height="16" fill="#9ab" stroke="#345"/>
  <rect x="30" y="146" width="90" height="16" fill="#9ab" stroke="#345"/>
  <line x1="20" y1="140" x2="120" y2="140" stroke="#111" stroke-width="7"/>
  <text x="30" y="98" fill="#234">web clamp:</text><text x="30" y="178" fill="#234"></text>
  <path d="M120,140 C135,140 140,112 160,112 L300,112" fill="none" stroke="#111" stroke-width="6"/>
  <line x1="300" y1="112" x2="322" y2="112" stroke="#b87333" stroke-width="3"/>
  <text x="165" y="100" fill="#111">plane A: odd conductors, straight, 3.4 mm apart</text><text x="30" y="112" fill="#234">the reference</text>
  <path d="M120,142 C140,150 146,172 134,192 C124,206 108,214 92,218" fill="none" stroke="#777" stroke-width="6"/>
  <text x="150" y="212" fill="#555">plane B folded down and back, clear of pallet and ram</text>
  <rect x="225" y="126" width="120" height="18" fill="#e8d9a8" stroke="#8a6d1f"/>
  <path d="M242,126 l0,-16 l14,0 l0,16" fill="none" stroke="#b87333" stroke-width="2"/>
  <path d="M266,126 l0,-12 l14,0 l0,12" fill="none" stroke="#b87333" stroke-width="2"/>
  <rect x="292" y="114" width="30" height="12" fill="none" stroke="#b87333" stroke-width="2"/>
  <text x="352" y="124" fill="#6b5310">row pallet A:</text>
  <text x="352" y="138" fill="#6b5310">open contacts,</text>
  <text x="352" y="152" fill="#6b5310">box in a pocket</text>
  <text x="232" y="160" fill="#8a4b10">ins.   cond.   box</text>

  <!-- ============ Panel 1b: end view lift ============ -->
  <rect x="15" y="238" width="470" height="200" fill="none" stroke="#bbb"/>
  <text x="25" y="257" font-weight="bold" fill="#111">1b. End view: lift one carrier out of the row into a fixed punch</text>
  <!-- neighbour carriers -->
  <g fill="#e8d9a8" stroke="#8a6d1f">
    <rect x="45" y="370" width="34" height="24"/>
    <rect x="85" y="370" width="34" height="24"/>
    <rect x="165" y="370" width="34" height="24"/>
  </g>
  <g fill="none" stroke="#b87333" stroke-width="2">
    <path d="M50,352 l4,18 l26,0 l4,-18" transform="translate(-4,0)"/>
    <path d="M90,352 l4,18 l26,0 l4,-18" transform="translate(-4,0)"/>
    <path d="M170,352 l4,18 l26,0 l4,-18" transform="translate(-4,0)"/>
  </g>
  <g fill="#111"><circle cx="62" cy="362" r="7"/><circle cx="102" cy="362" r="7"/><circle cx="182" cy="362" r="7"/></g>
  <!-- lifted carrier k -->
  <rect x="125" y="330" width="34" height="24" fill="#f3c969" stroke="#8a6d1f"/>
  <path d="M126,312 l4,18 l26,0 l4,-18" fill="none" stroke="#b87333" stroke-width="2"/>
  <circle cx="142" cy="322" r="7" fill="#111"/>
  <!-- punch -->
  <path d="M105,270 L180,270 L180,300 L160,300 Q142,318 124,300 L105,300 Z" fill="#c8c8c8" stroke="#333"/>
  <!-- ram -->
  <rect x="134" y="354" width="16" height="56" fill="#c8c8c8" stroke="#333"/>
  <line x1="45" y1="400" x2="119" y2="400" stroke="#333"/>
  <text x="50" y="414" fill="#333">3.4 mm pitch</text>
  <text x="215" y="280" font-size="11" fill="#111">fixed punch, any width: it clears the</text>
  <text x="215" y="294" font-size="11" fill="#111">neighbours because they are lower</text>
  <text x="215" y="312" font-size="11" fill="#111">carrier k lifted 3.2-4.2 mm on a steel pilot</text>
  <text x="215" y="326" font-size="11" fill="#111">(open wings 2.4-3.45 mm tall); crimped from one end</text>
  <text x="215" y="344" font-size="11" fill="#111">anvil blade &lt;= 1.90 wide, front edge behind the</text>
  <text x="215" y="358" font-size="11" fill="#111">lance, top 0.1-0.2 above the pocket floor;</text>
  <text x="215" y="372" font-size="11" fill="#111">box face on a front stop that backs off at capture;</text>
  <text x="215" y="386" font-size="11" fill="#111">hard stop beside the anvil sets crimp height</text>
  <text x="215" y="404" font-size="11" fill="#111">fixed steel C, spine in front of the housing nest;</text>
  <text x="215" y="418" font-size="11" fill="#111">the slide steps the work through its throat</text>

  <!-- ============ Panel 2: top view pallet spread ============ -->
  <rect x="500" y="55" width="485" height="383" fill="none" stroke="#bbb"/>
  <text x="510" y="74" font-weight="bold" fill="#111">2. Top view: place a whole half-row, crimp, then spread</text>
  <line x1="520" y1="100" x2="740" y2="100" stroke="#111" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="750" y="104" fill="#555">web root holds order</text>
  <g stroke="#111" stroke-width="12">
    <line x1="570" y1="100" x2="570" y2="170"/>
    <line x1="604" y1="100" x2="604" y2="170"/>
    <line x1="638" y1="100" x2="638" y2="170"/>
  </g>
  <g stroke="#b87333" stroke-width="5">
    <line x1="570" y1="170" x2="570" y2="190"/>
    <line x1="604" y1="170" x2="604" y2="190"/>
    <line x1="638" y1="170" x2="638" y2="190"/>
  </g>
  <g fill="#e8d9a8" stroke="#8a6d1f" fill-opacity="0.85">
    <rect x="555" y="160" width="30" height="55"/>
    <rect x="589" y="160" width="30" height="55"/>
    <rect x="623" y="160" width="30" height="55"/>
  </g>
  <text x="664" y="150" fill="#111">presser comb lays all three</text>
  <text x="664" y="164" fill="#111">conductors in one motion</text>
  <text x="664" y="188" fill="#6b5310">pallet at 3.4 mm = 2 x ribbon</text>
  <text x="664" y="202" fill="#6b5310">pitch: every other conductor</text>
  <line x1="570" y1="228" x2="638" y2="228" stroke="#333"/>
  <text x="583" y="242" fill="#333">3.4 mm pitch</text>
  <line x1="604" y1="252" x2="604" y2="282" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="620" y="266" fill="#111">crimp each (1b); then, at a push station</text>
  <text x="620" y="280" fill="#111">clear of the press, a cam plate spreads them</text>
  <g stroke="#111" stroke-width="6" fill="none">
    <path d="M570,295 C570,320 554,320 554,345"/>
    <path d="M604,295 L604,345"/>
    <path d="M638,295 C638,320 654,320 654,345"/>
  </g>
  <g fill="#f3c969" stroke="#8a6d1f">
    <rect x="539" y="340" width="30" height="50"/>
    <rect x="589" y="340" width="30" height="50"/>
    <rect x="639" y="340" width="30" height="50"/>
  </g>
  <line x1="554" y1="402" x2="654" y2="402" stroke="#333"/>
  <text x="566" y="416" fill="#333">5.0 mm pitch</text>
  <text x="680" y="350" fill="#6b5310">pallet at 5.0 mm = 2 x housing</text>
  <text x="680" y="364" fill="#6b5310">pitch; crimped contacts are the</text>
  <text x="680" y="378" fill="#6b5310">handles. Largest move: J1's outer</text>
  <text x="680" y="392" fill="#6b5310">contact, 3.2 mm</text>

  <!-- ============ Panel 3: insertion ============ -->
  <rect x="15" y="448" width="970" height="320" fill="none" stroke="#bbb"/>
  <text x="25" y="468" font-weight="bold" fill="#111">3. Top view: two straight moves fill the housing (XHP-5 shown); or sort into one row (into-the-housing k8)</text>
  <!-- stage A -->
  <text x="40" y="494" fill="#111">move 1: the housing onto half-row A, cavities 1, 3, 5</text>
  <rect x="60" y="506" width="180" height="42" fill="#f4f4f4" stroke="#333"/>
  <g fill="#fff" stroke="#333">
    <rect x="80" y="514" width="16" height="26"/><rect x="105" y="514" width="16" height="26"/>
    <rect x="130" y="514" width="16" height="26"/><rect x="155" y="514" width="16" height="26"/>
    <rect x="180" y="514" width="16" height="26"/>
  </g>
  <text x="84" y="562" fill="#333">1</text><text x="109" y="562" fill="#333">2</text><text x="134" y="562" fill="#333">3</text><text x="159" y="562" fill="#333">4</text><text x="184" y="562" fill="#333">5</text>
  <text x="250" y="531" fill="#333">housing in its holder, rear face toward the pallet</text>
  <g fill="#f3e2b0" stroke="#8a6d1f"><rect x="74" y="580" width="28" height="44"/><rect x="124" y="580" width="28" height="44"/><rect x="174" y="580" width="28" height="44"/></g>
  <g fill="#b87333"><rect x="83" y="572" width="10" height="46"/><rect x="133" y="572" width="10" height="46"/><rect x="183" y="572" width="10" height="46"/></g>
  <g stroke="#111" stroke-width="8"><line x1="88" y1="618" x2="88" y2="720"/><line x1="138" y1="618" x2="138" y2="720"/><line x1="188" y1="618" x2="188" y2="720"/></g>
  <line x1="60" y1="640" x2="220" y2="640" stroke="#555" stroke-width="4"/>
  <text x="230" y="600" fill="#6b5310">pockets at 5.0 mm, open at the front</text>
  <text x="230" y="644" fill="#555">backing comb behind the insulation barrels holds the row</text>
  <line x1="45" y1="690" x2="45" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="40" y="736" font-size="11" fill="#111">each pocket faces its cavity: no fan-in, no neighbour at 2.5 mm</text>
  <text x="40" y="749" font-size="11" fill="#111">both rows crimped first; move 1: the housing slides 7 mm onto row A,</text>
  <text x="40" y="762" font-size="11" fill="#111">so row A stores nothing; pallet A drops away</text>

  <!-- stage B -->
  <text x="530" y="486" font-size="11" fill="#111">push 2: housing shifts 2.5 mm; row B pushed 7 mm into 2, 4,</text>
  <text x="530" y="500" font-size="11" fill="#111">straightening the bow it took when pallet B parked</text>
  <rect x="550" y="506" width="180" height="42" fill="#f4f4f4" stroke="#333"/>
  <g stroke="#333">
    <rect x="570" y="514" width="16" height="26" fill="#b87333"/><rect x="595" y="514" width="16" height="26" fill="#fff"/>
    <rect x="620" y="514" width="16" height="26" fill="#b87333"/><rect x="645" y="514" width="16" height="26" fill="#fff"/>
    <rect x="670" y="514" width="16" height="26" fill="#b87333"/>
  </g>
  <text x="599" y="562" fill="#333">2</text><text x="649" y="562" fill="#333">4</text>
  <g stroke="#111" stroke-width="8" fill="none"><path d="M578,548 C578,600 560,610 560,720"/><path d="M628,548 L628,720"/><path d="M678,548 C678,600 696,610 696,720"/></g>
  <g fill="#f3e2b0" stroke="#8a6d1f"><rect x="589" y="580" width="28" height="44"/><rect x="639" y="580" width="28" height="44"/></g>
  <g fill="#b87333"><rect x="598" y="572" width="10" height="46"/><rect x="648" y="572" width="10" height="46"/></g>
  <g stroke="#555" stroke-width="8"><line x1="603" y1="618" x2="603" y2="700"/><line x1="653" y1="618" x2="653" y2="700"/></g>
  <line x1="745" y1="680" x2="745" y2="612" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="760" y="640" fill="#111">row-A wires lie in the gaps</text>
  <text x="760" y="654" fill="#111">between pallet B's carriers:</text>
  <text x="760" y="668" fill="#111">1.9 mm gap, 1.7 mm wire</text>
  <text x="530" y="740" fill="#111">J2: pallet A's middle pocket is empty, so cavity 3 stays empty by construction.</text>
  <text x="530" y="756" fill="#111">Test: push the housing onto a real XH wafer read by a microcontroller.</text>
</svg>
