<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-labelledby="t d">
<title id="t">f5b half-row cassette, schematic</title>
<desc id="d">Top view of the lower shoe: loose contacts in five keyed pockets at 5.0 mm; plane A of a split ribbon captured by a grooved fan block from the root and stripped after the spread; each anvil insulated for an identity check. Below: crimp A, park it, crimp B, merge both at 2.5 mm, move the housing onto the whole row.</desc>
<style>
.bg{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0b0b0b;font-size:12px}
.t2{fill:#52514e;font-size:11px}.h{font-size:15px;font-weight:600}.sm{font-size:10px;fill:#52514e}
.steel{fill:#c9c8c2;stroke:#52514e;stroke-width:1.2}
.dark{fill:#8f8e88;stroke:#3d3c39;stroke-width:1.2}
.bought{fill:#dcdad2;stroke:#52514e;stroke-width:1.2;stroke-dasharray:4 2}
.print{fill:#cde2fb;stroke:#2a78d6;stroke-width:1.2}
.contact{fill:#eda100;stroke:#7a5300;stroke-width:1}
.wire{stroke:#eb6834;stroke-width:4;fill:none;stroke-linecap:round}
.wirefill{fill:#eb6834;stroke:#8c3a17;stroke-width:1}
.strand{stroke:#8c3a17;stroke-width:1;fill:none}
.force{stroke:#e34948;stroke-width:2.5;fill:none}
.forcefill{fill:#e34948}
.move{stroke:#2a78d6;stroke-width:1.8;fill:none;stroke-dasharray:5 3}
.movefill{fill:#2a78d6}
.ln{stroke:#52514e;stroke-width:1.2;fill:none}
.thin{stroke:#8a8984;stroke-width:1;fill:none;stroke-dasharray:3 3}
.box{fill:none;stroke:#8a8984;stroke-width:1}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19} text{fill:#ffffff} .t2,.sm{fill:#c3c2b7}
.steel{fill:#4a4a47;stroke:#c3c2b7}.dark{fill:#6b6a66;stroke:#d8d7d0}
.bought{fill:#33332f;stroke:#c3c2b7}.print{fill:#1c3a5e;stroke:#3987e5}
.contact{fill:#c98500;stroke:#f3c56a}.wire{stroke:#d95926}.wirefill{fill:#d95926;stroke:#f0a07e}
.strand{stroke:#f0a07e}.force{stroke:#e66767}.forcefill{fill:#e66767}
.move{stroke:#3987e5}.movefill{fill:#3987e5}.ln{stroke:#c3c2b7}.thin{stroke:#8a8984}.box{stroke:#6b6a66}}
</style>
<defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="forcefill" d="M0,0 L10,5 L0,10 z"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="movefill" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="640"/>
<text class="h" x="20" y="28" text-anchor="start">f5b  Half-row cassette: crimp every other cavity at 5.0 mm, merge at 2.5 mm, insert once</text>
<text class="t2" x="20" y="46" text-anchor="start">schematic, not to scale</text>
<rect class="box" x="20" y="60" width="560" height="330" rx="0"/>
<text class="t2" x="30" y="78" text-anchor="start">Lower shoe, top view, loading plane A</text>
<rect class="print" x="40" y="190" width="70" height="90" rx="3"/>
<text class="sm" x="40" y="296" text-anchor="start">ribbon pallet on balls;</text>
<text class="sm" x="40" y="308" text-anchor="start">clamp face = split root</text>
<polyline class="wire" points="110,214 170,214 300,200 340,200"/>
<polyline class="wire" points="110,248 170,248 300,250 340,250"/>
<polygon class="print" points="170,200 300,170 300,330 170,290"/>
<text class="sm" x="40" y="340" text-anchor="start">grooved fan block: grooves start at</text>
<text class="sm" x="40" y="352" text-anchor="start">3.4 mm at the root, open to 5.0;</text>
<text class="sm" x="40" y="364" text-anchor="start">strip after the spread, at its face</text>
<rect class="steel" x="340" y="130" width="150" height="240" rx="0"/>
<rect class="dark" x="348" y="144" width="34" height="12" rx="0"/>
<rect class="bg" x="382" y="143" width="60" height="14" rx="0"/>
<line class="thin" x1="365" y1="156" x2="365" y2="166"/>
<rect class="dark" x="348" y="194" width="34" height="12" rx="0"/>
<rect class="bg" x="382" y="193" width="60" height="14" rx="0"/>
<rect class="contact" x="390" y="194" width="48" height="12" rx="0"/>
<line class="thin" x1="365" y1="206" x2="365" y2="216"/>
<rect class="dark" x="348" y="244" width="34" height="12" rx="0"/>
<rect class="bg" x="382" y="243" width="60" height="14" rx="0"/>
<rect class="contact" x="390" y="244" width="48" height="12" rx="0"/>
<line class="thin" x1="365" y1="256" x2="365" y2="266"/>
<rect class="dark" x="348" y="294" width="34" height="12" rx="0"/>
<rect class="bg" x="382" y="293" width="60" height="14" rx="0"/>
<line class="thin" x1="365" y1="306" x2="365" y2="316"/>
<rect class="dark" x="348" y="344" width="34" height="12" rx="0"/>
<rect class="bg" x="382" y="343" width="60" height="14" rx="0"/>
<line class="thin" x1="365" y1="356" x2="365" y2="366"/>
<text class="sm" x="340" y="122" text-anchor="start">anvils (insulated, wired: identity)</text>
<text class="sm" x="384" y="386" text-anchor="start">keyed pockets, open on top</text>
<text class="t2" x="600" y="76" text-anchor="start">Section across the stations</text>
<rect class="box" x="600" y="86" width="260" height="304" rx="0"/>
<rect class="steel" x="620" y="110" width="220" height="40" rx="0"/>
<text class="sm" x="626" y="104" text-anchor="start">upper shoe</text>
<rect class="dark" x="630" y="150" width="200" height="30" rx="0"/>
<text class="sm" x="634" y="170" text-anchor="start">one EDM crimper plate, 5 profiles</text>
<rect class="bg" x="640" y="176" width="14" height="8" rx="0"/>
<rect class="bg" x="680" y="176" width="14" height="8" rx="0"/>
<rect class="bg" x="720" y="176" width="14" height="8" rx="0"/>
<rect class="bg" x="760" y="176" width="14" height="8" rx="0"/>
<rect class="bg" x="800" y="176" width="14" height="8" rx="0"/>
<rect class="steel" x="620" y="260" width="220" height="50" rx="0"/>
<text class="sm" x="626" y="330" text-anchor="start">lower shoe, anvil block</text>
<rect class="steel" x="622" y="190" width="16" height="70" rx="0"/>
<rect class="steel" x="822" y="190" width="16" height="70" rx="0"/>
<text class="sm" x="640" y="250" text-anchor="start">stop blocks set height</text>
<line class="force" x1="730" y1="92" x2="730" y2="108" marker-end="url(#af)"/>
<text class="sm" x="610" y="350" text-anchor="start">webs between channels:</text>
<text class="sm" x="610" y="362" text-anchor="start">5.0 - 2.0 = 3.0 mm</text>
<text class="sm" x="610" y="374" text-anchor="start">(separate crimpers: 0.6-1.5)</text>
<text class="t2" x="30" y="416" text-anchor="start">Sequence (end view of the contacts, one ribbon end)</text>
<text class="sm" x="40" y="440" text-anchor="start">1 crimp plane A</text>
<rect class="contact" x="40" y="460" width="18" height="22" rx="0"/>
<rect class="contact" x="80" y="460" width="18" height="22" rx="0"/>
<rect class="contact" x="120" y="460" width="18" height="22" rx="0"/>
<rect class="steel" x="34" y="484" width="120" height="8" rx="0"/>
<text class="sm" x="204" y="440" text-anchor="start">2 lift A out, park it</text>
<path class="wire" d="M 204 480 Q 264 440 314 480"/>
<text class="sm" x="204" y="500" text-anchor="start">folded back at the root</text>
<text class="sm" x="368" y="440" text-anchor="start">3 reload, crimp plane B</text>
<rect class="contact" x="368" y="460" width="18" height="22" rx="0"/>
<rect class="contact" x="408" y="460" width="18" height="22" rx="0"/>
<rect class="contact" x="448" y="460" width="18" height="22" rx="0"/>
<rect class="steel" x="362" y="484" width="120" height="8" rx="0"/>
<text class="sm" x="532" y="440" text-anchor="start">4 merge at 2.5 mm</text>
<rect class="contact" x="532" y="460" width="16" height="22" rx="0"/>
<rect class="contact" x="554" y="460" width="16" height="22" rx="0"/>
<rect class="contact" x="576" y="460" width="16" height="22" rx="0"/>
<rect class="contact" x="598" y="460" width="16" height="22" rx="0"/>
<rect class="contact" x="620" y="460" width="16" height="22" rx="0"/>
<rect class="print" x="526" y="484" width="120" height="8" rx="0"/>
<text class="sm" x="532" y="506" text-anchor="start">printed 2.5 mm comb</text>
<text class="sm" x="696" y="440" text-anchor="start">5 move the housing on</text>
<rect class="print" x="688" y="454" width="124" height="34" rx="3"/>
<rect class="contact" x="696" y="460" width="16" height="22" rx="0"/>
<rect class="contact" x="718" y="460" width="16" height="22" rx="0"/>
<rect class="contact" x="740" y="460" width="16" height="22" rx="0"/>
<rect class="contact" x="762" y="460" width="16" height="22" rx="0"/>
<rect class="contact" x="784" y="460" width="16" height="22" rx="0"/>
<text class="sm" x="688" y="502" text-anchor="start">housing slides on along</text>
<text class="sm" x="688" y="514" text-anchor="start">the wire; one D for all</text>
<text class="t2" x="30" y="530" text-anchor="start">Why not push each half-row in turn: every conductor has the same length from the web, so a second push needs 6-9 mm of stored feed.</text>
<text class="t2" x="30" y="546" text-anchor="start">Rows per unit: T4 2+2 (x5), J1 5+4, J2 2+3, J4 4+3, J6 3+2, J7 4+3 -> 20 strokes; row of 2 1.6-4.9 kN, row of 3 2.3-7.3 kN (1 t arbor press).</text>
<rect class="steel" x="30" y="580" width="14" height="12" rx="0"/>
<text class="sm" x="50" y="590" text-anchor="start">steel (force path, dies)</text>
<rect class="print" x="205" y="580" width="14" height="12" rx="0"/>
<text class="sm" x="225" y="590" text-anchor="start">printed</text>
<rect class="bought" x="380" y="580" width="14" height="12" rx="0"/>
<text class="sm" x="400" y="590" text-anchor="start">bought motion / sensing</text>
<rect class="contact" x="555" y="580" width="14" height="12" rx="0"/>
<text class="sm" x="575" y="590" text-anchor="start">XH contact</text>
<line class="wire" x1="730" y1="586" x2="752" y2="586"/>
<text class="sm" x="758" y="590" text-anchor="start">conductor</text>
<text class="t2" x="30" y="620" text-anchor="start">f5 (cassette, stops, any press) x change-the-question c1 (planes) x ribbon-as-pallet K4 / into-the-housing i3 (merge, one housing move).</text>
</svg>