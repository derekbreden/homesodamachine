<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">f10 / FP1 (procedure-is-the-machine p1c/p6 x force-and-form f4/f3/f7/f8): lift once, crimp upright, fin from below</text>
  <text x="20" y="48" fill="#a33">SCHEMATIC. Proportions follow the cited dimensions roughly; nothing here is a drawing.</text>

  <!-- ===================== END VIEW (looking along the wire, -Y) ===================== -->
  <text x="20" y="80" font-weight="bold">End view at the barrels (20 px/mm). Row at 2.5 mm pitch; only k is lifted, h = 3.5 mm</text>
  <g transform="translate(300,400)">
    <!-- row axis -->
    <line x1="-250" y1="0" x2="250" y2="0" stroke="#999" stroke-dasharray="4 4"/>
    <text x="165" y="-6" fill="#666">row axis</text>
    <!-- neighbours k-2..k+2 (uncrimped or crimped), at row height -->
    <circle cx="-100" cy="0" r="17" fill="#222"/>
    <circle cx="-50" cy="0" r="17" fill="#222"/>
    <circle cx="50" cy="0" r="17" fill="#222"/>
    <circle cx="100" cy="0" r="17" fill="#222"/>
    <text x="-112" y="36">k-2</text><text x="-64" y="-24">k-1</text><text x="38" y="-24">k+1</text><text x="90" y="36">k+2</text>
    <!-- tip comb pins (behind, at the jacket): music wire 0.635 -->
    <g stroke="#6a6" stroke-width="3" stroke-dasharray="5 3">
      <line x1="-75" y1="40" x2="-75" y2="-20"/>
      <line x1="-25" y1="40" x2="-25" y2="-20"/>
      <line x1="25" y1="40" x2="25" y2="-20"/>
      <line x1="75" y1="40" x2="75" y2="-20"/>
    </g>
    <text x="-245" y="148" fill="#383">dashed green: tip comb pins (0.635 mm music wire) a few mm behind the barrels; k's slot is empty</text>
    <!-- lifted conductor k, jacket r 0.85 at z = 3.5 mm -> -70 px -->
    <circle cx="0" cy="-70" r="17" fill="#222"/>
    <text x="24" y="-66">k, lifted 3.5 mm</text>
    <!-- open contact on k: floor underside at z = 3.5-1.05 = 2.45 -> -49 ; wings up to 5.65 -> -113 -->
    <path d="M -18 -49 L 18 -49 L 28 -113 L 24 -113 L 14 -53 L -14 -53 L -24 -113 L -28 -113 Z" fill="#c88a2c"/>
    <text x="34" y="-100" fill="#8a5a10">open contact on its post (insulation wings 2.5-3.0 wide)</text>
    <!-- fin anvil: 1.45 wide at the conductor step -> 29 px, top at floor -49; narrow band down to -1.4 mm (28 px) then foot -->
    <rect x="-14.5" y="-49" width="29" height="77" fill="#4a6fa5"/>
    <rect x="-60" y="28" width="120" height="40" fill="#4a6fa5"/>
    <rect x="-60" y="68" width="120" height="16" fill="#8fb0d8"/>
    <text x="68" y="52" fill="#234">fin foot in the C's lower arm</text>
    <text x="68" y="80" fill="#234">ground gate block slid under the foot (height = its thickness)</text>
    <text x="-245" y="112" fill="#234">fin, 1.45 mm at the conductor step (1.88 at the insulation step), rises 4.3 mm through k's slot:</text>
    <text x="-245" y="128" fill="#234">0.9 mm a side to an uncrimped jacket, 0.78 mm to a crimped insulation barrel</text>
    <!-- crimper above, open -->
    <path d="M -40 -250 L 40 -250 L 40 -140 L 15 -140 L 15 -165 L -15 -165 L -15 -140 L -40 -140 Z" fill="#777"/>
    <text x="48" y="-190">crimper (knife set, EDM or ground stock; &#8804; ~4 mm wide),</text>
    <text x="48" y="-174">shown open; at bottom its legs reach ~0.3-0.5 mm below k's floor,</text>
    <text x="48" y="-158">still 0.4-0.9 mm above every neighbour</text>
    <!-- dims -->
    <line x1="-150" y1="0" x2="-150" y2="-70" stroke="#a33"/>
    <line x1="-156" y1="0" x2="-144" y2="0" stroke="#a33"/>
    <line x1="-156" y1="-70" x2="-144" y2="-70" stroke="#a33"/>
    <text x="-215" y="-32" fill="#a33">h 3.5</text>
    <!-- posted contacts for k+-2, same tier -->
    <path d="M -118 -49 L -82 -49 L -72 -113 L -128 -113 Z" fill="none" stroke="#c88a2c" stroke-dasharray="4 3"/>
    <path d="M 82 -49 L 118 -49 L 128 -113 L 72 -113 Z" fill="none" stroke="#c88a2c" stroke-dasharray="4 3"/>
    <text x="-245" y="-120" fill="#8a5a10">posted contacts for k&#177;2 (dashed) ride over their own unlifted conductors</text>
  </g>

  <!-- ===================== SIDE VIEW (Y horizontal) ===================== -->
  <text x="620" y="80" font-weight="bold">Side view (8 px/mm); wire axis Y runs left (cassette) to right</text>
  <g transform="translate(880,380)">
    <!-- row plane (neighbours) -->
    <line x1="-270" y1="0" x2="0" y2="0" stroke="#222" stroke-width="10" opacity="0.25"/>
    <text x="-270" y="22" fill="#555">neighbours stay in the row</text>
    <!-- comb root at Y=-30 -->
    <rect x="-274" y="-14" width="10" height="28" fill="#6a6"/>
    <text x="-282" y="-22" fill="#383">comb</text>
    <!-- conductor k rising over lift finger at Y=-10 to z=3.5 (28 px) -->
    <path d="M -270 0 C -180 0, -140 -28, -80 -28 L -19 -28" stroke="#222" stroke-width="13" fill="none"/>
    <!-- bare strands last 2.4 mm -->
    <line x1="-19" y1="-28" x2="0" y2="-28" stroke="#c96" stroke-width="6"/>
    <!-- lift finger -->
    <rect x="-86" y="-21" width="10" height="60" fill="#999"/>
    <text x="-130" y="54" fill="#555">lift finger (servo)</text>
    <!-- tip comb pins at Y=-5 -->
    <line x1="-45" y1="14" x2="-45" y2="-8" stroke="#6a6" stroke-width="3"/>
    <text x="-60" y="30" fill="#383" font-size="11">tip comb</text>
    <!-- contact: insulation barrel Y -2.6..-1.4, cond barrel -0.9..+0.5, box +1.2..+3.2 (8px/mm) -->
    <rect x="-21" y="-38" width="10" height="24" fill="#c88a2c"/>
    <rect x="-7" y="-36" width="11" height="16" fill="#c88a2c"/>
    <rect x="10" y="-47" width="16" height="19" fill="#c88a2c"/>
    <polygon points="8,-28 10,-28 14,-22" fill="#c88a2c"/>
    <!-- post from box front to post bar at Y=+14 -->
    <line x1="26" y1="-37" x2="112" y2="-37" stroke="#555" stroke-width="3"/>
    <rect x="112" y="-52" width="14" height="40" fill="#bbb"/>
    <text x="60" y="-60" fill="#555">post bar, Y slide</text>
    <!-- fin under barrels -->
    <rect x="-22" y="-12" width="28" height="60" fill="#4a6fa5"/>
    <text x="-8" y="70" fill="#234" font-size="11">fin (stops behind the lance)</text>
    <!-- crimper above barrels -->
    <rect x="-24" y="-90" width="30" height="36" fill="#777"/>
    <!-- knee -->
    <line x1="-9" y1="-90" x2="10" y2="-130" stroke="#333" stroke-width="5"/>
    <line x1="10" y1="-130" x2="-9" y2="-170" stroke="#333" stroke-width="5"/>
    <circle cx="10" cy="-130" r="5" fill="#333"/>
    <line x1="10" y1="-130" x2="120" y2="-130" stroke="#a33" stroke-width="3"/>
    <text x="40" y="-138" fill="#a33">NEMA 17 Tr8x2 pushes the knee, 60-160 N</text>
    <!-- C frame -->
    <path d="M -60 -200 L 200 -200 L 200 120 L -60 120 L -60 70 L 170 70 L 170 -170 L -60 -170 Z" fill="#555" opacity="0.35"/>
    <text x="210" y="-40" fill="#333">steel C</text><text x="210" y="-24" fill="#333">spine,</text><text x="210" y="-8" fill="#333">ahead of</text><text x="210" y="8" fill="#333">the tips</text>
    <text x="-58" y="104" fill="#333">lower arm, below the row: gate block, load cell</text>
    <text x="-58" y="-180" fill="#333">upper arm: knee, guide pins, 0.001 mm indicator</text>
    <!-- camera looks along X -->
    <circle cx="-40" cy="-28" r="7" fill="none" stroke="#06c" stroke-width="2"/>
    <text x="-250" y="-96" fill="#06c">camera looks along X at k alone;</text>
    <text x="-250" y="-82" fill="#06c">light pad on the far side (circle)</text>
  </g>

  <text x="20" y="600">Per key: index X, lift k 3.5 mm, trim (grounded blade reads identity), strip in pose, side silhouette, post bar slides the open contact onto k,</text>
  <text x="20" y="618">fin rises and gate closes, knee to straight, re-touch height, fin drops, post withdraws, hook pulls 20 N on the box, k lowered and squared. Force stays in the steel C.</text>
</svg>
