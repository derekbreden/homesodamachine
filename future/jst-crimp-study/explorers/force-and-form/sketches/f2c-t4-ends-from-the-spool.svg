<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="t d">
<title id="t">f2c T4 ends from the spool, schematic</title>
<desc id="d">A 4P spool on a slip ring feeds a web clamp on the carriage; two blades strip the whole end; the applicator in the slow crank press crimps one conductor per turn; the carriage places each crimped contact into one hinged pallet at 2.5 mm in cavity order; one push inserts all four; a wafer tests; a puller and guillotine free the end into a bin and square the next.</desc>
<style>
.bg{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0b0b0b;font-size:12px}
.t2{fill:#52514e;font-size:11px}.h{font-size:15px;font-weight:600}.sm{font-size:10px;fill:#52514e}
.steel{fill:#c9c8c2;stroke:#52514e;stroke-width:1.2}
.dark{fill:#8f8e88;stroke:#3d3c39;stroke-width:1.2}
.bought{fill:#dcdad2;stroke:#52514e;stroke-width:1.2;stroke-dasharray:4 2}
.print{fill:#cde2fb;stroke:#2a78d6;stroke-width:1.2}
.contact{fill:#eda100;stroke:#7a5300;stroke-width:1}
.wire{stroke:#eb6834;stroke-width:4;fill:none;stroke-linecap:round}
.wirefill{fill:#eb6834;stroke:#8c3a17;stroke-width:1}
.strand{stroke:#8c3a17;stroke-width:1;fill:none}
.force{stroke:#e34948;stroke-width:2.5;fill:none}
.forcefill{fill:#e34948}
.move{stroke:#2a78d6;stroke-width:1.8;fill:none;stroke-dasharray:5 3}
.movefill{fill:#2a78d6}
.ln{stroke:#52514e;stroke-width:1.2;fill:none}
.thin{stroke:#8a8984;stroke-width:1;fill:none;stroke-dasharray:3 3}
.box{fill:none;stroke:#8a8984;stroke-width:1}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19} text{fill:#ffffff} .t2,.sm{fill:#c3c2b7}
.steel{fill:#4a4a47;stroke:#c3c2b7}.dark{fill:#6b6a66;stroke:#d8d7d0}
.bought{fill:#33332f;stroke:#c3c2b7}.print{fill:#1c3a5e;stroke:#3987e5}
.contact{fill:#c98500;stroke:#f3c56a}.wire{stroke:#d95926}.wirefill{fill:#d95926;stroke:#f0a07e}
.strand{stroke:#f0a07e}.force{stroke:#e66767}.forcefill{fill:#e66767}
.move{stroke:#3987e5}.movefill{fill:#3987e5}.ln{stroke:#c3c2b7}.thin{stroke:#8a8984}.box{stroke:#6b6a66}}
</style>
<defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="forcefill" d="M0,0 L10,5 L0,10 z"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="movefill" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="560"/>
<text class="h" x="20" y="28" text-anchor="start">f2c  The applicator station makes whole T4 ends from the spool</text>
<text class="t2" x="20" y="46" text-anchor="start">schematic plan view, not to scale</text>
<circle class="print" cx="80" cy="200" r="50"/>
<circle class="bought" cx="80" cy="200" r="12"/>
<text class="sm" x="40" y="272" text-anchor="start">4P spool, inner end</text>
<text class="sm" x="40" y="284" text-anchor="start">on a slip ring (p6)</text>
<polyline class="wire" points="130,200 200,200"/>
<rect class="bought" x="200" y="186" width="40" height="28" rx="3"/>
<text class="sm" x="196" y="180" text-anchor="start">puller</text>
<polyline class="wire" points="240,200 300,200"/>
<rect class="steel" x="300" y="180" width="14" height="40" rx="0"/>
<text class="sm" x="284" y="174" text-anchor="start">guillotine</text>
<polyline class="wire" points="314,200 380,200"/>
<rect class="bought" x="380" y="170" width="120" height="60" rx="4"/>
<text class="sm" x="384" y="164" text-anchor="start">carriage: web clamp</text>
<line class="wire" x1="500" y1="188" x2="560" y2="173.6"/>
<line class="wire" x1="500" y1="196" x2="560" y2="191.2"/>
<line class="wire" x1="500" y1="204" x2="560" y2="208.8"/>
<line class="wire" x1="500" y1="212" x2="560" y2="226.4"/>
<rect class="print" x="510" y="250" width="70" height="20" rx="2"/>
<rect class="contact" x="514" y="253" width="10" height="14" rx="0"/>
<rect class="contact" x="530" y="253" width="10" height="14" rx="0"/>
<rect class="contact" x="546" y="253" width="10" height="14" rx="0"/>
<rect class="contact" x="562" y="253" width="10" height="14" rx="0"/>
<text class="sm" x="470" y="290" text-anchor="start">one pallet at 2.5 mm, on the carriage,</text>
<text class="sm" x="470" y="302" text-anchor="start">hinged to swing clear; filled in cavity order</text>
<rect class="print" x="590" y="244" width="40" height="32" rx="2"/>
<text class="sm" x="588" y="238" text-anchor="start">XHP-4 nest</text>
<line class="move" x1="584" y1="260" x2="596" y2="260" marker-end="url(#am)"/>
<rect class="steel" x="560" y="150" width="10" height="30" rx="0"/>
<rect class="steel" x="560" y="220" width="10" height="30" rx="0"/>
<text class="sm" x="520" y="130" text-anchor="start">p7: two blades strip the</text>
<text class="sm" x="520" y="142" text-anchor="start">whole webbed end at once</text>
<rect class="steel" x="680" y="110" width="170" height="150" rx="0"/>
<rect class="dark" x="700" y="130" width="130" height="80" rx="0"/>
<text class="sm" x="706" y="150" text-anchor="start">OTP applicator</text>
<text class="sm" x="706" y="166" text-anchor="start">(grounded: identity</text>
<text class="sm" x="706" y="180" text-anchor="start">before each stroke)</text>
<circle class="bought" cx="765" cy="236" r="12"/>
<text class="sm" x="690" y="280" text-anchor="start">slow crank press (f2):</text>
<text class="sm" x="690" y="292" text-anchor="start">NEMA 23 + 30:1 worm</text>
<rect class="contact" x="640" y="60" width="180" height="30" rx="0"/>
<text class="sm" x="644" y="80" text-anchor="start">strip reel feeds the applicator</text>
<line class="move" x1="600" y1="200" x2="676" y2="200" marker-end="url(#am)"/>
<text class="sm" x="596" y="188" text-anchor="start">fork presents one</text>
<text class="t2" x="30" y="340" text-anchor="start">Per end: feed; strip the whole end; split to the clamp face; for each conductor: present at its measured depth, one crank turn</text>
<text class="t2" x="30" y="356" text-anchor="start">(crimp, tab cut, next contact fed), lift, set into its pocket in cavity order; then one push inserts all four with the web following:</text>
<text class="t2" x="30" y="372" text-anchor="start">every contact latches at the same distance from the web, so no conductor needs stored feed; wafer test; puller draws</text>
<text class="t2" x="30" y="388" text-anchor="start">400 or 700 mm; the guillotine frees the end into the bin and squares the next. ~4-5 min per end; a 15.2 m spool is 21-38 ends.</text>
<rect class="steel" x="30" y="430" width="14" height="12" rx="0"/>
<text class="sm" x="50" y="440" text-anchor="start">steel (force path, dies)</text>
<rect class="print" x="205" y="430" width="14" height="12" rx="0"/>
<text class="sm" x="225" y="440" text-anchor="start">printed</text>
<rect class="bought" x="380" y="430" width="14" height="12" rx="0"/>
<text class="sm" x="400" y="440" text-anchor="start">bought motion / sensing</text>
<rect class="contact" x="555" y="430" width="14" height="12" rx="0"/>
<text class="sm" x="575" y="440" text-anchor="start">XH contact</text>
<line class="wire" x1="730" y1="436" x2="752" y2="436"/>
<text class="sm" x="758" y="440" text-anchor="start">conductor</text>
<text class="t2" x="30" y="474" text-anchor="start">f2 (applicator in a slow crank press) x change-the-question c1 (pallet, push, wafer test) and c5 (ends as stock, cut last)</text>
<text class="t2" x="30" y="489" text-anchor="start">x procedure-is-the-machine p7 (whole-end strip) and p6 (reel as the far end, puller). Hands back: threading a spool,</text>
<text class="t2" x="30" y="504" text-anchor="start">housings, a contact reel, emptying the bin; at unit build, cutting stock ends to length and the far end.</text>
</svg>