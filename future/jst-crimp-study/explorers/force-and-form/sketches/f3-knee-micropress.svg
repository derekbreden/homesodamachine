<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-labelledby="t d">
<title id="t">f3 knee micro-press, schematic</title>
<desc id="d">A palm-sized steel die set on two guide pins, closed by a toggle whose straight position is bottom of stroke; a flush pilot pin locates the strip from below; the carriage threads the conductor to a camera-set depth; a neck blade reacts the proof pull after the crimp.</desc>
<style>
.bg{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0b0b0b;font-size:12px}
.t2{fill:#52514e;font-size:11px}.h{font-size:15px;font-weight:600}.sm{font-size:10px;fill:#52514e}
.steel{fill:#c9c8c2;stroke:#52514e;stroke-width:1.2}
.dark{fill:#8f8e88;stroke:#3d3c39;stroke-width:1.2}
.bought{fill:#dcdad2;stroke:#52514e;stroke-width:1.2;stroke-dasharray:4 2}
.print{fill:#cde2fb;stroke:#2a78d6;stroke-width:1.2}
.contact{fill:#eda100;stroke:#7a5300;stroke-width:1}
.wire{stroke:#eb6834;stroke-width:4;fill:none;stroke-linecap:round}
.wirefill{fill:#eb6834;stroke:#8c3a17;stroke-width:1}
.strand{stroke:#8c3a17;stroke-width:1;fill:none}
.force{stroke:#e34948;stroke-width:2.5;fill:none}
.forcefill{fill:#e34948}
.move{stroke:#2a78d6;stroke-width:1.8;fill:none;stroke-dasharray:5 3}
.movefill{fill:#2a78d6}
.ln{stroke:#52514e;stroke-width:1.2;fill:none}
.thin{stroke:#8a8984;stroke-width:1;fill:none;stroke-dasharray:3 3}
.box{fill:none;stroke:#8a8984;stroke-width:1}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19} text{fill:#ffffff} .t2,.sm{fill:#c3c2b7}
.steel{fill:#4a4a47;stroke:#c3c2b7}.dark{fill:#6b6a66;stroke:#d8d7d0}
.bought{fill:#33332f;stroke:#c3c2b7}.print{fill:#1c3a5e;stroke:#3987e5}
.contact{fill:#c98500;stroke:#f3c56a}.wire{stroke:#d95926}.wirefill{fill:#d95926;stroke:#f0a07e}
.strand{stroke:#f0a07e}.force{stroke:#e66767}.forcefill{fill:#e66767}
.move{stroke:#3987e5}.movefill{fill:#3987e5}.ln{stroke:#c3c2b7}.thin{stroke:#8a8984}.box{stroke:#6b6a66}}
</style>
<defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="forcefill" d="M0,0 L10,5 L0,10 z"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="movefill" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="600"/>
<text class="h" x="20" y="28" text-anchor="start">f3  Knee micro-press: the die is the locator, the gauge is the micrometer</text>
<text class="t2" x="20" y="46" text-anchor="start">schematic, not to scale; side view, wire axis left-right</text>
<rect class="steel" x="106" y="80" width="298" height="26" rx="0"/>
<text class="sm" x="410" y="97" text-anchor="start">bridge</text>
<rect class="steel" x="120" y="106" width="12" height="222" rx="0"/>
<rect class="steel" x="378" y="106" width="12" height="222" rx="0"/>
<rect class="steel" x="106" y="176" width="298" height="28" rx="0"/>
<text class="sm" x="410" y="188" text-anchor="start">punch holder on guide</text>
<text class="sm" x="410" y="200" text-anchor="start">pins and bushings</text>
<line class="ln" x1="250" y1="106" x2="268" y2="141"/>
<line class="ln" x1="252" y1="106" x2="270" y2="141"/>
<line class="ln" x1="268" y1="141" x2="250" y2="176"/>
<line class="ln" x1="270" y1="141" x2="252" y2="176"/>
<circle class="dark" cx="250" cy="106" r="5"/>
<circle class="dark" cx="268" cy="141" r="5"/>
<circle class="dark" cx="250" cy="176" r="5"/>
<text class="sm" x="150" y="136" text-anchor="start">knee (toggle)</text>
<text class="sm" x="150" y="148" text-anchor="start">straight = bottom</text>
<rect class="bought" x="448" y="124" width="56" height="34" rx="3"/>
<text class="sm" x="448" y="118" text-anchor="start">NEMA 17 Tr8x2 (or servo, or a hand lever)</text>
<line class="ln" x1="448" y1="141" x2="272" y2="141"/>
<line class="force" x1="360" y1="148" x2="292" y2="148" marker-end="url(#af)"/>
<text class="sm" x="300" y="166" text-anchor="start">60-160 N</text>
<rect class="steel" x="236" y="204" width="28" height="32" rx="0"/>
<text class="sm" x="186" y="224" text-anchor="start">crimpers</text>
<rect class="steel" x="236" y="276" width="28" height="24" rx="0"/>
<text class="sm" x="196" y="294" text-anchor="start">anvil</text>
<polygon class="steel" points="236,300 300,300 300,308 236,314"/>
<text class="sm" x="306" y="306" text-anchor="start">wedge = crimp-height dial</text>
<rect class="bought" x="230" y="314" width="46" height="12" rx="2"/>
<text class="sm" x="306" y="324" text-anchor="start">load cell under the anvil</text>
<rect class="contact" x="204" y="258" width="20" height="18" rx="0"/>
<rect class="contact" x="236" y="266" width="40" height="10" rx="0"/>
<rect class="dark" x="226" y="236" width="5" height="26" rx="0"/>
<text class="sm" x="20" y="214" text-anchor="start">neck blade: drops</text>
<text class="sm" x="20" y="225" text-anchor="start">after the crimp</text>
<polyline class="thin" points="112,222 224,248"/>
<rect class="bought" x="150" y="236" width="16" height="90" rx="2"/>
<line class="ln" x1="158" y1="236" x2="158" y2="204"/>
<text class="sm" x="26" y="300" text-anchor="start">0.001 mm</text>
<text class="sm" x="26" y="312" text-anchor="start">indicator</text>
<text class="sm" x="26" y="324" text-anchor="start">across the</text>
<text class="sm" x="26" y="336" text-anchor="start">dies</text>
<rect class="steel" x="90" y="326" width="330" height="46" rx="0"/>
<rect class="contact" x="276" y="276" width="40" height="4" rx="0"/>
<rect class="steel" x="300" y="280" width="6" height="30" rx="0"/>
<text class="sm" x="440" y="352" text-anchor="start">flush pilot pin rises from below</text>
<text class="sm" x="440" y="363" text-anchor="start">into the lead contact's pilot hole</text>
<polyline class="thin" points="438,350 306,304"/>
<text class="sm" x="90" y="390" text-anchor="start">behind the dies: side-feed strip track, tapered pins in the neighbours' holes, floating drop-shear</text>
<line class="wire" x1="276" y1="270" x2="560" y2="270"/>
<line class="strand" x1="250" y1="270" x2="276" y2="270"/>
<polyline class="wire" points="600,263.2 580,259.8 556,236"/>
<polyline class="wire" points="600,266.4 580,264.6 556,252"/>
<polyline class="wire" points="600,273.6 580,275.4 556,288"/>
<polyline class="wire" points="600,276.8 580,280.2 556,304"/>
<rect class="bought" x="560" y="248" width="70" height="44" rx="3"/>
<text class="sm" x="560" y="242" text-anchor="start">ribbon carriage (web clamp = depth datum)</text>
<line class="move" x1="556" y1="312" x2="470" y2="312" marker-end="url(#am)"/>
<text class="sm" x="470" y="328" text-anchor="start">threads axially after capture, tab in tension</text>
<rect class="bought" x="520" y="190" width="34" height="22" rx="3"/>
<text class="sm" x="560" y="198" text-anchor="start">camera: into the barrel,</text>
<text class="sm" x="560" y="210" text-anchor="start">and the tip's bare length</text>
<line class="thin" x1="520" y1="208" x2="290" y2="266"/>
<text class="t2" x="30" y="422" text-anchor="start">1 strip advances; tapered pins bring it within 0.1-0.2 mm; flush pin from below locates the lead contact (+/-0.01-0.03)</text>
<text class="t2" x="30" y="438" text-anchor="start">2 knee to capture height, pause   3 camera: barrel open and square; tip's bare length   4 carriage threads to the depth that puts</text>
<text class="t2" x="30" y="454" text-anchor="start">   the insulation edge mid-window; the far end reads which conductor touches the grounded anvil</text>
<text class="t2" x="30" y="470" text-anchor="start">5 knee to straight; log force vs indicator gap   6 back off, re-touch at 10 N: crimp height   7 drop-shear the tab</text>
<text class="t2" x="30" y="486" text-anchor="start">8 neck blade drops onto the box's rear face; carriage pulls ~20 N against the web clamp   9 stripper plate, open, lift out</text>
<rect class="steel" x="30" y="520" width="14" height="12" rx="0"/>
<text class="sm" x="50" y="530" text-anchor="start">steel (force path, dies)</text>
<rect class="print" x="205" y="520" width="14" height="12" rx="0"/>
<text class="sm" x="225" y="530" text-anchor="start">printed</text>
<rect class="bought" x="380" y="520" width="14" height="12" rx="0"/>
<text class="sm" x="400" y="530" text-anchor="start">bought motion / sensing</text>
<rect class="contact" x="555" y="520" width="14" height="12" rx="0"/>
<text class="sm" x="575" y="530" text-anchor="start">XH contact</text>
<line class="wire" x1="730" y1="526" x2="752" y2="526"/>
<text class="sm" x="758" y="530" text-anchor="start">conductor</text>
<text class="t2" x="30" y="560" text-anchor="start">Dies: SN jaws, knife set, EDM or ground stock (f7). Branches: f3b (curl, then finish), f6 (second blade and drive).</text>
</svg>