<text class="sm" x="548" y="356" text-anchor="start">press bed plates; the 5 t load cell above</text>
<text class="sm" x="548" y="368" text-anchor="start">(or the jack's gauge) reads summed force</text>
<text class="sm" x="504" y="130" text-anchor="start">pump until the shoes</text>
<text class="sm" x="504" y="142" text-anchor="start">meet the stop blocks:</text>
<text class="sm" x="504" y="154" text-anchor="start">the stops set crimp</text>
<text class="sm" x="504" y="166" text-anchor="start">height; the press</text>
<text class="sm" x="504" y="178" text-anchor="start">only pushes</text>
<text class="t2" x="40" y="450" text-anchor="start">One stroke crimps a whole ribbon end (3-5 conductors, 5-12 kN; the press has ~118 kN).</text>
<text class="t2" x="40" y="465" text-anchor="start">A floating shear under the carrier cuts the tabs in the same stroke (or a second); each conductor proof-pulled at the comb face.</text>
<text class="t2" x="40" y="480" text-anchor="start">Hands back: loading strip and ribbon into the cassette, pumping (or a motorised screw), insertion.</text>
<rect class="steel" x="40" y="530" width="14" height="12" rx="0"/>
<text class="sm" x="60" y="540" text-anchor="start">steel (force path, dies)</text>
