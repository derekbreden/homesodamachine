<text class="sm" x="40" y="290" text-anchor="start">strip segment of N contacts on steel pilot pins</text>
<text class="sm" x="40" y="303" text-anchor="start">(station pitch = the strip's pitch)</text>
<text class="sm" x="40" y="316" text-anchor="start">ribbon fanned into a printed comb, then flush-cut</text>
<text class="sm" x="40" y="329" text-anchor="start">and stripped at the comb face (edges on one line)</text>
<text class="sm" x="40" y="342" text-anchor="start">each anvil insulated: the far end names its conductor</text>
<text class="sm" x="40" y="355" text-anchor="start">springs hold the upper shoe open</text>
<text class="t2" x="470" y="80" text-anchor="start">In the idle 12-ton shop press</text>
<rect class="steel" x="470" y="90" width="26" height="330" rx="0"/>
