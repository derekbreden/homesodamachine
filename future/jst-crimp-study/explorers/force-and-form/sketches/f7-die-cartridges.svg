<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="t d">
<title id="t">f7 die cartridges from four steel sources, schematic</title>
<desc id="d">One small press with a pocket; four interchangeable die cartridges whose dies come from SN jaws, an OTP knife set, EDM plates and ground stock.</desc>
<style>
.bg{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0b0b0b;font-size:12px}
.t2{fill:#52514e;font-size:11px}.h{font-size:15px;font-weight:600}.sm{font-size:10px;fill:#52514e}
.steel{fill:#c9c8c2;stroke:#52514e;stroke-width:1.2}
.dark{fill:#8f8e88;stroke:#3d3c39;stroke-width:1.2}
.bought{fill:#dcdad2;stroke:#52514e;stroke-width:1.2;stroke-dasharray:4 2}
.print{fill:#cde2fb;stroke:#2a78d6;stroke-width:1.2}
.contact{fill:#eda100;stroke:#7a5300;stroke-width:1}
.wire{stroke:#eb6834;stroke-width:4;fill:none;stroke-linecap:round}
.wirefill{fill:#eb6834;stroke:#8c3a17;stroke-width:1}
.strand{stroke:#8c3a17;stroke-width:1;fill:none}
.force{stroke:#e34948;stroke-width:2.5;fill:none}
.forcefill{fill:#e34948}
.move{stroke:#2a78d6;stroke-width:1.8;fill:none;stroke-dasharray:5 3}
.movefill{fill:#2a78d6}
.ln{stroke:#52514e;stroke-width:1.2;fill:none}
.thin{stroke:#8a8984;stroke-width:1;fill:none;stroke-dasharray:3 3}
.box{fill:none;stroke:#8a8984;stroke-width:1}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19} text{fill:#ffffff} .t2,.sm{fill:#c3c2b7}
.steel{fill:#4a4a47;stroke:#c3c2b7}.dark{fill:#6b6a66;stroke:#d8d7d0}
.bought{fill:#33332f;stroke:#c3c2b7}.print{fill:#1c3a5e;stroke:#3987e5}
.contact{fill:#c98500;stroke:#f3c56a}.wire{stroke:#d95926}.wirefill{fill:#d95926;stroke:#f0a07e}
.strand{stroke:#f0a07e}.force{stroke:#e66767}.forcefill{fill:#e66767}
.move{stroke:#3987e5}.movefill{fill:#3987e5}.ln{stroke:#c3c2b7}.thin{stroke:#8a8984}.box{stroke:#6b6a66}}
</style>
<defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="forcefill" d="M0,0 L10,5 L0,10 z"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="movefill" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="560"/>
<text class="h" x="20" y="28" text-anchor="start">f7  Where the steel comes from: die cartridges, closed by any press</text>
<text class="t2" x="20" y="46" text-anchor="start">schematic, not to scale</text>
<rect class="box" x="30" y="70" width="200" height="300" rx="0"/>
<rect class="steel" x="50" y="90" width="160" height="30" rx="0"/>
<rect class="steel" x="60" y="120" width="20" height="200" rx="0"/>
<rect class="bought" x="110" y="120" width="40" height="50" rx="3"/>
<text class="sm" x="96" y="186" text-anchor="start">pusher +</text>
<text class="sm" x="96" y="198" text-anchor="start">disc springs</text>
<line class="force" x1="130" y1="172" x2="130" y2="214" marker-end="url(#af)"/>
<rect class="steel" x="90" y="300" width="100" height="30" rx="0"/>
<text class="sm" x="92" y="346" text-anchor="start">bed pocket, two dowels</text>
<rect class="steel" x="100" y="220" width="80" height="80" rx="3"/>
<text class="sm" x="108" y="262" text-anchor="start">cartridge</text>
<text class="sm" x="40" y="390" text-anchor="start">any pusher: f3's knee, a 1 t arbor</text>
<text class="sm" x="40" y="402" text-anchor="start">press, the shop press, an eccentric</text>
<rect class="box" x="250" y="70" width="145" height="300" rx="0"/>
<text class="h" x="258" y="90" text-anchor="start">SN jaws</text>
<rect class="steel" x="270" y="105" width="105" height="16" rx="0"/>
<rect class="steel" x="275" y="121" width="8" height="70" rx="0"/>
<rect class="steel" x="362" y="121" width="8" height="70" rx="0"/>
<rect class="dark" x="305" y="121" width="35" height="28" rx="0"/>
<rect class="dark" x="305" y="160" width="35" height="22" rx="0"/>
<rect class="steel" x="270" y="191" width="105" height="16" rx="0"/>
<text class="sm" x="258" y="232" text-anchor="start">$9.99, days</text>
<text class="sm" x="258" y="246" text-anchor="start">today's profile</text>
<text class="sm" x="258" y="260" text-anchor="start">height: jaws, if they bottom</text>
<text class="sm" x="258" y="274" text-anchor="start">insulation step fixed</text>
<text class="sm" x="258" y="288" text-anchor="start">one nest per cartridge</text>
<rect class="box" x="405" y="70" width="145" height="300" rx="0"/>
<text class="h" x="413" y="90" text-anchor="start">OTP knife set</text>
<rect class="steel" x="425" y="105" width="105" height="16" rx="0"/>
<rect class="steel" x="430" y="121" width="8" height="70" rx="0"/>
<rect class="steel" x="517" y="121" width="8" height="70" rx="0"/>
<rect class="dark" x="460" y="121" width="35" height="28" rx="0"/>
<rect class="dark" x="460" y="160" width="35" height="22" rx="0"/>
<rect class="steel" x="425" y="191" width="105" height="16" rx="0"/>
<text class="sm" x="413" y="232" text-anchor="start">~$30-100, weeks [est.]</text>
<text class="sm" x="413" y="246" text-anchor="start">industrial XH profile</text>
<text class="sm" x="413" y="260" text-anchor="start">separate CH / IH blades</text>
<text class="sm" x="413" y="274" text-anchor="start">narrow: heads, gangs</text>
<text class="sm" x="413" y="288" text-anchor="start">some vendor's contact</text>
<rect class="box" x="560" y="70" width="145" height="300" rx="0"/>
<text class="h" x="568" y="90" text-anchor="start">EDM plates</text>
<rect class="steel" x="580" y="105" width="105" height="16" rx="0"/>
<rect class="steel" x="585" y="121" width="8" height="70" rx="0"/>
<rect class="steel" x="672" y="121" width="8" height="70" rx="0"/>
<rect class="dark" x="615" y="121" width="35" height="28" rx="0"/>
<rect class="dark" x="615" y="160" width="35" height="22" rx="0"/>
<rect class="steel" x="580" y="191" width="105" height="16" rx="0"/>
<text class="sm" x="568" y="232" text-anchor="start">~$50-200, weeks [est.]</text>
<text class="sm" x="568" y="246" text-anchor="start">any profile you draw</text>
<text class="sm" x="568" y="260" text-anchor="start">gang plates, 2.9 mm</text>
<text class="sm" x="568" y="274" text-anchor="start">narrow dies, overlap</text>
<text class="sm" x="568" y="288" text-anchor="start">first drawing is a guess</text>
<rect class="box" x="715" y="70" width="145" height="300" rx="0"/>
<text class="h" x="723" y="90" text-anchor="start">Ground stock</text>
<rect class="steel" x="735" y="105" width="105" height="16" rx="0"/>
<rect class="steel" x="740" y="121" width="8" height="70" rx="0"/>
<rect class="steel" x="827" y="121" width="8" height="70" rx="0"/>
<rect class="dark" x="770" y="121" width="35" height="28" rx="0"/>
<rect class="dark" x="770" y="160" width="35" height="22" rx="0"/>
<rect class="steel" x="735" y="191" width="105" height="16" rx="0"/>
<text class="sm" x="723" y="232" text-anchor="start">anvil = stock on edge</text>
<text class="sm" x="723" y="246" text-anchor="start">width +/-0.013 mm</text>
<text class="sm" x="723" y="260" text-anchor="start">lap the top, harden O1</text>
<text class="sm" x="723" y="274" text-anchor="start">laser-cut plates for</text>
<text class="sm" x="723" y="288" text-anchor="start">holders, stops (+/-0.13)</text>
<text class="t2" x="30" y="430" text-anchor="start">Every cartridge: base and top on two ground pins, return spring, its own stop block, same outer shape and button.</text>
<text class="t2" x="30" y="446" text-anchor="start">Stop in the cartridge, spring in the pusher. A 0.001 mm indicator across the plates reads re-touch height.</text>
<text class="t2" x="30" y="462" text-anchor="start">A single die's channel may be +/-0.05 mm if its width is measured and its height set for that width (W x H is the</text>
<text class="t2" x="30" y="478" text-anchor="start">compaction); a gang plate's stations must match to ~0.01; an anvil ~+/-0.02 (ground stock); holders and stops</text>
<text class="t2" x="30" y="494" text-anchor="start">~+/-0.15 (laser cutting). Printed parts never make a die face.</text>
<rect class="steel" x="30" y="536" width="14" height="12" rx="0"/>
<text class="sm" x="50" y="546" text-anchor="start">steel (force path, dies)</text>
<rect class="print" x="205" y="536" width="14" height="12" rx="0"/>
<text class="sm" x="225" y="546" text-anchor="start">printed</text>
<rect class="bought" x="380" y="536" width="14" height="12" rx="0"/>
<text class="sm" x="400" y="546" text-anchor="start">bought motion / sensing</text>
<rect class="contact" x="555" y="536" width="14" height="12" rx="0"/>
<text class="sm" x="575" y="546" text-anchor="start">XH contact</text>
<line class="wire" x1="730" y1="542" x2="752" y2="542"/>
<text class="sm" x="758" y="546" text-anchor="start">conductor</text>
</svg>