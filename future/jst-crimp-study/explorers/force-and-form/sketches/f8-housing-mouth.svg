<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-labelledby="t d">
<title id="t">f8 narrow press at the housing mouth, schematic</title>
<desc id="d">Side section: the contact's box sits in its housing cavity, the barrels stand out over an anvil with a lance relief; a narrow crimper in a steel C bottoms on shoulders below the floor. Inset: end view of the 2.9 mm crimper between neighbour wires at 2.5 mm pitch.</desc>
<style>
.bg{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0b0b0b;font-size:12px}
.t2{fill:#52514e;font-size:11px}.h{font-size:15px;font-weight:600}.sm{font-size:10px;fill:#52514e}
.steel{fill:#c9c8c2;stroke:#52514e;stroke-width:1.2}
.dark{fill:#8f8e88;stroke:#3d3c39;stroke-width:1.2}
.bought{fill:#dcdad2;stroke:#52514e;stroke-width:1.2;stroke-dasharray:4 2}
.print{fill:#cde2fb;stroke:#2a78d6;stroke-width:1.2}
.contact{fill:#eda100;stroke:#7a5300;stroke-width:1}
.wire{stroke:#eb6834;stroke-width:4;fill:none;stroke-linecap:round}
.wirefill{fill:#eb6834;stroke:#8c3a17;stroke-width:1}
.strand{stroke:#8c3a17;stroke-width:1;fill:none}
.force{stroke:#e34948;stroke-width:2.5;fill:none}
.forcefill{fill:#e34948}
.move{stroke:#2a78d6;stroke-width:1.8;fill:none;stroke-dasharray:5 3}
.movefill{fill:#2a78d6}
.ln{stroke:#52514e;stroke-width:1.2;fill:none}
.thin{stroke:#8a8984;stroke-width:1;fill:none;stroke-dasharray:3 3}
.box{fill:none;stroke:#8a8984;stroke-width:1}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19} text{fill:#ffffff} .t2,.sm{fill:#c3c2b7}
.steel{fill:#4a4a47;stroke:#c3c2b7}.dark{fill:#6b6a66;stroke:#d8d7d0}
.bought{fill:#33332f;stroke:#c3c2b7}.print{fill:#1c3a5e;stroke:#3987e5}
.contact{fill:#c98500;stroke:#f3c56a}.wire{stroke:#d95926}.wirefill{fill:#d95926;stroke:#f0a07e}
.strand{stroke:#f0a07e}.force{stroke:#e66767}.forcefill{fill:#e66767}
.move{stroke:#3987e5}.movefill{fill:#3987e5}.ln{stroke:#c3c2b7}.thin{stroke:#8a8984}.box{stroke:#6b6a66}}
</style>
<defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="forcefill" d="M0,0 L10,5 L0,10 z"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="movefill" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="640"/>
<text class="h" x="20" y="28" text-anchor="start">f8  A narrow press at the housing's mouth (into-the-housing i2 x force-and-form f3/f4)</text>
<text class="t2" x="20" y="46" text-anchor="start">schematic, not to scale</text>
<rect class="box" x="20" y="60" width="500" height="400" rx="0"/>
<text class="t2" x="30" y="78" text-anchor="start">Side section along the wire</text>
<rect class="print" x="40" y="180" width="130" height="110" rx="2"/>
<rect class="bg" x="40" y="214" width="130" height="40" rx="0"/>
<text class="sm" x="44" y="306" text-anchor="start">XHP nest: fixed in Y,</text>
<text class="sm" x="44" y="319" text-anchor="start">floats in X and Z</text>
<rect class="contact" x="120" y="216" width="50" height="36" rx="0"/>
<text class="sm" x="90" y="205" text-anchor="start">box 1.4-2.4 mm in</text>
<rect class="contact" x="170" y="238" width="8" height="14" rx="0"/>
<polyline class="ln" points="166,252 180,266"/>
<text class="sm" x="128" y="290" text-anchor="start"></text>
<rect class="contact" x="186" y="228" width="36" height="24" rx="0"/>
<rect class="contact" x="236" y="212" width="30" height="40" rx="0"/>
<line class="wire" x1="200" y1="240" x2="480" y2="240"/>
<rect class="steel" x="190" y="252" width="90" height="50" rx="0"/>
<rect class="bg" x="182" y="262" width="8" height="40" rx="0"/>
<text class="sm" x="196" y="316" text-anchor="start">anvil: front stops behind the lance;</text>
<text class="sm" x="196" y="329" text-anchor="start">shoulders below the floor</text>
<text class="sm" x="150" y="278" text-anchor="end">lance</text>
<line class="move" x1="290" y1="262" x2="290" y2="292" marker-end="url(#am)"/>
<text class="sm" x="296" y="284" text-anchor="start">anvil drops 1.5 mm</text>
<rect class="dark" x="186" y="130" width="36" height="90" rx="0"/>
<rect class="dark" x="236" y="140" width="30" height="64" rx="0"/>
<text class="sm" x="60" y="124" text-anchor="start">narrow stepped crimper</text>
<polyline class="ln" points="170,121 186,130"/>
<rect class="steel" x="330" y="90" width="170" height="26" rx="0"/>
<rect class="steel" x="474" y="90" width="26" height="260" rx="0"/>
<rect class="steel" x="330" y="324" width="170" height="26" rx="0"/>
<polyline class="ln" points="330,103 222,103 222,130"/>
<text class="sm" x="360" y="140" text-anchor="start">knee in a steel C (f4)</text>
<line class="force" x1="290" y1="106" x2="290" y2="128" marker-end="url(#af)"/>
<path class="wire" d="M 330 240 Q 400 200 470 240"/>
<text class="sm" x="380" y="196" text-anchor="start">saddle hump stores ~5 mm</text>
<text class="sm" x="30" y="350" text-anchor="start">Crimp 0.2-0.3 mm from the PA6 face; the die never touches it.</text>
<text class="sm" x="30" y="363" text-anchor="start">Then cut the tab, drop the anvil, push the contact home (blade),</text>
<text class="sm" x="30" y="376" text-anchor="start">5 N pull-back, step 2.5 mm (5.0 past J2's empty cavity 3).</text>
<text class="sm" x="30" y="389" text-anchor="start">A comb 3-5 mm behind the rear face centres the seated wires.</text>
<rect class="box" x="540" y="60" width="320" height="400" rx="0"/>
<text class="t2" x="550" y="78" text-anchor="start">End view at the crimp (scale ~40 px/mm)</text>
<circle class="wirefill" cx="600.0" cy="288.0" r="34.0"/>
<circle class="wirefill" cx="800.0" cy="288.0" r="34.0"/>
<text class="sm" x="600.0" y="238.0" text-anchor="middle">neighbour</text>
<text class="sm" x="800.0" y="238.0" text-anchor="middle">neighbour</text>
<rect class="dark" x="642.0" y="194.0" width="116.0" height="102.0" rx="0"/>
<rect class="dark" x="642.0" y="296.0" width="28.0" height="42.0" rx="0"/>
<rect class="dark" x="730.0" y="296.0" width="28.0" height="42.0" rx="0"/>
<rect class="contact" x="670.0" y="296.0" width="60.0" height="34.0" rx="0"/>
<rect class="steel" x="670.0" y="330" width="60.0" height="8.0" rx="0"/>
<rect class="steel" x="624.0" y="338.0" width="152.0" height="48.0" rx="0"/>
<text class="sm" x="780.0" y="362.0" text-anchor="start">shoulders</text>
<line class="thin" x1="560" y1="330" x2="840" y2="330"/>
<text class="sm" x="562" y="326" text-anchor="start">floor</text>
<text class="sm" x="552" y="394" text-anchor="start">2.9 mm crimper: 1.5 channel + 2 x 0.7 walls;</text>
<text class="sm" x="552" y="406" text-anchor="start">3.30 mm free at the neighbours' equator,</text>
<text class="sm" x="552" y="418" text-anchor="start">0.00 to +0.08 mm a side net of the wires' play;</text>
<text class="sm" x="552" y="430" text-anchor="start">walls land on anvil-block shoulders below</text>
<text class="sm" x="552" y="442" text-anchor="start">the floor, where there are 5 mm of room.</text>
<text class="t2" x="30" y="488" text-anchor="start">Decisive unknown: the transition t from box rear to conductor barrel front. With t >= ~0.8 mm an anvil can stop behind the lance</text>
<text class="t2" x="30" y="504" text-anchor="start">and still carry the barrel; below ~0.7 mm the entry must fold the lance first. One side-on photo of a kit contact settles it.</text>
<rect class="steel" x="30" y="550" width="14" height="12" rx="0"/>
<text class="sm" x="50" y="560" text-anchor="start">steel (force path, dies)</text>
<rect class="print" x="205" y="550" width="14" height="12" rx="0"/>
<text class="sm" x="225" y="560" text-anchor="start">printed</text>
<rect class="bought" x="380" y="550" width="14" height="12" rx="0"/>
<text class="sm" x="400" y="560" text-anchor="start">bought motion / sensing</text>
<rect class="contact" x="555" y="550" width="14" height="12" rx="0"/>
<text class="sm" x="575" y="560" text-anchor="start">XH contact</text>
<line class="wire" x1="730" y1="556" x2="752" y2="556"/>
<text class="sm" x="758" y="560" text-anchor="start">conductor</text>
<text class="t2" x="30" y="590" text-anchor="start">Walls of 0.3-0.4 mm crack at 2,200-9,450 MPa; 0.7-0.85 mm walls run 490-1,740 MPa (k = 0.3-0.5).</text>
</svg>