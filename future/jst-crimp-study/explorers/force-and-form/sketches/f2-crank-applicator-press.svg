<line class="ln" x1="288" y1="138" x2="275" y2="176"/>
<line class="ln" x1="289" y1="139" x2="276" y2="177"/>
<text class="sm" x="200" y="118" text-anchor="start">eccentric</text>
<circle class="bought" cx="236" cy="146" r="5"/>
<text class="sm" x="160" y="150" text-anchor="start">angle sensor</text>
<rect class="steel" x="236" y="176" width="14" height="52" rx="0"/>
<rect class="steel" x="300" y="176" width="14" height="52" rx="0"/>
<rect class="steel" x="254" y="176" width="42" height="48" rx="0"/>
<text class="sm" x="320" y="196" text-anchor="start">ram in guide</text>
<rect class="dark" x="262" y="224" width="26" height="8" rx="0"/>
<text class="sm" x="320" y="230" text-anchor="start">T-slot grips the shank collar</text>
<line class="force" x1="275" y1="160" x2="275" y2="174" marker-end="url(#af)"/>
<rect class="steel" x="266" y="232" width="18" height="34" rx="0"/>
<rect class="steel" x="190" y="262" width="170" height="150" rx="4"/>
<text class="sm" x="196" y="280" text-anchor="start">OTP side-feed applicator</text>
<text class="sm" x="196" y="292" text-anchor="start">(bought)</text>
<rect class="dark" x="262" y="294" width="26" height="16" rx="0"/>
<rect class="dark" x="266" y="320" width="18" height="18" rx="0"/>
<rect class="contact" x="258" y="311" width="34" height="9" rx="0"/>
<text class="sm" x="196" y="362" text-anchor="start">feed finger, anvil, crimpers,</text>
<text class="sm" x="196" y="374" text-anchor="start">tab cut-off, crimp-height dial</text>
<text class="sm" x="196" y="386" text-anchor="start">(JST MKS-L: 0.05 mm per step)</text>
<rect class="bought" x="220" y="412" width="110" height="12" rx="2"/>
<text class="sm" x="336" y="422" text-anchor="start">button load cell</text>
<rect class="steel" x="190" y="424" width="170" height="26" rx="0"/>
<circle class="bought" cx="80" cy="300" r="44"/>
<text class="sm" x="80" y="356" text-anchor="middle">SXH strip reel</text>
<rect class="contact" x="128" y="311" width="12" height="9" rx="0"/>
<rect class="contact" x="150" y="311" width="12" height="9" rx="0"/>
