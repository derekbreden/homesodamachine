<rect class="bought" x="330" y="104" width="116" height="40" rx="3"/>
<text class="sm" x="336" y="120" text-anchor="start">NEMA 23 + 30:1 worm</text>
<text class="sm" x="336" y="132" text-anchor="start">(self-locking, 20 N*m)</text>
<line class="ln" x1="297" y1="120" x2="330" y2="120"/>
<circle class="steel" cx="275" cy="124" r="22"/>
<circle class="dark" cx="275" cy="124" r="3"/>
