<rect class="contact" x="216" y="311" width="12" height="9" rx="0"/>
<rect class="contact" x="238" y="311" width="12" height="9" rx="0"/>
<line class="ln" x1="124" y1="320" x2="258" y2="320"/>
<text class="t2" x="560" y="76" text-anchor="start">Side view at the anvil (wire axis in the page)</text>
<rect class="box" x="560" y="86" width="300" height="330" rx="0"/>
<rect class="steel" x="640" y="150" width="60" height="50" rx="0"/>
<text class="sm" x="706" y="172" text-anchor="start">crimpers (ram up)</text>
<rect class="steel" x="640" y="256" width="60" height="40" rx="0"/>
<text class="sm" x="600" y="280" text-anchor="start">anvil</text>
<rect class="contact" x="630" y="236" width="18" height="20" rx="0"/>
<path class="ln" d="M648,236 L648,256 L696,256 L696,236"/>
<polygon class="contact" points="648,238 648,256 696,256 696,238 693,238 693,252 651,252 651,238"/>
<line class="strand" x1="662" y1="246" x2="694" y2="246"/>
<line class="wire" x1="694" y1="246" x2="790" y2="246"/>
<rect class="print" x="736" y="232" width="10" height="28" rx="2"/>
<text class="sm" x="700" y="222" text-anchor="start">fork holds one conductor</text>
<polyline class="wire" points="800,240 790,230 770,186"/>
<polyline class="wire" points="800,240 790,230 770,202"/>
<rect class="bought" x="790" y="228" width="50" height="38" rx="3"/>
<text class="sm" x="850" y="284" text-anchor="end">ribbon carriage X/Y/Z</text>
<line class="move" x1="830" y1="318" x2="710" y2="318" marker-end="url(#am)"/>
<text class="sm" x="575" y="350" text-anchor="start">the conductor is laid in from above-rear</text>
<text class="sm" x="575" y="363" text-anchor="start">while the ram is up; pre-feed means</text>
<text class="sm" x="575" y="376" text-anchor="start">the next contact is already on the anvil.</text>
<text class="sm" x="575" y="389" text-anchor="start">The applicator's wire-hold spring and</text>
<text class="sm" x="575" y="402" text-anchor="start">stripper hold it as the crimpers descend.</text>
<text class="t2" x="30" y="500" text-anchor="start">Per crimp: carriage lays conductor i into the waiting contact -> one crank revolution (crimp, cut-off, feed next)</text>
<text class="t2" x="30" y="515" text-anchor="start">-> carriage lifts and indexes. Logged: force (load cell) vs ram height (crank angle). BDC: 1 deg off = 3-4 um.</text>
<rect class="steel" x="30" y="536" width="14" height="12" rx="0"/>
<text class="sm" x="50" y="546" text-anchor="start">steel (force path, dies)</text>
<rect class="print" x="205" y="536" width="14" height="12" rx="0"/>
<text class="sm" x="225" y="546" text-anchor="start">printed</text>
<rect class="bought" x="380" y="536" width="14" height="12" rx="0"/>
<text class="sm" x="400" y="546" text-anchor="start">bought motion / sensing</text>
<rect class="contact" x="555" y="536" width="14" height="12" rx="0"/>
<text class="sm" x="575" y="546" text-anchor="start">XH contact</text>
<line class="wire" x1="730" y1="542" x2="752" y2="542"/>
<text class="sm" x="758" y="546" text-anchor="start">conductor</text>
</svg>