<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<rect width="1100" height="760" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p1c Lift once under a hand-tool module: the SN-2549 lies on its side (schematic)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">End view along the wire, 12 px/mm for the row and the lift; the tool's outline is not to scale. Numbers: calc/wave3.out.txt §1.</text>
<text x="40.0" y="80.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">End view (looking from the tool toward the cassette)</text>
<circle cx="200.0" cy="450.0" r="10.2" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="230.0" cy="450.0" r="10.2" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="260.0" cy="450.0" r="10.2" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="320.0" cy="450.0" r="10.2" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="350.0" cy="450.0" r="10.2" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="380.0" cy="450.0" r="10.2" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="290.0" cy="309.6" r="10.2" fill="#333" stroke="#333" stroke-width="1.2"/>
<rect x="254.0" y="312.0" width="216.0" height="105.6" rx="0" fill="#dde" stroke="#222222" stroke-width="1.2"/>
<rect x="254.0" y="237.6" width="216.0" height="60.0" rx="0" fill="#dde" stroke="#222222" stroke-width="1.2"/>
<text x="338.0" y="273.6" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">upper jaw</text>
<text x="314.0" y="357.6" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">anvil jaw half, depth a</text>
<text x="314.0" y="370.6" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">below the nest floor</text>
<line x1="470.0" y1="237.6" x2="578.0" y2="177.6" stroke="#888888" stroke-width="6"/>
<line x1="470.0" y1="417.6" x2="578.0" y2="453.6" stroke="#888888" stroke-width="6"/>
<text x="494.0" y="153.6" font-size="10" fill="#555" text-anchor="start" font-weight="normal">handles and pusher off to +X</text>
<line x1="230.0" y1="291.6" x2="230.0" y2="327.6" stroke="#b03030" stroke-width="1.2" marker-end="url(#arrr)" marker-start="url(#arrr)"/>
<text x="40.0" y="239.6" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">jaws close vertically: the closing</text>
<text x="40.0" y="252.6" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">direction is the contact's floor</text>
<text x="40.0" y="265.6" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">normal, so the crimp is upright</text>
<text x="40.0" y="339.6" font-size="10" fill="#555" text-anchor="start" font-weight="normal">mouth opens to -X: the module</text>
<text x="40.0" y="352.6" font-size="10" fill="#555" text-anchor="start" font-weight="normal">arrives and leaves sideways over k</text>
<line x1="158.0" y1="450.0" x2="158.0" y2="309.6" stroke="#2a5d9f" stroke-width="1.2" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
<text x="48.0" y="399.8" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">h = a + 2.7</text>
<text x="48.0" y="412.8" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">= 8.7-14.7 mm</text>
<line x1="100.0" y1="450.0" x2="500.0" y2="450.0" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M 280 490 L 280 429.6 M 300 490 L 300 429.6" fill="none" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="5,3"/>
<text x="304.0" y="486.0" font-size="9" fill="#2f7d4f" text-anchor="start" font-weight="normal">lift finger (10 mm behind, dashed)</text>
<text x="40.0" y="520.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">The jaw's back face sits ~2.1 mm above the row axis, ~1 mm over a crimped neighbour. Residual rise:</text>
<text x="40.0" y="533.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">0-2.3 mm at 30 mm free for h 8.7; 0.4-5.7 mm at 35 mm for h 14.7 [calc wave3 §1]:</text>
<text x="40.0" y="546.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">a 30-35 mm split and a squaring push after every crimp.</text>
<rect x="40.0" y="580.0" width="420.0" height="110.0" rx="0" fill="#fafafa" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="48.0" y="598.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="bold">Not used: hung tip-down, closing along the row</text>
<rect x="86.0" y="623.0" width="24.0" height="22.0" rx="0" fill="#fff" stroke="#222222" stroke-width="1.2"/>
<path d="M 110 645 L 118 651" fill="none" stroke="#b03030" stroke-width="2"/>
<rect x="156.0" y="623.0" width="24.0" height="22.0" rx="0" fill="#fff" stroke="#222222" stroke-width="1.2"/>
<path d="M 180 645 L 188 651" fill="none" stroke="#b03030" stroke-width="2"/>
<rect x="226.0" y="623.0" width="24.0" height="22.0" rx="0" fill="#fff" stroke="#222222" stroke-width="1.2"/>
<path d="M 250 645 L 258 651" fill="none" stroke="#b03030" stroke-width="2"/>
<rect x="296.0" y="623.0" width="24.0" height="22.0" rx="0" fill="#fff" stroke="#222222" stroke-width="1.2"/>
<path d="M 320 645 L 328 651" fill="none" stroke="#b03030" stroke-width="2"/>
<text x="48.0" y="672.0" font-size="9" fill="#555" text-anchor="start" font-weight="normal">every crimp rolled 90 deg: barrels open along the row, every lance</text>
<text x="48.0" y="684.0" font-size="9" fill="#555" text-anchor="start" font-weight="normal">at a neighbour; no housing slides onto the row</text>
<text x="640.0" y="94.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">One conductor, in one pose</text>
<rect x="640.0" y="110.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="126.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">pick</text>
<text x="722.0" y="126.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">k still in the row: jaws over the contact on its</text>
<text x="722.0" y="139.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">post; close only to wing touch; blade in the neck</text>
<rect x="640.0" y="162.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="178.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">lift</text>
<text x="722.0" y="178.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">finger raises k by a + 2.7 mm</text>
<rect x="640.0" y="214.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="230.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">trim</text>
<text x="722.0" y="230.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">shuttle brings the grounded blade: squares the</text>
<text x="722.0" y="243.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">tip and reads identity through the far end</text>
<rect x="640.0" y="266.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="282.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">strip</text>
<text x="722.0" y="282.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">V-jaws or a spindle, 2.4 mm, in the pose</text>
<rect x="640.0" y="318.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="334.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">measure</text>
<text x="722.0" y="334.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">ELP on a backlight: bare length, brush</text>
<rect x="640.0" y="370.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="386.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">feed</text>
<text x="722.0" y="386.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">module slides the contact onto k to the</text>
<text x="722.0" y="399.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">measured depth; tips stop short of the blade</text>
<rect x="640.0" y="422.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="438.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">crimp</text>
<text x="722.0" y="438.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">pause at the end of the curl (identity again),</text>
<text x="722.0" y="451.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">then complete the ratchet; curve logged</text>
<rect x="640.0" y="474.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="490.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">pull</text>
<text x="722.0" y="490.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">jaws open to the blade; 20 N through the box</text>
<rect x="640.0" y="526.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="542.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">release</text>
<text x="722.0" y="542.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">jaws open fully; module leaves in +X</text>
<rect x="640.0" y="578.0" width="72.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="646.0" y="594.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">square</text>
<text x="722.0" y="594.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">finger lowers k; presser pushes the crimp into</text>
<text x="722.0" y="607.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">the row within ~0.5 mm</text>
</svg>