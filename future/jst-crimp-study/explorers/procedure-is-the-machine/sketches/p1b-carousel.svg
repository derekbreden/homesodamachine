<text x="40.0" y="770.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">Tails lie inward in each cassette's tray; the ring turns 30 deg per index. A station's own dowels rise</text>
<text x="40.0" y="784.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">through the nest and lift the cassette 1-2 mm, so the carousel's +/-0.5-1 mm never reaches the work.</text>
<text x="40.0" y="798.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">Each station is the p1 bench, unchanged, bolted at an angle. A linear conveyor is the same idea opened out.</text>
