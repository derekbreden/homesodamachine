<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="660" viewBox="0 0 1150 660" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<rect width="1150" height="660" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p1 bench B, form B-drop: the contact waits cut free on a stepped fin (schematic)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">Side section along the wire (left) and end view from the tip (right). 'Fixed' is the bench frame; the cassette is located to it by its pins.</text>
<text x="40.0" y="80.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Side section</text>
<rect x="40.0" y="230.0" width="150.0" height="45.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="48.0" y="250.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">cassette: clamp (hard stop,</text>
<text x="48.0" y="262.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">15-30 % squeeze), fan, comb</text>
<rect x="30.0" y="290.0" width="420.0" height="14.0" rx="0" fill="#ddd" stroke="#888888" stroke-width="1.2"/>
<text x="40.0" y="322.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">slide (lead screw) indexes 2.5 mm per key</text>
<circle cx="70.0" cy="285.0" r="5.0" fill="#fff" stroke="#b03030" stroke-width="2"/>
<circle cx="160.0" cy="285.0" r="5.0" fill="#fff" stroke="#b03030" stroke-width="2"/>
<path d="M 190 256 C 250 256, 280 330, 400 345" fill="none" stroke="#777" stroke-width="5"/>
<text x="150.0" y="372.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">neighbours pressed ~7 mm down by the</text>
<text x="150.0" y="385.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">slotted presser; k passes up its slot.</text>
<text x="150.0" y="398.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">Each keeps a set: 1.3-4.5 mm at 20 mm free</text>
<rect x="245.0" y="190.0" width="36.0" height="48.0" rx="0" fill="#f4f4f4" stroke="#888888" stroke-width="1.2"/>
<line x1="263.0" y1="150.0" x2="263.0" y2="188.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="215.0" y="142.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">slotted presser</text>
<line x1="190.0" y1="250.0" x2="478.0" y2="250.0" stroke="#111" stroke-width="7"/>
<line x1="478.0" y1="250.0" x2="512.0" y2="250.0" stroke="#c77d10" stroke-width="3"/>
<path d="M 385 300 L 385 262 L 378 252 M 385 262 L 392 252" fill="none" stroke="#2f7d4f" stroke-width="3"/>
<line x1="385.0" y1="330.0" x2="385.0" y2="302.0" stroke="#2f7d4f" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="300.0" y="410.0" font-size="10" fill="#2f7d4f" text-anchor="start" font-weight="normal">V-fork rises from below, 5-6 mm</text>
<text x="300.0" y="423.0" font-size="10" fill="#2f7d4f" text-anchor="start" font-weight="normal">behind the strip line; drops away</text>
<text x="300.0" y="436.0" font-size="10" fill="#2f7d4f" text-anchor="start" font-weight="normal">before the punch arrives</text>
<line x1="455.0" y1="170.0" x2="455.0" y2="240.0" stroke="#2a5d9f" stroke-width="3"/>
<text x="395.0" y="162.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">lay-in finger</text>
<path d="M 470 243 L 470 262 L 580 262 L 580 238 L 540 238 L 540 256 L 500 256 L 500 243" fill="none" stroke="#b03030" stroke-width="2"/>
<line x1="533.0" y1="232.0" x2="533.0" y2="262.0" stroke="#222222" stroke-width="2"/>
<text x="640.0" y="262.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">contact cut free: box forward,</text>
<text x="640.0" y="275.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">held by a 0.3 mm blade in its</text>
<text x="640.0" y="288.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">neck (or a stub on a pilot pin)</text>
<rect x="470.0" y="262.0" width="80.0" height="120.0" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<rect x="550.0" y="262.0" width="25.0" height="120.0" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<text x="640.0" y="318.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">stepped fin, 9-10 mm tall:</text>
<text x="640.0" y="331.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">1.45 under the conductor barrel,</text>
<text x="640.0" y="344.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">1.8-1.9 under the insulation</text>
<text x="640.0" y="357.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">barrel; relieved behind the lance</text>
<rect x="470.0" y="150.0" width="110.0" height="70.0" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<rect x="600.0" y="170.0" width="26.0" height="50.0" rx="0" fill="#aab" stroke="#222222" stroke-width="1.2"/>
<rect x="600.0" y="222.0" width="26.0" height="50.0" rx="0" fill="#aab" stroke="#222222" stroke-width="1.2"/>
<text x="632.0" y="196.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">stop blocks meet at crimp height</text>
<text x="632.0" y="209.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">(a short steel loop, shimmed)</text>
<line x1="525.0" y1="90.0" x2="525.0" y2="146.0" stroke="#b03030" stroke-width="2" marker-end="url(#arrr)"/>
<path d="M 540 100 l 8 -5 l -16 -5 l 16 -5 l -16 -5 l 8 -5" fill="none" stroke="#b03030" stroke-width="1.5"/>
<text x="560.0" y="96.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">ram through a stiff spring: overtravel past the stops</text>
<text x="560.0" y="109.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">costs only k x m (5-10 kN/mm loop: 1.05-1.4x the crimp)</text>
<rect x="460.0" y="384.0" width="180.0" height="14.0" rx="0" fill="#fbf1e2" stroke="#c77d10" stroke-width="1.2"/>
<text x="460.0" y="414.0" font-size="10" fill="#c77d10" text-anchor="start" font-weight="normal">force sensed under the whole lower die (fin holder and</text>
<text x="460.0" y="427.0" font-size="10" fill="#c77d10" text-anchor="start" font-weight="normal">stops together), outside the stop loop; or foil gauges</text>
<text x="880.0" y="80.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">End view from the tip</text>
<rect x="985.0" y="312.0" width="30.1" height="170.0" rx="0" fill="none" stroke="#222222" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="988.4" y="312.0" width="23.2" height="170.0" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<path d="M 977.6 269.6 L 985.6 312 L 1014.4 312 L 1022.4 269.6" fill="none" stroke="#b03030" stroke-width="2.5"/>
<circle cx="1000.0" cy="295.2" r="13.6" fill="#111" stroke="#222222" stroke-width="1.2"/>
<text x="1030.0" y="300.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">k in the open barrels</text>
<rect x="972.8" y="188.0" width="54.4" height="54.4" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<text x="1040.0" y="212.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">punch: nothing else</text>
<text x="1040.0" y="225.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">is up here</text>
<circle cx="880.0" cy="420.0" r="13.6" fill="#777" stroke="#222222" stroke-width="1.2"/>
<circle cx="920.0" cy="420.0" r="13.6" fill="#777" stroke="#222222" stroke-width="1.2"/>
<circle cx="960.0" cy="420.0" r="13.6" fill="#777" stroke="#222222" stroke-width="1.2"/>
<circle cx="1040.0" cy="420.0" r="13.6" fill="#777" stroke="#222222" stroke-width="1.2"/>
<circle cx="1080.0" cy="420.0" r="13.6" fill="#777" stroke="#222222" stroke-width="1.2"/>
<circle cx="1120.0" cy="420.0" r="13.6" fill="#777" stroke="#222222" stroke-width="1.2"/>
<text x="860.0" y="532.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">neighbours ~7 mm lower at 2.5 mm pitch; the fin</text>
<text x="860.0" y="545.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">(solid 1.45 mm, dashed 1.88 mm step) stands</text>
<text x="860.0" y="558.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">between k-1 and k+1, 3.3 mm apart</text>
<text x="40.0" y="470.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">What locates what: lateral, the V-fork at the moment of use (+/-0.05 mm); axial, the trim line on the cassette pins and the contact's own</text>
<text x="40.0" y="484.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">reference on the fin (blade on the box shoulder, +/-0.075 mm); crimp height, the stop blocks. Axial chain +/-0.23 mm RSS against a +/-0.3 mm window</text>
<text x="40.0" y="498.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">[calc wave2 §3]. Identity: the strands land on the barrel floor at lay-in, so the fin reads which far-end conductor is in the contact.</text>
<text x="40.0" y="512.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">Proof pull: a hook behind the box, punch up, 20 N against a spring, reacted by the cassette clamp.</text>
<text x="40.0" y="526.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">The other forms of bench B: p1c (lift k 8.7-14.7 mm under an SN-2549 on its side) and p1d (lift k 3.5 mm, fin from below).</text>
</svg>