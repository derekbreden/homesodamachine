<text x="610.0" y="360.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">left:  J1 5P, J2 3P-a, J4 4P, J7 5P, all singles</text>
<text x="610.0" y="373.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">right: J1 4P, J2 3P-b, J4 3P, J7 3P</text>
<text x="40.0" y="490.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">Two lanes because every pair has a 'cavity-1 ribbon' and a second ribbon. The 4P appears on both sides (J4 left, J1 right),</text>
<text x="40.0" y="504.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">so it is bought twice, as is the 3P. J4 and J7's crossings still need a hand, or a changed ribbon assignment.</text>
