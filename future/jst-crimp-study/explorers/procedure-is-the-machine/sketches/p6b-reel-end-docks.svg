<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p6b The reel end docks on a strip (schematic)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">Side view of the line (top) and the order of one end (bottom). The equal-path fan keeps the tips and strip lines on one line after fanning, so every conductor docks at once.</text>
<circle cx="90.0" cy="190.0" r="60.0" fill="#f4f4f4" stroke="#888888" stroke-width="1.2"/>
<rect x="80.0" y="180.0" width="20.0" height="20.0" rx="0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2"/>
<text x="40.0" y="270.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">reel, hub socket</text>
<line x1="150.0" y1="190.0" x2="230.0" y2="190.0" stroke="#333" stroke-width="5"/>
<rect x="230.0" y="168.0" width="60.0" height="12.0" rx="6" fill="#bbb" stroke="#222222" stroke-width="1.2"/>
<rect x="230.0" y="200.0" width="60.0" height="12.0" rx="6" fill="#bbb" stroke="#222222" stroke-width="1.2"/>
<text x="222.0" y="160.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">belt feed</text>
<line x1="290.0" y1="190.0" x2="330.0" y2="190.0" stroke="#333" stroke-width="5"/>
<rect x="330.0" y="170.0" width="60.0" height="40.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="326.0" y="162.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">clamp on X</text>
<path d="M 390 190 C 420 160, 450 160, 480 190" fill="none" stroke="#333" stroke-width="3"/>
<path d="M 390 194 L 480 204" fill="none" stroke="#333" stroke-width="3"/>
<text x="392.0" y="152.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">equal-path fan: humps on</text>
<text x="392.0" y="164.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">the inner grooves</text>
<rect x="480.0" y="208.0" width="200.0" height="8.0" rx="0" fill="#d8b36a" stroke="#b58a2a" stroke-width="1.2"/>
<text x="480.0" y="234.0" font-size="9" fill="#8a6a20" text-anchor="start" font-weight="normal">contact strip on a fixed track</text>
<rect x="560.0" y="100.0" width="70.0" height="60.0" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<text x="565.0" y="94.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">feedless OTP applicator</text>
<circle cx="595.0" cy="70.0" r="16.0" fill="#fff" stroke="#b03030" stroke-width="2"/>
<text x="620.0" y="72.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">3-4 mm eccentric,</text>
<text x="620.0" y="84.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">NEMA 17 planetary</text>
<rect x="700.0" y="180.0" width="30.0" height="30.0" rx="0" fill="#fff" stroke="#222222" stroke-width="1.2"/>
<text x="700.0" y="226.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">wafer nest</text>
<text x="700.0" y="238.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">+ load cell</text>
<rect x="760.0" y="250.0" width="200.0" height="10.0" rx="0" fill="#eee" stroke="#888888" stroke-width="1.2"/>
<rect x="800.0" y="240.0" width="30.0" height="20.0" rx="0" fill="#e6f3ea" stroke="#2f7d4f" stroke-width="1.2"/>
<text x="760.0" y="280.0" font-size="9" fill="#2f7d4f" text-anchor="start" font-weight="normal">puller on a rail</text>
<text x="40.0" y="340.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">One end:</text>
<rect x="40.0" y="356.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="372.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">1 touch-off</text>
<text x="160.0" y="372.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">feed until every copper face touches the grounded stop; each reads through the hub</text>
<rect x="40.0" y="384.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="400.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">2 strip (p7)</text>
<text x="160.0" y="400.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">two razors across the webbed end; toothed pads carry the slug; one backlit frame</text>
<rect x="40.0" y="412.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="428.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">3 zip (a7)</text>
<text x="160.0" y="428.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">tines enter the slug's gaps and tear back to 1 mm short of the clamp face</text>
<rect x="40.0" y="440.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="456.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">4 fan</text>
<text x="160.0" y="456.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">equal-path grooves to 7.1 mm: every tip recedes the same 2.05 mm (4P)</text>
<rect x="40.0" y="468.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="484.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">5 dock</text>
<text x="160.0" y="484.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">drop onto the strip segment: all contacts at once; continuity to the carrier before force</text>
<rect x="40.0" y="496.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="512.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">6 crimp</text>
<text x="160.0" y="512.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">one contact per eccentric turn; pilot in the carrier slot; force curve</text>
<rect x="40.0" y="524.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="540.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">7 pull, shear</text>
<text x="160.0" y="540.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">20 N through each box against a blade comb; shear comb cuts every tab</text>
<rect x="40.0" y="552.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="568.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">8 insert, test</text>
<text x="160.0" y="568.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">closing block, V staircase of fronts; pin to pin through the hub</text>
<rect x="40.0" y="580.0" width="110.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="596.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">9 draw, cut</text>
<text x="160.0" y="596.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">puller draws the loom off; the cut squares the next end</text>
</svg>