<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p3 Terminate at the spool, cut last (schematic, side view)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">The spool is the carrier and the rest of the spool is the test lead. Nothing is cut until the XH end has passed.</text>
<circle cx="130.0" cy="260.0" r="90.0" fill="#f4f4f4" stroke="#888888" stroke-width="1.2"/>
<circle cx="130.0" cy="260.0" r="28.0" fill="#fff" stroke="#888888" stroke-width="1.2"/>
<rect x="118.0" y="248.0" width="24.0" height="24.0" rx="0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2"/>
<text x="60.0" y="380.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">spool (or 80 mm-hub reel): inner end -&gt;</text>
<text x="60.0" y="393.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">hub socket -&gt; slip ring -&gt; tester</text>
<path d="M 220 270 C 300 270, 300 200, 360 200" fill="none" stroke="#333" stroke-width="5"/>
<rect x="360.0" y="170.0" width="80.0" height="16.0" rx="8" fill="#bbb" stroke="#222222" stroke-width="1.2"/>
<rect x="360.0" y="214.0" width="80.0" height="16.0" rx="8" fill="#bbb" stroke="#222222" stroke-width="1.2"/>
<text x="350.0" y="160.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">belt feed + encoder</text>
<line x1="440.0" y1="200.0" x2="480.0" y2="200.0" stroke="#333" stroke-width="5"/>
<rect x="480.0" y="180.0" width="70.0" height="40.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="482.0" y="172.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">work clamp on X</text>
<rect x="560.0" y="230.0" width="10.0" height="40.0" rx="0" fill="#c77d10" stroke="#c77d10" stroke-width="1.2"/>
<text x="520.0" y="290.0" font-size="10" fill="#c77d10" text-anchor="start" font-weight="normal">guillotine at the</text>
<text x="520.0" y="303.0" font-size="10" fill="#c77d10" text-anchor="start" font-weight="normal">clamp face (cuts last)</text>
<rect x="580.0" y="90.0" width="250.0" height="70.0" rx="6" fill="#fff" stroke="#b03030" stroke-width="1.2"/>
<text x="588.0" y="110.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">strip (p7), split, fan; then per conductor a</text>
<text x="588.0" y="123.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">lift-once station: SN on its side (p1c) or</text>
<text x="588.0" y="136.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">fin from below (p1d); identity through the spool</text>
<line x1="640.0" y1="160.0" x2="600.0" y2="196.0" stroke="#b03030" stroke-width="1.2" marker-end="url(#arrr)"/>
<line x1="550.0" y1="200.0" x2="620.0" y2="200.0" stroke="#333" stroke-width="5"/>
<rect x="620.0" y="186.0" width="14.0" height="28.0" rx="0" fill="#fff" stroke="#222222" stroke-width="1.2"/>
<text x="612.0" y="236.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">XHP</text>
<rect x="560.0" y="330.0" width="400.0" height="12.0" rx="0" fill="#eee" stroke="#888888" stroke-width="1.2"/>
<rect x="640.0" y="318.0" width="40.0" height="24.0" rx="0" fill="#e6f3ea" stroke="#2f7d4f" stroke-width="1.2"/>
<line x1="680.0" y1="330.0" x2="900.0" y2="330.0" stroke="#2f7d4f" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="560.0" y="370.0" font-size="10" fill="#2f7d4f" text-anchor="start" font-weight="normal">puller: a belt carriage clips the ribbon just behind the housing and draws the loom</text>
<text x="560.0" y="383.0" font-size="10" fill="#2f7d4f" text-anchor="start" font-weight="normal">length out along the rail; the housing is never the handle</text>
<path d="M 634 214 C 660 260, 700 300, 700 420" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="6,4"/>
<rect x="680.0" y="420.0" width="40.0" height="60.0" rx="0" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="730.0" y="450.0" font-size="10" fill="#888888" text-anchor="start" font-weight="normal">drop-tube form (alternative</text>
<text x="730.0" y="463.0" font-size="10" fill="#888888" text-anchor="start" font-weight="normal">where bench front is short)</text>
<text x="40.0" y="520.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">Order at the machine, per ribbon end:</text>
<rect x="40.0" y="540.0" width="96.0" height="28.0" rx="4" fill="#fff" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="559.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">feed to stop</text>
<line x1="136.0" y1="554.0" x2="146.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="148.0" y="540.0" width="40.0" height="28.0" rx="4" fill="#fff" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="154.0" y="559.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">trim</text>
<line x1="188.0" y1="554.0" x2="198.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="200.0" y="540.0" width="103.0" height="28.0" rx="4" fill="#fff" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="206.0" y="559.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">strip + split</text>
<line x1="303.0" y1="554.0" x2="313.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="315.0" y="540.0" width="103.0" height="28.0" rx="4" fill="#fff" stroke="#b03030" stroke-width="1.2"/>
<text x="321.0" y="559.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">place + crimp</text>
<line x1="418.0" y1="554.0" x2="428.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="430.0" y="540.0" width="89.0" height="28.0" rx="4" fill="#fff" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="436.0" y="559.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">look / pull</text>
<line x1="519.0" y1="554.0" x2="529.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="531.0" y="540.0" width="124.0" height="28.0" rx="4" fill="#fff" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="537.0" y="559.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">insert (singles)</text>
<line x1="655.0" y1="554.0" x2="665.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="667.0" y="540.0" width="138.0" height="28.0" rx="4" fill="#fff" stroke="#2f7d4f" stroke-width="1.2"/>
<text x="673.0" y="559.0" font-size="10" fill="#2f7d4f" text-anchor="start" font-weight="normal">test through spool</text>
<line x1="805.0" y1="554.0" x2="815.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="817.0" y="540.0" width="82.0" height="28.0" rx="4" fill="#fff" stroke="#c77d10" stroke-width="1.2"/>
<text x="823.0" y="559.0" font-size="10" fill="#c77d10" text-anchor="start" font-weight="normal">pull out L</text>
<line x1="899.0" y1="554.0" x2="909.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="911.0" y="540.0" width="33.0" height="28.0" rx="4" fill="#fff" stroke="#c77d10" stroke-width="1.2"/>
<text x="917.0" y="559.0" font-size="10" fill="#c77d10" text-anchor="start" font-weight="normal">cut</text>
<line x1="944.0" y1="554.0" x2="954.0" y2="554.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="40.0" y="610.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">A bad crimp found at 'look' or 'test': cut ~6 mm back and go round again. It costs spool, never a loom, so no loom carries a redo reserve</text>
<text x="40.0" y="623.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">and a pair's two ribbons stay equal. Far ends (Fastons, ferrules, IDC) are made by hand after the cut, so the automated risk comes first.</text>
</svg>