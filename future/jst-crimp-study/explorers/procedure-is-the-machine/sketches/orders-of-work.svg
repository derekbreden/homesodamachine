<text x="20.0" y="490.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">The empty cavity is decided where the conductor is trimmed: in the cassette (a blank key), in the machine's program (skip), or by</text>
<text x="20.0" y="504.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">the person at the spool. In every order it is decided before insertion and checked at the test header after.</text>
