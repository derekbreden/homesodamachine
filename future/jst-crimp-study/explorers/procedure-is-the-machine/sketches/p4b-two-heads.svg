<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p4b Two heads, one person: the person's pace sets the rhythm (schematic timeline)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">Head cycle 26 s [estimate]; person presents 5 s and inserts 8 s. Numbers: calc/wave2.out.txt §4.</text>
