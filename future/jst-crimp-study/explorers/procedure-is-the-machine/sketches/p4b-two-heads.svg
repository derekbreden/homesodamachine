<text x="30.0" y="290.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">p = present conductor k to a head's funnel: its copper face touches the grounded tip stop, which reads identity before anything is cut.</text>
<text x="30.0" y="303.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">ins = insert a finished contact into its lit cavity on the sensing nest. 'locate contact' = the SN closes only to wing touch, so the wings stay open.</text>
<text x="30.0" y="316.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">With one head the person waits whenever the cycle is longer than present + insert; with two, a 26 s cycle leaves ~2-3 s of waiting per conductor.</text>
