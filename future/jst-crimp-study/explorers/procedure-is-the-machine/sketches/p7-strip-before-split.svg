<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<rect width="1000" height="700" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p7 Strip before split: one stroke takes the whole end's slug while the web still holds the pitch (schematic)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">Cross-section at the strip line (left), side section of the stroke (right), and the order. Numbers: calc/wave2.out.txt §7, calc/wave3.out.txt §5.</text>
<circle cx="86.0" cy="230.0" r="26.0" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="86.0" cy="230.0" r="11.0" fill="#d9a441" stroke="#b58a2a" stroke-width="1.2"/>
<circle cx="138.0" cy="230.0" r="26.0" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="138.0" cy="230.0" r="11.0" fill="#d9a441" stroke="#b58a2a" stroke-width="1.2"/>
<circle cx="190.0" cy="230.0" r="26.0" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="190.0" cy="230.0" r="11.0" fill="#d9a441" stroke="#b58a2a" stroke-width="1.2"/>
<circle cx="242.0" cy="230.0" r="26.0" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="242.0" cy="230.0" r="11.0" fill="#d9a441" stroke="#b58a2a" stroke-width="1.2"/>
<circle cx="294.0" cy="230.0" r="26.0" fill="#333" stroke="#333" stroke-width="1.2"/>
<circle cx="294.0" cy="230.0" r="11.0" fill="#d9a441" stroke="#b58a2a" stroke-width="1.2"/>
<rect x="40.0" y="164.0" width="300.0" height="48.9" rx="0" fill="#cfd8e6" stroke="#2a5d9f" stroke-width="1.2" fill-opacity="0.8"/>
<rect x="40.0" y="247.1" width="300.0" height="48.9" rx="0" fill="#cfd8e6" stroke="#2a5d9f" stroke-width="1.2" fill-opacity="0.8"/>
<text x="40.0" y="156.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">upper blade across the ribbon, stops at +zs</text>
<text x="40.0" y="314.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">lower blade, rising through the floor joint, stops at -zs</text>
<line x1="350.0" y1="212.9" x2="350.0" y2="247.1" stroke="#b03030" stroke-width="1.2" marker-end="url(#arrr)" marker-start="url(#arrr)"/>
<text x="356.0" y="234.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">band left to tear:</text>
<text x="356.0" y="247.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">|z| &lt; zs = strand radius</text>
<text x="356.0" y="260.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">+ 0.2-0.3 mm</text>
<text x="60.0" y="346.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">Straight edges cut every crown at one height, so pitch error does not move</text>
<text x="60.0" y="359.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">the cut toward any strands.</text>
<text x="560.0" y="90.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">Side section of one conductor</text>
<rect x="560.0" y="260.0" width="150.0" height="14.0" rx="0" fill="#ddd" stroke="#888888" stroke-width="1.2"/>
<text x="560.0" y="292.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">fixed floor (clamp)</text>
<rect x="714.0" y="260.0" width="120.0" height="14.0" rx="0" fill="#e6f3ea" stroke="#2f7d4f" stroke-width="1.2"/>
<text x="714.0" y="292.0" font-size="9" fill="#2f7d4f" text-anchor="start" font-weight="normal">carriage floor (split floor),</text>
<text x="714.0" y="304.0" font-size="9" fill="#2f7d4f" text-anchor="start" font-weight="normal">carrying the lower pad</text>
<rect x="560.0" y="210.0" width="60.0" height="20.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="564.0" y="204.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">clamp</text>
<rect x="560.0" y="235.0" width="240.0" height="22.0" rx="0" fill="#333" stroke="#333" stroke-width="1.2"/>
<rect x="560.0" y="242.0" width="240.0" height="8.0" rx="0" fill="#d9a441" stroke="#b58a2a" stroke-width="1.2"/>
<line x1="712.0" y1="200.0" x2="712.0" y2="237.0" stroke="#2a5d9f" stroke-width="3"/>
<line x1="712.0" y1="290.0" x2="712.0" y2="255.0" stroke="#2a5d9f" stroke-width="3"/>
<text x="670.0" y="190.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">blades at the strip line,</text>
<text x="670.0" y="202.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">2.4 mm from the cut</text>
<rect x="730.0" y="222.0" width="60.0" height="12.0" rx="0" fill="#fbf1e2" stroke="#c77d10" stroke-width="1.2"/>
<rect x="730.0" y="258.0" width="60.0" height="0.1" rx="0" fill="#fbf1e2" stroke="#c77d10" stroke-width="1.2"/>
<text x="730.0" y="216.0" font-size="9" fill="#c77d10" text-anchor="start" font-weight="normal">toothed pads bite the slug</text>
<line x1="800.0" y1="310.0" x2="860.0" y2="310.0" stroke="#2f7d4f" stroke-width="2" marker-end="url(#arr)"/>
<text x="760.0" y="330.0" font-size="9" fill="#2f7d4f" text-anchor="start" font-weight="normal">carriage +Y 3-4 mm: blades,</text>
<text x="760.0" y="342.0" font-size="9" fill="#2f7d4f" text-anchor="start" font-weight="normal">pads and floor push the slug off</text>
<line x1="860.0" y1="170.0" x2="890.0" y2="170.0" stroke="#b03030" stroke-width="1.2" marker-end="url(#arrr)"/>
<text x="810.0" y="150.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">each blade slices 2-4 mm</text>
<text x="810.0" y="162.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">along its edge as it closes</text>
<text x="560.0" y="370.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">Pads must grip the jacket harder than the jacket grips the strands:</text>
<text x="560.0" y="383.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">smooth TPU 32-132 N per side on a 5P, grippy 11-44 N, toothed 6-25 N</text>
<text x="560.0" y="396.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">[calc wave3 §5]. The blades' faces alone would crush the cut caps.</text>
<text x="40.0" y="470.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">The order at the clamp</text>
<rect x="40.0" y="486.0" width="120.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="502.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">1 flush cut</text>
<text x="170.0" y="502.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">at the clamp face (at a reel, the previous loom's cut)</text>
<rect x="40.0" y="516.0" width="120.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="532.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">2 strip, webbed</text>
<text x="170.0" y="532.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">pads close, blades slice to their stops, the carriage pushes the whole slug off</text>
<rect x="40.0" y="546.0" width="120.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="562.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">3 look</text>
<text x="170.0" y="562.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">one backlit frame: every bare length and insulation edge on one line</text>
<rect x="40.0" y="576.0" width="120.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="592.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">4 split</text>
<text x="170.0" y="592.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">wedge or razor comb enters the slug's gap; the tear stops at the clamp face</text>
<rect x="40.0" y="606.0" width="120.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="622.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">5 fan</text>
<text x="170.0" y="622.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">by the insulation; fronts recede 0.05-0.31 mm by the fan's shape</text>
<rect x="40.0" y="636.0" width="120.0" height="24.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="46.0" y="652.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="bold">6 crimp</text>
<text x="170.0" y="652.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">any crimp station; the edge was measured in step 3</text>
</svg>