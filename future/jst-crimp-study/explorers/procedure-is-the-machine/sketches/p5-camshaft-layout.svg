<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p5 Camshaft: one motor, one revolution per conductor (schematic)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">The shaft runs above the work. Printed face cams drive the light motions down to the work point; a steel eccentric drives the punch onto a stepped fin.</text>
<rect x="40.0" y="100.0" width="70.0" height="60.0" rx="0" fill="#ccc" stroke="#222222" stroke-width="1.2"/>
<text x="40.0" y="178.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">gearmotor or</text>
<text x="40.0" y="191.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">NEMA 17 planetary</text>
<text x="40.0" y="204.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">(1.0-2.3 N*m peak)</text>
<line x1="110.0" y1="130.0" x2="960.0" y2="130.0" stroke="#222222" stroke-width="6"/>
<circle cx="170.0" cy="130.0" r="20.0" fill="#fff" stroke="#888888" stroke-width="2"/>
<line x1="170.0" y1="150.0" x2="170.0" y2="360.0" stroke="#888888" stroke-width="2"/>
<circle cx="170.0" cy="150.0" r="4.0" fill="#888888" stroke="#888888" stroke-width="1.2"/>
<text x="144.0" y="100.0" font-size="9" fill="#888888" text-anchor="start" font-weight="normal">index pawl</text>
<circle cx="232.0" cy="130.0" r="20.0" fill="#fff" stroke="#2a5d9f" stroke-width="2"/>
<line x1="232.0" y1="150.0" x2="232.0" y2="360.0" stroke="#2a5d9f" stroke-width="2"/>
<circle cx="232.0" cy="150.0" r="4.0" fill="#2a5d9f" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="206.0" y="100.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">presser</text>
<circle cx="294.0" cy="130.0" r="20.0" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
<line x1="294.0" y1="150.0" x2="294.0" y2="360.0" stroke="#2f7d4f" stroke-width="2"/>
<circle cx="294.0" cy="150.0" r="4.0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2"/>
<text x="268.0" y="100.0" font-size="9" fill="#2f7d4f" text-anchor="start" font-weight="normal">V-fork</text>
<circle cx="356.0" cy="130.0" r="20.0" fill="#fff" stroke="#c77d10" stroke-width="2"/>
<line x1="356.0" y1="150.0" x2="356.0" y2="360.0" stroke="#c77d10" stroke-width="2"/>
<circle cx="356.0" cy="150.0" r="4.0" fill="#c77d10" stroke="#c77d10" stroke-width="1.2"/>
<text x="330.0" y="100.0" font-size="9" fill="#c77d10" text-anchor="start" font-weight="normal">strip jaws</text>
<circle cx="418.0" cy="130.0" r="20.0" fill="#fff" stroke="#c77d10" stroke-width="2"/>
<line x1="418.0" y1="150.0" x2="418.0" y2="360.0" stroke="#c77d10" stroke-width="2"/>
<circle cx="418.0" cy="150.0" r="4.0" fill="#c77d10" stroke="#c77d10" stroke-width="1.2"/>
<text x="392.0" y="100.0" font-size="9" fill="#c77d10" text-anchor="start" font-weight="normal">strip pull</text>
<circle cx="480.0" cy="130.0" r="20.0" fill="#fff" stroke="#2a5d9f" stroke-width="2"/>
<line x1="480.0" y1="150.0" x2="480.0" y2="360.0" stroke="#2a5d9f" stroke-width="2"/>
<circle cx="480.0" cy="150.0" r="4.0" fill="#2a5d9f" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="454.0" y="100.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">lay-in</text>
<circle cx="742.0" cy="130.0" r="20.0" fill="#fff" stroke="#b03030" stroke-width="2"/>
<line x1="742.0" y1="150.0" x2="742.0" y2="360.0" stroke="#b03030" stroke-width="2"/>
<circle cx="742.0" cy="150.0" r="4.0" fill="#b03030" stroke="#b03030" stroke-width="1.2"/>
<text x="716.0" y="100.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">revolver pawl:</text>
<text x="716.0" y="112.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">cut-free contact</text>
<circle cx="804.0" cy="130.0" r="20.0" fill="#fff" stroke="#2f7d4f" stroke-width="2"/>
<line x1="804.0" y1="150.0" x2="804.0" y2="360.0" stroke="#2f7d4f" stroke-width="2"/>
<circle cx="804.0" cy="150.0" r="4.0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2"/>
<text x="778.0" y="100.0" font-size="9" fill="#2f7d4f" text-anchor="start" font-weight="normal">hook pull</text>
<rect x="150.0" y="360.0" width="400.0" height="36.0" rx="0" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="158.0" y="382.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">followers and levers reach the work point (printed PET-CF cams, forces under ~50 N)</text>
<circle cx="650.0" cy="130.0" r="36.0" fill="#eee" stroke="#b03030" stroke-width="2"/>
<text x="610.0" y="82.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">PUNCH: steel eccentric,</text>
<text x="610.0" y="94.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">e 2.5 mm, rod 40 mm</text>
<line x1="650.0" y1="166.0" x2="650.0" y2="230.0" stroke="#b03030" stroke-width="3"/>
<path d="M 650 230 l 10 6 l -20 6 l 20 6 l -20 6 l 10 6" fill="none" stroke="#b03030" stroke-width="2"/>
<line x1="650.0" y1="260.0" x2="650.0" y2="290.0" stroke="#b03030" stroke-width="3"/>
<text x="668.0" y="238.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">optional rod spring (one or two DIN 2093</text>
<text x="668.0" y="250.0" font-size="9" fill="#b03030" text-anchor="start" font-weight="normal">discs, not preloaded) if the frame is stiff</text>
<rect x="610.0" y="290.0" width="80.0" height="40.0" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<text x="630.0" y="315.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">punch</text>
<rect x="632.0" y="330.0" width="22.0" height="10.0" rx="0" fill="none" stroke="#b03030" stroke-width="1.2"/>
<rect x="620.0" y="342.0" width="38.0" height="90.0" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<rect x="658.0" y="342.0" width="14.0" height="90.0" rx="0" fill="#c9ccd1" stroke="#222222" stroke-width="1.2"/>
<text x="620.0" y="450.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">stepped fin with the</text>
<text x="620.0" y="462.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">cut-free contact on it</text>
<rect x="700.0" y="300.0" width="20.0" height="40.0" rx="0" fill="#aab" stroke="#222222" stroke-width="1.2"/>
<rect x="700.0" y="342.0" width="20.0" height="40.0" rx="0" fill="#aab" stroke="#222222" stroke-width="1.2"/>
<text x="726.0" y="344.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">stop blocks: crimp height</text>
<text x="726.0" y="356.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">(a short steel loop)</text>
<rect x="580.0" y="482.0" width="170.0" height="12.0" rx="0" fill="#fbf1e2" stroke="#c77d10" stroke-width="1.2"/>
<text x="580.0" y="510.0" font-size="9" fill="#c77d10" text-anchor="start" font-weight="normal">force sensed under fin holder + stops together</text>
<text x="40.0" y="540.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">The outer frame may be springy (5-10 kN/mm): the eccentric is set to push a margin m past the stops, which costs k x m, 1.05-1.4x the crimp,</text>
<text x="40.0" y="553.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">and caps a doubled contact at 3.9-5.4 kN [calc wave3 §4]. Skip (J2's key 3): a bump on the cassette rack holds the contact pawl clear and pulls</text>
<text x="40.0" y="566.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">the punch link pin for one turn. p5c replaces the eccentric, stops and fin with a knee in a small steel C.</text>
</svg>