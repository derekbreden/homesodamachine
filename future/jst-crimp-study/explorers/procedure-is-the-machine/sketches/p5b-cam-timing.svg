<text x="528.7" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">120</text>
<line x1="588.3" y1="76.0" x2="588.3" y2="84.0" stroke="#222222" stroke-width="1.2"/>
<text x="580.3" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">150</text>
<line x1="640.0" y1="76.0" x2="640.0" y2="84.0" stroke="#222222" stroke-width="1.2"/>
<text x="632.0" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">180</text>
<line x1="691.7" y1="76.0" x2="691.7" y2="84.0" stroke="#222222" stroke-width="1.2"/>
<text x="683.7" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">210</text>
<line x1="743.3" y1="76.0" x2="743.3" y2="84.0" stroke="#222222" stroke-width="1.2"/>
<text x="735.3" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">240</text>
<line x1="795.0" y1="76.0" x2="795.0" y2="84.0" stroke="#222222" stroke-width="1.2"/>
<text x="787.0" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">270</text>
<line x1="846.7" y1="76.0" x2="846.7" y2="84.0" stroke="#222222" stroke-width="1.2"/>
<text x="838.7" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">300</text>
<line x1="898.3" y1="76.0" x2="898.3" y2="84.0" stroke="#222222" stroke-width="1.2"/>
<text x="890.3" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">330</text>
<line x1="950.0" y1="76.0" x2="950.0" y2="84.0" stroke="#222222" stroke-width="1.2"/>
<text x="942.0" y="72.0" font-size="9" fill="#222222" text-anchor="start" font-weight="normal">360</text>
<text x="20.0" y="116.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">index cassette</text>
<rect x="330.0" y="104.0" width="34.4" height="16.0" rx="0" fill="#888888" stroke="#888888" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="144.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">lift key k by a + 2.7 mm</text>
<rect x="364.4" y="132.0" width="51.7" height="16.0" rx="0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="172.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">post wheel turns one post</text>
<rect x="398.9" y="160.0" width="51.7" height="16.0" rx="0" fill="#c77d10" stroke="#c77d10" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="200.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">Y cam: open jaws over the contact on its post</text>
<rect x="433.3" y="188.0" width="51.7" height="16.0" rx="0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="228.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">squeeze lobe: approach to just short of wing touch</text>
<rect x="450.6" y="216.0" width="68.9" height="16.0" rx="0" fill="#2a5d9f" stroke="#2a5d9f" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="256.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">flap blade drops into the neck</text>
<rect x="502.2" y="244.0" width="25.8" height="16.0" rx="0" fill="#c77d10" stroke="#c77d10" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="284.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">Y cam: contact off its post, onto k</text>
<rect x="519.4" y="272.0" width="86.1" height="16.0" rx="0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="312.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">lobe to the end of the curl; PAUSE, identity</text>
<rect x="605.6" y="300.0" width="25.8" height="16.0" rx="0" fill="#2a5d9f" stroke="#2a5d9f" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="340.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">squeeze lobe: crimp (last 8 mm of grip)</text>
<rect x="631.4" y="328.0" width="103.3" height="16.0" rx="0" fill="#b03030" stroke="#b03030" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="368.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">ratchet completes and releases; lobe falls</text>
<rect x="734.7" y="356.0" width="25.8" height="16.0" rx="0" fill="#2a5d9f" stroke="#2a5d9f" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="396.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">RELEASE CHECK: pawl switch, or the shaft stops</text>
<rect x="760.6" y="384.0" width="8.6" height="16.0" rx="0" fill="#b03030" stroke="#b03030" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="424.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">Y back 0.5 mm against a 20 N spring: pull</text>
<rect x="769.2" y="412.0" width="51.7" height="16.0" rx="0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="452.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">flap lifts; jaws open fully</text>
<rect x="820.8" y="440.0" width="25.8" height="16.0" rx="0" fill="#c77d10" stroke="#c77d10" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="480.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">lift lowers k; presser squares the crimp</text>
<rect x="846.7" y="468.0" width="60.3" height="16.0" rx="0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="508.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">camera frame; switch cam</text>
<rect x="906.9" y="496.0" width="43.1" height="16.0" rx="0" fill="#888888" stroke="#888888" stroke-width="1.2" fill-opacity="0.35"/>
<text x="20.0" y="544.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">Trim and strip happen before the camshaft (bench A in the same pose, or p7). A skip bump on the rack holds the post-wheel pawl and the squeeze</text>
<text x="20.0" y="557.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">follower off for J2's key 3; the end bump stops the shaft. A 30-35 mm split: the lift leaves 0-8 mm of rise until squared [calc wave3 §1].</text>
</svg>