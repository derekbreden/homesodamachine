<text x="40.0" y="750.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">One key: index - lift 3.5 mm - trim (grounded blade: identity) - strip in the pose or after p7 - look (backlit silhouette) - post bar slides the open contact on -</text>
<text x="40.0" y="763.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">fin up, gate in - knee to the end of the curl, pause (identity through the C) - knee to straight - re-touch, indicator reads height - clear - hook pulls 20 N</text>
<text x="40.0" y="776.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">through the box - lay back and square. 55-76 s a key; J1 8-11 min [calc wave3 §6].</text>
<text x="40.0" y="820.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">'Fixed' for position: bench B's frame. 'Fixed' for crimp height: the steel C alone (knee at straight + gate wedge; +/-1.5-6 um of scatter at 100-200 kN/mm).</text>
<text x="40.0" y="833.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">Only the fin passes through the row plane, so k rises 3.5 mm; at 25 mm free it keeps 0-0.05 mm of set [calc wave3 §1].</text>
