<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<rect width="980" height="560" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p4 The person presents, the machine takes (schematic, side view)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">A shoebox station: the tip is the reference; the machine grips the conductor itself, strips, places and crimps.</text>
<rect x="300.0" y="120.0" width="520.0" height="220.0" rx="8" fill="#fafafa" stroke="#888888" stroke-width="1.2"/>
<path d="M 300 170 L 360 205 L 360 215 L 300 250 Z" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.2"/>
<text x="250.0" y="160.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">funnel</text>
<path d="M 60 260 C 150 260, 200 210, 300 210" fill="none" stroke="#111" stroke-width="6"/>
<line x1="300.0" y1="210.0" x2="560.0" y2="210.0" stroke="#111" stroke-width="6"/>
<text x="60.0" y="285.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">person holds the loom,</text>
<text x="60.0" y="298.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">conductor k splayed by hand</text>
<rect x="390.0" y="190.0" width="50.0" height="40.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="380.0" y="182.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">soft clamp</text>
<text x="380.0" y="195.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">(closes on trigger)</text>
<line x1="415.0" y1="250.0" x2="470.0" y2="250.0" stroke="#2a5d9f" stroke-width="1.2" marker-end="url(#arrb)"/>
<text x="420.0" y="268.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">clamp slides: pull slug,</text>
<text x="420.0" y="280.0" font-size="9" fill="#2a5d9f" text-anchor="start" font-weight="normal">then feed into contact</text>
<rect x="520.0" y="180.0" width="16.0" height="26.0" rx="0" fill="#c77d10" stroke="#c77d10" stroke-width="1.2"/>
<rect x="520.0" y="214.0" width="16.0" height="26.0" rx="0" fill="#c77d10" stroke="#c77d10" stroke-width="1.2"/>
<text x="505.0" y="172.0" font-size="10" fill="#c77d10" text-anchor="start" font-weight="normal">V strip jaws</text>
<rect x="585.0" y="196.0" width="6.0" height="28.0" rx="0" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2"/>
<text x="560.0" y="250.0" font-size="10" fill="#2f7d4f" text-anchor="start" font-weight="normal">tip stop +</text>
<text x="560.0" y="263.0" font-size="10" fill="#2f7d4f" text-anchor="start" font-weight="normal">break beam</text>
<rect x="640.0" y="240.0" width="120.0" height="30.0" rx="0" fill="#ccc" stroke="#222222" stroke-width="1.2"/>
<rect x="640.0" y="150.0" width="120.0" height="40.0" rx="0" fill="#ccc" stroke="#222222" stroke-width="1.2"/>
<text x="650.0" y="145.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">punch (slow ram)</text>
<text x="650.0" y="290.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">anvil + pre-fed contact</text>
<path d="M 650 240 L 650 228 L 750 228 L 750 240" fill="none" stroke="#b03030" stroke-width="2"/>
<line x1="590.0" y1="330.0" x2="640.0" y2="245.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
<text x="470.0" y="360.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">stop and jaws swing clear; the anvil shuttle brings the waiting contact under the tip</text>
<text x="40.0" y="410.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">The person and the machine, one conductor apart:</text>
<rect x="40.0" y="425.0" width="60.0" height="22.0" rx="0" fill="#f7f1e6" stroke="#c77d10" stroke-width="1.2"/>
<text x="46.0" y="440.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">present k</text>
<rect x="100.0" y="425.0" width="90.0" height="22.0" rx="0" fill="#f7f1e6" stroke="#c77d10" stroke-width="1.2"/>
<text x="106.0" y="440.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal">insert k-1</text>
<rect x="190.0" y="425.0" width="160.0" height="22.0" rx="0" fill="#fff" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="196.0" y="440.0" font-size="10" fill="#777" text-anchor="start" font-weight="normal">waits (or far-end work)</text>
<rect x="100.0" y="455.0" width="250.0" height="22.0" rx="0" fill="#fbeaea" stroke="#b03030" stroke-width="1.2"/>
<text x="106.0" y="470.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">machine: grip, strip, place, crimp, look (~40 s)</text>
<text x="380.0" y="440.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">The person's hands never hold the contact. The machine's cycle, not the person, sets the</text>
<text x="380.0" y="454.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">pace; minutes fall only when the machine can be fed an end's worth at once (p1).</text>
</svg>