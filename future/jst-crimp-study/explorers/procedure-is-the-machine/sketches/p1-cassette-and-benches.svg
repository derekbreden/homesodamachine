<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03030"/></marker></defs>
<rect width="980" height="700" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222222">p1 Cassette and benches (schematic)</text>
<text x="20.0" y="47.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">One printed cassette carries a ribbon end from the person's hands through every bench. Each bench is useful alone; the cassette's pins are the only shared reference.</text>
<text x="40.0" y="80.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">The cassette, plan view (J1: 5P + 4P into keys 1-9)</text>
<rect x="40.0" y="115.0" width="120.0" height="170.0" rx="0" fill="#f4f4f4" stroke="#888888" stroke-width="1.2"/>
<text x="48.0" y="135.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">tail tray:</text>
<text x="48.0" y="149.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">loom coiled</text>
<text x="48.0" y="163.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">flat, 100-600 mm</text>
<rect x="160.0" y="155.0" width="120.0" height="34.0" rx="0" fill="#333" stroke="#333" stroke-width="1.2"/>
<text x="190.0" y="176.0" font-size="11" fill="#fff" text-anchor="start" font-weight="normal">5P</text>
<rect x="160.0" y="191.0" width="120.0" height="27.2" rx="0" fill="#333" stroke="#333" stroke-width="1.2"/>
<text x="190.0" y="208.6" font-size="11" fill="#fff" text-anchor="start" font-weight="normal">4P</text>
<rect x="240.0" y="140.0" width="60.0" height="100.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="244.0" y="135.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">ribbon clamp</text>
<text x="244.0" y="148.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">(cam lever, TPU pads)</text>
<line x1="240.0" y1="241.0" x2="510.0" y2="241.0" stroke="#b03030" stroke-width="3"/>
<text x="330.0" y="257.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">datum wall: ribbon edge + cassette pins</text>
<rect x="300.0" y="140.0" width="110.0" height="100.0" rx="0" fill="#fbfbfb" stroke="#888888" stroke-width="1.2"/>
<text x="312.0" y="135.0" font-size="10" fill="#555" text-anchor="start" font-weight="normal">fan plate + lid</text>
<path d="M 300 157.0 C 350 157.0, 360 147.0, 410 147.0" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="147.0" x2="510.0" y2="147.0" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="151.0" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 1</text>
<path d="M 300 164.2 C 350 164.2, 360 157.5, 410 157.5" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="157.5" x2="510.0" y2="157.5" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="161.5" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 2</text>
<path d="M 300 171.4 C 350 171.4, 360 168.0, 410 168.0" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="168.0" x2="510.0" y2="168.0" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="172.0" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 3</text>
<path d="M 300 178.6 C 350 178.6, 360 178.5, 410 178.5" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="178.5" x2="510.0" y2="178.5" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="182.5" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 4</text>
<path d="M 300 185.8 C 350 185.8, 360 189.0, 410 189.0" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="189.0" x2="510.0" y2="189.0" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="193.0" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 5</text>
<path d="M 300 193.0 C 350 193.0, 360 199.5, 410 199.5" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="199.5" x2="510.0" y2="199.5" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="203.5" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 6</text>
<path d="M 300 200.2 C 350 200.2, 360 210.0, 410 210.0" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="210.0" x2="510.0" y2="210.0" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="214.0" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 7</text>
<path d="M 300 207.4 C 350 207.4, 360 220.5, 410 220.5" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="220.5" x2="510.0" y2="220.5" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="224.5" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 8</text>
<path d="M 300 214.6 C 350 214.6, 360 231.0, 410 231.0" fill="none" stroke="#333" stroke-width="2.2"/>
<line x1="410.0" y1="231.0" x2="510.0" y2="231.0" stroke="#333" stroke-width="2.2"/>
<text x="516.0" y="235.0" font-size="9" fill="#555" text-anchor="start" font-weight="normal">key 9</text>
<rect x="410.0" y="140.0" width="30.0" height="100.0" rx="0" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.5"/>
<text x="404.0" y="273.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">comb at 2.5 mm</text>
<text x="404.0" y="286.0" font-size="10" fill="#2a5d9f" text-anchor="start" font-weight="normal">(steel pins in print)</text>
<line x1="495.0" y1="135.0" x2="495.0" y2="245.0" stroke="#b03030" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="470.0" y="125.0" font-size="10" fill="#b03030" text-anchor="start" font-weight="normal">trim line</text>
<circle cx="425.0" cy="125.0" r="6.0" fill="#fff" stroke="#b03030" stroke-width="2"/>
<circle cx="425.0" cy="255.0" r="6.0" fill="#fff" stroke="#b03030" stroke-width="2"/>
<text x="580.0" y="155.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">Cassette pins (2 dowel bores or 3 V-grooves) are the reference</text>
<text x="580.0" y="169.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">every bench locates to. The person's placement is loose; the</text>
<text x="580.0" y="183.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">first machine operation is a trim against the cassette's own</text>
<text x="580.0" y="197.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">blade guide, which turns loose lengths into one line.</text>
<text x="580.0" y="211.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal"></text>
<text x="580.0" y="225.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">J2: key 3 is blanked by a printed plug, so a conductor</text>
<text x="580.0" y="239.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">cannot be laid there. J4, J7: the crossing is made here, by</text>
<text x="580.0" y="253.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">the person, in a raised loft over the fan plate.</text>
<text x="580.0" y="267.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal"></text>
<text x="580.0" y="281.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">An ID (printed code or pin pattern) tells each bench which</text>
<text x="580.0" y="295.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">loom it holds: conductor count, blank keys, strip program.</text>
<text x="40.0" y="382.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">The benches: a person carries cassettes between them (or p1b's carousel does)</text>
<rect x="40.0" y="400.0" width="190.0" height="130.0" rx="6" fill="#f7f1e6" stroke="#c77d10" stroke-width="1.8"/>
<text x="50.0" y="422.0" font-size="13" fill="#c77d10" text-anchor="start" font-weight="bold">Load</text>
<text x="50.0" y="438.0" font-size="13" fill="#c77d10" text-anchor="start" font-weight="bold">(person)</text>
<text x="50.0" y="448.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">cut ribbon square,</text>
<text x="50.0" y="462.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">peel web ~30 mm,</text>
<text x="50.0" y="476.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">lay conductors in keys,</text>
<text x="50.0" y="490.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">close clamp</text>
<line x1="232.0" y1="465.0" x2="272.0" y2="465.0" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="275.0" y="400.0" width="190.0" height="130.0" rx="6" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.8"/>
<text x="285.0" y="422.0" font-size="13" fill="#2a5d9f" text-anchor="start" font-weight="bold">A  Trim + strip</text>
<text x="285.0" y="448.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">guillotine along</text>
<text x="285.0" y="462.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">cassette face;</text>
<text x="285.0" y="476.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">strip each key</text>
<text x="285.0" y="490.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">(2.4 mm)</text>
<line x1="467.0" y1="465.0" x2="507.0" y2="465.0" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="510.0" y="400.0" width="190.0" height="130.0" rx="6" fill="#fbeaea" stroke="#b03030" stroke-width="1.8"/>
<text x="520.0" y="422.0" font-size="13" fill="#b03030" text-anchor="start" font-weight="bold">B  Place + crimp</text>
<text x="520.0" y="448.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">index key k over anvil;</text>
<text x="520.0" y="462.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">presser drops the rest;</text>
<text x="520.0" y="476.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">lay k into waiting</text>
<text x="520.0" y="490.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">contact; slow punch</text>
<line x1="702.0" y1="465.0" x2="742.0" y2="465.0" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="745.0" y="400.0" width="190.0" height="130.0" rx="6" fill="#e8eef7" stroke="#2a5d9f" stroke-width="1.8"/>
<text x="755.0" y="422.0" font-size="13" fill="#2a5d9f" text-anchor="start" font-weight="bold">C  Insert + test</text>
<text x="755.0" y="448.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">housing nest in front;</text>
<text x="755.0" y="462.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">contacts pushed home;</text>
<text x="755.0" y="476.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">mate onto test header;</text>
<text x="755.0" y="490.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">label</text>
<text x="40.0" y="560.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">Build order (each step useful alone):</text>
<text x="52.0" y="582.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">1  cassette + hand tools: pin order and J2's blank enforced by the cassette; SN-2549 by hand</text>
<text x="52.0" y="600.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">2  bench B: the priority step automated; person trims/strips with a hand jig, inserts by hand</text>
<text x="52.0" y="618.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">3  bench A: strip joins (or moves onto bench B's slide as a second station)</text>
<text x="52.0" y="636.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">4  bench C: insertion and a test header; the person's per-conductor work is gone</text>
<text x="52.0" y="654.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal">5  joined: carousel (p1b) or an arm moves cassettes; each bench's nest takes them unchanged</text>
</svg>