<rect x="890.0" y="80.0" width="400.0" height="700.0" rx="0" fill="none" fill-opacity="1.0" stroke="#ccc" stroke-width="1.2"/>
<text x="904.0" y="104.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">One conductor</text>
<text x="904.0" y="130.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1  Fetch: pin up into the bottom stub's pilot hole;</text>
<text x="904.0" y="145.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   drag it out of the magazine (drag feeder).</text>
<text x="904.0" y="160.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2  Load: carry the contact in 1 mm above the anvil,</text>
<text x="904.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   then set it down; the flap drops into the neck.</text>
<text x="904.0" y="190.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3  Hold: pusher closes to a small force rise.</text>
<text x="904.0" y="205.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">4  Shear: a servo blade slides down the die's rear</text>
<text x="904.0" y="220.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   face and cuts the tab before any wire arrives.</text>
<text x="904.0" y="235.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">5  Look: backlit picture of conductor k's tip;</text>
<text x="904.0" y="250.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   splayed tips go to a twist or a question.</text>
<text x="904.0" y="265.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">6  Present: fork stands k out by a + 2.7 mm onto</text>
<text x="904.0" y="280.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   the nest axis, corrected from the picture.</text>
<text x="904.0" y="295.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">7  Feed: Y creeps until green (or a set distance</text>
<text x="904.0" y="310.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   from the tip plate); only conductor k may read.</text>
<text x="904.0" y="325.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">8  Crimp: full stroke, run whole on the ESP32.</text>
<text x="904.0" y="340.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">9  Open; side frame, including the window.</text>
<text x="904.0" y="355.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">10 Lift 1-1.7 mm, then draw back (lance clear).</text>
<text x="904.0" y="370.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">11 Proof pull at the pull slot: ~20 N on the</text>
<text x="904.0" y="385.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   clamp's load cell, box's rear walls on steel.</text>
<text x="904.0" y="400.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">12 Fork lays k back in the comb; index, or skip</text>
<text x="904.0" y="415.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   J2 cavity 3 / J7's trimmed conductor.</text>
<text x="904.0" y="430.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="904.0" y="445.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">~90-100 s per crimp, ~80-90 min per unit [calc 10].</text>
<text x="904.0" y="460.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="904.0" y="475.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Force of the crimp stays inside the tool head.</text>
<text x="904.0" y="490.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">The carriage sees: a few N carrying the contact,</text>
<text x="904.0" y="505.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">a touch on the blade or tip plate, the 20 N pull.</text>
<text x="904.0" y="520.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="904.0" y="535.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Carriage: three short rails + NEMA 17s, or a</text>
<text x="904.0" y="550.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">bed-slinger printer (bed = tool on Y,</text>
<text x="904.0" y="565.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">head = ribbon in X and Z).</text>
</svg>