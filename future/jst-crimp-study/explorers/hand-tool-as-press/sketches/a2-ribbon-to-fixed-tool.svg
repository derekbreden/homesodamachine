<text x="16.0" y="28.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">A2  The ribbon comes to a fixed tool (schematic, plan view)</text>
<text x="16.0" y="48.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">The tool never moves. The head (X across conductors, Y along the nest axis, Z height) fetches a stub, loads it, then presents one conductor at a time.</text>
