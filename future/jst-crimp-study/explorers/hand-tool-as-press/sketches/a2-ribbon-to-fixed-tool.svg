<text x="500.0" y="741.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">box's rear walls, lance relieved;</text>
<text x="500.0" y="754.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">tip plate (grounded) + backlight</text>
