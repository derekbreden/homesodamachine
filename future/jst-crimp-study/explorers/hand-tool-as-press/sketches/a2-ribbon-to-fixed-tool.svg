<text x="332.0" y="400.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">fork (servo) holds conductor k, 3-8 mm behind the rear face</text>
<text x="332.0" y="440.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="normal" font-style="normal">neighbours stay in the comb: k stands out by a + 2.7 mm (8.7-14.7)</text>
<text x="332.0" y="454.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="normal" font-style="normal">a = jaw-half depth, unmeasured; copper sets at R 9-47 mm [calc w3 2]</text>
