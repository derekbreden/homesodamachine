<text x="40.0" y="520.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Z lowers conductor k to amber (strands on the contact), then green (at the blade in the neck).</text>
<text x="40.0" y="533.6" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">The crimp moves 1-1.7 mm sideways off the anvil before Z draws it up and out.</text>
<text x="40.0" y="547.3" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Stand-out once neighbours carry crimps: a + 2.7 mm = 8.7-14.7 mm [calc w3 2].</text>
<text x="40.0" y="561.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Pre-formed contacts (a6b) stack nose to tail: a loom-order stick can replace the revolver.</text>
