<text x="16.0" y="28.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">A2b  The tool lies flat: contacts drop into the nest, the ribbon hangs into them (schematic side view)</text>
<text x="16.0" y="48.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">The nest axis is vertical: the jaw's rear face is on top, the front face (box side) underneath.</text>
