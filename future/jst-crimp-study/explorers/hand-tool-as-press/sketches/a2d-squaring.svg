<rect width="100%" height="100%" fill="#fcfcf8"/>
<text x="16.0" y="28.0" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">A2d  Lay the crimped row into a squaring comb, square it, push the housing onto it (schematic plan)</text>
<text x="16.0" y="48.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Z out of the page. The head lays each crimped conductor into its pocket in pin-map order; crossings last, over the top.</text>
