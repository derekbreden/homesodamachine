<rect x="820.0" y="305.0" width="200.0" height="80.0" rx="0" fill="#7fb3d5" fill-opacity="1.0" stroke="#2e6f99" stroke-width="1.2"/>
<text x="920.0" y="350.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">NEMA 17, Tr8x2 slide (~280 N)</text>
<line x1="760.0" y1="430.0" x2="620.0" y2="430.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="640.0" y="448.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="normal" font-style="normal">the housing moves; the contacts stay: no stored feed</text>
<text x="40.0" y="560.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Force loop: baseplate -&gt; slide -&gt; housing -&gt; contacts -&gt; comb and rear clamp -&gt; baseplate. J1's nine contacts</text>
<text x="40.0" y="573.6" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">take 27-225 N [ith ex §12]. Latch check routes: a camera on the mating face, a wired header, or a staggered row.</text>
