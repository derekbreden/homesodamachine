<text x="850.0" y="504.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#2e8b57" text-anchor="start" font-weight="normal" font-style="normal">between a floor (fits the cavity) and a ceiling (cuts)</text>
