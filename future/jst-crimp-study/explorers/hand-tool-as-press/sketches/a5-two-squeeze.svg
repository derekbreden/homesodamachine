<line x1="356.0" y1="376.0" x2="360.0" y2="370.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="90.0" y="440.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Between squeezes the carriage moves the crimped contact by its wire:</text>
<text x="90.0" y="453.6" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">sideways by the die spacing, and axially ~1.5-2.5 mm so the</text>
<text x="90.0" y="467.3" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">insulation barrel sits in the 1.8 mm-thick die [calc 11].</text>
<text x="90.0" y="480.9" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="90.0" y="494.6" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Squeeze 1 stop: the conductor barrel's rear edge 0.1-0.2 mm proud</text>
<text x="90.0" y="508.2" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">of the die for a bellmouth, set by a printed stop. The 1.6 die is</text>
<text x="90.0" y="521.9" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1.8 mm thick: it fits a ~1.8 mm (genuine) barrel; on a clone-length</text>
<text x="90.0" y="535.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">barrel (1.25-1.5 mm) it reaches the box [sl w3 5].</text>
<text x="90.0" y="549.2" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="90.0" y="562.9" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Scissor action: the dies close on an arc about one pivot.</text>
<text x="90.0" y="576.5" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">No ratchet, no hard stop: closure is the machine's decision.</text>
