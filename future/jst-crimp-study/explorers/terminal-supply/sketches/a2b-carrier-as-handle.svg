<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
<title>a2b carrier kept as the handle through insertion</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b96a5" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1d2430" text-anchor="start" font-weight="bold">a2b  The carrier kept as the handle: crimp, inspect and insert by the tab</text>
<text x="20.0" y="50.0" font-size="11" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="italic">schematic - contact from clone drawings; housing cavity schematic</text>
<text x="20.0" y="85.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">1  After the crimp, the carrier is cut to a</text>
<text x="20.0" y="100.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">   2.3 mm handle around its pilot hole</text>
<rect x="131.6" y="150.0" width="36.8" height="48.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1.2"/>
<circle cx="150.0" cy="174.0" r="12.0" stroke="#8a6d2f" fill="#fff" stroke-width="1.2"/>
<rect x="143.6" y="198.0" width="12.8" height="16.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="134.4" y="214.0" width="31.2" height="22.4" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1"/>
<rect x="142.0" y="236.4" width="16.0" height="6.4" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1"/>
<rect x="138.0" y="242.8" width="24.0" height="22.4" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1"/>
<rect x="140.4" y="265.2" width="19.2" height="9.6" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1"/>
<rect x="135.2" y="274.8" width="29.6" height="32.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1"/>
<path d="M 150 224.0 C 140 182 90 140 60 120" stroke="#222222" fill="none" stroke-width="6"/>
<text x="20.0" y="114.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">wire rises off the handle</text>
<text x="180.0" y="175.6" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">pin in the hole, plus</text>
<text x="180.0" y="188.6" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">fingers on the crimp</text>
<text x="180.0" y="246.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">at 2.5 mm pitch the</text>
<text x="180.0" y="259.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">handles clear by 0.2</text>
<text x="360.0" y="85.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">2  Two-point grip: pin in the tag's hole + fingers on the</text>
<text x="360.0" y="100.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">   crimped insulation barrel; the cavity guides the box</text>
<rect x="470.0" y="190.0" width="155.0" height="120.0" stroke="#1d2430" fill="#f4f1e8" stroke-width="1.2"/>
<rect x="488.0" y="222.0" width="137.0" height="56.0" stroke="#1d2430" fill="#ffffff" stroke-width="1.2"/>
<rect x="470.0" y="241.0" width="18.0" height="18.0" stroke="#1d2430" fill="#ffffff" stroke-width="1.2"/>
<text x="548.0" y="182.0" font-size="10" fill="#5b6675" text-anchor="middle" font-weight="normal">XHP housing, one cavity (section)</text>
<line x1="657.0" y1="272.0" x2="541.0" y2="272.0" stroke="#8a6d2f" stroke-width="2.4"/>
<rect x="629.0" y="234.0" width="28.0" height="38.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="593.0" y="253.0" width="28.0" height="19.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="541.0" y="226.0" width="40.0" height="46.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1.2"/>
<line x1="573.0" y1="272.0" x2="591.0" y2="288.0" stroke="#8a6d2f" stroke-width="1.4"/>
<line x1="657.0" y1="272.0" x2="737.0" y2="272.0" stroke="#8a6d2f" stroke-width="3"/>
<rect x="677.0" y="266.0" width="60.0" height="12.0" stroke="#b3342b" fill="none" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="677.0" y="298.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">pin in the hole; fingers on the crimp</text>
<line x1="747.0" y1="272.0" x2="759.0" y2="272.0" stroke="#1d2430" stroke-width="1.2"/>
<line x1="767.0" y1="310.0" x2="717.0" y2="310.0" stroke="#1d2430" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="717.0" y="326.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">push</text>
<rect x="629.0" y="238.0" width="100.0" height="34.0" stroke="#222222" fill="#3a3a3a" stroke-width="1"/>
<rect x="629.0" y="247.8" width="0.0" height="14.4" stroke="#c26a2e" fill="#c26a2e" stroke-width="0.6"/>
<text x="629.0" y="350.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">rear face</text>
<text x="20.0" y="380.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">3  Near home the carrier edge meets the rear face (margin -0.05 to +0.9 mm, calc 4):</text>
<text x="20.0" y="396.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">   snip the tab at the face, then a fork behind the insulation barrel finishes the seat and feels the lance click</text>
<text x="20.0" y="430.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">What the tag buys: a stamped datum on the contact's centreline, carried from the crimp through inspection</text>
<text x="20.0" y="445.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">and most of insertion. The proof pull goes to the box's rear face through a slotted plate, not through the tag.</text>
<text x="20.0" y="460.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">What it costs: a second cut or bend-off beside the housing, and a tag 2.3 mm wide that no 1.5-1.6 mm</text>
<text x="20.0" y="475.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">wire comb takes: in a gang push the tags are bent off after a partial push, or cut before it.</text>
</svg>
