<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" width="780" height="580" font-family="Helvetica, Arial, sans-serif">
<title>a3b vertical crimp where the contact hangs</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b96a5" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="780" height="580" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1d2430" text-anchor="start" font-weight="bold">a3b  Crimp it where it hangs: the turning pocket faces the U to a sideways punch</text>
<text x="20.0" y="50.0" font-size="11" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="italic">schematic - side view looking along the rail, after the pocket's turn; contact from clone drawings</text>
<rect x="260.0" y="220.0" width="67.4" height="210.8" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="40.0" y="270.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">fixed steel wall</text>
<text x="40.0" y="283.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">beside the rail's</text>
<text x="40.0" y="296.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">line: carries the</text>
<text x="40.0" y="309.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">crimp force</text>
<rect x="332.6" y="70.0" width="44.2" height="221.6" stroke="#222222" fill="#555555" stroke-width="0.8"/>
<rect x="345.3" y="291.6" width="18.7" height="46.8" stroke="#c26a2e" fill="#c26a2e" stroke-width="0.6"/>
<rect x="327.4" y="250.0" width="5.2" height="150.8" stroke="#8a6d2f" fill="#8a6d2f" stroke-width="1.2"/>
<rect x="330.0" y="250.0" width="78.0" height="36.4" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="330.0" y="296.8" width="39.0" height="36.4" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="330.0" y="348.8" width="59.8" height="52.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1.2"/>
<text x="413.2" y="270.8" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">insulation U, open to the right</text>
<text x="397.6" y="380.0" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">box, hanging down</text>
<rect x="423.6" y="291.6" width="120.0" height="46.8" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<line x1="483.6" y1="315.0" x2="413.2" y2="315.0" stroke="#1d2430" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="428.6" y="283.6" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">punch moves sideways</text>
<polygon points="418.4,226.6 379.4,242.2 379.4,248.7 418.4,237.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<text x="421.0" y="231.8" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">finger presses the insulation toward the floor</text>
<text x="392.4" y="90.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">conductor k lowered from above;</text>
<text x="392.4" y="104.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the open insulation U is its funnel;</text>
<text x="392.4" y="118.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the ribbon hangs above, clamped</text>
<text x="20.0" y="490.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Z reference: the pocket top the insulation barrel rests on. The conductor's depth is steered by the</text>
<text x="20.0" y="505.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">insulation edge as seen. The pocket turned 90 or 270 deg so the U faces the punch; its cut-away side lets</text>
<text x="20.0" y="520.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the floor meet the fixed wall. The punch pushes the contact onto the wall, outside the rail's line.</text>
</svg>
