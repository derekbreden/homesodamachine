<text x="212.0" y="632.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">hold-down at the carrier's far edge</text>
<rect x="102.0" y="612.6" width="293.2" height="37.4" stroke="#222222" fill="#3a3a3a" stroke-width="1"/>
<rect x="395.2" y="623.4" width="52.8" height="15.8" stroke="#c26a2e" fill="#c26a2e" stroke-width="0.6"/>
<line x1="272.0" y1="650.0" x2="487.6" y2="650.0" stroke="#8a6d2f" stroke-width="2.4"/>
<rect x="360.0" y="584.0" width="30.8" height="66.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="399.6" y="617.0" width="30.8" height="33.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="443.6" y="599.4" width="44.0" height="50.6" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1.2"/>
<line x1="452.4" y1="650.0" x2="432.6" y2="667.6" stroke="#8a6d2f" stroke-width="1.4"/>
<text x="102.0" y="602.2" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">ribbon carriage slides conductor k in axially</text>
<rect x="357.8" y="524.0" width="74.8" height="44.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="395.2" y="516.0" font-size="11" fill="#6f7c8c" text-anchor="middle" font-weight="normal">punch, stepped for both barrels</text>
<line x1="395.2" y1="570.0" x2="395.2" y2="582.0" stroke="#1d2430" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="495.6" y="630.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">box: never touched</text>
<text x="294.0" y="730.0" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">carrier 3.0 + tab 0.8-1.15 mm, in the floor plane</text>
<text x="620.0" y="490.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">What locates what:</text>
<text x="620.0" y="505.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">- pilot pins in the neighbours' holes: along the strip</text>
<text x="620.0" y="520.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">- carrier edge on a stepper fence: along the contact,</text>
<text x="620.0" y="535.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  corrected per contact from the waiting contact's picture</text>
<text x="620.0" y="550.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">- anvil top: height; carrier held flat: roll</text>
<text x="620.0" y="565.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">What drives the crimp: an arbor-press ram pulled</text>
<text x="620.0" y="580.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  by a stepper lead screw, hard stop at the bottom</text>
<text x="620.0" y="595.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">How it knows: pins home, the waiting contact's picture,</text>
<text x="620.0" y="610.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  a gate across the station (lit vane in the gap),</text>
<text x="620.0" y="625.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  ram at the stop, force trace, the after-crimp look</text>
<text x="620.0" y="640.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">What Derek does: splay and strip the ribbon end,</text>
<text x="620.0" y="655.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  thread a 100-piece strip every ~2 units (or a</text>
<text x="620.0" y="670.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  reel once), empty the scrap, insert the contacts</text>
</svg>
