<text x="690.4" y="226.0" font-size="10" fill="#5b6675" text-anchor="middle" font-weight="normal">empty carrier, tab stubs only</text>
<rect x="500.8" y="205.6" width="38.4" height="40.8" stroke="#6f7c8c" fill="none" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="542.8" y="234.4" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">anvil + punch</text>
<rect x="509.8" y="88.0" width="20.4" height="139.2" stroke="#222222" fill="#555555" stroke-width="0.8"/>
<rect x="515.7" y="227.2" width="8.6" height="21.6" stroke="#c26a2e" fill="#c26a2e" stroke-width="0.6"/>
<text x="536.0" y="98.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">conductor k slides in from behind, over the carrier, into the open U</text>
<text x="536.0" y="112.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">(the other conductors ride ~5 mm up on a notched lifter bar; only k lies at carrier height)</text>
<circle cx="434.8" cy="178.0" r="8.6" stroke="#b3342b" fill="#b3342b" stroke-width="1"/>
<text x="434.8" y="152.0" font-size="10" fill="#b3342b" text-anchor="middle" font-weight="normal">pilot pin</text>
<circle cx="605.2" cy="178.0" r="8.6" stroke="#b3342b" fill="#b3342b" stroke-width="1"/>
<text x="605.2" y="152.0" font-size="10" fill="#b3342b" text-anchor="middle" font-weight="normal">pilot pin</text>
<rect x="175.0" y="157.0" width="247.8" height="42.0" stroke="#2f7d6d" fill="url(#hatch)" stroke-width="1"/>
<rect x="446.8" y="157.0" width="57.2" height="42.0" stroke="#2f7d6d" fill="url(#hatch)" stroke-width="1"/>
<rect x="536.0" y="157.0" width="57.2" height="42.0" stroke="#2f7d6d" fill="url(#hatch)" stroke-width="1"/>
<text x="200.0" y="152.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">sprung hold-down</text>
<circle cx="100.0" cy="178.0" r="32.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<text x="100.0" y="228.0" font-size="10" fill="#2f7d6d" text-anchor="middle" font-weight="normal">pin wheel or pawl,</text>
<text x="100.0" y="241.0" font-size="10" fill="#2f7d6d" text-anchor="middle" font-weight="normal">small stepper</text>
<line x1="40.0" y1="130.0" x2="120.0" y2="130.0" stroke="#1d2430" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="40.0" y="124.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">strip in</text>
<line x1="900.0" y1="218.0" x2="975.0" y2="218.0" stroke="#1d2430" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="880.0" y="238.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">to take-up or</text>
<text x="880.0" y="251.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">a snip bin</text>
<line x1="527.2" y1="202.0" x2="610.0" y2="380.0" stroke="#b3342b" stroke-width="0.8"/>
<text x="614.0" y="378.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">drop-shear: after the crimp the carrier downstream of the tab</text>
<text x="614.0" y="391.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">is pushed down, away from the wire above; the upstream carrier</text>
<text x="614.0" y="404.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">is clamped to an edge 2-3 mm upstream, so the kink goes to scrap</text>
<text x="190.0" y="380.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">waiting contacts: open, same pose,</text>
<text x="190.0" y="393.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">one pitch apart</text>
<text x="20.0" y="470.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="bold">SECTION through the station, along the contact axis (larger scale)</text>
<rect x="212.0" y="652.0" width="126.0" height="30.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1"/>
<text x="217.0" y="672.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">printed track</text>
<rect x="336.9" y="652.0" width="19.8" height="30.0" stroke="#b3342b" fill="#f6d9d6" stroke-width="1"/>
<text x="332.9" y="698.0" font-size="10" fill="#b3342b" text-anchor="end" font-weight="normal">drop plate (spring)</text>
<rect x="357.8" y="652.0" width="74.8" height="60.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="395.2" y="698.0" font-size="11" fill="#6f7c8c" text-anchor="middle" font-weight="normal">anvil</text>
