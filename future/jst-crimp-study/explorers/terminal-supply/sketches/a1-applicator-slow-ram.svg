<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Helvetica, Arial, sans-serif">
<title>a1 stock side-feed applicator on a slow screw ram</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b96a5" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1d2430" text-anchor="start" font-weight="bold">a1  A stock side-feed XH applicator, driven by a slow screw ram</text>
<text x="20.0" y="50.0" font-size="11" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="italic">schematic - not to scale</text>
<rect x="300.0" y="80.0" width="30.0" height="470.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="300.0" y="80.0" width="330.0" height="30.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="250.0" y="530.0" width="450.0" height="30.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="705.0" y="550.0" font-size="11" fill="#6f7c8c" text-anchor="start" font-weight="normal">base: load cell under the applicator plate</text>
<rect x="430.0" y="40.0" width="60.0" height="40.0" stroke="#1d2430" fill="#e6e6e6" stroke-width="1.2"/>
<text x="500.0" y="62.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">NEMA 23 + ~5:1 belt or gearbox</text>
<line x1="460.0" y1="110.0" x2="460.0" y2="250.0" stroke="#1d2430" stroke-width="3"/>
<text x="470.0" y="180.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">ball screw (SFU1605 class)</text>
<rect x="430.0" y="250.0" width="60.0" height="30.0" stroke="#1d2430" fill="#dddddd" stroke-width="1.2"/>
<text x="500.0" y="270.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">guided nut + coupler to the T-shank</text>
<rect x="380.0" y="290.0" width="160.0" height="230.0" stroke="#2f7d6d" fill="#eef6f3" stroke-width="1.4"/>
<text x="460.0" y="310.0" font-size="12" fill="#2f7d6d" text-anchor="middle" font-weight="bold">applicator</text>
<text x="390.0" y="332.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">- feed finger in the</text>
<text x="390.0" y="345.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">  pilot holes (cam fed</text>
<text x="390.0" y="358.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">  by the ram stroke)</text>
<text x="390.0" y="371.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">- guide plates, pressure</text>
<text x="390.0" y="384.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">  plate (drag brake)</text>
<text x="390.0" y="397.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">- anvils + floating shear</text>
<text x="390.0" y="410.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">- crimp-height dials</text>
<text x="390.0" y="423.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">- stripper plate</text>
<circle cx="150.0" cy="200.0" r="70.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1.2"/>
<circle cx="150.0" cy="200.0" r="30.0" stroke="#8a6d2f" fill="#ffffff" stroke-width="1.2"/>
<text x="150.0" y="290.0" font-size="11" fill="#8a6d2f" text-anchor="middle" font-weight="normal">reel on an arm</text>
<text x="150.0" y="304.0" font-size="10" fill="#5b6675" text-anchor="middle" font-weight="normal">(8,000 = the whole program)</text>
<path d="M 150 130 C 250 140 330 420 380 470" stroke="#8a6d2f" fill="none" stroke-width="2"/>
<text x="215.0" y="400.0" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">strip enters the side</text>
<path d="M 540 470 C 600 480 640 500 660 525" stroke="#8a6d2f" fill="none" stroke-width="2" stroke-dasharray="4,3"/>
<text x="560.0" y="460.0" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">cut-off carrier pieces</text>
<text x="560.0" y="473.0" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">to a bin (scrap cover)</text>
<rect x="560.0" y="380.0" width="160.0" height="40.0" stroke="#1d2430" fill="#f3f3f3" stroke-width="1.2"/>
<text x="640.0" y="404.0" font-size="11" fill="#1d2430" text-anchor="middle" font-weight="normal">ribbon carriage + fork</text>
<line x1="560.0" y1="400.0" x2="520.0" y2="400.0" stroke="#1d2430" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="730.0" y="395.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">presents conductor k</text>
<text x="730.0" y="408.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">into the waiting contact</text>
<text x="40.0" y="470.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Pre-feed: at rest, the next contact</text>
<text x="40.0" y="485.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">already sits on the anvil.</text>
<text x="40.0" y="500.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">One slow stroke: crimp both barrels,</text>
<text x="40.0" y="515.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">shear the tab, feed the next.</text>
<text x="40.0" y="580.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">Mini-applicator interface: 30-40 mm stroke; shut height 135.8 mm (standard) or 160 mm (JST MKS-L</text>
<text x="40.0" y="593.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">for AP-K2N). A screw ram must reach the shut height to +/-0.02 mm: stop on a hard stop or teach it.</text>
</svg>
