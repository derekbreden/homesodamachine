<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" font-family="Helvetica, Arial, sans-serif">
<title>x3 stage every other cavity, crimp, leave, one push</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b96a5" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1100" height="900" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1d2430" text-anchor="start" font-weight="bold">x3  Stage every other cavity, crimp, leave, one push (a5's staging + into-the-housing i2b)</text>
<text x="20.0" y="50.0" font-size="11" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="italic">schematic - plan and end view; 2.5 mm pitch, 1.7 mm wire and clone contact widths to scale</text>
<text x="20.0" y="82.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">1  PLAN during the even pass: odds (1, 3, 5) staged 1.5 mm deep and crimped; cavity 2 now</text>
<text x="20.0" y="97.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">   staged beneath its lifted conductor; conductor 4 still waits lifted</text>
<rect x="175.0" y="118.0" width="155.0" height="264.0" stroke="#1d2430" fill="#f4f1e8" stroke-width="1.2"/>
<text x="175.0" y="110.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">XHP-5, rear face on the right; nest floats +/-0.2 mm in X and Z</text>
<rect x="193.0" y="130.0" width="137.0" height="40.0" stroke="#5b6675" fill="#ffffff" stroke-width="0.8"/>
