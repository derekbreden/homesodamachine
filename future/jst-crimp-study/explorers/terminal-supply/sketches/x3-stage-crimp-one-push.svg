<rect x="193.0" y="180.0" width="137.0" height="40.0" stroke="#5b6675" fill="#ffffff" stroke-width="0.8"/>
<text x="169.0" y="204.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">2</text>
<rect x="193.0" y="230.0" width="137.0" height="40.0" stroke="#5b6675" fill="#ffffff" stroke-width="0.8"/>
<text x="169.0" y="254.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">3</text>
<rect x="193.0" y="280.0" width="137.0" height="40.0" stroke="#5b6675" fill="#ffffff" stroke-width="0.8"/>
<text x="169.0" y="304.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">4</text>
