<text x="655.0" y="304.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">conductor 4: waits lifted ~4 mm (finger or loft)</text>
<text x="655.0" y="186.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">conductor 2: lowered by the finger into the barrels</text>
<text x="655.0" y="202.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">narrow stepped crimper (red): 3.1 mm conductor step,</text>
<text x="655.0" y="216.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">2.5-2.7 mm insulation step, clears crimped neighbours</text>
<text x="655.0" y="230.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">by +0.20 and +0.17-0.28 mm (calc w3 7)</text>
<text x="655.0" y="154.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">odd crimps stay staged: held by the mouth and their wires</text>
<text x="20.0" y="420.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">2  END VIEW at the insulation barrels, even crimp at cavity 2 (looking into the rear face)</text>
<rect x="204.9" y="571.6" width="70.2" height="68.4" rx="14" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1.4"/>
<circle cx="240.0" cy="605.8" r="30.6" stroke="#222222" fill="#3a3a3a" stroke-width="0.8"/>
<text x="200.4" y="607.6" font-size="9" fill="#8a6d2f" text-anchor="end" font-weight="normal">crimped neighbour (1.95)</text>
<rect x="384.9" y="571.6" width="70.2" height="68.4" rx="14" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1.4"/>
<circle cx="420.0" cy="605.8" r="30.6" stroke="#222222" fill="#3a3a3a" stroke-width="0.8"/>
<text x="459.6" y="607.6" font-size="9" fill="#8a6d2f" text-anchor="start" font-weight="normal">crimped neighbour (1.95)</text>
<polyline points="276.0,532.0 297.6,640.0 362.4,640.0 384.0,532.0" stroke="#8a6d2f" fill="none" stroke-width="2"/>
<circle cx="330.0" cy="607.6" r="30.6" stroke="#222222" fill="#3a3a3a" stroke-width="0.8"/>
<text x="330.0" y="524.8" font-size="9" fill="#8a6d2f" text-anchor="middle" font-weight="normal">open wings 2.46-3.0</text>
<rect x="281.4" y="442.0" width="97.2" height="72.0" stroke="#b3342b" fill="#f6dcd9" stroke-width="1.4"/>
<text x="330.0" y="478.0" font-size="10" fill="#b3342b" text-anchor="middle" font-weight="normal">2.7</text>
<rect x="281.4" y="643.6" width="97.2" height="57.6" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="330.0" y="715.6" font-size="9" fill="#6f7c8c" text-anchor="middle" font-weight="normal">anvil; the crimper's walls land on its shoulders</text>
<text x="620.0" y="470.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">The station's open wings clear the crimped</text>
<text x="620.0" y="485.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">neighbours by +0.03 (3.0 wings) to +0.30 mm</text>
<text x="620.0" y="500.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">(2.46) while it is staged; the 2.7 mm step</text>
<text x="620.0" y="515.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">clears them by +0.17 mm as it closes.</text>
<text x="620.0" y="530.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Waiting conductors at 2.5 mm, if left flat,</text>
<text x="620.0" y="545.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">meet a 3.5 mm punch by 0.10 mm: they wait</text>
<text x="620.0" y="560.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">lifted instead, and ordinary dies work in</text>
<text x="620.0" y="575.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the odd pass.</text>
<text x="620.0" y="590.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal"></text>
<text x="620.0" y="605.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">3  ONE PUSH: the nest drives the housing</text>
<text x="620.0" y="620.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">5.25-5.45 mm onto every staged contact at</text>
<text x="620.0" y="635.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">once. Nothing was stored in any conductor;</text>
<text x="620.0" y="650.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the cell shows each lance event, the lit</text>
<text x="620.0" y="665.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">squares go dark, and each wire is pulled</text>
<text x="620.0" y="680.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">back 5 N.</text>
<text x="40.0" y="800.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">Supply for the staging: a nozzle into a lance-grooved shuttle nest; or a3's rail dropping box-first into a housing lying</text>
<text x="40.0" y="814.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">rear face up; or Derek at the lit cavity when the machine asks. Kit contacts, BXH, or strip contacts cut first.</text>
<text x="40.0" y="828.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">Open: the narrow stepped dies (made, not bought); whether a crimped contact stays put at 1.5 mm while its neighbours are</text>
<text x="40.0" y="842.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">crimped; the lance and the anvil's front edge (a flat anvil fits about half the clone range).</text>
</svg>
