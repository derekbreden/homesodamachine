<text x="169.0" y="354.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">5</text>
<line x1="330.0" y1="98.0" x2="330.0" y2="400.0" stroke="#5b6675" stroke-width="0.8" stroke-dasharray="2,3"/>
<rect x="300.0" y="131.4" width="40.0" height="37.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1"/>
