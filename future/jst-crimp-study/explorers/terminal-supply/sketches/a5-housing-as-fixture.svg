<text x="123.5" y="209.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">2</text>
<rect x="149.3" y="238.0" width="150.7" height="44.0" stroke="#5b6675" fill="#ffffff" stroke-width="0.8"/>
<text x="123.5" y="264.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">3</text>
<rect x="149.3" y="293.0" width="150.7" height="44.0" stroke="#5b6675" fill="#ffffff" stroke-width="0.8"/>
<text x="123.5" y="319.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">4</text>
<rect x="149.3" y="348.0" width="150.7" height="44.0" stroke="#5b6675" fill="#ffffff" stroke-width="0.8"/>
<text x="123.5" y="374.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">5</text>
<line x1="300.0" y1="94.8" x2="300.0" y2="425.0" stroke="#5b6675" stroke-width="0.8" stroke-dasharray="2,3"/>
<text x="303.0" y="92.8" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">rear face</text>
<rect x="157.0" y="129.5" width="134.2" height="40.7" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<polygon points="300.0,131.3 412.1,48.6 433.6,79.3 300.0,168.7" stroke="#222222" fill="#555555" stroke-width="0.8"/>
<rect x="157.0" y="184.5" width="134.2" height="40.7" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<polygon points="300.0,186.3 434.6,136.1 447.3,171.3 300.0,223.7" stroke="#222222" fill="#555555" stroke-width="0.8"/>
<circle cx="355.0" cy="212.7" r="8.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<text x="500.0" y="110.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">a finger sweeps the seated wires</text>
<text x="500.0" y="123.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">toward the done side, 20-35 deg,</text>
<text x="500.0" y="136.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">right at the face</text>
<rect x="267.0" y="239.5" width="44.0" height="40.7" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1"/>
<rect x="311.0" y="246.8" width="13.2" height="26.4" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1"/>
