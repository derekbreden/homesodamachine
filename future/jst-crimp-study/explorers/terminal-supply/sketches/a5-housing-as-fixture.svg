<rect x="355.0" y="249.0" width="11.0" height="22.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1"/>
<rect x="366.0" y="229.2" width="30.8" height="61.6" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1"/>
<rect x="320.9" y="221.5" width="37.4" height="77.0" stroke="#b3342b" fill="none" stroke-width="1.5" stroke-dasharray="5,3"/>
<rect x="362.7" y="216.0" width="37.4" height="88.0" stroke="#b3342b" fill="none" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="407.8" y="286.4" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">punch footprints, 3.5 and 4.0 mm wide:</text>
<text x="407.8" y="299.4" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">they reach into lane 2, which the swept</text>
<text x="407.8" y="312.4" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">wire has left</text>
<rect x="361.6" y="241.3" width="300.0" height="37.4" stroke="#222222" fill="none" stroke-width="1" stroke-dasharray="6,3"/>
<text x="407.8" y="235.8" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">conductor 3, laid in from above</text>
<text x="308.0" y="362.5" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">cavities 4, 5 empty; their conductors wait lifted above the dies</text>
<text x="308.0" y="376.5" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">(fanned flat at 2.5 mm they would meet 3.5-4.0 mm punches: calc w3 7)</text>
<text x="20.0" y="470.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="bold">SIDE VIEW at cavity 3</text>
<rect x="189.5" y="544.9" width="170.5" height="90.2" stroke="#1d2430" fill="#f4f1e8" stroke-width="1.2"/>
<rect x="209.3" y="561.4" width="150.7" height="57.2" stroke="#1d2430" fill="#fff" stroke-width="1.2"/>
