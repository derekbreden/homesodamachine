<line x1="362.2" y1="615.3" x2="382.0" y2="632.9" stroke="#8a6d2f" stroke-width="1.4"/>
<rect x="379.8" y="617.3" width="77.0" height="45.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="379.8" y="494.3" width="77.0" height="38.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="417.2" y="651.3" font-size="10" fill="#6f7c8c" text-anchor="middle" font-weight="normal">anvil</text>
<text x="417.2" y="487.3" font-size="10" fill="#6f7c8c" text-anchor="middle" font-weight="normal">punch</text>
<text x="109.5" y="576.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">staging post</text>
<text x="109.5" y="616.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">through the front</text>
<text x="620.0" y="510.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Staged 1.5 mm deep: the lance is still</text>
<text x="620.0" y="525.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">0.9 mm outside, the conductor barrel sits</text>
<text x="620.0" y="540.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">1.1-2.5 mm behind the face, the insulation</text>
<text x="620.0" y="555.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">barrel 3.0-4.5 mm. A flat anvil's front edge</text>
<text x="620.0" y="570.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">has ~0.06 mm between lance and barrel:</text>
<text x="620.0" y="585.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">a lance slot in the anvil, or measure first.</text>
<text x="620.0" y="600.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">After the crimp a fork pushes it the last</text>
<text x="620.0" y="615.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">5.25-5.45 mm; conductor k carries that as a</text>
<text x="620.0" y="630.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">6-8 mm hump at its crimp (or: x3, one push).</text>
