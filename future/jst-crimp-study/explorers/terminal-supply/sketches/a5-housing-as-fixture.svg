<text x="129.5" y="106.8" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">XHP-5 from above, rear face on the right</text>
<rect x="149.3" y="128.0" width="150.7" height="44.0" stroke="#5b6675" fill="#ffffff" stroke-width="0.8"/>
<text x="123.5" y="154.0" font-size="11" fill="#5b6675" text-anchor="end" font-weight="normal">1</text>
