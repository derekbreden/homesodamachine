<text x="748.4" y="510.0" font-size="10" fill="#6f7c8c" text-anchor="middle" font-weight="normal">anvil sets Z</text>
<rect x="707.6" y="368.0" width="84.0" height="22.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="798.4" y="384.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">punch</text>
<text x="560.0" y="620.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">The post locates the box in plane, as the header post it was made for;</text>
<text x="560.0" y="633.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">the anvil sets height; the holder floats so the die centres the barrels.</text>
<text x="560.0" y="646.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">After the crimp a pull on the wire slides it off (0.2-2 N): joined or not.</text>
