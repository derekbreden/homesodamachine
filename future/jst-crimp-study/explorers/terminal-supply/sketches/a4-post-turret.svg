<rect x="417.0" y="356.0" width="170.0" height="8.0" stroke="#222222" fill="#555555" stroke-width="1.2"/>
<text x="445.0" y="386.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">conductor k comes in radially</text>
<text x="20.0" y="350.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">loading station:</text>
<text x="20.0" y="363.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">a nozzle fills a</text>
<text x="20.0" y="376.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">lance-grooved nest;</text>
<text x="20.0" y="389.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">the post spears it.</text>
<text x="20.0" y="402.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">Or Derek pushes</text>
<text x="20.0" y="415.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">contacts on, U up</text>
<rect x="230.0" y="150.0" width="40.0" height="24.0" stroke="#1d2430" fill="#dde3ea" stroke-width="1.2"/>
<text x="278.0" y="167.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">camera: contact present? U up?</text>
<text x="40.0" y="560.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">an empty post, loaded in loom order, stands for J2's empty cavity 3</text>
<text x="560.0" y="150.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="bold">INSET: side view at the crimp station</text>
<rect x="590.0" y="370.0" width="60.0" height="160.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<text x="590.0" y="548.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">post holder: face = axial stop;</text>
<text x="590.0" y="561.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">floats in Z on a leaf spring</text>
