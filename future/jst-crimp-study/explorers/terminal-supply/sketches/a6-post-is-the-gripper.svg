<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="1100" height="980" font-family="Helvetica, Arial, sans-serif">
<title>a6 the post is the gripper</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b96a5" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1100" height="980" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1d2430" text-anchor="start" font-weight="bold">a6  The post is the gripper: one 0.64 mm pin carries every contact from its supply to the die</text>
<text x="20.0" y="50.0" font-size="11" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="italic">schematic - side views; contact proportions from clone drawings, box front at right</text>
<text x="20.0" y="90.0" font-size="13" fill="#1d2430" text-anchor="start" font-weight="bold">1  PICK from the pocket plate (or from a strip on pins)</text>
<rect x="60.0" y="250.0" width="520.0" height="30.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<line x1="60.0" y1="270.0" x2="580.0" y2="270.0" stroke="#2f7d6d" stroke-width="1" stroke-dasharray="5,3"/>
<text x="80.0" y="306.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">pocket plate channel, 2.05 mm at the floor, open at both ends; a lance groove</text>
<text x="80.0" y="319.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">1.0 wide x &gt;= 1.0 deep (dashed) runs its whole length, so the contact lies flat</text>
<rect x="60.0" y="280.0" width="520.0" height="10.0" stroke="#e8c85a" fill="#fff4c9" stroke-width="0.8"/>
<text x="590.0" y="289.0" font-size="9" fill="#5b6675" text-anchor="start" font-weight="normal">light pad</text>
<line x1="180.0" y1="250.0" x2="296.0" y2="250.0" stroke="#8a6d2f" stroke-width="2.4"/>
<rect x="180.0" y="190.0" width="28.0" height="60.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="216.0" y="220.0" width="28.0" height="30.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="256.0" y="204.0" width="40.0" height="46.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1.2"/>
<line x1="264.0" y1="250.0" x2="246.0" y2="266.0" stroke="#8a6d2f" stroke-width="1.4"/>
<rect x="170.0" y="140.0" width="6.0" height="110.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1"/>
<text x="162.0" y="134.0" font-size="10" fill="#6f7c8c" text-anchor="end" font-weight="normal">backstop blade drops in</text>
<rect x="262.0" y="220.6" width="34.0" height="12.8" stroke="#b3342b" fill="#b3342b" stroke-width="0.6"/>
<rect x="296.0" y="207.0" width="20.0" height="40.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="316.0" y="209.0" width="60.0" height="36.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<path d="M 376.0,227.0 l 8,-8 l 8,16 l 8,-16 l 8,16 l 8,-8" stroke="#2f7d6d" fill="none" stroke-width="1.2"/>
<rect x="416.0" y="217.0" width="44.0" height="20.0" stroke="#1d2430" fill="#eef0f3" stroke-width="1"/>
<text x="438.0" y="231.0" font-size="8" fill="#1d2430" text-anchor="middle" font-weight="normal">load cell</text>
<text x="298.0" y="186.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">holder face = box-front datum</text>
<text x="298.0" y="172.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">post head (the pin retracts through the holder: stripper)</text>
<text x="760.0" y="120.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">The camera over the light pad finds a</text>
<text x="760.0" y="135.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">barrels-up contact and which end its box is.</text>
<text x="760.0" y="150.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">The pin enters the box (0.2-2 N), then the</text>
<text x="760.0" y="165.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">force climbs when the box front meets the</text>
<text x="760.0" y="180.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">holder face: stop, lift. The box's 0.60-0.70</text>
<text x="760.0" y="195.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">entry captures a pointed pin +/-0.2-0.3 mm;</text>
<text x="760.0" y="210.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the groove puts the entry at floor + 1.1 mm.</text>
<text x="760.0" y="225.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Strip version: the carrier on pins reacts</text>
<text x="760.0" y="240.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the push, then a flush punch cuts the tab</text>
<text x="760.0" y="255.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">from above - no wire exists yet.</text>
<text x="20.0" y="360.0" font-size="13" fill="#1d2430" text-anchor="start" font-weight="bold">2  AT THE DIE: silhouette on the post first, then onto the anvil</text>
<rect x="236.0" y="542.0" width="80.0" height="60.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="276.0" y="590.0" font-size="10" fill="#6f7c8c" text-anchor="middle" font-weight="normal">anvil (knife set)</text>
<rect x="236.0" y="402.0" width="80.0" height="60.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="276.0" y="396.0" font-size="10" fill="#6f7c8c" text-anchor="middle" font-weight="normal">punch</text>
<rect x="80.0" y="506.0" width="184.0" height="34.0" stroke="#222222" fill="#3a3a3a" stroke-width="1"/>
<rect x="264.0" y="515.8" width="40.0" height="14.4" stroke="#c26a2e" fill="#c26a2e" stroke-width="0.6"/>
<line x1="240.0" y1="540.0" x2="356.0" y2="540.0" stroke="#8a6d2f" stroke-width="2.4"/>
<rect x="240.0" y="480.0" width="28.0" height="60.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="276.0" y="510.0" width="28.0" height="30.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="316.0" y="494.0" width="40.0" height="46.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1.2"/>
<line x1="324.0" y1="540.0" x2="306.0" y2="556.0" stroke="#8a6d2f" stroke-width="1.4"/>
<rect x="322.0" y="510.6" width="34.0" height="12.8" stroke="#b3342b" fill="#b3342b" stroke-width="0.6"/>
<rect x="356.0" y="497.0" width="20.0" height="40.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="376.0" y="499.0" width="60.0" height="36.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<path d="M 436.0,517.0 l 8,-8 l 8,16 l 8,-16 l 8,16 l 8,-8" stroke="#2f7d6d" fill="none" stroke-width="1.2"/>
<rect x="476.0" y="507.0" width="44.0" height="20.0" stroke="#1d2430" fill="#eef0f3" stroke-width="1"/>
<text x="498.0" y="521.0" font-size="8" fill="#1d2430" text-anchor="middle" font-weight="normal">load cell</text>
<text x="406.0" y="549.0" font-size="10" fill="#2f7d6d" text-anchor="middle" font-weight="normal">post head</text>
<text x="406.0" y="562.0" font-size="9" fill="#5b6675" text-anchor="middle" font-weight="normal">(pin retracts: stripper)</text>
<text x="80.0" y="556.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">conductor k from behind, steered</text>
<text x="80.0" y="570.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">by its insulation edge as seen</text>
<circle cx="292.0" cy="482.0" r="7.0" stroke="#b3342b" fill="#ffffff" stroke-width="1.4"/>
<text x="308.0" y="486.0" font-size="9" fill="#b3342b" text-anchor="start" font-weight="normal">camera line across the die, at wing height (into the page)</text>
<text x="760.0" y="400.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Float: the holder rides a flexure,</text>
<text x="760.0" y="415.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">+/-0.2 mm sideways and +/-0.2 mm in Z,</text>
<text x="760.0" y="430.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">preloaded from above: it holds the floor</text>
<text x="760.0" y="445.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">on the anvil and follows a nest that sits</text>
<text x="760.0" y="460.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">lower than taught. The float also</text>
<text x="760.0" y="475.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">lets the punch's lead-in centre the</text>
<text x="760.0" y="490.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">barrels. Axial stop = die fiducial +</text>
<text x="760.0" y="505.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">offset measured on the post. No strip</text>
<text x="760.0" y="520.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">beside the die: nothing one pitch away.</text>
<text x="760.0" y="535.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Release: the pin draws back through the</text>
<text x="760.0" y="550.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">holder face; the crimp stays with its wire.</text>
<text x="20.0" y="680.0" font-size="13" fill="#1d2430" text-anchor="start" font-weight="bold">3  x1: THE SAME HEAD PLACES THE CONTACT IN THE SN-2549's XH NEST</text>
<polygon points="232.0,862.0 309.0,862.0 309.0,930.0 180.0,950.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<polygon points="232.0,794.0 309.0,794.0 309.0,734.0 180.0,714.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="190.0" y="970.0" font-size="10" fill="#6f7c8c" text-anchor="start" font-weight="normal">SN-2549 jaws on their side in hand-tool-as-press a1's cradle</text>
<line x1="309.0" y1="734.0" x2="309.0" y2="930.0" stroke="#5b6675" stroke-width="1" stroke-dasharray="4,3"/>
<text x="313.0" y="920.0" font-size="9" fill="#5b6675" text-anchor="start" font-weight="normal">jaw front face, at the neck</text>
<line x1="240.0" y1="860.0" x2="356.0" y2="860.0" stroke="#8a6d2f" stroke-width="2.4"/>
<rect x="240.0" y="800.0" width="28.0" height="60.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="276.0" y="830.0" width="28.0" height="30.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="316.0" y="814.0" width="40.0" height="46.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1.2"/>
<line x1="324.0" y1="860.0" x2="306.0" y2="876.0" stroke="#8a6d2f" stroke-width="1.4"/>
<rect x="322.0" y="830.6" width="34.0" height="12.8" stroke="#b3342b" fill="#b3342b" stroke-width="0.6"/>
<rect x="356.0" y="817.0" width="20.0" height="40.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="376.0" y="819.0" width="60.0" height="36.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<path d="M 436.0,837.0 l 8,-8 l 8,16 l 8,-16 l 8,16 l 8,-8" stroke="#2f7d6d" fill="none" stroke-width="1.2"/>
<rect x="476.0" y="827.0" width="44.0" height="20.0" stroke="#1d2430" fill="#eef0f3" stroke-width="1"/>
<text x="498.0" y="841.0" font-size="8" fill="#1d2430" text-anchor="middle" font-weight="normal">load cell</text>
<text x="406.0" y="869.0" font-size="10" fill="#2f7d6d" text-anchor="middle" font-weight="normal">post head</text>
<text x="406.0" y="882.0" font-size="9" fill="#5b6675" text-anchor="middle" font-weight="normal">(pin retracts: stripper)</text>
<text x="760.0" y="710.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Head slides the contact in along its axis</text>
<text x="760.0" y="725.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">through the open jaws; the box and holder</text>
<text x="760.0" y="740.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">stay in front of the jaw face. One ratchet</text>
<text x="760.0" y="755.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">click captures it; the pin stays in the box</text>
<text x="760.0" y="770.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">while the conductor enters from behind and</text>
<text x="760.0" y="785.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the tool crimps. Post pen: the same pin in</text>
<text x="760.0" y="800.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">a printed pen, its face against a printed</text>
<text x="760.0" y="815.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">fence on the jaw - a locator for loose</text>
<text x="760.0" y="830.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">kit contacts, no motors (spear block with</text>
<text x="760.0" y="845.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">the same lance groove).</text>
</svg>
