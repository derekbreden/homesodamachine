<text x="917.0" y="775.8" font-size="9" fill="#1d2430" text-anchor="middle" font-weight="normal">housing</text>
<text x="560.0" y="800.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">Holder face sets every box front on one placement line; lowering presses</text>
<text x="560.0" y="813.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">the wire into the U-slot through the fork's crotch; the stripper frees</text>
<text x="560.0" y="826.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">the box. At 2.5 mm the tines clear the placed neighbours' wires by 0.30</text>
<text x="560.0" y="839.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">and the holder their boxes by 0.52 mm (calc w3 6).</text>
<text x="40.0" y="890.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">What the person does: lays a split, stripped end (or a pair) in the web clamp and fan comb, picks the recipe, drops a housing</text>
<text x="40.0" y="904.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">in the nest, lifts the finished end out and labels it; mounts a reel once (0.89 of one 8,000 reel for the program); empties cups.</text>
<text x="40.0" y="918.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">How it knows: at A the waiting-contact picture, the level gate, stop and force, the after look, the proof-pull trace;</text>
<text x="40.0" y="932.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">at B the spear trace (rise, then wall), the placement photo, the push trace and a 5 N pull-back per wire.</text>
