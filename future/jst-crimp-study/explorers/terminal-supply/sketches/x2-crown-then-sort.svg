<rect x="239.2" y="608.1" width="7.2" height="84.6" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1"/>
<line x1="242.8" y1="608.1" x2="381.4" y2="608.1" stroke="#6f7c8c" stroke-width="1.2"/>
<text x="242.8" y="620.8" font-size="9" fill="#6f7c8c" text-anchor="middle" font-weight="normal">fork tines 0.4 mm straddle the wire</text>
<text x="374.4" y="729.6" font-size="9" fill="#6f7c8c" text-anchor="start" font-weight="normal">holder face on the box front</text>
<text x="374.4" y="741.6" font-size="9" fill="#6f7c8c" text-anchor="start" font-weight="normal">pin 1.5-1.8 mm in; 0.2-2 N, reacted by the fork</text>
<text x="40.0" y="740.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">20-30 mm of free conductor buckles at 0.17-0.39 N:</text>
<text x="40.0" y="753.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">without the fork the spear would bend the wire,</text>
<text x="40.0" y="766.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">not enter the box (calc w3 6).</text>
<text x="560.0" y="600.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">2  PLACE: down 6-10 mm and across (up to 8.5 mm on J4) into slot k</text>
