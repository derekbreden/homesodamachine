<text x="930.0" y="300.0" font-size="9" fill="#2f7d6d" text-anchor="start" font-weight="normal">a6's post head on a</text>
<text x="930.0" y="312.0" font-size="9" fill="#2f7d6d" text-anchor="start" font-weight="normal">small X-Y-Z stage</text>
<line x1="930.0" y1="270.0" x2="810.0" y2="262.0" stroke="#2f7d6d" stroke-width="1" marker-end="url(#arr)"/>
<text x="630.0" y="460.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">STATION B = into-the-housing i6 with a6's post head as the hand: lower layer first,</text>
<text x="630.0" y="473.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">centre outward; upper-layer conductors (J4: 3V3, GND; J7: GND) last.</text>
