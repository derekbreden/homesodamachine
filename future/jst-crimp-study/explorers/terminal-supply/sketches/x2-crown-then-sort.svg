<text x="195.0" y="358.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">STATION A = a2d: reel below, strip over a steel crown</text>
<text x="195.0" y="371.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">(R 25-30), every other contact removed; knife-set</text>
<text x="195.0" y="384.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">punch under a 1 t arbor press, hard stop on the crown;</text>
<text x="195.0" y="397.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">pins in the removed contacts' holes; fence per contact.</text>
<text x="195.0" y="410.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">Added: a slotted PULL FORK drops on the crown land</text>
<text x="195.0" y="423.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">behind k's insulation barrel; the carriage pulls</text>
<text x="195.0" y="436.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">the web back 20 N through its cell (proof pull).</text>
<text x="370.0" y="325.0" font-size="10" fill="#6f7c8c" text-anchor="middle" font-weight="normal">crown</text>
