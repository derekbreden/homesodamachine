<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Helvetica, Arial, sans-serif">
<title>a3 hanging rail for loose kit contacts</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b96a5" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1d2430" text-anchor="start" font-weight="bold">a3  Loose contacts hang by their insulation wings on a slotted rail, like screws in a presenter</text>
<text x="20.0" y="50.0" font-size="11" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="italic">schematic - rail cross-section from clone dimensions; machine not to scale</text>
<polygon points="40.0,120.0 220.0,120.0 200.0,300.0 60.0,300.0" stroke="#1d2430" fill="#fafafa" stroke-width="1.2"/>
<text x="60.0" y="112.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">hopper: loose kit contacts</text>
<circle cx="130.0" cy="230.0" r="55.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<text x="130.0" y="232.0" font-size="10" fill="#2f7d6d" text-anchor="middle" font-weight="normal">slow scoop</text>
<text x="130.0" y="245.0" font-size="10" fill="#2f7d6d" text-anchor="middle" font-weight="normal">wheel ~4 rpm</text>
<line x1="200.0" y1="180.0" x2="720.0" y2="250.0" stroke="#6f7c8c" stroke-width="5"/>
<text x="420.0" y="185.0" font-size="11" fill="#6f7c8c" text-anchor="start" font-weight="normal">rail, tilted and gently vibrated</text>
<rect x="257.4" y="185.4" width="10.0" height="6.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="259.4" y="191.4" width="6.0" height="16.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="258.9" y="207.4" width="7.0" height="12.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="0.8"/>
<rect x="325.0" y="194.5" width="10.0" height="6.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="327.0" y="200.5" width="6.0" height="16.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="326.5" y="216.5" width="7.0" height="12.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="0.8"/>
<rect x="392.6" y="203.6" width="10.0" height="6.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="394.6" y="209.6" width="6.0" height="16.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="394.1" y="225.6" width="7.0" height="12.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="0.8"/>
<rect x="460.2" y="212.7" width="10.0" height="6.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="462.2" y="218.7" width="6.0" height="16.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="461.7" y="234.7" width="7.0" height="12.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="0.8"/>
<rect x="527.8" y="221.8" width="10.0" height="6.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="529.8" y="227.8" width="6.0" height="16.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="529.3" y="243.8" width="7.0" height="12.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="0.8"/>
<rect x="595.4" y="230.9" width="10.0" height="6.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="597.4" y="236.9" width="6.0" height="16.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="0.8"/>
<rect x="596.9" y="252.9" width="7.0" height="12.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="0.8"/>
<circle cx="330.0" cy="168.0" r="14.0" stroke="#5b6675" fill="none" stroke-width="1"/>
<text x="350.0" y="128.0" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">brush sweeps off anything not hanging</text>
<line x1="470.0" y1="200.0" x2="470.0" y2="238.0" stroke="#b3342b" stroke-width="2"/>
<text x="480.0" y="290.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">height wiper: knocks off</text>
<text x="480.0" y="303.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">anything riding high</text>
<line x1="478.0" y1="282.0" x2="471.0" y2="240.0" stroke="#b3342b" stroke-width="0.8"/>
<rect x="700.0" y="235.0" width="50.0" height="50.0" stroke="#1d2430" fill="#f0f0f0" stroke-width="1.2"/>
<text x="760.0" y="250.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">escapement: two gates</text>
<text x="760.0" y="263.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">release one at a time</text>
<rect x="705.0" y="130.0" width="40.0" height="26.0" stroke="#1d2430" fill="#dde3ea" stroke-width="1.2"/>
<text x="750.0" y="140.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">ELP camera looks down</text>
<text x="750.0" y="153.0" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">into the insulation U</text>
<line x1="725.0" y1="156.0" x2="725.0" y2="230.0" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="3,3"/>
<circle cx="725.0" cy="320.0" r="22.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<text x="755.0" y="318.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">turn pocket: servo turns</text>
<text x="755.0" y="331.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">the contact 180 deg if the</text>
<text x="755.0" y="344.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">U opens the wrong way</text>
<text x="560.0" y="400.0" font-size="12" fill="#1d2430" text-anchor="start" font-weight="bold">Handoff, pick one:</text>
<text x="560.0" y="420.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">(a3)  a hinged pocket tips the contact 90 deg onto a horizontal</text>
<text x="560.0" y="435.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">      anvil; a spring flap (WC-110 style) holds it to a stop</text>
<text x="560.0" y="450.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">(a3b) crimp it where it hangs: the pocket is the anvil, the</text>
<text x="560.0" y="465.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">      punch moves sideways, the conductor comes down from above</text>
<text x="560.0" y="480.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">(to a4) a 0.64 mm post rises into the hanging box from below</text>
<text x="560.0" y="495.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">      and carries the contact away</text>
<text x="40.0" y="395.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="bold">RAIL CROSS-SECTION, contact hanging (looking along the rail)</text>
<rect x="60.0" y="480.0" width="74.0" height="30.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="206.0" y="480.0" width="74.0" height="30.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="60.0" y="600.0" width="79.2" height="40.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="200.8" y="600.0" width="79.2" height="40.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<line x1="134.0" y1="510.0" x2="134.0" y2="600.0" stroke="#6f7c8c" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="206.0" y1="510.0" x2="206.0" y2="600.0" stroke="#6f7c8c" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="128.0" y="444.0" width="84.0" height="36.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1.2"/>
<text x="170.0" y="438.0" font-size="10" fill="#8a6d2f" text-anchor="middle" font-weight="normal">insulation wings 2.7-3.0 wide rest on the rail</text>
<rect x="142.1" y="480.0" width="55.5" height="93.0" stroke="#8a6d2f" fill="#e8d7a8" stroke-width="1.2"/>
<text x="222.0" y="525.0" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">conductor barrel in the 2.4 slot</text>
<rect x="142.1" y="573.0" width="55.5" height="60.0" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1.2"/>
<text x="222.0" y="597.0" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">box 1.85 wide passes 2.05;</text>
<text x="222.0" y="610.0" font-size="10" fill="#8a6d2f" text-anchor="start" font-weight="normal">box 2.2-2.35 tall does not</text>
<text x="40.0" y="666.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">A genuine JST contact drawn inside 1.95 x 2.4 has no wider 'head' and would</text>
<text x="40.0" y="679.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">fall through: this feeder is for the kit (clone) contacts as drawn. Measure one.</text>
</svg>
