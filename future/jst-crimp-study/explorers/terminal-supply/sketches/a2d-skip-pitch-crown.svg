<text x="801.0" y="284.6" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">the crown is 7-8 mm below here</text>
<text x="760.0" y="100.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">Next kept contact's wing tips vs the plane</text>
<text x="760.0" y="115.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">(pitch 7.1 mm, every other contact removed):</text>
<text x="760.0" y="130.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  R 20 mm, carrier at yield    -2.4 mm</text>
<text x="760.0" y="145.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  R 25 mm, elastic             -1.2 mm</text>
<text x="760.0" y="160.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">  R 30 mm, elastic             -0.5 mm</text>
<text x="760.0" y="175.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">With every contact kept, the 7.1 mm</text>
<text x="760.0" y="190.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">neighbour clears only at R ~8 mm, which</text>
<text x="760.0" y="205.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">bends the carrier plastically at every</text>
<text x="760.0" y="220.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">contact that passes.</text>
<text x="760.0" y="235.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">(calc wave2 sections 1-3)</text>
<text x="770.0" y="545.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">Proof pull: a slotted pull fork drops on the</text>
<text x="770.0" y="558.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">crown land behind k's insulation barrel; the</text>
<text x="770.0" y="571.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">carriage pulls the web back 20 N through its</text>
<text x="770.0" y="584.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">load cell while the camera watches the</text>
<text x="770.0" y="597.0" font-size="10" fill="#b3342b" text-anchor="start" font-weight="normal">insulation edge (calc w3 section 6).</text>
<text x="20.0" y="740.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="bold">PLAN of the thinned strip, looking down on the open barrels</text>
