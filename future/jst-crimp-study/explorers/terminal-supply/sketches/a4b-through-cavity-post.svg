<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif">
<title>a4b post through the housing cavity guides the insertion</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2430"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8b96a5" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1d2430" text-anchor="start" font-weight="bold">a4b  The post goes through the housing first: crimp on its tip, then slide the contact home</text>
<text x="20.0" y="50.0" font-size="11" fill="#5b6675" text-anchor="start" font-weight="normal" font-style="italic">schematic - section along one cavity; housing and contact proportions from JST/clone dims</text>
<rect x="220.0" y="204.9" width="170.5" height="90.2" stroke="#1d2430" fill="#f4f1e8" stroke-width="1.2"/>
<rect x="239.8" y="221.4" width="150.7" height="57.2" stroke="#1d2430" fill="#ffffff" stroke-width="1.2"/>
<rect x="220.0" y="240.1" width="19.8" height="19.8" stroke="#1d2430" fill="#ffffff" stroke-width="1.2"/>
<text x="305.8" y="194.9" font-size="10" fill="#5b6675" text-anchor="middle" font-weight="normal">XHP housing (section through cavity k)</text>
<text x="215.0" y="311.1" font-size="10" fill="#5b6675" text-anchor="end" font-weight="normal">mating face</text>
<text x="394.5" y="311.1" font-size="10" fill="#5b6675" text-anchor="start" font-weight="normal">rear face</text>
<rect x="100.0" y="243.0" width="488.5" height="14.1" stroke="#6f7c8c" fill="#6f7c8c" stroke-width="1"/>
<rect x="40.0" y="210.0" width="60.0" height="80.0" stroke="#2f7d6d" fill="#cfe8e1" stroke-width="1.2"/>
<text x="40.0" y="308.0" font-size="10" fill="#2f7d6d" text-anchor="start" font-weight="normal">post slide (Y)</text>
<rect x="647.9" y="237.9" width="155.2" height="37.4" stroke="#222222" fill="#3a3a3a" stroke-width="1"/>
<rect x="595.1" y="248.7" width="52.8" height="15.8" stroke="#c26a2e" fill="#c26a2e" stroke-width="0.6"/>
<line x1="683.1" y1="275.3" x2="555.5" y2="275.3" stroke="#8a6d2f" stroke-width="2.4"/>
<rect x="652.3" y="209.3" width="30.8" height="66.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="612.7" y="242.3" width="30.8" height="33.0" stroke="#8a6d2f" fill="none" stroke-width="1.6"/>
<rect x="555.5" y="224.7" width="44.0" height="50.6" stroke="#8a6d2f" fill="#f0e2b8" stroke-width="1.2"/>
<line x1="590.7" y1="275.3" x2="610.5" y2="292.9" stroke="#8a6d2f" stroke-width="1.4"/>
<rect x="608.3" y="277.3" width="77.0" height="50.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<rect x="608.3" y="149.3" width="77.0" height="40.0" stroke="#6f7c8c" fill="#d7dde5" stroke-width="1.2"/>
<text x="645.7" y="315.3" font-size="10" fill="#6f7c8c" text-anchor="middle" font-weight="normal">anvil</text>
<text x="645.7" y="143.3" font-size="10" fill="#6f7c8c" text-anchor="middle" font-weight="normal">punch</text>
<text x="467.5" y="324.8" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">~9 mm clear of the rear face:</text>
<text x="467.5" y="337.8" font-size="10" fill="#1d2430" text-anchor="start" font-weight="normal">room for the dies beside seated neighbours</text>
<text x="40.0" y="420.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">1  The stage (housing nest and web clamp together) puts cavity k on the post line; the post runs through it.</text>
<text x="40.0" y="436.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">2  A lance-grooved shuttle nest pushes a bare contact onto the post tip, box first, 1.5-1.8 mm deep.</text>
<text x="40.0" y="452.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">3  The ribbon carriage lays conductor k into the open barrels; the anvil rises to the floor; crimp.</text>
<text x="40.0" y="468.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">4  A fork behind the insulation barrel pushes the contact ~14 mm along the post into cavity k while the post</text>
<text x="40.0" y="484.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">   withdraws in step, its tip staying 1.5 mm inside the box, clear of the crimped strands.</text>
<text x="40.0" y="500.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">5  Force against distance: rise at the lance, a drop at the click, a wall at the seat. Then a 5 N pull.</text>
<text x="40.0" y="516.0" font-size="11" fill="#1d2430" text-anchor="start" font-weight="normal">6  The post withdraws out the front; the stage goes to the next cavity in layer order (J4, J7 upper layer last).</text>
<text x="40.0" y="545.0" font-size="11" fill="#b3342b" text-anchor="start" font-weight="normal">Nothing has to find the cavity: the contact is threaded on a line that already runs through it.</text>
<text x="40.0" y="561.0" font-size="11" fill="#b3342b" text-anchor="start" font-weight="normal">Open: with one web clamp, conductor k must carry that ~14 mm at its crimp as an 11-15 mm hump (calc w3 3);</text>
<text x="40.0" y="577.0" font-size="11" fill="#b3342b" text-anchor="start" font-weight="normal">   every post at once and one housing move stores nothing: branch a4c. The post's path past the cavity's</text>
<text x="40.0" y="593.0" font-size="11" fill="#b3342b" text-anchor="start" font-weight="normal">   inner features is unmeasured (one flashlight photo); a 17 mm post is soft (1.2-1.7 N/mm).</text>
</svg>
