<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1000" height="760" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#aaa" stroke-width="2"/></pattern><pattern id="rhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#e6a19a" stroke-width="2"/></pattern></defs>
<text x="20.0" y="28.0" fill="#111" font-size="17" font-weight="bold">i6b — a bed of posts through the housing, with a support comb near the tips (schematic, side view)</text>
<text x="20.0" y="48.0" fill="#444">~22 px per mm. Y left to right toward the mating face; Z up. Numbers: calc/wave3.out.txt sections E, F, H.</text>
<rect x="820.0" y="264.0" width="35.2" height="132.0" fill="#2e6b3a" stroke="#123"/>
<text x="864.0" y="277.2" fill="#123" font-size="12">post-bed PCB,</text>
<text x="864.0" y="292.2" fill="#123" font-size="12">holes at 2.50 mm</text>
<text x="864.0" y="307.2" fill="#123" font-size="12">(each post an</text>
<text x="864.0" y="322.2" fill="#123" font-size="12">ESP32 input)</text>
<rect x="649.5" y="294.8" width="170.5" height="70.4" fill="url(#hatch)" stroke="#333"/>
<rect x="662.7" y="305.8" width="157.3" height="48.4" fill="#ffffff" stroke="#333"/>
<text x="649.5" y="255.2" fill="#222" font-size="12">XHP housing (7.75 mm),</text>
<text x="649.5" y="270.2" fill="#222" font-size="12">before the push</text>
<line x1="820.0" y1="330.0" x2="462.5" y2="330.0" stroke="#777" stroke-width="14.1"/>
<text x="545.0" y="387.2" fill="#555" font-size="12">0.64 mm post, ~17 mm long</text>
<rect x="524.5" y="301.4" width="8" height="57.2" fill="#1f5fa8" opacity="0.8"/>
<line x1="528.5" y1="299.2" x2="528.5" y2="255.2" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
<text x="518.5" y="167.2" fill="#1f5fa8" font-size="12">support comb (stencil steel, slots at 2.50 mm)</text>
<text x="518.5" y="182.2" fill="#1f5fa8" font-size="12">holds each post 3 mm below its tip while the</text>
<text x="518.5" y="197.2" fill="#1f5fa8" font-size="12">box threads on; withdraws in Z before the push</text>
<rect x="451.5" y="305.8" width="44.0" height="50.6" fill="#e6c35c" stroke="#6b4f00" opacity="0.9"/>
<rect x="359.1" y="321.2" width="92.4" height="33.0" fill="#d4a017" stroke="#6b4f00"/>
<line x1="359.1" y1="325.6" x2="129.1" y2="325.6" stroke="#222" stroke-width="37.4"/>
<text x="129.1" y="371.8" fill="#222" font-size="12">conductor from the staging plane</text>
<rect x="372.3" y="268.4" width="57.2" height="26.4" fill="#9fd19f" stroke="#2e7d32"/>
<rect x="372.3" y="343.2" width="57.2" height="22.0" fill="#9fd19f" stroke="#2e7d32"/>
<line x1="354.7" y1="242.0" x2="409.7" y2="242.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<text x="150.0" y="189.2" fill="#2e7d32" font-size="12">carrier: fingers above and below the</text>
<text x="150.0" y="204.2" fill="#2e7d32" font-size="12">crimped barrels; threads the box +Y</text>
<text x="150.0" y="219.2" fill="#2e7d32" font-size="12">1-2 mm onto the post tip</text>
<line x1="798.0" y1="400.4" x2="490.0" y2="400.4" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<text x="150.0" y="431.2" fill="#c0392b" font-size="12">then the housing slides -Y along the posts ~13-15 mm over every box, to the first wall;</text>
<text x="150.0" y="447.2" fill="#c0392b" font-size="12">a finishing tine brings each contact to its own wall; continuity per post is read before and after</text>
<text x="20.0" y="520.0" fill="#111" font-size="13" font-weight="bold">Why the support comb: side-load deflection of a post tip (calc wave3 F)</text>
<text x="40.0" y="542.0" fill="#222" font-size="12" font-weight="bold">support</text>
<text x="420.0" y="542.0" fill="#222" font-size="12" font-weight="bold">steel</text>
<text x="560.0" y="542.0" fill="#222" font-size="12" font-weight="bold">brass or bronze header pin</text>
<text x="40.0" y="560.0" fill="#222" font-size="12">none: free from the front wall to the tip, ~15.6 mm</text>
<text x="420.0" y="560.0" fill="#222" font-size="12">0.45 mm per N</text>
<text x="560.0" y="560.0" fill="#222" font-size="12">0.90 mm per N</text>
<text x="40.0" y="578.0" fill="#222" font-size="12">a comb at the rear face: free 8.5 mm</text>
<text x="420.0" y="578.0" fill="#222" font-size="12">0.07 mm per N</text>
<text x="560.0" y="578.0" fill="#222" font-size="12">0.15 mm per N</text>
<text x="40.0" y="596.0" fill="#222" font-size="12">a comb 3 mm below the tip: free 3 mm</text>
<text x="420.0" y="596.0" fill="#222" font-size="12">0.003 mm per N</text>
<text x="560.0" y="596.0" fill="#222" font-size="12">0.006 mm per N</text>
<text x="20.0" y="638.0" fill="#444" font-size="12">The box mouth (0.60-0.70 mm) captures a chamfered post tip within +/-0.2 mm; threading costs 0.5-1 N of side load.</text>
<text x="20.0" y="656.0" fill="#444" font-size="12">Pitch: drill at 2.50, not 2.54 (XHP-9 would be 0.32 mm off end to end). With the comb, the comb's laser-cut slots set the tips.</text>
<text x="20.0" y="674.0" fill="#444" font-size="12">Open question: does a post pass cleanly along a kit cavity from the post opening to the rear face? One header pin through one housing.</text>
</svg>
