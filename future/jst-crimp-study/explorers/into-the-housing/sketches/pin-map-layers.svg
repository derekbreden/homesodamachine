<text x="867.1" y="155" font-size="11" fill="#222" text-anchor="start" transform="rotate(-55 867.1 155)">x</text>
<text x="20" y="535" fill="#333">Every other loom is one layer: J1 (5P + 4P), J2 (3P + 3P, cavity 3 an empty slot), J3, J5, J6, J9, J11, J13.</text>
<text x="20" y="555" fill="#333">J4 with change-the-question's 4P order (3V3, IO26, V5, IO25) is 3 layers, also 5 crossings. With the 1-wire pair split</text>
<text x="20" y="575" fill="#333">around the flow pair (3V3, V5, IO25, IO26) it is 3 crossings and 2 layers, GND alone on top.</text>
<text x="20" y="595" fill="#333">In both looms the upper layer lands at an END of the housing, beside the lower layer, never in a gap inside it.</text>
<text x="20" y="615" fill="#333">Placing: lower layer first, from the housing centre outward, with waiting conductors held 5-8 mm above placed ones.</text>
<text x="20" y="635" fill="#333">J7 becomes one layer if GND rides the 3P with CLO and CHI and the 5P's fifth is trimmed (procedure-is-the-machine).</text>
<text x="20" y="655" fill="#333">The J4 order shown (V5, IO25, 3V3, IO26 | GND, IO27, IO23) is also a least-crossing order for half-row machines (2 off-parity, 2 crossings).</text>
<text x="20" y="675" fill="#333">A board revision to J4 = 3V3, IO26, V5, IO25, GND, IO27, IO23 and J7 = RB1-RB4, GND, CLO, CHI makes both one layer (Derek's choice).</text>
