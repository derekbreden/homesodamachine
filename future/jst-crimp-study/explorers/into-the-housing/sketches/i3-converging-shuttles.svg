<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">i3 — crimp at a wide pitch on shuttles, close to 2.5 mm, push the housing onto the row (schematic, top view)</text>
  <text x="20" y="48" fill="#444">~10 px per mm, 5P ribbon shown. Y runs down the page toward the mating face. The shuttles only translate in X, so the contacts stay parallel.</text>

  <!-- LEFT: open -->
  <text x="40" y="84" font-weight="bold" fill="#111">1. Open: 5 mm pitch, one crimp at a time</text>
  <rect x="158" y="100" width="85" height="36" fill="#8a8a8a" stroke="#222"/>
  <text x="252" y="123" fill="#222">web clamp (fixed)</text>
  <g stroke="#111" stroke-width="12" fill="none">
    <path d="M166,136 L100,250"/>
    <path d="M183,136 L150,250"/>
    <path d="M200,136 L200,250"/>
    <path d="M217,136 L250,250"/>
    <path d="M234,136 L300,250"/>
  </g>
  <text x="350" y="190" fill="#444">split ~10-18 mm here</text>
  <text x="350" y="206" fill="#444">(J1 at 5 mm: 23-36 mm)</text>
  <g fill="#b9d3ee" stroke="#1f5fa8">
    <rect x="85" y="240" width="30" height="40"/>
    <rect x="135" y="240" width="30" height="40"/>
    <rect x="185" y="240" width="30" height="40"/>
    <rect x="235" y="240" width="30" height="40"/>
    <rect x="285" y="240" width="30" height="40"/>
  </g>
  <text x="330" y="258" fill="#1f5fa8">shuttles: V-groove + clamp pad</text>
  <text x="330" y="274" fill="#1f5fa8">2-4 mm behind each barrel</text>
  <g fill="#d4a017" stroke="#6b4f00">
    <rect x="94" y="280" width="12" height="40"/>
    <rect x="144" y="280" width="12" height="40"/>
    <rect x="194" y="280" width="12" height="40"/>
    <rect x="244" y="280" width="12" height="40"/>
  </g>
  <g fill="#e6c35c" stroke="#6b4f00">
    <rect x="93" y="320" width="14" height="20"/>
    <rect x="143" y="320" width="14" height="20"/>
    <rect x="193" y="320" width="14" height="20"/>
    <rect x="243" y="320" width="14" height="20"/>
  </g>
  <rect x="270" y="286" width="60" height="70" fill="#b0b8c4" stroke="#334" opacity="0.95"/>
  <text x="274" y="312" fill="#112">crimp</text>
  <text x="274" y="328" fill="#112">head at</text>
  <text x="274" y="344" fill="#112">shuttle 5,</text>
  <text x="274" y="360" fill="#112">docked on its pin</text>
  <line x1="80" y1="400" x2="330" y2="400" stroke="#1f5fa8" stroke-width="2" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="90" y="420" fill="#1f5fa8">the row steps past the head in X</text>
  <text x="40" y="460" fill="#444">8.3 mm free between neighbour wires at 5 mm pitch:</text>
  <text x="40" y="476" fill="#444">room for an ordinary crimp head (calc section 2)</text>
  <!-- fan plate hint -->
  <g stroke="#9a7d2e" stroke-width="3" opacity="0.6">
    <line x1="90" y1="520" x2="120" y2="580"/>
    <line x1="145" y1="520" x2="160" y2="580"/>
    <line x1="200" y1="520" x2="200" y2="580"/>
    <line x1="255" y1="520" x2="240" y2="580"/>
    <line x1="310" y1="520" x2="280" y2="580"/>
  </g>
  <text x="40" y="604" fill="#7a5c10">fan plate: one slanted slot per shuttle pin; sliding it in Y</text>
  <text x="40" y="620" fill="#7a5c10">sets every shuttle's X at once (5 mm to 2.5 mm)</text>

  <!-- RIGHT: closed and pushed -->
  <text x="520" y="84" font-weight="bold" fill="#111">2. Closed to 2.5 mm, housing pushed onto the row</text>
  <rect x="618" y="100" width="85" height="36" fill="#8a8a8a" stroke="#222"/>
  <g stroke="#111" stroke-width="12" fill="none">
    <path d="M626,136 L610,250"/>
    <path d="M643,136 L635,250"/>
    <path d="M660,136 L660,250"/>
    <path d="M677,136 L685,250"/>
    <path d="M694,136 L710,250"/>
  </g>
  <g fill="#b9d3ee" stroke="#1f5fa8">
    <rect x="599" y="240" width="22" height="40"/>
    <rect x="624" y="240" width="22" height="40"/>
    <rect x="649" y="240" width="22" height="40"/>
    <rect x="674" y="240" width="22" height="40"/>
    <rect x="699" y="240" width="22" height="40"/>
  </g>
  <g fill="#d4a017" stroke="#6b4f00">
    <rect x="604" y="280" width="12" height="40"/>
    <rect x="629" y="280" width="12" height="40"/>
    <rect x="654" y="280" width="12" height="40"/>
    <rect x="679" y="280" width="12" height="40"/>
    <rect x="704" y="280" width="12" height="40"/>
  </g>
  <g fill="#e6c35c" stroke="#6b4f00">
    <rect x="603" y="320" width="14" height="20"/>
    <rect x="628" y="320" width="14" height="20"/>
    <rect x="653" y="320" width="14" height="20"/>
    <rect x="678" y="320" width="14" height="20"/>
    <rect x="703" y="320" width="14" height="20"/>
  </g>
  <rect x="594" y="336" width="132" height="10" fill="#9fd19f" stroke="#2e7d32"/>
  <text x="740" y="346" fill="#2e7d32">spring guide comb squares the noses,</text>
  <text x="740" y="362" fill="#2e7d32">retreats as the housing arrives</text>
  <rect x="594" y="392" width="132" height="41" fill="#f4f1ea" stroke="#333"/>
  <text x="620" y="418" fill="#222">XHP-5, 13.2 mm</text>
  <line x1="660" y1="480" x2="660" y2="440" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="560" y="500" fill="#c0392b">housing nest driven -Y through a bar load cell, to the first wall</text>
  <text x="560" y="520" fill="#c0392b">all contacts enter together; no conductor bows; each finished alone</text>
  <text x="560" y="556" fill="#444">Then each shuttle's clamp pulls back at 5 N in turn:</text>
  <text x="560" y="572" fill="#444">more than ~0.2 mm of travel = not latched.</text>
  <text x="560" y="588" fill="#444">Camera on the mating face: lances in windows, J2 cavity 3 empty.</text>
</svg>
