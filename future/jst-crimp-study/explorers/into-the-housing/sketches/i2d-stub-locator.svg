<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="700" fill="#ffffff"/>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#aaa" stroke-width="2"/>
    </pattern>
    <pattern id="foil" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="0" stroke="#7a8594" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">i2d — a locator the lance never touches, on the SN-2549 (schematic)</text>
  <text x="20" y="48" fill="#444">Side section at ~25 px per mm. Drawn with transition t = 0.6 mm and a 1.1 mm lance (both unmeasured); box 1.2 mm into the stub.</text>
  <text x="20" y="66" fill="#444">Y runs left to right (+Y toward the box nose); Z up. Numbers: calc/wave2.out.txt sections G, H; calc/wave3.out.txt sections C, D.</text>

  <!-- Upper jaw (crimper), raised -->
  <path d="M470,150 L576,150 L576,300 L537,300 L537,262 L527,262 L527,228 L495,228 L495,300 L470,300 z" fill="#b0b8c4" stroke="#334"/>
  <text x="330" y="170" fill="#223">SN-2549 upper jaw</text>
  <text x="330" y="186" fill="#223">(crimper), open</text>

  <!-- Lower jaw / anvil nest: front edge x=576 -->
  <rect x="440" y="400" width="136" height="90" fill="#b0b8c4" stroke="#334"/>
  <text x="300" y="440" fill="#223">SN-2549 lower jaw,</text>
  <text x="300" y="456" fill="#223">XH anvil nest</text>
  <line x1="576" y1="390" x2="576" y2="520" stroke="#334" stroke-dasharray="4 3"/>
  <text x="500" y="536" fill="#334">anvil front edge</text>

  <!-- Wire -->
  <line x1="40" y1="374" x2="515" y2="374" stroke="#111" stroke-width="42"/>
  <line x1="515" y1="386" x2="580" y2="386" stroke="#b87333" stroke-width="18"/>
  <text x="60" y="418" fill="#222">stripped conductor, fed after the first click</text>

  <!-- Contact: front 640, box 590-640, transition 575-590, cond barrel 537.5-575, window 527.5-537.5, ins barrel 495-527.5 -->
  <rect x="590" y="340" width="50" height="60" fill="#e6c35c" stroke="#6b4f00"/>
  <rect x="575" y="395" width="15" height="5" fill="#d4a017" stroke="#6b4f00"/>
  <path d="M537.5,400 L537.5,361 L541.5,361 L541.5,395 L571,395 L571,361 L575,361 L575,400 z" fill="#d4a017" stroke="#6b4f00"/>
  <rect x="527.5" y="395" width="10" height="5" fill="#d4a017" stroke="#6b4f00"/>
  <path d="M495,400 L495,327 L499,327 L499,395 L523.5,395 L523.5,327 L527.5,327 L527.5,400 z" fill="#d4a017" stroke="#6b4f00"/>
  <line x1="606.5" y1="400" x2="579" y2="417" stroke="#6b4f00" stroke-width="3"/>

  <!-- Stub: cut face x=610, front wall 640-655 -->
  <rect x="610" y="325" width="45" height="15" fill="url(#hatch)" stroke="#333"/>
  <rect x="610" y="400" width="45" height="15" fill="url(#hatch)" stroke="#333"/>
  <rect x="640" y="340" width="15" height="60" fill="url(#hatch)" stroke="#333"/>
  <rect x="640" y="362" width="15" height="14" fill="#ffffff" stroke="#333"/>
  <text x="672" y="300" fill="#222">XHP stub: front wall + 1.0-1.5 mm</text>
  <text x="672" y="316" fill="#222">of cavity. The box nose stops on the</text>
  <text x="672" y="332" fill="#222">front wall, the product's own +Y stop</text>
  <line x1="610" y1="300" x2="610" y2="560" stroke="#1f5fa8" stroke-dasharray="5 4"/>
  <text x="616" y="576" fill="#1f5fa8">stub cut face</text>

  <!-- gap dimension -->
  <line x1="576" y1="610" x2="610" y2="610" stroke="#c0392b" stroke-width="2"/>
  <line x1="576" y1="602" x2="576" y2="618" stroke="#c0392b" stroke-width="2"/>
  <line x1="610" y1="602" x2="610" y2="618" stroke="#c0392b" stroke-width="2"/>
  <text x="440" y="640" fill="#c0392b">gap 1.0-1.7 mm: the lance hangs here, root outside the stub, tip ahead of the anvil</text>
  <text x="440" y="656" fill="#c0392b">needs t &#8805; 0.34-0.74 mm, the same condition the SN-2549 already meets or relieves (calc G)</text>

  <!-- carrier and parallelogram flexure -->
  <rect x="604" y="318" width="60" height="104" fill="none" stroke="#2e7d32" stroke-width="2" rx="3"/>
  <line x1="614" y1="422" x2="600" y2="500" stroke="#2e7d32" stroke-width="3"/>
  <line x1="654" y1="422" x2="640" y2="500" stroke="#2e7d32" stroke-width="3"/>
  <rect x="590" y="500" width="64" height="16" fill="#9fd19f" stroke="#2e7d32"/>
  <line x1="590" y1="508" x2="576" y2="508" stroke="#2e7d32" stroke-width="3"/>
  <text x="664" y="440" fill="#2e7d32">printed carrier on a parallelogram flexure:</text>
  <text x="664" y="456" fill="#2e7d32">free +/-0.2 mm in X and Z (the steel nest stays the</text>
  <text x="664" y="472" fill="#2e7d32">master), stiff in roll. In Y a 10-30 N spring holds it</text>
  <text x="664" y="488" fill="#2e7d32">back on the adjusting screw: the person's push never</text>
  <text x="664" y="504" fill="#2e7d32">moves it; barrel growth during coining can (calc wave3 C)</text>
  <text x="664" y="528" fill="#2e7d32">clip on the lower jaw's M4 screw; the adjusting</text>
  <text x="664" y="544" fill="#2e7d32">screw sets the gap once, under the camera</text>
  <!-- adjusting screw (fixed to the clip) bearing on a lug of the carrier -->
  <rect x="546" y="420" width="10" height="20" fill="url(#hatch)" stroke="#333"/>
  <rect x="596" y="423" width="8" height="12" fill="#9fd19f" stroke="#2e7d32"/>
  <line x1="556" y1="429" x2="596" y2="429" stroke="#555" stroke-width="4"/>
  <!-- preload spring pushing the carrier -Y onto the screw -->
  <path d="M664,405 l6,-6 l6,12 l6,-12 l6,12 l6,-12 l6,12 l6,-12 l6,6 l8,0" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <rect x="720" y="393" width="10" height="24" fill="url(#hatch)" stroke="#333"/>
  <!-- foil shim on the stub floor -->
  <rect x="610" y="396" width="30" height="4" fill="#1f5fa8" stroke="#1f5fa8"/>
  <text x="672" y="352" fill="#1f5fa8">foil shim on the stub floor leaves 0.05-0.10 mm of</text>
  <text x="672" y="368" fill="#1f5fa8">height clearance: roll +/-1.5-3.1 deg (calc wave3 D)</text>

  <!-- Inset: steel pocket with post -->
  <text x="20" y="230" font-weight="bold" fill="#111">Steel twin (i2d&#8243;)</text>
  <rect x="40" y="244" width="46" height="8" fill="url(#foil)" stroke="#556"/>
  <rect x="40" y="296" width="46" height="8" fill="url(#foil)" stroke="#556"/>
  <rect x="86" y="244" width="12" height="60" fill="url(#foil)" stroke="#556"/>
  <rect x="50" y="270" width="48" height="6" fill="#777" stroke="#333"/>
  <rect x="58" y="252" width="28" height="44" fill="#e6c35c" stroke="#6b4f00" opacity="0.85"/>
  <line x1="98" y1="273" x2="150" y2="273" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="154" y="262" fill="#1f5fa8">0.64 mm post in the pocket's front wall,</text>
  <text x="154" y="278" fill="#1f5fa8">wired to an ESP32 input: continuity when</text>
  <text x="154" y="294" fill="#1f5fa8">the conductor lies in the barrel</text>
  <text x="40" y="318" fill="#556">laminated stencil-steel pocket; the box's spring holds it on the post</text>
</svg>
