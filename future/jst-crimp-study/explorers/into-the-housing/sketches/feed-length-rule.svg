<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="920" height="600" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">Feed-length rule (schematic, side view, not to scale)</text>
  <text x="20" y="48" fill="#444">The ribbon clamp is fixed. A conductor's length from the web to its tip is set when it is stripped.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
  </defs>

  <!-- Panel A -->
  <text x="20" y="76" font-weight="bold" fill="#111">A. One at a time: crimped short of its cavity, then pushed home</text>
  <rect x="20" y="115" width="60" height="16" fill="#333"/>
  <rect x="80" y="104" width="50" height="38" fill="#8a8a8a" stroke="#222"/>
  <text x="70" y="165" fill="#222">web clamp ("fixed")</text>
  <path d="M130,123 C200,123 215,94 260,94 C305,94 320,123 390,123 L470,123" fill="none" stroke="#111" stroke-width="5"/>
  <path d="M215,131 L260,99 L305,131 z" fill="#e9d8a6" stroke="#9a7d2e"/>
  <text x="222" y="150" fill="#7a5c10">saddle</text>
  <text x="318" y="100" fill="#7a5c10">hump h</text>
  <rect x="470" y="115" width="46" height="16" fill="#d4a017" stroke="#6b4f00"/>
  <rect x="516" y="112" width="26" height="22" fill="#e6c35c" stroke="#6b4f00"/>
  <text x="462" y="104" fill="#6b4f00">crimped contact</text>
  <rect x="610" y="100" width="120" height="46" fill="#f4f1ea" stroke="#333"/>
  <line x1="610" y1="112" x2="720" y2="112" stroke="#999" stroke-dasharray="4 3"/>
  <line x1="610" y1="134" x2="720" y2="134" stroke="#999" stroke-dasharray="4 3"/>
  <text x="628" y="165" fill="#222">XHP housing</text>
  <text x="742" y="120" fill="#222">mating</text>
  <text x="742" y="135" fill="#222">face</text>
  <line x1="545" y1="190" x2="700" y2="190" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="552" y="208" fill="#c0392b">travel f after the crimp: 5.2 mm (i2) to ~12 mm</text>
  <text x="150" y="208" fill="#7a5c10">the hump stores exactly f</text>
  <text x="150" y="224" fill="#7a5c10">h = sqrt(3 c f / 8): 4-9 mm</text>

  <!-- Panel B -->
  <text x="20" y="268" font-weight="bold" fill="#111">B. After the push: the hump is gone, the conductor is straight</text>
  <rect x="20" y="295" width="60" height="16" fill="#333"/>
  <rect x="80" y="284" width="50" height="38" fill="#8a8a8a" stroke="#222"/>
  <line x1="130" y1="303" x2="628" y2="303" stroke="#111" stroke-width="5"/>
  <rect x="610" y="280" width="120" height="46" fill="#f4f1ea" stroke="#333" opacity="0.9"/>
  <rect x="628" y="295" width="46" height="16" fill="#d4a017" stroke="#6b4f00"/>
  <rect x="674" y="292" width="26" height="22" fill="#e6c35c" stroke="#6b4f00"/>
  <text x="620" y="345" fill="#222">seated, lance latched</text>
  <text x="150" y="345" fill="#444">Neighbours already seated are straight too, so none of them can lend length.</text>

  <!-- Panel C -->
  <text x="20" y="400" font-weight="bold" fill="#111">C. All of a ribbon at once: the housing moves onto a row that stays put</text>
  <rect x="20" y="427" width="60" height="16" fill="#333"/>
  <rect x="80" y="416" width="50" height="38" fill="#8a8a8a" stroke="#222"/>
  <line x1="130" y1="435" x2="470" y2="435" stroke="#111" stroke-width="5"/>
  <rect x="400" y="420" width="44" height="30" fill="#b9d3ee" stroke="#1f5fa8"/>
  <text x="378" y="474" fill="#1f5fa8">shuttle clamp</text>
  <rect x="470" y="427" width="46" height="16" fill="#d4a017" stroke="#6b4f00"/>
  <rect x="516" y="424" width="26" height="22" fill="#e6c35c" stroke="#6b4f00"/>
  <rect x="620" y="412" width="120" height="46" fill="#f4f1ea" stroke="#333"/>
  <line x1="610" y1="495" x2="480" y2="495" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="560" y="515" fill="#1f5fa8">the housing travels, not the contacts</text>
  <text x="150" y="515" fill="#1f5fa8">no hump: f = 0</text>
  <text x="20" y="565" fill="#444">Numbers: calc/insertion_geometry.out.txt section 9. Coordinates: Y left to right toward the mating face; Z up.</text>
</svg>
