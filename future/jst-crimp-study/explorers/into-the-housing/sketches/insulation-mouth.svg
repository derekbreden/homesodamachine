<text x="45.5" y="557.0" fill="#222" font-size="12">jacket (can give way)</text>
<text x="370.0" y="542.0" fill="#555" font-size="12">other side: empty</text>
<text x="370.0" y="557.0" fill="#555" font-size="12">(n+1 waits high)</text>
