<text x="20.0" y="28.0" fill="#111" font-size="17" font-weight="bold">The insulation step's mouth at 2.5 mm pitch (schematic end views, looking +Y)</text>
<text x="20.0" y="48.0" fill="#444">~55 px per mm. Z up from the barrel floor; X across the row. Numbers: calc/wave3.out.txt sections A and J; change-the-question on_into_the_housing_w3 section 1.</text>
<text x="20.0" y="66.0" fill="#444">The insulation wings (2.75-3.20 mm tall open) meet the insulation step before the conductor flare centres anything, so the step's mouth must swallow them.</text>
<text x="30.0" y="160.0" fill="#111" font-size="14" font-weight="bold">i2 / K1, i1b: beside a seated neighbour's jacket</text>
