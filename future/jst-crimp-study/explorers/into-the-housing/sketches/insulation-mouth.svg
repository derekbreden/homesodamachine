<text x="510.0" y="610.0" fill="#222" font-size="12">Pre-formed keyhole (c6, 1.96-2.14 mm outside): the step</text>
<text x="510.0" y="626.0" fill="#2e7d32" font-size="12">needs 1.33-1.42 mm, has 1.50: +0.08 to +0.37 mm to spare.</text>
<text x="510.0" y="642.0" fill="#222" font-size="12">Open clone wings need 1.58-1.98 mm here and nothing can</text>
<text x="510.0" y="658.0" fill="#c0392b" font-size="12">give way: -0.08 to -0.48 mm (generous margins).</text>
<text x="20.0" y="720.0" fill="#111" font-size="13" font-weight="bold">Margin = available half-width - (s/2 + capture 0.05-0.15 + land 0.05-0.10 + clearance 0.05-0.10)</text>
