<text x="30.0" y="610.0" fill="#222" font-size="12">Clone wings open 2.80 mm (typical): the step's outer face</text>
<text x="30.0" y="626.0" fill="#222" font-size="12">needs 1.75 mm of half-width, has 1.65 (red: the shortfall).</text>
<text x="30.0" y="642.0" fill="#c0392b" font-size="12">Chamfered, polished outer face pushes the jacket aside:</text>
<text x="30.0" y="658.0" fill="#c0392b" font-size="12">0.10-0.33 mm costs 0.05-1.9 N; every clone spread fits.</text>
<text x="30.0" y="674.0" fill="#555" font-size="12">Dashed: the outer face at the bottom of the stroke.</text>
<text x="510.0" y="160.0" fill="#111" font-size="14" font-weight="bold">i2b pass 2, k6 at 2.5 mm, k7 pass 2: between crimped barrels</text>
