<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1000" height="900" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#aaa" stroke-width="2"/></pattern></defs>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#111">i6 — sort, then push (schematic)</text>
<text x="20" y="48" fill="#444">Crimped contacts wait in ribbon order in the staging plane; a carrier lowers each 8-10 mm into its housing slot, lower layer first, centre outward;</text>
<text x="20" y="66" fill="#444">a backing blade squares the row; the housing is pushed on to the first wall, then one tine finishes each contact. Numbers: calc/wave2.out.txt A-D, calc/wave3.out.txt E, H.</text>
<text x="20" y="96" font-weight="bold" fill="#111">Side view (~11 px per mm), Y to the right, Z up</text>
<rect x="40.0" y="232.4" width="110.0" height="35.2" fill="#8a8a8a" stroke="#222"/>
<text x="29.0" y="280.8" fill="#222">web clamp</text>
<line x1="18.0" y1="250.0" x2="40.0" y2="250.0" stroke="#111" stroke-width="18.7"/>
<rect x="183.0" y="259.4" width="33.0" height="13.2" fill="#e9d8a6" stroke="#9a7d2e"/>
<text x="161.0" y="221.4" fill="#7a5c10">root comb (ribbon order)</text>
<line x1="150.0" y1="250.0" x2="447.0" y2="250.0" stroke="#111" stroke-width="18.7"/>
<rect x="441.5" y="232.9" width="73.7" height="26.4" fill="#e6c35c" stroke="#6b4f00"/>
<text x="535.0" y="243.4" fill="#222">staging plane: waiting conductors, crimped, in ribbon order</text>
<rect x="458.0" y="210.4" width="33.0" height="19.8" fill="#9fd19f" stroke="#2e7d32"/>
<rect x="458.0" y="259.9" width="33.0" height="13.2" fill="#9fd19f" stroke="#2e7d32"/>
<line x1="474.5" y1="210.4" x2="474.5" y2="151.0" stroke="#2e7d32" stroke-width="4"/>
<text x="496.5" y="178.5" fill="#2e7d32">carrier: fingers above and below the crimped barrels,</text>
<text x="496.5" y="193.9" fill="#2e7d32">a toe behind them; X-Y-Z stage, load cell in Y</text>
<line x1="436.0" y1="272.0" x2="436.0" y2="332.5" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="216.0,250.0 370.0,349.0 436.0,349.0" fill="none" stroke="#555" stroke-width="18.7" stroke-linejoin="round"/>
<rect x="430.5" y="331.9" width="73.7" height="26.4" fill="#e6c35c" stroke="#6b4f00"/>
<rect x="370.0" y="355.6" width="44.0" height="24.2" fill="#cfd8e6" stroke="#1f5fa8"/>
<text x="40.0" y="406.2" fill="#1f5fa8">blue: target comb, 8-10 mm lower: U-slots at 2.5 mm in housing order</text>
<rect x="420.6" y="288.5" width="8.8" height="83.6" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>
<text x="40.0" y="423.8" fill="#c0392b">red dashed: backing blade, drops behind every barrel after the sort and takes the push; its tines follow up to ~2 mm into the cavities</text>
<path d="M469.0,367.7 l33.0,0 l0,6.6 l-33.0,0 z" fill="#ddd" stroke="#555"/>
<text x="40.0" y="441.4" fill="#555">grey bar under the noses: sprung guide comb, pressed away as the housing arrives</text>
<text x="40.0" y="459.0" fill="#c0392b">after the first wall, one finishing tine pushes each contact to its own wall (contact lengths differ)</text>
<rect x="535.0" y="326.4" width="85.2" height="45.1" fill="url(#hatch)" stroke="#333"/>
<rect x="524.0" y="371.6" width="121.0" height="13.2" fill="#cfd8e6" stroke="#1f5fa8"/>
<rect x="656.0" y="332.5" width="27.5" height="33.0" fill="#f2d7a0" stroke="#9a7d2e"/>
<line x1="683.5" y1="349.0" x2="810.0" y2="349.0" stroke="#555" stroke-width="3"/>
<line x1="590.0" y1="285.2" x2="540.5" y2="285.2" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<text x="623.0" y="280.8" fill="#222">housing nest pushes −Y onto the row</text>
<text x="634.0" y="399.6" fill="#222">bar load cell, NEMA 17 + T8 screw</text>
<text x="20" y="500" font-weight="bold" fill="#111">Plan view, J7 REEDS B (~13 px per mm), after the sort and before the push</text>
<rect x="76.0" y="599.6" width="104.0" height="180.7" fill="#8a8a8a" stroke="#222"/>
<text x="76.0" y="594.5" fill="#222">5P + 3P edge to edge</text>
