<rect x="511.5" y="774.8" width="87.1" height="25.3" fill="#e6c35c" stroke="#6b4f00"/>
<text x="63.0" y="771.4" font-size="11" text-anchor="end" fill="#666">RB1</text>
<polyline points="180.0,745.2 245.0,745.2 440.0,755.0 511.5,755.0" fill="none" stroke="#666" stroke-width="13.3"/>
<rect x="511.5" y="742.3" width="87.1" height="25.3" fill="#e6c35c" stroke="#6b4f00"/>
<text x="63.0" y="749.2" font-size="11" text-anchor="end" fill="#666">RB2</text>
<polyline points="180.0,723.1 245.0,723.1 440.0,722.5 511.5,722.5" fill="none" stroke="#666" stroke-width="13.3"/>
<rect x="511.5" y="709.8" width="87.1" height="25.3" fill="#e6c35c" stroke="#6b4f00"/>
<text x="63.0" y="727.1" font-size="11" text-anchor="end" fill="#666">RB3</text>
<polyline points="180.0,701.0 245.0,701.0 440.0,690.0 511.5,690.0" fill="none" stroke="#666" stroke-width="13.3"/>
<rect x="511.5" y="677.3" width="87.1" height="25.3" fill="#e6c35c" stroke="#6b4f00"/>
<text x="63.0" y="705.0" font-size="11" text-anchor="end" fill="#666">RB4</text>
<polyline points="180.0,656.9 245.0,656.9 440.0,657.5 511.5,657.5" fill="none" stroke="#666" stroke-width="13.3"/>
<rect x="511.5" y="644.8" width="87.1" height="25.3" fill="#e6c35c" stroke="#6b4f00"/>
<text x="63.0" y="660.9" font-size="11" text-anchor="end" fill="#666">CLO</text>
<polyline points="180.0,634.8 245.0,634.8 440.0,625.0 511.5,625.0" fill="none" stroke="#666" stroke-width="13.3"/>
<rect x="511.5" y="612.3" width="87.1" height="25.3" fill="#e6c35c" stroke="#6b4f00"/>
<text x="63.0" y="638.8" font-size="11" text-anchor="end" fill="#666">CHI</text>
<polyline points="180.0,679.0 245.0,679.0 440.0,592.5 492.0,592.5" fill="none" stroke="#fff" stroke-width="18.3"/>
<polyline points="180.0,679.0 245.0,679.0 440.0,592.5 511.5,592.5" fill="none" stroke="#c0392b" stroke-width="13.3"/>
<rect x="511.5" y="579.8" width="87.1" height="25.3" fill="#e6c35c" stroke="#6b4f00"/>
<text x="63.0" y="683.0" font-size="11" text-anchor="end" fill="#c0392b">GND</text>
<rect x="440.0" y="566.5" width="52.0" height="247.0" fill="#cfd8e6" stroke="#1f5fa8" opacity="0.55"/>
<line x1="505.0" y1="562.6" x2="505.0" y2="817.4" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="615.5" y="571.7" width="100.8" height="236.6" fill="none" stroke="#333" stroke-dasharray="6 4"/>
<text x="732.5" y="791.5" font-size="12" fill="#222">1</text>
<text x="732.5" y="759.0" font-size="12" fill="#222">2</text>
<text x="732.5" y="726.5" font-size="12" fill="#222">3</text>
<text x="732.5" y="694.0" font-size="12" fill="#222">4</text>
<text x="732.5" y="661.5" font-size="12" fill="#222">5</text>
<text x="732.5" y="629.0" font-size="12" fill="#222">6</text>
<text x="732.5" y="596.5" font-size="12" fill="#222">7</text>
<text x="752.0" y="565.2" fill="#222">XHP-7, pins 1-7</text>
<text x="752.0" y="583.4" fill="#555">(dashed: before the push)</text>
<text x="76.0" y="843.4" fill="#c0392b">GND placed last: it rides over CLO and CHI to pin 7</text>
<text x="76.0" y="860.3" fill="#555">order: RB4, CLO, RB3, CHI, RB2, RB1 (lower layer, centre outward), then GND</text>
<text x="427.0" y="554.8" fill="#1f5fa8">target comb</text>
<text x="20" y="884" fill="#444">Web centred on the housing. The staging plane is not shown in plan: it lies above, in ribbon order, until each contact is lowered.</text>
