<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1000" height="800" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#aaa" stroke-width="2"/></pattern><pattern id="rhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#e6a19a" stroke-width="2"/></pattern></defs>
<text x="20.0" y="28.0" fill="#111" font-size="16" font-weight="bold">k8 — half-rows crimped in pallets (c1c), sorted into one row, housing pushed on (i6) (schematic, side view)</text>
<text x="20.0" y="48.0" fill="#444">~11 px per mm. Y left to right; Z up. Numbers: calc/wave3.out.txt section I; change-the-question on_into_the_housing_w3 sections 7, 9.</text>
<rect x="182.0" y="398.0" width="88.0" height="44.0" fill="#8a8a8a" stroke="#222"/>
<text x="182.0" y="455.2" fill="#222" font-size="12">web clamp / root</text>
<path d="M490.0,178.0 L644.0,178.0 L644.0,332.0 L600.0,332.0 L600.0,222.0 L534.0,222.0 L534.0,332.0 L490.0,332.0 z" fill="#b0b8c4" stroke="#334"/>
<text x="655.0" y="189.0" fill="#223" font-size="12">fixed press (c1c) in a small steel C:</text>
<text x="655.0" y="204.0" fill="#223" font-size="12">the X slide steps each carrier under</text>
<text x="655.0" y="219.0" fill="#223" font-size="12">its punch; proof pull on the pocket's</text>
<text x="655.0" y="234.0" fill="#223" font-size="12">rear shoulder</text>
<line x1="270.0" y1="420.0" x2="534.0" y2="420.0" stroke="#222" stroke-width="18.7"/>
<rect x="512.0" y="406.8" width="68.2" height="26.4" fill="#e6c35c" stroke="#6b4f00"/>
<rect x="490.0" y="433.2" width="110.0" height="19.8" fill="#cfd8e6" stroke="#1f5fa8"/>
<text x="611.0" y="424.4" fill="#1f5fa8" font-size="12">pallet B (working plane):</text>
<text x="611.0" y="439.4" fill="#1f5fa8" font-size="12">crimped row B, placed first</text>
<path d="M270.0,414.5 C336.0,354.0 270.0,288.0 226.0,277.0" fill="none" stroke="#666" stroke-width="18.7"/>
<rect x="116.0" y="255.0" width="110.0" height="19.8" fill="#cfd8e6" stroke="#1f5fa8"/>
<rect x="138.0" y="230.8" width="68.2" height="24.2" fill="#e6c35c" stroke="#6b4f00"/>
<text x="116.0" y="179.5" fill="#1f5fa8" font-size="12">pallet A (crimped row A)</text>
<text x="116.0" y="194.5" fill="#1f5fa8" font-size="12">parked UP and back, over the root</text>
<path d="M248.0,222.0 Q424.0,178.0 490.0,387.0" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
<text x="380.0" y="156.0" fill="#2e7d32" font-size="12">its swing into the working</text>
<text x="380.0" y="171.0" fill="#2e7d32" font-size="12">plane stays ABOVE it</text>
<polyline points="314.0,420.0 600.0,508.0 710.0,508.0" fill="none" stroke="#555" stroke-width="18.7" stroke-linejoin="round"/>
<rect x="704.5" y="494.8" width="68.2" height="26.4" fill="#e6c35c" stroke="#6b4f00"/>
<rect x="644.0" y="516.8" width="44.0" height="22.0" fill="#cfd8e6" stroke="#1f5fa8"/>
<text x="600.0" y="556.4" fill="#1f5fa8" font-size="12">target comb: 2.5 mm, housing order,</text>
<text x="600.0" y="571.4" fill="#1f5fa8" font-size="12">h = 6-8 mm below the working plane</text>
<rect x="798.0" y="486.0" width="85.2" height="44.0" fill="url(#hatch)" stroke="#333"/>
<line x1="930.0" y1="464.0" x2="820.0" y2="464.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<text x="798.0" y="431.0" fill="#c0392b" font-size="12">housing pushed -Y</text>
<text x="798.0" y="446.0" fill="#c0392b" font-size="12">onto the one row</text>
<path d="M270.0,431.0 L556.0,442.0 L556.0,530.0 L160.0,552.0 z" fill="url(#rhatch)" stroke="#c0392b" stroke-dasharray="4 3" opacity="0.7"/>
<text x="138.0" y="579.5" fill="#c0392b" font-size="12">red: the space a pallet parked DOWN and back (c1c as drawn) sweeps on its way into</text>
<text x="138.0" y="594.5" fill="#c0392b" font-size="12">the working plane, where every sorted row-B conductor already lies</text>
<rect x="523.0" y="382.6" width="33.0" height="16.5" fill="#9fd19f" stroke="#2e7d32"/>
<text x="336.0" y="354.0" fill="#2e7d32" font-size="12">carrier: top pad on the crimp's lobes,</text>
<text x="336.0" y="369.0" fill="#2e7d32" font-size="12">bottom pad up through the anvil window</text>
<text x="20.0" y="660.0" fill="#222" font-size="12">Order: row B first, then row A, upper layer last. With J4 laid V5, IO25, 3V3, IO26 | GND, IO27, IO23 and J7 laid RB1-RB4, GND | X, CLO, CHI,</text>
<text x="20.0" y="676.0" fill="#222" font-size="12">every upper-layer conductor (J4's 3V3 and GND, J7's GND) is at an odd ribbon position, so in pallet A.</text>
<text x="20.0" y="696.0" fill="#222" font-size="12">Once in the working plane, pallet A's carriers (1-2 mm deep) clear the sorted conductors below them when h &gt;= ~6 mm and the pallet</text>
<text x="20.0" y="712.0" fill="#222" font-size="12">sits beyond 0.36-0.53 of the span from the root (calc wave3 I). Whether the press leaves room above the root is unmeasured.</text>
<text x="20.0" y="732.0" fill="#222" font-size="12">Push: to the first wall, then one finishing tine per contact (lengths differ). No crossing is made by hand.</text>
</svg>
