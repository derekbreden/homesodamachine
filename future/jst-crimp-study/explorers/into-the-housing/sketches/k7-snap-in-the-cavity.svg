<rect x="40" y="240" width="50" height="68" fill="#8a8a8a" stroke="#222"/>
<text x="30.0" y="330.0" fill="#222">web clamp</text>
<text x="150.0" y="325.0" fill="#7a5c10">saddle</text>
<rect x="232" y="160" width="36" height="18" fill="#9fd19f" stroke="#2e7d32"/>
<line x1="250" y1="130" x2="250" y2="158" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<text x="30.0" y="104.0" fill="#2e7d32">hump presser sets the tip's Y from the camera's reading and</text>
<text x="30.0" y="120.0" fill="#2e7d32">stays down until the crimp is done (the bore's 0.2-4 N grip</text>
<text x="30.0" y="136.0" fill="#2e7d32">alone may not hold the hump's 0.4-5.7 N elastic push)</text>
<rect x="545" y="240" width="50" height="60" fill="#e6c35c" stroke="#6b4f00"/>
<text x="554.0" y="275.0" fill="#6b4f00">box</text>
