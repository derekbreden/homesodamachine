<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1000" height="900" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#aaa" stroke-width="2"/></pattern><pattern id="rhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#e6a19a" stroke-width="2"/></pattern></defs>
<text x="20.0" y="28.0" fill="#111" font-size="17" font-weight="bold">k7 — a pre-formed contact snapped onto its conductor and crimped in its own cavity (schematic)</text>
<text x="20.0" y="48.0" fill="#444">Side section through cavity n at ~25 px per mm (as i2's sketch). Box 1.4 mm in the entry; transition and lance unmeasured.</text>
<text x="20.0" y="66.0" fill="#444">Y left to right toward the mating face; Z up. Numbers: calc/wave3.out.txt sections A, B, J; change-the-question wave2 sections 2-5.</text>
