<circle cx="190.0" cy="645.0" r="35.6" fill="#9aa3ad" stroke="#334"/>
<text x="190.0" y="650.0" fill="#111" font-size="12" text-anchor="middle">pin</text>
<path d="M104.5,537.0 L275.5,537.0 L275.5,636.0 L239.5,636.0 Q237.2,584.2 190.0,584.2 Q142.8,584.2 140.5,636.0 L104.5,636.0 z" fill="#b0b8c4" stroke="#334" opacity="0.8"/>
<text x="284.5" y="573.0" fill="#223" font-size="12">jaw (10-80 N: servo lever or toggle clamp)</text>
<text x="284.5" y="618.0" fill="#6b4f00" font-size="12">keyhole: bore 1.55-1.60, throat 1.3-1.5,</text>
<text x="284.5" y="633.0" fill="#6b4f00" font-size="12">1.96-2.14 mm outside (open clone wings 2.46-3.25)</text>
<text x="284.5" y="648.0" fill="#6b4f00" font-size="12">go pin 1.50 must enter the bore from behind</text>
<text x="540.0" y="560.0" fill="#111" font-size="13" font-weight="bold">Feed (plan view, schematic): a stick of pre-formed contacts</text>
<text x="540.0" y="578.0" fill="#111" font-size="13">nose to tail; an escapement singles the lead one out</text>
<rect x="560" y="640" width="220" height="26" fill="#eef1f5" stroke="#1f5fa8"/>
<rect x="570" y="644" width="36" height="18" fill="#e6c35c" stroke="#6b4f00"/>
<rect x="612" y="644" width="36" height="18" fill="#e6c35c" stroke="#6b4f00"/>
