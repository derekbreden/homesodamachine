<path d="M655,300 L668,320 L700,320 L700,300 z" fill="#ffffff" stroke="#333"/>
<text x="660.0" y="345.0" fill="#222">XHP housing in a floating nest</text>
<text x="660.0" y="361.0" fill="#222">(steel is the master)</text>
<line x1="560" y1="190" x2="560" y2="420" stroke="#1f5fa8" stroke-dasharray="5 4"/>
<text x="566.0" y="412.0" fill="#1f5fa8">rear face</text>
