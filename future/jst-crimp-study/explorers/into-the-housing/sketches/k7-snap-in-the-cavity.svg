<rect x="738" y="644" width="36" height="18" fill="#e6c35c" stroke="#6b4f00"/>
<text x="560.0" y="684.0" fill="#1f5fa8" font-size="12">stick (2.1 x 2.6 mm channel, lance groove)</text>
<rect x="792" y="630" width="16" height="44" fill="#9fd19f" stroke="#2e7d32"/>
<text x="792.0" y="622.0" fill="#2e7d32" font-size="12">escapement</text>
<rect x="822" y="640" width="36" height="120" fill="#eef1f5" stroke="#556"/>
<rect x="831" y="700" width="18" height="36" fill="#e6c35c" stroke="#6b4f00"/>
<line x1="840" y1="740" x2="840" y2="790" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<text x="866.0" y="704.0" fill="#333" font-size="12">channel plate:</text>
<text x="866.0" y="720.0" fill="#333" font-size="12">a servo finger slides</text>
<text x="866.0" y="736.0" fill="#333" font-size="12">it box-first into</text>
<text x="866.0" y="752.0" fill="#333" font-size="12">cavity n</text>
<rect x="800" y="796" width="80" height="24" fill="url(#hatch)" stroke="#333"/>
<text x="890.0" y="814.0" fill="#333" font-size="12">housing, cavity n</text>
<text x="20.0" y="880.0" fill="#444">The stick never feeds the cavity directly: nose to tail, the next box would sit against the lead contact's keyhole, inside the crimper's footprint.</text>
