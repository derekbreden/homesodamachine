<rect x="447.5" y="295" width="32.5" height="5" fill="#d4a017" stroke="#6b4f00"/>
<line x1="534" y1="317" x2="556.5" y2="300" stroke="#6b4f00" stroke-width="3"/>
<text x="566.0" y="444.0" fill="#6b4f00">lance hangs free ahead of the anvil's front edge</text>
<rect x="440" y="300" width="91.5" height="92" fill="#b0b8c4" stroke="#334"/>
<text x="250.0" y="380.0" fill="#223">anvil under both barrels</text>
<text x="250.0" y="396.0" fill="#223">takes the snap's 0.5-20 N</text>
<rect x="436" y="296" width="6" height="40" fill="#555"/>
<text x="250.0" y="420.0" fill="#333">backstop on the tab stub (-Y)</text>
<rect x="446" y="150" width="84" height="16" fill="#9fd19f" stroke="#2e7d32"/>
<rect x="456" y="166" width="16" height="84" fill="#9fd19f" stroke="#2e7d32"/>
<rect x="501" y="166" width="14" height="110" fill="#9fd19f" stroke="#2e7d32"/>
<line x1="488" y1="112" x2="488" y2="146" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<text x="600.0" y="110.0" fill="#2e7d32">two-tine presser foot:</text>
<text x="600.0" y="126.0" fill="#2e7d32">rear tine pushes the jacket down through the keyhole's</text>
<text x="600.0" y="142.0" fill="#2e7d32">1.3-1.5 mm throat into its 1.55-1.60 mm bore (a snap);</text>
<text x="600.0" y="158.0" fill="#2e7d32">front tine lays the strands into the open conductor U.</text>
<text x="600.0" y="180.0" fill="#223">Then the camera looks, the foot lifts, and the knee</text>
<text x="600.0" y="196.0" fill="#223">closes the stepped crimper (as i2): the conductor flare</text>
<text x="600.0" y="212.0" fill="#223">centres the contact; the mouth swallows the keyhole.</text>
<text x="20.0" y="500.0" fill="#111" font-size="13" font-weight="bold">Pre-former (end view, ~45 px per mm): contact box-down in a nest (a cut XHP stub works),</text>
<text x="20.0" y="518.0" fill="#111" font-size="13">pin from behind, jaw closes the wings around it. Jaw = a second cut of the press's insulation-step profile.</text>
<rect x="118.0" y="690.0" width="144.0" height="45.0" fill="url(#hatch)" stroke="#333"/>
<text x="271.0" y="717.0" fill="#333" font-size="12">nest</text>
