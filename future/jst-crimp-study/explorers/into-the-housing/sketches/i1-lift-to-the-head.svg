<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="940" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">i1 — lift one conductor to an ordinary crimp head, then set it into its cavity (schematic, side view)</text>
  <text x="20" y="48" fill="#444">~10 px per mm. Y left to right toward the mating face; Z up. The carriage (web clamp, saddle comb, housing nest) steps 2.5 mm in X, into the page.</text>

  <!-- carriage base -->
  <rect x="40" y="440" width="700" height="18" fill="#dcdcdc" stroke="#777"/>
  <text x="50" y="478" fill="#555">carriage on one X rail</text>

  <!-- web clamp -->
  <rect x="60" y="378" width="60" height="44" fill="#8a8a8a" stroke="#222"/>
  <text x="50" y="436" fill="#222">web clamp</text>

  <!-- saddle comb, other conductors resting (humped) -->
  <path d="M170,430 L220,388 L270,430 z" fill="#e9d8a6" stroke="#9a7d2e"/>
  <text x="170" y="500" fill="#7a5c10">saddle comb, 2.5 mm pitch:</text>
  <text x="170" y="516" fill="#7a5c10">each hump stores ~8 mm</text>
  <path d="M120,400 C170,400 190,382 220,382 C250,382 270,400 320,400 L520,400" fill="none" stroke="#777" stroke-width="10" opacity="0.6"/>
  <text x="290" y="432" fill="#666">other conductors wait on their humps, tips ~8 mm short</text>

  <!-- housing nest -->
  <rect x="600" y="378" width="100" height="44" fill="#f4f1ea" stroke="#333"/>
  <rect x="600" y="392" width="30" height="16" fill="#e6c35c" stroke="#6b4f00" opacity="0.7"/>
  <text x="708" y="386" fill="#222">XHP in its nest</text>
  <text x="708" y="402" fill="#222">(or on a real</text>
  <text x="708" y="418" fill="#222">header, see i5)</text>
  <line x1="600" y1="340" x2="600" y2="440" stroke="#1f5fa8" stroke-dasharray="5 4"/>

  <!-- head above -->
  <rect x="410" y="150" width="170" height="70" fill="#b0b8c4" stroke="#334"/>
  <text x="420" y="100" fill="#223">ordinary-width crimp head, fixed, 16-20 mm above the row:</text>
  <text x="420" y="116" fill="#112">the SN-2549 in a cradle (lead screw), f3's knee press</text>
  <text x="420" y="132" fill="#112">on strip, or an applicator in a crank press</text>
  <text x="496" y="190" fill="#112" text-anchor="middle">head</text>
  <rect x="620" y="150" width="30" height="18" fill="#444"/>
  <line x1="628" y1="168" x2="560" y2="208" stroke="#444" stroke-dasharray="3 3"/>
  <text x="658" y="158" fill="#333">camera looks down: the insulation</text>
  <text x="658" y="174" fill="#333">edge in the window is the Y reference</text>

  <!-- lifted conductor n -->
  <line x1="120" y1="400" x2="520" y2="226" stroke="#111" stroke-width="10"/>
  <rect x="520" y="222" width="46" height="12" fill="#d4a017" stroke="#6b4f00"/>
  <text x="130" y="240" fill="#111">conductor n lifted straight: the hump pays out</text>
  <text x="130" y="256" fill="#111">as it rises (lift 16-20 mm, calc section 9)</text>

  <!-- gripper -->
  <rect x="492" y="240" width="18" height="28" fill="#9fd19f" stroke="#2e7d32"/>
  <text x="130" y="190" fill="#2e7d32">gripper: fingers above and below the wire,</text>
  <text x="130" y="206" fill="#2e7d32">Y-Z slide, load cell; loose in X, Z for the stroke</text><line x1="400" y1="202" x2="490" y2="248" stroke="#2e7d32" stroke-width="1"/>

  <!-- path arrows -->
  <path d="M500,395 L500,275" fill="none" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="440" y="345" fill="#1f5fa8">1 pick,</text>
  <text x="440" y="361" fill="#1f5fa8">lift</text>
  <path d="M510,248 L570,248" fill="none" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="520" y="266" fill="#1f5fa8">2 lay into the barrels</text>
  <text x="600" y="240" fill="#c0392b">3 crimp</text>
  <path d="M575,236 C640,270 610,330 598,390" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="640" y="300" fill="#c0392b">4 carry down, nose into</text>
  <text x="640" y="316" fill="#c0392b">cavity n's lead-in, push (after a 20 N proof pull)</text>
  <text x="640" y="332" fill="#c0392b">5 slotted blade finishes</text>
  <text x="640" y="348" fill="#c0392b">6 pull back at 5 N, index</text>

  <text x="20" y="560" fill="#444">Contacts reach the head from its own feed (strip on an applicator, or loose contacts in a printed carrier tape).</text>
  <text x="20" y="578" fill="#444">The grip point behind the insulation barrel is the same for laying, crimping, carrying and pushing.</text>
</svg>
