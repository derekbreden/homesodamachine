<line x1="210" y1="530" x2="290" y2="530" stroke="#24292f" stroke-width="7"/>
<line x1="290" y1="530" x2="315" y2="530" stroke="#9aa4ae" stroke-width="3"/>
<circle cx="85" cy="560" r="7" fill="#57606a" stroke="#1f2328" stroke-width="1.5"/>
<text x="98" y="564" font-size="10" fill="#1f2328" text-anchor="start" font-weight="normal">ball</text>
<circle cx="143" cy="560" r="7" fill="#57606a" stroke="#1f2328" stroke-width="1.5"/>
<text x="155" y="564" font-size="10" fill="#1f2328" text-anchor="start" font-weight="normal">ball</text>
<circle cx="188" cy="560" r="7" fill="#57606a" stroke="#1f2328" stroke-width="1.5"/>
<text x="200" y="564" font-size="10" fill="#1f2328" text-anchor="start" font-weight="normal">ball</text>
<text x="325" y="520" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">conductor ~6 mm</text>
<text x="325" y="533" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">proud of the clip</text>
<text x="230" y="565" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">steel balls on dowel-pin pairs; magnet</text>
<text x="430" y="520" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">Tip wander ~1.2 mm RSS approached one way, ~6 mm if not;</text>
<text x="430" y="534" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">funnels &gt;= 5 mm lead-in; the station's stage and camera do the last 0.2 mm.</text>
<text x="430" y="548" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">Cameras: one on the wrist and one overhead feed the policy;</text>
<text x="430" y="562" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">the station cameras judge whether each step worked.</text>
