<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Helvetica, Arial, sans-serif">
<title>v5 inspection booth</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">v5  The inspection booth: look and pull after any crimp, hand-made or machine-made</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Schematic side elevation (wire left to right) with an end-view inset. Not to scale.</text>
<rect x="60" y="380" width="640" height="20" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="400" y="250" width="170" height="110" rx="0" fill="#fffbe6" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="5 4" opacity="1"/>
<text x="485" y="244" font-size="10.5" fill="#9a6700" text-anchor="middle" font-weight="normal">backlight panel, far side</text>
<rect x="430" y="150" width="120" height="30" rx="0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" opacity="1"/>
<text x="490" y="140" font-size="10.5" fill="#0969da" text-anchor="middle" font-weight="normal">45 deg mirror above the crimp</text>
<rect x="420" y="330" width="120" height="50" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="540" y="318" width="10" height="62" rx="0" fill="#57606a" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="556" y="330" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">lance-notched stop behind the box</text>
<text x="420" y="420" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">blackened block, blade support, roll flat; gauge pin beside; box read as roll gauge</text>
<line x1="180" y1="336" x2="470" y2="336" stroke="#24292f" stroke-width="7"/>
<rect x="470" y="330" width="68" height="12" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="250" y="316" width="40" height="40" rx="0" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="270" y="370" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">clamp</text>
<line x1="245" y1="336" x2="170" y2="336" stroke="#bc4c00" stroke-width="2.5" marker-end="url(#arrf)"/>
<rect x="100" y="316" width="60" height="40" rx="0" fill="#f6c177" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="130" y="305" font-size="11" fill="#bc4c00" text-anchor="middle" font-weight="normal">motor + load cell</text>
<text x="130" y="290" font-size="11" fill="#bc4c00" text-anchor="middle" font-weight="normal">proof pull ~20 N</text>
<text x="300" y="460" font-size="11" fill="#0969da" text-anchor="start" font-weight="normal">camera: in front of the page, looking in (see inset)</text>
<rect x="720" y="200" width="240" height="230" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" opacity="1"/>
<text x="840" y="218" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">end view, along the wire</text>
<rect x="815" y="350" width="50" height="40" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<circle cx="840" cy="342" r="9" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5"/>
<g transform="rotate(0 750 342)"><rect x="734" y="331" width="26" height="22" rx="3" fill="#57606a" stroke="#1f2328"/><rect x="760" y="336" width="9" height="12" fill="#8c959f" stroke="#1f2328"/></g>
<text x="735" y="318" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">camera</text>
<rect x="930" y="305" width="12" height="70" rx="0" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<line x1="770" y1="342" x2="925" y2="342" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="815" y1="260" x2="865" y2="300" stroke="#0969da" stroke-width="3"/>
<line x1="770" y1="336" x2="838" y2="280" stroke="#0969da" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="840" y1="280" x2="840" y2="330" stroke="#0969da" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="870" y="270" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">mirror</text>
<text x="840" y="408" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">side silhouette + top view,</text>
<text x="840" y="421" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">one frame, two focus settings</text>
<rect x="720" y="60" width="240" height="100" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="732" y="82" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">J4 pin 3  crimp 212</text>
<text x="732" y="96" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">CH 0.87 mm   width 1.52</text>
<text x="732" y="110" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">bellmouth yes  brush 0.3</text>
<text x="732" y="124" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">window: insulation 50/50</text>
<text x="732" y="138" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">proof 20 N: no slip   PASS</text>
<text x="840" y="175" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal" font-style="italic">(illustrative readout, not data)</text>
<text x="60" y="490.0" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="normal">Modes: a crimp dropped in by the person after the hand tool; the verify station of any machine;</text>
<text x="60" y="504.5" font-size="11.5" fill="#57606a" text-anchor="start" font-weight="normal">the finished housing on a board wafer, continuity pin by pin and a picture of the mating face.</text>
</svg>