<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
<title>v4 tap look pick</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">v4  Tap, look, pick: loose contacts from a lit tray into the nest</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Schematic side elevation with a plan-view inset of what the camera sees. Not to scale.</text>
<rect x="120" y="330" width="300" height="12" rx="0" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="112" y="340" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">frosted tray (diffuser)</text>
<rect x="120" y="350" width="300" height="14" rx="0" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<text x="270" y="380" font-size="11" fill="#9a6700" text-anchor="middle" font-weight="normal">LED panel: contacts read as black shapes</text>
<line x1="150" y1="364" x2="150" y2="410" stroke="#57606a" stroke-width="2"/>
<line x1="270" y1="364" x2="270" y2="410" stroke="#57606a" stroke-width="2"/>
<line x1="390" y1="364" x2="390" y2="410" stroke="#57606a" stroke-width="2"/>
<text x="140" y="425" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">flexure legs</text>
<rect x="420" y="395" width="50" height="26" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="445" y="440" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">tapper</text>
<text x="445" y="454" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">(solenoid / voice coil)</text>
<line x1="420" y1="400" x2="420" y2="350" stroke="#bc4c00" stroke-width="2" marker-end="url(#arrf)"/>
<rect x="160" y="322" width="22" height="8" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="215" y="308" width="8" height="22" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="250" y="320" width="22" height="10" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="330" y="322" width="20" height="8" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="375" y="310" width="10" height="20" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<g transform="rotate(90 270 120)"><rect x="254" y="109" width="26" height="22" rx="3" fill="#57606a" stroke="#1f2328"/><rect x="280" y="114" width="9" height="12" fill="#8c959f" stroke="#1f2328"/></g>
<text x="270" y="104" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal">ELP, looking down</text>
<line x1="270" y1="145" x2="200" y2="318" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="270" y1="145" x2="340" y2="318" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="210" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">two exposures per tap:</text>
<text x="60" y="224" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">backlight only -&gt; outline;</text>
<text x="60" y="238" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">top light only -&gt; the open U</text>
<rect x="560" y="150" width="18" height="120" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<polygon points="563,270 575,270 571,290 567,290" fill="#57606a" stroke="#1f2328" stroke-width="1.5"/>
<rect x="560" y="290" width="22" height="10" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="590" y="200" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">pick head on the stage Z</text>
<text x="590" y="214" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">(bellows cup or tilt-cut face: the box top</text>
<text x="590" y="228" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">sits 11-17 deg on its lance; sensor confirms)</text>
<line x1="569" y1="140" x2="569" y2="110" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="560" y1="120" x2="480" y2="120" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="640" y="330" width="120" height="40" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="682" y="318" width="36" height="12" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="700" y="390" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">nest on the anvil (v1)</text>
<text x="700" y="404" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">camera checks: seated, level</text>
<rect x="40" y="460" width="900" height="80" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" opacity="1"/>
<text x="50" y="478" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">what the software sorts after each tap (plan view, backlit):</text>
<rect x="60" y="492" width="40" height="12" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="100" y="489" width="16" height="18" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="126" y="496" font-size="10.5" fill="#1a7f37" text-anchor="start" font-weight="normal">barrels up, box</text>
<text x="126" y="510" font-size="10.5" fill="#1a7f37" text-anchor="start" font-weight="normal">forward: pick</text>
<rect x="238" y="492" width="40" height="12" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="278" y="489" width="16" height="18" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="304" y="496" font-size="10.5" fill="#9a6700" text-anchor="start" font-weight="normal">barrels up, wrong</text>
<text x="304" y="510" font-size="10.5" fill="#9a6700" text-anchor="start" font-weight="normal">heading: rotate or wait</text>
<rect x="416" y="492" width="40" height="12" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="456" y="489" width="16" height="18" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="482" y="496" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">on its side:</text>
<text x="482" y="510" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">tap again</text>
<rect x="594" y="492" width="40" height="12" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="634" y="489" width="16" height="18" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="660" y="496" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">barrels down:</text>
<text x="660" y="510" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">tap again</text>
<rect x="772" y="492" width="40" height="12" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="812" y="489" width="16" height="18" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="838" y="496" font-size="10.5" fill="#cf222e" text-anchor="start" font-weight="normal">two touching or</text>
<text x="838" y="510" font-size="10.5" fill="#cf222e" text-anchor="start" font-weight="normal">tangled: tap harder</text>
</svg>