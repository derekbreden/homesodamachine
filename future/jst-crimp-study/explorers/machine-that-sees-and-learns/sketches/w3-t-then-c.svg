<text x="820" y="175.0" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">Nothing stands over the barrel at T; at C the</text>
<text x="820" y="188.5" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">punch only has to open 4-5 mm (e 2.0-2.5)</text>
<text x="820" y="202.0" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">to pass a tacked contact with 0.5-1.7 mm to spare.</text>
<text x="30" y="680" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">Sequence per conductor: T (nest, key k down, tack to a loose stop, top-down look) -&gt; key up, contact rides on its wire -&gt; C: carry in high, set down on the seat,</text>
<text x="30" y="697" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">seat look under the neighbours -&gt; MCU turns the eccentric, dies bottom on the disc stack, button cell trace -&gt; re-touch at 10 N, indicator reads crimp height -&gt;</text>
<text x="30" y="714" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">ram up, lift 1.0-1.7, draw back -&gt; silhouette on a blade beside C, box as roll gauge (second crimp height) -&gt; proof pull on a backed plate -&gt; key back up, next conductor.</text>
