<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
<title>v3 the press that runs its own experiments</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">v3  The press that runs its own experiments</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Schematic loop. The chart is axes only: every point on it is still to be measured.</text>
<rect x="30" y="90" width="170" height="80" rx="8" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="115.0" y="114" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">choose a set point</text>
<text x="115.0" y="135" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">crimp height (bottom stop),</text>
<text x="115.0" y="150" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">insertion depth, contact lot</text>
<line x1="200" y1="130.0" x2="222" y2="130.0" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="222" y="90" width="170" height="80" rx="8" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="307.0" y="114" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">crimp</text>
<text x="307.0" y="135" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">force vs ram position</text>
<text x="307.0" y="150" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">recorded every 10 ms</text>
<line x1="392" y1="130.0" x2="414" y2="130.0" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="414" y="90" width="170" height="80" rx="8" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="499.0" y="114" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">photograph</text>
<text x="499.0" y="135" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">side silhouette: CH, bellmouth,</text>
<text x="499.0" y="150" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">brush; top: width, seam, strays</text>
<line x1="584" y1="130.0" x2="606" y2="130.0" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="606" y="90" width="170" height="80" rx="8" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="691.0" y="114" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">pull to failure</text>
<text x="691.0" y="135" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">peak N and the mode:</text>
<text x="691.0" y="150" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">pull-out or wire break</text>
<line x1="776" y1="130.0" x2="798" y2="130.0" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="798" y="90" width="170" height="80" rx="8" fill="#dafbe1" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="883.0" y="114" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">fit and decide</text>
<text x="883.0" y="135" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">pull force vs CH, image vs</text>
<text x="883.0" y="150" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">pull: where is the window?</text>
<polyline points="883.0,170 883.0,210 115.0,210 115.0,174" fill="none" stroke="#1f2328" stroke-width="1.5"/>
<line x1="115.0" y1="182" x2="115.0" y2="172" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="470" y="204" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">next set point: a fixed grid, or the supervisor zooms in where the pull force changes fastest</text>
<rect x="30" y="260" width="420" height="110" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<text x="45" y="285.0" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="normal">Every destroyed test crimp labels its own pictures:</text>
<text x="45" y="299.5" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="normal">the pull result says whether the image of that crimp</text>
<text x="45" y="314.0" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="normal">showed a good crimp. The non-destructive checks in</text>
<text x="45" y="328.5" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="normal">production (v1, v5) are tuned on these labels, and</text>
<text x="45" y="343.0" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="normal">Claude's few-shot examples are drawn from them.</text>
<line x1="540" y1="500" x2="930" y2="500" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="540" y1="500" x2="540" y2="290" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="930" y="536" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">conductor crimp height, mm</text>
<text x="532" y="295" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">pull N</text>
<line x1="560" y1="500" x2="560" y2="505" stroke="#1f2328" stroke-width="1.5"/>
<text x="560" y="518" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">0.70</text>
<line x1="675" y1="500" x2="675" y2="505" stroke="#1f2328" stroke-width="1.5"/>
<text x="675" y="518" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">0.80</text>
<line x1="790" y1="500" x2="790" y2="505" stroke="#1f2328" stroke-width="1.5"/>
<text x="790" y="518" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">0.90</text>
<line x1="905" y1="500" x2="905" y2="505" stroke="#1f2328" stroke-width="1.5"/>
<text x="905" y="518" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">1.00</text>
<line x1="540" y1="410" x2="920" y2="410" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="920" y="404" font-size="10.5" fill="#cf222e" text-anchor="end" font-weight="normal">39.2 N, JST minimum at 22 AWG [mfr]</text>
<line x1="540" y1="325" x2="920" y2="325" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="920" y="319" font-size="10.5" fill="#57606a" text-anchor="end" font-weight="normal">~85-100 N, the wire itself breaks [source]</text>
<circle cx="560" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="583" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="606" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="629" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="652" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="675" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="698" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="721" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="744" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="767" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="790" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="813" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="836" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="859" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="882" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<circle cx="905" cy="370" r="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="740" y="360" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">16 set points x 5 crimps, results unknown</text>
<text x="740" y="440" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">the window is where the lower tail clears 39.2 N</text>
<text x="740" y="454" font-size="10.5" fill="#57606a" text-anchor="middle" font-weight="normal">and the pictures also pass</text>
<text x="30" y="410" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">Instruments: height by a stop, shim stack, hit-and-re-touch or crank angle; die gap by a 0.001 mm indicator; force by a load cell</text>
<text x="30" y="426" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">in the force path (rod gauges on an applicator); pull on a soldered lug or bare-copper wrap; camera at the silhouette window.</text>
<text x="30" y="452" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">~153 test crimps, ~8 h unattended, ~$2 of contacts; coupons are production-made 5P ends [calc/campaign.out.txt].</text>
</svg>