<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
<title>v7 the first day</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">v7  The first day of running: the machine asks about everything, and every answer is a label</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Estimated hours [calc wave2 s8]. About 25 crimps, 5 of them cut open and pulled.</text>
<rect x="20" y="110" width="64.0" height="50" rx="3" fill="#eaeef2" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="52.0" y1="160" x2="52.0" y2="170" stroke="#8c959f" stroke-width="1.5"/>
<text x="52.0" y="182" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">doctor</text>
<rect x="84.0" y="110" width="96.0" height="50" rx="3" fill="#eaeef2" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="132.0" y1="160" x2="132.0" y2="188" stroke="#8c959f" stroke-width="1.5"/>
<text x="132.0" y="200" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">calibrate</text>
<rect x="180.0" y="110" width="64.0" height="50" rx="3" fill="#f6f0ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="212.0" y1="160" x2="212.0" y2="170" stroke="#8c959f" stroke-width="1.5"/>
<text x="212.0" y="182" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">reference strokes</text>
<rect x="244.0" y="110" width="96.0" height="50" rx="3" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="292.0" y1="160" x2="292.0" y2="188" stroke="#8c959f" stroke-width="1.5"/>
<text x="292.0" y="200" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">dry lay-ins</text>
<rect x="340.0" y="110" width="128.0" height="50" rx="3" fill="#fff0f6" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="404.0" y1="160" x2="404.0" y2="170" stroke="#8c959f" stroke-width="1.5"/>
<text x="404.0" y="182" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">5 scrap crimps, ask all</text>
<rect x="468.0" y="110" width="96.0" height="50" rx="3" fill="#fff8c5" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="516.0" y1="160" x2="516.0" y2="188" stroke="#8c959f" stroke-width="1.5"/>
<text x="516.0" y="200" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">cut, measure, pull</text>
<rect x="564.0" y="110" width="96.0" height="50" rx="3" fill="#eaeef2" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="612.0" y1="160" x2="612.0" y2="170" stroke="#8c959f" stroke-width="1.5"/>
<text x="612.0" y="182" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">lunch; thresholds 2</text>
<rect x="660.0" y="110" width="192.0" height="50" rx="3" fill="#dafbe1" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="756.0" y1="160" x2="756.0" y2="188" stroke="#8c959f" stroke-width="1.5"/>
<text x="756.0" y="200" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">five 4P ends, 20 crimps</text>
<rect x="852.0" y="110" width="96.0" height="50" rx="3" fill="#eaeef2" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="900.0" y1="160" x2="900.0" y2="170" stroke="#8c959f" stroke-width="1.5"/>
<text x="900.0" y="182" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">insert, test</text>
<rect x="948.0" y="110" width="32.0" height="50" rx="3" fill="#fff0f6" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="964.0" y1="160" x2="964.0" y2="188" stroke="#8c959f" stroke-width="1.5"/>
<text x="964.0" y="200" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">report</text>
<text x="20.0" y="102" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">0 h</text>
<text x="148.0" y="102" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">1 h</text>
<text x="276.0" y="102" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">2 h</text>
<text x="404.0" y="102" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">3 h</text>
<text x="532.0" y="102" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">4 h</text>
<text x="660.0" y="102" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">5 h</text>
<text x="788.0" y="102" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">6 h</text>
<text x="916.0" y="102" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">7 h</text>
<text x="20" y="250" font-size="11.2" fill="#57606a" text-anchor="start" font-weight="normal">What is checked before anything crimps: every device found by name; the MCU's heartbeat and e-stop loop;</text>
<text x="20" y="267" font-size="11.2" fill="#57606a" text-anchor="start" font-weight="normal">the load cell's zero and noise; focus walked upward once; fiducials and the gauge pin give px/mm.</text>
<text x="20" y="284" font-size="11.2" fill="#57606a" text-anchor="start" font-weight="normal">Reference strokes with an empty nest and with a contact but no wire set the floor of the force envelope.</text>
<text x="20" y="301" font-size="11.2" fill="#57606a" text-anchor="start" font-weight="normal">The first crimps are scrap: each gate and after-picture is shown to Derek, then the crimp is cut open, micrometered</text>
<text x="20" y="318" font-size="11.2" fill="#57606a" text-anchor="start" font-weight="normal">and pulled. Those five are the first labels. Thresholds 2 come from them; the day's real crimps are the simplest end</text>
<text x="20" y="335" font-size="11.2" fill="#57606a" text-anchor="start" font-weight="normal">type (4P into XHP-4: J3, J5, J9, J11, J13). Insertion stays by hand until the crimp side is trusted.</text>
</svg>