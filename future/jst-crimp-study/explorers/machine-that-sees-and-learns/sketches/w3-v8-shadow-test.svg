<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Helvetica, Arial, sans-serif">
<title>shadow test in the open conductor barrel</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">The shadow test: a bundle held by its jacket hovers off the floor; a strand on the floor casts no displaced shadow</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Left: end view looking along the wire at mid conductor barrel, 1 mm = 110 px, from cited dimensions. Right: side view, schematic.</text>
<rect x="110.0" y="540.0" width="440.0" height="55.0" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="330.0" y="574.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">anvil (blackened)</text>
<rect x="231.55" y="518.0" width="196.9" height="22.0" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="231.55" y="369.5" width="22.0" height="148.5" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="406.45" y="369.5" width="22.0" height="148.5" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="438.45" y="379.5" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">wing tips 1.50-1.60 mm up</text>
<text x="438.45" y="393.5" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">open width 1.68-1.90 [xh-facts]</text>
<rect x="325.80249305481374" y="514.0" width="87.38753118182935" height="4" rx="0" fill="#9a6700" stroke="#9a6700" stroke-width="1.5" opacity="0.6"/>
<line x1="246.3215841753415" y1="253.85105816674331" x2="325.80249305481374" y2="518.0" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="246.3215841753415" y1="253.85105816674331" x2="413.19002423664307" y2="518.0" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="246.3215841753415" cy="253.85105816674331" r="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<rect x="246.80997576335693" y="514.0" width="87.38753118182935" height="4" rx="0" fill="#0969da" stroke="#0969da" stroke-width="1.5" opacity="0.6"/>
<line x1="413.6784158246585" y1="253.85105816674331" x2="334.19750694518626" y2="518.0" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="413.6784158246585" y1="253.85105816674331" x2="246.80997576335693" y2="518.0" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="413.6784158246585" cy="253.85105816674331" r="8" fill="#fff8c5" stroke="#0969da" stroke-width="1.5"/>
<circle cx="330.0" cy="433.3" r="39.6" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5"/>
<text x="330.0" y="437.3" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">bundle 0.72</text>
<text x="225.5" y="229.79999999999995" font-size="10.5" fill="#9a6700" text-anchor="middle" font-weight="normal">LED at 60-75 deg, left</text>
<text x="434.5" y="229.79999999999995" font-size="10.5" fill="#0969da" text-anchor="middle" font-weight="normal">LED at 60-75 deg, right</text>
<line x1="261.8" y1="518.0" x2="261.8" y2="472.9" stroke="#1a7f37" stroke-width="1.5"/>
<line x1="256.3" y1="472.9" x2="267.3" y2="472.9" stroke="#1a7f37" stroke-width="1.5"/>
<text x="220.0" y="490.5" font-size="10.5" fill="#1a7f37" text-anchor="end" font-weight="normal">0.30-0.52</text>
<text x="220.0" y="503.5" font-size="10.5" fill="#1a7f37" text-anchor="end" font-weight="normal">off the floor</text>
<circle cx="396.0" cy="513.6" r="4.4" fill="#9aa4ae" stroke="#cf222e" stroke-width="1.5"/>
<line x1="398.2" y1="507.0" x2="467.5" y2="435.5" stroke="#cf222e" stroke-width="1.5"/>
<text x="469.7" y="432.2" font-size="10.5" fill="#cf222e" text-anchor="start" font-weight="normal">a strand on the floor:</text>
<text x="469.7" y="445.7" font-size="10.5" fill="#cf222e" text-anchor="start" font-weight="normal">silver with no shadow</text>
<text x="469.7" y="459.2" font-size="10.5" fill="#cf222e" text-anchor="start" font-weight="normal">beside it -&gt; fail</text>
<g transform="rotate(90 330.0 171.5)"><rect x="314.0" y="160.5" width="26" height="22" rx="3" fill="#57606a" stroke="#1f2328"/><rect x="340.0" y="165.5" width="9" height="12" fill="#8c959f" stroke="#1f2328"/></g>
<text x="356.0" y="167.5" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">top camera, straight down</text>
<text x="356.0" y="181.5" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">(or through v9's 45 deg mirror)</text>
<text x="20" y="616.0" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">Lit in turn, each LED throws the raised bundle's shadow 0.08-0.30 mm further aside than a bundle lying on the floor</text>
<text x="20" y="630.0" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">would (10-36 px at 122 px/mm, 7-26 px at 86 px/mm) [bm W s2]. The coloured bars are each LED's shadow.</text>
<rect x="620" y="110" width="360" height="330" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" opacity="1"/>
<text x="632" y="130" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">side view (schematic): why the bundle hovers</text>
<rect x="640" y="350" width="320" height="16" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="660" y="342" width="70" height="8" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<polyline points="660,342 660,286 690,276 700,276 730,286 730,342" fill="none" stroke="#afb8c1" stroke-width="3"/>
<text x="695" y="268" font-size="10" fill="#bc4c00" text-anchor="middle" font-weight="normal">tacked</text>
<rect x="640" y="290" width="90" height="44" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="680" y="386" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">jacket held</text>
<rect x="790" y="342" width="70" height="8" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<polyline points="790,342 790,300" fill="none" stroke="#afb8c1" stroke-width="3"/>
<polyline points="860,342 860,300" fill="none" stroke="#afb8c1" stroke-width="3"/>
<rect x="730" y="306" width="150" height="13" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="825" y="296" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">open conductor barrel</text>
<line x1="875" y1="342" x2="875" y2="319" stroke="#1a7f37" stroke-width="2"/>
<text x="825" y="386" font-size="10" fill="#1a7f37" text-anchor="middle" font-weight="normal">gap under the bundle</text>
<rect x="900" y="310" width="50" height="40" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="925" y="304" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">box</text>
<text x="634" y="158" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">The jacket sits in the insulation barrel, so the bare</text>
<text x="634" y="172" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">bundle leaves it at the jacket's height and crosses the</text>
<text x="634" y="186" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">open conductor barrel above its floor. Focus cannot</text>
<text x="634" y="200" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">tell 0.3-0.5 mm apart: depth of field is ~0.55-0.76 mm</text>
<text x="634" y="214" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">at 122 px/mm [bm W s2]. A low LED can: a raised</text>
<text x="634" y="228" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">bundle's shadow falls beside it; a strand on the</text>
<text x="634" y="242" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">floor has none.</text>
<text x="20" y="650" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">Cited: clone drawings for the barrel [xh-facts s1]; bundle 0.72 mm [xh-facts s7]; hover and shadow offsets from borrowed-machines'</text>
<text x="20" y="664" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">exchange calc s2, taking the two barrel floors as one plane. Unproven on tin: one photograph with two LEDs at ~65 deg settles it.</text>
</svg>