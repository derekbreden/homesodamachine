<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif">
<title>v8 tack, look, then crimp</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">v8  Tack, look, then crimp: a light watched station pins the contact; the heavy crimp comes after</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Schematic side elevations, wire axis left to right, box at the right. Not to scale.</text>
<rect x="20" y="70" width="470" height="370" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" opacity="1"/>
<text x="35" y="92" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Station T: tack (light, printed frame, steel former and anvil insert)</text>
<rect x="60" y="330" width="400" height="30" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="260" y="350" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal">nest: box slot + lance relief; steel insert under the insulation barrel</text>
<rect x="330" y="300" width="70" height="30" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="365" y="294" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">box</text>
<rect x="265" y="318" width="55" height="12" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<polygon points="265,318 268,296 274,318" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5"/>
<polygon points="314,318 317,296 320,318" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5"/>
<rect x="205" y="318" width="45" height="12" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="60" y1="300" x2="205" y2="300" stroke="#24292f" stroke-width="12"/>
<line x1="205" y1="306" x2="248" y2="306" stroke="#24292f" stroke-width="12"/>
<line x1="248" y1="311" x2="300" y2="311" stroke="#9aa4ae" stroke-width="4"/>
<polygon points="60,280 190,283 190,294 60,292" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5"/>
<text x="90" y="274" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">key: hold-down</text>
<rect x="210" y="150" width="20" height="150" rx="0" fill="#afb8c1" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="220" y1="120" x2="220" y2="170" stroke="#bc4c00" stroke-width="3" marker-end="url(#arrf)"/>
<text x="240" y="106" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">former: 1.2-1.5 mm steel, C's insulation</text>
<text x="240" y="120" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">profile 0.1-0.2 mm wider; stop at C's</text>
<text x="240" y="134" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">final insulation height + 0.2-0.5 mm;</text>
<text x="240" y="148" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">33-132 N, 35 kg.cm servo on a 1:1 lever</text>
<g transform="rotate(90 292 200)"><rect x="276" y="189" width="26" height="22" rx="3" fill="#57606a" stroke="#1f2328"/><rect x="302" y="194" width="9" height="12" fill="#8c959f" stroke="#1f2328"/></g>
<line x1="292" y1="222" x2="292" y2="292" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrv)"/>
<text x="310" y="210" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">top camera, straight down:</text>
<text x="310" y="224" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">open U, strands, edge in window,</text>
<text x="310" y="238" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">LEDs at 60-75 deg: the shadow test</text>
<text x="60" y="400" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">cam 2 across at wing height (as v1), backlight far side</text>
<text x="60" y="418" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">20 kg load cell under the nest insert: forming curve only</text>
<rect x="510" y="70" width="470" height="370" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" opacity="1"/>
<text x="525" y="92" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">Station C: a host that takes a tacked contact</text>
<rect x="560" y="330" width="380" height="30" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="750" y="350" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal">seat: floor ledge and front stop; set down from above</text>
<rect x="820" y="300" width="70" height="30" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="755" y="318" width="55" height="12" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="695" y="318" width="45" height="12" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="560" y1="300" x2="695" y2="300" stroke="#24292f" stroke-width="12"/>
<line x1="695" y1="306" x2="740" y2="306" stroke="#24292f" stroke-width="12"/>
<line x1="740" y1="311" x2="790" y2="311" stroke="#9aa4ae" stroke-width="4"/>
<rect x="690" y="150" width="130" height="100" rx="0" fill="#afb8c1" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="755" y1="118" x2="755" y2="150" stroke="#bc4c00" stroke-width="3" marker-end="url(#arrf)"/>
<text x="700" y="200" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">punch: both barrels</text>
<text x="700" y="214" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">insulation re-formed</text>
<text x="530" y="384.0" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">fed from the pallet: a narrow punch (&lt;= 7.45 mm): a4c's one-nest</text>
<text x="530" y="397.5" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">SN die set, or f3's knee with f9's keyed nest. SN-2549 as sold:</text>
<text x="530" y="411.0" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">the ribbon leaves the pallet (a6c, foot or hand). Strip on an</text>
<text x="530" y="424.5" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">applicator: the tack moves to its anvil (v9).</text>
<line x1="490" y1="250" x2="510" y2="250" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="500" y="240" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">carry</text>
<text x="20" y="490" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">The stroke at C after a tack, remaining ram travel (mm) [calc w3_final s1, clone dimensions]</text>
<line x1="120" y1="610" x2="900" y2="610" stroke="#1f2328" stroke-width="1.5"/>
<line x1="120.0" y1="606" x2="120.0" y2="614" stroke="#1f2328" stroke-width="1.5"/>
<text x="120.0" y="630" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">1.5</text>
<line x1="276.0" y1="606" x2="276.0" y2="614" stroke="#1f2328" stroke-width="1.5"/>
<text x="276.0" y="630" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">1.2</text>
<line x1="432.0" y1="606" x2="432.0" y2="614" stroke="#1f2328" stroke-width="1.5"/>
<text x="432.0" y="630" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">0.9</text>
<line x1="588.0" y1="606" x2="588.0" y2="614" stroke="#1f2328" stroke-width="1.5"/>
<text x="588.0" y="630" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">0.6</text>
<line x1="744.0" y1="606" x2="744.0" y2="614" stroke="#1f2328" stroke-width="1.5"/>
<text x="744.0" y="630" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">0.3</text>
<line x1="900.0" y1="606" x2="900.0" y2="614" stroke="#1f2328" stroke-width="1.5"/>
<text x="900.0" y="630" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">0.0</text>
<rect x="640.0" y="510" width="156.0" height="22" rx="0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" opacity="1"/>
<text x="634.0" y="526" font-size="10.5" fill="#1f2328" text-anchor="end" font-weight="normal">insulation crimper meets the tacked barrel</text>
<rect x="447.59999999999997" y="542" width="130.00000000000006" height="22" rx="0" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<text x="441.59999999999997" y="558" font-size="10.5" fill="#1f2328" text-anchor="end" font-weight="normal">conductor wings first touched</text>
<rect x="796.0" y="574" width="104.0" height="22" rx="0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5" opacity="1"/>
<text x="790.0" y="590" font-size="10.5" fill="#1f2328" text-anchor="end" font-weight="normal">compaction: the force</text>
<text x="20" y="660" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">After a tack the conductor wings are met first and curl for 0.12-0.67 mm before the insulation crimper retouches;</text>
<text x="20" y="676" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">the tack holds the jacket through compaction. The pause after the tack is where the camera looks straight down</text>
<text x="20" y="692" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">into the open barrel. A failed look slides the loose tack off the tip: it costs a contact, not a ribbon end.</text>
</svg>