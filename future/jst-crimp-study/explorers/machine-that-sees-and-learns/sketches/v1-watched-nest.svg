<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Helvetica, Arial, sans-serif">
<title>v1 the watched nest</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="980" height="640" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">v1  The watched nest: a fixed press that is photographed at every step</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Schematic side elevation, wire axis left to right. Not to scale.</text>
<polygon points="560,80 760,80 760,470 560,470 560,420 720,420 720,130 560,130" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5"/>
<text x="740" y="100" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">press frame</text>
<rect x="610" y="130" width="40" height="150" rx="0" fill="#afb8c1" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="622" y="280" width="16" height="40" rx="0" fill="#57606a" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="655" y="200" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">ram, slow</text>
<text x="655" y="214" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">(any drive the</text>
<text x="655" y="228" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">force explorers</text>
<text x="655" y="242" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">develop)</text>
<text x="645" y="300" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">punch</text>
<line x1="630" y1="140" x2="630" y2="175" stroke="#bc4c00" stroke-width="2.5" marker-end="url(#arrf)"/>
<rect x="600" y="375" width="60" height="45" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="596" y="395" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">anvil, blackened</text>
<text x="596" y="409" font-size="10" fill="#57606a" text-anchor="end" font-weight="normal">(stray strand = bright line)</text>
<rect x="605" y="420" width="50" height="12" rx="0" fill="#f6c177" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="662" y="432" font-size="11" fill="#bc4c00" text-anchor="start" font-weight="normal">load cell</text>
<rect x="615" y="360" width="32" height="15" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<polygon points="615,360 619,348 623,360" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5"/>
<polygon points="628,360 632,350 636,360" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5"/>
<text x="650" y="356" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">contact, barrels up</text>
<line x1="300" y1="352" x2="560" y2="352" stroke="#24292f" stroke-width="7"/>
<line x1="560" y1="352" x2="612" y2="355" stroke="#24292f" stroke-width="7"/>
<line x1="612" y1="355" x2="640" y2="356" stroke="#9aa4ae" stroke-width="3"/>
<text x="380" y="330" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">active conductor, pressed down by its key</text>
<rect x="300" y="335" width="70" height="36" rx="0" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="335" y="390" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">fan block: keys, neighbours 5 mm up</text>
<rect x="270" y="395" width="140" height="30" rx="0" fill="#eaeef2" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="340" y="415" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="bold">X Y Z stage</text>
<line x1="410" y1="410" x2="450" y2="410" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="455" y="414" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">Y</text>
<line x1="340" y1="425" x2="340" y2="455" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="346" y="452" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">Z</text>
<circle cx="258" cy="410" r="6" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
<text x="248" y="414" font-size="11" fill="#1f2328" text-anchor="end" font-weight="normal">X (into page)</text>
<line x1="560" y1="300" x2="600" y2="346" stroke="#57606a" stroke-width="3"/>
<text x="470" y="296" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">piano key tip = hold-down and pull grip</text>
<g transform="rotate(35 470 205)"><rect x="454" y="194" width="26" height="22" rx="3" fill="#57606a" stroke="#1f2328"/><rect x="480" y="199" width="9" height="12" fill="#8c959f" stroke="#1f2328"/></g>
<text x="470" y="189" font-size="11" fill="#0969da" text-anchor="middle" font-weight="normal">cam 1: oblique, under the raised punch</text>
<line x1="485" y1="220" x2="610" y2="350" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrv)"/>
<rect x="590" y="330" width="80" height="40" rx="0" fill="none" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 3" opacity="1"/>
<text x="250" y="110" font-size="11" fill="#0969da" text-anchor="start" font-weight="normal">LEDs round the nest, lit one at a time; two at 60-75 deg:</text>
<text x="250" y="124" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">a strand lying on the barrel floor casts no displaced shadow</text>
<rect x="790" y="110" width="175" height="200" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" opacity="1"/>
<text x="877" y="128" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="bold">end view, along the wire</text>
<rect x="850" y="230" width="55" height="40" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<polygon points="860,230 856,205 866,230" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5"/>
<polygon points="895,230 899,205 889,230" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5"/>
<circle cx="877" cy="218" r="9" fill="#24292f" stroke="#1f2328" stroke-width="1.5"/>
<g transform="rotate(0 812 215)"><rect x="796" y="204" width="26" height="22" rx="3" fill="#57606a" stroke="#1f2328"/><rect x="822" y="209" width="9" height="12" fill="#8c959f" stroke="#1f2328"/></g>
<text x="802" y="190" font-size="11" fill="#0969da" text-anchor="start" font-weight="normal">cam 2</text>
<rect x="940" y="180" width="12" height="70" rx="0" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<line x1="832" y1="215" x2="935" y2="215" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="877" y="288" font-size="10" fill="#9a6700" text-anchor="middle" font-weight="normal">backlight on the far side:</text>
<text x="877" y="301" font-size="10" fill="#9a6700" text-anchor="middle" font-weight="normal">strands vs wing tips in silhouette</text>
<rect x="430" y="470" width="120" height="40" rx="0" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<text x="490" y="494" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">silhouette window</text>
<text x="490" y="525" font-size="10" fill="#57606a" text-anchor="middle" font-weight="normal">gauge pin in the same frame</text>
<line x1="260" y1="490" x2="190" y2="490" stroke="#bc4c00" stroke-width="2.5" marker-end="url(#arrf)"/>
<text x="195" y="480" font-size="11" fill="#bc4c00" text-anchor="start" font-weight="normal">proof pull ~20 N by the stage's Y</text>
<text x="195" y="508" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">reaction: carrier tab + box hold-down (strip), or a lance-notched plate (loose)</text>
<text x="20" y="547" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">What the log keeps for every crimp (one picture or trace per box):</text>
<rect x="20" y="555" width="110" height="40" rx="4" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="75" y="580" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">contact seated</text>
<line x1="130" y1="575" x2="140" y2="575" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="140" y="555" width="110" height="40" rx="4" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="195" y="580" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">tip on backlight</text>
<line x1="250" y1="575" x2="260" y2="575" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="260" y="555" width="110" height="40" rx="4" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="315" y="580" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">servo converged</text>
<line x1="370" y1="575" x2="380" y2="575" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="380" y="555" width="110" height="40" rx="4" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="435" y="580" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">laid in: top + side</text>
<line x1="490" y1="575" x2="500" y2="575" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="500" y="555" width="110" height="40" rx="4" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="555" y="580" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">force-stroke curve</text>
<line x1="610" y1="575" x2="620" y2="575" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="620" y="555" width="110" height="40" rx="4" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="675" y="580" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">after: side silhouette</text>
<line x1="730" y1="575" x2="740" y2="575" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="740" y="555" width="110" height="40" rx="4" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="795" y="580" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">after: top view</text>
<line x1="850" y1="575" x2="860" y2="575" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="860" y="555" width="110" height="40" rx="4" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="915" y="580" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">during proof pull</text>
<text x="20" y="625" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">Reference for fixed: the image. Contact, conductor and anvil fiducials are measured in one frame; the stage is steered by the picture, not by its own step count.</text>
</svg>