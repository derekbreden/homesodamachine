<text x="886" y="360" font-size="10" fill="#bc4c00" text-anchor="end" font-weight="normal">plunger</text>
<rect x="820" y="448" width="40" height="8" rx="0" fill="#57606a" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="840" y="470" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">hard stop on the pallet body</text>
<text x="712" y="495" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">hinge where the fan is ~2.5 mm pitch;</text>
<text x="712" y="508" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">key 20-30 mm: 5 mm drop is 10-15 deg,</text>
<text x="712" y="521" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">bend at the key root R 24-60 mm,</text>
<text x="712" y="534" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">20-30 mm behind the contact</text>
<text x="712" y="547" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">[ribbon-as-pallet calc P s9]</text>
<text x="20" y="628" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">Lateral capture with no picture: +/-0.48-0.59 mm for a gathered bundle, +/-0.24-0.35 mm for a splayed one [calc wave2 s2].</text>
<text x="20" y="642" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">The picture sets Y per conductor from tip and insulation edge, and finds the bad tips.</text>
