<text x="20" y="608" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">Dashed: behind this plane. Every key ends 1-2 mm behind the contact; at the nest only the conductors themselves are in the section.</text>
<text x="580.4" y="344.0" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">neighbour axis 5 mm up</text>
<text x="580.4" y="358.0" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">(needs &gt;= 4.1-4.55 mm)</text>
