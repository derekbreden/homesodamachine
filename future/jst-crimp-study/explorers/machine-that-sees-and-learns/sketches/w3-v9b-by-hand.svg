<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Helvetica, Arial, sans-serif">
<title>v9b tack by hand on the jack test</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">v9b  The tack by hand on the jack-test applicator: lay in, throw a toggle, look, pump</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Schematic front elevation of the idle 12-ton shop press with an applicator on its bed. Not to scale.</text>
<rect x="120" y="70" width="24" height="470" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="560" y="70" width="24" height="470" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="120" y="70" width="464" height="30" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="120" y="470" width="464" height="26" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="352" y="489" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">press bed (VEVOR 12 t, idle)</text>
<rect x="300" y="100" width="100" height="90" rx="0" fill="#8c959f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="350" y="150" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal">bottle jack</text>
<rect x="335" y="190" width="30" height="60" rx="0" fill="#afb8c1" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="320" y="250" width="60" height="22" rx="0" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="392" y="265" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">T-slot adapter + stop collar</text>
<line x1="420" y1="150" x2="470" y2="150" stroke="#bf3989" stroke-width="3"/>
<text x="478" y="146" font-size="10.5" fill="#bf3989" text-anchor="start" font-weight="normal">hand pump</text>
<text x="478" y="160" font-size="10" fill="#57606a" text-anchor="start" font-weight="normal">(or air-over-hydraulic)</text>
<rect x="250" y="290" width="200" height="180" rx="0" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="258" y="330" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">OTP applicator,</text>
<text x="258" y="344" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal">pre-feed</text>
<rect x="320" y="272" width="60" height="40" rx="0" fill="#afb8c1" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<rect x="300" y="420" width="100" height="30" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="350" y="440" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="normal">anvil</text>
<rect x="335" y="405" width="30" height="15" rx="0" fill="#c9d1d9" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="350" y="398" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">contact waits</text>
<rect x="160" y="440" width="90" height="8" rx="0" fill="#9a6700" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<text x="160" y="462" font-size="10" fill="#9a6700" text-anchor="start" font-weight="normal">reel strip</text>
<rect x="420" y="340" width="60" height="20" rx="0" fill="#8c959f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<line x1="480" y1="350" x2="598" y2="262" stroke="#bc4c00" stroke-width="1.5"/>
<text x="600" y="250" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="normal">toggle clamp</text>
<rect x="410" y="360" width="10" height="50" rx="0" fill="#afb8c1" stroke="#bc4c00" stroke-width="1.5" opacity="1"/>
<text x="600" y="264" font-size="10" fill="#bc4c00" text-anchor="start" font-weight="normal">-&gt; former over the insulation</text>
<text x="600" y="276" font-size="10" fill="#bc4c00" text-anchor="start" font-weight="normal">barrel, screw stop at the</text>
<text x="600" y="288" font-size="10" fill="#bc4c00" text-anchor="start" font-weight="normal">tack height</text>
<polygon points="360,382 378,364 382,368 364,386" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<line x1="382" y1="366" x2="640" y2="366" stroke="#0969da" stroke-width="1.5" stroke-dasharray="3 3"/>
<g transform="rotate(180 660 366)"><rect x="644" y="355" width="26" height="22" rx="3" fill="#57606a" stroke="#1f2328"/><rect x="670" y="360" width="9" height="12" fill="#8c959f" stroke="#1f2328"/></g>
<text x="690" y="350" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">ELP (on hand) into a</text>
<text x="690" y="364" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">swing-in mirror; two LEDs</text>
<text x="690" y="378" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">at ~65 deg; live on the Mac</text>
<polyline points="170,380 240,400 300,405" fill="none" stroke="#24292f" stroke-width="6"/>
<text x="170" y="370" font-size="10.5" fill="#bf3989" text-anchor="start" font-weight="normal">Derek lays the conductor in</text>
<rect x="770" y="130" width="210" height="140" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="782" y="152" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">on screen: the open barrel</text>
<text x="782" y="166" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">from straight above,</text>
<text x="782" y="180" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">each LED in turn:</text>
<text x="782" y="194" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">strands inside the wings,</text>
<text x="782" y="208" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">brush, edge in window,</text>
<text x="782" y="222" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">the bundle's shadow</text>
<text x="20" y="560" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">Per conductor: lay in by hand, throw the toggle (tack), swing the mirror in and look, then pump to the collar; release, and the pre-feed brings the next.</text>
<text x="20" y="576" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">A bad look: draw the conductor straight back, flat; pump the tacked empty through as scrap. 31-93 s a crimp, 27-82 min a unit [calc w3_final s4]:</text>
<text x="20" y="592" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">slower than today by hand. It answers the tack's grip, its height and width, the order (by section), and the room under the crimpers.</text>
</svg>