<rect x="462" y="356" width="16" height="10" rx="0" fill="#9a6700" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<line x1="462" y1="366" x2="440" y2="452" stroke="#9a6700" stroke-width="1.5"/>
<text x="440" y="462" font-size="10" fill="#9a6700" text-anchor="end" font-weight="normal">carrier tab (strip runs into the page;</text>
<text x="440" y="475" font-size="10" fill="#9a6700" text-anchor="end" font-weight="normal">pre-feed: the contact waits on the anvil)</text>
<polyline points="480,350 482,322 510,314 538,322 540,350" fill="none" stroke="#afb8c1" stroke-width="3"/>
<rect x="120" y="326" width="425" height="22" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
