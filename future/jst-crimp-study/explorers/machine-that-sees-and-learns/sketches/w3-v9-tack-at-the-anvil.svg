<text x="590" y="121" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">at top dead centre</text>
<line x1="590" y1="145" x2="590" y2="312" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="598" y="190" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">~23-42 mm clear [estimate];</text>
<text x="598" y="204" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">the jack test measures it</text>
<rect x="500" y="200" width="20" height="110" rx="0" fill="#afb8c1" stroke="#bc4c00" stroke-width="1.5" opacity="1"/>
<line x1="510" y1="170" x2="510" y2="205" stroke="#bc4c00" stroke-width="3" marker-end="url(#arrf)"/>
<rect x="430" y="160" width="60" height="26" rx="0" fill="#f6f0ff" stroke="#8250df" stroke-width="1.5" opacity="1"/>
<text x="460" y="177" font-size="10" fill="#8250df" text-anchor="middle" font-weight="normal">servo</text>
<text x="250" y="214" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">T-arm (swings in, then out):</text>
<text x="250" y="228" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">former = scanned insulation</text>
<text x="250" y="242" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">profile + 0.1-0.2 mm, to a</text>
<text x="250" y="256" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">stop at H_f + 0.2-0.5 mm;</text>
<text x="250" y="270" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">20 kg cell in the link</text>
<polygon points="575,300 605,270 609,274 579,304" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<line x1="590" y1="312" x2="590" y2="290" stroke="#0969da" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="592" y1="287" x2="760" y2="287" stroke="#0969da" stroke-width="1.5" stroke-dasharray="3 3"/>
<g transform="rotate(180 790 287)"><rect x="774" y="276" width="26" height="22" rx="3" fill="#57606a" stroke="#1f2328"/><rect x="800" y="281" width="9" height="12" fill="#8c959f" stroke="#1f2328"/></g>
<text x="812" y="260" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">M-arm: 10 mm mirror at 45 deg,</text>
<text x="812" y="274" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">IMX298 camera looking in;</text>
<text x="812" y="288" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">two LEDs at 60-75 deg:</text>
<text x="812" y="302" font-size="10.5" fill="#0969da" text-anchor="start" font-weight="normal">the shadow test</text>
<circle cx="548" cy="262" r="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<circle cx="634" cy="262" r="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<rect x="40" y="346" width="150" height="40" rx="0" fill="#ddf4ff" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
