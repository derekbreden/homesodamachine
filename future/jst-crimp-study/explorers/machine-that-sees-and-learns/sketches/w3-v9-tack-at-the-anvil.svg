<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Helvetica, Arial, sans-serif">
<title>v9 tack at the anvil</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker></defs>
<rect x="0" y="0" width="1100" height="760" fill="#ffffff"/>
<text x="20" y="28" font-size="17" fill="#1f2328" text-anchor="start" font-weight="bold">v9  Tack at the anvil: tack, look and crimp at one datum, a contact still on its carrier in a stopped crank applicator</text>
<text x="20" y="47" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-style="italic">Schematic side elevation, wire axis left to right, box at the right; crank-angle timeline below. Not to scale.</text>
<rect x="300" y="400" width="520" height="40" rx="0" fill="#d0d7de" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="560" y="425" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">applicator base (the reference for fixed)</text>
<rect x="470" y="360" width="240" height="40" rx="0" fill="#24292f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="590" y="385" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal">anvil: insulation + conductor</text>
