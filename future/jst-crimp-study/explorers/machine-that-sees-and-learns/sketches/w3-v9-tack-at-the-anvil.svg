<text x="115" y="414" font-size="10.5" fill="#1f2328" text-anchor="middle" font-weight="normal">shuttle across and along</text>
<rect x="210" y="300" width="14" height="30" rx="0" fill="#8c959f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="217" y="294" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">fork</text>
<rect x="420" y="312" width="30" height="12" rx="0" fill="#8c959f" stroke="#1f2328" stroke-width="1.5" opacity="1"/>
<text x="435" y="306" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">foot</text>
<text x="40" y="434" font-size="10.5" fill="#57606a" text-anchor="start" font-weight="normal">far end: pogo block; applicator grounded</text>
<rect x="860" y="360" width="180" height="60" rx="0" fill="#fffbe6" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 3" opacity="1"/>
<text x="868" y="378" font-size="10" fill="#9a6700" text-anchor="start" font-weight="normal">dwell position, &gt;= 7 mm out:</text>
<text x="868" y="391" font-size="10" fill="#9a6700" text-anchor="start" font-weight="normal">neck fork on the box's rear,</text>
<text x="868" y="404" font-size="10" fill="#9a6700" text-anchor="start" font-weight="normal">20 N pull, silhouette + box roll</text>
<text x="840" y="150" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">crank 15 mm, rod with 4 kN disc stack</text>
<text x="840" y="164" font-size="10.5" fill="#bc4c00" text-anchor="start" font-weight="normal">(switch in the enable line), 12 t frame</text>
<line x1="830" y1="145" x2="715" y2="110" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#arrf)"/>
<text x="20" y="502" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">One conductor against crank angle (0 deg = top dead centre, 180 = bottom)</text>
<line x1="60" y1="630" x2="1060" y2="630" stroke="#1f2328" stroke-width="1.5"/>
<line x1="60.0" y1="625" x2="60.0" y2="635" stroke="#1f2328" stroke-width="1.5"/>
<text x="60.0" y="650" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">0</text>
<line x1="310.0" y1="625" x2="310.0" y2="635" stroke="#1f2328" stroke-width="1.5"/>
<text x="310.0" y="650" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">90</text>
<line x1="560.0" y1="625" x2="560.0" y2="635" stroke="#1f2328" stroke-width="1.5"/>
<text x="560.0" y="650" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">180</text>
<line x1="810.0" y1="625" x2="810.0" y2="635" stroke="#1f2328" stroke-width="1.5"/>
<text x="810.0" y="650" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">270</text>
<line x1="1060.0" y1="625" x2="1060.0" y2="635" stroke="#1f2328" stroke-width="1.5"/>
<text x="1060.0" y="650" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">360</text>
<rect x="56.0" y="520" width="84" height="96" rx="0" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" opacity="1"/>
<text x="62.0" y="534" font-size="9.5" fill="#1f2328" text-anchor="start" font-weight="normal">stopped at 0:</text>
<text x="62.0" y="547" font-size="9.5" fill="#1f2328" text-anchor="start" font-weight="normal">contact alone;</text>
<text x="62.0" y="560" font-size="9.5" fill="#1f2328" text-anchor="start" font-weight="normal">lay in; continuity;</text>
<text x="62.0" y="573" font-size="9.5" fill="#1f2328" text-anchor="start" font-weight="normal">TACK; let go;</text>
<text x="62.0" y="586" font-size="9.5" fill="#1f2328" text-anchor="start" font-weight="normal">TOP LOOK</text>
<rect x="137.77777777777777" y="550" width="366.66666666666663" height="22" rx="0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5" opacity="1"/>
<text x="321.11111111111114" y="565" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="normal">fast to a taught angle</text>
<rect x="504.4444444444444" y="550" width="55.5555555555556" height="22" rx="0" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5" opacity="1"/>
<text x="532.2222222222222" y="542" font-size="10" fill="#cf222e" text-anchor="middle" font-weight="normal">crawl 0.05-0.1 mm/s, 9-34 s</text>
<text x="565.5555555555555" y="590" font-size="10" fill="#bc4c00" text-anchor="start" font-weight="normal">bottom: both barrels,</text>
<text x="565.5555555555555" y="603" font-size="10" fill="#bc4c00" text-anchor="start" font-weight="normal">tab sheared</text>
<rect x="671.1111111111112" y="550" width="125.0" height="22" rx="0" fill="#fffbe6" stroke="#9a6700" stroke-width="1.5" opacity="1"/>
<text x="732.2222222222223" y="542" font-size="10" fill="#9a6700" text-anchor="middle" font-weight="normal">dwell 220-265</text>
<rect x="798.8888888888889" y="580" width="52.777777777777715" height="22" rx="0" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" opacity="1"/>
<text x="826.6666666666667" y="618" font-size="10" fill="#1a7f37" text-anchor="middle" font-weight="normal">pre-feed</text>
<text x="20" y="680" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">Fail at the top look: draw the conductor straight back, flat (the tab bends at 4-12 N along the wire but at 0.5-1.7 N sideways);</text>
<text x="20" y="696" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">the empty tacked contact is crimped empty on the next turn and blown off the anvil in the dwell; a fresh contact pre-feeds.</text>
<text x="20" y="712" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">72-142 s a conductor, 1.1-2.1 h a unit [bm W s11]. On b1c's one shaft the same stop sits at 0-40 deg, where the room is.</text>
</svg>