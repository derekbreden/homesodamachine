<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="600" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a2c Loose-contact cassette: kit contacts in keyed printed nests</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic, not to scale</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">A. One pocket, from above and in section</text>
  <rect x="80.0" y="100.0" width="60.0" height="44.0" rx="0" fill="#eee" stroke="#555" stroke-width="1"/>
  <rect x="84.0" y="104.0" width="52.0" height="36.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="92.0" y="144.0" width="36.0" height="110.0" rx="0" fill="#f8f8f8" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="78.0" y="144.0" width="64.0" height="6.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <text x="160.0" y="110.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">box pocket ~2.0 x 2.45 mm, box floor on the pocket floor</text>
  <text x="160.0" y="124.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">rear shoulder (dark) behind the box: the pull reaction</text>
  <text x="160.0" y="138.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">open cradle under the barrels (or a steel anvil insert)</text>
  <text x="160.0" y="152.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">lance relief on ONE side: a reversed contact does not drop in</text>
  <rect x="560.0" y="110.0" width="120.0" height="40.0" rx="0" fill="#eee" stroke="#555" stroke-width="1"/>
  <rect x="580.0" y="150.0" width="20.0" height="12.0" rx="0" fill="#eee" stroke="#555" stroke-width="1"/>
  <text x="610.0" y="160.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">lance relief</text>
  <text x="20.0" y="290.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">B. The nest bar at a free pitch; each pocket set back by its conductor's fan recession</text>
  <rect x="104.0" y="349.8" width="32.0" height="60.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="120.0" y1="409.8" x2="120.0" y2="470.0" stroke="#3a3a3a" stroke-width="9"/>
  <text x="108.0" y="343.8" font-size="10" fill="#222" font-weight="normal" text-anchor="start">1.65</text>
  <rect x="204.0" y="339.2" width="32.0" height="60.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="220.0" y1="399.2" x2="220.0" y2="470.0" stroke="#3a3a3a" stroke-width="9"/>
  <text x="208.0" y="333.2" font-size="10" fill="#222" font-weight="normal" text-anchor="start">0.77</text>
  <rect x="304.0" y="330.0" width="32.0" height="60.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="320.0" y1="390.0" x2="320.0" y2="470.0" stroke="#3a3a3a" stroke-width="9"/>
  <text x="308.0" y="324.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">0.00</text>
  <rect x="404.0" y="339.2" width="32.0" height="60.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="420.0" y1="399.2" x2="420.0" y2="470.0" stroke="#3a3a3a" stroke-width="9"/>
  <text x="408.0" y="333.2" font-size="10" fill="#222" font-weight="normal" text-anchor="start">0.77</text>
  <rect x="504.0" y="349.8" width="32.0" height="60.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="520.0" y1="409.8" x2="520.0" y2="470.0" stroke="#3a3a3a" stroke-width="9"/>
  <text x="508.0" y="343.8" font-size="10" fill="#222" font-weight="normal" text-anchor="start">1.65</text>
  <rect x="80.0" y="470.0" width="480.0" height="30.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1"/>
  <text x="86.0" y="490.0" font-size="10" fill="#2a5a8a" font-weight="normal" text-anchor="start">ribbon pallet, stripped webbed before the split (procedure-is-the-machine p7), fanned to 5 mm</text>
  <text x="600.0" y="330.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">5P at 5 mm: pockets set back 0, 0.77, 1.65 mm from</text>
  <text x="600.0" y="344.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">the centre out [P3 s1], printed from the same</text>
  <text x="600.0" y="358.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">groove geometry as the fan block, so a strip made</text>
  <text x="600.0" y="372.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">before the split docks without an equal-path fan.</text>
  <text x="600.0" y="386.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start"></text>
  <text x="600.0" y="400.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Loading: tweezers; a stapler-style stick; shaking</text>
  <text x="600.0" y="414.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">on a coin motor [Prime]; or strip cut one at a time.</text>
  <text x="600.0" y="428.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start"></text>
  <text x="600.0" y="442.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">At 3.4 mm (change-the-question c1): odd conductors</text>
  <text x="600.0" y="456.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">dock with no fan; each pocket becomes a steel anvil</text>
  <text x="600.0" y="470.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">slide lifted into a fixed punch.</text>
  <text x="600.0" y="484.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start"></text>
  <text x="600.0" y="498.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">With a10's tack: close each insulation barrel</text>
  <text x="600.0" y="512.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">loosely in the bar, lift, crimp each in the SN-2549.</text>
</svg>
