<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="620" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a3 The backshell that ships: the clamp is applied once and never removed</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic, not to scale; J4 SENSORS (4P + 3P into XHP-7) shown</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">A. Side section of the backshell: the ribbon folds 180 deg around a bar (the IDC strain-relief fold)</text>
  <rect x="120.0" y="110.0" width="160.0" height="90.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1.5"/>
  <circle cx="250.0" cy="155.0" r="14.0" fill="#9db7d2" stroke="#2a5a8a" stroke-width="1"/>
  <path d="M40,135 L250,135 A20,20 0 0 1 250,175 L120,175" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <path d="M250,141 L420,141" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="120.0" y="100.0" width="160.0" height="14.0" rx="0" fill="#9db7d2" stroke="#2a5a8a" stroke-width="1"/>
  <text x="126.0" y="96.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">snap cover</text>
  <line x1="280.0" y1="90.0" x2="280.0" y2="220.0" stroke="#a33" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="286.0" y="216.0" font-size="11" fill="#a33" font-weight="normal" text-anchor="start">front face = split root = tear stop</text>
  <text x="40.0" y="128.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">loom</text>
  <text x="430.0" y="145.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">to fan and housing</text>
  <text x="600.0" y="110.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">a wrap multiplies the cover's hold by e^(mu pi):</text>
  <text x="600.0" y="124.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">4.8x at mu 0.5, 23x at mu 1.0 (2.6x at mu 0.3)</text>
  <text x="600.0" y="138.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">3 N on the tail resists 14-69 N of loom pull [calc X s8]</text>
  <text x="600.0" y="152.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">the insulation crimp on silicone slips at 0.4-9 N</text>
  <text x="600.0" y="166.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">(force-and-form f6): the fold is the loom's strain relief</text>
  <text x="600.0" y="180.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start"></text>
  <text x="600.0" y="194.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">outer faces: the machine's datum</text>
  <text x="600.0" y="208.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">top: embossed name; edge: notch code = recipe</text>
  <text x="20.0" y="300.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">B. Height above the board with the backshell at the split root [calc F s2]</text>
  <rect x="40.0" y="540.0" width="300.0" height="14.0" rx="0" fill="#5c8a3a" stroke="#333" stroke-width="1"/>
  <text x="46.0" y="572.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">main board, vertical XH wafer</text>
  <rect x="140.0" y="500.0" width="60.0" height="40.0" rx="0" fill="#eee" stroke="#555" stroke-width="1"/>
  <text x="206.0" y="524.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">XHP mated ~9.8 mm</text>
  <line x1="170.0" y1="500.0" x2="170.0" y2="400.0" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="130.0" y="370.0" width="80.0" height="30.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1"/>
  <text x="216.0" y="390.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">backshell ~12 mm</text>
  <text x="420.0" y="340.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">parting</text>
  <text x="680.0" y="340.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">parted</text>
  <text x="780.0" y="340.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">top above board</text>
  <text x="420.0" y="362.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">fold-back parking</text>
  <text x="680.0" y="362.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">8-15 mm</text>
  <text x="780.0" y="362.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">30-37 mm</text>
  <text x="420.0" y="382.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">housing-pitch fan only</text>
  <text x="680.0" y="382.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">14-18 mm</text>
  <text x="780.0" y="382.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">36-40 mm</text>
  <text x="420.0" y="402.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">a1c, a2c at 5 mm, per ribbon</text>
  <text x="680.0" y="402.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">17-23 mm</text>
  <text x="780.0" y="402.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">39-45 mm</text>
  <text x="420.0" y="422.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">a2, a2e, a10 at ~7 mm, per ribbon</text>
  <text x="680.0" y="422.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">21-30 mm</text>
  <text x="780.0" y="422.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">43-52 mm</text>
  <text x="420.0" y="442.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">a9 at ~7.1 mm, equal-path</text>
  <text x="680.0" y="442.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">22-33 mm</text>
  <text x="780.0" y="442.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">44-55 mm</text>
  <text x="420.0" y="462.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">a1 with the tongue, 5 mm</text>
  <text x="680.0" y="462.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">30-47 mm</text>
  <text x="780.0" y="462.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">52-69 mm</text>
  <text x="420.0" y="500.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Arms variant: two bridge arms hook the XHP's end flanges (~0.8 mm each side);</text>
  <text x="420.0" y="514.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">whether they clear the wafer shroud is untested.</text>
</svg>
