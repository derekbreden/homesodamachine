<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="640" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a4 Spool as magazine: terminate the leading end, then feed out and cut</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic side view, not to scale</text>
  <circle cx="90.0" cy="200.0" r="60.0" fill="#f2f2f2" stroke="#555" stroke-width="1"/>
  <circle cx="90.0" cy="200.0" r="22.0" fill="#ddd" stroke="#555" stroke-width="1"/>
  <text x="30.0" y="285.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">reel: BNTECHGO spool, or rewound once onto</text>
  <text x="30.0" y="299.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">an 80 mm hub radius (procedure-is-the-machine p6);</text>
  <text x="30.0" y="313.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">inner end in a hub socket, or on a 6-circuit</text>
  <text x="30.0" y="327.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">capsule slip ring ($9.99 [Prime]); two for a pair</text>
  <path d="M90,140 C170,140 190,180 250,180" fill="none" stroke="#3a3a3a" stroke-width="6"/>
  <circle cx="200.0" cy="188.0" r="6.0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <circle cx="215.0" cy="172.0" r="6.0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <circle cx="230.0" cy="188.0" r="6.0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <circle cx="245.0" cy="172.0" r="6.0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <text x="186.0" y="160.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">roller straightener</text>
  <rect x="270.0" y="168.0" width="70.0" height="10.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="270.0" y="184.0" width="70.0" height="10.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <text x="270.0" y="160.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">belt feed + encoder</text>
  <line x1="250.0" y1="181.0" x2="480.0" y2="181.0" stroke="#3a3a3a" stroke-width="6"/>
  <rect x="360.0" y="160.0" width="90.0" height="42.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="362.0" y="154.0" font-size="10" fill="#2a5a8a" font-weight="normal" text-anchor="start">fixed clamp = the pallet</text>
  <line x1="450.0" y1="140.0" x2="450.0" y2="240.0" stroke="#a33" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="454.0" y="252.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">clamp face = cut line</text>
  <text x="454.0" y="266.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">= split root</text>
  <rect x="450.0" y="186.0" width="120.0" height="6.0" rx="0" fill="#aaa" stroke="#666" stroke-width="1"/>
  <rect x="450.0" y="170.0" width="120.0" height="5.0" rx="0" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="590.0" y="182.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">&lt;- covered floor keeps any curl</text>
  <text x="590.0" y="196.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">   in plane up to the tools</text>
  <rect x="470.0" y="80.0" width="84.0" height="40.0" rx="0" fill="#f6f6f6" stroke="#777" stroke-width="1"/>
  <text x="474.0" y="96.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">zip (a7)</text>
  <rect x="560.0" y="80.0" width="84.0" height="40.0" rx="0" fill="#f6f6f6" stroke="#777" stroke-width="1"/>
  <text x="564.0" y="96.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">fan flat, 5 mm</text>
  <rect x="650.0" y="80.0" width="84.0" height="40.0" rx="0" fill="#f6f6f6" stroke="#777" stroke-width="1"/>
  <text x="654.0" y="96.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">strip (a8 at the</text>
  <rect x="760.0" y="80.0" width="84.0" height="40.0" rx="0" fill="#f6f6f6" stroke="#777" stroke-width="1"/>
  <text x="764.0" y="96.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">crimp: a1c order</text>
  <text x="654.0" y="110.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">fan face)</text>
  <text x="764.0" y="110.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">on a short X slide</text>
  <text x="470.0" y="136.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">the stations come to the fixed end one after another;</text>
  <text x="470.0" y="150.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">each crimped conductor is folded back over the clamp (a1c)</text>
  <rect x="870.0" y="160.0" width="90.0" height="42.0" rx="0" fill="#eee" stroke="#555" stroke-width="1"/>
  <text x="872.0" y="216.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">insertion nest:</text>
  <text x="872.0" y="230.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">real XH wafer</text>
  <text x="872.0" y="244.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">(a6); test through</text>
  <text x="872.0" y="258.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">the reel</text>
  <path d="M480,190 C560,200 600,260 600,360 L600,520" fill="none" stroke="#999" stroke-width="14"/>
  <path d="M480,190 C560,200 600,260 600,360 L600,520" fill="none" stroke="#3a3a3a" stroke-width="5"/>
  <text x="612.0" y="400.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">after termination the feed pushes the loom</text>
  <text x="612.0" y="414.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">length out, housing first, down a drop tube</text>
  <text x="612.0" y="428.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">(a 600 mm loom needs ~0.6-0.7 m); the guillotine</text>
  <text x="612.0" y="442.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">cuts at the clamp face: that cut frees the loom</text>
  <text x="612.0" y="456.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">and squares the next end</text>
  <rect x="560.0" y="530.0" width="90.0" height="40.0" rx="0" fill="#f2f2f2" stroke="#555" stroke-width="1"/>
  <text x="566.0" y="554.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">finished bin</text>
  <text x="30.0" y="380.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">What locates what: the clamp channel (0.2 mm under width);</text>
  <text x="30.0" y="394.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">tips found by touch-off through the reel; each conductor's</text>
  <text x="30.0" y="408.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">crimp Y from its own touch-off record (order C) or a flush</text>
  <text x="30.0" y="422.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">cut at the fan face (order A).</text>
  <text x="30.0" y="436.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start"></text>
  <text x="30.0" y="450.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">A bad crimp costs the end's whole split (~20-35 mm of reel),</text>
  <text x="30.0" y="464.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">never a loom: the loom is cut last.</text>
</svg>
