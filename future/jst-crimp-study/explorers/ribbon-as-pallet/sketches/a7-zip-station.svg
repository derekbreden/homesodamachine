<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="700" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a7 Zip station: tear each web along its own neck, stop it at the clamp</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic, not to scale except panel B (1 mm = 20 px); the neck thickness t_n is unmeasured</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">A. Plan: the pallet drives the ribbon tip-first into the nicker, then onto the wedge comb</text>
  <rect x="30.0" y="100.0" width="190.0" height="150.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1.5"/>
  <rect x="150.0" y="110.0" width="70.0" height="130.0" rx="0" fill="#9db7d2" stroke="#2a5a8a" stroke-width="1"/>
  <text x="36.0" y="120.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">pallet</text>
  <text x="36.0" y="134.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">(clamp lid</text>
  <text x="36.0" y="148.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">hatched)</text>
  <text x="150.0" y="262.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">lid front face =</text>
  <text x="150.0" y="276.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">split root = tear stop</text>
  <line x1="100.0" y1="141.0" x2="220.0" y2="141.0" stroke="#3a3a3a" stroke-width="15"/>
  <line x1="100.0" y1="158.0" x2="220.0" y2="158.0" stroke="#3a3a3a" stroke-width="15"/>
  <line x1="100.0" y1="175.0" x2="220.0" y2="175.0" stroke="#3a3a3a" stroke-width="15"/>
  <line x1="100.0" y1="192.0" x2="220.0" y2="192.0" stroke="#3a3a3a" stroke-width="15"/>
  <line x1="100.0" y1="209.0" x2="220.0" y2="209.0" stroke="#3a3a3a" stroke-width="15"/>
  <path d="M220,141 C280,141 300,125 400,125 L550,125" fill="none" stroke="#3a3a3a" stroke-width="15"/>
  <path d="M220,158 C280,158 300,150 400,150 L550,150" fill="none" stroke="#3a3a3a" stroke-width="15"/>
  <path d="M220,175 C280,175 300,175 400,175 L550,175" fill="none" stroke="#3a3a3a" stroke-width="15"/>
  <path d="M220,192 C280,192 300,200 400,200 L550,200" fill="none" stroke="#3a3a3a" stroke-width="15"/>
  <path d="M220,209 C280,209 300,225 400,225 L550,225" fill="none" stroke="#3a3a3a" stroke-width="15"/>
  <polygon points="232.0,149.5 400.0,134.5 400.0,140.5" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <polygon points="232.0,166.5 400.0,159.5 400.0,165.5" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <polygon points="232.0,183.5 400.0,184.5 400.0,190.5" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <polygon points="232.0,200.5 400.0,209.5 400.0,215.5" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <rect x="400.0" y="100.0" width="30.0" height="150.0" rx="0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <line x1="415.0" y1="252.0" x2="440.0" y2="272.0" stroke="#556" stroke-width="1"/>
  <text x="444.0" y="280.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">wedge comb: tines of laminated stainless, 0.2 mm blunt nose -&gt; 0.8 mm root,</text>
  <text x="444.0" y="294.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">noses at 1.7 mm pitch, roots at 2.5 mm, staggered 2 mm so one web starts at a time</text>
  <rect x="640.0" y="120.0" width="26.0" height="110.0" rx="0" fill="#f4f4f4" stroke="#777" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="640.0" y1="149.5" x2="610.0" y2="149.5" stroke="#556" stroke-width="2"/>
  <line x1="640.0" y1="166.5" x2="610.0" y2="166.5" stroke="#556" stroke-width="2"/>
  <line x1="640.0" y1="183.5" x2="610.0" y2="183.5" stroke="#556" stroke-width="2"/>
  <line x1="640.0" y1="200.5" x2="610.0" y2="200.5" stroke="#556" stroke-width="2"/>
  <text x="672.0" y="132.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">nicker: 0.10 mm razor slivers</text>
  <text x="672.0" y="146.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">on flexures, V-noses find the</text>
  <text x="672.0" y="160.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">valleys; 2 mm nick into the tip,</text>
  <text x="672.0" y="174.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">then springs aside</text>
  <line x1="40.0" y1="320.0" x2="150.0" y2="320.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <text x="160.0" y="324.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">pallet moves +X (stage or hand rail)</text>
  <text x="232.0" y="92.0" font-size="11" fill="#a33" font-weight="normal" text-anchor="start">tear front stays ~1 mm ahead of the noses</text>
  <line x1="236.0" y1="96.0" x2="236.0" y2="132.0" stroke="#a33" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="560.0" y="252.0" font-size="11" fill="#666" font-weight="normal" text-anchor="start">tip region (removed later by the flush cut)</text>
  <text x="20.0" y="360.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">B. Cross-section of a 5P: pitch = OD, so jackets meet at the valley planes</text>
  <circle cx="97.0" cy="460.0" r="17.0" fill="#3a3a3a" stroke="#111" stroke-width="1"/>
  <circle cx="97.0" cy="460.0" r="7.2" fill="#c98a3b" stroke="#7a4a10" stroke-width="1"/>
  <circle cx="131.0" cy="460.0" r="17.0" fill="#3a3a3a" stroke="#111" stroke-width="1"/>
  <circle cx="131.0" cy="460.0" r="7.2" fill="#c98a3b" stroke="#7a4a10" stroke-width="1"/>
  <circle cx="165.0" cy="460.0" r="17.0" fill="#3a3a3a" stroke="#111" stroke-width="1"/>
  <circle cx="165.0" cy="460.0" r="7.2" fill="#c98a3b" stroke="#7a4a10" stroke-width="1"/>
  <circle cx="199.0" cy="460.0" r="17.0" fill="#3a3a3a" stroke="#111" stroke-width="1"/>
  <circle cx="199.0" cy="460.0" r="7.2" fill="#c98a3b" stroke="#7a4a10" stroke-width="1"/>
  <circle cx="233.0" cy="460.0" r="17.0" fill="#3a3a3a" stroke="#111" stroke-width="1"/>
  <circle cx="233.0" cy="460.0" r="7.2" fill="#c98a3b" stroke="#7a4a10" stroke-width="1"/>
  <polygon points="111.0,455.0 117.0,455.0 117.0,465.0 111.0,465.0" fill="#6b6b6b" stroke="none" stroke-width="1"/>
  <line x1="114.0" y1="430.0" x2="114.0" y2="490.0" stroke="#a33" stroke-width="1" stroke-dasharray="3 2"/>
  <polygon points="145.0,455.0 151.0,455.0 151.0,465.0 145.0,465.0" fill="#6b6b6b" stroke="none" stroke-width="1"/>
  <line x1="148.0" y1="430.0" x2="148.0" y2="490.0" stroke="#a33" stroke-width="1" stroke-dasharray="3 2"/>
  <polygon points="179.0,455.0 185.0,455.0 185.0,465.0 179.0,465.0" fill="#6b6b6b" stroke="none" stroke-width="1"/>
  <line x1="182.0" y1="430.0" x2="182.0" y2="490.0" stroke="#a33" stroke-width="1" stroke-dasharray="3 2"/>
  <polygon points="213.0,455.0 219.0,455.0 219.0,465.0 213.0,465.0" fill="#6b6b6b" stroke="none" stroke-width="1"/>
  <line x1="216.0" y1="430.0" x2="216.0" y2="490.0" stroke="#a33" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="40.0" y="510.0" font-size="11" fill="#a33" font-weight="normal" text-anchor="start">valley planes (dashed): where the tear should run</text>
  <text x="330.0" y="420.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">neck t_n (lighter): fused silicone at the valley, thickness unknown</text>
  <text x="330.0" y="434.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">jacket wall at the equator: ~0.49 mm; strand bundle 0.72 mm</text>
  <text x="330.0" y="448.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">silicone between two bundles on the mid-plane: 0.98 mm</text>
  <text x="330.0" y="462.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start"></text>
  <text x="330.0" y="476.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">tear path by energy [calc W2 s2]:</text>
  <text x="330.0" y="490.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  t_n / wall &lt; ~0.6  -&gt; the tear stays in the neck (zips)</text>
  <text x="330.0" y="504.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  ~0.6-1.0           -&gt; marginal, may wander</text>
  <text x="330.0" y="518.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  &gt;= 1.0             -&gt; wanders into a jacket: cut instead (a7b)</text>
  <text x="20.0" y="560.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">C. Detail near the clamp: the copper hinges at the crack tip, so the tear stops where the tines stop</text>
  <rect x="40.0" y="580.0" width="120.0" height="90.0" rx="0" fill="#9db7d2" stroke="#2a5a8a" stroke-width="1"/>
  <text x="46.0" y="598.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">clamp lid</text>
  <line x1="40.0" y1="610.0" x2="160.0" y2="610.0" stroke="#3a3a3a" stroke-width="15"/>
  <line x1="40.0" y1="640.0" x2="160.0" y2="640.0" stroke="#3a3a3a" stroke-width="15"/>
  <rect x="155.0" y="617.0" width="20.0" height="16.0" rx="0" fill="#6b6b6b" stroke="none" stroke-width="1"/>
  <path d="M160,610 C190,610 200,604 330,590" fill="none" stroke="#3a3a3a" stroke-width="15"/>
  <path d="M160,640 C190,640 200,646 330,660" fill="none" stroke="#3a3a3a" stroke-width="15"/>
  <polygon points="186.0,625.0 330.0,617.0 330.0,633.0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <line x1="175.0" y1="596.0" x2="175.0" y2="655.0" stroke="#a33" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="340.0" y="600.0" font-size="11" fill="#a33" font-weight="normal" text-anchor="start">crack tip ~1 mm ahead of the blunt nose [estimate]</text>
  <text x="340.0" y="616.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">under the lid the conductors cannot open, so the tear stops at the face</text>
  <text x="340.0" y="632.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">tines steel and isolated: a tear that reaches copper reads on the far-end port</text>
  <text x="340.0" y="648.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">backlight under the open pallet floor: every split is a bright slit to the camera</text>
</svg>
