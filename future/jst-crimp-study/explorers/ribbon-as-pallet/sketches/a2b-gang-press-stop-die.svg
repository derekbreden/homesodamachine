<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a2b Gang stroke: the docked cassette in a stop-block die set under the idle 12-ton press</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic section across the row, not to scale; 5 stations at strip pitch</text>
  <rect x="80.0" y="90.0" width="640.0" height="40.0" rx="0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <text x="86.0" y="114.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">upper shoe (pushed by the VEVOR jack), N punches with B-profiles</text>
  <rect x="80.0" y="330.0" width="640.0" height="40.0" rx="0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <text x="86.0" y="356.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">lower shoe on a load cell or strain gauges; N anvils rise through windows</text>
  <rect x="90.0" y="130.0" width="20.0" height="20.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="90.0" y="310.0" width="20.0" height="20.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <line x1="100.0" y1="150.0" x2="100.0" y2="310.0" stroke="#555" stroke-width="4"/>
  <rect x="690.0" y="130.0" width="20.0" height="20.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="690.0" y="310.0" width="20.0" height="20.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <line x1="700.0" y1="150.0" x2="700.0" y2="310.0" stroke="#555" stroke-width="4"/>
  <text x="740.0" y="150.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">guide posts; hardened stop</text>
  <text x="740.0" y="164.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">blocks meet the upper shoe</text>
  <text x="740.0" y="178.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">at the crimp height</text>
  <rect x="166.0" y="130.0" width="28.0" height="60.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="166.0" y="260.0" width="28.0" height="70.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <rect x="164.0" y="236.0" width="32.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="180.0" cy="224.0" r="9.0" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="266.0" y="130.0" width="28.0" height="60.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="266.0" y="260.0" width="28.0" height="70.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <rect x="264.0" y="236.0" width="32.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="280.0" cy="224.0" r="9.0" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="366.0" y="130.0" width="28.0" height="60.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="366.0" y="260.0" width="28.0" height="70.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <rect x="364.0" y="236.0" width="32.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="380.0" cy="224.0" r="9.0" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="466.0" y="130.0" width="28.0" height="60.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="466.0" y="260.0" width="28.0" height="70.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <rect x="464.0" y="236.0" width="32.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="480.0" cy="224.0" r="9.0" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="566.0" y="130.0" width="28.0" height="60.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="566.0" y="260.0" width="28.0" height="70.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <rect x="564.0" y="236.0" width="32.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="580.0" cy="224.0" r="9.0" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="140.0" y="252.0" width="480.0" height="8.0" rx="0" fill="#cfd6dd" stroke="#556" stroke-width="1"/>
  <text x="740.0" y="250.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">strip pallet: windows for the</text>
  <text x="740.0" y="264.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">anvils; a lance relief in each anvil</text>
  <rect x="640.0" y="190.0" width="40.0" height="140.0" rx="0" fill="#666" stroke="#333" stroke-width="1"/>
  <text x="620.0" y="186.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">stop block</text>
  <text x="40.0" y="410.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Force for the stroke: 2.4-7.8 kN (3 contacts), 4.0-12.9 kN (5), 7-23 kN (J1's 9), against ~118 kN.</text>
  <text x="40.0" y="424.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">A missing conductor drops the summed force 12-20 %, a missing contact 20 %; one strand of 60 is invisible.</text>
  <text x="40.0" y="438.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Continuity to the carrier before the stroke names the station; the camera frame of the docked row too.</text>
  <text x="40.0" y="452.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Dies: N harvested pairs (each with its own side adjustment and height shim), one wire-EDM plate pair,</text>
  <text x="40.0" y="466.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">or two strokes with simpler single-arch plates (conductor barrels, then insulation barrels).</text>
  <text x="40.0" y="480.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">At 7.1 mm pitch a one-piece crimper plate leaves 5.1-5.6 mm webs between profiles (force-and-form f7).</text>
  <text x="40.0" y="494.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Target height scales with channel width: a 1.5 mm-channel height copied to a 1.6 mm channel over-compacts.</text>
</svg>
