<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="700" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a1 Pallet tour: one clamp, one stage, a fixed strip-fed crimp station</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic, not to scale; dimensions in the idea file</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">A. Plan: the pallet visits fixed stations and carries no motor</text>
  <rect x="40.0" y="90.0" width="100.0" height="60.0" rx="0" fill="#eeeeee" stroke="#555" stroke-width="1"/>
  <text x="90.0" y="112.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">1 zip</text>
  <text x="90.0" y="126.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">(a7)</text>
  <rect x="160.0" y="90.0" width="100.0" height="60.0" rx="0" fill="#eeeeee" stroke="#555" stroke-width="1"/>
  <text x="210.0" y="112.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">2 fan</text>
  <text x="210.0" y="126.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">press</text>
  <rect x="280.0" y="90.0" width="100.0" height="60.0" rx="0" fill="#eeeeee" stroke="#555" stroke-width="1"/>
  <text x="330.0" y="112.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">3 flush</text>
  <text x="330.0" y="126.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">cut</text>
  <rect x="400.0" y="90.0" width="100.0" height="60.0" rx="0" fill="#eeeeee" stroke="#555" stroke-width="1"/>
  <text x="450.0" y="112.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">4 strip</text>
  <text x="450.0" y="126.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">(a8)</text>
  <rect x="520.0" y="90.0" width="100.0" height="60.0" rx="0" fill="#eeeeee" stroke="#555" stroke-width="1"/>
  <text x="570.0" y="112.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">5 crimp:</text>
  <text x="570.0" y="126.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">applicator in</text>
  <rect x="640.0" y="90.0" width="100.0" height="60.0" rx="0" fill="#eeeeee" stroke="#555" stroke-width="1"/>
  <text x="690.0" y="112.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">6 insert</text>
  <text x="690.0" y="126.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">(a6)</text>
  <text x="570.0" y="140.0" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">b1b slow crank</text>
  <text x="760.0" y="106.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">SXH reel feeds from the side</text>
  <text x="760.0" y="120.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">(feed plates upstream: the</text>
  <text x="760.0" y="134.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">open conflict with h)</text>
  <rect x="200.0" y="220.0" width="260.0" height="120.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1.5"/>
  <rect x="200.0" y="220.0" width="70.0" height="120.0" rx="0" fill="#9db7d2" stroke="#2a5a8a" stroke-width="1"/>
  <text x="206.0" y="238.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">lid</text>
  <text x="206.0" y="252.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">face =</text>
  <text x="206.0" y="266.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">split root</text>
  <rect x="300.0" y="230.0" width="90.0" height="100.0" rx="0" fill="#c9dcef" stroke="#2a5a8a" stroke-width="1"/>
  <text x="304.0" y="246.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">fan block</text>
  <text x="304.0" y="260.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">1.7 -&gt; 5.0 mm</text>
  <text x="304.0" y="274.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">held at h ~5 mm</text>
  <rect x="390.0" y="241.0" width="40.0" height="8.0" rx="0" fill="#7fa6cc" stroke="#2a5a8a" stroke-width="1"/>
  <line x1="430.0" y1="245.0" x2="470.0" y2="245.0" stroke="#3a3a3a" stroke-width="6"/>
  <line x1="470.0" y1="245.0" x2="480.0" y2="245.0" stroke="#c98a3b" stroke-width="3"/>
  <rect x="390.0" y="259.0" width="40.0" height="8.0" rx="0" fill="#7fa6cc" stroke="#2a5a8a" stroke-width="1"/>
  <line x1="430.0" y1="263.0" x2="470.0" y2="263.0" stroke="#3a3a3a" stroke-width="6"/>
  <line x1="470.0" y1="263.0" x2="480.0" y2="263.0" stroke="#c98a3b" stroke-width="3"/>
  <rect x="390.0" y="277.0" width="40.0" height="8.0" rx="0" fill="#7fa6cc" stroke="#2a5a8a" stroke-width="1"/>
  <line x1="430.0" y1="281.0" x2="470.0" y2="281.0" stroke="#3a3a3a" stroke-width="6"/>
  <line x1="470.0" y1="281.0" x2="480.0" y2="281.0" stroke="#c98a3b" stroke-width="3"/>
  <rect x="390.0" y="295.0" width="40.0" height="8.0" rx="0" fill="#7fa6cc" stroke="#2a5a8a" stroke-width="1"/>
  <line x1="430.0" y1="299.0" x2="470.0" y2="299.0" stroke="#3a3a3a" stroke-width="6"/>
  <line x1="470.0" y1="299.0" x2="480.0" y2="299.0" stroke="#c98a3b" stroke-width="3"/>
  <rect x="390.0" y="313.0" width="40.0" height="8.0" rx="0" fill="#7fa6cc" stroke="#2a5a8a" stroke-width="1"/>
  <line x1="430.0" y1="317.0" x2="470.0" y2="317.0" stroke="#3a3a3a" stroke-width="6"/>
  <line x1="470.0" y1="317.0" x2="480.0" y2="317.0" stroke="#c98a3b" stroke-width="3"/>
  <text x="436.0" y="360.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">tongues (one per groove)</text>
  <line x1="160.0" y1="400.0" x2="160.0" y2="350.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="160.0" y1="400.0" x2="210.0" y2="400.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <text x="150.0" y="346.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">+Y</text>
  <text x="214.0" y="404.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">+X   XY stage</text>
  <text x="500.0" y="250.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">order: part, fan, then flush-cut and strip at the tongue lips,</text>
  <text x="500.0" y="264.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">because the fan pulls a 5P's outer tips back 1.65 mm [calc W2 s3]</text>
  <text x="500.0" y="290.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">far end: pogo test port on the cut face (a6)</text>
  <text x="20.0" y="450.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">B. Side section at station 5: the tongue lays the active conductor in; the crank pauses before the feed</text>
  <rect x="40.0" y="480.0" width="140.0" height="60.0" rx="0" fill="#c9dcef" stroke="#2a5a8a" stroke-width="1"/>
  <text x="46.0" y="498.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">fan block (pallet)</text>
  <line x1="180.0" y1="510.0" x2="200.0" y2="510.0" stroke="#3a3a3a" stroke-width="10"/>
  <polygon points="180.0,504.0 300.0,556.0 300.0,572.0 180.0,520.0" fill="#7fa6cc" stroke="#2a5a8a" stroke-width="1"/>
  <rect x="300.0" y="556.0" width="30.0" height="16.0" rx="0" fill="#7fa6cc" stroke="#2a5a8a" stroke-width="1"/>
  <path d="M180,510 L300,562 L330,562" fill="none" stroke="#3a3a3a" stroke-width="10"/>
  <line x1="330.0" y1="562.0" x2="420.0" y2="562.0" stroke="#3a3a3a" stroke-width="10"/>
  <line x1="420.0" y1="562.0" x2="470.0" y2="562.0" stroke="#c98a3b" stroke-width="5"/>
  <text x="40.0" y="600.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">tongue: hinged at the block face, covered groove, lip turns the conductor level;</text>
  <text x="40.0" y="614.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">a fixed cam at the station presses it down 5 mm and releases it on index,</text>
  <text x="40.0" y="628.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">so it lifts the crimped conductor back to h</text>
  <polygon points="250.0,470.0 290.0,470.0 280.0,530.0" fill="#f1d9a8" stroke="#8a6500" stroke-width="1"/>
  <text x="296.0" y="486.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">station cam (fixed)</text>
  <rect x="380.0" y="567.0" width="110.0" height="8.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="420.0" y="575.0" width="60.0" height="30.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <text x="496.0" y="596.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">anvil = zero</text>
  <rect x="420.0" y="500.0" width="60.0" height="50.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <text x="496.0" y="520.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">crimpers on the ram (b1b crank, ~10 s per turn)</text>
  <text x="496.0" y="534.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">crank pauses after the crimpers clear and before the</text>
  <text x="496.0" y="548.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">feed moves; the stage backs out -Y in that pause</text>
  <text x="40.0" y="660.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Cost: any 5-6 mm drop adds 10-12 mm of parted length (tongue, moved-back block or ram sole alike) [calc W2 s7].</text>
  <text x="40.0" y="676.0" font-size="11" fill="#a33" font-weight="normal" text-anchor="start">Open: how high the applicator's feed plates stand upstream, under the neighbours held at h (borrowed-machines Break a1-2).</text>
</svg>
