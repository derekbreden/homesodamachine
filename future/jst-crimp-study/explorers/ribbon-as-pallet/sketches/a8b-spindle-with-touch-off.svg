<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="520" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a8b Spindle with touch-off: one conductor at a time into a turning head</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic section, not to scale; the snout is what lets it work at 5 mm pitch</text>
  <rect x="420.0" y="150.0" width="220.0" height="120.0" rx="0" fill="#eee" stroke="#555" stroke-width="1"/>
  <rect x="440.0" y="140.0" width="30.0" height="140.0" rx="0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <rect x="590.0" y="140.0" width="30.0" height="140.0" rx="0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <text x="430.0" y="300.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">6700 bearings, 15 mm OD; GT2 belt from an N20 gearmotor;</text>
  <text x="430.0" y="314.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">a hand version turns the same head with a knob</text>
  <rect x="300.0" y="180.0" width="120.0" height="60.0" rx="0" fill="#f6f6f6" stroke="#555" stroke-width="1"/>
  <text x="300.0" y="170.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">snout &lt;= 7.8 mm across, &gt;= 6 mm long [P3 s8]</text>
  <polygon points="300.0,190.0 320.0,205.0 320.0,215.0 300.0,230.0" fill="#ddd" stroke="#555" stroke-width="1"/>
  <text x="300.0" y="256.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">4 mm funnel</text>
  <polygon points="350.0,195.0 380.0,205.0 350.0,206.0" fill="#556" stroke="#333" stroke-width="1"/>
  <polygon points="350.0,225.0 380.0,215.0 350.0,214.0" fill="#556" stroke="#333" stroke-width="1"/>
  <text x="300.0" y="340.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">two razor-sliver tips on flexure arms, closed together by a cone</text>
  <text x="300.0" y="354.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">onto stops: score radius 0.55-0.60 mm, set with a 1.1-1.2 mm gauge pin</text>
  <line x1="365.0" y1="240.0" x2="365.0" y2="330.0" stroke="#777" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="400.0" y="206.0" width="300.0" height="8.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <text x="710.0" y="206.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">isolated tip stop rod (non-rotating),</text>
  <text x="710.0" y="220.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">one strip length behind the blades;</text>
  <text x="710.0" y="234.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">ejects the slug</text>
  <line x1="60.0" y1="210.0" x2="330.0" y2="210.0" stroke="#3a3a3a" stroke-width="12"/>
  <line x1="300.0" y1="210.0" x2="330.0" y2="210.0" stroke="#c98a3b" stroke-width="5"/>
  <text x="60.0" y="200.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">conductor k (from the fan block)</text>
  <line x1="60.0" y1="160.0" x2="260.0" y2="160.0" stroke="#6b6b6b" stroke-width="12"/>
  <text x="60.0" y="150.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">neighbour at 5 mm pitch</text>
  <line x1="60.0" y1="260.0" x2="260.0" y2="260.0" stroke="#6b6b6b" stroke-width="12"/>
  <text x="60.0" y="250.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">neighbour at 5 mm pitch</text>
  <text x="40.0" y="400.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Cycle: touch-off (conductor k reads continuous to the stop through the far-end port),</text>
  <text x="40.0" y="414.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">score three turns, draw back 1.2 mm, a quarter to half turn to twist the stub,</text>
  <text x="40.0" y="428.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">draw off, eject. At 5 mm pitch the neighbours' jacket edges are 4.15 mm from k's axis:</text>
  <text x="40.0" y="442.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">without the snout their tips butt the head's face. At 2.5 mm the snout would have to be</text>
  <text x="40.0" y="456.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">&lt;= 2.8 mm, so there k is lifted ~9 mm into the head instead (procedure-is-the-machine p1c).</text>
</svg>
