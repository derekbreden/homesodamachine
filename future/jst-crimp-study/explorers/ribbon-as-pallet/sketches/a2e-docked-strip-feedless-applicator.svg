<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="720" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a2e Docked strip through a feedless applicator (a2 x borrowed-machines b1b)</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic, not to scale; strip pitch ~7.1 mm (Wurth analog); parts marked dashed are removed</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">A. Plan: the carriage carries the carrier segment and the docked ribbon pallet along X</text>
  <rect x="40.0" y="330.0" width="900.0" height="12.0" rx="0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <text x="44.0" y="358.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">MGN12 rail + Tr8x2 NEMA 17 [Prime rows]: one X axis; load position upstream (right)</text>
  <rect x="300.0" y="90.0" width="220.0" height="160.0" rx="0" fill="#eeeeee" stroke="#555" stroke-width="1"/>
  <text x="306.0" y="106.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">OTP side-feed applicator on the VEVOR bed,</text>
  <text x="306.0" y="120.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">under a 3-4 mm eccentric</text>
  <rect x="402.0" y="150.0" width="16.0" height="40.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <text x="388.0" y="144.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">anvil</text>
  <rect x="440.0" y="190.0" width="70.0" height="26.0" rx="0" fill="none" stroke="#a33" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="440.0" y="160.0" width="70.0" height="26.0" rx="0" fill="none" stroke="#a33" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="510.0" y1="165.0" x2="560.0" y2="100.0" stroke="#a33" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="564.0" y="86.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">removed (dashed): pressure plate and feed finger upstream;</text>
  <text x="564.0" y="100.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">shear punch at the station, its pocket now holds a pilot</text>
  <rect x="380.0" y="222.0" width="260.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="403.0" y="160.0" width="14.0" height="62.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="410.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="453.0" y="160.0" width="14.0" height="62.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="460.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="503.0" y="160.0" width="14.0" height="62.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="510.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="553.0" y="160.0" width="14.0" height="62.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="560.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="603.0" y="160.0" width="14.0" height="62.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="610.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="380.0" y="224.0" width="10.0" height="12.0" rx="0" fill="#333" stroke="#111" stroke-width="1"/>
  <rect x="630.0" y="224.0" width="10.0" height="12.0" rx="0" fill="#333" stroke="#111" stroke-width="1"/>
  <circle cx="385.0" cy="230.0" r="3.0" fill="#a33" stroke="#a33" stroke-width="1"/>
  <text x="660.0" y="256.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">grips (dark): pins in the carrier's END slots</text>
  <text x="660.0" y="270.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">pilot (red dot): enters the slot beside the anvil</text>
  <text x="660.0" y="284.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">contact before the crimpers touch; the row</text>
  <text x="660.0" y="298.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">floats +/-0.5 mm in X on a light spring</text>
  <rect x="370.0" y="262.0" width="280.0" height="58.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="374.0" y="312.0" font-size="10" fill="#2a5a8a" font-weight="normal" text-anchor="start">ribbon pallet, fanned to strip pitch, on three balls</text>
  <line x1="410.0" y1="172.0" x2="410.0" y2="264.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="410.0" y1="162.0" x2="410.0" y2="180.0" stroke="#c98a3b" stroke-width="4"/>
  <line x1="460.0" y1="172.0" x2="460.0" y2="264.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="460.0" y1="162.0" x2="460.0" y2="180.0" stroke="#c98a3b" stroke-width="4"/>
  <line x1="510.0" y1="172.0" x2="510.0" y2="264.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="510.0" y1="162.0" x2="510.0" y2="180.0" stroke="#c98a3b" stroke-width="4"/>
  <line x1="560.0" y1="172.0" x2="560.0" y2="264.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="560.0" y1="162.0" x2="560.0" y2="180.0" stroke="#c98a3b" stroke-width="4"/>
  <line x1="610.0" y1="172.0" x2="610.0" y2="264.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="610.0" y1="162.0" x2="610.0" y2="180.0" stroke="#c98a3b" stroke-width="4"/>
  <rect x="560.0" y="150.0" width="300.0" height="90.0" rx="0" fill="none" stroke="#3a7a35" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="566.0" y="146.0" font-size="10" fill="#3a7a35" font-weight="normal" text-anchor="start">loading shelf, flush with the track; groove along X under the lance line</text>
  <rect x="160.0" y="150.0" width="140.0" height="90.0" rx="0" fill="#fbeaea" stroke="#a33" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="164.0" y="166.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">downstream: crimped</text>
  <text x="164.0" y="180.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">contacts on their</text>
  <text x="164.0" y="194.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">carrier reach ~18-35 mm</text>
  <text x="164.0" y="208.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">past the anvil (3P-5P,</text>
  <text x="164.0" y="222.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">end-slot grips);</text>
  <text x="164.0" y="236.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">room unknown until scanned</text>
  <line x1="760.0" y1="314.0" x2="660.0" y2="314.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <text x="766.0" y="318.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">index -X, one pitch per turn</text>
  <text x="20.0" y="400.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">B. Section at the anvil, one eccentric turn per contact</text>
  <circle cx="200.0" cy="450.0" r="20.0" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="206.0" cy="450.0" r="4.0" fill="#333" stroke="#555" stroke-width="1"/>
  <line x1="206.0" y1="450.0" x2="204.0" y2="540.0" stroke="#333" stroke-width="4"/>
  <rect x="180.0" y="540.0" width="50.0" height="30.0" rx="0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <text x="240.0" y="440.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">NEMA 17 + 26.85:1 planetary [Prime], 3-4 mm eccentric:</text>
  <text x="240.0" y="454.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">1.0-1.7 N m, ~40-47 HX711 samples through the last 0.2 mm [P3 s5];</text>
  <text x="240.0" y="468.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">AS5600 on the shaft; strain gauges on the rod</text>
  <rect x="185.0" y="570.0" width="40.0" height="40.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <text x="236.0" y="596.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">crimpers (conductor, insulation) and dials</text>
  <rect x="120.0" y="632.0" width="180.0" height="10.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="180.0" y="642.0" width="50.0" height="30.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <text x="236.0" y="660.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">anvil (fixed): the reference for the stroke</text>
  <line x1="60.0" y1="626.0" x2="300.0" y2="626.0" stroke="#3a3a3a" stroke-width="10"/>
  <text x="40.0" y="618.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">conductor already in the barrels (docked)</text>
  <text x="650.0" y="440.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Before each stroke:</text>
  <text x="650.0" y="454.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  continuity conductor-to-carrier (far-end port)</text>
  <text x="650.0" y="468.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  camera: strands in, insulation edge in the window</text>
  <text x="650.0" y="482.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">During: force curve, stop-before-bottom; re-touch height</text>
  <text x="650.0" y="496.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">After the row, back at the load position:</text>
  <text x="650.0" y="510.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  slot pins drop into every slot, the shear comb's pad</text>
  <text x="650.0" y="524.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  comes down on the crimped barrels, each conductor is</text>
  <text x="650.0" y="538.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  pulled to 20 N; then the comb shears every tab</text>
  <text x="650.0" y="552.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start"></text>
  <text x="650.0" y="566.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Person per ribbon end: lay a strip segment, seat the</text>
  <text x="650.0" y="580.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  ribbon pallet, press start (~2 min machine time per 5P)</text>
</svg>
