<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="700" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a5 Part, fan and strip: three orders that keep every tip and insulation edge where the crimp needs it</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic; recession figures for the compact R 5 mm / 30 deg S groove [calc W2 s3]; other groove shapes differ</text>
  <text x="20.0" y="90.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Order A (a1, a2, a2e, a10)</text>
  <rect x="20.0" y="100.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="26.0" y="120.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">part to the clamp face</text>
  <line x1="190.0" y1="116.0" x2="210.0" y2="116.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="210.0" y="100.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="216.0" y="120.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">fan to working pitch</text>
  <line x1="380.0" y1="116.0" x2="400.0" y2="116.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="400.0" y="100.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="406.0" y="120.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">flush-cut at the fan face</text>
  <line x1="570.0" y1="116.0" x2="590.0" y2="116.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="590.0" y="100.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="596.0" y="120.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">strip at the fan face</text>
  <text x="20.0" y="150.0" font-size="11" fill="#444" font-weight="normal" text-anchor="start">tips and edges on one line in the crimp pose; the outer conductors stay longer:</text>
  <text x="20.0" y="164.0" font-size="11" fill="#444" font-weight="normal" text-anchor="start">closed to 2.5 mm they carry 0.65-2.46 mm excess, a 2-5 mm arc in the loom [calc F s5]</text>
  <text x="20.0" y="200.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Order B (a9)</text>
  <rect x="20.0" y="210.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="26.0" y="230.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">flush-cut at the clamp face</text>
  <line x1="190.0" y1="226.0" x2="210.0" y2="226.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="210.0" y="210.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="216.0" y="230.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">strip webbed (p7)</text>
  <line x1="380.0" y1="226.0" x2="400.0" y2="226.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="400.0" y="210.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="406.0" y="230.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">zip from the slug's gap</text>
  <line x1="570.0" y1="226.0" x2="590.0" y2="226.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="590.0" y="210.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="596.0" y="230.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">equal-path fan</text>
  <text x="20.0" y="260.0" font-size="11" fill="#444" font-weight="normal" text-anchor="start">every conductor one length from the root; inner grooves carry humps (5P at 7.1 mm:</text>
  <text x="20.0" y="274.0" font-size="11" fill="#444" font-weight="normal" text-anchor="start">5.1 mm over 21 mm) so the tips stay on a line; humps leave set, pulled straight at insertion</text>
  <text x="20.0" y="310.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Order C (a4 or a1c with a8b)</text>
  <rect x="20.0" y="320.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="26.0" y="340.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">part</text>
  <line x1="190.0" y1="336.0" x2="210.0" y2="336.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="210.0" y="320.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="216.0" y="340.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">fan</text>
  <line x1="380.0" y1="336.0" x2="400.0" y2="336.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="400.0" y="320.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="406.0" y="340.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">touch off each tip</text>
  <line x1="570.0" y1="336.0" x2="590.0" y2="336.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="590.0" y="320.0" width="170.0" height="32.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1"/>
  <text x="596.0" y="340.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">strip each at its own tip</text>
  <text x="20.0" y="370.0" font-size="11" fill="#444" font-weight="normal" text-anchor="start">any fan; each conductor's position measured and used; a8b needs a snout &lt;= 7.8 mm</text>
  <text x="20.0" y="384.0" font-size="11" fill="#444" font-weight="normal" text-anchor="start">at 5 mm pitch, or the conductor lifted ~9 mm (procedure-is-the-machine p1c)</text>
  <text x="20.0" y="440.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Outer conductor's recession in the fan (compact S) [calc W2 s3]</text>
  <text x="30.0" y="462.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">pitch</text>
  <text x="110.0" y="462.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">3P</text>
  <text x="190.0" y="462.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">4P</text>
  <text x="270.0" y="462.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">5P</text>
  <text x="30.0" y="480.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">2.5 mm</text>
  <text x="110.0" y="480.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">0.11</text>
  <text x="190.0" y="480.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">0.20</text>
  <text x="270.0" y="480.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">0.31</text>
  <text x="30.0" y="498.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">5.0 mm</text>
  <text x="110.0" y="498.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">0.76</text>
  <text x="190.0" y="498.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">1.20</text>
  <text x="270.0" y="498.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">1.65</text>
  <text x="30.0" y="516.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">7.1 mm</text>
  <text x="110.0" y="516.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">1.32</text>
  <text x="190.0" y="516.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">2.05</text>
  <text x="270.0" y="516.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">2.77</text>
  <text x="20.0" y="552.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">A gentle S spread over the whole split gives less at 2.5 mm (5P 0.10-0.19 mm),</text>
  <text x="20.0" y="566.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">and about the same at 7.1 mm (2.0-3.1 mm) [P3 s1]: the groove's shape sets it.</text>
  <text x="520.0" y="440.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">The catalogue behind the stations</text>
  <text x="520.0" y="462.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Parting: P1 floating plough (a7b); P2 fixed gang; P3 nick and wedge (a7);</text>
  <text x="520.0" y="476.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  P4 interlaced toothed jaws; P5 slot punch; P6 laser slit</text>
  <text x="520.0" y="490.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Fanning: F1 recipe fan block; F2 pitch changer; F3 tines that stay (a7);</text>
  <text x="520.0" y="504.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  F4 form and let go; F5 equal-path grooves (order B)</text>
  <text x="520.0" y="518.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Stripping: S1 crown score across the row (= p7 before the split);</text>
  <text x="520.0" y="532.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  S2 V-blades per conductor; S3 ring score by turning (a8, a8b);</text>
  <text x="520.0" y="546.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">  S4 pinch and pull; S5 laser score; S6 hot blade; S7 strip-crimp applicator</text>
  <text x="520.0" y="560.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start"></text>
  <text x="520.0" y="574.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Nick detector for any blade or tine: isolated steel, a wire to every</text>
  <text x="520.0" y="588.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">conductor through the far end (a6) or the reel; a touch names it.</text>
</svg>
