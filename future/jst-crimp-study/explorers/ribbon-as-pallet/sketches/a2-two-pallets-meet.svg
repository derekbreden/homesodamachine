<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="660" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a2 Two pallets meet: the carrier strip is the contact pallet</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic, not to scale; strip pitch ~7.1 mm (Wurth analog; JST's figure is licence-gated)</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">A. Plan, after docking: every conductor already lies in its contact</text>
  <rect x="120.0" y="150.0" width="420.0" height="110.0" rx="0" fill="#eee" stroke="#555" stroke-width="1"/>
  <text x="552.0" y="158.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">strip pallet (steel): slot pins in the carrier's slots;</text>
  <text x="552.0" y="172.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">comb clamp bar between conductor paths;</text>
  <text x="552.0" y="186.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">support comb and rail carry a groove along X under the</text>
  <text x="552.0" y="200.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">lance line (a flat face props each contact 7.6-15.9 deg)</text>
  <text x="552.0" y="214.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">hardened rail flush with the contacts' floor (grey band)</text>
  <rect x="120.0" y="110.0" width="420.0" height="12.0" rx="0" fill="#aab" stroke="#556" stroke-width="1"/>
  <text x="552.0" y="124.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">rail for the head's lower arm (Z from the strip pallet)</text>
  <rect x="140.0" y="222.0" width="380.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="140.0" y1="196.0" x2="520.0" y2="196.0" stroke="#a33" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="525.0" y="238.0" font-size="10" fill="#a33" font-weight="normal" text-anchor="start">lance-line groove (dashed)</text>
  <rect x="173.0" y="150.0" width="14.0" height="72.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="180.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="200.0" y="226.0" width="10.0" height="8.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="223.0" y="150.0" width="14.0" height="72.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="230.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="250.0" y="226.0" width="10.0" height="8.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="273.0" y="150.0" width="14.0" height="72.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="280.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="300.0" y="226.0" width="10.0" height="8.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="323.0" y="150.0" width="14.0" height="72.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="330.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="350.0" y="226.0" width="10.0" height="8.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="373.0" y="150.0" width="14.0" height="72.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="380.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="400.0" y="226.0" width="10.0" height="8.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="423.0" y="150.0" width="14.0" height="72.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="430.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <rect x="450.0" y="226.0" width="10.0" height="8.0" rx="0" fill="#555" stroke="#555" stroke-width="1"/>
  <rect x="473.0" y="150.0" width="14.0" height="72.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <circle cx="480.0" cy="230.0" r="4.0" fill="#fff" stroke="#8a6500" stroke-width="1"/>
  <line x1="230.0" y1="180.0" x2="230.0" y2="330.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="230.0" y1="162.0" x2="230.0" y2="184.0" stroke="#c98a3b" stroke-width="4"/>
  <line x1="280.0" y1="180.0" x2="280.0" y2="330.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="280.0" y1="162.0" x2="280.0" y2="184.0" stroke="#c98a3b" stroke-width="4"/>
  <line x1="330.0" y1="180.0" x2="330.0" y2="330.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="330.0" y1="162.0" x2="330.0" y2="184.0" stroke="#c98a3b" stroke-width="4"/>
  <line x1="380.0" y1="180.0" x2="380.0" y2="330.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="380.0" y1="162.0" x2="380.0" y2="184.0" stroke="#c98a3b" stroke-width="4"/>
  <line x1="430.0" y1="180.0" x2="430.0" y2="330.0" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="430.0" y1="162.0" x2="430.0" y2="184.0" stroke="#c98a3b" stroke-width="4"/>
  <rect x="200.0" y="300.0" width="260.0" height="80.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="206.0" y="396.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">ribbon pallet: fan block at strip pitch, flush-cut and stripped at its face;</text>
  <text x="206.0" y="410.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">three balls on hardened ball pairs or case-hardened rod, magnets pull it home;</text>
  <text x="206.0" y="424.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">if the open wings are narrower than the jacket, a finger comb presses each</text>
  <text x="206.0" y="438.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">conductor in at ~0.5-2 N, taken by the rail, not the tabs [calc F s4]</text>
  <rect x="262.0" y="80.0" width="36.0" height="60.0" rx="0" fill="#bbb" stroke="#333" stroke-width="1"/>
  <text x="552.0" y="76.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">C-frame head (borrowed-machines b3): harvested OTP crimper and anvil,</text>
  <text x="552.0" y="90.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">NEMA 17 + 10:1 on a 3 mm crank, ~3.8 kN, ~1 kg; arms &lt;= 10 mm wide</text>
  <line x1="262.0" y1="148.0" x2="212.0" y2="148.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="298.0" y1="148.0" x2="348.0" y2="148.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <text x="20.0" y="480.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">B. Side: the head straddles one contact from the box end</text>
  <rect x="80.0" y="510.0" width="16.0" height="90.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="80.0" y="510.0" width="160.0" height="16.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="80.0" y="584.0" width="160.0" height="16.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="200.0" y="526.0" width="30.0" height="20.0" rx="0" fill="#777" stroke="#333" stroke-width="1"/>
  <rect x="200.0" y="566.0" width="30.0" height="18.0" rx="0" fill="#777" stroke="#333" stroke-width="1"/>
  <text x="440.0" y="538.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">upper die (crimper) over the wings</text>
  <text x="250.0" y="578.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">lower die on the rail: it passes under the lance and rises behind</text>
  <text x="250.0" y="592.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">its tip only if the neck t &gt;= 0.34-0.74 mm [w3 s5]; else it drops and rises</text>
  <rect x="180.0" y="548.0" width="170.0" height="8.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="230.0" y1="542.0" x2="420.0" y2="542.0" stroke="#3a3a3a" stroke-width="10"/>
  <rect x="330.0" y="556.0" width="60.0" height="10.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <text x="400.0" y="566.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">carrier on slot pins</text>
  <text x="40.0" y="626.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Then: each conductor pulled to 20 N with the shear comb's pad down on the crimped barrels (the tab alone pitches at 2.5-4.6 N [w3 s4]);</text>
  <text x="40.0" y="640.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">the notched shear comb cuts every tab; lift; close to 2.5 mm; insert (a6).</text>
</svg>
