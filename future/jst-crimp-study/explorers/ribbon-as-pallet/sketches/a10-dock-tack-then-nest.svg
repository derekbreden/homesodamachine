<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="780" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a10 Dock, tack, cut: then each contact crimped alone in a keyed steel nest</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic, not to scale; a combination with force-and-form f9, f3, f6 and f4, and change-the-question c1b's tack</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">A. Side section at the strip pallet, one contact of the docked row</text>
  <rect x="150.0" y="214.0" width="150.0" height="14.0" rx="0" fill="#cfd6dd" stroke="#556" stroke-width="1"/>
  <text x="60.0" y="244.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">carrier plate on slot pins</text>
  <text x="60.0" y="258.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">(drops for the shear)</text>
  <rect x="220.0" y="206.0" width="80.0" height="8.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="302.0" y="206.0" width="58.0" height="40.0" rx="0" fill="#9aa4ae" stroke="#556" stroke-width="1"/>
  <text x="302.0" y="262.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">hardened rail under the</text>
  <text x="302.0" y="276.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">insulation barrels only;</text>
  <text x="302.0" y="290.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">its rear edge = shear edge</text>
  <path d="M302,206 L302,176 M340,206 L340,176" fill="none" stroke="#8a6500" stroke-width="3"/>
  <rect x="302.0" y="202.0" width="38.0" height="4.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <path d="M350,206 L350,186 M378,206 L378,186" fill="none" stroke="#8a6500" stroke-width="3"/>
  <rect x="350.0" y="202.0" width="28.0" height="4.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="390.0" y="164.0" width="64.0" height="42.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="420.0" y1="206.0" x2="408.0" y2="222.0" stroke="#8a6500" stroke-width="3"/>
  <text x="430.0" y="236.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">lance hangs free (a flat shelf would prop it 7.6-15.9 deg)</text>
  <line x1="60.0" y1="190.0" x2="340.0" y2="190.0" stroke="#3a3a3a" stroke-width="12"/>
  <line x1="340.0" y1="192.0" x2="384.0" y2="192.0" stroke="#c98a3b" stroke-width="5"/>
  <rect x="40.0" y="170.0" width="90.0" height="40.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1"/>
  <text x="40.0" y="164.0" font-size="10" fill="#2a5a8a" font-weight="normal" text-anchor="start">ribbon pallet (fan block face)</text>
  <polygon points="296.0,110.0 346.0,110.0 346.0,160.0 336.0,172.0 306.0,172.0 296.0,160.0" fill="#8894a0" stroke="#333" stroke-width="1"/>
  <line x1="321.0" y1="96.0" x2="321.0" y2="108.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <text x="480.0" y="110.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">1 dock: every conductor drops into every open contact; continuity to the carrier</text>
  <text x="480.0" y="124.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">2 tack: a notched steel comb closes every insulation barrel loosely in one stroke</text>
  <text x="480.0" y="138.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">   to a hard stop (165-660 N for a 5P [w3 s3]); conductor barrels stay open</text>
  <text x="480.0" y="152.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">3 cut: the comb stays down as the pad; the carrier plate drops past the rail's</text>
  <text x="480.0" y="166.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">   edge and shears every tab (250-800 N for a 5P)</text>
  <text x="480.0" y="180.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">4 lift: every contact now hangs from its own conductor, one strip pitch apart</text>
  <text x="20.0" y="330.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">B. The heavy station: one tacked contact at a time</text>
  <path d="M80,370 L80,590 L360,590 L360,550 L140,550 L140,410 L360,410 L360,370 Z" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <text x="90.0" y="386.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">steel C (f4), throat toward the wire</text>
  <rect x="240.0" y="430.0" width="30.0" height="50.0" rx="0" fill="#999" stroke="#333" stroke-width="1"/>
  <rect x="274.0" y="440.0" width="14.0" height="40.0" rx="0" fill="#bbb" stroke="#333" stroke-width="1"/>
  <text x="380.0" y="420.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">conductor crimper on f3's knee (NEMA 17 on Tr8x2, 60-160 N push), to a geometric bottom;</text>
  <text x="380.0" y="434.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">f6's insulation blade beside it on its own drive; 0.001 mm indicator across the dies</text>
  <rect x="230.0" y="510.0" width="70.0" height="40.0" rx="0" fill="#777" stroke="#333" stroke-width="1"/>
  <text x="380.0" y="500.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">keyed nest on a button load cell: box slot with lead-in chamfers, lance relief,</text>
  <text x="380.0" y="514.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">front stop; the contact goes in vertically, then +Y to the stop</text>
  <rect x="236.0" y="484.0" width="60.0" height="12.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <line x1="160.0" y1="490.0" x2="236.0" y2="490.0" stroke="#3a3a3a" stroke-width="8"/>
  <text x="380.0" y="550.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">neighbours hang one strip pitch away: jaws &lt;= 10.8-11.4 mm wide where they pass [w3 s3];</text>
  <text x="380.0" y="564.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">the far-end port reads which conductor touches the grounded nest (identity before force);</text>
  <text x="380.0" y="578.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">pull: a 0.3 mm blade on the box's rear face, a jaw on the jacket, ~20 N</text>
  <text x="20.0" y="640.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">C. a10b, no motor: the same docked, tacked, sheared row, crimped by hand</text>
  <text x="20.0" y="660.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">The tack holds each contact on its jacket at its docked depth and roll: the locator the SN-2549 lacks.</text>
  <text x="20.0" y="674.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">The person seats one tacked contact in the SN-2549's XH nest, squeezes to the ratchet's release,</text>
  <text x="20.0" y="688.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">and moves to the next. Tack comb and shear on POWERTEC toggle clamps ($18.25 for two [Prime]).</text>
  <text x="20.0" y="702.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Kit contacts on hand can take the strip's place in a2c's keyed nest bar.</text>
</svg>
