<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="720" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a6 The housing is the last comb: close, grip behind the barrels, let the fronts step, test on a real wafer</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic plan, not to scale; 5P closed from strip pitch shown in A</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">A. Closing a fan leaves the outer contacts ahead: a V staircase [P3 s10]</text>
  <rect x="40.0" y="110.0" width="120.0" height="200.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="46.0" y="104.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">pallet</text>
  <path d="M160,185 C230,185 260,150 330,150 L434,150" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="434.1" y="142.0" width="60.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <text x="498.1" y="154.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">+2.47</text>
  <path d="M160,192 C230,192 260,175 330,175 L397,175" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="396.6" y="167.0" width="60.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <text x="460.6" y="179.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">+1.22</text>
  <path d="M160,200 C230,200 260,200 330,200 L360,200" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="360.0" y="192.0" width="60.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <text x="424.0" y="204.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">0</text>
  <path d="M160,208 C230,208 260,225 330,225 L397,225" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="396.6" y="217.0" width="60.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <text x="460.6" y="229.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">+1.22</text>
  <path d="M160,215 C230,215 260,250 330,250 L434,250" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="434.1" y="242.0" width="60.0" height="16.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <text x="498.1" y="254.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">+2.47</text>
  <rect x="300.0" y="135.0" width="30.0" height="130.0" rx="0" fill="#9fb0c4" stroke="#2a5a8a" stroke-width="1"/>
  <text x="250.0" y="290.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">2.5 mm closing block (plain grooves)</text>
  <text x="250.0" y="304.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">and insertion clamp: jaws grip each</text>
  <text x="250.0" y="318.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">conductor 1-2 mm behind its barrel,</text>
  <text x="250.0" y="332.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">then slide along to push on the</text>
  <text x="250.0" y="346.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">barrel's rear (Molex US 4,936,011)</text>
  <rect x="560.0" y="130.0" width="70.0" height="140.0" rx="0" fill="#eee" stroke="#555" stroke-width="1"/>
  <text x="636.0" y="140.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">XHP on a real XH wafer (test board),</text>
  <text x="636.0" y="154.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">nest on a load cell (HX711)</text>
  <text x="560.0" y="300.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Latch events: outer pair, next pair, centre (3 events for 5 contacts).</text>
  <text x="560.0" y="314.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Forcing the fronts onto one line instead bows the outer</text>
  <text x="560.0" y="328.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">conductors 2.2-4.5 mm [P3 s10]; in order A the same excess</text>
  <text x="560.0" y="342.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">stays in the finished loom as a 3-5 mm arc [calc F s5].</text>
  <text x="560.0" y="356.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">Pull-back: release, draw back at &lt;= 5 N per contact; the camera</text>
  <text x="560.0" y="370.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">looks for any contact that followed. Then pin map, shorts,</text>
  <text x="560.0" y="384.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">J2 cavity 3 open, through the far-end port or the reel.</text>
  <text x="20.0" y="420.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">B. J4 and J7: the crossing runs between the two ribbons [procedure-is-the-machine unit_inventory s1]</text>
  <text x="20.0" y="450.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">J4 SENSORS, XHP-7</text>
  <rect x="60.0" y="470.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="73.0" y="487.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">1</text>
  <rect x="100.0" y="470.0" width="34.0" height="26.0" rx="0" fill="#d9c7f0" stroke="#555" stroke-width="1"/>
  <text x="113.0" y="487.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">2</text>
  <rect x="140.0" y="470.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="153.0" y="487.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">3</text>
  <rect x="180.0" y="470.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="193.0" y="487.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">4</text>
  <rect x="220.0" y="470.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="233.0" y="487.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">5</text>
  <rect x="260.0" y="470.0" width="34.0" height="26.0" rx="0" fill="#d9c7f0" stroke="#555" stroke-width="1"/>
  <text x="273.0" y="487.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">6</text>
  <rect x="300.0" y="470.0" width="34.0" height="26.0" rx="0" fill="#d9c7f0" stroke="#555" stroke-width="1"/>
  <text x="313.0" y="487.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">7</text>
  <text x="360.0" y="476.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">4P (gold) by machine through a gapped closing block: cavities 1, 3, 4, 5;</text>
  <text x="360.0" y="490.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">the 3P's GND crosses into cavity 2, so its three contacts go in by hand</text>
  <text x="360.0" y="504.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">(or X5: one pallet with a raised crossover groove, ~39 mm split)</text>
  <text x="20.0" y="540.0" font-size="11" fill="#222" font-weight="bold" text-anchor="start">J7 REEDS B, XHP-7</text>
  <rect x="60.0" y="560.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="73.0" y="577.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">1</text>
  <rect x="100.0" y="560.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="113.0" y="577.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">2</text>
  <rect x="140.0" y="560.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="153.0" y="577.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">3</text>
  <rect x="180.0" y="560.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="193.0" y="577.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">4</text>
  <rect x="220.0" y="560.0" width="34.0" height="26.0" rx="0" fill="#d9c7f0" stroke="#555" stroke-width="1"/>
  <text x="233.0" y="577.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">5</text>
  <rect x="260.0" y="560.0" width="34.0" height="26.0" rx="0" fill="#d9c7f0" stroke="#555" stroke-width="1"/>
  <text x="273.0" y="577.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">6</text>
  <rect x="300.0" y="560.0" width="34.0" height="26.0" rx="0" fill="#e6c36a" stroke="#555" stroke-width="1"/>
  <text x="313.0" y="577.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">7</text>
  <text x="360.0" y="566.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">5P by machine: cavities 1-4 and 7 (its GND jumps the gap);</text>
  <text x="360.0" y="580.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">the 3P's CLO/CHI into 5-6 by hand, under the 5P's GND.</text>
  <text x="360.0" y="594.0" font-size="10" fill="#222" font-weight="normal" text-anchor="start">Wiring choice for Derek: GND on the 3P, the 5P's fifth trimmed -&gt; straight</text>
  <text x="20.0" y="650.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">C. Far-end port: P75-E2 conical pogo pins on the cut face, 1.3 mm cone at 1.7 mm pitch ($6.49 / 100 [Prime]); or the reel's hub socket (a9)</text>
  <text x="20.0" y="668.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">It gives touch-off, nick detection, placement before force, and opens/shorts after insertion; it cannot grade a crimp (loom 6-34 mOhm).</text>
</svg>
