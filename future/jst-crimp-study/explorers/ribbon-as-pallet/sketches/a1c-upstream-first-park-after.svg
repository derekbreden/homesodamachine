<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20.0" y="26.0" font-size="16" fill="#222" font-weight="bold" text-anchor="start">a1c Crimp from the upstream end, fold each finished conductor back (a1 x borrowed-machines b1)</text>
  <text x="20.0" y="44.0" font-size="12" fill="#a33" font-weight="normal" text-anchor="start">schematic, not to scale; crimp pitch p_c set by the applicator's downstream tooling width</text>
  <text x="20.0" y="74.0" font-size="12" fill="#222" font-weight="bold" text-anchor="start">Plan: the fan lies flat in the anvil plane, all of it downstream of the anvil</text>
  <rect x="510.0" y="120.0" width="440.0" height="14.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="513.0" y="134.0" width="14.0" height="50.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="568.0" y="134.0" width="14.0" height="50.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="623.0" y="134.0" width="14.0" height="50.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="678.0" y="134.0" width="14.0" height="50.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="733.0" y="134.0" width="14.0" height="50.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="788.0" y="134.0" width="14.0" height="50.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <rect x="843.0" y="134.0" width="14.0" height="50.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <text x="640.0" y="112.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">reel strip from upstream (+X), feed intact; next contact waits on the anvil</text>
  <rect x="508.0" y="184.0" width="24.0" height="16.0" rx="0" fill="#888" stroke="#333" stroke-width="1"/>
  <text x="480.0" y="214.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">anvil</text>
  <rect x="504.0" y="225.0" width="32.0" height="18.0" rx="0" fill="#b8c0c8" stroke="#556" stroke-width="1"/>
  <text x="542.0" y="238.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">fork on the applicator axis (b1): folds the crimped conductor back</text>
  <rect x="80.0" y="300.0" width="600.0" height="180.0" rx="0" fill="#dbe9f6" stroke="#2a5a8a" stroke-width="1.5"/>
  <text x="86.0" y="470.0" font-size="11" fill="#2a5a8a" font-weight="normal" text-anchor="start">pallet on the XY stage; lid face = split root; fan block grooves flat</text>
  <path d="M358,330 C358,290 520,280 520,200" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="520.0" y1="184.0" x2="520.0" y2="204.0" stroke="#c98a3b" stroke-width="4"/>
  <path d="M338,330 C338,290 460,280 460,200" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="460.0" y1="184.0" x2="460.0" y2="204.0" stroke="#c98a3b" stroke-width="4"/>
  <path d="M318,330 C318,290 400,280 400,200" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="400.0" y1="184.0" x2="400.0" y2="204.0" stroke="#c98a3b" stroke-width="4"/>
  <path d="M298,330 C298,290 340,280 340,200" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <line x1="340.0" y1="184.0" x2="340.0" y2="204.0" stroke="#c98a3b" stroke-width="4"/>
  <text x="90.0" y="250.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">uncrimped conductors, flat, downstream (-X)</text>
  <path d="M580,330 L580,420" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="573.0" y="420.0" width="14.0" height="22.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <path d="M630,330 L630,420" fill="none" stroke="#3a3a3a" stroke-width="9"/>
  <rect x="623.0" y="420.0" width="14.0" height="22.0" rx="0" fill="#e6c36a" stroke="#8a6500" stroke-width="1"/>
  <text x="560.0" y="460.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">crimped, folded back over the pallet into numbered pockets</text>
  <line x1="700.0" y1="520.0" x2="800.0" y2="520.0" stroke="#333" stroke-width="1" marker-end="url(#ar)"/>
  <text x="810.0" y="524.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">index +X one p_c per conductor</text>
  <text x="730.0" y="300.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">per conductor:</text>
  <text x="730.0" y="314.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">1 slide in +Y along the barrels' axis</text>
  <text x="730.0" y="328.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">2 sole seats it level (Repair B)</text>
  <text x="730.0" y="342.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">3 crank: crimp, shear, PAUSE</text>
  <text x="730.0" y="356.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">4 stage backs out -Y 10 mm</text>
  <text x="730.0" y="370.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">5 crank finishes: feed</text>
  <text x="730.0" y="384.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">6 fork folds it back</text>
  <text x="730.0" y="398.0" font-size="11" fill="#222" font-weight="normal" text-anchor="start">7 index +X</text>
</svg>
