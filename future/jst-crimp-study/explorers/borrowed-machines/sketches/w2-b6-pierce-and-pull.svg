<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="arrs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcf8"/>
<text x="14.0" y="28.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="start">b6  Pierce at the root, pull toward the tip (schematic; the sewing machine's needle and needle plate, borrowed)</text>
<rect x="10.0" y="44.0" width="900.0" height="480.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="18.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Side section along one web (not to scale)</text>
<rect x="920.0" y="44.0" width="570.0" height="480.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="928.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">End view at the needle (not to scale)</text>
<rect x="60.0" y="360.0" width="820.0" height="30.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="70.0" y="380.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">needle plate (stencil steel strips)</text>
<rect x="60.0" y="260.0" width="820.0" height="16.0" rx="0" fill="#9aa5ad" fill-opacity="0.6" stroke="#222" stroke-width="1.2"/>
<text x="70.0" y="254.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">top guide</text>
<rect x="60.0" y="290.0" width="180.0" height="70.0" rx="0" fill="#8fb8de" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="70.0" y="320.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">cassette clamp</text>
<rect x="240.0" y="310.0" width="600.0" height="40.0" rx="0" fill="#3a3a3a" fill-opacity="1.0" stroke="#3a3a3a" stroke-width="1.2"/>
<line x1="240.0" y1="330.0" x2="840.0" y2="330.0" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
<text x="600.0" y="335.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#222" text-anchor="start"></text>
<rect x="262.0" y="190.0" width="8.0" height="190.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<polygon points="262.0,380.0 270.0,380.0 266.0,392.0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="280.0" y="210.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">needle (0.6 mm, floats +/-0.4 mm in Y)</text>
<text x="280.0" y="226.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">pierces at the root = clamp edge</text>
<rect x="780.0" y="190.0" width="8.0" height="190.0" rx="0" fill="#9aa5ad" fill-opacity="0.35" stroke="#222" stroke-width="1.2"/>
<text x="640.0" y="180.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">stops here: the strip line, Ls from the tip (per reel)</text>
<line x1="270.0" y1="300.0" x2="770.0" y2="300.0" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="430.0" y="294.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">needle travels toward the tip relative to the ribbon</text>
<line x1="700.0" y1="440.0" x2="450.0" y2="440.0" stroke="#222" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="450.0" y="460.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start">the shuttle draws the cassette back: ribbon in TENSION</text>
<rect x="800.0" y="310.0" width="40.0" height="40.0" rx="0" fill="#3a3a3a" fill-opacity="0.5" stroke="#d62828" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="795.0" y="420.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#d62828" text-anchor="start">tip stays webbed</text>
<text x="40.0" y="480.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">The tear runs only ahead of the needle, toward the tip; it cannot run back past the pierce.</text>
<text x="40.0" y="494.3" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Round needle tears the neck, 3-15 N per web; an edge (scalpel point / seam-ripper crotch) cuts it, 0.2-3 N.</text>
<circle cx="1090.0" cy="300.0" r="55.0" fill="#3a3a3a" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<circle cx="1090.0" cy="300.0" r="23.0" fill="#c87533" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<circle cx="1200.0" cy="300.0" r="55.0" fill="#3a3a3a" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<circle cx="1200.0" cy="300.0" r="23.0" fill="#c87533" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<circle cx="1310.0" cy="300.0" r="55.0" fill="#3a3a3a" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<circle cx="1310.0" cy="300.0" r="23.0" fill="#c87533" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<rect x="1249.0" y="150.0" width="12.0" height="230.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<polygon points="1249.0,380.0 1261.0,380.0 1255.0,395.0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<rect x="960.0" y="400.0" width="500.0" height="20.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="970.0" y="440.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">needle plate: slot tight in X, long in Y (float)</text>
<line x1="1255.0" y1="250.0" x2="1010.0" y2="132.0" stroke="#666" stroke-width="0.8"/>
<circle cx="1255.0" cy="250.0" r="1.8" fill="#666" fill-opacity="1.0" stroke="#666" stroke-width="1.2"/>
<text x="1010.0" y="130.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">the cone slides down the steep valley into the neck</text>
<text x="940.0" y="470.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">copper edges sit +/-0.48 mm from each seam; seams are within +/-0.15 mm</text>
<text x="940.0" y="486.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">of nominal on a 5P from a centred datum [calc wave2 s2]</text>
<rect x="10.0" y="540.0" width="1480.0" height="340.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="18.0" y="558.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Why this direction (numbers in calc wave2 s2)</text>
<text x="30.0" y="590.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start"></text>
<text x="420.0" y="590.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start">pierce at root, pull to tip (b6)</text>
<text x="860.0" y="590.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#222" text-anchor="start">enter at tip, push to root (a7, a7b, a harp)</text>
<text x="30.0" y="634.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">ribbon between clamp and tool</text>
<text x="420.0" y="634.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">tension</text>
<text x="860.0" y="634.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">compression: a 5P buckles at ~6-56 N over 15-5 mm free</text>
<text x="30.0" y="678.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">what sets the root</text>
<text x="420.0" y="678.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">the pierce, +/-0.05 mm</text>
<text x="860.0" y="678.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">a tear stop: a wedge drives the tear 0.6-2 mm ahead; the clamp stops it</text>
<text x="30.0" y="722.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">where the root can be</text>
<text x="420.0" y="722.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">anywhere the needle reaches</text>
<text x="860.0" y="722.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">at a clamp face</text>
<text x="30.0" y="766.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">the tip</text>
<text x="420.0" y="766.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">can stay webbed for a one-piece slug</text>
<text x="860.0" y="766.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">split first</text>
<text x="30.0" y="810.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">spool line (b8)</text>
<text x="420.0" y="810.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">the belt feed's retraction is the pull</text>
<text x="860.0" y="810.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">needs the clamp closed at the root first</text>
</svg>
