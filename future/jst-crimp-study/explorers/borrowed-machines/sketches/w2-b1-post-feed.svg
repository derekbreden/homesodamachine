<text x="780.0" y="701.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#222" text-anchor="start">shuttle backs off 7-12 mm; a fork drops into the neck behind the box; 20 N pull</text>
<text x="20.0" y="720.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Why: on a fast press a pre-feed arrives 50-90 ms after the punch clears, while fork, foot and crimped</text>
<text x="20.0" y="735.6" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">contact are still on the axis. The conductor sets at 24-85 mN of side push; lay-in loads are 8-330 mN</text>
<text x="20.0" y="751.2" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">(250-2000 mN under a presser foot) [calc wave2 s1]. No sprung fork has a window between them. So the</text>
<text x="20.0" y="766.8" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">parts that touch the conductor ride the ram, and the feed runs on the downstroke before they arrive.</text>
<text x="20.0" y="782.4" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Schematic, not to scale.</text>
