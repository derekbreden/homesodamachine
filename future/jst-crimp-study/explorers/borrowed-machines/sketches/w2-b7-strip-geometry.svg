<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="arrs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcf8"/>
<text x="14.0" y="28.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="start">b7  Three borrowed blade geometries on one conductor, drawn to scale from cited dimensions (x120)</text>
<rect x="10.0" y="44.0" width="485.0" height="560.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="18.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Two 90 deg V-blades, ri = 0.45 mm</text>
<circle cx="252.0" cy="320.0" r="102.0" fill="#3a3a3a" fill-opacity="0.85" stroke="#222" stroke-width="1.2"/>
<circle cx="259.2" cy="320.0" r="43.2" fill="#c87533" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<polygon points="252.0,243.6 328.4,320.0 252.0,396.4 175.6,320.0" fill="none" fill-opacity="1.0" stroke="#d62828" stroke-width="2.5"/>
<text x="30.0" y="540.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">cut reaches ri at 4 points (+0.02 mm to strands, worst)</text>
<text x="30.0" y="556.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">and only ri*sqrt2 at 4 others (0.35 mm of wall left)</text>
<text x="30.0" y="572.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#d62828" text-anchor="start">-&gt; uneven ring; tear wanders; flags or nicks</text>
<text x="30.0" y="90.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">jacket 1.7 mm, bundle 0.72 mm, bundle offset 0.06 mm [facts]</text>
<rect x="505.0" y="44.0" width="485.0" height="560.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="513.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Two die-hole blades, hole 0.94 mm</text>
<circle cx="747.0" cy="320.0" r="102.0" fill="#3a3a3a" fill-opacity="0.85" stroke="#222" stroke-width="1.2"/>
<circle cx="754.2" cy="320.0" r="43.2" fill="#c87533" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<circle cx="747.0" cy="320.0" r="56.4" fill="none" fill-opacity="1.0" stroke="#d62828" stroke-width="2.5"/>
<text x="525.0" y="540.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">even ring, 0.04-0.19 mm, set by the bundle's offset</text>
<text x="525.0" y="556.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">tear-off 1.1-2.9 N; the jacket centres itself</text>
<text x="525.0" y="572.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#2a9d4b" text-anchor="start">-&gt; the static geometry that suits this wire</text>
<text x="525.0" y="90.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">jacket 1.7 mm, bundle 0.72 mm, bundle offset 0.06 mm [facts]</text>
<rect x="1000.0" y="44.0" width="485.0" height="560.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="1008.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">One orbiting blade r = 0.50 mm, conductor 0.10 mm off the axis</text>
<circle cx="1242.0" cy="320.0" r="102.0" fill="#3a3a3a" fill-opacity="0.85" stroke="#222" stroke-width="1.2"/>
<circle cx="1242.0" cy="320.0" r="43.2" fill="#c87533" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<circle cx="1254.0" cy="320.0" r="60.0" fill="none" fill-opacity="1.0" stroke="#d62828" stroke-width="2.5" stroke-dasharray="6,4"/>
<circle cx="1254.0" cy="320.0" r="3.0" fill="#d62828" fill-opacity="1.0" stroke="#d62828" stroke-width="1.2"/>
<text x="1020.0" y="540.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">blade circle centred on the guide axis, not the jacket</text>
<text x="1020.0" y="556.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">+/-0.05 mm centring: -0.01..+0.02 mm worst; +/-0.10: nicks</text>
<text x="1020.0" y="572.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#d62828" text-anchor="start">-&gt; needs centralizers (RotaryStrip) or closing blades (a8b)</text>
<text x="1020.0" y="90.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">jacket 1.7 mm, bundle 0.72 mm, bundle offset 0.06 mm [facts]</text>
<text x="20.0" y="640.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Scale: 120 px per mm. Rigid-jacket geometry; the soft jacket squeezes into V-blades, which makes the V case worse. [calc wave2 s3]</text>
</svg>
