<line x1="1010.0" y1="245.0" x2="1480.0" y2="245.0" stroke="#f4d35e" stroke-width="3"/>
<text x="1015.0" y="238.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#222" text-anchor="start">camera line at wing height</text>
<text x="1245.0" y="480.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">crown R 25-30 mm</text>
<rect x="10.0" y="614.0" width="1480.0" height="370.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="18.0" y="632.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">One T4 end</text>
<text x="25.0" y="648.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">1 feed out S + Ls past the needles (S = 16 mm here);  2 pierce each web;  3 belts retract S: the needles rip to the strip line; the root lands on the clamp face; clamp</text>
<text x="25.0" y="672.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">4 flat blades score the crowns to 50-60 % (or ride a shoe); pads pinch the webbed tip; back off 3 mm: one slug (19-52 N for a 4P) [calc wave3 s8]</text>
<text x="25.0" y="696.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">5 the comb comes in from the tip side and slides back to the clamp face: conductors leave it parallel at the crimp pitch p (2.35-2.80 mm if the punch holder clears)</text>
<text x="25.0" y="720.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">6 present conductor k over the carrier into the waiting contact; steer X by the insulation edge   7 gate: level picture + continuity spool -&gt; k -&gt; crown block</text>
<text x="25.0" y="744.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">8 stroke to the hard stop; the drop plate shears the tab   9 punch lifts; neck fork; 20 N pull   10 draw the ribbon back; pins out; advance two pitches;</text>
<text x="25.0" y="768.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">   look at the new contact alone; fence; step p in Y   11 after four: at p = 2.5 the row is at housing pitch; push an XHP-4 on; 5 N pull-backs</text>
<text x="25.0" y="792.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">12 test through the spool; feed out the loom; the guillotine squares the next end</text>
<text x="25.0" y="816.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start"></text>
<text x="25.0" y="840.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">The carrier and crown take 5.3-9.2 mm behind the strip line, so the comb sits behind that and the split is &gt;= 9.3-15.2 mm [calc wave3 s7].</text>
<text x="25.0" y="864.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Fronts in the housing at 16 mm free length: 4P ~0.05, 5P ~0.09 mm short; J1 needs ~20 mm (0.25 mm). Supply at skip-2: 0.30 of a reel for all T4 [TS s5].</text>
<text x="25.0" y="888.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Reference for 'fixed': the crown block for the contact, anvil, stop and camera fiducials; the work clamp for the ribbon.</text>
</svg>
