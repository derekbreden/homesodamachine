<text x="60.0" y="620.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Per conductor k:  1 poke into A (tip-stop names k; wrong one = red light)  -&gt;  strip + twist ~4 s</text>
<text x="60.0" y="635.6" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">2 poke into B's funnel until strands touch the flap blade (k lights again = at depth)  -&gt;  soft clamp takes it; let go</text>
<text x="60.0" y="651.2" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">3 crimp through the spring link; jaws open; 20 N pull against the flap; continuity through the crimp</text>
<text x="60.0" y="666.8" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">4 lift the crimp out of the open mouth; insert into the lit cavity at C while B feeds, shears and places contact k+1</text>
<text x="60.0" y="682.4" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">~37 attended min/unit vs 46 today (procedure's task library) [calc wave2 s5]. Schematic, not to scale.</text>
