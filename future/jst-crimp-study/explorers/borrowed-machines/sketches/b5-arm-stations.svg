<text x="30.0" y="720.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Each dock is a kinematic seat (cones + vee) with &gt;= 5 mm lead-in and a magnet;</text>
<text x="30.0" y="734.3" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">a hall sensor says 'seated'. Every dock is approached from above, the same way.</text>
<rect x="780.0" y="44.0" width="460.0" height="740.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="788.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Two tiers of borrowed arm</text>
<text x="795.0" y="80.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Cheap tier: SO-101 (LeRobot)</text>
<text x="795.0" y="99.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  follower kit $184.99; Pro servo kit $360;</text>
<text x="795.0" y="118.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  assembled kit $269.99-459.99 (Prime rows)</text>
<text x="795.0" y="137.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  STS3215: 0.87 deg backlash, 0.17 deg repeat</text>
<text x="795.0" y="156.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  same-direction docking: ~1.2 mm RSS, 2.2 worst</text>
<text x="795.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  -&gt; carries cassettes between docks; flips</text>
<text x="795.0" y="194.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start"></text>
<text x="795.0" y="213.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Precise tier: Dobot MG400, $2,890-3,495</text>
<text x="795.0" y="232.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  +/-0.05 mm, 500-750 g payload, 440 mm</text>
<text x="795.0" y="251.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  + terminal-supply's post head:</text>
<text x="795.0" y="270.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  picks a loose contact, measures it on the post,</text>
<text x="795.0" y="289.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  sets it in an open die, then presents each</text>
<text x="795.0" y="308.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  conductor (Kurabo's pattern)</text>
<text x="795.0" y="327.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start"></text>
<text x="795.0" y="346.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Carrying costs the person least; every</text>
<text x="795.0" y="365.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">cheap-tier reason has another route (b4b,</text>
<text x="795.0" y="384.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">a slide magazine, the spool). Where an arm</text>
<text x="795.0" y="403.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">could earn its place: loading ribbon ends,</text>
<text x="795.0" y="422.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">taught by imitation (&gt;= 50 demos per task).</text>
<text x="795.0" y="441.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start"></text>
<text x="795.0" y="460.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">[calc cycle_and_arm.out.txt]</text>
