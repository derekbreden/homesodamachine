<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="arrs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcf8"/>
<text x="14.0" y="28.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="start">b4b  Two diode heads at the station: both faces scored and slit in the pose the crimp uses</text>
<rect x="10.0" y="44.0" width="1280.0" height="620.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="18.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Side section along the wire (schematic, not to scale)</text>
<rect x="420.0" y="110.0" width="560.0" height="480.0" rx="0" fill="none" fill-opacity="1.0" stroke="#222" stroke-width="2"/>
<text x="430.0" y="130.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">light-tight box, interlocked lid, fan ducted outdoors</text>
<rect x="410.0" y="330.0" width="20.0" height="50.0" rx="0" fill="#444" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="380.0" y="440.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">brush slot in the box wall</text>
<rect x="440.0" y="380.0" width="520.0" height="16.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<rect x="700.0" y="380.0" width="60.0" height="16.0" rx="0" fill="#fff" fill-opacity="1.0" stroke="#222" stroke-width="0.8"/>
<text x="600.0" y="420.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">steel bed plate; slot under the ribbon</text>
<rect x="80.0" y="330.0" width="260.0" height="30.0" rx="0" fill="#8fb8de" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<rect x="80.0" y="372.0" width="260.0" height="30.0" rx="0" fill="#8fb8de" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="90.0" y="320.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">cassette on b1's shuttle (or b8/b8b's work clamp)</text>
<rect x="60.0" y="360.0" width="760.0" height="12.0" rx="0" fill="#3a3a3a" fill-opacity="1.0" stroke="#3a3a3a" stroke-width="1.2"/>
<line x1="120.0" y1="450.0" x2="300.0" y2="450.0" stroke="#222" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arrs)"/>
<text x="120.0" y="470.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">shuttle X sweeps the slits; Y sweeps the scores</text>
<rect x="700.0" y="150.0" width="60.0" height="90.0" rx="0" fill="#d9d9d9" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="770.0" y="180.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">top head: 450 nm module, 10 W optical</text>
<text x="770.0" y="196.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">(LASER TREE, $137.17, Prime), air assist</text>
<polygon points="720.0,240.0 740.0,240.0 731.0,358.0" fill="#60a5fa" fill-opacity="0.5" stroke="none" stroke-width="1.2"/>
<rect x="700.0" y="480.0" width="60.0" height="90.0" rx="0" fill="#d9d9d9" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="770.0" y="520.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">bottom head looking up through the slot</text>
<text x="770.0" y="536.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">(its window faces falling ash)</text>
<polygon points="720.0,480.0 740.0,480.0 731.0,374.0" fill="#60a5fa" fill-opacity="0.5" stroke="none" stroke-width="1.2"/>
<rect x="800.0" y="336.0" width="30.0" height="20.0" rx="0" fill="#8fb8de" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<rect x="800.0" y="376.0" width="30.0" height="20.0" rx="0" fill="#8fb8de" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<line x1="815.0" y1="336.0" x2="860.0" y2="292.0" stroke="#666" stroke-width="0.8"/>
<circle cx="815.0" cy="336.0" r="1.8" fill="#666" fill-opacity="1.0" stroke="#666" stroke-width="1.2"/>
<text x="860.0" y="290.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">TPU pads pinch the webbed tip; shuttle backs off 3 mm</text>
<rect x="840.0" y="440.0" width="60.0" height="40.0" rx="0" fill="none" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="840.0" y="500.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">slug cup</text>
<text x="30.0" y="620.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Order as b4: score both faces at the strip line (~60-70 % of the wall), then slit each web from the clamp edge</text>
<text x="30.0" y="635.6" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">to the score line from both sides, then pinch and pull the whole tip. No dock, no flip, no module swap on the H2C;</text>
<text x="30.0" y="651.2" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">a redo is re-scored in place, in the crimp's own coordinates.</text>
</svg>
