<rect x="120.0" y="640.0" width="710.0" height="34.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="130.0" y="662.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">press bed (two channels on pins)</text>
<rect x="330.0" y="150.0" width="60.0" height="40.0" rx="0" fill="#d9d9d9" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<rect x="560.0" y="150.0" width="60.0" height="40.0" rx="0" fill="#d9d9d9" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="565.0" y="205.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">UCP204 pillow blocks</text>
<line x1="260.0" y1="172.0" x2="880.0" y2="172.0" stroke="#222" stroke-width="5"/>
<text x="620.0" y="168.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">20 mm crankshaft</text>
<circle cx="455.0" cy="205.0" r="46.0" fill="#9aa5ad" fill-opacity="0.6" stroke="#222" stroke-width="1.2"/>
<circle cx="455.0" cy="245.0" r="7.0" fill="#222" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="505.0" y="250.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">crank disc: throw = half the applicator's stroke</text>
<text x="505.0" y="264.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">(15 mm for 30 mm, 20 mm for 40 mm); shown at BDC</text>
<rect x="446.0" y="245.0" width="18.0" height="60.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<polygon points="436.0,305.0 474.0,305.0 464.0,317.0 446.0,317.0" fill="#2a9d4b" fill-opacity="0.6" stroke="#222" stroke-width="1.2"/>
