<rect x="446.0" y="333.0" width="18.0" height="40.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<line x1="474.0" y1="318.0" x2="520.0" y2="314.0" stroke="#666" stroke-width="0.8"/>
<circle cx="474.0" cy="318.0" r="1.8" fill="#666" fill-opacity="1.0" stroke="#666" stroke-width="1.2"/>
<text x="520.0" y="312.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">disc-spring stack: 2 x DIN 2093 A35.5, ~4 kN preload,</text>
<text x="520.0" y="326.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">~0.3 mm to ~5.2 kN; microswitch = 'stopped at force' [TS s7]</text>
<rect x="466.0" y="345.0" width="12.0" height="22.0" rx="0" fill="#d62828" fill-opacity="0.7" stroke="#d62828" stroke-width="1.2"/>
<line x1="478.0" y1="356.0" x2="520.0" y2="356.0" stroke="#666" stroke-width="0.8"/>
<circle cx="478.0" cy="356.0" r="1.8" fill="#666" fill-opacity="1.0" stroke="#666" stroke-width="1.2"/>
<text x="520.0" y="360.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">BF350 gauges -&gt; HX711: ~19 samples in the last 0.2 mm at 10 s</text>
<rect x="430.0" y="373.0" width="50.0" height="36.0" rx="0" fill="#c9a45c" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<line x1="480.0" y1="391.0" x2="520.0" y2="396.0" stroke="#666" stroke-width="0.8"/>
<circle cx="480.0" cy="391.0" r="1.8" fill="#666" fill-opacity="1.0" stroke="#666" stroke-width="1.2"/>
<text x="520.0" y="400.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">ram in a bronze bushing</text>
<rect x="443.0" y="409.0" width="24.0" height="60.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<rect x="415.0" y="469.0" width="80.0" height="14.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="300.0" y="481.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">T-slot block</text>
<rect x="360.0" y="483.0" width="190.0" height="140.0" rx="0" fill="#d9d9d9" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="370.0" y="512.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">OTP side-feed XH</text>
<text x="370.0" y="527.6" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">applicator (bought)</text>
<text x="370.0" y="543.2" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">pre-feed: a contact</text>
<text x="370.0" y="558.8" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">waits on the anvil</text>
<polygon points="350.0,640.0 560.0,640.0 560.0,623.0 350.0,632.0" fill="#9aa5ad" fill-opacity="0.7" stroke="#222" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="540.0" y1="630.0" x2="575.0" y2="614.0" stroke="#666" stroke-width="0.8"/>
<circle cx="540.0" cy="630.0" r="1.8" fill="#666" fill-opacity="1.0" stroke="#666" stroke-width="1.2"/>
<text x="575.0" y="612.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">optional stepper wedge: crimp-height sweep [TS wave2 s8]</text>
<line x1="360.0" y1="610.0" x2="170.0" y2="610.0" stroke="#c9a45c" stroke-width="3"/>
<text x="175.0" y="604.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">carrier strip in</text>
<line x1="600.0" y1="527.0" x2="555.0" y2="560.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="575.0" y="500.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">puff (24 V 5/2 valve) clears a crushed</text>
<text x="575.0" y="514.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">contact on a reject turn, 220-266 deg</text>
<rect x="640.0" y="540.0" width="44.0" height="30.0" rx="0" fill="none" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="692.0" y="560.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#222" text-anchor="start">reject cup</text>
<rect x="880.0" y="150.0" width="45.0" height="44.0" rx="0" fill="#d9d9d9" fill-opacity="1.0" stroke="#222" stroke-width="1.2"/>
<text x="470.0" y="96.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">NEMA 23 + DM542T (on hand) + 10:1 planetary (Prime, 10 N*m permissible)</text>
<text x="170.0" y="720.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Stage 0, the jack test: the bottle jack strokes the applicator by hand</text>
<text x="170.0" y="734.3" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">against a hard-stop collar; measures feed timing, envelope and geometry.</text>
<path d="M 505,490 L 505,652 L 165,652 L 165,160 L 350,160 L 440,200 L 452,300" fill="none" fill-opacity="1.0" stroke="#d62828" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arr)"/>
<text x="170.0" y="790.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#d62828" text-anchor="start">force loop: crank -&gt; rod -&gt; stack -&gt; ram -&gt; applicator -&gt; bed -&gt; columns -&gt; top beam -&gt; bearings</text>
<text x="170.0" y="810.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">bottom dead centre comes from crank geometry; rod length set once to the applicator's shut height</text>
<rect x="950.0" y="44.0" width="490.0" height="820.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
<text x="958.0" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Sequence and numbers</text>
<text x="965.0" y="80.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">One conductor (0 deg = top dead centre):</text>
<text x="965.0" y="99.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  1  look at the contact ALONE on the anvil</text>
<text x="965.0" y="118.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  2  fork lays conductor in; foot seats it</text>
<text x="965.0" y="137.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  3  gate: picture + far-end continuity</text>
<text x="965.0" y="156.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  4  crank through BDC, force logged</text>
<text x="965.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  5  dwell 220 -&gt; 266-285 deg: foot and fork off,</text>
<text x="965.0" y="194.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">     withdraw, neck fork, 20 N pull, picture</text>
<text x="965.0" y="213.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  6  finish the turn: feed on an empty anvil</text>
<text x="965.0" y="232.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  reject turn: band aside, crimp empty, puff</text>
<text x="965.0" y="251.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start"></text>
<text x="965.0" y="270.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Torque at the crank [calc presses s1]:</text>
<text x="965.0" y="289.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  3.8 N*m through a 3 kN design crimp</text>
<text x="965.0" y="308.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  5.4 N*m mid-stroke at 300 N of springs</text>
<text x="965.0" y="327.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Drive held to the gearbox's 10 N*m:</text>
<text x="965.0" y="346.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  4.6 kN at 0.1 mm above BDC [calc wave3 s4]</text>
<text x="965.0" y="365.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Dwell: 1.3-1.8 s at a 10 s turn, or stopped</text>
<text x="965.0" y="384.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  [calc wave3 s1, s5]</text>
<text x="965.0" y="403.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">HX711 at 80 Hz, last 0.2 mm: 19 samples at</text>
<text x="965.0" y="422.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  10 s, 39 at 20 s, 78 at 40 s [calc wave3 s3]</text>
<text x="965.0" y="441.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start"></text>
<text x="965.0" y="460.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Frame: the 12 t press barely notices 3 kN.</text>
<text x="965.0" y="479.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Laser-cut O-frame alternative: 13-39 kN/mm,</text>
<text x="965.0" y="498.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  +/-0.024-0.008 mm scatter [calc presses s2].</text>
<text x="965.0" y="517.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">3 t arbor press (310 mm opening) is the</text>
<text x="965.0" y="536.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#222" text-anchor="start">  Prime frame that fits an applicator.</text>
<rect x="20.0" y="880.0" width="14.0" height="12.0" rx="0" fill="#8fb8de" fill-opacity="1.0" stroke="#222" stroke-width="0.8"/>
<text x="40.0" y="890.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">printed</text>
<rect x="170.0" y="880.0" width="14.0" height="12.0" rx="0" fill="#d9d9d9" fill-opacity="1.0" stroke="#222" stroke-width="0.8"/>
<text x="190.0" y="890.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">bought / borrowed</text>
<rect x="320.0" y="880.0" width="14.0" height="12.0" rx="0" fill="#9aa5ad" fill-opacity="1.0" stroke="#222" stroke-width="0.8"/>
<text x="340.0" y="890.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">steel</text>
<rect x="470.0" y="880.0" width="14.0" height="12.0" rx="0" fill="#3a3a3a" fill-opacity="1.0" stroke="#222" stroke-width="0.8"/>
<text x="490.0" y="890.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">ribbon / conductor</text>
<rect x="620.0" y="880.0" width="14.0" height="12.0" rx="0" fill="#c87533" fill-opacity="1.0" stroke="#222" stroke-width="0.8"/>
<text x="640.0" y="890.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">stripped strands</text>
<rect x="770.0" y="880.0" width="14.0" height="12.0" rx="0" fill="#c9a45c" fill-opacity="1.0" stroke="#222" stroke-width="0.8"/>
<text x="790.0" y="890.0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#222" text-anchor="start">XH contact</text>
