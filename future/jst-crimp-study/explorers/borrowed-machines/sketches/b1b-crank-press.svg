<rect width="100%" height="100%" fill="#fcfcf8"/>
<text x="14.0" y="28.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="start">b1b  The OTP applicator in a slow crank built into the idle 12-ton shop press</text>
<rect x="10.0" y="44.0" width="930.0" height="820.0" rx="0" fill="none" fill-opacity="1.0" stroke="#bbb" stroke-width="1"/>
