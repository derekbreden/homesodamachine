      proposes: '<p>The gun in its printed shell does not just <i>stop</i> between trials: it <b>goes home</b>. The dock is a cradle with three kinematic seats (three lugs on the shell, three seats, a magnet to pull them together), a contact switch that closes only when the shell is seated, and a load cell under each seat. Docking does four jobs at once.</p>' +
        '<ul><li><b>It re-anchors the shell.</b> Missed steps, backlash, cable and bungee hysteresis, drift in whatever carries the gun: all of it is discarded when the shell drops into the seats, so every trial starts from the same shell pose, not a remembered coordinate. It does not re-anchor the trial: the pose that decides a trial is dot to corner on this tube, and the chain from the dock to the corner (bench clamp, positioner scale over the travel, seat depth, the dot in the shell, the camera) has links the dock does not touch. The corner is found by a probe on the tube, every trial (trials-03).</li>' +

        '<li><b>The gun body sits in the lift column.</b> Slide the dock closer (or make the tube lift higher): the shell\'s body enters the column above the tube and a LIMIT badge appears. Assumption behind it: the tube lifts straight up. Repair drawn: the dock stands well outside the column. What it costs: a longer positioner travel every cycle (about 270 mm here), and it only works if the positioner has that reach; in a table-with-side-opening arrangement the tube leaves sideways and the dock can be close.</li>' +
        '<li><b>The umbilical drags differently every time.</b> Sideways pull changes with the path the cable took. Repair: the weigh-in. Drag the sideways pull slider up; the cell shares move while the total does not (a single scale cannot see it, three cells can). Left standing: a threshold that separates harmless from harmful is <b>[unknown]</b>; the 10 g used is a placeholder.</li>' +

      unresolved: '<ul><li>The X1 Pro\'s mass, centre of mass and how it sits on lugs on a printed shell are <b>[unknown]</b>; the 1.5 kg here is a placeholder.</li>' +

        '<li>Dock position, cradle height, seat triangle, tube lift and the 1.5 kg mass are <b>[illustrative]</b>.</li>' +

    }

  // ---------------------------------------------------------------- state and geometry (elevation coordinates, mm)

  const lerp = (a, b, t) => a + (b - a) * t, ease = t => t * t * (3 - 2 * t);
  function pose() { const t = ease(Math.min(1, tw)); return { N: { x: lerp(from.N.x, to.N.x, t), z: lerp(from.N.z, to.N.z, t) }, lift: lerp(from.lift, to.lift, t), spin: to.spin, tube: to.tube, seated: t > 0.98 ? to.seated : (to.seated && from.seated) } }

  // ---------------------------------------------------------------- polygons and collision (elevation)
  const ZONES = [[0, 23, 2.2, 5], [23, 54, 8.5, 8.5], [54, 100, 5.5, 5.5], [100, 118, 12, 12], [118, 253, 17, 17]];
  function gunPolys(N) {

    for (const poly of [a, b]) for (let i = 0; i < poly.length; i++) {

  const rectP = (x0, z0, x1, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];

  // the dock: a ramp plate parallel to the shell's axis on its underside (-n) with three seat pads; three legs and cells below

  const capEl = h('div', { class: 'dk-caption' });
  const verdict = h('div', { class: 'dk-verdict' });
  const tabEl = h('table', { class: 'dk-tab' });

  const planCard = h('div', { class: 'dk-card' }, h('h3', {}, h('span', { text: 'Plan (from above)' }), h('em', { text: 'illustrative dimensions' })), plan);
  const elevCard = h('div', { class: 'dk-card' }, h('h3', {}, h('span', { text: 'Elevation (from the side)' }), h('em', { text: 'tube height, recess, rim from the repo' })), elev);
  const tabCard = h('div', { class: 'dk-card' }, h('h3', {}, h('span', { text: 'What resets, and where' }), h('em', { text: 'highlighted = this step' })), tabEl);

    h('div', { class: 'dk-note', text: 'Each dot is the final dot position of one trial. Two-sided approach splits into two clusters; one-sided is one offset that can be calibrated.' }));
  app.stageEl.appendChild(h('div', {}, h('div', { class: 'dk-steps-wrap' }, stepsEl, capEl), h('div', { class: 'dk-grid' }, planCard, elevCard), h('div', { class: 'dk-row2' }, tabCard, cellCard, hystCard)));

  function drawElev(p, polys, hit, col) {
    elev.textContent = '';

  // ---------------------------------------------------------------- cells
  const SEATS = [[-60, -40], [60, -40], [0, 70]];
  function reactions(pull) {
    const g = 9.81, m = ST.mass, cog = [0, 5], h = 100;
    const fx = pull * 0.6, fy = pull * 0.8;   // pull direction: mostly sideways/back (illustrative)
    const W = m * g, Mx = W * cog[1] / 1000 - fy * h / 1000, My = -W * cog[0] / 1000 + fx * h / 1000;
    // solve sum R = W; sum R*y = Mx; sum R*(-x) = My  (3x3)
    const A = [[1, 1, 1], SEATS.map(s => s[1] / 1000), SEATS.map(s => -s[0] / 1000)], b = [W, Mx, My];
    return solve3(A, b);
  }
  function solve3(A, b) {
    const M = A.map((r, i) => r.concat([b[i]]));
    for (let i = 0; i < 3; i++) { let p = i; for (let r = i + 1; r < 3; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r; [M[i], M[p]] = [M[p], M[i]]; for (let r = i + 1; r < 3; r++) { const f = M[r][i] / M[i][i]; for (let c = i; c < 4; c++) M[r][c] -= f * M[i][c]; } }
    const x = [0, 0, 0]; for (let i = 2; i >= 0; i--) { let s = M[i][3]; for (let c = i + 1; c < 3; c++) s -= M[i][c] * x[c]; x[i] = s / M[i][i]; } return x;
  }
  const TOL_G = 10;

    const seated = STEPS[ST.step].name === 'Dock + weigh' || ST.step === 0 || ST.step >= 7 ? true : false;
    cells.append(S('text', { x: 4, y: 12, class: 'b', text: 'baseline vs now (g per cell)' }));
    const labels = ['front left', 'front right', 'rear'];
    d.forEach((dv, i) => {
      const y = 34 + i * 44;
      const scale = 0.4;  // px per g
      cells.append(S('text', { x: 4, y: y + 4, class: 'sm', text: labels[i] }), line(120, y - 12, 120, y + 14, { stroke: '#3a4658' }));
      cells.append(S('rect', { x: 120, y: y - 6, width: Math.min(120, Math.abs(dv) * scale) * (dv >= 0 ? 1 : 1), height: 12, fill: dv >= 0 ? '#22c55e' : '#f59e0b', transform: dv >= 0 ? '' : 'translate(' + (-Math.min(112, Math.abs(dv) * scale)) + ',0)' }));
      cells.append(S('text', { x: dv >= 0 ? 124 + Math.min(112, Math.abs(dv) * scale) : 116 - Math.min(112, Math.abs(dv) * scale), y: y + 22, 'text-anchor': dv >= 0 ? 'start' : 'end', class: 'sm', text: (dv >= 0 ? '+' : '−') + Math.abs(dv).toFixed(0) + ' g' }));
      cells.append(S('text', { x: 4, y: y + 16, class: 'sm', text: base[i].toFixed(0) + ' → ' + now[i].toFixed(0) }));
      const tol = TOL_G * scale; cells.append(S('rect', { x: 120 - tol, y: y - 10, width: tol * 2, height: 20, fill: 'none', stroke: '#64748b', 'stroke-dasharray': '2 2' }));
    });
    cells.append(S('text', { x: 4, y: 172, class: 'sm', text: 'total ' + now.reduce((a, v) => a + v, 0).toFixed(0) + ' g (unchanged by sideways pull); dashed box = ±' + TOL_G + ' g placeholder tolerance' }));
    const bad = d.some(v => Math.abs(v) > TOL_G);
    verdict.innerHTML = STEPS[ST.step].hot.indexOf('cable') >= 0 || ST.step === 6 ? (bad ? '<span class="dk-bad">reset check FAILED</span>: umbilical is dragging (' + d.map(v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(0)).join(', ') + ' g). Re-exercise and weigh again.' : '<span class="dk-ok">reset check passed</span>: cable drag within tolerance of the baseline.') : '<span class="dk-note">The weigh-in happens whenever the shell is docked (steps 0, 6, 7, 8).</span>';

  }

  // ---------------------------------------------------------------- hysteresis panel
  function drawHyst() {
    hyst.textContent = '';
    const x0 = 20, x1 = 246, Xh = v => (x0 + x1) / 2 + v / 0.8 * ((x1 - x0) / 2), y = 92;
    hyst.append(S('text', { x: 4, y: 12, class: 'b', text: ST.oneSide ? 'one-sided final approach' : 'approach from either side' }));
    hyst.append(line(x0, y, x1, y, { stroke: '#3a4658' }), line(Xh(0), y - 40, Xh(0), y + 8, { stroke: '#14b8a6', 'stroke-dasharray': '3 3' }), S('text', { x: Xh(0), y: y - 44, 'text-anchor': 'middle', class: 'sm teal', text: 'seam (target)' }));
    for (let v = -0.8; v <= 0.81; v += 0.2) hyst.append(line(Xh(v), y, Xh(v), y + 4, { stroke: '#64748b' }), S('text', { x: Xh(v), y: y + 14, 'text-anchor': 'middle', class: 'sm', text: v.toFixed(1) }));
    let s = 99; const u = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296, gauss = () => Math.sqrt(-2 * Math.log(1 - u())) * Math.cos(2 * Math.PI * u());

      const dir = ST.oneSide ? 1 : (u() < 0.5 ? 1 : -1);
      const v = dir * ST.hyst + gauss() * 0.03; xs.push(v);
      hyst.append(S('circle', { cx: Xh(v), cy: y - 10 - (i % 4) * 8, r: 3, fill: dir > 0 ? '#f472b6' : '#60a5fa', opacity: 0.9 }));
    }
    const mean = xs.reduce((a, v) => a + v, 0) / xs.length, sd = Math.sqrt(xs.reduce((a, v) => a + (v - mean) ** 2, 0) / xs.length);
    hyst.append(S('text', { x: 4, y: 128, class: 'sm', text: 'mean ' + (mean >= 0 ? '+' : '−') + Math.abs(mean).toFixed(2) + ' mm, spread (sd) ' + sd.toFixed(2) + ' mm' }),

      S('text', { x: 4, y: 156, class: 'sm', text: 'pink: came from +side · blue: from −side' }), S('text', { x: 4, y: 169, class: 'sm', text: 'support friction of ±' + ST.hyst.toFixed(2) + ' mm is a placeholder' }));
    return { mean: mean, sd: sd };
  }

  lay.toggle({ id: 'coupon', label: 'A coupon under the docked dot', value: false, kind: 'scene', visual: 'coupon in both views', help: 'A short stub of tube and plate at the real recess on a post, so the dot probe can be run on a corner whose place is known. Adopted from datum-15; the same corner on a coupon puck on the rotator (trials-22) also covers the bench-to-rotator clamp and the positioner\'s scale.', onChange: v => { ST.coupon = v; redraw(); } });
  const wg = app.ui.group('The weigh-in', { help: 'Sideways umbilical pull, seen as a change in how the shell\'s weight is shared by three cells.' });
  wg.slider({ id: 'pull', label: 'Umbilical sideways pull at the shell', min: 0, max: 2, step: 0.05, value: 0.1, unit: 'N', kind: 'scene', visual: 'cell bars', help: 'Made-up value; the real pull per pose is unknown. 1 N at 100 mm above the seats moves each cell by tens of grams.', onChange: v => { ST.pull = v; redraw(); } });
  wg.button({ id: 'reex', label: 'Re-exercise the umbilical (wiggle), then weigh again', kind: 'state', help: 'Puts the pull back near the baseline.', onClick: () => { app.ui.set('pull', 0.1); app.toast('Umbilical re-exercised; weighed again against the baseline'); } });
  const hg = app.ui.group('Approach and friction', { help: 'What the last panel shows.' });
  hg.slider({ id: 'hyst', label: 'Support friction (± landing offset)', min: 0, max: 0.6, step: 0.01, value: 0.25, unit: 'mm', kind: 'scene', visual: 'landing panel', help: 'Placeholder for how far friction in a compliant support shifts the dot depending on the side it came from.', onChange: v => { ST.hyst = v; redraw(); } });
  hg.toggle({ id: 'oneSide', label: 'Always approach from the same side', value: true, kind: 'state', visual: 'landing panel', onChange: v => { ST.oneSide = v; redraw(); } });

  app.io.manual(['The tube swap']);
  goto(0);
})();
</script>
