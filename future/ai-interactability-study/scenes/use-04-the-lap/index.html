<script type="application/json" id="scene-meta">
{
  "id": "use-04-the-lap",
  "title": "The lap: what changes, how fast",
  "by": "use",

  "status": "developed",
  "summary": "One turn of the tube seen from the gun's fixed station: where the tacks, the bead start and the 20-degree overlap sit, how the runout the rig already accepts moves the seam under the dot, and how slowly. Pick who or what corrects it (nothing, a hand, a replayed dry-lap map, a mechanical follower) and read what is left. A second panel puts every disturbance and every corrector on one time axis.",
  "tags": ["lens", "lap", "runout", "timescale", "feed-forward", "follower"],
  "branchOf": [],
  "combines": [],

<script>
(function () {
  const app = WK.app({
    stage: 'custom', workstation: false, gun: false, open: ['proposes'],
    sections: {
      proposes:
        '<p><b>Left:</b> the seam as a dial, turning under a fixed station (the gun’s dot, at the right). Eight tack marks in the opposite-side order, the first tack at 0, the bead start, and the 20 degrees of overlap past it [repo]. The seam circle is drawn eccentric by the runout you set, exaggerated so it can be seen. <b>Right:</b> the dot-versus-seam offsets over one lap and 20 degrees, before and after the corrector you pick. <b>Bottom:</b> one time axis for every disturbance and every corrector, with the lap period marked.</p>' +
        '<p>The point: the runout the rig already accepts (0.25 mm radial, 0.30 mm face TIR [repo]) is a <i>once-per-lap</i> change. Its rate is a few hundredths of a millimetre per second at most, so the thing that corrects it can be slow and weak; resolution and backlash matter, speed does not. Fast disturbances (a hand’s tremor, the head’s vibration motor, the beam wobble) live in a different band and want a different answer: a rest or a seat, not a servo.</p>',
      carries:
        '<p>Not a support scene. The corrector lanes of the time axis say who could own each band: a hand by eye, a camera-and-software loop, a hand-turned micrometer, a screw or a printed shim set per tube, a locating seat per handover, a replayed dry-lap map per lap. Which of those is real depends on the arrangement scenes.</p>',
      software:
        '<p>What software adds here is a <b>clock in degrees</b> (the rotator already reports it [repo]) and a <b>map</b>: the dry lap records offset against angle; the weld lap replays a correction keyed to the same angle. That needs one slow axis (radial at the very least) and a dry lap that resembles the weld. The scene models the replay as perfect except for the resolution you set; a real one would inherit the camera’s error and any change between the dry lap and the weld.</p>',
      tried:
        '<ul>' +
        '<li><b>Does a follower need to be fast?</b> No: at 5 to 15 mm/s the peak slew of a once-per-lap 0.25 mm radial runout is 0.010 to 0.030 mm/s (<code>calc/lap_rates.mjs</code>). A correction that updates about once a second is enough for 0.02 mm. <i>Leaves:</i> real runout also has an out-of-round part at twice the lap frequency and tack-induced distortion, neither modelled.</li>' +
        '<li><b>Feed-forward fails if the weld lap differs from the dry lap.</b> A weld adds heat and the tube may move [assumed]; try the residual slider: any change between the maps shows as an error you would not see until after the weld. <i>Leaves:</i> how large that change is: unknown.</li>' +
        '<li><b>Vertical (face) runout</b> needs its own axis. Correcting radial only leaves the face runout untouched; the axes toggle shows it. The plate face TIR only exists after the plate is tacked.</li>' +
        '<li><b>A hand cannot do the fast band and the slow band at once</b> without help. The hand mode shows the residual tremor as a band, not as a trace, because at these speeds it changes many times per degree of rotation.</li>' +
        '</ul>',
      unresolved:
        '<ul>' +
        '<li>Real runout shape and size for a tube on this rotator: only the acceptance limits are known [repo].</li>' +
        '<li>Hand tremor amplitude, hand tracking ability and follower error are illustrative sliders, not measurements.</li>' +
        '<li>Whether the beam wobble (2 mm swing [repo]) makes a 0.1 mm dot error irrelevant to the melt: nobody knows; the window sliders let you set your own.</li>' +
        '<li>Question for Derek: how many laps of dry run are acceptable per weld? The replay idea assumes one is cheap.</li>' +
        '</ul>',
      assumptions:
        '<ul>' +
        '<li>Circumference 388.61 mm, bead speed 5 to 15 mm/s, 20 degrees of overlap, first tack at 0, eight tacks in opposite-side order: [repo]. Radial 0.25 mm and face 0.30 mm TIR limits: [repo].</li>' +
        '<li>Runout is a pure once-per-lap cosine in this scene. Its phases are arbitrary.</li>' +
        '<li>Illustrative: tremor amplitude, hand tracking percentage, correction resolution, follower error, the offset window, exaggeration, and every band on the time axis except the lap period and the recipe’s 80 Hz wobble [repo].</li>' +
        '<li>Numbers behind the readouts: <code>explorers/use/calc/lap_rates.mjs</code>.</li>' +
        '</ul>',
    },
    links: [{ label: 'Calculations (lap rates)', href: '../../explorers/use/calc/' }],
  });
  const st = app.stageEl, NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, ...kids) => WK.svg(tag, attrs, ...kids.filter(Boolean));
  const svg = el('svg', { class: 'use-lap', viewBox: '0 0 1120 760', preserveAspectRatio: 'xMinYMin meet', role: 'img', 'aria-label': 'The lap' });
  const read = WK.h('div', { class: 'use-read' });
  st.appendChild(svg); st.appendChild(read);

  const RI = WK.INNER_RADIUS, C0 = 2 * Math.PI * RI, OVER = 20, DEG = Math.PI / 180;
  const S = { mode: 'fixed', speed: 8, radTIR: 0.25, faceTIR: 0.30, hand: 50, tremor: 0.08, res: 0.02, follow: 0.03, axes: 1, exag: 60, ang: 0, play: false, laser: 'dry', window: 0.25, change: 0.0, tacks: true, rate: 5 };
  const TACK_ORDER = [0, 180, 90, 270, 45, 225, 135, 315];
  const phiR = 0.6, phiF = 2.0;
  const raw = th => ({ r: (S.radTIR / 2) * Math.cos(th * DEG - phiR), z: (S.faceTIR / 2) * Math.cos(th * DEG - phiF) });
  const quant = (v, q) => (q > 0 ? Math.round(v / q) * q : v);
  function resid(th) {
    const a = raw(th);
    if (S.mode === 'fixed') return { r: a.r, z: a.z, band: 0 };
    if (S.mode === 'hand') { const g = S.hand / 100; return { r: a.r * (1 - g), z: a.z * (1 - g), band: S.tremor }; }
    if (S.mode === 'feedforward') {   // the dry-lap map replayed; the weld lap differs from the dry lap by `change` (mm, once per lap, other phase)
      const dry = raw(th), ch = S.change * Math.cos(th * DEG - 0.2);
      const corrR = quant(dry.r, S.res), corrZ = S.axes === 2 ? quant(dry.z, S.res) : 0;
      return { r: a.r - corrR + ch, z: a.z - corrZ, band: 0 };
    }
    return { r: S.follow * Math.sin(3 * th * DEG + 1) , z: S.axes === 2 ? S.follow * Math.sin(2 * th * DEG + 0.5) : a.z, band: 0 };
  }
  const T = () => C0 / S.speed;

  // ------------------------------------------------------------------ dial
  const CX = 205, CY = 205, R0 = 132;
  function dial(g) {
    const th = S.ang, ex = S.exag;
    const rot = a => (a - th) * DEG;              // tube angle a is under the station when a === th; station at +x (right)
    // seam circle, eccentric by the exaggerated radial runout
    const pts = [];
    for (let a = 0; a <= 360; a += 3) { const rr = R0 + raw(a).r * ex; const an = rot(a); pts.push((CX + rr * Math.cos(an)).toFixed(1) + ',' + (CY - rr * Math.sin(an)).toFixed(1)); }
    g.appendChild(el('polyline', { points: pts.join(' '), fill: 'none', stroke: '#c8d0da', 'stroke-width': 2 }));
    g.appendChild(el('circle', { cx: CX, cy: CY, r: R0 + 22, fill: 'none', stroke: '#2a3341', 'stroke-dasharray': '3 4' }));
    g.appendChild(el('circle', { cx: CX, cy: CY, r: 2.5, fill: '#6b7a90' }));
    // degree ticks on the tube (turn with it)
    for (let a = 0; a < 360; a += 30) { const an = rot(a), r1 = R0 + 8 + raw(a).r * ex, r2 = R0 + 18 + raw(a).r * ex; g.appendChild(el('line', { x1: CX + r1 * Math.cos(an), y1: CY - r1 * Math.sin(an), x2: CX + r2 * Math.cos(an), y2: CY - r2 * Math.sin(an), stroke: '#6b7a90' })); if (a % 90 === 0) g.appendChild(el('text', { x: CX + (R0 + 33 + raw(a).r * ex) * Math.cos(an), y: CY - (R0 + 33 + raw(a).r * ex) * Math.sin(an) + 3, 'text-anchor': 'middle', class: 'lbl' }, document.createTextNode(a + '°'))); }
    // bead laid so far (weld) from 0 up to th (clamped to 380)
    if (S.laser === 'weld') {
      const end = Math.min(th, 360 + OVER), p2 = [];
      for (let a = 0; a <= end; a += 2) { const rr = R0 + raw(a % 360).r * ex, an = rot(a); p2.push((CX + rr * Math.cos(an)).toFixed(1) + ',' + (CY - rr * Math.sin(an)).toFixed(1)); }
      if (p2.length > 1) g.appendChild(el('polyline', { points: p2.join(' '), fill: 'none', stroke: '#e6b422', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: 0.9 }));
      // overlap arc (0..20 laid twice)
      if (th > 360) { const p3 = []; for (let a = 0; a <= Math.min(th - 360, OVER); a += 1) { const rr = R0 + raw(a).r * ex + 8, an = rot(a + 360); p3.push((CX + rr * Math.cos(an)).toFixed(1) + ',' + (CY - rr * Math.sin(an)).toFixed(1)); } if (p3.length > 1) g.appendChild(el('polyline', { points: p3.join(' '), fill: 'none', stroke: '#fbbf24', 'stroke-width': 3 })); }
    }
    // tacks
    if (S.tacks) TACK_ORDER.forEach((ta, k) => { const rr = R0 + raw(ta).r * ex, an = rot(ta); const x = CX + rr * Math.cos(an), y = CY - rr * Math.sin(an); g.appendChild(el('circle', { cx: x, cy: y, r: 6.5, fill: '#ff5b4d', stroke: '#0e1218' })); g.appendChild(el('text', { x: x, y: y + 3.5, 'text-anchor': 'middle', style: 'font-size:9.5px;fill:#fff;font-weight:700' }, document.createTextNode(String(k + 1)))); });
    // overlap wedge marker at 0..20 on the tube
    { const a0 = rot(0), a1 = rot(OVER), r1 = R0 - 12, r2 = R0 - 26; g.appendChild(el('path', { d: 'M' + (CX + r1 * Math.cos(a0)) + ' ' + (CY - r1 * Math.sin(a0)) + ' L' + (CX + r2 * Math.cos(a0)) + ' ' + (CY - r2 * Math.sin(a0)) + ' A' + r2 + ' ' + r2 + ' 0 0 0 ' + (CX + r2 * Math.cos(a1)) + ' ' + (CY - r2 * Math.sin(a1)) + ' L' + (CX + r1 * Math.cos(a1)) + ' ' + (CY - r1 * Math.sin(a1)) + ' A' + r1 + ' ' + r1 + ' 0 0 1 ' + (CX + r1 * Math.cos(a0)) + ' ' + (CY - r1 * Math.sin(a0)) + ' Z', fill: 'rgba(251,191,36,.35)', stroke: '#fbbf24' })); }
    g.appendChild(el('text', { x: CX + (R0 - 46) * Math.cos(rot(9)), y: CY - (R0 - 46) * Math.sin(rot(9)) + 3, 'text-anchor': 'middle', style: 'font-size:9.5px;fill:#fbbf24' }, document.createTextNode('20°')));
    // the station (fixed): dot + wire arrival + gun direction, at the right
    g.appendChild(el('line', { x1: CX + R0 + 44, y1: CY, x2: CX + R0 - 4, y2: CY, stroke: '#ff3b30', 'stroke-width': 1.5, 'stroke-dasharray': S.laser === 'weld' ? '' : '3 3' }));
    g.appendChild(el('circle', { cx: CX + R0, cy: CY, r: 4.2, fill: '#ff3b30', stroke: '#fff' }));
    g.appendChild(el('path', { d: 'M' + (CX + R0 + 8) + ' ' + (CY + 34) + ' L' + (CX + R0 + 2) + ' ' + (CY + 6), stroke: '#e6b422', 'stroke-width': 2, fill: 'none' }));
    g.appendChild(el('text', { x: CX + R0 + 12, y: CY + 48, class: 'lbl' }, document.createTextNode('wire (arriving side)')));
    g.appendChild(el('text', { x: CX + R0 + 12, y: CY - 10, style: 'fill:#ff8a80' }, document.createTextNode('dot (fixed station)')));
    g.appendChild(el('path', { d: 'M' + (CX + R0 + 60) + ' ' + (CY + 90) + ' A' + (R0 + 60) + ' ' + (R0 + 60) + ' 0 0 0 ' + (CX + R0 + 60 - 24) + ' ' + (CY + 90 + 26), stroke: '#6b7a90', fill: 'none', 'marker-end': '' }));
    g.appendChild(el('text', { x: CX, y: CY + R0 + 62, 'text-anchor': 'middle', class: 'hd' }, document.createTextNode('TUBE ' + Math.round(th) + '° ' + (th >= 360 ? '(overlap)' : ''))));
    g.appendChild(el('text', { x: CX, y: CY + R0 + 76, 'text-anchor': 'middle', class: 'lbl' }, document.createTextNode('runout exaggerated ×' + S.exag + ' so the seam can be seen; wire side and turn direction as in the kit scenes')));
    g.appendChild(el('text', { x: 4, y: 12, class: 'hd' }, document.createTextNode('THE SEAM, UNDER A FIXED DOT')));
  }

  // ------------------------------------------------------------------ unwrapped trace
  const PX = 470, PY = 30, PW = 640, PH = 150;
  function trace(g) {
    g.appendChild(el('text', { x: PX, y: 12, class: 'hd' }, document.createTextNode('DOT VS SEAM OVER THE LAP (mm)')));
    const yr = 0.5, X = a => PX + 40 + (PW - 50) * a / (360 + OVER), Y = v => PY + PH / 2 - v / yr * (PH / 2 - 8);
    g.appendChild(el('rect', { x: PX + 40, y: PY, width: PW - 50, height: PH, fill: '#10151c', stroke: '#2a3341' }));
    [-0.4, -0.2, 0, 0.2, 0.4].forEach(v => { g.appendChild(el('line', { x1: PX + 40, x2: PX + PW - 10, y1: Y(v), y2: Y(v), stroke: v === 0 ? '#3a4658' : '#1b222c' })); g.appendChild(el('text', { x: PX + 34, y: Y(v) + 3, 'text-anchor': 'end', class: 'lbl' }, document.createTextNode((v > 0 ? '+' : '') + v.toFixed(1)))); });
    [0, 90, 180, 270, 360].forEach(a => { g.appendChild(el('line', { x1: X(a), x2: X(a), y1: PY, y2: PY + PH, stroke: '#1b222c' })); g.appendChild(el('text', { x: X(a), y: PY + PH + 12, 'text-anchor': 'middle', class: 'lbl' }, document.createTextNode(a + '°'))); });
    g.appendChild(el('rect', { x: X(360), y: PY, width: X(360 + OVER) - X(360), height: PH, fill: 'rgba(251,191,36,.10)' }));
    g.appendChild(el('text', { x: X(360) + 2, y: PY + 10, style: 'font-size:9px;fill:#fbbf24' }, document.createTextNode('overlap')));
    // user window
    [S.window, -S.window].forEach(v => g.appendChild(el('line', { x1: PX + 40, x2: PX + PW - 10, y1: Y(v), y2: Y(v), stroke: '#fbbf24', 'stroke-dasharray': '5 4' })));
    g.appendChild(el('text', { x: PX + PW - 12, y: Y(S.window) - 3, 'text-anchor': 'end', style: 'font-size:9.5px;fill:#fbbf24' }, document.createTextNode('your window ±' + S.window.toFixed(2) + ' mm (illustrative)')));
    const build = (fn, key) => { const p = []; for (let a = 0; a <= 360 + OVER; a += 2) p.push(X(a).toFixed(1) + ',' + Y(fn(a)[key]).toFixed(1)); return p.join(' '); };
    // uncorrected (ghost) then corrected
    g.appendChild(el('polyline', { points: build(raw, 'r'), fill: 'none', stroke: '#5b6c86', 'stroke-width': 1.3, 'stroke-dasharray': '4 3' }));
    g.appendChild(el('polyline', { points: build(raw, 'z'), fill: 'none', stroke: '#5b6c86', 'stroke-width': 1.3, 'stroke-dasharray': '1 3' }));
    if (S.mode === 'hand' && S.tremor > 0) { const up = [], dn = []; for (let a = 0; a <= 360 + OVER; a += 4) { const rv = resid(a); up.push(X(a).toFixed(1) + ',' + Y(rv.r + rv.band).toFixed(1)); dn.unshift(X(a).toFixed(1) + ',' + Y(rv.r - rv.band).toFixed(1)); } g.appendChild(el('polygon', { points: up.concat(dn).join(' '), fill: 'rgba(245,165,36,.20)', stroke: 'none' })); }
    g.appendChild(el('polyline', { points: build(resid, 'r'), fill: 'none', stroke: '#22d3ee', 'stroke-width': 2.2 }));
    g.appendChild(el('polyline', { points: build(resid, 'z'), fill: 'none', stroke: '#a78bfa', 'stroke-width': 2.2 }));
    const cur = Math.min(S.ang, 360 + OVER); g.appendChild(el('line', { x1: X(cur), x2: X(cur), y1: PY, y2: PY + PH, stroke: '#ff3b30', 'stroke-width': 1.5 }));
    TACK_ORDER.forEach((ta, k) => g.appendChild(el('circle', { cx: X(ta), cy: PY + PH - 5, r: 3, fill: '#ff5b4d' })));
    g.appendChild(el('text', { x: PX + 42, y: PY + PH + 26, class: 'lbl' }, document.createTextNode('cyan: radial offset after the corrector   violet: vertical offset   dashed grey: uncorrected radial / vertical   red dots: tacks')));
  }

  // ------------------------------------------------------------------ time axis
  const TY = 440, TX = 60, TW = 1030;
  const DIST = [
    ['beam wobble (80 Hz x 2 mm) [repo]', -2.1, -1.9, '#f5a524'],
    ['hand tremor [assumed 5 to 12 Hz]', -1.1, -0.7, '#f5a524'],
    ['head vibration motor [manual p.20, frequency unknown]', -1.8, -0.5, '#f5a524', true],
    ['runout, once per lap [repo: 26 to 78 s]', 1.41, 1.89, '#22d3ee'],
    ['tack shrink, wire and hose push [assumed]', 0.5, 2.2, '#f5a524', true],
    ['tube-to-tube offsets [swap to swap]', 2.2, 3.4, '#f5a524'],
    ['creep and drift of printed parts [assumed]', 3.5, 5.0, '#f5a524', true],
  ];
  const CORR = [
    ['a hand by eye [assumed 0.3 to 3 Hz]', -0.5, 0.5, '#14b8a6'],
    ['camera + software loop [assumed 0.1 to 10 Hz]', -1.0, 1.0, '#3b82f6', true],
    ['a slow axis on a replayed map (per lap)', 0.7, 2.0, '#3b82f6'],
    ['mechanical follower on the tube', -1.5, 2.0, '#14b8a6'],
    ['hand-turned micrometer or screw (minutes)', 1.8, 3.2, '#14b8a6'],
    ['a shim, ring or preset per tube', 2.2, 3.6, '#14b8a6'],
    ['a locating seat per handover', 1.0, 3.6, '#14b8a6'],
  ];
  function timeaxis(g) {
    g.appendChild(el('text', { x: 4, y: TY - 8, class: 'hd' }, document.createTextNode('WHO OWNS WHICH RATE OF CHANGE (period, seconds, log scale; all bands illustrative unless tagged [repo])')));
    const lo = -2.4, hi = 5.2, X = v => TX + (TW - 40) * (v - lo) / (hi - lo);
    const row = 16, y0 = TY + 4;
    [[-2, '0.01 s'], [-1, '0.1 s'], [0, '1 s'], [1, '10 s'], [2, '100 s'], [3, '17 min'], [4, '3 h'], [5, '1 day']].forEach(t => { g.appendChild(el('line', { x1: X(t[0]), x2: X(t[0]), y1: y0, y2: y0 + (DIST.length + CORR.length + 2) * row + 8, stroke: '#1b222c' })); g.appendChild(el('text', { x: X(t[0]), y: y0 + (DIST.length + CORR.length + 2) * row + 20, 'text-anchor': 'middle', class: 'lbl' }, document.createTextNode(t[1]))); });
    let y = y0 + 4;
    g.appendChild(el('text', { x: 4, y: y + 9, style: 'fill:#f5a524;font-weight:600' }, document.createTextNode('DISTURBANCES')));
    DIST.forEach(d => { y += row; g.appendChild(el('rect', { x: X(d[1]), y: y, width: Math.max(4, X(d[2]) - X(d[1])), height: 11, rx: 3, fill: d[3], opacity: d[4] ? 0.35 : 0.85, stroke: d[4] ? d[3] : 'none', 'stroke-dasharray': d[4] ? '3 2' : '' })); g.appendChild(el('text', { x: Math.max(TX, X(d[2]) + 6), y: y + 9, style: 'font-size:9.5px' }, document.createTextNode(d[0]))); });
    y += row + 6;
    g.appendChild(el('text', { x: 4, y: y + 9, style: 'fill:#14b8a6;font-weight:600' }, document.createTextNode('CORRECTORS')));
    CORR.forEach(d => { y += row; g.appendChild(el('rect', { x: X(d[1]), y: y, width: Math.max(4, X(d[2]) - X(d[1])), height: 11, rx: 3, fill: d[3], opacity: d[4] ? 0.5 : 0.85 })); g.appendChild(el('text', { x: Math.max(TX, X(d[2]) + 6), y: y + 9, style: 'font-size:9.5px' }, document.createTextNode(d[0]))); });
    // lap period marker
    const lp = Math.log10(T()), xm = X(lp);
    g.appendChild(el('line', { x1: xm, x2: xm, y1: y0, y2: y + row, stroke: '#ff3b30', 'stroke-width': 1.6 }));
    g.appendChild(el('text', { x: xm + 4, y: y0 + 8, style: 'fill:#ff8a80;font-size:10px' }, document.createTextNode('one lap = ' + T().toFixed(1) + ' s at ' + S.speed + ' mm/s')));
  }

  function enables() {
    const m = S.mode;
    app.ui.enable('hand', m === 'hand'); app.ui.enable('tremor', m === 'hand');
    app.ui.enable('res', m === 'feedforward'); app.ui.enable('change', m === 'feedforward');
    app.ui.enable('axes', m === 'feedforward' || m === 'follower'); app.ui.enable('follow', m === 'follower');
  }
  function render() {
    enables();
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const g1 = el('g'), g2 = el('g'), g3 = el('g'); svg.appendChild(g1); svg.appendChild(g2); svg.appendChild(g3);
    dial(g1); trace(g2); g3.setAttribute('transform', 'translate(0,' + 0 + ')'); timeaxis(g3);
    // readouts
    const Tl = T(), w = 2 * Math.PI / Tl, sr = (S.radTIR / 2) * w, sf = (S.faceTIR / 2) * w;
    let maxR = 0, maxZ = 0; for (let a = 0; a <= 380; a += 2) { const r = resid(a); maxR = Math.max(maxR, Math.abs(r.r) + (r.band || 0)); maxZ = Math.max(maxZ, Math.abs(r.z)); }
    const rawMaxR = S.radTIR / 2, rawMaxZ = S.faceTIR / 2;
    read.innerHTML =
      '<div><em>lap / 380 degrees</em><b>' + Tl.toFixed(1) + ' s / ' + (Tl * 380 / 360).toFixed(1) + ' s</b><em>' + S.speed + ' mm/s = ' + (60 / Tl).toFixed(3) + ' rpm [repo, derived]</em></div>' +
      '<div><em>peak slew of the runout (radial / face)</em><b>' + sr.toFixed(4) + ' / ' + sf.toFixed(4) + ' mm/s</b><em>update every ' + (0.02 / Math.max(sr, sf)).toFixed(1) + ' s to stay within 0.02 mm</em></div>' +
      '<div><em>largest offset left, radial / vertical</em><b>±' + maxR.toFixed(3) + ' / ±' + maxZ.toFixed(3) + ' mm</b><em>uncorrected: ±' + rawMaxR.toFixed(3) + ' / ±' + rawMaxZ.toFixed(3) + '</em></div>' +
      '<div><em>gun-side lever (pivot at the grip base, 279 mm [derived])</em><b>0.081 mm per arcminute</b><em>a 1 degree slip is 4.9 mm at the dot</em></div>';
    app.io.set({
      commands: [{ name: 'Rotator speed', value: S.speed, unit: 'mm/s', note: 'existing controller, 5 to 15' }, { name: 'Correction axis', value: S.mode === 'feedforward' ? 'radial' + (S.axes === 2 ? ' + vertical' : '') + ', resolution ' + S.res + ' mm' : S.mode === 'follower' ? 'mechanical, no command' : 'none', note: 'proposed; the only new actuator in the replay mode' }],
      observes: [{ name: 'Degrees turned', value: Math.round(S.ang), unit: '°', status: 'seen', note: 'rotator readout [repo]' }, { name: 'Dot vs seam over the lap', value: S.mode === 'feedforward' ? 'from the dry-lap map' : '-', status: S.mode === 'feedforward' ? 'partly' : 'blind', note: 'a camera or indicator would supply it; perfect here' }, { name: 'Change since the dry lap', value: S.mode === 'feedforward' ? S.change.toFixed(2) + ' mm' : '-', status: 'unresolved', note: 'not observable until after the weld' }],
      manual: ['Holding the gun (hand mode)', 'The trigger', 'Marking the first tack'],
    });
  }

  // ------------------------------------------------------------------ controls
  const g0 = app.ui.group('Who corrects the runout');
  g0.radio({ id: 'mode', label: 'Corrector', options: [{ value: 'fixed', label: 'none (fixed gun)' }, { value: 'hand', label: 'hand by eye' }, { value: 'feedforward', label: 'replayed map' }, { value: 'follower', label: 'mechanical follower' }], value: 'fixed', kind: 'branch', help: 'Same runout, four ways of dealing with it.', onChange: v => { S.mode = v; render(); } });
  g0.slider({ id: 'hand', label: 'Hand tracks the runout', min: 0, max: 100, step: 5, value: 50, unit: '%', kind: 'scene', help: 'Hand mode only. Illustrative.', onChange: v => { S.hand = v; render(); } });
  g0.slider({ id: 'tremor', label: 'Hand tremor band', min: 0, max: 0.3, step: 0.01, value: 0.08, unit: 'mm', kind: 'scene', help: 'Hand mode only; shown as a band because it changes many times per degree of rotation.', onChange: v => { S.tremor = v; render(); } });
  g0.slider({ id: 'res', label: 'Correction resolution', min: 0, max: 0.1, step: 0.005, value: 0.02, unit: 'mm', kind: 'scene', help: 'Replay mode: the smallest step of the slow axis (backlash and screw resolution).', onChange: v => { S.res = v; render(); } });
  g0.slider({ id: 'change', label: 'Change since the dry lap', min: 0, max: 0.3, step: 0.01, value: 0, unit: 'mm', kind: 'scene', help: 'Replay mode: how much the weld lap differs from the dry lap (heat, tack shrink, hose push). Unknown.', onChange: v => { S.change = v; render(); } });
  g0.radio({ id: 'axes', label: 'Axes corrected', options: [{ value: 1, label: 'radial only' }, { value: 2, label: 'radial + vertical' }], value: 1, kind: 'branch', onChange: v => { S.axes = +v; render(); } });
  g0.slider({ id: 'follow', label: 'Follower error', min: 0, max: 0.1, step: 0.005, value: 0.03, unit: 'mm', kind: 'scene', help: 'Mechanical follower: how well a roller on the tube tracks it.', onChange: v => { S.follow = v; render(); } });
  const g1c = app.ui.group('The tube');
  g1c.slider({ id: 'speed', label: 'Bead travel speed', min: 5, max: 15, step: 0.5, value: 8, unit: 'mm/s', kind: 'actuator', help: 'The rotator controller already accepts 5 to 15 mm/s [repo].', onChange: v => { S.speed = v; render(); } });
  g1c.slider({ id: 'rad', label: 'Radial runout (TIR)', min: 0, max: 0.5, step: 0.01, value: 0.25, unit: 'mm', kind: 'scene', help: 'The rig accepts 0.25 mm [repo].', onChange: v => { S.radTIR = v; render(); } });
  g1c.slider({ id: 'face', label: 'Face runout (TIR)', min: 0, max: 0.5, step: 0.01, value: 0.30, unit: 'mm', kind: 'scene', help: 'The rig accepts 0.30 mm [repo].', onChange: v => { S.faceTIR = v; render(); } });
  g1c.slider({ id: 'ang', label: 'Tube angle', min: 0, max: 380, step: 1, value: 0, unit: '°', kind: 'state', help: '0 = first tack under the dot; 380 = 20 degrees past it.', onChange: v => { S.ang = v; render(); } });
  g1c.toggle({ id: 'play', label: 'Rotator turning (one lap and the overlap)', value: false, kind: 'state', onChange: v => { S.play = v; app.animate(v); } });
  g1c.slider({ id: 'rate', label: 'Playback speed (time-lapse)', min: 1, max: 20, step: 1, value: 5, unit: '\u00d7', kind: 'view', help: 'Real time is one lap per 26 to 78 s [repo].', onChange: v => { S.rate = v; } });
  g1c.radio({ id: 'laser', label: 'Laser', options: [{ value: 'dry', label: 'red dot only' }, { value: 'weld', label: 'welding' }], value: 'dry', kind: 'state', help: 'Welding draws the bead as the tube turns.', onChange: v => { S.laser = v; render(); } });
  const g2c = app.ui.group('View');
  g2c.slider({ id: 'window', label: 'Your offset window', min: 0.05, max: 0.5, step: 0.01, value: 0.25, unit: 'mm', kind: 'view', help: 'A reference band only. Nobody has measured what the melt tolerates.', onChange: v => { S.window = v; render(); } });
  g2c.slider({ id: 'exag', label: 'Dial exaggeration', min: 10, max: 200, step: 10, value: 60, unit: '×', kind: 'view', onChange: v => { S.exag = v; render(); } });
  g2c.toggle({ id: 'tacks', label: 'Show the eight tacks', value: true, kind: 'view', onChange: v => { S.tacks = v; render(); } });
  let last = 0;
  app.onFrame(function (dt) {
    if (!S.play) return false;
    const degPerS = 360 / T() * S.rate; S.ang += degPerS * dt; if (S.ang > 380) S.ang = 0;
    app.ui.set('ang', Math.round(S.ang), { silent: true }); render(); return true;
  });
  render();
})();
</script>
</body>
</html>
