      tbody.appendChild(tr);
    });
    const r = ROWS.find(x => x.id === selected) || ROWS[3];
    detail.innerHTML = '';
    detail.appendChild(h('h3', { text: r.name }));
    detail.appendChild(h('div', { text: r.sum }));
    const dl = h('dl', {});
    [['Carries', r.carries], ['Locates', r.ref], ['Software', r.soft]].forEach(p => dl.append(h('dt', { text: p[0] }), h('dd', { text: p[1] })));
    const links = h('dd', {}); if (r.link) links.appendChild(h('a', { href: r.link, text: 'open the scene' })); if (r.idea) links.appendChild(h('a', { href: r.idea, text: 'idea file' })); if (!r.link && !r.idea) links.textContent = 'Derek’s example: see context/examples.md';
    dl.append(h('dt', { text: 'Open' }), links);
    detail.appendChild(dl);
    app.io.set({ commands: [{ name: 'Nothing is commanded here', value: '-', note: 'overview only' }], observes: [{ name: 'Selected row', value: r.id, status: 'seen', note: r.name }], manual: ['Read across a row; open the linked scene for the mechanism'] });
  }
  const c1 = app.ui.group('Read the matrix');
  c1.radio({ id: 'phase', label: 'Phase', options: [{ value: 'setup', label: 'setup' }, { value: 'weld', label: 'weld' }], value: 'setup', kind: 'state', help: 'Some cells change: joints free in setup are locked in the weld.', onChange: draw });
  c1.select({ id: 'who', label: 'Highlight cells supplied by', options: [{ value: 'all', label: 'everything' }, { value: 'motor', label: 'a motor' }, { value: 'hand', label: 'the hand' }, { value: 'spring', label: 'a spring' }, { value: 'gravity', label: 'gravity' }, { value: 'fixed', label: 'a seat or a lock' }], value: 'all', kind: 'view', onChange: draw });
  c1.select({ id: 'grp', label: 'Rows', options: [{ value: 'all', label: 'all' }, { value: 'derek', label: 'Derek’s examples' }, { value: 'travel', label: 'travel arrangements' }], value: 'all', kind: 'view', onChange: draw });
  c1.select({ id: 'row', label: 'Selected row', options: ROWS.map(r => ({ value: r.id, label: r.name })), value: 'T1', kind: 'view', onChange: v => { selected = v; draw(); } });
})();
</script>
</body>
</html>
