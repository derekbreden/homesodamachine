  const rdRms = {};

  function drawChart() {
    barsG.textContent = ''; legendG.textContent = '';
    const grp = (cx1 - cx0) / 3, bw = grp / 5.2, out = {};
    REFS.forEach(r => { out[r.id] = stats(series(r.id)); });
    REFS.forEach((r, ri) => out[r.id].h.slice(0, 3).forEach((v, n) => {
      const x = cx0 + grp * n + grp * 0.1 + ri * bw * 1.15, sel = MATES[P.feature] && r.feature === P.feature;
      barsG.appendChild(WK.svg('rect', { x: x, y: sy(Math.min(v, YMAX)), width: bw, height: Math.max(0, cy1 - sy(Math.min(v, YMAX))), fill: r.color, opacity: sel ? 1 : 0.55, stroke: sel ? '#fff' : 'none', 'stroke-width': 0.8 }));
    }));
    REFS.forEach((r, i) => { const y = 176 + i * 12; legendG.appendChild(WK.svg('rect', { x: 8, y: y - 7, width: 8, height: 8, fill: r.color })); legendG.appendChild(WK.svg('text', { x: 20, y: y, 'font-size': 8.5, fill: '#cbd5e1', text: r.label })); legendG.appendChild(WK.svg('text', { x: svgW - 8, y: y, 'text-anchor': 'end', 'font-size': 8.5, fill: '#cbd5e1', text: 'rms ' + out[r.id].rms.toFixed(3) + ' mm' })); });
    REFS.forEach(r => rdRms[r.id] && rdRms[r.id](out[r.id].rms.toFixed(3) + ' mm rms'));
    return out;
  }

  // ------------------------------------------------------------------ clash test for a finger that turns with the tube (datum-03's routine)
  const shell = gun.addShell({ style: 'sleeve', from: 'nozzleTip', to: 'housingTop', clearance: 3, role: 'load', opacity: 0.16 });
  function insideZone(z, p) {
    if (z.type === 'cyl') { const rad = Math.hypot(p.x, p.y); if (p.z < z.z0 || p.z > z.z1) return false; return rad < z.r0 + (z.r1 - z.r0) * (p.z - z.z0) / (z.z1 - z.z0); }
    const q = p.clone().sub(z.center).applyQuaternion(z.quat.clone().invert()); return Math.abs(q.x) < z.half.x && Math.abs(q.y) < z.half.y && Math.abs(q.z) < z.half.z;
  }
  const segDist = (p, a, b) => { const ab = b.clone().sub(a), t = WK.clamp(p.clone().sub(a).dot(ab) / ab.lengthSq(), 0, 1); return p.distanceTo(a.clone().addScaledVector(ab, t)); };
  function fingerClash() {
    app.scene.updateMatrixWorld(true);
    const inv = gun.group.matrix.clone().invert(), A = V(0, 0, 0), B = V(0, 0, -WK.CLEARANCE);
    for (const f of fingers) {
      const a = (f.userData.az + ws.spinAngle) * DEG;
      for (let z = RIM - 9; z <= RIM + 4; z += 1) for (let dr = 0; dr <= 1.2; dr += 0.6) {
        const p = V((61.3 + dr) * Math.cos(a), (61.3 + dr) * Math.sin(a), z), pl = p.clone().applyMatrix4(inv);
        for (const zn of shell.zones) if (insideZone(zn, pl)) return 'nozzle and shell';
        if (segDist(pl, A, B) < 2.5) return 'the laser beam (2.5 mm corridor)';
      }
    }
    return null;
  }

  // ------------------------------------------------------------------ show/hide, card, badges
  const CELLS = ['x', 'y', 'z', 'rx', 'ry', 'rz'];
  function updateCard() {
    const m = MATES[P.feature]; if (!m) return;
    const dof = {}; m.dof.forEach(s => { const t = s.split('='); dof[t[0]] = t[1]; });
    const cell = k => { const v = dof[k]; const bg = v === 'L' ? '#14b8a6' : v === 'w' ? '#f59e0b' : 'transparent', txt = v === 'L' ? 'fixed' : v === 'w' ? 'weak' : 'free'; return '<td style="text-align:center;padding:2px 4px;border:1px solid #3a4250;background:' + bg + ';color:' + (v === '.' ? '#94a3b8' : '#0b1220') + ';font-size:11px"><b>' + k + '</b><br>' + txt + '</td>'; };
    cardNode.innerHTML = '<div style="margin-bottom:6px"><b>' + m.label + '</b></div><table style="border-collapse:collapse;width:100%"><tr>' + CELLS.map(cell).join('') + '</tr></table>' +
      '<div style="margin-top:6px"><b>Locates:</b> ' + m.locates + '.</div><div><b>Follows the tube\'s motion:</b> ' + m.motion + '. <b>Its shape:</b> ' + m.shape + '.</div>' +
      '<div><b>Fit:</b> ' + m.fit + '.</div><div><b>Access:</b> ' + m.access + '.</div><div><b>Unknown per tube:</b> ' + m.unknown + '.</div><div><b>Flip for the second closure:</b> ' + m.flip + '.</div>';
  }
  function update() {
    if (!ready) return;
    Object.keys(groups).forEach(k => { groups[k].visible = k === P.feature; });
    plate1.visible = P.closure === 2; rodHang.visible = P.closure === 1;
    if (P.feature === 'below' && P.closure !== 2) groups.below.visible = true;
    gClip.rotation.z = -P.s / RI; gClip.position.set(0, 0, 0);
    buildFingers(); groups.bore.visible = P.feature === 'bore';
    const cl = P.feature === 'bore' ? fingerClash() : null;
    app.badge('clash', cl ? 'a bore finger turning with the tube meets ' + cl + ' at the station: fingers seat the ring, then retract' : null, 'limit');
    app.badge('below', P.feature === 'below' && P.closure !== 2 ? 'closure 1 has no plate at the bottom: this mate exists only after the flip' : null, 'warn');
    app.badge('wall', P.feature === 'wall' ? 'clip drawn on the arriving side, ' + P.s + ' mm ahead of the dot (kit proxy wire and nozzle)' : null, 'info');
    mateLabel.set(MATES[P.feature].label); updateCard(); const o = drawChart();
    app.io.set({
      commands: [{ name: 'Rotator turns the tube', value: ws.spin.on ? 'on' : 'off', status: 'manual', note: 'existing controller; the only motion in this scene' }],
      observes: [
        { name: 'Radial error at the dot (chart)', value: REFS.map(r => r.id + ' ' + o[r.id].rms.toFixed(3)).join(', '), unit: 'mm rms', status: 'blind', note: 'exact scene geometry of an illustrative wall, not a sensor reading' },
        { name: 'Real out-of-round, wall eccentricity, rim flatness', value: '?', status: 'unresolved', note: '[unknown]: five tubes, eight positions each, and a feeler gauge on a plate' },
      ],
      manual: ['Choosing which feature to mate', 'Measuring the tubes before believing any bar in the chart'],
    });
  }
  let ready = false;

  // ------------------------------------------------------------------ controls
  app.ui.radio({ id: 'feature', label: 'Feature mated', options: [
    { value: 'rim', label: 'Rim', help: 'A ring on three pads on the rim.' },
    { value: 'outside', label: 'Outside', help: 'A skirt with three soft rockers on the outside, then locked.' },
    { value: 'bore', label: 'Bore', help: 'Three spring fingers inside the bore, for seating only.' },
    { value: 'face', label: 'Plate face', help: 'Three feet on the plate face (temporary).' },
    { value: 'ports', label: 'Ports', help: 'A post on two pins in the plate\'s ports.' },
    { value: 'below', label: 'Ports from below', help: 'Closure 2 only: pins up the service bore through plate 1\'s ports.' },
    { value: 'wall', label: 'Wall at the station', help: 'A hook with a roller on the bore and a pad on the outside, on the gun.' }], value: 'rim', kind: 'branch', visual: () => Object.values(groups), onChange: v => { P.feature = v; if (v === 'below' && P.closure !== 2) app.ui.set('closure', 2); update(); } });
  app.ui.radio({ id: 'closure', label: 'Closure', options: [{ value: 1, label: 'First: bare tube', help: 'The float rod hangs from the plate; the far end of the tube is open.' }, { value: 2, label: 'Second: first plate is the base', help: 'Tube flipped: plate 1 at the bottom, the float rod and float stand up inside, its ports reachable from below.' }], value: 1, kind: 'branch', visual: () => plate1, onChange: v => { P.closure = +v; update(); } });
  app.ui.toggle({ id: 'spin', label: 'Rotator turning', value: false, kind: 'state', visual: () => ws.turntable, help: 'Turns the tube; bore fingers pass the station once each.', onChange: v => { ws.spin.on = v; app.invalidate(); } });
  app.ui.slider({ id: 'angle', label: 'Table angle', min: 0, max: 359, step: 1, value: 0, unit: '°', kind: 'actuator', visual: () => ws.turntable, help: 'The existing rotator.', onChange: v => { ws.setSpin(v); update(); } });
  const gw = app.ui.group('The tube (scene edits, illustrative)', { open: true });
  gw.slider({ id: 'w', label: 'Left after indicating, w (amplitude)', min: 0, max: 0.15, step: 0.005, value: 0.06, unit: 'mm', kind: 'scene', visual: () => ws.tubeGroup, help: 'The rigid offset of the tube from the rotation axis at the working end. The rig accepts 0.25 mm TIR, i.e. up to 0.125.', onChange: v => { P.w = v; update(); } });
  gw.slider({ id: 'b1', label: 'Wall eccentricity, b1', min: 0, max: 0.25, step: 0.005, value: 0.08, unit: 'mm', kind: 'scene', visual: () => ws.tube, help: 'The outside centre against the bore centre. No mate on the outside can know it.', onChange: v => { P.b1 = v; update(); } });
  gw.slider({ id: 'o2', label: 'Ovality, b2', min: 0, max: 0.2, step: 0.005, value: 0.06, unit: 'mm', kind: 'scene', visual: () => ws.tube, help: 'Outside and bore taken equal (uniform wall). The OD indicator reads twice this.', onChange: v => { P.o2 = v; update(); } });
  gw.slider({ id: 'o3', label: 'Three-lobing, b3', min: 0, max: 0.1, step: 0.005, value: 0.03, unit: 'mm', kind: 'scene', visual: () => ws.tube, onChange: v => { P.o3 = v; update(); } });
  const gm = app.ui.group('The mate (scene edits)', { open: true });
  gm.radio({ id: 'k', label: 'Pads or fingers on the circle', options: [{ value: 3, label: '3' }, { value: 4, label: '4' }, { value: 6, label: '6' }], value: 3, kind: 'branch', visual: () => [gOD, gBore], help: 'k equal pads pass harmonics k-1 and k+1 at gain 1 and reject the rest.', onChange: v => { P.k = +v; update(); } });
  gm.slider({ id: 's', label: 'Roller lead ahead of the dot', min: 2, max: 30, step: 1, value: 10, unit: 'mm', kind: 'scene', visual: () => gClip, help: 'Arc length on the arriving side. Costs 2 sin(n s / 2R) of harmonic n.', onChange: v => { P.s = v; update(); } });
  const gr = app.ui.group('Numbers (exact scene geometry, not sensor readings)', { open: true });
  REFS.forEach(r => { rdRms[r.id] = gr.readout('rms-' + r.id, r.label); });

  // ------------------------------------------------------------------ labels
  const ANCH = { rim: [66, 0, RIM + 7], outside: [0, 66.4, RIM - 15], bore: [61.3 * Math.cos(40 * DEG), 61.3 * Math.sin(40 * DEG), RIM + 4], face: [52 * Math.cos(22.5 * DEG), 52 * Math.sin(22.5 * DEG), CT], ports: [0, 0, RIM + 45], below: [PORT, 0, -20] };
  const mateLabel = app.label(() => { if (P.feature === 'wall') { const a = -P.s / RI; return V((RO + 4) * Math.cos(a), (RO + 4) * Math.sin(a), RIM + 6); } const a = ANCH[P.feature]; return V(a[0], a[1], a[2]).applyMatrix4(TG.matrix); }, 'mate', { cls: 'locate' });
  app.label(() => gun.dotWorld(), 'dot', { cls: 'laser' });
  app.onFrame(function (dt) { if (!ws.spin.on) return false; app.ui.set('angle', Math.round(ws.spinAngle) % 360, { silent: true }); if (P.feature === 'bore') update(); return true; });
  ready = true; update();
})();
</script>
</body>
</html>
