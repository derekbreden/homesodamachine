    g1.appendChild(el('rect', { x: gunL, y: gy - 26, width: 92, height: 52, rx: 6, fill: '#c98a1a', stroke: '#f5a524', 'stroke-width': 1.5 }));
    txt(svg, gx, gy + 4, 'gun', 'hd', 'middle');
    g1.appendChild(el('circle', { cx: gx + 30, cy: gy + 26, r: 5, fill: '#ff3b30' }));
    if (off) txt(svg, gx, gy - 34, 'off scale: ' + sgn(cur.x) + ' mm', 'hd', 'middle');
    txt(svg, 960, 180, 'now: ' + cur.label + '   x = ' + sgn(cur.x) + ' mm   (' + (Math.abs(cur.x) <= P.w ? 'inside' : 'outside') + ' the window)', 'mono', 'end');

    // ---------------- panel 2: the trace by state
    const TY0 = 212, TY1 = 348, TX0 = 92, TX1 = 940;
    txt(svg, 20, 202, 'The gun’s position after each state (log scale beyond ±0.05 mm), and what moved it', 'hd');
    const mxS = Math.max(symlog(0.3), ...steps.map(s => Math.abs(symlog(s.x))), symlog(P.w)), yc = (TY0 + TY1) / 2, ky = (TY1 - TY0) / 2 / (mxS * 1.1);
    const Y = v => yc - symlog(v) * ky;
    svg.appendChild(el('rect', { x: TX0, y: TY0, width: TX1 - TX0, height: TY1 - TY0, fill: '#0f151d', stroke: '#222c3a' }));
    svg.appendChild(el('rect', { x: TX0, y: Y(P.w), width: TX1 - TX0, height: Y(-P.w) - Y(P.w), fill: 'rgba(20,184,166,.18)' }));
    [0.1, 0.3, 1, 3, 10].forEach(v => { if (symlog(v) <= mxS * 1.1) [1, -1].forEach(sg => { svg.appendChild(el('line', { x1: TX0, y1: Y(sg * v), x2: TX1, y2: Y(sg * v), stroke: '#1d2633' })); txt(svg, TX0 - 6, Y(sg * v) + 3, (sg > 0 ? '+' : '−') + v, 'dim', 'end'); }); });
    svg.appendChild(el('line', { x1: TX0, y1: yc, x2: TX1, y2: yc, stroke: '#3a4658' })); txt(svg, TX0 - 6, yc + 3, '0', 'dim', 'end'); txt(svg, TX0 - 6, TY0 - 4, 'mm', 'dim', 'end');
    const cw = (TX1 - TX0) / K, cx = i => TX0 + cw * (i + 0.5);
    steps.forEach((s, i) => {
      const grp = el('g', { class: 'col' }); svg.appendChild(grp);
      grp.appendChild(el('rect', { class: 'colbg', x: TX0 + cw * i, y: TY0, width: cw, height: TY1 - TY0 + 48, fill: i === S.state ? 'rgba(147,197,253,.12)' : 'transparent' }));
      const y0 = i === 0 ? yc : Y(steps[i - 1].x), y1 = Y(s.x);
      grp.appendChild(el('line', { x1: cx(i), y1: y0, x2: cx(i), y2: y1, stroke: KIND_COL[s.kind], 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0.85 }));
      if (i > 0) grp.appendChild(el('line', { x1: cx(i - 1) + 8, y1: Y(steps[i - 1].x), x2: cx(i) - 8, y2: y0, stroke: '#4b5a70', 'stroke-dasharray': '2 3' }));
      grp.appendChild(el('circle', { cx: cx(i), cy: y1, r: 5.5, fill: '#0b0f14', stroke: KIND_COL[s.kind], 'stroke-width': 2 }));
      txt(grp, cx(i) + 12, y1 + 4, sgn(s.x), 'mono');
      txt(grp, cx(i), TY1 + 17, s.label, i === S.state ? 'hd' : '', 'middle');
      txt(grp, cx(i), TY1 + 31, 'moves ' + sgn(s.dx) + ' mm', 'dim', 'middle');
      txt(grp, cx(i), TY1 + 44, KIND_TXT[s.kind], 'dim', 'middle');
      grp.addEventListener('click', () => { app.ui.set('state', i); });
    });
    let lx = TX0; Object.keys(KIND_COL).forEach(k => { svg.appendChild(el('rect', { x: lx, y: TY1 + 56, width: 12, height: 8, fill: KIND_COL[k] })); txt(svg, lx + 16, TY1 + 64, KIND_TXT[k], 'dim'); lx += 130; });
    txt(svg, TX1, TY1 + 64, 'click a column, or use the State slider', 'dim', 'end');

    // ---------------- panel 3: 400 closures
    const B = batch(S.arr, 2000), HY0 = 444, HY1 = 540;
    txt(svg, 20, 434, 'Final position over 2000 closures at these settings', 'hd');
    const span = Math.max(4 * P.w, 2.2 * B.p95), nb = 41, bins = Array(nb).fill(0);
    B.fin.forEach(v => { const bi = Math.floor((v / span + 0.5) * nb); if (bi >= 0 && bi < nb) bins[bi]++; });
    const mxb = Math.max(1, ...bins), HX0 = 92, HX1 = 560, bw = (HX1 - HX0) / nb;
    svg.appendChild(el('rect', { x: HX0, y: HY0, width: HX1 - HX0, height: HY1 - HY0, fill: '#0f151d', stroke: '#222c3a' }));
    svg.appendChild(el('rect', { x: HX0 + ((0.5 - P.w / span) * (HX1 - HX0)), y: HY0, width: 2 * P.w / span * (HX1 - HX0), height: HY1 - HY0, fill: 'rgba(20,184,166,.20)' }));
    bins.forEach((c, i) => { const h = c / mxb * (HY1 - HY0 - 22); svg.appendChild(el('rect', { x: HX0 + i * bw + 1, y: HY1 - h, width: bw - 2, height: h, fill: '#60a5fa' })); });
    txt(svg, HX0, HY1 + 14, '−' + (span / 2).toFixed(2), 'dim'); txt(svg, (HX0 + HX1) / 2, HY1 + 14, '0', 'dim', 'middle'); txt(svg, HX1, HY1 + 14, '+' + (span / 2).toFixed(2) + ' mm', 'dim', 'end');
    txt(svg, HX0 + 8, HY0 + 14, 'inside the window: ' + Math.round(100 * B.inside) + ' %    median |x| ' + fmt(B.p50) + ' mm    95th percentile ' + fmt(B.p95) + ' mm', 'mono');
    const BX0 = 640, BX1 = 940;
    txt(svg, BX0, 434, 'RMS move at each state (mm)', 'hd');
    const list = B.per.filter(p => p.id !== 'hand'), mxr = Math.max(0.05, ...list.map(p => p.rms));
    list.forEach((p, i) => { const y = HY0 + 2 + i * 22, kind = p.id === 'trim' ? 'loop' : p.id === 'weld' ? 'load' : 'shift', wbar = Math.max(2, (p.rms / mxr) * (BX1 - BX0 - 200));
      txt(svg, BX0, y + 11, LABEL[p.id] || p.id, ''); svg.appendChild(el('rect', { x: BX0 + 130, y: y, width: wbar, height: 14, fill: KIND_COL[kind] })); txt(svg, BX0 + 134 + wbar, y + 12, fmt(p.rms), 'mono'); });
    txt(svg, BX0, HY1 + 14, 'the trim moves what the hand left; the rest are the leaks', 'dim');

    // ---------------- text
    say.innerHTML = '<b>' + cur.label + '.</b> ' + cur.note + '. The gun is now ' + sgn(cur.x) + ' mm from the seam' + (prev ? ' (' + sgn(cur.dx) + ' mm moved in this state)' : '') + '.' +
      (S.arr === 'B' && cur.id === 'lock' ? ' <b>Nothing has looked since.</b> ' + (P.after ? 'With “look again” on, the camera does next.' : 'Turn on “look again after the last handover” to close the loop after the clamp.') : '') +
      (S.arr === 'C' && cur.id === 'weld' ? ' <b>Only the bungees hold the gun now.</b> A soft support cannot keep a load change of ' + P.dF + ' N inside the window unless it is very much stiffer.' : '') +
      (S.arr === 'A' && cur.id === 'weld' ? (P.match ? ' The dry state carried the loads, so only a fifth of the change is left after the last look.' : ' The last look was a dry look: it could not see this.') : '');
    app.badge('off', off ? 'the gun is more than 5.5 mm off the seam in this state' : null, 'warn');
    app.badge('conv', steps.some(s => s.id === 'trim' && s.rounds >= P.n) ? 'the loop used all ' + P.n + ' rounds without settling in this closure' : null, 'warn');
    app.io.set({
      commands: S.arr === 'B' ? [{ name: 'Anchor', value: 'steps of ' + P.q + ' mm', note: 'gun moves r x anchor, r = ' + (P.k1 / (P.k1 + P.k2)).toFixed(2) }, { name: 'Clamp', value: lockIn ? 'closed' : 'open', unit: '' }]
        : S.arr === 'F' ? [{ name: 'Arm swing and plunge', value: 'bring within capture', note: 'the seat, not the arm, sets the pose' }]
        : [{ name: 'Arm axis', value: 'steps of ' + P.q + ' mm' }].concat(S.arr === 'C' ? [{ name: 'Bungee anchors', value: P.nullRel ? 'nulled to arm force' : 'not moved' }] : []),
      observes: [
        { name: 'Dot vs seam, one axis', value: cur.x.toFixed(3), unit: 'mm', status: 'partly', note: 'the scene shows the true value; a camera would read it with noise ' + P.sc + ' mm' },
        { name: 'Shift at the last handover', value: cur.kind === 'shift' ? sgn(cur.dx) : '-', unit: cur.kind === 'shift' ? 'mm' : '', status: 'blind', note: 'invisible until the next look' },
        { name: 'Weld load change', value: P.match ? 'inside the last look (80 % matched)' : P.dF + ' N', status: P.match ? 'partly' : 'blind', note: 'not observed unless the dry state carries the weld loads' },
        { name: 'Arm force (case C)', value: S.arr === 'C' ? (P.nullRel ? 'read by a load cell' : 'not read') : '-', status: S.arr === 'C' && P.nullRel ? 'partly' : 'blind', note: 'null precision = force noise / bungee stiffness = ' + (P.sF / P.kb).toFixed(2) + ' mm' },
      ],
      manual: ['Placing the gun by hand in the first state', 'Choosing and tuning springs, clamp and seat'],
    });
  }

  // ------------------------------------------------------------------ controls
  const a = app.ui.group('Arrangement and state');
  a.radio({ id: 'arr', label: 'Arrangement', options: Object.keys(ARR).map(k => ({ value: k, label: ARR[k].label })), value: 'B', kind: 'branch', help: 'Four ways the gun changes hands on the way to the weld. Nothing is ranked.', onChange: v => { S.arr = v; render(); } });
  a.slider({ id: 'state', label: 'State', min: 0, max: 5, step: 1, value: 2, kind: 'state', help: 'Step through the closure: hand, grip, trim, clamp or release, weld. Shows one state; the histogram below covers whole closures.', onChange: v => { S.state = Math.round(v); render(); } });
  a.button({ id: 'again', label: 'New closure (re-roll the hand and the noise)', kind: 'view', onClick: () => { S.seed = (S.seed * 1664525 + 1013904223) >>> 0; render(); } });
  const b = app.ui.group('Look and load');
  b.toggle({ id: 'after', label: 'Look again after the last handover (B)', value: true, kind: 'state', help: 'After the clamp closes a camera reads again; if outside, the clamp opens, the anchor trims, the clamp closes again.', onChange: v => { P.after = !!v; render(); } });
  b.toggle({ id: 'match', label: 'Dry state carries the weld loads (room-13)', value: false, kind: 'state', help: 'Gas on, wire jogged, trigger path loaded (laser off) during the last look; only 20 percent of the load change is left for the weld.', onChange: v => { P.match = !!v; render(); } });
  b.toggle({ id: 'nullrel', label: 'Null the arm force before it lets go (C)', value: false, kind: 'state', help: 'Software moves the bungee anchors until the arm reads about zero force, then the arm opens.', onChange: v => { P.nullRel = !!v; render(); } });
  b.slider({ id: 'dF', label: 'Load change at the weld', min: 0, max: 5, step: 0.1, value: 1.0, unit: 'N', kind: 'scene', help: 'Wire feed conduit, gas hose, trigger, vibration. Unmeasured.', onChange: v => { P.dF = v; render(); } });
  b.slider({ id: 'w', label: 'Window (±)', min: 0.02, max: 0.5, step: 0.01, value: 0.10, unit: 'mm', kind: 'scene', help: 'What the weld tolerates is not known.', onChange: v => { P.w = v; render(); } });
  b.slider({ id: 'sc', label: 'Camera noise (1-sigma)', min: 0.005, max: 0.3, step: 0.005, value: 0.05, unit: 'mm', kind: 'scene', help: 'The real noise for a dot in a 6 mm recess is unknown.', onChange: v => { P.sc = v; render(); } });
  const c = app.ui.group('Stiffness (N/mm at the dot)');
  c.slider({ id: 'ka', label: 'Arm (A, C)', min: 0.5, max: 40, step: 0.5, value: 5, unit: 'N/mm', kind: 'scene', onChange: v => { P.ka = v; render(); } });
  c.slider({ id: 'kb', label: 'Bungees (A, C)', min: 0.05, max: 5, step: 0.05, value: 0.15, unit: 'N/mm', kind: 'scene', help: 'Derek’s two bungees holding one axis steadyish.', onChange: v => { P.kb = v; render(); } });
  c.slider({ id: 'kL', label: 'Clamp closed (B)', min: 2, max: 200, step: 1, value: 50, unit: 'N/mm', kind: 'scene', onChange: v => { P.kL = v; render(); } });
  c.slider({ id: 'fg', label: 'Guide friction (B)', min: 0.01, max: 0.6, step: 0.01, value: 0.15, unit: 'N', kind: 'scene', help: 'Dead band = friction / (k1 + k2).', onChange: v => { P.fg = v; render(); } });
  const d = app.ui.group('Shifts at the handovers (1-sigma)');
  d.slider({ id: 'bm', label: 'Mean shift at a grip or clamp (bias)', min: 0, max: 0.3, step: 0.01, value: 0, unit: 'mm', kind: 'scene', help: 'A closing that always pushes the same way. Zero in the defaults.', onChange: v => { P.bm = v; render(); } });
  d.toggle({ id: 'learn', label: 'The AI learns the bias over many closures and removes it', value: false, kind: 'state', help: 'Only the scatter is left. This is what hundreds of logged closures are for.', onChange: v => { P.learn = !!v; render(); } });
  d.slider({ id: 'sh', label: 'Where the hand leaves it', min: 0.1, max: 3, step: 0.1, value: 1.0, unit: 'mm', kind: 'scene', onChange: v => { P.sh = v; render(); } });
  d.slider({ id: 'sg', label: 'Arm grip closing', min: 0, max: 0.6, step: 0.01, value: 0.15, unit: 'mm', kind: 'scene', onChange: v => { P.sg = v; render(); } });
  d.slider({ id: 'sl', label: 'Clamp closing', min: 0, max: 0.4, step: 0.005, value: 0.05, unit: 'mm', kind: 'scene', help: 'Travel-05b: unmeasured. Larger than the window and the loop cannot converge.', onChange: v => { P.sl = v; render(); } });
  d.slider({ id: 'ss', label: 'Seat scatter (F)', min: 0.005, max: 0.2, step: 0.005, value: 0.03, unit: 'mm', kind: 'scene', help: 'use-02: 5 microns per contact is about 25 to 30 microns at the dot.', onChange: v => { P.ss = v; render(); } });
  d.slider({ id: 'q', label: 'Finest command step', min: 0.001, max: 0.1, step: 0.001, value: 0.01, unit: 'mm', kind: 'scene', help: 'The arm axis at the dot, or the anchor in B.', onChange: v => { P.q = v; render(); } });
  render();
})();
</script>
</body>
</html>
