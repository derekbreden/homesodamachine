  const stage = app.stageEl;

  // ---------------------------------------------------------------- model (same as explorers/datum/calc/plate_target.js)
  const TAU = Math.PI * 2, DEG = Math.PI / 180;

const F = 1500, U0 = 640, V0 = 480, RI = 61.85, RO = 63.5, PORT = 19.05, PZ = 6.35;
// pose p = [cx, cy, H, tx, ty, ds]; world z up, rim plane z = 0, plate outer face at z = -(6.35 + ds)
function project(X, p) {

}
function backproject(uv, p, zPlane) {                 // pixel -> point on the plane z = zPlane, for a camera with pose p
  const xn = (uv[0] - U0) / F, yn = (uv[1] - V0) / F;

    const J = Array.from({ length: r.length }, () => new Array(n).fill(0));
    for (let j = 0; j < n; j++) { const h = j < 3 ? 1e-3 * (j === 2 ? 100 : 1) : (j < 5 ? 1e-6 : 1e-4), pp = p.slice(), pm = p.slice(); pp[j] += h; pm[j] -= h; const a = model(pp), b = model(pm); for (let i = 0; i < a.length; i++) { J[2 * i][j] = (a[i][0] - b[i][0]) / (2 * h); J[2 * i + 1][j] = (a[i][1] - b[i][1]) / (2 * h); } }
    const A = Array.from({ length: n }, () => new Array(n).fill(0)), g = new Array(n).fill(0);
    for (let i = 0; i < r.length; i++) for (let a = 0; a < n; a++) { g[a] += J[i][a] * r[i]; for (let b = 0; b < n; b++) A[a][b] += J[i][a] * J[i][b]; }
    for (let a = 0; a < n; a++) { if (!free[a]) { for (let b = 0; b < n; b++) { A[a][b] = 0; A[b][a] = 0; } A[a][a] = 1; g[a] = 0; } else A[a][a] *= 1 + lam; }
    const dx = lsolve(A, g.map(v => -v)); if (!dx) break;

  const m = model(p), n2 = 2 * m.length, J = Array.from({ length: n2 }, () => new Array(n).fill(0));
  for (let j = 0; j < n; j++) { const h = j < 3 ? 1e-3 * (j === 2 ? 100 : 1) : (j < 5 ? 1e-6 : 1e-4), pp = p.slice(), pm = p.slice(); pp[j] += h; pm[j] -= h; const a = model(pp), b = model(pm); for (let i = 0; i < a.length; i++) { J[2 * i][j] = (a[i][0] - b[i][0]) / (2 * h); J[2 * i + 1][j] = (a[i][1] - b[i][1]) / (2 * h); } }
  const A = Array.from({ length: n }, () => new Array(n).fill(0)); for (let i = 0; i < n2; i++) for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) A[a][b] += J[i][a] * J[i][b];
  for (let a = 0; a < n; a++) if (!free[a]) { for (let b = 0; b < n; b++) { A[a][b] = 0; A[b][a] = 0; } A[a][a] = 1; }

function lsolve(A, b) { const n = b.length, M = A.map((r, i) => r.concat([b[i]])); for (let i = 0; i < n; i++) { let m = i; for (let r = i + 1; r < n; r++) if (Math.abs(M[r][i]) > Math.abs(M[m][i])) m = r; if (Math.abs(M[m][i]) < 1e-14) return null;[M[i], M[m]] = [M[m], M[i]]; for (let r = 0; r < n; r++) if (r !== i) { const f = M[r][i] / M[i][i]; for (let c = i; c <= n; c++) M[r][c] -= f * M[i][c]; } } return M.map((r, i) => r[n] / r[i]); }

function run(P, seed) {
  const r = rng(seed), NP = 48;
  const pTrue = [P.cx, P.cy, P.H, P.tx * DEG, P.ty * DEG, P.ds];
  const pts = features(P.ds, NP), obs = pts.map(X => { const q = project(X, pTrue); return [q[0] + P.sigma * gauss(r), q[1] + P.sigma * gauss(r)]; });
  const pNom = [0, 0, P.Hnom, 0, 0, 0];

  const p0 = pNom.slice(); if (dsSrc === 'touch') p0[5] = P.ds + 0.03 * gauss(r);
  const fit = solve(obs, features(0, NP), p0, P.sigma, [true, true, true, true, true, dsSrc === 'fit']);

  const dotW = [RI - P.a, 0, -(PZ + P.ds)];

  const dotObs = noisy(project(dotW, pTrue)), edgeObs = noisy(project([RI, 0, 0], pTrue)), axisObs = project([0, 0, 0], pTrue);
  const ux = edgeObs[0] - axisObs[0], uy = edgeObs[1] - axisObs[1], un = Math.hypot(ux, uy), ex = ux / un, ey = uy / un;

  const P = { cx: 10, cy: 0, H: 300, tx: 0, ty: 2, ds: 0.4, a: 0.20, sigma: 0.15, dsSrc: 'fit', seed: 3 };

    g.append(S('circle', { cx: X(61.85), cy: Z(0), r: 3, fill: '#e2e8f0' })); g.append(T(X(61.85) - 8, Z(0) - 8, 'rim edge', 'tw', 'end'));
    // parallax bracket on the plate plane
    g.append(line(X(61.85), Z(zp) - 10, X(xRimAtPlate), Z(zp) - 10, { stroke: '#f5a524', 'stroke-width': 3 })); g.append(T(X(61.85) - 6, Z(zp) - 18, 'parallax ' + R.parTrue.toFixed(2) + ' mm', 'ta hot', 'end'));
    g.append(T(14, 46, 'up to the camera: H ' + P.H + ' mm, ' + P.cx + ' mm toward the station, tilt ' + P.ty + '°', 'ts'));
    g.append(T(14, 318, 'dashed: the ray through the rim edge, which the wall stops; solid: the ray to the corner', 'tf'));
  }

  // image (1280 x 960 px) drawn at 0.32
  function drawImage(g) {
    const x0 = 424, y0 = 30, w = 426, h = 320, k = w / 1280;
    g.append(T(x0, 22, 'What the camera sees (one frame; overlays are the fit)', 'tb'));
    g.append(rect(x0, y0, w, h, { fill: '#0f141b', stroke: '#2a3341', rx: 6 }));
    const pTrue = [P.cx, P.cy, P.H, P.tx * DEG, P.ty * DEG, P.ds], q = R.last, pf = q.pose;
    const U = uv => [x0 + uv[0] * k, y0 + uv[1] * k];
    const circ = (pp, r, z, cls) => { const pts = []; for (let i = 0; i <= 96; i++) { const a = TAU * i / 96; pts.push(U(project([r * Math.cos(a), r * Math.sin(a), z], pp))); } return pts; };
    g.append(poly(circ(pTrue, RO, 0), { stroke: '#94a3b8', 'stroke-width': 1.2 })); g.append(poly(circ(pTrue, RI, 0), { stroke: '#e2e8f0', 'stroke-width': 1.6 }));
    g.append(poly(circ(pTrue, RI, -(PZ + P.ds)), { stroke: '#14b8a6', 'stroke-width': 1.2 }));
    [PORT, -PORT].forEach(px => g.append(poly((() => { const pts = []; for (let i = 0; i <= 40; i++) { const a = TAU * i / 40; pts.push(U(project([px + 5.56 * Math.cos(a), 5.56 * Math.sin(a), -(PZ + P.ds)], pTrue))); } return pts; })(), { stroke: '#f1f5f9', 'stroke-width': 1.2, fill: '#0b1017' })));
    g.append(poly(circ(pf, RI, 0), { stroke: '#34d399', 'stroke-width': 1, 'stroke-dasharray': '3 3' }));
    g.append(poly(circ([0, 0, P.H, 0, 0, 0], RI, 0), { stroke: '#f5a524', 'stroke-width': 1, 'stroke-dasharray': '2 4' }));
    g.append(T(x0 + 8, y0 + 16, 'white rim edge; teal corner; green fitted rim; amber rim for a level camera on the axis', 'tf'));
    // inset around the station, magnified
    const ix = x0 + 8, iy = y0 + h - 118, iw = 150, ih = 110, mag = 6;
    g.append(rect(ix, iy, iw, ih, { fill: '#0b1017', stroke: '#475569' })); g.append(T(ix + 4, iy + 12, 'station, ×' + mag + ' on the image', 'tf'));
    const c = project([RI, 0, -(PZ + P.ds)], pTrue), cc = [ix + iw / 2 + 8, iy + ih / 2 + 6];
    const V = uv => [cc[0] + (uv[0] - c[0]) * k * mag, cc[1] + (uv[1] - c[1]) * k * mag];
    const rim = V(project([RI, 0, 0], pTrue)), cornerT = V(c), pn = V(project([RI, 0, -PZ], [0, 0, P.H, 0, 0, 0])), dotUV = V(project([RI - P.a, 0, -(PZ + P.ds)], pTrue));
    const rimN = V(project([RI, 0, 0], [0, 0, P.H, 0, 0, 0])), cornerF = V(project([RI, 0, -(PZ + pf[5])], pf)), rimF = V(project([RI, 0, 0], pf));
    [[rim, '#e2e8f0', 'rim'], [cornerT, '#14b8a6', 'corner'], [dotUV, '#ff3b30', 'dot']].forEach(([p, colr, t]) => { g.append(S('circle', { cx: p[0], cy: p[1], r: 3, fill: colr })); });
    g.append(S('circle', { cx: pn[0], cy: pn[1], r: 4, fill: 'none', stroke: '#f5a524' })); g.append(S('circle', { cx: cornerF[0], cy: cornerF[1], r: 4, fill: 'none', stroke: '#34d399' }));
    g.append(T(ix + 4, iy + ih - 6, 'corner: true, nominal (amber), fitted (green)', 'tf'));
  }

  function drawReads(g) {
    const x0 = 12, y0 = 386;
    g.append(T(x0, y0 - 14, 'Three ways of reading the dot against the seam (error in mm at the plate, rms over 24 frames)', 'tb'));
    const rows = [['The rim edge is the seam', R.e[0], 'no parallax correction: the whole parallax is the error', '#f5a524'], ['Parallax predicted for a level camera on the axis, assumed depth', R.e[1], 'right only where the camera is', '#94a3b8'], ['Parallax from the fitted pose and depth (' + ({ fit: 'perspective', nominal: 'assumed', touch: 'touched' })[P.dsSrc] + ')', R.e[2], 'pose from the rim circles and ports in this frame', '#34d399']];
    rows.forEach((r, i) => {
      const yy = y0 + 8 + i * 42;
      g.append(rect(x0 - 4, yy - 14, 850, 36, { fill: '#10161e', stroke: '#2a3341', rx: 4 })); g.append(rect(x0 - 4, yy - 14, 5, 36, { fill: r[3] }));
      g.append(T(x0 + 8, yy + 2, r[0], 'tw')); g.append(T(x0 + 8, yy + 15, r[2], 'tf'));
      g.append(rect(x0 + 560, yy - 6, 210, 10, { fill: '#0b1017', stroke: '#2a3341', rx: 2 })); g.append(rect(x0 + 560, yy - 6, Math.min(210, r[1] / 3.0 * 210), 10, { fill: r[3], rx: 2, opacity: 0.85 }));
      g.append(T(x0 + 780, yy + 3, r[1].toFixed(2) + ' mm', 'tw hot'));
    });
    g.append(T(x0 + 560, y0 + 8 + 3 * 42 - 6, 'bars: full scale 3 mm', 'tf'));
    const y1 = y0 + 150, q = R.last, pf = q.pose, sd = q.sd || [];
    g.append(T(x0, y1, 'What the fit recovers in the drawn frame (truth in brackets)', 'tb'));
    const items = [['camera x (toward the station)', pf[0].toFixed(1) + ' mm', '[' + P.cx.toFixed(1) + ']', sd[0]], ['camera height H', pf[2].toFixed(1) + ' mm', '[' + P.H + ']', sd[2]], ['tilt about the tangent', (pf[4] / DEG).toFixed(2) + '°', '[' + P.ty.toFixed(2) + ']', sd[4] ? sd[4] / DEG : null], ['seat depth error', pf[5].toFixed(2) + ' mm', '[' + P.ds.toFixed(2) + ']', sd[5]]];
    items.forEach((it, i) => { const yy = y1 + 18 + i * 15; g.append(T(x0, yy, it[0], 'tg')); g.append(T(x0 + 210, yy, it[1], 'tw')); g.append(T(x0 + 290, yy, it[2], 'tf')); g.append(T(x0 + 350, yy, it[3] != null ? '± ' + (it[3] < 1 ? it[3].toFixed(3) : it[3].toFixed(1)) : '', 'tf')); });
    const rx = 470;
    const nl = wrap(g, rx, y1 + 18, 'Depth from perspective: rms error ' + R.dsRms.toFixed(2) + ' mm over the draws (predicted ' + R.dsSd.toFixed(2) + ' mm). It improves as the camera comes closer (about 0.1 mm at 150 mm, 0.35 at 300, 0.8 at 450) and enters the corner prediction only by the tangent of the line-of-sight angle, about 0.2.', 62, 'tm');
    wrap(g, rx, y1 + 18 + nl * 13 + 8, 'Parallax = 6.35 mm x tan(angle between the line of sight and the axis at the station); the dot\'s reading is its image distance inside the rim edge less this.', 62, 'tf');
    return q;
  }

  function updateIO() {
    const q = R.last;
    app.io.set({
      commands: [{ name: 'Nothing moves', value: '-', note: 'an observer; any support' }],
      observes: [
        { name: 'Camera pose in the tube frame', value: 'fit per frame', status: 'seen', note: 'rim circles and ports; roll from the ports modulo 180°' },
        { name: 'Seat depth', value: (q.dsFit).toFixed(2), unit: 'mm ± ' + R.dsSd.toFixed(2), status: 'partly', note: 'weak from far away; near-camera or a touch' },
        { name: 'Dot minus corner (radial)', value: q.fitted.toFixed(2), unit: 'mm (truth ' + P.a.toFixed(2) + ')', status: 'partly', note: 'the parallax removed by the fit' },
        { name: 'Corner itself', value: '-', status: 'blind', note: 'in shadow at the wall\'s foot; predicted, not seen' },
        { name: 'Dot vs melt', value: '?', status: 'unresolved', note: '[unknown]' },
      ],
      manual: ['The 360° roll: a tack or a paint dot', 'A touch of the plate if the perspective depth is too loose'],
    });
  }
  function render() {
    while (gDyn.firstChild) gDyn.removeChild(gDyn.firstChild);
    drawSide(gDyn); drawImage(gDyn); drawReads(gDyn);
    app.badge('par', R.e[0] > 1 ? 'reading the dot against the rim edge is wrong by ' + R.e[0].toFixed(1) + ' mm here: the corner is 6.35 mm below it' : null, 'warn');
    updateIO();
  }

  // ---------------------------------------------------------------- controls
  const gc = app.ui.group('The camera (scene edits, illustrative)', { open: true });
  gc.slider({ id: 'H', label: 'Height over the rim', min: 150, max: 450, step: 10, value: 300, unit: 'mm', kind: 'scene', help: 'Parallax and depth precision both change with it.', onChange: v => { P.H = v; compute(); render(); } });
  gc.slider({ id: 'cx', label: 'Offset toward the station', min: -60, max: 60, step: 1, value: 10, unit: 'mm', kind: 'scene', help: 'A shell-mounted camera stands well to the station side.', onChange: v => { P.cx = v; compute(); render(); } });
  gc.slider({ id: 'ty', label: 'Tilt about the tangent', min: -10, max: 10, step: 0.5, value: 2, unit: '°', kind: 'scene', onChange: v => { P.ty = v; compute(); render(); } });
  gc.slider({ id: 'sigma', label: 'Pixel noise per feature point', min: 0.05, max: 0.6, step: 0.05, value: 0.15, unit: 'px', kind: 'scene', help: 'Sub-pixel edge and centroid fits; an assumption.', onChange: v => { P.sigma = v; compute(); render(); } });
  const gt = app.ui.group('The tube and the reading (scene edits)', { open: true });
  gt.slider({ id: 'ds', label: 'Seat depth error (plate deeper than 6.35 mm)', min: -0.6, max: 0.6, step: 0.05, value: 0.4, unit: 'mm', kind: 'scene', help: '[unknown] spread.', onChange: v => { P.ds = v; compute(); render(); } });
  gt.radio({ id: 'dsSrc', label: 'Seat depth for the prediction comes from', options: [{ value: 'fit', label: 'Perspective fit' }, { value: 'nominal', label: 'Assumed 6.35 mm' }, { value: 'touch', label: 'A touch (0.03 mm)' }], value: 'fit', kind: 'branch', onChange: v => { P.dsSrc = v; compute(); render(); } });
  gt.button({ id: 'again', label: 'Another set of frames', kind: 'state', onClick: () => { P.seed++; compute(); render(); } });
  compute(); render();
})();
</script>
