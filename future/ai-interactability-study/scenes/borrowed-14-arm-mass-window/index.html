      proposes: '<p>freedom-02 gives the gun a gas-spring arm for the weight and a vernier and camera for the location. Two things about the arm decide whether that works, and both are about mass. <b>What is the payload?</b> It is not only the gun: it is everything on the tip, including the vernier stage that does the locating. <b>How exact must the spring match it?</b> The arm stays put while the spring and the payload differ by less than friction can hold, and in grams that is friction divided by (g &times; reach): about &plusmn;0.09 kg for the friction (0.4 N&middot;m) and reach (0.45 m) freedom-02 uses.</p>' +

      ['Mismatch the friction holds at ' + f1(P.th, 0) + '°', '±' + f2(tol) + ' kg', 'friction ' + f2(P.taf) + ' N·m ÷ (g × ' + f2(P.L) + ' m × cos)'],
      ['Arm at ' + f1(P.th, 0) + '° with this payload', '<span class="' + cls + '">' + st.state + '</span>', 'net ' + f2(st.net) + ' N·m against ±' + f2(P.taf)],
      ['With +' + f2(P.dm) + ' kg (fibre share moves)', '<span class="' + cls2 + '">' + st2.state + '</span>', 'the change the arm has to forgive'],
      ['Rated ranges that include this payload', inList.length + ' of ' + PRODUCTS.length, inList.length ? inList.join('; ') : 'none of the listed ranges: a heavier or lighter class is needed'],
    ];
    tbl.innerHTML = '<table><tr><th>Quantity</th><th>Value</th><th>Reading</th></tr>' + rows.map(x => '<tr><td>' + x[0] + '</td><td class="n">' + x[1] + '</td><td>' + x[2] + '</td></tr>').join('') + '</table><p class="note">A rated range is a window on mass only. It does not state balance error, friction, reach or tip stiffness. Ranges and counts are from the listings in sourcing/borrowed.md (Prime, 2026-09-28/29); nothing here has been ordered or weighed.</p>';
    status.textContent = 'Arm ' + st.state + ' at ' + f1(P.th, 0) + '°; the mismatch tolerance here is ±' + f2(tol) + ' kg';
    status.className = 'status ' + (st.holds ? 'good' : 'bad');
    capL.textContent = (P.type === 'gas' ? 'Gas spring (freedom-02 model, error slope ' + P.eps + ' per rad).' : P.type === 'coil0' ? 'Spring and parallelogram, zero-length spring: torque = k a b cos(th), exact at every angle for one payload.' : 'Spring and parallelogram, plain spring with free length ' + f1(P.l0 * 1000, 0) + ' mm: the error grows away from the set angle.');
    app.badge('mis', Math.abs(mis) > tol ? 'spring set ' + f2(Math.abs(mis)) + ' kg ' + (mis > 0 ? 'heavy' : 'light') + ': more than friction forgives (±' + f2(tol) + ' kg) at ' + f1(P.th, 0) + '°' : null, 'warn');
    app.badge('floor', m < 2 && P.type === 'gas' && P.md < 2 ? 'a monitor-arm gas spring cannot be set below its 2 kg rating: not this payload' : null, 'info');
    app.io.set({
      commands: [{ name: 'Shoulder', value: 'passive', note: 'a small motor is possible: gravity is cancelled (freedom-02 entry 6)' }],
      observes: [
        { name: 'Payload', value: f2(m), unit: 'kg', status: 'partly', note: 'a load cell in the vernier would read it; here it is the sum of parts' },
        { name: 'Arm angle', value: f1(P.th, 0), unit: '°', status: 'seen', note: 'an encoder at the shoulder' },
        { name: 'Balance error slope', value: P.type === 'gas' ? f2(P.eps) + ' /rad' : 'from geometry', status: 'unresolved', note: 'not on any listing; measure on the arm' },
      ],
      manual: ['Weigh the parts', 'Choose the arm and set its spring', 'Trim with ballast in grams'],
    });
  }
  function redraw() { drawArm(); drawChart(); drawStrip(); drawTable(); }

  // ---------- controls
  const g1 = app.ui.group('What hangs on the tip (scene edits)');
  const sl = (g, id, label, min, max, step, val, unit, fn, help) => g.slider({ id: id, label: label, min: min, max: max, step: step, value: val, unit: unit, kind: 'scene', help: help, onChange: v => { fn(v); redraw(); } });
  sl(g1, 'gun', 'Gun and shell', 0.6, 2.5, 0.05, 1.2, 'kg', v => { P.gun = v; }, 'Unknown: weigh it. freedom-02 uses 1.2 to 1.5.');
  sl(g1, 'vern', 'XZ vernier stage (two rails with motors)', 0, 1.5, 0.05, 0.6, 'kg', v => { P.vern = v; }, 'The stage that freedom-02 adds to place the dot. Two mini linear rails with NEMA 11 motors: mass not on the listing.');
  sl(g1, 'cam', 'Camera and bracket', 0, 0.6, 0.05, 0.15, 'kg', v => { P.cam = v; });
  sl(g1, 'cable', 'Share of the fibre carried by the arm', 0, 0.8, 0.05, 0.35, 'kg', v => { P.cable = v; }, 'freedom-02 entry 4: 0.35 kg.');
  sl(g1, 'ballast', 'Ballast', 0, 1.5, 0.025, 0, 'kg', v => { P.ballast = v; }, 'Trim in grams; a fishing weight is 25 to 50 g.');
  const g2 = app.ui.group('The arm and its spring');
  g2.radio({ id: 'type', label: 'Spring', kind: 'branch', value: 'coil0', options: [
    { value: 'gas', label: 'Gas spring (freedom-02 model)' }, { value: 'coil', label: 'Spring and parallelogram, plain spring' }, { value: 'coil0', label: 'Spring and parallelogram, zero-length spring' }],
    onChange: v => { P.type = v; redraw(); } });
  sl(g2, 'L', 'Reach (shoulder to tip)', 0.3, 0.9, 0.01, 0.45, 'm', v => { P.L = v; });
  sl(g2, 'md', 'Spring set for', 0.3, 5, 0.05, 2.3, 'kg', v => { P.md = v; }, 'What the spring is adjusted to carry. A bought arm sets this with a screw or hex key within its rating.');
  g2.button({ id: 'match', label: 'Set the spring to the payload', kind: 'scene', onClick: function () { app.ui.set('md', Math.round(total() * 20) / 20); } });
  sl(g2, 'taf', 'Joint friction at the shoulder', 0.05, 2, 0.05, 0.4, 'N·m', v => { P.taf = v; }, 'freedom-02: 0.4 (illustrative).');
  g2.slider({ id: 'eps', label: 'Gas spring balance error', min: 0, max: 0.5, step: 0.01, value: 0.15, unit: '/rad', kind: 'scene', noVisual: true, help: 'Only for the gas spring.', onChange: v => { P.eps = v; redraw(); } });
  g2.slider({ id: 'l0', label: 'Plain spring free length', min: 0, max: 90, step: 1, value: 40, unit: 'mm', kind: 'scene', noVisual: true, help: 'Only for the plain spring. 0 is the zero-length spring.', onChange: v => { P.l0 = v / 1000; redraw(); } });
  const g3 = app.ui.group('Use');
  sl(g3, 'th', 'Arm angle (set by hand)', -20, 50, 1, 5, '°', v => { P.th = v; }, 'Inside the friction window the arm stays where it is put.');
  sl(g3, 'dm', 'Change of payload as the arm moves', 0, 0.5, 0.01, 0.1, 'kg', v => { P.dm = v; }, 'Mostly the fibre’s share: 0.09 kg is a quarter of 0.35 kg.');

  redraw();
})();
</script>
</body>
</html>
