      proposes:
        '<p>Today a hand holds the gun. The digest’s thin region: <b>the hand supplies the motion and software supplies resistance or guidance.</b> Every other arrangement in the study gives software a position to command, and a position command overrules the hand. Here software is given a <b>force</b> only, through a soft anchor: a bungee (or a spring) whose far end a small motor moves. The force is stiffness × stretch, so its size is bounded by the stroke and by a cap, and a hand can always push through it. That is freedom-01c’s soft element used as a force source, in parallel with the hand instead of in series with a stage.</p>' +
        '<p>Three helps, one at a time or together. <b>Centring:</b> a pull toward the seam, proportional to the error. <b>Wall:</b> no force inside a band, a push back outside it, so the hand is free while it is good enough. <b>Damper:</b> resistance to fast motion (a dashpot or an adjustable damper on the support), a mechanical low-pass filter for tremor that leaves the slow drift to the hand and the guide. The time trace at the top is a made-up hand (drift, tremor, a delayed visual correction) against a runout of 0.125 mm; it is there to show which band each help works in, not to predict a result.</p>' +
        '<p>Bottom left: the algebra that does not depend on the hand model. A guide that is a spring of stiffness K<sub>g</sub> moved through a stroke S, in parallel with a hand of stiffness K<sub>h</sub>, can move the gun by at most K<sub>g</sub>S / (K<sub>h</sub> + K<sub>g</sub>), and never with more than the cap.</p>',
      carries:
        '<p>The weight goes to a passive support (a balancer or the arm of freedom-02); the hand and the guiding bungee push on the gun on top of it. <b>Purple</b> is the motor that moves the bungee’s far end. <b>Green</b> is the bungee. <b>Amber</b> is the hand. The scene is one axis (radial) and one number for the gun’s position; the tangent is free and the vertical is the same picture again.</p>',

      tried:
        '<p><b>Found (arithmetic, no hand model):</b> a force moves a relaxed hand only a little. A bungee of 0.15 N/mm through a 20 mm stroke can apply 3 N, and against a hand that yields 2 mm per newton (K<sub>h</sub> 0.5 N/mm) that moves the gun 4.6 mm at the extreme of the stroke and 0.3 mm at 0.2 N. So the stroke the guide needs is small: 0.2 N is 1.3 mm of bungee stretch. A tense hand (3 N/mm) cuts every figure by six. The cap keeps the hand in charge; a position command through the same stroke would not.</p>' +
        '<p><b>Found (made-up hand):</b> with drift 0.08 mm/s, tremor 0.06 mm at 10 Hz and a delayed visual correction (chosen so that the hand alone is about 0.17 mm rms; that choice is mine), centring cuts the rms error to 0.13 mm, the wall to 0.15 mm, the damper to 0.16 mm and centring with the damper to 0.13 mm, with peak guide forces of 0.1 to 0.2 N. The damper helps least because tremor is a small share of the error; it is the only help that needs no eye. The numbers move with every slider of the hand; the order does not much.</p>' +
        '<p><b>Found:</b> a stiffer centring pull is not better. The hand already steers by eye, so a proportional guide is a second loop with its own delay (the eye\u2019s 0.25 s); asked for 2 N/mm it chatters. The wall is silent inside the band and cannot fight a hand that is already good.</p>' +
        '<p><b>The damper is a rotary part with no number (borrowed’s critique).</b> The bought damper is a fluid head, not a dashpot at the grip: a rotary damper acts on the dot through its lever, c at the dot = c rotary ÷ lever². 0.05 N·s/mm at a 202 mm lever is 2.0 N·m·s/rad; at the nose seat’s 70 mm 0.25; and a head sized to critically damp freedom-08’s pendulum (0.13 N·m·s/rad) gives only 0.003 N·s/mm at the dot, a corner near 30 Hz, no filter at all for a 10 Hz tremor. So the design variable is the lever, and the listings give drag steps, not values: a spring scale on a fluid head’s handle at walking pace measures it. The readouts convert both ways. The scene’s help stays on the gun; the same help on a haptic knob instead is borrowed-19, a different arrangement (the hand turns a knob, the gun sits on a stage) that stays as borrowed drew it.</p>' +
        '<p><b>Left standing:</b> the hand\u2019s stiffness, tremor, drift and correction are unmeasured, and a hand that knows the gun is pushing may stiffen. A centring pull turns any bias of the eye into a steady push (badge). Whether an operator accepts a gun that pushes back is not something a scene can show.</p>',

        '<li>Seam motion: 0.125 mm radial amplitude once per revolution at 8 mm/s (half the rig’s TIR limit) [repo, acceptance not measurement].</li>' +

  hh.slider({ id: 'Kh', label: 'Hand stiffness at the grip', min: 0.1, max: 3, step: 0.1, value: 0.5, unit: 'N/mm', kind: 'scene', help: '[unknown]: how far the hand yields per newton.', onChange: v => { S.Kh = v; update(); } });
  hh.slider({ id: 'drift', label: 'Drift', min: 0, max: 0.1, step: 0.005, value: 0.08, unit: 'mm/s', kind: 'scene', onChange: v => { S.drift = v; update(); } });
  hh.slider({ id: 'tremor', label: 'Tremor at 10 Hz', min: 0, max: 0.2, step: 0.01, value: 0.06, unit: 'mm', kind: 'scene', onChange: v => { S.tremor = v; update(); } });
  hh.slider({ id: 'hg', label: 'Visual correction gain', min: 0, max: 1, step: 0.05, value: 0.2, unit: '1/s', kind: 'scene', onChange: v => { S.hg = v; update(); } });
  hh.slider({ id: 'seed', label: 'Random seed', min: 1, max: 9, step: 1, value: 1, kind: 'scene', noVisual: true, onChange: v => { S.seed = v; update(); } });
  update();
})();
</script>
