      proposes: '<p><b>Sweep.</b> A small radial axis moves the beam across the seam. The spot travels along the plate, reaches the corner, then climbs the wall (1.6 mm of height for each millimetre of shift at a 32° beam tilt). In a camera that sees both surfaces, the spot’s image path <i>changes speed or direction exactly at the corner</i>. Fit two lines, read the break, and you know where the corner is in the axis’s own units. No calibration of the camera or of where the gun is is needed. That is the offset software needs to place the dot a chosen distance from the corner.</p>' +
        '<p><b>Bounce.</b> If the plate is mirror-like, the beam reflects off it and lands on the wall. Off the corner there are always two spots, one on each surface; on the corner they merge into one. The wall spot sits higher than the plate spot is short of the corner (by cot of the tilt: 1.6 x at 32°), so the pair separation is a magnified, easy-to-see ruler for a small radial offset. For a low camera across the bore it is about 19 times more sensitive than watching a single dot against the corner.</p>' +

  // ---------------------------------------------------------------- geometry

  svg1.append(S('rect', { x: 0, y: Y(0), width: X(0), height: 2.4 * K1, fill: wm, opacity: 0.9 }), S('rect', { x: X(0), y: Y(6.35), width: 1.65 * K1, height: 8.35 * K1, fill: wm, opacity: 0.9 }), S('text', { x: X(2), y: Y(6.4), class: 'lbl-g', text: 'wall, rim at 6.35' }), S('text', { x: 6, y: Y(-1), class: 'lbl-g', text: 'plate (metal)' }));
  const nozzle = S('polygon', { fill: gm, opacity: 0.95 }), beamL = S('line', { stroke: lm, 'stroke-width': 2 }), spotD = S('circle', { r: 5, fill: lm }), spotB = S('circle', { r: 5, fill: '#f59e0b', opacity: 0.9 }), refl = S('line', { stroke: '#f59e0b', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }), cornerMark = S('circle', { cx: X(0), cy: Y(0), r: 4, fill: 'none', stroke: '#60a5fa', 'stroke-width': 2 });
  const sT = S('text', { class: 'lbl-r' }), bT = S('text', { class: 'lbl-y' }), gapT = S('text', { x: 8, y: 18, class: 'lbl-s' });
  svg1.append(nozzle, beamL, refl, spotB, spotD, cornerMark, sT, bT, gapT);

  // ---------------------------------------------------------------- image panel
  const VW2 = 480, VH2 = 330, cx2 = 210, cy2 = 262;
  const svg2 = S('svg', { viewBox: '0 0 ' + VW2 + ' ' + VH2 }); c2.appendChild(svg2);
  const gI = S('g'); svg2.appendChild(gI);

  // ---------------------------------------------------------------- update
  function sweepFit(pts) {   // pts: [{a, u, v}] -> best break in a (continuous piecewise-linear, both image coordinates)
    let best = { cost: Infinity, ac: 0 };
    const lo = pts[2].a, hi = pts[pts.length - 3].a;
    for (let ac = lo; ac <= hi; ac += 0.02) {

  }
  function solve3(A, b) { const M = A.map((r, i) => r.concat(b[i])); for (let i = 0; i < 3; i++) { let p = i; for (let k = i + 1; k < 3; k++) if (Math.abs(M[k][i]) > Math.abs(M[p][i])) p = k; if (Math.abs(M[p][i]) < 1e-12) return null; [M[i], M[p]] = [M[p], M[i]]; for (let k = i + 1; k < 3; k++) { const f = M[k][i] / M[i][i]; for (let j = i; j < 4; j++) M[k][j] -= f * M[i][j]; } } const x = [0, 0, 0]; for (let i = 2; i >= 0; i--) { let s = M[i][3]; for (let j = i + 1; j < 3; j++) s -= M[i][j] * x[j]; x[i] = s / M[i][i]; } return x; }

  function update() {
    app.ui.enable('spec', app.ui.get('mode') === 'bounce'); app.ui.enable('want', app.ui.get('mode') === 'sweep'); app.ui.enable('noise', app.ui.get('mode') === 'sweep'); app.ui.enable('stick', app.ui.get('mode') === 'sweep'); app.ui.enable('look', app.ui.get('mode') === 'sweep');
    const mode = app.ui.get('mode'), a = app.ui.get('act'), s = a - D0, be = beta();
    const b = basis(app.ui.get('psi'), app.ui.get('el')), pxmm = app.ui.get('px'), sig = app.ui.get('sig');
    const scale = 1 / pxmm;   // px per mm

    const sp = spotAt(s), tipR = (sp.surf === 'plate' ? s : 0 - 0) , dotX = sp.surf === 'plate' ? s : 0, dotZ = sp.surf === 'plate' ? 0 : s * cot();

    spotD.setAttribute('cx', X(hitX)); spotD.setAttribute('cy', Y(hitZ)); spotD.style.display = sp.surf === 'none' ? 'none' : '';

    refl.style.display = spotB.style.display = bT.style.display = showB ? '' : 'none';
    if (showB) { refl.setAttribute('x1', X(hitX)); refl.setAttribute('y1', Y(hitZ)); refl.setAttribute('x2', X(bn.p[0])); refl.setAttribute('y2', Y(bn.p[2])); spotB.setAttribute('cx', X(bn.p[0])); spotB.setAttribute('cy', Y(bn.p[2])); bT.setAttribute('x', X(bn.p[0]) + 8); bT.setAttribute('y', Y(bn.p[2]) - 8); bT.textContent = 'bounce'; }
    sT.setAttribute('x', X(hitX) + 8); sT.setAttribute('y', Y(hitZ) + 16); sT.textContent = sp.surf === 'none' ? 'beam clears the rim: no spot' : 'spot on the ' + sp.surf;
    gapT.textContent = 'actuator ' + a.toFixed(2) + ' mm    corner is at ' + D0.toFixed(2) + ' (hidden from the software)    offset s = ' + s.toFixed(2) + ' mm';
    // image panel

    const zoom = 24;   // svg px per mm of image plane

    gI.appendChild(S('text', { x: 8, y: 16, class: 'lbl-g', text: 'orthographic view; 1 camera pixel = ' + pxmm.toFixed(3) + ' mm at the corner; drawn at 24 screen px per mm' }));

      note.innerHTML = '<b>Sweep.</b> The dots are the spot in successive frames while the actuator moves from -7 to +9 mm (grey on the plate, amber on the wall; past ' + (RIMH / cot() + D0).toFixed(1) + ' mm on the axis the beam clears the rim and there is no spot). The path changes ' + (kink.K > 0.4 ? 'sharply' : kink.K > 0.15 ? 'weakly' : 'not at all') + ' at the corner: kink strength <span class="dp-read">' + kink.K.toFixed(2) + '</span>; image speed ' + kink.plate.toFixed(2) + ' on the plate, ' + kink.wall.toFixed(2) + ' on the wall (per mm of sweep). Fitted break: <span class="dp-read">' + ac.toFixed(2) + ' mm</span> (true ' + D0.toFixed(2) + ', error ' + (err >= 0 ? '+' : '') + err.toFixed(3) + ' mm; model 1-sigma ' + (isFinite(sigEst) ? sigEst.toFixed(3) : 'undefined') + ' mm). Lambert brightness of the spot: plate ' + Math.abs(b.v[2]).toFixed(2) + ', wall ' + Math.abs(b.v[0]).toFixed(2) + '.' + stickTxt;

      const spec = app.ui.get('spec'), R = 0.6, ratio = R * spec, lobe = (2 + 12 * (1 - spec)) * D, pathLen = Math.abs(s) / Math.sin(be);

            const sepMm = Math.hypot(pd[0] - pbo[0], pd[1] - pbo[1]);

      note.innerHTML = '<b>Bounce.</b> Off the corner there are two spots, the direct dot and its bounce, one on each surface; they merge when the dot is on the corner (offset s = 0). Separation now <span class="dp-read">' + (sepMm / pxmm).toFixed(1) + ' px</span> for an offset of ' + Math.abs(s).toFixed(2) + ' mm. Per mm of offset the pair moves ' + (pairMm / pxmm).toFixed(1) + ' px apart, against ' + (singleMm / pxmm).toFixed(1) + ' px for the single dot walking toward the corner: a gain of <span class="dp-read">x' + (pairMm / Math.max(singleMm, 1e-6)).toFixed(1) + '</span> from this camera. Brightness bounce / direct = reflectance 0.6 x specular ' + spec.toFixed(2) + ' = <span class="dp-read">' + ratio.toFixed(2) + '</span>; the bounce blurs to about ' + (pathLen * Math.tan(lobe)).toFixed(2) + ' mm across on the wall.';
      app.badge('kink', null); app.badge('dim', ratio < 0.15 ? 'a rough plate: the bounce spot is too dim to use' : null, 'warn');
      app.io.set({
        commands: [{ name: 'Radial axis', value: a.toFixed(2), unit: 'mm', note: 'moves the dot toward the merge of the two spots' }],
        observes: [
          { name: 'Two-spot pattern present', value: Math.abs(s) < 0.05 ? 'merged: dot is on the corner' : 'two spots', status: ratio >= 0.15 ? 'seen' : 'blind', note: ratio >= 0.15 ? '' : 'bounce too dim at this finish' },
          { name: 'Separation along the profile', value: (sepMm / pxmm).toFixed(1), unit: 'px', status: 'partly', note: 'proportional to the offset: (1 + cot(tilt)) x |s|' },
          { name: 'Which spot is the direct dot (sign of the offset)', value: d.surf === 'plate' ? 'on the plate: short of the corner' : 'on the wall: past the corner', status: 'partly', note: 'the direct spot is the brighter one (ratio < 1)' },
