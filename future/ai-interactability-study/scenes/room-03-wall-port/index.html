      carries: '<p><b>Amber</b> carries: the rod and tail carry the gun about the ball, and the counterweight balances it. <b>Teal</b> locates: the ball centre (fixed in the plate) and the wedge that sets the coarse tilt. <b>Purple</b> moves under software: plate slide, insertion, and the two tail actuators. The gun (dark) is a rigid body on the rod: nothing stretches; the only lengths that change are actuator strokes.</p>' +

      software: '<p>Everything the software would command is outside the cabinet, out of spatter and fume, and behind the interlocked lid. Everything it would observe is inside: cameras look at the dot and the seam. The cabinet\'s walls are also what makes unattended dry runs and welds safe to schedule. The I/O panel lists what is seen, blind or manual for the current pose.</p>',

  // ---------------------------------------------------------------- the 3D model (kit's proxy at the opening pose)

  const q0 = pose0.quaternion.clone();

  const svg = WK.svg('svg', { viewBox: '0 0 1000 1030', role: 'img', 'aria-label': 'wall-port mechanism: elevation, plan and seam corner' });
  const box = document.createElement('div'); box.className = 'r3'; box.appendChild(svg); app.stageEl.appendChild(box);
  const el = (tag, attrs, parent) => { const n = WK.svg(tag, attrs); (parent || svg).appendChild(n); return n; };
  const F = (n) => (Math.round(n * 10) / 10);

  function hull(pts) {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]); if (p.length < 3) return p;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    p.forEach(pt => { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], pt) <= 0) lo.pop(); lo.push(pt); });
    p.slice().reverse().forEach(pt => { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], pt) <= 0) up.pop(); up.push(pt); });

  }
  // gun solids in the local frame (kit proxy numbers): returns arrays of world 3D point lists per solid
  const gripStart = V(0, -25, 172), gripEnd = V(0, -111, 232), gripLen = gripStart.distanceTo(gripEnd), gripDir = gripEnd.clone().sub(gripStart).normalize();
  const gripPerp = gripDir.clone().cross(V(1, 0, 0)).normalize();
  function gunSolids(m) {
    const out = [];
    const boxPts = (c, ax, hx, hy, hz) => { const pts = []; [-1, 1].forEach(a => [-1, 1].forEach(b => [-1, 1].forEach(c2 => { pts.push(c.clone().addScaledVector(ax[0], a * hx).addScaledVector(ax[1], b * hy).addScaledVector(ax[2], c2 * hz)); }))); return pts; };

  }
  function drawGun(m, proj, tf, parent) {

  }

  function arrowSvg(g, x1, y1, x2, y2, color, w) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (L < 2) return;

  }
  // Does the gun's barrel or nozzle touch the tube? Drawn-scene check on the proxy geometry (barrel radius from the kit's proxy,
  // nozzle tip above the plate, rim circle and the wall face). tip/back are world vectors (back = unit vector from the nozzle toward the
  // back of the gun); tubeOff is the tube frame's translation; seat is the plate offset. Returns clearances in mm (negative = contact).
  function nozzleClear(tip, back, tubeOff, seat) {

    pts.forEach(p => {
      const d = new THREE.Vector3(p[0], p[1], p[2]).sub(t0), t = Math.max(0, Math.min(118, d.dot(b))), q = t0.clone().addScaledVector(b, t);

  // ---------------------------------------------------------------- render
  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const m = model();
    // ---- derived numbers
    const rho = S.d / S.Lt;
    const seam = WK.seamOffset(m.D);
    const beam = m.uh.clone();
    const tilt = Math.acos(Math.min(1, u0.dot(beam))) / DEG;
    const bend = (arm, Fv) => { const t = arm.clone().cross(Fv), a = t.dot(m.uh); return t.clone().addScaledVector(m.uh, -a).length(); };
    const gripW = worldOf(m, WK.GRIP_BASE_LOCAL.toArray()), comW = worldOf(m, [0, -23, 181]);

    app.badge('ret', S.ret ? 'rod retracted 170 mm for a tube swap: the dot is not at the seam' : null, 'info');
    app.badge('tilt', tilt > 3 ? 'tilt ' + tilt.toFixed(1) + '° from the wedge setting: beyond the trim a ball allows (illustrative 3°)' : null, 'warn');

  geo.slider({ id: 'od', label: 'Rod tube outside diameter (aluminium)', min: 12, max: 50, step: 1, value: 38, unit: 'mm', kind: 'scene', visual: 'the rod through the ball; the bend panel', help: 'Wall 2 mm up to OD 30, 3 mm above. The bend at the dot goes as 1/EI: OD 20 gives about 2.4 mm, OD 38 (a 1-1/2 in tube) about 0.2 mm at the default load (eyes-14, calc/rod-under-tilt.mjs).', onChange: v => { S.od = v; render(); } });
  geo.slider({ id: 'pull', label: 'Cable pull at the grip base (illustrative)', min: 0, max: 5, step: 0.1, value: 2, unit: 'N', kind: 'scene', onChange: v => { S.pull = v; render(); } });
  geo.slider({ id: 'play', label: 'Ball play (illustrative)', min: 0, max: 0.2, step: 0.005, value: 0.05, unit: 'mm', kind: 'scene', help: 'Clearance at the ball. Shown at the dot as play x (1 + d/Lt) if the tail is held still.', onChange: v => { S.play = v; render(); } });
  geo.toggle({ id: 'cw', label: 'Counterweight fitted on the tail', value: true, kind: 'state', help: 'Off: gravity bends the rod about the ball and the actuators carry it.', onChange: v => { S.cw = v; render(); } });
})();
</script>
