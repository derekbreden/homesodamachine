    stage: 'custom',
    open: ['proposes', 'tried'],
    sections: {
      proposes: '<p>The gun is moved along <b>one axis at a time</b> while the red reference dot sits in the recessed corner. Nothing else is needed to learn something about the tube: the wall is a hard edge for the dot. As the dot crosses the seam it climbs the wall, and from above (camera A) the part of it on the plate <i>vanishes</i>. The axis value where half the dot is gone is the wall position in the software\'s own coordinates. That is a touch probe made of light.</p>' +
        '<p>Three extra signals ride on the same dot. <b>Spot size</b> is smallest at focus, so a height sweep gives the plate height (the standoff meter). If the plate is mirror-like, the plate <b>reflects</b> the dot as a second spot up the wall; its height above the seam is a ruler for how far the dot still is from the corner (camera B). The sign of the height error is ambiguous at the focus, so the software dithers.</p>' +
        '<p>The beam comes from inside the bore over the plate, as in the reference corner inset. Scene geometry is exact; what the cameras <i>would</i> see is drawn from an explicit, simple model (see Assumptions).</p>',
      carries: '<p>Not modelled: any positioner that moves the gun radially by fractions of a millimetre will do, and the tangent slide costs almost nothing (0.008 mm per mm at r = 61.85 mm). The idea needs a motion axis and a way to read it (step count is enough for a sweep), not a particular arm.</p>',
      tried: '<ul>' +
        '<li><b>Beam from outside the bore.</b> A beam arriving over the rim from outside cannot reach the corner once it is steeper than atan(1.65 / 6.35) = 14.6° from vertical (rim shadow, [derived] from the 1.65 mm wall and 6.35 mm recess). The dot from inside has no such limit, so the probe assumes the inside approach. Assumption behind it: the gun body can stand over the bore. What it leaves open: the inside approach puts the barrel across the bore.</li>' +
        '<li><b>Height error looks like radial error.</b> Raising the gun moves the dot along the plate by tan β per mm (0.62 mm per mm at 32°), so the plate-only image cannot separate them. Repair: the second signal, spot size, depends on height alone. Not repaired: near focus the size curve is flat, so the software has to dither in height and compare.</li>' +
        '<li><b>Wall hits are invisible from straight above, not from a camera over the bore.</b> Straight down over the station the wall spot is edge-on and the dot vanishes at the seam. A camera over the bore centre looks at the wall face at atan(61.85 / H) (11.6° at 300 mm, 22° at 150): the wall part of the dot then shows in a strip 6.35 tan ψ wide beyond the seam foot (1.30 mm at 11.6°), foreshortened, and the total visible fraction stays near 100 % through the crossing. The plate side of the seam foot still falls to 50 % when the dot\'s centre is on the seam (calc/knee_view_angle.py), so the knee is unchanged <i>if the software knows where the seam foot is in the picture</i>; without that line the centroid of everything visible bends from slope 1 to 0.33 over about 0.7 mm and the knee is hard to call. The rim edge is 6.35 tan ψ from the seam foot in the image: reading the dot against the rim edge is wrong by that (datum, wave 2). Repair: the seam foot\'s image position from the rim and ports fit (datum-19), or a camera over the station; camera B or the reflection ruler still gives the wall spot height, only if the plate is specular. Try the ψ slider.</li>' +
        '<li><b>Try it.</b> Raise the spot size and see the knee round off; set the plate to matte and see the ruler vanish; lower camera B and see the gun body block it.</li></ul>',
      unresolved: '<ul><li>What the dot actually looks like at the 316L corner (size at focus, brightness under shop light, whether the plate face is specular enough to throw a second spot) is <b>[unknown]</b>. A photograph with a phone at a few heights would answer most of it.</li>' +
        '<li>Where the seam foot is in camera A\'s picture. Straight above the station it is where the dot vanishes; from a camera over the bore it has to come from the tube\'s own rim and ports (datum-19), whose fit has not been run on a real frame <b>[unknown]</b>.</li>' +
        '<li>Whether the dot can be switched or blinked by software (which would allow frame-differencing against glare) depends on the laser box\'s RS232 protocol, which the manual pages here do not give <b>[unknown]</b>.</li>' +
        '<li>How the dot relates to where the infrared beam melts is not a dry-run quantity: it needs a witness mark. The probe finds the dot, not the melt.</li></ul>',
      assumptions: '<ul><li>Recess 6.35 mm and wall 1.65 mm are the repo\'s numbers <b>[repo]</b>. Beam 32° from vertical and 16 mm nozzle-to-dot are the reference scene\'s illustrative values <b>[illustrative]</b>.</li>' +
        '<li>Spot diameter d = d0 · sqrt(1 + ((s − 16)/4)²), d0 = 0.5 mm: a Rayleigh-style curve <b>[illustrative]</b>; nobody has measured the dot.</li>' +
        '<li>Camera A reports the part of the dot on the plate side of the seam foot, a line whose image position is assumed known (from the rim and ports fit, datum-19); the wall part appears foreshortened in the wall-face strip when its line of sight is off vertical (default 11.6°, a camera 300 mm over the bore centre). Camera B sees the wall face at a shallow angle; its blocking test is a 2D line against the drawn barrel, with no optics, glare or fume.</li>' +

        '<li>"Software\'s reading" adds Gaussian noise of the chosen size to the values; the truth in the scene is exact and hidden from the estimators.</li></ul>'

    o.d = cen.t == null ? st.d0 : st.d0 * Math.sqrt(1 + Math.pow((s - st.f) / st.zR, 2));
    const n = 25, plate = [], wall = [], rim = [], outside = [];
    o.rays = [];

        { name: 'Spot size', value: o.center.kind === 'outside' ? '–' : (o.d + nz() * 0.5).toFixed(2), unit: 'mm', status: 'partly', note: 'smallest at focus; sign of height error needs a dither' },
        { name: 'Reflected-spot height (camera B)', value: o.bSeesSec ? (o.secZ + nz()).toFixed(2) : '–', unit: o.bSeesSec ? 'mm above seam' : '', status: o.bSeesSec ? 'partly' : 'blind', note: st.surface === 'matte' ? 'matte plate: none' : (o.sec.length && !o.bSeesSec ? 'blocked by the gun' : 'needs a specular plate: unverified') },
        { name: 'Dot height on the wall', value: o.wall.length ? '–' : '–', status: 'blind', note: 'wall spot is invisible to A; B sees it only if the gun does not block' },
        { name: 'Gun-to-work standoff', value: '–', status: 'unresolved', note: 'inferred from spot size only; no direct sensor' },
      ],
      manual: ['Rough setup so the dot starts on the plate, 2 to 8 mm short of the wall', 'Checking that the real plate reflects the dot (a phone photo)'],
    });
  }

  function update() {
    const o = sim(st.xg, st.zg);
    if (o.collide) { app.badge('col', 'gun body would touch the wall or plate: pose held at the last valid one', 'limit'); }
    else { app.badge('col', null); lastValid = o; }
    const show = o.collide && lastValid ? lastValid : o;
    last = show;
    drawMain(show); drawA(show); drawB(show); drawPlots(); statusFor(o); ioUpdate(show);
    // truth marker in the main view: seam is at r = 0 by construction (drawn); note the beam origin moves with the axes
  }

  // ------------------------------------------------------------------ run a sweep (noisy samples, knee estimate)
  function run() {
    const kind = st.plot, lo = kind === 'radial' ? -8 : -6, hi = 8, stp = 0.25;
    const pts = [];
    for (let v = lo; v <= hi + 1e-9; v += stp) {
      const o = kind === 'radial' ? sim(v, st.zg) : sim(st.xg, v);
      if (o.collide) continue;
      pts.push({ v: v, frac: Math.max(0, Math.min(1, o.frac + randn() * st.noise * 0.5)), cen: o.centroidA == null ? null : o.centroidA + randn() * st.noise, d: o.d + randn() * st.noise * 0.5, kindHit: o.center.kind, sec: o.bSeesSec ? o.secZ + randn() * st.noise : null, a: o.a });
    }
    samples = { kind: kind, pts: [] }; estimate = { kind: kind, done: false, at: 0 };
    let i = 0;
    app.ui.enable('run', false);
    if (runAnim) runAnim();
    runAnim = app.onFrame(function (dt) {
      if (!samples) return false;
      if (i >= pts.length) { finish(pts, kind); runAnim = null; app.ui.enable('run', true); return false; }
      const n = Math.max(1, Math.round(dt * 60 * 1.6));
      for (let k = 0; k < n && i < pts.length; k++) samples.pts.push(pts[i++]);
      drawPlots(); return true;
    });
    app._dirty = true;
  }
  function finish(pts, kind) {
    samples.pts = pts;
    const tb = Math.tan(st.beta * RAD);
    if (kind === 'radial') {
      let at = null;   // knee: where the visible fraction falls through 0.5 (linear interpolation between samples)
      for (let i = 1; i < pts.length; i++) if (pts[i - 1].frac >= 0.5 && pts[i].frac < 0.5) { const t = (pts[i - 1].frac - 0.5) / (pts[i - 1].frac - pts[i].frac); at = pts[i - 1].v + t * (pts[i].v - pts[i - 1].v); break; }
      estimate = { kind: kind, done: at != null, at: at };
      runs.radial = at == null ? null : { at: at, zg: st.zg };
      const o = sim(st.xg, st.zg), ruler = o.bSeesSec ? st.xg + (o.secZ + randn() * st.noise) * tb : null;
      result.dataset.radial = at == null ? '<span class="bad">No knee found: the dot never left the plate, or never reached it. Move the start point.</span>' :
        '<b>Radial sweep, height ' + fmt(st.zg, 1) + ': the dot leaves the plate at axis ' + fmt(at, 2) + ' mm</b><br><span class="k">scene truth for this height:</span> ' + fmt(kneeTruth(), 2) + ' mm · <b>error ' + fmt(at - kneeTruth(), 2) + ' mm</b> (step 0.25 mm, noise ' + st.noise.toFixed(2) + ' mm)' +
        (ruler != null ? '<br><b>One-frame ruler</b> at the current pose: ' + fmt(ruler, 2) + ' mm (error ' + fmt(ruler - kneeTruth(), 2) + ' mm)' : '<br><span class="k">no ruler at this pose (blocked, matte, or dot out of range)</span>');
    } else {
      const on = pts.filter(p => p.kindHit === 'plate'); let best = null;
      on.forEach(p => { if (!best || p.d < best.d) best = p; });
      let at = best ? best.v : null;
      if (best) { const i = pts.indexOf(best); if (i > 0 && i < pts.length - 1 && pts[i - 1].kindHit === 'plate' && pts[i + 1].kindHit === 'plate') { const y0 = pts[i - 1].d, y1 = pts[i].d, y2 = pts[i + 1].d, den = y0 - 2 * y1 + y2; if (Math.abs(den) > 1e-9) at = pts[i].v + 0.25 * 0.5 * (y0 - y2) / den; } }
      estimate = { kind: kind, done: at != null, at: at };
      runs.height = at == null ? null : { at: at, xg: st.xg };
      result.dataset.height = at == null ? '<span class="bad">The dot left the plate during this sweep: lower the radial start.</span>' :
        '<b>Height sweep: smallest spot at axis ' + fmt(at, 2) + ' mm</b> (plate at focus)<br><span class="k">scene truth:</span> ' + fmt(-st.plateOff, 2) + ' mm · <b>error ' + fmt(at + st.plateOff, 2) + ' mm</b>. Near focus the size curve is flat: the loosest of these estimates.';
    }
    let html = (kind === 'radial' ? result.dataset.radial : result.dataset.height) || '';
    if (runs.radial && runs.height) {
      const tubeEst = runs.radial.at + (runs.radial.zg - runs.height.at) * tb, zEst = runs.height.at;
      html += '<hr style="border:0;border-top:1px solid #2a3341;margin:6px 0"><b>Both sweeps together: dot on the seam at focus is at axis (x, z) = (' + fmt(tubeEst, 2) + ', ' + fmt(zEst, 2) + ') mm</b><br><span class="k">scene truth:</span> (' + fmt(st.tubeOff, 2) + ', ' + fmt(-st.plateOff, 2) + ') · <b>error (' + fmt(tubeEst - st.tubeOff, 2) + ', ' + fmt(zEst + st.plateOff, 2) + ')</b>. The knee alone mixes wall position with height (tan β per mm); the focus sweep separates them.';
    } else if (runs.radial || runs.height) html += '<br><span class="k">Run the other sweep too: the radial knee depends on height, and the focus depends only on height.</span>';
    result.innerHTML = html;
    drawPlots(); app._dirty = true;
  }

  // ------------------------------------------------------------------ controls
  const ax = app.ui.group('Proposed axes (software could command)', { help: 'Two motions of the gun. Nothing carries them here; any positioner that can step 0.05 mm would do.' });
  ax.slider({ id: 'xg', label: 'Gun radial axis', min: -8, max: 8, step: 0.05, value: -1.5, unit: 'mm', kind: 'actuator', visual: 'gun barrel, beam and dot in the section', help: '+ moves the gun and dot toward the wall. The seam sits at an unknown axis value (see Setup unknowns).', onChange: v => { st.xg = v; update(); } });
  ax.slider({ id: 'zg', label: 'Gun height axis', min: -6, max: 8, step: 0.05, value: 0, unit: 'mm', kind: 'actuator', visual: 'gun barrel, beam and dot in the section', help: 'Raising the gun moves the dot along the plate (tan β per mm) and changes the standoff.', onChange: v => { st.zg = v; update(); } });
  const sw = app.ui.group('The software\'s sweep', { help: 'A scan is a run of noisy readings; the estimate is computed from those readings only.' });
  sw.radio({ id: 'plot', label: 'Sweep which axis', options: [{ value: 'radial', label: 'radial (knee)' }, { value: 'height', label: 'height (focus)' }], value: 'radial', kind: 'view', help: 'The plots show the ideal curves; a run adds the noisy samples and the estimate.', onChange: v => { st.plot = v; cancelRun(); samples = null; estimate = null; drawPlots(); } });
  sw.button({ id: 'run', label: 'Run the sweep', kind: 'state', help: 'Steps the chosen axis across its range, reads camera A and B at each step, then estimates the seam or plate position.', onClick: run });
  const un = app.ui.group('Setup unknowns (scene edits: what the tube is really like this time)', { help: 'These edit the explanatory scene. The software does not know them; a good sweep recovers them.' });
  un.slider({ id: 'tubeOff', label: 'Where the wall really is (axis)', min: -4, max: 4, step: 0.05, value: 1.2, unit: 'mm', kind: 'scene', visual: 'the seam in axis coordinates (pink dashed line in the plots)', help: 'How the tube happened to sit this time.', onChange: v => { st.tubeOff = v; resetRuns(); update(); } });
  un.slider({ id: 'plateOff', label: 'Plate seated deeper by', min: -3, max: 3, step: 0.05, value: 0.8, unit: 'mm', kind: 'scene', visual: 'plate height in the plots', help: 'Tube-to-tube variation in seat depth [unknown how much].', onChange: v => { st.plateOff = v; resetRuns(); update(); } });
  const md = app.ui.group('Model choices (scene edits, illustrative)');
  md.slider({ id: 'beta', label: 'Beam angle from vertical', min: 15, max: 50, step: 1, value: 32, unit: '°', kind: 'scene', visual: 'beam and barrel', help: '32° is the reference scene\'s opening pose value, not a requirement.', onChange: v => { st.beta = v; resetRuns(); update(); } });
  md.slider({ id: 'd0', label: 'Spot size at focus', min: 0.2, max: 2.5, step: 0.05, value: 0.5, unit: 'mm', kind: 'scene', visual: 'red spot on the plate', help: 'Bigger spot: rounder knee, softer focus. Unknown for the real dot.', onChange: v => { st.d0 = v; resetRuns(); update(); } });
  md.radio({ id: 'surface', label: 'Plate surface', options: [{ value: 'mirror', label: 'mirror' }, { value: 'satin', label: 'satin' }, { value: 'matte', label: 'matte' }], value: 'mirror', kind: 'branch', help: 'Decides whether a second spot appears on the wall.', onChange: v => { st.surface = v; resetRuns(); update(); } });
  md.slider({ id: 'psi', label: 'Camera A: line of sight off vertical (toward the wall face)', min: 0, max: 30, step: 0.5, value: 11.6, unit: '°', kind: 'scene', visual: 'camera A, its line of sight and panel A', help: '0 = straight down over the station (the gun stands there). 11.6° = a camera 300 mm above the bore centre; 22° = 150 mm. Sets how much of the wall face camera A sees and how far the rim edge appears from the seam foot.', onChange: v => { st.psi = v; update(); } });
  md.slider({ id: 'noise', label: 'Camera noise (position)', min: 0, max: 0.3, step: 0.01, value: 0.04, unit: 'mm', kind: 'scene', help: 'Noise added to every value the software reads. Made up.', onChange: v => { st.noise = v; update(); } });
  md.slider({ id: 'hB', label: 'Camera B height above the rim', min: 10, max: 160, step: 5, value: 60, unit: 'mm', kind: 'scene', visual: 'camera B and its sight lines', help: 'Low: the gun body blocks the view of the wall spot.', onChange: v => { st.hB = v; update(); } });

  app.io.manual(['Rough setup so the dot starts on the plate']);
  update();
})();
</script>
</body>
</html>
