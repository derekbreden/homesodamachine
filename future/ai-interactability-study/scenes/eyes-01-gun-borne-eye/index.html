(function () {
  const V = (x, y, z) => new THREE.Vector3(x, y, z), P = WK.prim, DEG = WK.deg, RI = WK.INNER_RADIUS, ZC = WK.CAP_TOP, X = V(1, 0, 0);
  const app = WK.app({
    view: 'overall', viewButtons: ['overall', 'joint', 'top', 'side'],
    views: {
      overall: { target: [10, -85, 175], dir: [-0.62, 0.34, 0.56], dist: 1000 },
      joint: { target: [58, -12, 160], dir: [-0.8, 0.26, 0.46], dist: 210 },
      top: { target: [20, -85, 150], dir: [0, -0.0035, 1], dist: 800 },
      side: { target: [10, -85, 150], dir: [0.03, -1, 0.05], dist: 1100 },
    },
    open: ['proposes', 'tried'],
    sections: {
      proposes: '<p>A camera and a line laser are mounted on the printed shell that already wraps the gun. The camera looks at the dot and the inside corner from a few centimetres away. The line laser draws a thin line across the plate and up the wall; the line kinks at the corner, so the corner is easy to find in the image even on shiny stainless.</p>' +
        '<p>The point: the camera moves with the gun, so it measures the <b>seam relative to the dot</b> directly. Nothing has to know where the gun is in the world. The support can be loose and slow. A small two-axis <b>trim stage</b> (purple) between the support and the shell removes the leftover error. Use <b>Run the loop</b> to let the software do it.</p>' +
        '<p>Then set a <b>calibration bias</b> and run the loop again. The loop drives the <i>estimate</i> to zero, and the dot ends up wrong by the bias. The corner inset (exact scene geometry) shows the truth. The camera cannot tell you its own bias; a ground-truth view can (eyes-07).</p>' +
        '<p><b>What “loose” has to mean.</b> A support that is soft in translation still has to hold the gun’s <i>turn</i>, or a change in the umbilical’s pull tips the beam while the eye reads zero. Pick how the stage’s tilt is held, raise the <i>umbilical pull change</i>, and close the loop: the dot stays on the seam and the inset’s beam angle does not. Then look at the panel <i>What the lines can tell about the tilt</i>: one fan leaves one turn completely blind; a second fan (a cross-hair module) or a gravity sensor closes it.</p>',
      carries: '<p><b>Amber</b>: the printed shell carries the gun to a lug on the housing; a short rod carries the lug to the trim stage base. <b>Slate</b>: the post on the bench and what hangs from it. <b>Green</b>: the elastics that carry the stage’s weight and set its softness; their stretch is the <i>support drift</i> (a scene edit: nobody commands it). Three supports are drawn: one elastic from an overhead arm (nothing holds the tilt), two elastics to a spreader bar (a little), and a swing arm with a vertical guide rod (the tilt is held; radial softness is the arm’s swing, vertical softness the spring). The blue arrow at the umbilical exit is the pull change, a scene edit; its real size is unknown.</p>' +
        '<p>The lug position, the 70 mm rod and every stiffness are illustrative. Where the gun’s weight really balances, and whether the umbilical pulls on the shell, are unknown. Gun poses A, B, C are set by hand at setup; only a support that holds tilt keeps them.</p>',
      software: '<p>Software reads the corner position from the image (here: truth + a chosen bias + noise; the scene only decides whether the corner is <i>in view</i> from the drawn geometry) and commands the two trim axes with a proportional gain. The dot itself is <b>not</b> what is measured: it is fixed in the gun frame, so its pixel is a calibration constant. What varies in the image is where the corner is.</p>' +
        '<p>The two lines also carry the turns: their slopes change with the beam’s tilt. The panel is a linearised error model (0.3 px line-fit noise, illustrative), not a measurement: which of the gun’s five observable numbers each configuration can read, and which it cannot see at all.</p>' +
        '<p>Bandwidth is not the problem: with the 0.25 mm / 0.30 mm runout limits and 8 mm/s, the seam moves relative to a fixed gun by at most about 0.02 mm/s (calc/runout-rates.mjs). The turn-the-tube-with-runout switch shows the loop following it.</p>',
      tried: '<p><b>Broke:</b> a camera on the housing, 150 mm or more behind the nozzle. The scene says <i>corner not visible: blocked by gun</i>. Looking almost along the beam, the camera sees the nozzle tip standing right in front of the dot and the corner beside it. The view has to be more than about 12 to 15° off the beam axis (nozzle proxy radius 2 to 5 mm at 16 mm from the dot, illustrative). <b>Repaired:</b> the barrel between 30 and about 130 mm behind the tip works at the 27 mm stalk in poses A and C; a longer stalk would move the limit back. <b>Cost:</b> a camera 60 to 110 mm from the dot is close to the spatter (unresolved).</p>' +
        '<p><b>Broke:</b> the same camera position in another pose. In pose B the line laser is blocked at clock angles 0° and 60°, and the corner is lost at 60° and 120° for some positions (sweep the clock slider). <b>Left standing:</b> the mounting has to be chosen per pose or the pose family fixed; nothing here says which poses will be used.</p>' +
        '<p><b>Found:</b> the camera on the barrel sees the kinked line beside the nozzle, but not the dot itself, which the nozzle hides from that side. That is fine for this measurement: the dot is fixed in the gun frame, and the corner is what varies.</p>' +
        '<p><b>Broke:</b> closing the loop on a biased estimate. With bias 0.3 / -0.2 mm the loop drives the estimate to zero and the dot ends up wrong by minus the bias (measured in the scene: 0.27 / -0.19 after six steps). <b>Left standing:</b> the loop cannot see its own bias. That is why eyes-07 exists.</p>' +
        '<p><b>Broke:</b> stage travel. The trim is limited to +/-6 mm (illustrative); beyond that the stage stops and a LIMIT badge shows. A loose support with a larger drift needs manual re-placement first.</p>' +
        '<p><b>Broke (found by freedom, wave 2):</b> the support as first drawn. One elastic ran from a post at about 13° above horizontal to the stage: a line that shallow carries the gun’s weight only at several times the weight in tension, so it was a symbol of “loose”, not a load path; and one line to one lug is a ball joint, so nothing held the beam’s turn. <b>Repaired:</b> the stage now hangs from an overhead arm on vertical elastics, and the radio <i>How the stage’s tilt is held</i> compares one elastic, two spread elastics and a swing arm with a guide rod. With freedom’s statics (1.2 kg, illustrative) a newton of pull change moves the dot 1.44 mm radially and 4.22 mm vertically and turns the beam 1.3° on one elastic; 0.15 / 2.16 mm and 0.84° on two spread elastics (1.8 N·m/rad); 0.45 / 1.03 mm and 0.02° when the base holds the tilt (100 N·m/rad). The trim is spent by 1 to 6 N of pull change, and the eye reports the dot on the seam throughout. <b>Left standing:</b> the pull itself is unknown; freedom-11 draws the nose seat, which holds the tilt near the dot.</p>' +
        '<p><b>Broke (mine):</b> the fan plane was recomputed from world +X at every pose, so it followed the gun’s rotation instead of being fixed in the gun. That is right only at the reference rotation. It is now fixed in the gun frame (through the emitter and the dot, rolled about that axis by <i>Fan roll</i>).</p>' +
        '<p><b>Found (freedom’s question):</b> the two lines and the spot give four numbers for the five that a straight corner lets any camera observe (the sixth, a slide along the seam, changes nothing in the picture). So one fan always leaves one combination of the three turns completely blind: with the fan through the radial direction it is the turn about the radial axis; other fan rolls give a mixture. The plate line’s slope changes only 0.2° per degree of turn about the tangent (about 1 px at the far end of an 18 mm line, not 7), but the fit is precise enough to read that turn to about 0.15° (0.3 px noise); the vertical-axis turn shows only in the short wall line, about 0.8°. A gravity sensor (0.3°, illustrative) closes the radial-axis turn; a second, crossed fan closes all five to about 0.1 to 0.15°. <b>Left standing:</b> a hobby cross-hair has uncalibrated fan angles (two more unknowns), and every figure here assumes the line is found without bias.</p>',
      unresolved: '<p>Does the corner show on stainless? Contrast of an inside corner between two shiny surfaces, reflections of the nozzle and hand in the plate, and the line laser’s double reflection in the corner are not drawn. Does the 0.3 mW dot show under the camera at all? Does the red pointer stay on while emitting, and can the camera survive the melt-pool light without a filter (unknown)? Spatter and fume on the lens. Minimum focus distance of the camera at 60 to 110 mm. Whether the interlock or the gun electronics tolerate the extra cable along the shell.</p>' +
        '<p>The umbilical’s pull at the exit (unknown; freedom-15 lists how to measure it with a spring scale), whether the support moves when the wire feeds or the gas starts, and what holds the tilt in a real support. The fan plane and the camera are calibrated to each other only by a ground-truth view.</p>' +
        '<p>Question for Derek: with a phone camera 10 cm from the nozzle, looking at the corner past the wire, does the corner line show? Does a green line look like a kink to your own eye from where you stand?</p>',
      assumptions: '<ul><li>Gun proxy follows the manual’s 253 x 143 x 34 mm envelope [manual p.17]; barrel, housing, grip, wire guide, the 60° pitch and 16 mm nozzle clearance are illustrative (kit).</li>' +
        '<li>The pose presets are variants of the reference scene’s three rotations. Choosing one re-places the support (it is a variant, not a motion).</li>' +
        '<li>Camera: 1280 px across, field of view 15-70°. mm-per-pixel = 2 d tan(fov/2) / 1280 at the dot. [illustrative]</li>' +
        '<li>Estimate = exact offset + bias + a fixed pseudo-noise. Only availability comes from the drawn geometry. Not a sensor model. [illustrative]</li>' +
        '<li>Trim stage +/-6 mm, gain 0.6 per step, 4 steps per second. [illustrative]</li>' +
        '<li>Per-newton drift and tilt of the three supports: freedom’s statics (explorers/freedom/calc/eye-support.js: 1.2 kg, centre of mass 178 mm behind the nozzle, elastic 0.5 N/mm, rotation stiffness 0 / 1.8 / 100 N·m/rad). All illustrative; the umbilical pull is [unknown]. The tilt is drawn as a turn about the tangent through the dot.</li>' +
        '<li>Pose panel: linearised, straight corner, 0.3 px line-fit noise with 30 points per line, fan planes fixed in the gun and through the emitter and the dot, gravity sensor 0.3° on the two horizontal turns (calc/line-laser-pose.mjs). [illustrative]</li>' +
        '<li>Umbilical drawn as a Bezier to a bench anchor, min-radius badge from the manual’s 350 mm emitting / 240 mm stored [manual p.20]; the check is illustrative.</li></ul>',
    },
  });
  const ws = app.workstation, gun = app.gun, scene = app.scene;
  gun.setLaser(true);
  const val = id => app.ui.get(id);
  // Per newton of umbilical pull change at the grip base, for three ways of holding the stage's tilt (freedom's statics, illustrative):
  // u = [radial, vertical] mm per N (+ radial toward the wall), tilt = deg per N of turn of the beam in section.
  const HOLD = {
    one:   { name: 'one elastic: nothing holds the tilt', u: [-1.44, -4.22], tilt: 1.31 },
    two:   { name: 'two spread elastics: a little', u: [0.15, -2.16], tilt: 0.84 },
    guide: { name: 'swing arm + guide rod: tilt held', u: [-0.45, -1.03], tilt: 0.02 },
  };
  const pullEff = () => { const h = HOLD[val('hold')] || HOLD.two, F = val('pull') || 0; return { r: h.u[0] * F, z: h.u[1] * F, tilt: h.tilt * F }; };

  // ------------------------------------------------------------------ shell, lug, camera, emitter (all fixed to the gun)
  const shell = gun.addShell({ style: 'sleeve', from: 'nozzleTip', to: 'housingTop', clearance: 3, role: 'load' });
  const lug = shell.attachPoint('housingTop', { side: 'top', role: 'load', size: 9 });
  const camBody = P.camera({ role: 'sensor', size: 16 }); gun.group.add(camBody);
  const stalkC = P.rod([0, 0, 0], [0, 1, 0], 1.6, 'load'), stalkL = P.rod([0, 0, 0], [0, 1, 0], 1.6, 'load');
  gun.group.add(stalkC, stalkL);
  const emitter = P.box(9, 9, 12, 'sensor'); gun.group.add(emitter);
  [stalkC, stalkL, emitter, camBody].forEach(o => o.traverse(m => { if (m.isMesh) m.userData.occludes = false; }));
  shell.group.traverse(m => m.layers.set(1)); lug.lug.traverse(m => m.layers.set(1));   // the shell is drawn in the main view only: a real shell would have a window for the eye
  const lensDot = V(0, 0, -WK.CLEARANCE);
  const radiusAt = z => (z < 118 ? 27 : 30);
  const camLocal = V(), emLocal = V();
  function placeCameraAndEmitter() {
    const z = val('camz'), th = val('camth') * DEG, rr = radiusAt(z);
    camLocal.set(rr * Math.sin(th), rr * Math.cos(th), z);
    camBody.position.copy(camLocal);
    camBody.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(camLocal, lensDot, V(0, 1, 0)));
    stalkC.setEnds(V(0, 0, z), camLocal);
    const thL = th + Math.PI / 2, zL = z + 6;
    emLocal.set(rr * Math.sin(thL), rr * Math.cos(thL), zL);
    emitter.position.copy(emLocal); emitter.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(emLocal, lensDot, V(0, 1, 0)));
    stalkL.setEnds(V(0, 0, zL), emLocal);
  }
  let cam = null;
  function makeCamInset() {   // the inset's roll follows the gun (a mounted camera rolls with it): up = the gun's own +Y
    if (cam) cam.remove();
    cam = app.inset.add({ id: 'cam', label: 'Gun-borne camera (proposed, illustrative)', object3D: camBody, target: () => gun.dotWorld(), fov: val('fov') || 32, near: 4, far: 600, size: [280, 196], corner: 'br', noise: 0.15, up: gun.dir([0, 1, 0]) });
  }
  app.cornerInset({ gun: gun });

  // ------------------------------------------------------------------ pose variants + soft support (post, arms, elastics, stage)
  const POSES = { A: [45, 30, -15], B: [25, 40, 0], C: [60, 20, -30] };
  const support = { nomLug: V(), nomStage: V(), nomQ: new THREE.Quaternion() };
  const post = P.rod([0, 0, 0], [0, 0, 1], 7, 'fixed'), postFoot = P.box(70, 70, 10, 'fixed'), postTop = P.sphere(7, 'fixed');
  const arm = P.rod([0, 0, 0], [0, 0, 1], 5, 'fixed'), bar = P.rod([0, 0, 0], [0, 0, 1], 4, 'fixed'), spreader = P.rod([0, 0, 0], [0, 0, 1], 4, 'load');
  const guideRod = P.rod([0, 0, 0], [0, 0, 1], 4.5, 'fixed'), sleeve = P.box(18, 18, 44, 'load'), sleeveArm = P.rod([0, 0, 0], [0, 0, 1], 4, 'load');
  const elastic = P.elastic(V(0, 0, 0), V(0, 0, 100), { role: 'compliant', radius: 1.6, rest: 100 }), elastic2 = P.elastic(V(0, 0, 0), V(0, 0, 100), { role: 'compliant', radius: 1.6, rest: 100 });
  const baseBlock = P.box(46, 22, 46, 'fixed'), railX = P.rail(V(-14, 0, 0), V(14, 0, 0), { width: 9, height: 5, role: 'actuated' }), railZ = P.rail(V(0, 0, -14), V(0, 0, 14), { width: 9, height: 5, role: 'actuated' });
  const carriage = P.box(13, 18, 13, 'actuated'), lugRod = P.rod([0, 0, 0], [0, 0, 1], 2.6, 'load');
  const anchor = P.groundHatch(40, 'fixed'), anchorPost = P.rod([0, 0, 0], [0, 0, 1], 4, 'fixed');
  const pullArrow = P.arrow(V(0, 0, 0), V(1, 0, 0), 30, 'cable');
  [post, postFoot, postTop, arm, bar, spreader, guideRod, sleeve, sleeveArm, elastic, elastic2, baseBlock, railX, railZ, carriage, lugRod, anchor, anchorPost, pullArrow].forEach(o => app.add(o));
  let umb = null;
  const st = { trim: V(0, 0, 0), stageLimit: 6, err: null, steps: 0, closed: false, lastTick: 0, running: 0, est: null };

  const gunOffset = () => { const pd = pullEff(); return V(val('dr') + pd.r + st.trim.x, 0, val('dz') + pd.z + st.trim.z); };
  function applyPose() {
    const p = POSES[val('pose')];
    gun.setDials(p[0], p[1], p[2]);
    gun.group.position.add(gunOffset());
    gun.group.updateMatrixWorld(true);
    const tl = pullEff().tilt;
    if (Math.abs(tl) > 1e-6) {   // the support has turned the gun about the tangent through the dot: the eye's radial and vertical numbers do not see this
      const dw = gun.dotWorld(), q = new THREE.Quaternion().setFromAxisAngle(V(0, 1, 0), -tl * DEG);
      const pos = gun.group.position.clone().sub(dw).applyQuaternion(q).add(dw), qq = q.clone().multiply(gun.group.quaternion);
      gun.setTransform(pos, qq); gun.group.updateMatrixWorld(true);
    }
  }
  function rebuildSupport() {   // called when the pose variant changes: the post and stage are re-placed (variant, not motion)
    const p = POSES[val('pose')];
    gun.setDials(p[0], p[1], p[2]); gun.group.updateMatrixWorld(true);
    support.nomQ.copy(gun.group.quaternion);
    makeCamInset();
    support.nomLug.copy(lug.world());
    support.nomStage.copy(support.nomLug).addScaledVector(V(0, 0, 1), 70);
    const ex0 = gun.cableExit(); support.hook = ex0.point.clone().addScaledVector(ex0.dir, 330); support.hookDir = ex0.dir.clone();
    anchor.position.set(support.hook.x, support.hook.y, ws.benchZ + 0.5); anchorPost.setEnds(V(support.hook.x, support.hook.y, ws.benchZ), support.hook.clone().add(V(0, 0, 14)));
    updateAll();
  }
  const vis = (list, on) => list.forEach(o => { o.visible = on; });
  let supLabel = null;
  function updateSupport() {
    const B0 = support.nomStage, pd = pullEff(), drift = V(val('dr') + pd.r, 0, val('dz') + pd.z), mode = val('hold');
    const B = B0.clone().add(drift);       // stage base: moves with the drift
    baseBlock.position.copy(B); railX.setEnds(B.clone().add(V(-16, -13, 0)), B.clone().add(V(16, -13, 0))); railZ.setEnds(B.clone().add(V(0, -13, -16)), B.clone().add(V(0, -13, 16)));
    carriage.position.copy(B).add(V(st.trim.x, -12, st.trim.z));
    const lugW = lug.world();
    lugRod.setEnds(B.clone().add(V(st.trim.x, 0, st.trim.z)).add(V(0, -6, 0)), lugW);
    const bz = ws.benchZ;
    if (mode === 'guide') {
      // a swing arm from a post carries a vertical guide rod; the stage base rides on it in a sleeve; a spring (elastic) carries the weight
      const L = 140, zA = B0.z + 95, pivot = V(B0.x, B0.y - 45 - L, zA), target = V(B.x, B0.y - 45, zA), end = WK.kin.projectToLength(pivot, target, L);
      postFoot.position.set(pivot.x, pivot.y, bz + 5); post.setEnds(V(pivot.x, pivot.y, bz + 10), pivot); postTop.position.copy(pivot);
      arm.setEnds(pivot, end); vis([arm, postTop], true);
      guideRod.setEnds(V(end.x, end.y, zA), V(end.x, end.y, zA - 150));
      sleeve.position.set(end.x, end.y, B.z); sleeveArm.setEnds(V(end.x, end.y, B.z), B.clone().add(V(0, -11, 0)));
      elastic.setEnds(V(end.x + 7, end.y, zA - 6), V(end.x + 7, end.y, B.z + 22));
      vis([guideRod, sleeve, sleeveArm, elastic], true); vis([bar, spreader, elastic2], false);
    } else {
      const px = B0.x - 140, py = B0.y - 60, G = V(B0.x, B0.y, B0.z + 125);
      postFoot.position.set(px, py, bz + 5); post.setEnds(V(px, py, bz + 10), V(px, py, G.z)); postTop.position.set(px, py, G.z);
      arm.setEnds(V(px, py, G.z), G); vis([arm, postTop], true); vis([guideRod, sleeve, sleeveArm], false);
      if (mode === 'two') {
        bar.setEnds(G.clone().add(V(0, -60, 0)), G.clone().add(V(0, 60, 0))); spreader.setEnds(B.clone().add(V(0, -60, 25)), B.clone().add(V(0, 60, 25)));
        elastic.setEnds(G.clone().add(V(0, -60, 0)), B.clone().add(V(0, -60, 25))); elastic2.setEnds(G.clone().add(V(0, 60, 0)), B.clone().add(V(0, 60, 25)));
        vis([bar, spreader, elastic2], true);
      } else {
        elastic.setEnds(G, B.clone().add(V(0, 0, 23))); vis([bar, spreader, elastic2], false);
      }
      vis([elastic], true);
    }
    // umbilical: hangs from the grip base to the bench anchor
    const ex = gun.cableExit();
    const curve = WK.bezierCable(ex.point, ex.dir, support.hook, support.hookDir, { stiffness: 0.4 });
    if (!umb) { umb = P.cable(curve, { radius: 5.5, role: 'cable' }); app.add(umb); } else umb.setPoints(curve);
    const b = WK.cableBadge(WK.curveMinRadius(curve)); app.badge('bend', b.text, b.level);
    const F = val('pull') || 0; pullArrow.visible = F > 0.05;
    if (pullArrow.visible) pullArrow.set(ex.point, ex.dir, 8 + 14 * F);
    if (supLabel) supLabel.set(HOLD[mode].name);
  }

  // ------------------------------------------------------------------ line laser: fan planes FIXED IN THE GUN (through the emitter and the dot), rolled about that axis
  function makeProfile() {
    const line = new THREE.Line(new THREE.BufferGeometry(), WK.lineMat('sensor', { onTop: true })); line.frustumCulled = false; app.addHelper(line);
    const rods = []; for (let i = 0; i < 26; i++) { const r = P.rod([0, 0, 0], [0, 0, 1], 0.45, 'sensor', { segments: 5 }); r.userData.occludes = false; app.add(r); rods.push(r); }
    return { line, rods };
  }
  const profiles = [makeProfile(), makeProfile()];
  function emitterWorld() { gun.group.updateMatrixWorld(true); return gun.group.localToWorld(emLocal.clone()); }
  function fanNormalLocal(k) {   // k = 0 first fan, 1 second fan (90 deg further)
    const axE = emLocal.clone().sub(lensDot).normalize();
    const rNomL = V(1, 0, 0).applyQuaternion(support.nomQ.clone().invert());
    let n = emLocal.clone().sub(lensDot).cross(rNomL).normalize();
    const roll = (val('fan') + 90 * k) * DEG;
    return n.applyAxisAngle(axE, roll).normalize();
  }

  dis.slider({ id: 'bias', label: 'Calibration bias of the estimate, radial', min: -1, max: 1, step: 0.05, value: 0.3, unit: 'mm', kind: 'scene', help: 'What the camera reports minus the truth, when the truth is zero. The loop cannot see it.', onChange: updateAll });
  dis.slider({ id: 'biasz', label: 'Calibration bias, vertical', min: -1, max: 1, step: 0.05, value: -0.2, unit: 'mm', kind: 'scene', onChange: updateAll });
  dis.slider({ id: 'noise', label: 'Estimate noise (1 sigma)', min: 0, max: 0.3, step: 0.01, value: 0.03, unit: 'mm', kind: 'scene', onChange: updateAll });

  const act = app.ui.group('Trim stage and loop (software could command)');
  act.slider({ id: 'tr', label: 'Trim radial', min: -6, max: 6, step: 0.05, value: 0, unit: 'mm', kind: 'actuator', visual: () => [carriage, railX], help: 'Moves the whole gun toward (+) or away from the wall.', onChange: v => { st.trim.x = v; updateAll(); } });
  act.slider({ id: 'tz', label: 'Trim vertical', min: -6, max: 6, step: 0.05, value: 0, unit: 'mm', kind: 'actuator', visual: () => [carriage, railZ], onChange: v => { st.trim.z = v; updateAll(); } });
  act.button({ id: 'once', label: 'One correction (software reads, then trims)', kind: 'actuator', help: 'trim <- trim - 0.6 x estimate', onClick: correct });
  act.button({ id: 'run', label: 'Run the loop (6 corrections)', kind: 'actuator', onClick: function () { let n = 0; clearInterval(st.running); st.running = setInterval(function () { correct(); if (++n >= 6) clearInterval(st.running); }, 300); } });
  act.toggle({ id: 'closed', label: 'Keep the loop closed while the tube turns', value: false, kind: 'state', help: 'One correction every 0.25 s while the rotator runs with exaggerated runout.', onChange: v => { st.closed = v; } });

  const rig = app.ui.group('Rotator and runout');
  rig.toggle({ id: 'spin', label: 'Tube turning, runout shown x20', value: false, kind: 'state', visual: () => ws.turntable, help: 'Runout limits from the rig doc (0.25 / 0.30 mm TIR), exaggerated 20x: illustrative wobble.', onChange: v => { ws.spin.on = v; ws.spin.speedDegPerSec = 8 / RI / DEG; ws.setRunout(v ? WK.RIG.runoutRadialTIR : 0, v ? WK.RIG.runoutFaceTIR : 0, 20); updateAll(); } });

  app.onFrame(function (dt, t) {
    if (ws.spin.on) { updateAll(); if (st.closed && t - st.lastTick > 0.25) { st.lastTick = t; correct(); } return true; }
    return false;
  });
  app.label(() => gun.local('nozzleTip'), 'nozzle', { cls: 'gun' });
  app.label(() => gun.dotWorld(), 'dot', { cls: 'laser' });
  app.label(camBody, 'gun-borne camera', { cls: 'sensor' });
  app.label(emitter, 'line laser', { cls: 'sensor' });
  app.label(carriage, '2-axis trim stage (actuators)', { cls: 'actuated' });
  supLabel = app.label(elastic, HOLD.two.name, { cls: 'compliant' });
  app.label(() => lug.world(), 'lug on the shell', { cls: 'load' });
  app.label(() => gun.local('gripBase'), 'umbilical exit', { cls: 'cable' });

  rebuildSupport();
  app.legend();
  window.__loop = () => ({ trim: [st.trim.x, st.trim.z], est: st.est, off: (function () { const o = gun.dotOffset(); return [o.radial, o.vertical]; })() });
})();
</script>
</body>
</html>
