    while (barsSvg.firstChild) barsSvg.removeChild(barsSvg.firstChild);
    const unit = p.type === 'cap' ? 'fF' : 'ppm', mx = Math.max(...y, 1e-9), log = p.type === 'eddy';
    const f = v => log ? Math.log10(Math.max(v, 1)) / Math.log10(Math.max(mx, 10)) : v / mx;
    y.forEach(function (v, i) {
      const x0 = 8 + i * 72, h = Math.max(1, 70 * f(v));
      barsSvg.appendChild(S('rect', { x: x0, y: 82 - h, width: 52, height: h, fill: cSensor, opacity: 0.85, rx: 2 }));
      barsSvg.appendChild(S('text', { x: x0 + 26, y: 78 - h, 'text-anchor': 'middle', text: v.toFixed(v > 100 ? 0 : 1) }));
      barsSvg.appendChild(S('text', { x: x0 + 26, y: 96, 'text-anchor': 'middle', text: ['front wall', 'front plate', 'rear wall', 'rear plate'][i] }));
      if (sh) barsSvg.appendChild(S('text', { x: x0 + 26, y: 109, 'text-anchor': 'middle', class: 'lbl-g', text: Math.round(100 * sh[i]) + '% plate' }));
    });
    barsSvg.appendChild(S('text', { x: 296, y: 12, 'text-anchor': 'end', class: 'lbl-g', text: unit + (log ? ' (log scale)' : '') }));
  }

  // ---------------------------------------------------------------- update
  function update() {
    const p = P(), g = { r: app.ui.get('gr'), z: app.ui.get('gz') };
    const pert = { gain: app.ui.get('gain'), conf: app.ui.get('conf'), drift: app.ui.get('drift') * (p.type === 'cap' ? 1 : 30) };
    const geo = geometry(g, p);
    // gun drawing
    const b = geo.b, n = geo.n, back = L => ({ x: g.r - L * b.x, y: g.z - L * b.y });
    const tip = back(16), a1 = back(16 + 8), a2 = back(16 + 75);
    const poly = [[tip.x + 2.2 * n.x, tip.y + 2.2 * n.y], [a1.x + 5 * n.x, a1.y + 5 * n.y], [a2.x + 8.5 * n.x, a2.y + 8.5 * n.y], [a2.x - 8.5 * n.x, a2.y - 8.5 * n.y], [a1.x - 5 * n.x, a1.y - 5 * n.y], [tip.x - 2.2 * n.x, tip.y - 2.2 * n.y]];
    gunBody.setAttribute('points', poly.map(q => X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1)).join(' '));
    const sp = [[tip.x + 5.2 * n.x, tip.y + 5.2 * n.y], [a1.x + 8 * n.x, a1.y + 8 * n.y], [a2.x + 11.5 * n.x, a2.y + 11.5 * n.y], [a2.x - 11.5 * n.x, a2.y - 11.5 * n.y], [a1.x - 8 * n.x, a1.y - 8 * n.y], [tip.x - 5.2 * n.x, tip.y - 5.2 * n.y]];
    shell.setAttribute('points', sp.map(q => X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1)).join(' '));
    beam.setAttribute('x1', X(tip.x)); beam.setAttribute('y1', Y(tip.y)); beam.setAttribute('x2', X(g.r)); beam.setAttribute('y2', Y(g.z));
    dotC.setAttribute('cx', X(g.r)); dotC.setAttribute('cy', Y(g.z));
    dotX.setAttribute('d', 'M' + (X(g.r) - 9) + ' ' + Y(g.z) + 'H' + (X(g.r) + 9) + 'M' + X(g.r) + ' ' + (Y(g.z) - 9) + 'V' + (Y(g.z) + 9));
    // pads and distance lines
    let minD = Infinity;
    geo.pads.forEach(function (pad, i) {
      const e = padEls[i], cxp = X(pad.pos.x), cyp = Y(pad.pos.y), ang = Math.atan2(-pad.m.y, pad.m.x) / DEG;
      e.rect.setAttribute('x', -12); e.rect.setAttribute('y', -4.5); e.rect.setAttribute('transform', 'translate(' + cxp + ' ' + cyp + ') rotate(' + (-ang + 90 - 90) + ')');
      e.rect.setAttribute('transform', 'translate(' + cxp + ' ' + cyp + ') rotate(' + (-Math.atan2(pad.m.y, pad.m.x) / DEG + 90) + ')');
      const qp = qPlate(pad.pos), qw = qWall(pad.pos), dP = Math.hypot(qp.x - pad.pos.x, qp.y - pad.pos.y), dW = Math.hypot(qw.x - pad.pos.x, qw.y - pad.pos.y);
      minD = Math.min(minD, dP, dW);
      const tp = term(pad, qp, () => 1, 1), tw = term(pad, qw, () => 1, 1), showP = tp.f > 0.02, showW = tw.f > 0.02;
      e.l1.style.display = showP ? '' : 'none'; e.t1.style.display = showP ? '' : 'none';
      e.l2.style.display = showW ? '' : 'none'; e.t2.style.display = showW ? '' : 'none';
      if (showP) { e.l1.setAttribute('x1', cxp); e.l1.setAttribute('y1', cyp); e.l1.setAttribute('x2', X(qp.x)); e.l1.setAttribute('y2', Y(qp.y)); e.t1.setAttribute('x', (cxp + X(qp.x)) / 2 + 4); e.t1.setAttribute('y', (cyp + Y(qp.y)) / 2); e.t1.textContent = dP.toFixed(1); }
      if (showW) { e.l2.setAttribute('x1', cxp); e.l2.setAttribute('y1', cyp); e.l2.setAttribute('x2', X(qw.x)); e.l2.setAttribute('y2', Y(qw.y)); e.t2.setAttribute('x', (cxp + X(qw.x)) / 2 + 4); e.t2.setAttribute('y', (cyp + Y(qw.y)) / 2 - 4); e.t2.textContent = dW.toFixed(1); }
      e.lab.setAttribute('x', cxp + (pad.face === 'wall' ? 14 : -74)); e.lab.setAttribute('y', cyp + (pad.face === 'wall' ? -8 : 14)); e.lab.textContent = pad.station + ' ' + pad.face;
    });
    // readings, solve, map
    const yTrue = readings(g, p, pert);
    const noise = p.type === 'cap' ? 0.5 : 1.0, nm = app.ui.get('noise');
    const yMeas = yTrue.map((v, i) => v + (app.ui.get('sample') ? gauss(st.seed * 4 + i) * noise * nm : 0));
    const est = solve(yMeas, p, { r: 0, z: 0 });
    const good = drawMap(p, g, pert), sg = sigma(g, p);
    const shares = geo.pads.map(function (pad) { const R = p.type === 'cap' ? respCap : respEddy, tp = term(pad, qPlate(pad.pos), R, p.size).v, tw = term(pad, qWall(pad.pos), R, p.size).v; return tp / Math.max(1e-12, tp + tw); });
    drawBars(yMeas, p, shares);
    estX.setAttribute('d', 'M' + (X(est.r) - 8) + ' ' + (Y(est.z) - 8) + 'l16 16M' + (X(est.r) - 8) + ' ' + (Y(est.z) + 8) + 'l16 -16');
    estT.setAttribute('x', X(est.r) + 10); estT.setAttribute('y', Y(est.z) + 16);
    const errR = est.r - g.r, errZ = est.z - g.z, err = Math.hypot(errR, errZ);
    const inside = Math.abs(g.r) < MR && Math.abs(g.z) < MR;
    dimTxt.textContent = 'true offset (' + g.r.toFixed(2) + ', ' + g.z.toFixed(2) + ')   solved (' + est.r.toFixed(2) + ', ' + est.z.toFixed(2) + ')   error ' + err.toFixed(2) + ' mm';
    mapNote.textContent = 'green under 0.05 mm, yellow-green 0.1, amber 0.3, orange 1, dark red worse (noise + bias with the current disturbances); slate grey: the drawn shell would touch the rim or plate. ' + (100 * good).toFixed(0) + ' % of the plotted +/-' + MR + ' mm is better than 0.1 mm. White cross: where the gun is.';
    barsNote.textContent = 'Under each bar: how much of that pad’s reading comes from the plate (the rest is the wall). No pad reads only one surface; the leak is why a gain error on the wall pads moves the vertical answer too. Noise-only 1-sigma of the solve here: r ' + (isFinite(sg.r) ? sg.r.toFixed(3) : 'n/a') + ', z ' + (isFinite(sg.z) ? sg.z.toFixed(3) : 'n/a') + ' mm.';
    app.badge('metal', collides(g, p) ? 'the drawn shell would touch the rim or plate at this offset' : (minD < 2 ? 'a pad is within 2 mm of metal: too close' : null), 'limit');
    app.badge('bias', err > 0.15 ? 'the disturbances bias the solved offset by ' + err.toFixed(2) + ' mm; the sensor cannot see this itself' : null, 'warn');
    const f2 = v => (v >= 0 ? '+' : '') + v.toFixed(2);
    app.io.set({
      commands: [{ name: 'Nothing is commanded here', value: '-', note: 'a measurement; the solved offset could drive a trim stage (eyes-01)' }],
      observes: [
        { name: 'Four raw readings', value: yMeas.map(v => v.toFixed(v > 100 ? 0 : 1)).join(' / '), unit: p.type === 'cap' ? 'fF' : 'ppm', status: 'seen' },
        { name: 'Dot offset from the corner, radial (solved)', value: f2(est.r), unit: 'mm', status: err < 0.15 ? 'partly' : 'partly', note: 'model solve; error against the truth is shown on the drawing' },
        { name: 'Dot offset from the corner, vertical (solved)', value: f2(est.z), unit: 'mm', status: 'partly' },
        { name: 'The dot itself', value: '-', status: 'blind', note: 'no light: the dot is inferred from a fixed offset between pads and beam' },
        { name: 'Model error, drift, nearby conductors', value: '-', status: 'blind', note: 'nothing in the four numbers reveals them' },
        { name: 'Outside the sensing envelope', value: inside ? 'inside' : 'outside plotted range', status: inside ? 'seen' : 'blind' },
        { name: 'Copper nozzle, wire guide, umbilical, spatter, EMI from the laser supply', value: '-', status: 'unresolved' },
      ],
      manual: ['Calibrate the sensor model against a ground-truth view', 'Mount the pads; set gain and range', 'Zero the drift before each pass'],
    });
  }
  const ui = app.ui;
  const g1 = ui.group('Sensor');
  g1.radio({ id: 'type', label: 'Sensing principle', kind: 'branch', value: 'cap', options: [{ value: 'cap', label: 'Capacitive pads' }, { value: 'eddy', label: 'Eddy-current coils' }], help: 'Capacitive: measures pad-to-metal capacitance. Eddy-current: measures the inductance drop of a coil near metal.', onChange: update });
  g1.slider({ id: 'size', label: 'Pad side / coil diameter', min: 3, max: 14, step: 0.5, value: 8, unit: 'mm', kind: 'scene', help: 'Bigger sees further and gains signal, but must fit beside the nozzle.', onChange: update });
  g1.slider({ id: 'L1', label: 'Front pads: distance back from the dot', min: 17, max: 70, step: 1, value: 17, unit: 'mm', kind: 'scene', help: 'The rear pads sit 26 mm further back. The nozzle tip is 16 mm from the dot. Closer is more sensitive, hotter and more exposed to spatter.', onChange: update });
  g1.slider({ id: 'beta', label: 'Beam tilt from vertical toward the wall', min: 10, max: 50, step: 1, value: 32, unit: '°', kind: 'scene', help: 'The reference pose has 32° in section (illustrative).', onChange: update });
  g1.slider({ id: 'phi', label: 'Pad facet angle from the beam axis', min: 0, max: 80, step: 1, value: 40, unit: '°', kind: 'scene', help: 'Which way each pad looks. At 0 every pad looks along the beam and sees plate and wall together: the solve is ill-conditioned. Around 40° the wall pads read the wall and the plate pads read the plate.', onChange: update });
  g1.slider({ id: 'noise', label: 'Noise multiplier', min: 0.2, max: 5, step: 0.1, value: 1, unit: 'x', kind: 'scene', help: 'Times the chip noise (0.5 fF, or 1 ppm assumed).', onChange: update });
  g1.toggle({ id: 'sample', label: 'Show one noisy reading', value: false, kind: 'state', onChange: update });
  g1.button({ id: 'resample', label: 'Draw new noise', kind: 'state', onClick: () => { st.seed++; update(); } });
  const g2 = ui.group('Where the gun is (scene edits: nothing is commanded)');
  g2.slider({ id: 'gr', label: 'Dot offset from the corner, radial', min: -8, max: 8, step: 0.1, value: 2.0, unit: 'mm', kind: 'scene', onChange: update });
  g2.slider({ id: 'gz', label: 'Dot offset from the corner, vertical', min: -8, max: 8, step: 0.1, value: -1.5, unit: 'mm', kind: 'scene', onChange: update });
  const g3 = ui.group('Disturbances (nobody tells the solver)');
  g3.slider({ id: 'gain', label: 'Gain error of the wall-facing pads', min: 0, max: 15, step: 0.5, value: 0, unit: '%', kind: 'scene', help: 'The solver assumes the calibrated gain; the pads actually read this much high.', onChange: update });
  g3.slider({ id: 'conf', label: 'Conductor near the front wall-facing pad', min: 0, max: 40, step: 1, value: 0, unit: '% of its reading', kind: 'scene', help: 'A wire guide, hand or clip that adds to that pad’s reading.', onChange: update });
  g3.slider({ id: 'drift', label: 'Drift (temperature, electronics)', min: 0, max: 5, step: 0.1, value: 0, unit: 'fF (x30 ppm if eddy)', kind: 'scene', help: 'Added equally to every reading.', onChange: update });
  update();
})();
</script>
