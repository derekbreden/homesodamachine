    open: ['proposes', 'tried'],
    sections: {
      proposes: '<p>Everything in the gimbal-on-a-gantry page can be done by hand. A manual cross-slide table (radial and tangent), a lab jack (height) and a geared head (yaw and pitch) are stock products; put a digital scale on each and software can read where every axis is. What it cannot do is move. So it speaks: if you turn the head to a new pitch, the dot swings away by about 3 mm per degree, and the spotter reads the head scales and says “turn X to −3.9, Z to +1.2”, computed from the same one-line formula, <code>dot = C − t·g</code>. Then a camera says how far the dot is really off and the spotter gives a short trim.</p>' +
        '<p>Set the head angles with the scene sliders (a person turning the head knobs), watch the dot swing when the slides stay home, then press <b>A person follows the spotter’s numbers</b> and <b>the camera trim</b>. The hand error slider is how well a person lands on a number; the camera bias is what the camera gets wrong.</p>',
      carries: '<p>Gun and ballast → head (fork and pitch lugs) → lab jack → Y slide → X slide → platform → bench. Position: the scales and the formula, then the camera. Free: none between corrections; each axis locks with its gib screw or lock. Driven: nothing; a person turns.</p>',

      tried: '<p><b>Round 1: is the hand the limit?</b> No. In a model (calc/spotter_rounds.py) a person landing within ±0.05 mm of a number on a 0.01 mm scale needs one round with a clean camera, about four with a 0.15 mm noisy one, and a 0.15 mm camera bias holds the true error near 0.15 mm whatever the hand does. Assumption broken: the person is the noisy part.</p>' +

        '<p><b>Round 3: travel.</b> The instruction can ask for more slide travel than a cheap table has; the sliders stop at illustrative limits and a LIMIT badge says which axis. A 40 mm-class jack would not do.</p>' +

  const knobY = P.cyl(13, 14, 'locate'), knobP1 = P.cyl(13, 14, 'locate', { axis: 'x' }), knobP2 = P.cyl(13, 14, 'locate', { axis: 'x' });

  [xSlide, ySlide, jack, headBase, fork[0], fork[1], knobY, knobP1, knobP2, scX, scY, scZ, shA, shB, crA, crB, kX, kYk, kZ].forEach(o => app.add(o));
  const rollStator = P.ring(Rr + 3 * W, W, { role: 'load' }), rollRotor = P.ring(Rr + W, W, { role: 'load' });

  rollRotor.position.copy(DOT_LOCAL).addScaledVector(axisLocal, ROLL_D); rollRotor.quaternion.setFromUnitVectors(AXZ, axisLocal);
  const ballast = P.box(30, 22, 30, 'load'); ballast.position.set(0, 20, 240); gun.group.add(ballast);
  const HOOK = V(-80, -650, 560);
  app.add(P.rod(V(HOOK.x, HOOK.y, bz), HOOK, 5, 'fixed')); const hd = P.sphere(9, 'fixed'); hd.position.copy(HOOK); app.add(hd);
  let cableMesh = null; const stubEnd = WK.GRIP_BASE_LOCAL.clone().addScaledVector(axisLocal, 70);
  function drawCable() {

  }
  const cMark = P.sphere(6, 'locate'); app.add(cMark);
  const spread = P.sphere(10, 'compliant'); spread.material = WK.mat('compliant', { opacity: 0.35 }); spread.userData.occludes = false; app.add(spread);
  app.label(() => spread.position, 'landing spread of a hand (drawn 100x)', { cls: 'compliant' });
  app.label(() => cMark.position, 'head centre C', { cls: 'locate' });
  app.label(() => xSlide.position.clone().add(V(0, 0, 18)), 'X slide (radial) with scale', { cls: 'load' });
  app.label(() => ySlide.position.clone().add(V(0, 0, 18)), 'Y slide (tangent) with scale', { cls: 'load' });
  app.label(() => jack.position.clone().add(V(0, 40, 0)), 'lab jack (height) with scale', { cls: 'load' });
  app.label(() => knobY.position, 'head knobs (yaw, pitch)', { cls: 'locate' });
  app.label(() => gun.dotWorld(), 'Laser dot', { cls: 'laser' });
  const cam = { r: 250, h: 330 }, camPos = V(0, 0, 0);

  app.inset.add({ id: 'obs', label: 'Outside camera (proposed, illustrative)', position: () => camPos, target: () => gun.dotWorld(), fov: 38, near: 30, far: 1500, size: [230, 158], corner: 'br', noise: 0.25 });

  function mats(v, h) {

        { name: 'Spotter says (trim)', value: trim, status: est ? 'seen' : 'blind' },
        { name: 'True dot error (r, z)', value: offs.radial.toFixed(2) + ', ' + offs.vertical.toFixed(2), unit: 'mm', status: 'blind', note: 'only the simulation knows' },

    });

  }

  function set(id, v) { app.ui.set(id, +v.toFixed(3)); }

  const hd2 = app.ui.group('Head knobs (scene edits: a person turns these)', { help: 'The geared head’s three angle readings.' });
  hd2.slider({ id: 'yaw', label: 'Yaw reading', min: -45, max: 45, step: 0.5, value: -15, unit: '°', kind: 'scene', visual: () => [headBase, knobY], onChange: v => { S.v = v; update(); } });
  hd2.slider({ id: 'hole', label: 'Pitch reading', min: 0, max: 60, step: 0.5, value: 30, unit: '°', kind: 'scene', visual: () => [knobP1, knobP2], onChange: v => { S.h = v; update(); } });
  hd2.slider({ id: 'roll', label: 'Roll reading', min: 0, max: 80, step: 1, value: 45, unit: '°', kind: 'scene', visual: () => [rollStator, rollRotor], onChange: v => { S.r = v; update(); } });
  const sl = app.ui.group('Slide and jack knobs (scene edits: a person turns these)', { help: 'Scale readings from the home position.' });
  sl.slider({ id: 'kx', label: 'X slide (radial)', min: LIM.x[0], max: LIM.x[1], step: 0.01, value: 0, unit: 'mm', kind: 'scene', visual: () => [xSlide, kX], onChange: v => { S.kx = v; update(); } });
  sl.slider({ id: 'ky', label: 'Y slide (tangent)', min: LIM.y[0], max: LIM.y[1], step: 0.01, value: 0, unit: 'mm', kind: 'scene', visual: () => [ySlide, kYk], onChange: v => { S.ky = v; update(); } });
  sl.slider({ id: 'kz', label: 'Lab jack (height)', min: LIM.z[0], max: LIM.z[1], step: 0.01, value: 0, unit: 'mm', kind: 'scene', visual: () => [jack, kZ], onChange: v => { S.kz = v; update(); } });
  const sp = app.ui.group('The spotter and the person');
  sp.button({ id: 'follow', label: 'A person follows the spotter’s numbers', kind: 'state', onClick: function () { const T = cFor(S.v, S.h).sub(cHome()); set('kx', Math.max(LIM.x[0], Math.min(LIM.x[1], snap(T.x + rnd())))); set('ky', Math.max(LIM.y[0], Math.min(LIM.y[1], snap(T.y + rnd())))); set('kz', Math.max(LIM.z[0], Math.min(LIM.z[1], snap(T.z + rnd())))); } });
  sp.button({ id: 'trim', label: 'A person follows the camera trim', kind: 'state', onClick: function () { if (!S.lastEst) { app.toast('The camera cannot see the dot: nothing to trim'); return; } set('kx', Math.max(LIM.x[0], Math.min(LIM.x[1], snap(S.kx - S.lastEst.radial + rnd())))); set('kz', Math.max(LIM.z[0], Math.min(LIM.z[1], snap(S.kz - S.lastEst.vertical + rnd())))); } });
  sp.slider({ id: 'hand', label: 'How well a person lands on a number', min: 0, max: 0.3, step: 0.01, value: 0.05, unit: '± mm', kind: 'scene', visual: () => spread, onChange: v => { S.hand = v; update(); } });
  sp.slider({ id: 'res', label: 'Scale resolution', min: 0.005, max: 0.1, step: 0.005, value: 0.01, unit: 'mm', kind: 'scene', onChange: v => { S.res = v; update(); } });
  sp.slider({ id: 'bias', label: 'Camera bias on the radial estimate', min: 0, max: 0.6, step: 0.01, value: 0.3, unit: 'mm', kind: 'scene', onChange: v => { S.bias = v; update(); } });
  sp.slider({ id: 'angErr', label: 'Head angle error (yaw and pitch)', min: 0, max: 0.5, step: 0.01, value: 0, unit: '°', kind: 'scene', help: 'What the head’s scale fails to report. Dot error ≈ t × angle.', onChange: v => { S.angErr = v; update(); } });
  const rg = app.ui.group('Rotator, tube and camera');
  rg.toggle({ id: 'spin', label: 'Rotator turning', value: false, kind: 'state', visual: () => ws.turntable, onChange: v => { ws.spin.on = v; update(); } });
  rg.toggle({ id: 'runout', label: 'Show indicated runout (rig-doc limits)', value: false, kind: 'scene', visual: () => ws.tubeGroup, onChange: v => { ws.setRunout(v ? WK.RIG.runoutRadialTIR : 0, v ? WK.RIG.runoutFaceTIR : 0, 20); update(); } });
  rg.slider({ id: 'camAz', label: 'Camera azimuth', min: 0, max: 360, step: 1, value: 200, unit: '°', kind: 'scene', visual: 'the blue outside camera and its frustum', onChange: v => { S.camAz = v; update(); } });
  rg.toggle({ id: 'ghost', label: 'See-through tube', value: false, kind: 'view', onChange: v => { ws.setGhost(v); update(); } });
  S.ready = true; update();
})();
</script>
</body>
</html>
