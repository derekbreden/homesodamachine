<script>
(function () {
  const h = WK.h, S = WK.svg, DEG = Math.PI / 180;
  const app = WK.app({
    stage: 'custom', workstation: false, gun: false,
    open: ['proposes', 'tried'],
    sections: {
      proposes: '<p>An arrangement that reports its own pose (an encoded balanced arm, or a gimbal steered by a gantry formula) also carries an error: encoder zeros and linearity, link lengths, where the gun really sits in a cradle. If the beam is put on the <b>same printed cross</b> from many orientations, the arrangement’s idea of where the beam met the board has to come out as one point. The spread is its error, and most of that error repeats from touch to touch, so a least-squares fit can take it out. That is the pivot calibration of trials-13 with the arrangement’s own pose in place of a tilt about a supposed pivot.</p>' +
        '<p>Left: the touches, as the camera reads them. Right of it: <b>fresh poses</b> the fit never saw, plotted as the arrangement’s error (grey before, teal after). Try the two branches, then the floors: coarse encoders, play the encoders cannot read, a camera that is noisy, an orientation window you fit narrower than you use.</p>',
      carries: '<p>Not the subject. In the arm branch the arm’s spring and joints carry the gun and a hand supplies motion; in the gimbal branch the gimbal and the gantry carry it and software supplies motion. The board (a printed disc on a pedestal at plate-face height, rung 1 of trials-05) sits on the rotator and carries nothing. What establishes position here is the cross and the camera; the fit turns that into corrections to the arrangement’s own numbers.</p>',
      software: '<p>Arm: software shows a list of orientations (roll, hole, vertical), the hand takes each and puts the dot on the cross, software reads the six joint angles and the camera’s board xy, then fits. It commands nothing. Gimbal: software commands the angles and the gantry formula itself, one pose after another, with no hand; that branch could run overnight. Both: the score is on poses that were not used to fit.</p>',
      tried: '<ul>' +
        '<li><b>What the fit removes.</b> With the encoder model of borrowed-03 (12-bit or better, a first-harmonic linearity error up to 1°, zeros up to 0.3°, links off by up to 2 mm) and an orientation window of ±15°, the arm’s error on fresh poses is about 1.3 to 1.6 mm rms after a one-point touch-off. A fit on 40 touches leaves 0.03 mm with 16-bit encoders and no play <i>(calc/arm_touch_cal.py; this page reruns the same idea with other random draws)</i>. Over a window of ±15° a per-turn sine looks like an offset plus a gain, so the fit can absorb it; a calibration over the whole joint range would be harder.</li>' +
        '<li><b>What it cannot remove.</b> Two floors. <b>Quantisation</b>: a 12-bit code is 0.088° per count, about 0.28 mm at this arm’s lever arms (14-bit 0.10, 16-bit 0.03). <b>Play</b> the encoders cannot read (bearing slop, arm bend under the umbilical): 0.02° of random play is about 0.3 mm, 0.05° about 0.8 mm. The dashed line in the chart is what a perfect fit would still leave.</li>' +
        '<li><b>Calibrate the window you use.</b> Fit at ±10° and test at ±25° and the error is 1.2 mm, not 0.3. The touches must span what the hand will do.</li>' +
        '<li><b>The gimbal formula has a term the error sliders in borrowed-02 do not show.</b> The gantry moves C by t·Δg assuming C sits exactly at t along the roll line in the gun’s frame. A printed cradle is not that exact; 1 mm of cradle error costs 0.2, 0.4 and 0.5 mm rms at ±10°, ±20° and ±30°, against 0.17 mm for a 0.05° angle error (calc/gimbal_fixed_point.py). The fit finds the two cradle components across the beam to about 0.05 mm from 20 poses. The component <b>along</b> the beam cannot be seen on a board: it moves the nozzle along its own beam and the spot does not move. Spot size (trials-03) is its sensor.</li>' +
        '<li><b>It drifts.</b> An arm’s joints settle and a gantry gets bumped: the calibration belongs to a session. A kinematic seat that the gun or arm returns to (trials-02) is the cheap check that the zeros have not moved.</li></ul>',
      unresolved: '<ul><li>Whether a real magnetic encoder’s error over a ±15° window is well described by an offset and one harmonic: the model draws the truth that way and the fit models it that way, so the near-perfect result with 16 bits is the best case, not a prediction. Unmodelled second and third harmonics and a leaning post cost little in calc (about 0.05 mm more) but the real error is unknown <b>[unknown]</b>.</li>' +
        '<li>Whether a spring arm’s joints have play in the 0.02° class or worse <b>[unknown]</b>. It sets the floor.</li>' +
        '<li>Whether camera A can read the dot on the board to 0.05 mm (a matte paper or printed dot is not the dot on polished steel) <b>[unknown]</b>.</li>' +
        '<li>Whether a person can put the dot within 0.3 mm of a cross in an assigned orientation; the fit does not need accuracy from the hand, only the camera’s reading of where the dot fell.</li></ul>',
      assumptions: '<ul><li>Arm: borrowed-03’s six-joint arm (post 260 mm, links 260 + 260 mm, wrist centre 150 mm behind the tip), the reference scene’s dial model and 16 mm nozzle-to-dot <b>[illustrative]</b>. Encoder error: rounding, one sine per joint with random phase and 0.5 to 1 times the amplitude, a random-sign zero offset; not the specification of any part.</li>' +
        '<li>Truth is drawn at random from a seed; “new arm” draws another. The fit knows the structure of the error (offset, first harmonic, links, wrist, beam origin and tilt) but not the numbers.</li>' +
        '<li>Board plane, cross position, hand scatter (±0.3 mm), standoff scatter (±2 mm) and camera noise are made up. Gimbal branch: t = 200 mm, borrowed-02’s gun proxy and dial model; the gantry and gimbal do what they are told.</li>' +
        '<li>The scene runs a JavaScript port of the fit; the Python scripts are the independent check. Nothing here is a measurement of any product.</li></ul>'
    }
  });

  // ------------------------------------------------------------------ small maths
  const V3 = (x, y, z) => [x, y, z];
  const mul = (A, B) => { const C = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) C[3 * i + j] = A[3 * i] * B[j] + A[3 * i + 1] * B[3 + j] + A[3 * i + 2] * B[6 + j]; return C; };
  const mulv = (A, v) => [A[0] * v[0] + A[1] * v[1] + A[2] * v[2], A[3] * v[0] + A[4] * v[1] + A[5] * v[2], A[6] * v[0] + A[7] * v[1] + A[8] * v[2]];
  const tr3 = A => [A[0], A[3], A[6], A[1], A[4], A[7], A[2], A[5], A[8]];
  const RX = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
  const RY = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
  const RZ = a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  // gun rotation for the three dials (the kit's posePoint maths applied to basis vectors); columns = images of local x, y, z
  const PITCH = WK.PITCH, CLR = WK.CLEARANCE, RA = WK.LOCAL_ROLL_AXIS;
  function posePt(p, roll, holeRoll, vert) {
    const s = Math.sin(PITCH), c = Math.cos(PITCH), x = p[0], y = p[1], z = p[2], along = z + CLR;
    const py = -c * along + s * y, pz = s * along + c * y;
    const ay = -c * RA.z + s * RA.y, az = s * RA.z + c * RA.y, dot = ay * py + az * pz;
    const cr = Math.cos(roll), sr = Math.sin(roll);
    const rx = x * cr + (ay * pz - az * py) * sr, ry = py * cr + az * x * sr + ay * dot * (1 - cr), rz = pz * cr - ay * x * sr + az * dot * (1 - cr);
    const ch = Math.cos(holeRoll), sh = Math.sin(holeRoll), hy = ry * ch + rz * sh, hz = -ry * sh + rz * ch;
    const cv = Math.cos(vert), sv = Math.sin(vert);
    return [rx * cv - hy * sv, rx * sv + hy * cv, hz];
  }
  function gunR(rollDeg, holeDial, vertDeg) {           // row-major 3x3
    const hr = (holeDial - WK.HOLE_AXIS_OFFSET) * DEG, r = rollDeg * DEG, v = vertDeg * DEG;
    const o = posePt([0, 0, 0], r, hr, v), bx = posePt([1, 0, 0], r, hr, v), by = posePt([0, 1, 0], r, hr, v), bz = posePt([0, 0, 1], r, hr, v);
    return [bx[0] - o[0], by[0] - o[0], bz[0] - o[0], bx[1] - o[1], by[1] - o[1], bz[1] - o[1], bx[2] - o[2], by[2] - o[2], bz[2] - o[2]];
  }
  // seeded random
  function rng(seed) {
    let s = (seed * 2654435761) >>> 0 || 1;
    const u = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    const n = () => { let a = 0; for (let i = 0; i < 6; i++) a += u(); return (a - 3) * Math.SQRT2; };
    return { u: u, n: n };
  }
  function solve(A, b) {                                  // Gaussian elimination, partial pivoting; A is n x n (array of rows)
    const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
    for (let c = 0; c < n; c++) {
      let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      const t = M[c]; M[c] = M[p]; M[p] = t;
      const d = M[c][c] || 1e-12;
      for (let r = c + 1; r < n; r++) { const f = M[r][c] / d; if (f) for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
    }
    const x = new Array(n).fill(0);
    for (let r = n - 1; r >= 0; r--) { let s = M[r][n]; for (let k = r + 1; k < n; k++) s -= M[r][k] * x[k]; x[r] = s / (M[r][r] || 1e-12); }
    return x;
  }

  // ------------------------------------------------------------------ the arm (borrowed-03's geometry)
  const BASE = [-300, -330, -86 + 260], L1_0 = 260, L2_0 = 260, W0 = 150, ZB = 60, TARGET = [-100, -100];
  function fkArm(th, L1, L2, W, o, tilt, zb) {
    const c1 = Math.cos(th[0]), s1 = Math.sin(th[0]), c2 = Math.cos(th[1]), s2 = Math.sin(th[1]), t23 = th[1] + th[2];
    const f = [c1 * Math.cos(t23), s1 * Math.cos(t23), Math.sin(t23)], y = [-s1, c1, 0], z = cross(f, y);
    const Ra = [f[0], y[0], z[0], f[1], y[1], z[1], f[2], y[2], z[2]];
    const Wc = [BASE[0] + L1 * c1 * c2 + L2 * f[0], BASE[1] + L1 * s1 * c2 + L2 * f[1], BASE[2] + L1 * s2 + L2 * f[2]];
    const Rt = mul(Ra, mul(RX(th[3]), mul(RY(th[4]), RZ(th[5]))));
    const pos = [Wc[0] - Rt[2] * W, Wc[1] - Rt[5] * W, Wc[2] - Rt[8] * W];
    return hitPlane(pos, Rt, zb, o, tilt);
  }
  function hitPlane(pos, Rt, zb, o, tilt) {
    const org = [pos[0] + Rt[0] * o[0] + Rt[1] * o[1], pos[1] + Rt[3] * o[0] + Rt[4] * o[1], pos[2] + Rt[6] * o[0] + Rt[7] * o[1]];
    const nrm = Math.sqrt(tilt[0] * tilt[0] + tilt[1] * tilt[1] + 1), dl = [tilt[0] / nrm, tilt[1] / nrm, -1 / nrm];
    const d = mulv(Rt, dl), s = (zb - org[2]) / d[2];
    return [org[0] + s * d[0], org[1] + s * d[1]];
  }
  function ikArm(Rt, pos, L1, L2, W) {
    const Wc = [pos[0] + Rt[2] * W, pos[1] + Rt[5] * W, pos[2] + Rt[8] * W], d = [Wc[0] - BASE[0], Wc[1] - BASE[1], Wc[2] - BASE[2]];
    const D = Math.hypot(d[0], d[1], d[2]);
    if (D > L1 + L2 - 1e-6 || D < Math.abs(L1 - L2) + 1e-6) return null;
    const u = [d[0] / D, d[1] / D, d[2] / D], a = (L1 * L1 - L2 * L2 + D * D) / (2 * D), hh = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    let hint = [-u[2] * u[0], -u[2] * u[1], 1 - u[2] * u[2]]; const hn = Math.hypot(hint[0], hint[1], hint[2]); hint = [hint[0] / hn, hint[1] / hn, hint[2] / hn];
    const E = [BASE[0] + a * u[0] + hh * hint[0], BASE[1] + a * u[1] + hh * hint[1], BASE[2] + a * u[2] + hh * hint[2]];
    const t1 = Math.atan2(d[1], d[0]), c1 = Math.cos(t1), s1 = Math.sin(t1), e = [E[0] - BASE[0], E[1] - BASE[1], E[2] - BASE[2]];
    const t2 = Math.atan2(e[2], e[0] * c1 + e[1] * s1), fv = [Wc[0] - E[0], Wc[1] - E[1], Wc[2] - E[2]], t23 = Math.atan2(fv[2], fv[0] * c1 + fv[1] * s1);
    const f = [c1 * Math.cos(t23), s1 * Math.cos(t23), Math.sin(t23)], y = [-s1, c1, 0], z = cross(f, y);
    const Ra = [f[0], y[0], z[0], f[1], y[1], z[1], f[2], y[2], z[2]], Rw = mul(tr3(Ra), Rt);
    const b = Math.asin(Math.max(-1, Math.min(1, Rw[2]))); let a4, c6;
    if (Math.abs(Rw[2]) < 0.9999999) { a4 = Math.atan2(-Rw[5], Rw[8]); c6 = Math.atan2(-Rw[1], Rw[0]); } else { a4 = Math.atan2(Rw[7], Rw[4]); c6 = 0; }
    return [t1, t2, t23 - t2, a4, b, c6];
  }

  // ------------------------------------------------------------------ hidden truths (drawn from a seed; scaled by the sliders)
  const S0 = { seed: 3, arr: 'arm', N: 40, win: 15, testWin: 15, cam: 0.05, hand: 0.3, bits: 12, inl: 0.5, off: 0.3, dl: 2, play: 0.01, cradle: 1.0, ang: 0.1 };
  function armTruth(seed) {
    const r = rng(seed * 7 + 1), A = [], phi = [], sgn = [], mag = [];
    for (let i = 0; i < 6; i++) { A.push(0.5 + 0.5 * r.u()); phi.push(2 * Math.PI * r.u()); sgn.push(r.u() < 0.5 ? -1 : 1); mag.push(0.5 + 0.5 * r.u()); }
    const dl = [2 * r.u() - 1, 2 * r.u() - 1, 2 * r.u() - 1], tilt = [0.003 * r.n(), 0.003 * r.n()], o = [0.4 * r.n(), 0.4 * r.n()];
    return { A: A, phi: phi, sgn: sgn, mag: mag, dl: dl, tilt: tilt, o: o };
  }
  function armCfg(T) {
    return { A: T.A.map(a => a * S0.inl), phi: T.phi, off: T.sgn.map((s, i) => s * T.mag[i] * S0.off), dL1: T.dl[0] * S0.dl, dL2: T.dl[1] * S0.dl, dW: T.dl[2] * S0.dl, tilt: T.tilt, o: T.o };
  }
  function encode(cfg, th) {
    const q = 360 / Math.pow(2, S0.bits), out = [];
    for (let i = 0; i < 6; i++) { const d = th[i] / DEG + cfg.A[i] * Math.sin(th[i] + cfg.phi[i]); out.push((Math.round(d / q) * q + cfg.off[i]) * DEG); }
    return out;
  }
  function armTouches(seed, cfg, n, win, salt) {
    const r = rng(seed * 101 + salt), out = { enc: [], cam: [], hit: [], feat: [] };
    let tries = 0;
    while (out.enc.length < n && tries < 40 * n) {
      tries++;
      const roll = 45 + (2 * r.u() - 1) * win, hole = 30 + (2 * r.u() - 1) * win, vert = -15 + (2 * r.u() - 1) * win;
      const Rt = gunR(roll, hole, vert), d = mulv(Rt, [0, 0, -1]);
      const want = [TARGET[0] + r.n() * S0.hand, TARGET[1] + r.n() * S0.hand, ZB], sd = 16 + r.n() * 2;
      const pos = [want[0] - sd * d[0], want[1] - sd * d[1], want[2] - sd * d[2]];
      const th = ikArm(Rt, pos, L1_0 + cfg.dL1, L2_0 + cfg.dL2, W0 + cfg.dW);
      const pl = [r.n(), r.n(), r.n(), r.n(), r.n(), r.n()];                // always drawn so the sequence does not depend on the sliders
      const cn = [r.n(), r.n()];
      if (!th || !isFinite(th[0] + th[1] + th[2] + th[3] + th[4] + th[5]) || Math.abs(th[4]) > 80 * DEG) continue;
      const real = th.map((t, i) => t + pl[i] * S0.play * DEG);
      const hit = fkArm(real, L1_0 + cfg.dL1, L2_0 + cfg.dL2, W0 + cfg.dW, cfg.o, cfg.tilt, ZB);
      out.enc.push(encode(cfg, th)); out.hit.push(hit); out.cam.push([hit[0] + cn[0] * S0.cam, hit[1] + cn[1] * S0.cam]);
    }
    out.feat = out.enc;
    return out;
  }
  // parameters (arm): off[6] deg, c[6] deg, s[6] deg, dL1, dL2, dW mm, o[2] mm, tilt[2] rad, T[2] mm, zb mm
  const ARM_NP = 28;
  const ARM_PRIOR = [1, 1, 1, 1, 1, 1, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 5, 5, 5, 2, 2, 0.02, 0.02, 1e3, 1e3, 20];
  const ARM_STEP = p => (p === 23 || p === 24) ? 1e-5 : 2e-2;
  function armPredict(p, enc) {
    const th = new Array(6);
    for (let i = 0; i < 6; i++) th[i] = enc[i] - p[i] * DEG - p[6 + i] * DEG * Math.cos(enc[i]) - p[12 + i] * DEG * Math.sin(enc[i]);
    const q = fkArm(th, L1_0 + p[18], L2_0 + p[19], W0 + p[20], [p[21], p[22]], [p[23], p[24]], ZB + p[27]);

  // ------------------------------------------------------------------ the gimbal branch (borrowed-02's formula)

  ga.radio({ id: 'arr', label: 'What is being calibrated', kind: 'branch', value: 'arm', options: [{ value: 'arm', label: 'encoded arm (borrowed-03)' }, { value: 'gimbal', label: 'gimbal + gantry (borrowed-02)' }], help: 'Same trial, two arrangements. The arm is moved by a hand; the gimbal branch is run by software.', onChange: v => { S0.arr = v; setEnabled(); regenerate(); } });
  const gt = app.ui.group('The trial (set by the software; state)', { open: true });
  gt.slider({ id: 'N', label: 'Touches used to fit', min: 6, max: 150, step: 1, value: 40, kind: 'state', help: 'Each touch is one orientation with the dot on the cross.', onChange: v => { S0.N = v; regenerate(); } });
  gt.slider({ id: 'win', label: 'Orientation window fitted (± on each dial)', min: 3, max: 30, step: 1, value: 15, unit: '°', kind: 'state', help: 'The three dials are varied this far about the reference opening pose.', onChange: v => { S0.win = v; regenerate(); } });
  gt.slider({ id: 'testWin', label: 'Orientation window tested', min: 3, max: 30, step: 1, value: 15, unit: '°', kind: 'state', help: 'Fresh poses are drawn from this window. Wider than the fitted one: the fit must extrapolate.', onChange: v => { S0.testWin = v; regenerate(); } });
  gt.button({ id: 'curve', label: 'Run the touches-versus-error curve', kind: 'state', onClick: () => runCurve() });
  gt.button({ id: 'newarm', label: 'Draw another arm / cradle (new seed)', kind: 'state', onClick: () => { S0.seed++; regenerate(); } });
  const gr = app.ui.group('The camera and the hand (scene edits: hidden truth)', { open: true });
  gr.slider({ id: 'cam', label: 'Camera noise on the board xy', min: 0.01, max: 0.4, step: 0.01, value: 0.05, unit: 'mm', kind: 'scene', help: 'Per axis, per touch.', onChange: v => { S0.cam = v; regenerate(); } });
  gr.slider({ id: 'hand', label: 'How far the hand lands from the cross', min: 0, max: 1, step: 0.05, value: 0.3, unit: 'mm', kind: 'scene', help: 'The camera reads where it fell, so this costs the fit nothing. Arm branch only.', onChange: v => { S0.hand = v; regenerate(); } });
  gr.slider({ id: 'play', label: 'Unread play (arm: per joint; gimbal: angle repeatability)', min: 0, max: 0.1, step: 0.005, value: 0.01, unit: '°', kind: 'scene', help: 'What the encoders cannot see: it sets the floor no fit removes.', onChange: v => { S0.play = v; regenerate(); } });
  const ge = app.ui.group('The arm (scene edits: hidden truth)', { open: true });
  ge.select({ id: 'bits', label: 'Encoder resolution', options: [{ value: 10, label: '10 bit' }, { value: 12, label: '12 bit (AS5600 class)' }, { value: 14, label: '14 bit' }, { value: 16, label: '16 bit' }], value: 12, kind: 'scene', onChange: v => { S0.bits = +v; regenerate(); } });
  ge.slider({ id: 'inl', label: 'Linearity error per turn', min: 0, max: 1.5, step: 0.05, value: 0.5, unit: '°', kind: 'scene', help: 'One sine per joint; the datasheet maximum for an AS5600 is 1°.', onChange: v => { S0.inl = v; regenerate(); } });
  ge.slider({ id: 'off', label: 'Zero offsets', min: 0, max: 1, step: 0.05, value: 0.3, unit: '°', kind: 'scene', onChange: v => { S0.off = v; regenerate(); } });
  ge.slider({ id: 'dl', label: 'Link and wrist length error', min: 0, max: 6, step: 0.5, value: 2, unit: 'mm', kind: 'scene', help: 'The drawing is not the arm.', onChange: v => { S0.dl = v; regenerate(); } });
  const gg = app.ui.group('The gimbal cradle (scene edits: hidden truth)', { open: true });
  gg.slider({ id: 'cradle', label: 'Gun-in-cradle position error', min: 0, max: 3, step: 0.1, value: 1.0, unit: 'mm', kind: 'scene', help: 'How far C really is from where the formula puts it, in the gun’s frame (random direction).', onChange: v => { S0.cradle = v; regenerate(); } });
  gg.slider({ id: 'ang', label: 'Gimbal angle zero error', min: 0, max: 0.5, step: 0.01, value: 0.1, unit: '°', kind: 'scene', onChange: v => { S0.ang = v; regenerate(); } });
  function setEnabled() {
    const arm = S0.arr === 'arm';
    try { ['bits', 'inl', 'off', 'dl', 'hand'].forEach(id => app.ui.enable(id, arm)); ['cradle', 'ang'].forEach(id => app.ui.enable(id, !arm)); } catch (e) { /* controls not built yet */ }
  }
  setEnabled();
  window.__fc = { S0: S0, ST: ST, gunR: gunR, ikArm: ikArm, fkArm: fkArm };   // for the checker and for comparing with calc/*.py
  regenerate();
})();
</script>
</body>
