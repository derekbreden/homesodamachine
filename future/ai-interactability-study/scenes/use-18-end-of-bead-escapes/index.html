{

  "status": "deep",
  "summary": "The bead ends with the head leaving while the trigger is held and the wire breaking in the air. Four ways to make that motion, side by side on one tube: a hand, a gun-side line (a plunge along the barrel, a lift, another direction), a gun-side pivot (a yoke or a hinge), and the work dropping. Each is run through the same events: the wire fused to the bead, the feed still running, the tube still turning. What differs is the direction against the wire and the beam, where the beam goes while it is still on, what the mover must deliver, and what holds the pose afterwards.",

<script>
(function () {
  const V = (x, y, z) => new THREE.Vector3(x, y, z), P = WK.prim, DEG = WK.deg, G = 9.81;
  const RI = WK.INNER_RADIUS, RO = WK.DIM.tubeOd / 2, RIM = WK.DIM.tubeHeight, CAP = WK.CAP_TOP;

  const app = WK.app({
    workstation: { benchSize: [1000, 1000], benchCenter: [-60, -230] },
    gun: { wire: false, pose: 'opening' },
    view: 'overall',
    viewButtons: ['overall', 'station', 'top', 'side'],
    views: {
      overall: { target: [10, -90, 170], dir: [-0.62, 0.62, 0.48], dist: 1050 },
      station: { target: [40, -20, 165], dir: [-0.3, 0.55, 0.78], dist: 420 },
      top: { target: [10, -90, 150], dir: [0, -0.003, 1], dist: 900 },
      side: { target: [40, -60, 190], dir: [1, 0.05, 0.12], dist: 950 },
    },
    open: ['proposes', 'carries'],
    sections: {
      proposes:
        '<p><b>The end of a bead is a state with its own motion.</b> The brief describes it this way: the trigger stays held while the head lifts straight away, the wire breaks in the air, then trigger and pedal are released. The repo’s recorded practice calls it a “trail-off motion at end of bead” and snips a wire that sticks (<code>pressure-vessel.md</code> step 3). Guide 46 says only “release the trigger, then the pedal”, and the manual’s pullback and patch lengths act “after releasing the trigger” (p.23). All three are drawn here as events on one clock.</p>' +
        '<p>Pick an <b>arrangement</b> and scrub or play the escape. The tube keeps turning at 8 mm/s, the wire is still fed at 12 mm/s and the tip is fused in the bead. The wire goes taut only when the guide leaves faster than the wire is fed, and the drawing shows what each way of leaving does to <b>the wire, the beam spot, the clearance, and the support</b>. Change the direction of the line and watch the beam: along the barrel axis the spot does not move at all.</p>',
      carries:
        '<p><b>Hand:</b> the hand carries the gun and makes the motion; nothing else is asked. <b>Line:</b> a rail behind the gun along the escape direction, a carriage and a motor; the rail’s mast carries the reaction. <b>Pivot:</b> a hinge line 262 mm behind the nozzle (travel-04’s lid, use-16’s yoke); the arm and the hinge carry it. <b>Work drop:</b> the whole rotator stands on a shelf that sinks into a pit in the bench (room-01, room-15, travel-19); the gun stays in its holder and the holder must resist the wire’s pull. Toggle <i>Show the parts</i> off to see only the gun and the tube.</p>' +
        '<p>Free and restrained: the wire is the one thing joining the gun to the bead during the escape. Everything else is decided by the mover, its guides, and (afterwards) the seat or stop that restores the pose.</p>',
      software:
        '<p><b>Commands:</b> the stroke, its speed and its force limit (line, pivot, drop); the return; the rotator, which keeps turning until the pedal is released. <b>Observes:</b> mover position, mover force or motor current, and whether the stroke stalled. The stall is how a fused wire that the mover cannot break shows itself: HOLD, and a hand snips. <b>Cannot observe (drawn as blind):</b> the wire’s tension, where the beam is landing, whether the wire broke or stuck, and how much wire was pushed into the bead. Two cheap witnesses exist and are listed as questions: continuity between wire and work lead, and a light sensor on the weld glare.</p>' +
        '<p><b>Manual:</b> the hand’s lift, the trigger release, the pedal release, snipping. A hand fires and releases in every arrangement.</p>',
      tried:
        '<ul>' +
        '<li><b>What breaks the wire?</b> The guide exit G rides the gun; the wire tip P is fused in the bead and rides the tube. The wire needs length |G−P| and the feeder supplies l0 + 12 mm/s × t. When the need exceeds the supply by a slack allowance (0.3 mm, illustrative) the wire is in tension and breaks at the fused tip: in the air. Below the feed speed it does not go taut, it is pushed into the bead: that is the stuck wire. <i>Result:</i> the turning tube alone recedes the guide at 5.7 mm/s along the wire, so a lift of about 7 mm/s along the barrel is already enough while the pedal is held; with the tube stopped, about 12.3 mm/s. Speed is not what decides it. <i>Leaves:</i> the slack allowance, the joint’s strength Fb and how the retract cycle really behaves are all [unknown].</li>' +
        '<li><b>Direction against the wire.</b> The proxy wire axis is 13.5° off the barrel axis. A lift along the barrel puts 97% of the motion along the wire; straight up puts 61%, so the wire sweeps sideways across the bead and the guide takes a side load. <i>Leaves:</i> the real guide angle.</li>' +
        '<li><b>Where the beam goes while it is still on.</b> Along the barrel axis the beam line does not move: the spot stays on the bead and only defocuses. Every other direction (a lift, a pivot, a drop) walks the spot off the seam onto the plate or up the wall. If the laser stays on until the trigger is released the spot travels tens of millimetres; if it ends when the wire breaks (the wire may be the gun-side contact of the laser’s enable circuit, manual pp.19 and 32) it travels about a millimetre. <i>Leaves:</i> which is true [unknown]; the laser’s conduction alarm.</li>' +
        '<li><b>A mover at an angle multiplies its force into the wire.</b> Wire tension = mover force / cos(angle to the wire). A 25 N limit along the barrel gives 26 N of tension and 6 N sideways on the rail; a 30 N vertical drop gives 49 N and hands 39 N sideways to the guides and, through the wire, to the gun’s holder. <i>Change:</i> a force limit chosen between the joint’s strength and the holder’s capacity: too low and the wire stalls the stroke, too high and the wire drags the gun off its seat. <i>Leaves:</i> both numbers are unmeasured.</li>' +
        '<li><b>A stalled stroke is a state.</b> If the mover cannot break the wire it stops; the feeder keeps pushing wire into the bead until the trigger is released; the retract cycle then breaks it only if the feeder’s pull exceeds the joint. Otherwise the wire is stuck and a hand snips it with the head where it stopped (the repo’s step). The stall is the observation.</li>' +
        '<li><b>The work drop is not neutral.</b> It carries the vessel (1.40 kg in closure one, 2.01 kg in closure two [repo]) and everything on the stage, and drags a hose in closure two. The gun-side escapes are the same for both closures. See use-19.</li>' +
        '</ul>',
      unresolved:
        '<ul>' +
        '<li><b>Question for Derek: how do you end a bead?</b> Does the head lift before the trigger is released, how far, how fast, in which direction, and does the beam stop by itself when the wire leaves the metal? The hand row has to be filled from you (an inertial sensor on the shell and a light sensor would record it: use-08).</li>' +
        '<li>The joint’s strength Fb, the feeder’s pull and its retract length are not known. A spring scale on a stub gives Fb.</li>' +
        '<li>The proxy guide ends 66 mm from the dot; a real one stands much nearer. This changes the free length, not the break rule.</li>' +
        '<li>Nothing here models heat, spatter, the crater or how the pool freezes. The bead’s end is where a crack forms (repo); this scene says nothing about its quality.</li>' +
        '<li>Cables on a moving stage (motor lead, pedal, shoe, purge hose) are not drawn.</li>' +
        '</ul>',
      assumptions:
        '<ul>' +
        '<li><b>[repo]</b> wire feed 12 mm/s, bead travel 8 mm/s, tube and plate geometry, rotating mass 1.40 / 2.01 kg, trail-off motion, snip of a stuck wire. <b>[manual]</b> pullback and patch length after releasing the trigger (p.23); emission needs a complete clip-to-gun circuit and loss of conduction stops the beam (pp.19, 32). <b>[brief]</b> the lift-away with the trigger held and the retract cycle breaking the wire in air.</li>' +
        '<li><b>[derived]</b> wire axis, barrel axis and their 13.5° angle from the kit proxy; every direction and stroke in the table.</li>' +
        '<li><b>Illustrative:</b> gun mass 1.5 kg, stage payload 3 kg, slack allowance, Fb, feeder pull, force limits, speeds, accelerations, the hinge lever 262 mm, the swap volume (25 mm lift + 40 mm hand above the rim), the holder capacity 40 N, the pit and shelf.</li>' +
        '<li><b>Models:</b> straight-line kinematics of G and P, an inextensible wire with a slack allowance, static force balance. <b>Depicts only:</b> the mover parts, the hand, the shelf and pit.</li>' +
        '</ul>',
    },
    links: [{ label: 'Calculation (escape model)', href: '../../explorers/use/calc/w3_escape.mjs' }, { label: 'Directions at the station', href: '../../explorers/use/calc/w3_dirs.mjs' }],
  });
  const ws = app.workstation, gun = app.gun, benchZ = ws.benchZ;
  gun.setLaser(true);

  // ------------------------------------------------------------------ geometry from the kit's own pose
  const P0 = gun.group.position.clone(), Q0 = gun.group.quaternion.clone();
  const w0 = lp => V(lp[0], lp[1], lp[2]).applyQuaternion(Q0).add(P0);
  const N0 = w0([0, 0, 0]), D0 = w0([0, 0, -16]);
  const bDir = D0.clone().sub(N0).normalize(), aBack = bDir.clone().negate();
  const GB = [0, -24.7, 87.1], TIP = [0, 0, -16];
  const gvl = Math.hypot(GB[1] - TIP[1], GB[2] - TIP[2]), gdir = [0, (GB[1] - TIP[1]) / gvl, (GB[2] - TIP[2]) / gvl];
  const GE = [0, GB[1] - 40 * gdir[1], GB[2] - 40 * gdir[2]];
  const G0 = w0(GE), wOut = G0.clone().sub(D0).normalize(), L0 = G0.distanceTo(D0);
  const BACK = w0([0, 0, 253]);
  const COM = w0([0, -30, 120]);
  const ANG = (a, b) => Math.acos(Math.max(-1, Math.min(1, a.dot(b)))) / DEG;

  // guide, its leg and a stub of conduit ride the gun (the kit's own wire is off; this scene draws the wire)
  gun.group.add(P.rod(V(0, -12, 110), V(GB[0], GB[1], GB[2]), 2, 'gun'));
  gun.group.add(P.rod(V(GB[0], GB[1], GB[2]), V(GE[0], GE[1], GE[2]), 2.5, 'cable'));
  gun.group.add(P.rod(V(GB[0], GB[1], GB[2]), V(GB[0], GB[1] + 60 * gdir[1], GB[2] + 60 * gdir[2]), 1.8, 'wire'));

  // ------------------------------------------------------------------ state
  const SET = { hand: { v: 150, a: 3000, F: 60 }, line: { v: 40, a: 800, F: 25 }, pivot: { v: 60, a: 800, F: 25 }, drop: { v: 60, a: 800, F: 30 } };
  const S = {
    arr: 'line', dir: 'barrel', need: 20, R: 262, Fb: 20, Froll: 12, slack: 0.3, holder: 40, pull: 5, relDelay: 0.1, pedDelay: 0.5,
    turning: true, enableWire: true, closure: 1, mGun: 1.5, mStage: 3.0, lift: 25, handClr: 40, tt: 0, slow: 0.25,
  };
  const U = 8, FEED = 12, OMEGA = U / RI;                                  // mm/s, mm/s, rad/s [repo]
  const ARR = ['hand', 'line', 'pivot', 'drop'];
  const NAME = { hand: 'Hand', line: 'Line (gun axis)', pivot: 'Pivot (gun)', drop: 'Work drop' };
  const dirVec = () => S.dir === 'barrel' ? aBack.clone() : S.dir === 'wire' ? wOut.clone() : S.dir === 'vert' ? V(0, 0, 1) : V(1, 0, 0);
  const hinge = () => N0.clone().add(V(0, -S.R, 0));
  const vessel = () => (S.closure === 1 ? 1.40 : 2.01);
  const TRAVEL = { hand: 250, line: 250, pivot: 274, drop: 100 };

  // motion of a seat-pose world point / direction for arrangement arr at stroke s (gun side); dz = work drop
  function motion(arr, s) {
    if (arr === 'drop') return { pt: p => p.clone(), dir: d => d.clone(), dz: -s, q: null };
    if (arr === 'pivot') { const q = new THREE.Quaternion().setFromAxisAngle(V(1, 0, 0), s / S.R), H = hinge(); return { pt: p => H.clone().add(p.clone().sub(H).applyQuaternion(q)), dir: d => d.clone().applyQuaternion(q), dz: 0, q: q }; }
    const d = dirVec(); return { pt: p => p.clone().addScaledVector(d, s), dir: x => x.clone(), dz: 0, q: null };
  }
  function moverDir(arr, s) {
    if (arr === 'pivot') { const q = new THREE.Quaternion().setFromAxisAngle(V(1, 0, 0), s / S.R); return V(0, 0, 1).applyQuaternion(q); }
    if (arr === 'drop') return V(0, 0, 1);
    return dirVec();
  }
  // trapezoid profile to distance D
  function profile(D, vmax, amax) {
    D = Math.max(D, 1e-6);
    const ta = vmax / amax, da = 0.5 * amax * ta * ta;
    if (2 * da >= D) { const tp = Math.sqrt(D / amax); return { T: 2 * tp, vpk: amax * tp, s: t => t <= tp ? 0.5 * amax * t * t : t <= 2 * tp ? D - 0.5 * amax * (2 * tp - t) ** 2 : D, v: t => t <= tp ? amax * t : t <= 2 * tp ? amax * (2 * tp - t) : 0 }; }
    const tc = (D - 2 * da) / vmax, T = 2 * ta + tc;
    return { T: T, vpk: vmax, s: t => t <= ta ? 0.5 * amax * t * t : t <= ta + tc ? da + vmax * (t - ta) : t <= T ? D - 0.5 * amax * (T - t) ** 2 : D, v: t => t <= ta ? amax * t : t <= ta + tc ? vmax : t <= T ? amax * (T - t) : 0 };
  }
  // beam hit on the work (work frame): plate face z = CAP inside RI, or the wall's inner face up to the rim
  function beamHit(Nw, bw) {
    let best = null;
    if (bw.z < -1e-9) { const t = (CAP - Nw.z) / bw.z; if (t > 0) { const q = Nw.clone().addScaledVector(bw, t); if (Math.hypot(q.x, q.y) <= RI + 0.03) best = { t: t, q: q, part: 'plate' }; } }
    const a = bw.x * bw.x + bw.y * bw.y;
    if (a > 1e-12) {
      const b2 = Nw.x * bw.x + Nw.y * bw.y, c = Nw.x * Nw.x + Nw.y * Nw.y - RI * RI, disc = b2 * b2 - a * c;
      if (disc >= 0) { const t = (-b2 + Math.sqrt(disc)) / a; if (t > 0) { const q = Nw.clone().addScaledVector(bw, t); if (q.z >= CAP - 0.03 && q.z <= RIM && (!best || t < best.t - 1e-6)) best = { t: t, q: q, part: 'wall' }; } }
    }
    return best;
  }
  const toWork = (p, th, dz) => { const q = p.clone(); q.z -= dz; const c = Math.cos(-th), s = Math.sin(-th); return V(q.x * c - q.y * s, q.x * s + q.y * c, q.z); };
  const dirToWork = (d, th) => { const c = Math.cos(-th), s = Math.sin(-th); return V(d.x * c - d.y * s, d.x * s + d.y * c, d.z); };
  function spot(arr, s, th) {          // where the beam lands now, as an offset from the seam point it would have been on
    const m = motion(arr, s), Nn = m.pt(N0), bb = m.dir(bDir), h = beamHit(toWork(Nn, th, m.dz), dirToWork(bb, th));
    if (!h) return { off: null, part: 'over the rim', st: null, growth: null };
    const nom = toWork(D0, th, 0);                                   // the seam point the first spot has moved to with the work
    return { off: h.q.distanceTo(nom), part: h.part, st: h.t, growth: h.t - 16, q: h.q };
  }
  // stroke that gains `need` mm of standoff (distance along the beam to the first surface)
  function needStroke(arr) {
    if (S.need <= 0) return 0;
    for (let s = 0; s <= TRAVEL[arr]; s += 0.25) { const r = spot(arr, s, 0); if (r.st == null) return null; if (r.growth >= S.need) return s; }
    return null;
  }
  // gun samples (use-02's) against the tube and the tube-swap volume
  const SAMP = (function () {
    const s = [];
    const cyl = (z0, z1, r0, r1, n) => { for (let i = 0; i <= n; i++) { const t = i / n; s.push({ p: [0, 0, z0 + (z1 - z0) * t], r: r0 + (r1 - r0) * t }); } };
    cyl(0, 23, 2.2, 5, 4); cyl(23, 54, 8.5, 8.5, 4); cyl(54, 100, 5.5, 5.5, 6); cyl(100, 118, 12, 12, 3);
    [-17, 17].forEach(x => [-17, 17].forEach(y => [118, 185.5, 253].forEach(z => s.push({ p: [x, y, z], r: 0 }))));
    for (let i = 0; i <= 8; i++) { const t = i / 8; s.push({ p: [0, -25 - 86 * t, 172 + 60 * t], r: 15 }); }
    s.push({ p: [0, -118, 237], r: 6 });
    return s.map(o => ({ w: w0(o.p), r: o.r }));
  })();
  const distTube = p => {
    const rho = Math.hypot(p.x, p.y), inWall = rho > RI && rho < RO && p.z > 0 && p.z < RIM, inPlate = rho < RI && p.z > CAP - 6.35 && p.z < CAP;
    const dWall = Math.hypot(Math.max(0, RI - rho, rho - RO), Math.max(0, -p.z, p.z - RIM)), dPlate = Math.hypot(Math.max(0, rho - RI), Math.max(0, CAP - 6.35 - p.z, p.z - CAP));
    return Math.min(inWall ? -1 : dWall, inPlate ? -1 : dPlate);
  };
  const swapTop = () => RIM + S.lift + S.handClr;
  const distSwap = p => { const rho = Math.hypot(p.x, p.y), dr = rho - 95, dz = Math.max(-20 - p.z, p.z - swapTop()); return dr < 0 && dz < 0 ? Math.max(dr, dz) : Math.hypot(Math.max(0, dr), Math.max(0, dz)); };
  function clearAt(arr, s) {
    const m = motion(arr, s); let mt = Infinity, ms = Infinity;
    for (const o of SAMP) { const q = m.pt(o.w); q.z -= m.dz; mt = Math.min(mt, distTube(q) - o.r); ms = Math.min(ms, distSwap(q) - o.r); }
    return { tube: mt, swap: ms };
  }
  function swapStroke(arr) { for (let s = 0; s <= TRAVEL[arr]; s += 1) { const c = clearAt(arr, s); if (c.swap >= 0 && clearAt(arr, s + 8).swap >= 0) return s; } return null; }
  function minRim(arr, sEnd) { let m = Infinity; for (let s = 0; s <= sEnd + 1e-6; s += Math.max(1, sEnd / 40)) m = Math.min(m, clearAt(arr, s).tube); return m; }

  // ------------------------------------------------------------------ the escape, simulated (same model as calc/w3_escape.mjs)
  function simulate(arr) {
    const st = SET[arr], need = needStroke(arr), stroke = need == null ? Math.min(60, TRAVEL[arr]) : need;
    const pr = profile(stroke, st.v, st.a), tRel = pr.T + S.relDelay, tPed = tRel + S.pedDelay, dt = 0.002;
    const rows = []; let fused = true, sHold = null, stall = null, tBreak = null, sBreak = null, Tpk = 0, slackMax = 0;
    for (let t = 0; t <= tPed + 1e-9; t += dt) {
      const th = S.turning ? OMEGA * t : 0;
      let s = pr.s(Math.min(t, pr.T)); if (sHold != null) s = Math.min(s, sHold);
      const m = motion(arr, s), Gn = m.pt(G0), Pn = D0.clone().applyAxisAngle(V(0, 0, 1), th); Pn.z += m.dz;
      const feed = t <= tRel ? FEED * t : FEED * tRel;
      const deficit = Gn.distanceTo(Pn) - L0 - feed;
      let tension = 0;
      if (fused && t <= tRel) {
        slackMax = Math.max(slackMax, -deficit);
        if (deficit >= S.slack) {
          const wd = Gn.clone().sub(Pn).normalize(), along = Math.max(0.05, Math.abs(wd.dot(moverDir(arr, s))));
          const Tmax = st.F / along;
          if (Tmax >= S.Fb) { fused = false; tBreak = t; sBreak = s; tension = S.Fb; Tpk = Math.max(Tpk, S.Fb); }
          else if (sHold == null) { sHold = s; stall = { t: t, s: s, T: Tmax }; tension = Tmax; Tpk = Math.max(Tpk, Tmax); }
          else tension = Tmax;
        }
      }
      rows.push({ t: t, s: s, th: th, deficit: deficit, tension: tension, fused: fused });
    }
    let outcome, tag;
    if (tBreak != null) { outcome = 'broke in the air at ' + (tBreak * 1000).toFixed(0) + ' ms, ' + sBreak.toFixed(1) + ' mm into the stroke'; tag = 'air'; }
    else if (stall) { outcome = 'STALLED at ' + stall.s.toFixed(1) + ' mm: the mover reaches its limit (' + stall.T.toFixed(0) + ' N in the wire) below the joint (' + S.Fb + ' N)'; tag = 'stall'; }
    else { outcome = 'never taut: the wire is fed into the bead as the head leaves'; tag = 'slack'; }
    let afterRel = null;
    if (tBreak == null) afterRel = S.Froll >= S.Fb ? 'the retract breaks it at trigger release' : 'STUCK: the retract cannot break it (' + S.Froll + ' N < ' + S.Fb + ' N): snip';

    visual: () => [gun.group], help: 'Four families already in the study: today’s hand; use-02 and room-12; travel-04 and use-16; use-13, room-15 and travel-19.',
    onChange: v => { S.arr = v; syncMover(); recompute(); } });
  gA.slider({ id: 'tt', label: 'Escape clock (0 = trigger held, laser on)', min: 0, max: 1, step: 0.005, value: 0, kind: 'state', visual: () => [gun.group, wireRod], help: 'Scrub from the lift starting to the pedal release. The white line on the timeline follows.', format: v => (v * (A ? A.sim.tPed : 1)).toFixed(2) + ' s', onChange: v => { S.tt = v; if (A) update(); } });
  gA.button({ id: 'play', label: 'Play the escape (slow motion)', kind: 'state', noVisual: true, help: 'Plays the clock at the slow-motion factor below.', onClick: () => { if (S.tt >= 1) app.ui.set('tt', 0); playing = true; app.animate(true); } });
  gA.slider({ id: 'slow', label: 'Slow motion factor', min: 0.05, max: 1, step: 0.05, value: 0.25, kind: 'view', noVisual: true, help: '1 = real time; the escape lasts a fraction of a second.', onChange: v => { S.slow = v; } });
  gA.radio({ id: 'dir', label: 'Direction of a line or a hand lift', options: [{ value: 'barrel', label: 'along the barrel' }, { value: 'wire', label: 'along the wire' }, { value: 'vert', label: 'straight up' }, { value: 'radial', label: 'radially out' }], value: 'barrel', kind: 'branch', visual: () => [escArrow, pathLine, gun.group],
    help: 'Applies to the hand and the line. Along the barrel the beam does not move; up sweeps the wire and the beam; radially out never tightens the wire.', onChange: v => { S.dir = v; recompute(); } });

  const gM = app.ui.group('Mover (proposed actuator settings)', { help: 'The gun-side line, the pivot and the work drop each keep their own setting.' });
  gM.slider({ id: 'v', label: 'Peak escape speed', min: 5, max: 200, step: 5, value: 40, unit: 'mm/s', kind: 'actuator', visual: () => [carr, armRod, shelf], help: 'Speed matters little for breaking the wire; it matters for how long the beam is on while the head leaves.', onChange: v => { if (S.arr !== 'hand') { SET[S.arr].v = v; recompute(); } } });
  gM.slider({ id: 'a', label: 'Acceleration', min: 100, max: 4000, step: 50, value: 800, unit: 'mm/s²', kind: 'actuator', visual: () => [carr, armRod, shelf], help: 'Sets the inertial load; against the weight it is small unless the move is snapped.', onChange: v => { if (S.arr !== 'hand') { SET[S.arr].a = v; recompute(); } } });
  gM.slider({ id: 'F', label: 'Force limit (along the mover’s own direction)', min: 2, max: 80, step: 1, value: 25, unit: 'N', kind: 'actuator', visual: () => [motL, motP, motD], help: 'The wire sees this divided by the cosine of the angle to the wire. It must beat the joint and stay below what the holder can resist.', onChange: v => { if (S.arr !== 'hand') { SET[S.arr].F = v; recompute(); } } });
  const gH = app.ui.group('The hand (unmeasured; scene edits)', { help: 'Derek’s real values would replace these: an inertial sensor on the shell would record them (use-08).' });
  gH.slider({ id: 'hv', label: 'Hand: peak lift speed', min: 20, max: 500, step: 10, value: 150, unit: 'mm/s', kind: 'scene', visual: () => [handBox], onChange: v => { SET.hand.v = v; if (S.arr === 'hand') recompute(); } });
  gH.slider({ id: 'ha', label: 'Hand: peak acceleration', min: 200, max: 8000, step: 100, value: 3000, unit: 'mm/s²', kind: 'scene', visual: () => [handBox], onChange: v => { SET.hand.a = v; if (S.arr === 'hand') recompute(); } });
  gH.slider({ id: 'hF', label: 'Hand: force it can pull with', min: 5, max: 150, step: 5, value: 60, unit: 'N', kind: 'scene', visual: () => [handBox], onChange: v => { SET.hand.F = v; if (S.arr === 'hand') recompute(); } });

  const gW = app.ui.group('The wire and the laser (assumptions you can change)', { help: 'All unmeasured. Break the wire and see what moves.' });
  gW.slider({ id: 'need', label: 'Standoff to gain before the beam matters', min: 0, max: 40, step: 1, value: 20, unit: 'mm', kind: 'scene', visual: () => [pathLine, escArrow], help: '0 = the sequence as the guide writes it (release the trigger, then the pedal): no escape.', onChange: v => { S.need = v; recompute(); } });
  gW.slider({ id: 'Fb', label: 'Fused joint strength', min: 2, max: 150, step: 1, value: 20, unit: 'N', kind: 'scene', visual: () => [stub], help: 'What it takes to break the wire off a frozen bead. Unmeasured: a spring scale on a stub would say. The wire itself holds about 270 N.', onChange: v => { S.Fb = v; recompute(); } });
  gW.slider({ id: 'Froll', label: 'Feeder’s pull at the retract', min: 2, max: 80, step: 1, value: 12, unit: 'N', kind: 'scene', noVisual: true, help: 'What the retract cycle can pull with when the trigger is released. Unmeasured.', onChange: v => { S.Froll = v; recompute(); } });
  gW.slider({ id: 'slack', label: 'Slack allowance before the wire is taut', min: 0.05, max: 3, step: 0.05, value: 0.3, unit: 'mm', kind: 'scene', noVisual: true, help: 'Elastic stretch, roll slip and conduit slack together. Illustrative.', onChange: v => { S.slack = v; recompute(); } });
  gW.slider({ id: 'pull', label: 'Retract (pullback) length', min: 1, max: 15, step: 0.5, value: 5, unit: 'mm', kind: 'scene', visual: () => [wireRod], help: 'Manual p.23 has a pullback length after the trigger releases. The value here is a guess.', onChange: v => { S.pull = v; update(); } });
  gW.toggle({ id: 'turning', label: 'Tube keeps turning through the escape (pedal held)', value: true, kind: 'state', visual: () => [ws.turntable], help: 'The guide sequence releases the trigger first and the pedal second. Off: the pedal came up first; the wire then needs about 12.3 mm/s along its axis to go taut.', onChange: v => { S.turning = v; recompute(); } });
  gW.radio({ id: 'enable', label: 'The laser ends when', options: [{ value: 'wire', label: 'the wire breaks (wire is the enable contact)' }, { value: 'release', label: 'the trigger is released' }], value: 'wire', kind: 'branch', visual: () => [gun.laser], help: 'Manual pp.19 and 32: emission needs a complete circuit clip-to-gun, and loss of conduction stops the beam. Which part of the gun closes it is not said.', onChange: v => { S.enableWire = v === 'wire'; update(); } });
  const gS = app.ui.group('Station and stage (scene edits)');
  gS.radio({ id: 'closure', label: 'Closure', options: [{ value: '1', label: 'one: bare end down (1.40 kg)' }, { value: '2', label: 'two: inverted on plate 1 (2.01 kg)' }], value: '1', kind: 'state', noVisual: true, help: 'Only the work drop changes: the stage carries the vessel. Gun-side escapes do not.', onChange: v => { S.closure = +v; recompute(); } });
  gS.slider({ id: 'R', label: 'Pivot: hinge behind the nozzle', min: 120, max: 400, step: 5, value: 262, unit: 'mm', kind: 'scene', visual: () => [hingeBar, armRod], help: 'travel-04’s hinge is 262 mm from the nozzle; use-16’s trunnion 185 mm from the nozzle in another attitude.', onChange: v => { S.R = v; recompute(); } });
  gS.slider({ id: 'holder', label: 'Gun holder’s capacity along the wire', min: 5, max: 120, step: 5, value: 40, unit: 'N', kind: 'scene', noVisual: true, help: 'What the seat and holder resist before the gun unseats; use-02 needs about 40 N of preload for a 5 N pull at a 250 mm lever.', onChange: v => { S.holder = v; recompute(); } });
  gS.slider({ id: 'mStage', label: 'Stage payload beyond the vessel', min: 0, max: 8, step: 0.5, value: 3, unit: 'kg', kind: 'scene', noVisual: true, help: 'Turntable, nest, base and motor that ride the drop. Unmeasured.', onChange: v => { S.mStage = v; recompute(); } });
  gS.slider({ id: 'lift', label: 'Swap volume: tube lifted clear of the nest', min: 10, max: 40, step: 1, value: 25, unit: 'mm', kind: 'scene', visual: () => [swapVol], help: 'Illustrative. With the hand allowance below it sets the top of the volume the gun must leave.', onChange: v => { S.lift = v; recompute(); } });
  gS.slider({ id: 'handClr', label: 'Swap volume: hand allowance above that', min: 10, max: 60, step: 1, value: 40, unit: 'mm', kind: 'scene', visual: () => [swapVol], help: 'Illustrative.', onChange: v => { S.handClr = v; recompute(); } });
  const gV = app.ui.group('View');
  gV.toggle({ id: 'parts', label: 'Show the parts (rail, hinge, shelf, hand)', value: true, kind: 'view', onChange: v => { if (!v) mech.forEach(o => { o.visible = false; }); else layoutMech(); app.invalidate(); } });
  gV.toggle({ id: 'axes', label: 'Show barrel and wire axes', value: true, kind: 'view', onChange: v => { wireAxis.visible = barrelAxis.visible = v; app.invalidate(); } });
  gV.toggle({ id: 'swapvol', label: 'Show the tube-swap volume', value: true, kind: 'view', onChange: v => { swapVol.visible = v; app.invalidate(); } });

  function syncMover() {
    const st = SET[S.arr];
    app.ui.set('v', st.v, { silent: true }); app.ui.set('a', st.a, { silent: true }); app.ui.set('F', st.F, { silent: true });
    const hand = S.arr === 'hand';
    ['v', 'a', 'F'].forEach(id => app.ui.enable(id, !hand)); ['hv', 'ha', 'hF'].forEach(id => app.ui.enable(id, hand));
    app.ui.enable('dir', hand || S.arr === 'line'); app.ui.enable('R', S.arr === 'pivot');
  }
  syncMover();
  const curRow = () => A.sim.rows[Math.min(A.sim.rows.length - 1, Math.max(0, Math.round(S.tt * A.sim.tPed / 0.002)))];
  app.label(() => gun.local('nozzleTip'), 'nozzle', { cls: 'gun' });
  app.label(() => D0.clone().add(V(0, 0, S.arr === 'drop' ? motion('drop', curRow().s).dz : 0)), 'seam and wire tip', { cls: 'wire' });
  app.label(() => S.arr === 'line' ? carr.position.clone() : S.arr === 'pivot' ? hinge() : S.arr === 'drop' ? V(0, 0, benchZ - 5 + motion('drop', curRow().s).dz) : handBox.position.clone(), 'mover', { cls: 'actuated' });
  recompute();
})();
</script>
</body>
</html>
