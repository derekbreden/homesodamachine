<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return seat</title>
<link rel="stylesheet" href="../../kit/weldkit.css">
<script type="application/json" id="scene-meta">
{
  "id": "travel-04-return-seat",
  "title": "Return seat: swing away, come back to a kinematic seat",
  "by": "travel",
  "origin": "swarm",
  "status": "developed",
  "summary": "The gun rides a hinged carrier that swings up for the tube swap and lands on a three-ball magnetic seat: adjust once per batch, return every time. Try the swing, the tube lift and slide, and a speck of debris under one ball to see what a micrometre at the seat is at the dot.",
  "tags": [
    "kinematic seat",
    "swing-away",
    "hard stop",
    "tube swap",
    "debris"
  ],
  "branchOf": [],
  "combines": [],
  "transferable": [
    "ball-and-groove seat with contact sensing",
    "seat error x lever = dot error",
    "hinge must not fight the seat"
  ],
  "how": {
    "motion": "gun and carrier swing about a hinge; motor or hand lifts, magnets and gravity seat",
    "load": "post and block carry the seated gun; hinge ear carries it while it swings",
    "reference": "three balls in three grooves define the work pose; nothing else does",
    "observe": "electrical continuity per ball, plus the usual camera on the dot",
    "use": "swing up, swap tube, come back; the fine stages adjust, the seat returns"
  },
  "software": {
    "commands": [
      "swing up / down (small motor or gas strut, proposed)",
      "seat magnets (permanent: none commanded)"
    ],
    "observes": [
      "ball-to-groove contact per ball (continuity)",
      "dot against the seam after returning (camera)"
    ],
    "manual": [
      "cleaning the seat",
      "lifting and sliding the tube",
      "adjusting the seat shims once per batch"
    ]
  },
  "notes": [
    "../../explorers/travel/ideas/travel-04-return-seat.md",
    "../../explorers/travel/calc/05-shuttle-clearance.mjs"
  ],
  "sources": [
    "../../sourcing/travel.md"
  ]
}
</script>
</head>
<body>
<script src="../../kit/vendor/three.min.js"></script>
<script src="../../kit/vendor/OrbitControls.js"></script>
<script src="../../kit/weldkit.js"></script>
<script>
(function () {
  const V = (x, y, z) => new THREE.Vector3(x, y, z), P = WK.prim, DEG = WK.deg;
  const RI = WK.INNER_RADIUS, CAPTOP = WK.CAP_TOP, RIMZ = WK.DIM.tubeHeight, RO = WK.DIM.tubeOd / 2;
  const BENCH_Z = -WK.RIG.benchToTubeBottom;
  const GUIDE_H = 12;   // illustrative: how far the tube must lift to leave the nest before it can slide sideways

  const app = WK.app({
    workstation: { bench: false }, gun: { pose: 'opening' },
    viewButtons: ['overall', 'joint', 'seat', 'side'],
    views: {
      overall: { target: [-10, -100, 150], dir: [-0.6, 0.55, 0.42], dist: 1450 },
      joint: { target: [58, -6, 154], dir: [-0.80, 0.26, 0.46], dist: 220 },
      seat: { target: [-6, -175, 230], dir: [-0.9, -0.3, 0.35], dist: 340 },
      side: { target: [10, -100, 150], dir: [1, 0.03, 0.06], dist: 1400 },
    },
    open: ['proposes', 'tried'],
    sections: {
      proposes: '<p>The gun in its shell is carried by a plate that <b>seats</b> on three balls in three grooves (a kinematic seat, held by magnets) and hinges up about a pin at the back. Position at the work is defined by the seat alone, so it repeats however the arm got there. Adjustments (per batch) are done to the seat’s shims; the fine stages of other scenes do the per-tube trim.</p>' +
        '<p>The swing is the <b>tube swap</b> motion, and the <b>end-of-weld lift-off</b> if the sequence has one (the coordinator’s shared context says the head lifts away with the trigger held; guide 46 says only “release the trigger, then the pedal”: unconfirmed). Lift the tube (≥ 12 mm, illustrative, to leave the nest) then slide it out sideways: it clears only if the nozzle tip is above the lifted rim.</p>',
      carries: '<p><b>Amber</b> shell and stem carry the gun to the <b>teal</b> carrier plate and balls. <b>Slate</b> block and post take it from the room. The hinge ear carries the assembly only while it swings; when seated the balls carry it (weight plus magnet preload). The umbilical and wire conduit hang on the moving side in this drawing and would ride the swing: a routing question, not solved.</p>',
      software: '<p>Each ball-and-groove contact can be an electrical switch, so software can tell <b>seated / not seated per contact</b> (three lines) before it trusts the pose. It cannot tell whether a conductive speck under a ball has tilted the gun: only a camera on the dot could. The swing is the only command; the seat itself is passive.</p>',
      tried: '<p><b>Break 1: the seat is an amplifier.</b> A speck of dust under one ball tilts the carrier by (speck / distance to the other two balls), and the dot is 230 mm from the seat: 50 µm on a 30 mm circle is 0.26 mm at the dot. <i>Change:</i> spread the balls (60 mm halves it), keep the seat close to the dot, clean it, and sense the contacts.</p>' +
        '<p><b>Break 2: the hinge fights the seat.</b> A pin hinge plus a three-ball seat constrains the plate eleven ways; any hinge play or friction pushes the seat off its balls. <i>Repair:</i> a forked hinge with a slot that only guides. <i>Leaves standing:</i> a slotted hinge is looser when swung: the arm needs a stop.</p>' +
        '<p><b>Break 3: the swing is not enough by itself.</b> A 12° swing lifts the nozzle about 54 mm (measured in this scene: 54.5 mm up and 1.4 mm along the tangent about a hinge 262 mm away; an earlier text here said about 45 mm): enough to lift the tube 12 mm and slide it out sideways (about 13 mm of raise clears it in this pose, calc/07), not to lift it straight out (about 144 mm of raise). The tube can be lifted about 55 mm with the gun seated.</p>',
      unresolved: '<p>How a 5 m umbilical and the wire conduit ride the swing without twisting the fibre. How large a magnetic preload the seat needs against umbilical pull (gun mass and cable pull are unknown). Whether printed grooves and steel balls repeat to something useful (typical kinematic-coupling repeatability is a literature claim not checked here). The nest’s real lift height (12 mm is a placeholder).</p>',
      assumptions: '<ul><li>Gun geometry and opening pose: kit proxy. Seat position, ball circle (30 mm), hinge line, swing range are illustrative.</li>' +
        '<li>Recess 6.35 mm, nest pilot 4.5 mm <b>[repo]</b>; the 12 mm lift-to-clear is a placeholder. Debris amounts are made up.</li>' +
        '<li>Seat tilt uses the exact three-point rule: raising one ball by d tilts the plate by d / (its distance from the line through the other two), which is 1.5 × the circle radius.</li></ul>',
    },
  });
  const ws = app.workstation, gun = app.gun;

  // context
  const bench = P.box(980, 820, 20, 'fixed'); bench.position.set(-40, -120, BENCH_Z - 10); app.add(bench);
  (function grid() { const pts = [], z = BENCH_Z + 0.2; for (let x = -500; x <= 420; x += 50) pts.push(V(x, -520, z), V(x, 280, z)); for (let y = -500; y <= 280; y += 50) pts.push(V(-530, y, z), V(450, y, z));
    const g = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), WK.lineMat('fixed', { opacity: 0.4 })); g.userData.role = 'fixed'; g.userData.occludes = false; app.add(g); })();
  // tube can lift and slide: wrap tubeGroup
  const tubeLift = new THREE.Group(); ws.group.add(tubeLift); ws.group.remove(ws.tubeGroup); tubeLift.add(ws.tubeGroup);

  const gunBase = { pos: gun.group.position.clone(), quat: gun.group.quaternion.clone() };
  const shell = gun.addShell({ style: 'sleeve', from: 'barrelMid', to: 'gripBase', clearance: 3, role: 'load', opacity: 0.30 });
  const lug = shell.attachPoint('gripMid', { side: 'grip', role: 'load', size: 9 });
  app.scene.updateMatrixWorld(true);
  const lw0 = lug.world();
  // seat geometry (world, at the seated pose)
  const Cc = V(lw0.x, lw0.y, lw0.z - 70);                     // carrier plate centre
  const SEAT_R0 = 30, ballZ = Cc.z - 6;
  const hinge = { p: V(Cc.x, Cc.y - 70, Cc.z - 6), u: V(1, 0, 0) };
  const ballAng = [90, 210, 330].map(a => a * DEG);

  // fixed side: block, post, hinge bracket (slate, teal grooves)
  const block = P.box(120, 120, 22, 'fixed'); block.position.set(Cc.x, Cc.y, ballZ - 4 - 11); app.add(block);
  app.add(P.rod(V(Cc.x, Cc.y, BENCH_Z), V(Cc.x, Cc.y, ballZ - 15), 10, 'fixed'));
  const postFoot = P.box(150, 150, 14, 'fixed'); postFoot.position.set(Cc.x, Cc.y, BENCH_Z + 7); app.add(postFoot);
  const grooves = ballAng.map(a => { const g = P.box(22, 6, 4, 'locate'); g.userData.a = a; app.add(g); return g; });
  const hingeBracket = P.box(50, 16, 40, 'fixed'); hingeBracket.position.set(hinge.p.x, hinge.p.y - 10, hinge.p.z - 8); app.add(hingeBracket);
  const hingePinFix = P.rod(hinge.p.clone().addScaledVector(hinge.u, -30), hinge.p.clone().addScaledVector(hinge.u, 30), 4.5, 'fixed'); app.add(hingePinFix);
  const slot = P.box(14, 4, 14, 'ghost'); slot.position.copy(hinge.p); app.add(slot);

  // moving side group: plate, balls, stem, hinge ear. Rotated with the gun.
  const carrier = new THREE.Group(); app.scene.add(carrier);
  const plate = P.box(96, 96, 8, 'locate'); plate.position.copy(Cc); carrier.add(plate);
  const balls = ballAng.map(a => { const b = P.sphere(4, 'locate'); b.position.set(Cc.x + SEAT_R0 * Math.cos(a), Cc.y + SEAT_R0 * Math.sin(a), ballZ); carrier.add(b); return b; });
  const stem = P.rod(V(lw0.x, lw0.y, lw0.z), V(Cc.x, Cc.y, Cc.z + 4), 6, 'load'); carrier.add(stem);
  const ear = P.box(40, 20, 12, 'load'); ear.position.set(hinge.p.x, hinge.p.y + 6, hinge.p.z + 4); carrier.add(ear);
  const motor = P.box(34, 34, 34, 'actuated'); motor.position.copy(hinge.p.clone().addScaledVector(hinge.u, 55)); app.add(motor);
  app.label(() => motor.position, 'swing motor (proposed)', { cls: 'actuated' });
  app.label(() => balls[0].getWorldPosition(new THREE.Vector3()), 'ball', { cls: 'locate' });
  app.label(() => block.position.clone().add(V(0, 0, 14)), 'block with V-grooves', { cls: 'fixed' });
  app.label(() => hinge.p.clone().add(V(0, -20, 25)), 'hinge (guides only)', { cls: 'fixed' });
  app.label(() => gun.dotWorld(), 'dot', { cls: 'laser' });
  const nozzleGhost = P.sphere(3, 'ghost'); app.addHelper(nozzleGhost);

  // observers
  app.inset.add({ id: 'obs', label: 'Outside camera (proposed)', position: V(-250, -45, 340), target: () => gun.dotWorld(), fov: 32, near: 30, far: 1600, size: [220, 150], corner: 'br', noise: 0.2 });
  const inv = new THREE.Matrix4();
  function seamNow() {
    app.scene.updateMatrixWorld(true); inv.copy(ws.tubeGroup.matrixWorld).invert();
    const d = gun.dotWorld().applyMatrix4(inv);
    return { radial: Math.hypot(d.x, d.y) - RI, vertical: d.z - CAPTOP, along: 0, total: 0 };
  }
  app.cornerInset({ gun: { dotOffset: () => seamNow(), beamDir: () => gun.beamDir() } });
  const prof = z => (z < 23 ? 2.2 + 2.8 * z / 23 : z < 54 ? 8.5 : z < 100 ? 5.5 : 12);
  function rimClearance() {
    app.scene.updateMatrixWorld(true); inv.copy(ws.tubeGroup.matrixWorld).invert();
    let min = Infinity;
    for (let z = 0; z <= 118; z += 4) { const p = gun.local([0, 0, z]).applyMatrix4(inv); const d = Math.hypot(Math.hypot(p.x, p.y) - (RI + RO) / 2, p.z - RIMZ) - (RO - RI) / 2 - prof(z); if (d < min) min = d; }
    return min;
  }
  function tipAboveRim() { app.scene.updateMatrixWorld(true); inv.copy(ws.tubeGroup.matrixWorld).invert(); const p = gun.local('nozzleTip').applyMatrix4(inv); return p.z - RIMZ; }

  const setH = app.ui.readout('h', 'Nozzle tip above the rim'), setLever = app.ui.readout('lever', 'Seat to dot (lever)'), setTilt = app.ui.readout('tilt', 'Seat tilt from the speck'), setDot = app.ui.readout('dotd', 'Dot to seam, now');
  function rotAbout(pt, u, ang) {
    const m = new THREE.Matrix4().makeTranslation(pt.x, pt.y, pt.z);
    m.multiply(new THREE.Matrix4().makeRotationAxis(u, ang));
    m.multiply(new THREE.Matrix4().makeTranslation(-pt.x, -pt.y, -pt.z));
    return m;
  }
  const gunBaseM = new THREE.Matrix4().compose(gunBase.pos, gunBase.quat, V(1, 1, 1));
  carrier.matrixAutoUpdate = false;
  function sync() {
    const al = app.ui.get('swing'), seated = al < 0.5, a = seated ? 0 : al;
    const deb = app.ui.get('debris') / 1000, ball = +app.ui.get('ball'), R = app.ui.get('spread');
    // seat tilt from a speck under one ball (only when seated): rotate about the line through the other two balls (exact three-point rule)
    const bpos = ballAng.map(ang => V(Cc.x + R * Math.cos(ang), Cc.y + R * Math.sin(ang), ballZ));
    let tilt = 0, Md = new THREE.Matrix4();
    if (seated && deb > 0) {
      const i = ball - 1, o1 = bpos[(i + 1) % 3], o2 = bpos[(i + 2) % 3], line = o2.clone().sub(o1).normalize();
      tilt = deb / (1.5 * R);
      const sgn = line.clone().cross(bpos[i].clone().sub(o1)).z >= 0 ? 1 : -1;      // sign so that the raised ball moves up
      Md = rotAbout(o1, line, sgn * tilt);
    }
    const M = rotAbout(hinge.p, hinge.u, a * DEG).multiply(Md);
    M.clone().multiply(gunBaseM).decompose(gun.group.position, gun.group.quaternion, gun.group.scale); gun.setTransform(gun.group.position, gun.group.quaternion);
    carrier.matrix.copy(M); carrier.matrixWorldNeedsUpdate = true;
    balls.forEach((b, i) => { b.position.set(Cc.x + R * Math.cos(ballAng[i]), Cc.y + R * Math.sin(ballAng[i]), ballZ); });
    grooves.forEach((g, i) => { g.position.set(Cc.x + R * Math.cos(ballAng[i]), Cc.y + R * Math.sin(ballAng[i]), ballZ - 3); g.rotation.z = ballAng[i] + Math.PI / 2; });
    const fork = app.ui.get('hingetype') === 'fork'; slot.visible = fork; hingePinFix.visible = !fork;
    // tube: lift, then slide out toward +x only when lifted enough
    const lift = app.ui.get('lift'); let slide = app.ui.get('slide'); const canSlide = lift >= GUIDE_H - 0.01; if (!canSlide) slide = 0;
    tubeLift.position.set(slide, 0, lift);
    ws.spin.on = false;
    app.scene.updateMatrixWorld(true);
    gun.updateLaser();
    const tip = tipAboveRim(), off = seamNow(), leverD = gun.dotWorld().distanceTo(Cc);
    setH(tip.toFixed(1), 'mm'); setLever(leverD.toFixed(0), 'mm'); setTilt((tilt * 1000).toFixed(2), 'mrad'); setDot(Math.hypot(off.radial, off.vertical).toFixed(3), 'mm');
    const clr = rimClearance();
    app.badge('rim', clr < 0 ? 'barrel or nozzle meets the rim ring (bare barrel, drawn geometry): the tube cannot be moved this way' : null, 'limit');
    app.badge('seat', seated ? 'seated: three balls in three grooves' : 'unseated: hinge only, position is not defined', seated ? 'ok' : 'warn');
    app.badge('slide', (app.ui.get('slide') > 0 && !canSlide) ? 'lift the tube at least ' + GUIDE_H + ' mm (illustrative) before it can slide' : null, 'warn');
    const ready = clr > 0 && tip > lift + 3;
    app.badge('swap', (lift >= GUIDE_H && slide > 30) ? (ready ? 'tube slid out: the nozzle cleared the lifted rim' : 'the lifted rim is not clear of the nozzle') : null, ready ? 'ok' : 'limit');
    const vis = app.inset.markVisibility('obs', gun.dotWorld());
    const conts = balls.map((b, i) => (seated && !(deb > 0 && (i + 1) === ball)) ? 'closed' : 'open').join(' / ');
    app.io.set({
      commands: [{ name: 'Swing', value: al.toFixed(1), unit: '°', note: 'small motor or gas strut; seat is passive' }],
      observes: [
        { name: 'Seat contacts (ball 1 / 2 / 3)', value: conts, status: 'seen', note: 'continuity per ball: a nonconductive speck shows as open, a conductive one does not' },
        { name: 'Dot visible to the camera', value: vis.visible ? 'yes' : (vis.blocked ? 'blocked' : 'out of view'), status: vis.visible ? 'seen' : 'blind', note: 'drawn-scene line of sight' },
        { name: 'Dot vs seam (r, z)', value: vis.visible ? off.radial.toFixed(2) + ', ' + off.vertical.toFixed(2) : '-', unit: vis.visible ? 'mm' : '', status: vis.visible ? 'partly' : 'blind', note: 'exact in this scene; a sensor would estimate it' },
        { name: 'Tube lift / slide', value: lift.toFixed(0) + ' / ' + slide.toFixed(0), unit: 'mm', status: 'manual', note: 'a person does this; no sensor drawn' },
        { name: 'Cable path during the swing', value: '-', status: 'unresolved', note: 'not designed' },
      ],
      manual: ['Clean the seat', 'Lift the tube and slide it out and in', 'Shim the seat once per batch'],
    });
  }

  const sw = app.ui.group('Swing (proposed motor)');
  sw.slider({ id: 'swing', label: 'Swing up', min: 0, max: 40, step: 0.5, value: 0, unit: '°', kind: 'actuator', visual: () => [motor, gun.group], help: 'Below 0.5° the carrier snaps onto the seat. Above, only the hinge holds it.', onChange: sync });
  sw.radio({ id: 'hingetype', label: 'Hinge', options: [{ value: 'pin', label: 'pin (overconstrains the seat)' }, { value: 'fork', label: 'forked slot (guides only)' }], value: 'fork', kind: 'branch', visual: () => [hingePinFix, slot], onChange: sync });
  const tb = app.ui.group('Tube swap (by hand)', { help: 'Manual steps. They edit the scene; nothing here is an actuator.' });
  tb.slider({ id: 'lift', label: 'Lift the tube off the nest', min: 0, max: 30, step: 0.5, value: 0, unit: 'mm', kind: 'scene', visual: () => ws.tubeGroup, help: 'The nest holds the tube until it has lifted about 12 mm (placeholder).', onChange: sync });
  tb.slider({ id: 'slide', label: 'Slide it out sideways', min: 0, max: 160, step: 1, value: 0, unit: 'mm', kind: 'scene', visual: () => ws.tubeGroup, help: 'Toward +x, the open front. Only after the lift.', onChange: sync });
  const sd = app.ui.group('Seat and a speck (scene edits)', { help: 'What a micrometre at the seat is at the dot. Only applies while seated.' });
  sd.slider({ id: 'debris', label: 'Speck under one ball', min: 0, max: 200, step: 1, value: 40, unit: 'µm', kind: 'scene', visual: () => balls, onChange: sync });
  sd.select({ id: 'ball', label: 'Which ball', options: ['1', '2', '3'], value: '1', kind: 'scene', visual: () => balls, onChange: sync });
  sd.slider({ id: 'spread', label: 'Ball circle radius', min: 15, max: 60, step: 1, value: 30, unit: 'mm', kind: 'scene', visual: () => balls, help: 'A wider seat divides the same speck into a smaller tilt.', onChange: sync });
  const vw = app.ui.group('View');
  vw.toggle({ id: 'ghost', label: 'See-through tube', value: true, kind: 'view', onChange: v => { ws.setGhost(v); app.invalidate(); } });
})();
</script>
</body>
