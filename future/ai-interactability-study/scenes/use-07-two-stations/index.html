      manual: ['Loading, indicating, plate, contact set-up at each station', 'Trigger, snipping', 'Routing purge and work-lead for two stations'],
    });
  }

  const g0 = app.ui.group('Head and cable');
  g0.slider({ id: 'u', label: 'Head position (A seat to B seat)', min: 0, max: 1, step: 0.01, value: 0, kind: 'actuator', help: 'A carriage on a rail; the seat at each end fixes the pose.', onChange: v => { S.u = v; render(); } });
  g0.slider({ id: 'spacing', label: 'Distance between tube axes', min: 300, max: 900, step: 10, value: 520, unit: 'mm', kind: 'scene', onChange: v => { S.s = v; render(); } });
  g0.slider({ id: 'rail', label: 'Cable rail distance behind the tubes', min: 400, max: 1100, step: 10, value: 700, unit: 'mm', kind: 'scene', help: 'The fibre needs a long, almost straight run from the grip.', onChange: v => { S.rail = v; render(); } });
  g0.radio({ id: 'mode', label: 'Cable hook', options: [{ value: 'mid', label: 'fixed midway' }, { value: 'half', label: 'half-speed trolley' }, { value: 'head', label: 'rides with the head' }], value: 'half', kind: 'branch', onChange: v => { S.mode = v; render(); } });
  g0.slider({ id: 'cart', label: 'Fixed end of the cable beyond the rail', min: 300, max: 900, step: 10, value: 500, unit: 'mm', kind: 'scene', help: 'The laser unit and its cart; the trolley-to-cart run bends too.', onChange: v => { S.cart = v; render(); } });
  g0.slider({ id: 'stiff', label: 'Cable stiffness (Bezier)', min: 0.2, max: 0.8, step: 0.05, value: 0.4, kind: 'scene', help: 'kit stand-in; 0.2 limp, 0.8 stiff', onChange: v => { S.stiff = v; render(); } });
  const g1 = app.ui.group('The schedule (illustrative durations, minutes)');
  g1.radio({ id: 'K', label: 'Stations', options: [{ value: 1, label: 'one' }, { value: 2, label: 'two' }], value: 2, kind: 'branch', onChange: v => { S.K = +v; render(); } });
  g1.slider({ id: 'N', label: 'Tubes in the session', min: 2, max: 6, step: 1, value: 4, kind: 'scene', onChange: v => { S.N = v; render(); } });
  g1.slider({ id: 'prep', label: 'Preparation at a station (load, indicate, plate, contact)', min: 4, max: 24, step: 1, value: 14, unit: 'min', kind: 'scene', help: 'Same sum as the lane scene: 1 + 6 + 4 + 3.', onChange: v => { S.prep = v; render(); } });
  g1.slider({ id: 'dry', label: 'Dry lap', min: 0.5, max: 4, step: 0.1, value: 1, unit: 'min', kind: 'scene', onChange: v => { S.dry = v; render(); } });
  g1.slider({ id: 'weld', label: 'Weld lap and retract', min: 0.5, max: 3, step: 0.1, value: 1.1, unit: 'min', kind: 'scene', onChange: v => { S.weld = v; render(); } });
  g1.slider({ id: 'swap', label: 'Swap out and record', min: 0.5, max: 4, step: 0.1, value: 1, unit: 'min', kind: 'scene', onChange: v => { S.swap = v; render(); } });
  g1.toggle({ id: 'unatt', label: 'The dry lap may run without a person', value: false, kind: 'state', help: 'A policy question: see use-05-gates.', onChange: v => { S.unatt = v; render(); } });
  render();
})();
</script>
</body>
