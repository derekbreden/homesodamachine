      proposes: '<p>A loop that runs trials for days keeps a <b>ledger of calibrations</b>, and they lean on each other. The lens has to be known before the camera\'s pose; the pose before the judge\'s scale; the judge before the arrangement\'s geometry (the board is read through it); the geometry before the dot\'s place in the gun (the pivot trial moves the arrangement); all of them before the seam on this tube. A calibration made while something upstream is wrong <b>inherits the error silently</b>.</p>' +
        '<p>Events invalidate different pieces. A knocked camera makes the pose stale and everything read through it suspect; a new tube makes the seat and the seam stale (its surface brings its own angle-locked bias, which lives in the seam node); a re-seated gun makes only the dot stale. <b>Stale</b> needs a full trial; <b>suspect</b> needs a cheap check first (a golden dot, a coupon, the rim and ports fit that runs on every frame anyway). The panel below the graph totals both, and the worst case if every check fails.</p>' +

        '<p>The table at the right reads the same ledger from the other side: the <b>readings</b> the loop makes, and what each leans on. A reading made against something in the same picture (the seam foot, the ports) does not lean on the camera\'s pose; one made against the room leans on everything. While the pose is being redone the knee reading can keep working.</p>',
      carries: '<p>Not the subject. The graph is about what has to be known, not what holds what.</p>',

        '<li><b>Readings differ in what they lean on.</b> With the sliders at the right: a 1 % scale error costs 3 micrometres on the knee, 23 on a rim-edge reading, 190 on a port-to-dot reading and 620 against the room; a camera translation of 5 mm costs nothing on the knee and 0.1 mm against the rim edge (parallax, 6.35 mm of depth) and the whole 5 mm against the room; a pointing error of 0.1 degree costs nothing in any comparison in one picture and 0.5 mm against the room. Numbers from <code>calc/eye_ledger.py</code>.</li>' +

      else { const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2; d = 'M ' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2; }
      const hot = state[p] === 'stale' || state[p] === 'tainted';
      svg.append(line(d, { stroke: hot ? '#f87171' : '#3a475c', 'stroke-width': hot ? 1.4 : 1, opacity: hot ? 0.8 : 0.7, 'marker-end': 'url(#cgarr' + (hot ? 'hot' : '') + ')' }));
    }));
    ORDER.forEach(id => {
      const n = NODES[id], p = pos(id), s = state[id], col = STYLE[s], g = S('g');
      const label = id === 'geom' ? ARR[st.arr].geomLabel.split(':')[0] : n.label, sub = id === 'geom' ? ARR[st.arr].geomLabel.split(':')[1].trim() : n.sub;
      g.append(S('rect', { x: p.x, y: p.y, width: NW, height: NH, rx: 7, fill: col[0], stroke: col[1], 'stroke-width': s === 'ok' ? 1 : 1.8 }),
        S('text', { x: p.x + 9, y: p.y + 18, class: 'b', text: label }), S('text', { x: p.x + 9, y: p.y + 32, class: 'sm', text: sub.length > 40 ? sub.slice(0, 38) + '…' : sub }),
        S('text', { x: p.x + 9, y: p.y + 46, class: 'sm ' + (s === 'stale' || s === 'tainted' ? (s === 'stale' ? 'red' : 'violet') : (s === 'suspect' ? 'amber' : 'green')), text: s === 'ok' ? 'ok' : (s === 'suspect' ? 'suspect · check ' + fmtS(nodeCheck(id)) : (s === 'stale' ? 'stale · trial ' + fmtS(nodeFull(id)) : 'run on a stale eye · redo ' + fmtS(nodeFull(id)))) }));
      if (n.silent) g.append(S('text', { x: p.x + NW - 8, y: p.y + 17, 'text-anchor': 'end', class: 'amber', text: '⚠' }));
      svg.append(g);
    });
    svg.append(S('text', { x: 8, y: 392, class: 'sm', text: 'an arrow points to what leans on the calibration it leaves · ⚠ has no cheap check' }));
  }
  function drawSummary() {
    const t = tally(), nx = nextInOrder(), a = ARR[st.arr];
    let html;
    if (!t.nF && !t.nC) html = '<b>Everything is calibrated.</b> <span class="k">Press an event.</span>';
    else html = '<b>' + t.nF + ' stale</b> (full trials ' + fmtS(t.fullS) + ') and <b>' + t.nC + ' suspect</b> (checks ' + fmtS(t.chkS) + '): the route costs <b>' + fmtS(t.fullS + t.chkS) + '</b> if every check passes, ' + fmtS(t.worst) + ' if every check fails. <span class="k">Next in order: ' + (nx ? NODES[nx.id].label + (nx.id === 'geom' ? ' (' + a.geomTrial + ')' : ' (' + (nx.full ? NODES[nx.id].trial : NODES[nx.id].chk) + ')') : 'nothing') + '.</span>';
    html += '<br><span class="k">Spent so far: ' + fmtS(spent) + (log.length ? ' · events: ' + log.join(', ') : '') + '</span>';
    html += '<br><span class="k"><b>' + a.name + '</b>: ' + a.unknown + ' numbers, ' + a.poses + ' poses × ' + a.secPer + ' s. Invisible to a board: ' + a.invisible + '. Goes stale with: ' + a.by + '.</span>';
    sumEl.innerHTML = html;
  }
  function drawTable() {
    const chip = s => '<span class="cg-chip ' + (s === 'ok' ? 'cg-ok' : s === 'suspect' ? 'cg-sus' : s === 'tainted' ? 'cg-taint' : 'cg-stale') + '">' + (s === 'ok' ? 'usable' : s === 'suspect' ? 'provisional' : s === 'tainted' ? 'redo' : 'do not use') + '</span>';
    tabEl.innerHTML = '<thead><tr><th>Reading</th><th>Apart</th><th>State</th></tr></thead><tbody>' + READINGS.map(r => '<tr><td>' + r.label + '<div class="cg-note" style="padding:2px 0 0">leans on ' + r.leans.map(id => id === 'geom' ? 'arrangement' : NODES[id].label.toLowerCase()).join(', ') + '</div></td><td>' + r.sep + '</td><td>' + chip(readingState(r)) + '</td></tr>').join('') + '</tbody>';
  }
  function drawErr() {
    const tanpsi = 61.85 / st.H, cls = v => v > 0.05 ? 'cg-hi' : (v > 0.01 ? 'cg-mid' : 'cg-lo'), fmt = v => v < 0.0005 ? '0' : (v >= 1 ? v.toFixed(2) + ' mm' : (v * 1000).toFixed(0) + ' µm');
    const s = st.scale / 100, t = st.trans, dz = 6.35, tau = 0.5 * 0.125;
    const rows = [
      ['the knee (0 mm apart)', s * 0.3, 0, 0, tau],
      ['dot vs rim edge (6.35 mm up)', s * (6.35 * tanpsi + 1.0), t * dz / st.H, 0, tau],
      ['dot vs the ports (19 mm)', s * 19.05, 0, 0, tau],
      ['dot in the room frame', s * 61.85, t, Math.tan(st.point * DEG) * st.H, tau],
    ];
    errEl.innerHTML = '<thead><tr><th>reading</th><th>scale ' + st.scale.toFixed(1) + ' %</th><th>camera moved ' + st.trans.toFixed(0) + ' mm</th><th>pointing ' + st.point.toFixed(2) + '°</th><th>latency 125 ms at 0.5 mm/s</th></tr></thead><tbody>' + rows.map(r => '<tr><td>' + r[0] + '</td>' + [1, 2, 3, 4].map(i => '<td class="n ' + cls(r[i]) + '">' + fmt(r[i]) + '</td>').join('') + '</tr>').join('') + '</tbody>';
    noteA.textContent = 'Pointing shifts the whole picture, so it cancels in every comparison made in one picture; a scale error grows with how far apart the two things are; a camera move costs parallax only for things at different depths; time costs the same for all of them. Red above the 0.05 mm marker (not a requirement).';
  }
  function ioUpdate() {
    const t = tally();
    app.io.set({
      commands: [
        { name: 'Next calibration to run', value: (nextInOrder() ? NODES[nextInOrder().id].label : 'none'), note: 'dependency order: eye, arrangement, dot, tube' },
        { name: 'Reference puck swap (trials-22)', value: t.nF || t.nC ? 'when the eye is stale or suspect' : 'idle', note: 'by a hand or a gripper: a person\'s minute today' },
      ],
      observes: [
        { name: 'Rim and ports fit residual', value: 'every frame', status: 'seen', note: 'the camera pose is checked for free while anything is in view (datum-19)' },
        { name: 'Golden dot brightness and place', value: 'each session and after any event', status: 'partly', note: 'a fixed pointer command (trials-18)' },
        { name: 'Judge against touches', value: 'K azimuths', status: 'partly', note: 'the only sight of an angle-locked bias (datum-14)' },
        { name: 'Dot against the melt', value: '–', status: 'unresolved', note: 'a witness pass on a scrap coupon; not a dry run' },
        { name: 'Stale / suspect calibrations', value: t.nF + ' / ' + t.nC, status: (t.nF || t.nC) ? 'partly' : 'seen', note: 'the loop\'s own ledger' },
      ],
      manual: ['Swapping a reference puck', 'The witness pass', 'Deciding how far a suspect calibration may be trusted']
    });
  }
  function redraw() { drawGraph(); drawSummary(); drawTable(); drawErr(); ioUpdate(); app.badge('taint', ORDER.some(id => state[id] === 'tainted') ? 'a calibration was run on a stale eye: it will have to be done again' : null, 'warn'); }

  // ------------------------------------------------------------------ controls
  const ga = app.ui.group('The arrangement (from other explorers)', { help: 'Its own numbers go into the ledger; the eye and the tube are the same.' });
  ga.radio({ id: 'arr', label: 'Arrangement', options: [{ value: 'gantry', label: 'table + gantry' }, { value: 'cage', label: 'corner cords' }, { value: 'hexapod', label: 'hexapod' }, { value: 'arm', label: 'encoded arm' }], value: 'gantry', kind: 'branch', visual: 'the Arrangement box and the summary', help: 'room-01 / room-15 (Derek\'s table), room-06, borrowed-13, borrowed-03.', onChange: v => { st.arr = v; redraw(); } });
  const ge = app.ui.group('What happens to the rig (scene edits)', { help: 'Pick an event and apply it; events add up.' });
  ge.select({ id: 'ev', label: 'Event', options: Object.keys(EVENTS).map(k => ({ value: k, label: EVENTS[k].label })), value: 'knock', kind: 'scene', visual: 'none until applied', noVisual: true, help: 'What each event invalidates directly; everything downstream becomes suspect.', onChange: v => { st.ev = v; } });
  ge.button({ id: 'apply', label: 'Apply the event', kind: 'scene', help: 'Marks the calibrations it invalidates stale and what leans on them suspect.', onClick: () => { apply(st.ev); app.toast(EVENTS[st.ev].label + ': ' + EVENTS[st.ev].note); redraw(); } });
  const gr = app.ui.group('The loop runs trials (software commands)', { help: 'In order, or not.' });
  gr.button({ id: 'next', label: 'Run the next trial in order', kind: 'state', help: 'The first stale calibration in dependency order gets its full trial; if none is stale, the first suspect one gets its check.', onClick: () => { const nx = nextInOrder(); if (!nx) { app.toast('Nothing to run'); return; } app.toast(run(nx.id, nx.full)); redraw(); } });
  gr.select({ id: 'runNode', label: 'Or run this one', options: ORDER.map(id => ({ value: id, label: id === 'geom' ? 'Arrangement' : NODES[id].label })), value: 'pose', kind: 'state', noVisual: true, onChange: v => { st.runNode = v; } });
  gr.button({ id: 'runOne', label: 'Run the chosen trial', kind: 'state', help: 'A full trial for the chosen calibration, whatever the order. If something upstream is stale it comes out purple.', onClick: () => { app.toast(run(st.runNode, true)); redraw(); } });
  gr.toggle({ id: 'pess', label: 'Checks fail (suspect turns out stale)', value: false, kind: 'scene', noVisual: true, help: 'A pessimistic run: every cheap check finds the calibration really is stale.', onChange: v => { st.pess = v; redraw(); } });
  gr.button({ id: 'clear', label: 'Reset the ledger', kind: 'state', onClick: () => { resetStates(); redraw(); } });
  const gs = app.ui.group('Eye errors for the table (scene edits, illustrative)', { help: 'What each error costs each reading.' });
  gs.slider({ id: 'scale', label: 'Scale error (focus breathing, thermal)', min: 0, max: 3, step: 0.1, value: 1.0, unit: '%', kind: 'scene', visual: 'the scale column', onChange: v => { st.scale = v; drawErr(); } });
  gs.slider({ id: 'trans', label: 'Camera moved sideways', min: 0, max: 20, step: 1, value: 5, unit: 'mm', kind: 'scene', visual: 'the camera-moved column', onChange: v => { st.trans = v; drawErr(); } });
  gs.slider({ id: 'point', label: 'Camera pointing changed', min: 0, max: 0.5, step: 0.01, value: 0.1, unit: '°', kind: 'scene', visual: 'the pointing column', onChange: v => { st.point = v; drawErr(); } });
  gs.slider({ id: 'H', label: 'Camera height above the plate', min: 150, max: 450, step: 10, value: 300, unit: 'mm', kind: 'scene', visual: 'the rim-edge and pointing rows', onChange: v => { st.H = v; drawErr(); } });
  app.io.manual(['Swapping a reference puck']);
  resetStates(); apply('knock'); redraw();
})();
</script>
</body>
</html>
