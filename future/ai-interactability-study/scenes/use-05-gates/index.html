(function () {
  const app = WK.app({

  }
  const holdFor = { tir: null, seat: 'hSeat', cont: 'hBlink', dot: 'hDot', wire: 'hWire' };
  function go(e, byUser) {

  // ------------------------------------------------------------------ controls
  const g0 = app.ui.group('Policy and presence');
  g0.radio({ id: 'policy', label: 'What may run without a person', options: [{ value: 'A', label: 'A: nothing' }, { value: 'B', label: 'B: motion, laser disabled' }, { value: 'C', label: 'C: also red-dot laps' }], value: 'A', kind: 'branch', help: 'Emission needs a person in every policy.', onChange: v => { S.policy = v; render(); } });
  g0.toggle({ id: 'attended', label: 'A person is at the bench, in goggles', value: true, kind: 'state', help: 'Off while ARMED, TACKED or WELDING drops the machine into a hold.', onChange: v => { S.attended = v; if (!v && ['armed', 'tacked', 'welding'].includes(S.node)) fall('hAbsent', 'the person left the bench'); else render(); } });
  g0.toggle({ id: 'chain', label: 'Hardware chain closed (key, e-stop released, clip)', value: false, kind: 'state', help: 'Only a person can close it (step 9 does). It must be open while nobody is at the bench.', onChange: v => { S.chain = v; if (!v && S.node === 'welding') fall('hAbsent', 'e-stop or key opened'); else render(); } });
  const g1 = app.ui.group('Sensors say (fire an event by flipping one)');
  const sens = [['tir', 'Indicator TIR within the limit'], ['seat', 'Seat contacts closed'], ['cont', 'Work-lead continuity proven'], ['dot', 'Dot inside the window'], ['wire', 'Retract reached its stop']];
  sens.forEach(s => g1.toggle({ id: 's-' + s[0], label: s[1], value: true, kind: 'state', onChange: v => {
    S.s[s[0]] = v;
    if (!v) {
      if (s[0] === 'seat' && ['seated', 'tacked', 'contin', 'dryok', 'armed', 'welding'].includes(S.node)) return fall('hSeat', 'seat contacts opened');
      if (s[0] === 'cont' && ['contin', 'dryok', 'armed', 'welding'].includes(S.node)) return fall('hBlink', 'work-lead continuity blinked');
      if (s[0] === 'dot' && ['dryok', 'armed'].includes(S.node)) return fall('hDot', 'the dot left the window');
      if (s[0] === 'wire' && ['welding', 'retracted'].includes(S.node)) return fall('hWire', 'the retract stopped short: wire fused in the bead');
    }
    render();
  } }));
  const g2 = app.ui.group('Run');
  g2.button({ id: 'estop', label: 'Press the e-stop', kind: 'state', onClick: () => { S.chain = false; app.ui.set('chain', false, { silent: true }); fall('hAbsent', 'e-stop pressed'); } });
  g2.button({ id: 'auto', label: 'Software: take every step it may (one pass)', kind: 'state', help: 'Fires each software transition that the policy and guards allow, one after another, and stops at the first thing that needs a hand.',
    onClick: () => { let guard = 0, n = 0; while (guard++ < 12) { const e = EDGES.find(x => x.who === 'sw' && S.node === x.a && !check(x).length); if (!e) break; go(e); n++; } if (!n) { const nx = EDGES.filter(x => S.node === x.a); note('software: nothing it may do from ' + N[S.node].t + (nx.length ? ' (next: ' + nx.map(x => x.label + ' by ' + (x.who === 'hand' ? 'a hand' : 'software, refused: ' + check(x)[0])).join('; ') + ')' : ''), false); render(); } } });
  g2.button({ id: 'reset', label: 'Restart at PARKED', kind: 'state', onClick: () => { S.node = 'parked'; S.log = []; render(); } });
  const setSw = app.ui.readout('sw', 'Software steps allowed alone in this policy');
  render();
})();
</script>
</body>
