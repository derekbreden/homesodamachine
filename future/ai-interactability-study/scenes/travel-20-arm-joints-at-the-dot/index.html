<script>
(function () {
  const V = (x, y, z) => new THREE.Vector3(x, y, z), P = WK.prim, DEG = Math.PI / 180, A = window.ARM6R;
  const RI = WK.INNER_RADIUS, CAPTOP = WK.CAP_TOP, RIMZ = WK.DIM.tubeHeight;
  const BENCH_Z = -186;                      // bench top (the rotator's feet stand at -86: a 100 mm stack space, as travel-01)

  const app = WK.app({
    workstation: { bench: false }, gun: { pose: 'opening' },
    viewButtons: ['overall', 'joint', 'arm', 'top'],
    views: {
      overall: { target: [0, -40, 90], dir: [0.55, -0.85, 0.45], dist: 1150 },
      joint: { target: [60, -4, 168], dir: [0.5, -0.75, 0.55], dist: 300 },
      arm: { target: [-40, -60, 100], dir: [-0.9, -0.5, 0.45], dist: 1250 },
      top: { target: [-40, -60, 100], dir: [0, -0.0035, 1], dist: 1000 },
    },
    open: ['proposes', 'tried'],
    sections: {
      proposes:
        '<p><b>The arm is asked for one pose, held.</b> The rotator turns the seam past the gun, so the arm never follows a path: it parks, comes back, trims and then holds while the tube turns. That makes the datasheet lines that matter <i>pose repeatability</i> (return to a taught pose, the number the maker measures), <i>stiffness at the flange</i> and <i>drift</i>. Speed, path accuracy and payload speed are not asked for.</p>' +
        '<p>The scene puts the arm (or a SCARA, or a three-axis gantry) on the gun’s printed shell and reads, joint by joint, <b>where an error at that joint lands at the dot</b>. Amber arrows point along the two directions the seam needs (radial and vertical); green arrows point along the tangent, where the seam is free (turning the tube slides the seam through it). The table on the right adds them up for the error you set. Three things the reader can move: <b>where the base stands around the tube</b> (a setup edit: azimuth 0 is the radial line through the station), <b>where the flange grips the shell</b> (the wrist joints’ lever is the distance from flange to dot), and <b>who makes the last trim</b>: the arm’s own joints, a two-plate stack under the rotator, or a small stage between flange and shell.</p>' +
        '<p>The gun stays where it is; the arm reaches it. Trim sliders move the dot relative to the seam by whichever body you chose, and the readouts show what that body can actually do: a joint moves in counts, so a 0.01 mm trim may not exist.</p>',
      carries:
        '<p><b>Purple</b> joints are what software could command; slate links and the pedestal are rigid structure. The <b>amber</b> shell and adaptor carry the gun to the flange, so the flange carries the gun’s weight and the umbilical’s pull. The flange-to-shell lug is teal: it locates. The stack branch draws two purple plates under the rotator instead of a slate plinth; the tip-stage branch draws a purple plate in the adaptor. Nothing is drawn for the fibre: its route along the arm and the 350 mm bend radius are open.</p>',
      software:
        '<p>The maker’s SDK takes joint angles or a flange pose in a user frame (streaming at 60 to 1000 Hz on the arms named in the sourcing notes) and returns the joint encoder angles, the computed flange pose and, on some arms, the flange force. It does not return the dot: the flange-to-dot vector is a constant someone measured, and its error is a lever the size of the gun. The trim buttons and sliders here command the chosen body; the dot-versus-seam readout is scene geometry, not a sensor.</p>',
      tried:
        '<ul>' +
        '<li><b>Where the base stands decides less than it seems.</b> <i>Conflict:</i> with the same 0.01\u00b0 at every joint, the radial-plus-vertical error at the dot runs from 61 \u00b5m (base at azimuth 210) to 100 \u00b5m (azimuth 180) for the housing-top grip, base 300 mm out and 150 mm up, ten azimuths tried; the barrel grip runs 63 to 102, the grip from behind 76 to 142 where it reaches at all (<code>calc/15</code>). At azimuth 0 the base joint moves the dot only along the tangent and contributes nothing (0 of 68), yet 0 is not the smallest total: the wrist and elbow solution that placement needs costs more than the base saves. <i>Assumption:</i> equal error at every joint. <i>Change:</i> the base azimuth slider, and a table that is a Jacobian, so an AI can compute the map at commissioning and pick the base position. <i>Leaves:</i> real joint errors are not equal.</li>' +
        '<li><b>The wrist has the gun\u2019s length as its lever.</b> Gripped at the housing top the flange is 209 mm from the dot; at the barrel 107 mm; from behind along the beam 309 mm. The last joints matter as much as the shoulder. From behind, the last joint\u2019s axis passes through the dot and it contributes nothing (roll about the beam is free for the dot, and twists the fibre), but the joint before it has a 309 mm lever. <i>Leaves:</i> which grip the printed shell can take.</li>' +
        '<li><b>A SCARA on the radial line has two joints that cost nothing.</b> Base and elbow both move the dot along the tangent when the links lie along the radial line, so what is left is the vertical slide (1:1) and the quill\u2019s yaw at a 136 mm lever: 20 \u00b5m radial-plus-vertical for 0.01\u00b0 and 0.01 mm, against 68 for the six-axis arm at azimuth 0; with the base at azimuth 90 it is 58 (<code>calc/15</code>). The gantry aligned with the radial is 14 and turned 45\u00b0 is 17. These compare 0.01\u00b0 with 0.01 mm, which are different physical errors: a cobot joint good to 0.003\u00b0 and a ball screw good to 0.005 mm are the fairer pair. <i>Leaves:</i> the SCARA cannot tilt the beam; the adaptor sets the tilt by hand.</li>' +
        '<li><b>Joint resolution is not the problem; lost motion is.</b> A 19-bit output encoder is 12 \u00b5rad per count: 0.4 to 3 \u00b5m at the dot here. A 12-bit servo (the desk-size Prime arms) is 1.5 mrad per count: 0.1 to 0.5 mm, which is the cliff the bits slider shows and the reason those arms cannot make a 0.1 mm trim by themselves. Repeatability, stiffness and drift are not on any datasheet read; the compliance readout (8000 N\u00b7m/rad per joint, illustrative) turns 1 N along the fibre into 4 to 11 µm in the needed directions and 7 to 20 µm along the tangent, by grip and class.</li>' +
        '<li><b>Coarse arm, fine stack.</b> If the last trim is done under the work (a two-plate stack) or at the flange (a stage), the arm only has to be stable between the last look and the weld, and its taught-pose scatter only has to fit in the stack\u2019s range. The stage at the flange sits in the load path (gun weight, umbilical pull); the stack does not. <i>Leaves:</i> the arm\u2019s hold stability is unmeasured, and a stack has to carry the rotator.</li>' +
        '</ul>',
      unresolved:
        '<ul>' +
        '<li>Joint errors, stiffnesses, encoder bits and the load change are <b>illustrative</b> sliders; no Prime listing states them. The link lengths are the UR3e datasheet’s; the layout stands for the UR-type class (Fairino FR3, Dobot CR3A and others have the same shoulder, three parallel joints and two wrist joints with their own link lengths). SCARA link lengths (225 + 175 mm) are illustrative.</li>' +
        '<li>Gun mass and centre of gravity are <b>[unknown]</b>. The payload curve on the maker’s datasheet drops from 3 kg at small offsets to about 2 kg at 250 mm and about 1.3 kg at 400 mm; the readout applies that reading (by eye, ±0.1 kg).</li>' +
        '<li>The fibre (5 m, 350 mm bend radius, no twist) and the wire conduit along an arm are not drawn. Arm-to-gun and arm-to-fibre collisions are not tested; only the tube, the rotator and the bench are.</li>' +
        '<li><b>Nothing here says an arm is stiff enough to hold a weld.</b> The compliance figure is joint stiffness turned into millimetres per newton at the dot; the real value is a measurement (push the flange with a spring scale and read the indicator).</li>' +
        '<li><b>Questions for Derek:</b> the gun’s mass with the shell on; which of the three grips the shell can take (lug at the barrel, at the housing, behind); whether an arm and a base footprint about 130 mm across fits beside the rotator.</li>' +
        '</ul>',
      assumptions:
        '<ul>' +
        '<li>Gun: the kit’s proxy in the reference scene’s opening pose (illustrative). Dot at the nominal seam (r = 61.85 mm, 6.35 mm below the rim) <b>[repo]</b>. Radial = +X at the station, tangent = Y.</li>' +
        '<li>Six-axis arm: UR3e link lengths (151.85, 243.55, 213.2, 131.05, 85.35, 92.1 mm) <b>[manual]</b> UR3e datasheet; joint stiffness 8000 N·m/rad, error 0.01° per joint, 19-bit encoders, 1 N load change: <b>illustrative</b>. The inverse is a numeric solve from many seeds (nearest to a typical elbow-up posture); it stops and says so when nothing reaches.</li>' +
        '<li><b>Models:</b> rigid links with joint errors and joint compliance, the exact dot motion from the Jacobian. <b>Depicts only:</b> the links’ outline, the pedestal, the adaptor and the stack plates as blocks.</li>' +
        '</ul>',
    },
  });
  const ws = app.workstation, gun = app.gun;

  // ------------------------------------------------------------------ bench, plinth or stack (fixed or actuated by branch)
  const bench = P.box(1100, 900, 20, 'fixed'); bench.position.set(-120, -160, BENCH_Z - 10); app.add(bench);
  (function grid() {
    const pts = [], z = BENCH_Z + 0.2;
    for (let x = -600; x <= 420; x += 50) pts.push(V(x, -600, z), V(x, 280, z));
    for (let y = -600; y <= 280; y += 50) pts.push(V(-640, y, z), V(450, y, z));
    const g = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), WK.lineMat('fixed', { opacity: 0.35 })); g.userData.role = 'fixed'; g.userData.occludes = false; app.add(g);
  })();
  const plinth = P.box(300, 280, 40, 'fixed'); plinth.position.set(0, 0, BENCH_Z + 20); app.add(plinth);
  const zPlate = P.box(300, 280, 20, 'fixed'); const xPlate = P.box(300, 280, 20, 'fixed'); const spacer = P.box(220, 200, 22, 'fixed');
  app.add(zPlate); app.add(xPlate); app.add(spacer);
  const Z0 = BENCH_Z + 40 + 10, X0 = Z0 + 20, SP0 = X0 + 10 + 11;      // plate centres at rest
  const stackMotors = [P.motor(34, 'actuated'), P.motor(34, 'actuated')];
  stackMotors[0].position.set(-175, 0, X0); stackMotors[0].quaternion.setFromUnitVectors(V(0, 0, 1), V(1, 0, 0));
  stackMotors[1].position.set(0, -160, Z0); stackMotors[1].quaternion.setFromUnitVectors(V(0, 0, 1), V(0, 1, 0));
  stackMotors.forEach(m => app.add(m));
  const plateLbl = [app.label(() => zPlate.position.clone().add(V(160, 40, 0)), 'Z plate', { cls: 'actuated' }), app.label(() => xPlate.position.clone().add(V(160, -40, 0)), 'X plate', { cls: 'actuated' })];

  // ------------------------------------------------------------------ gun, shell, three possible flange lugs
  gun.setLaser(false);
  const gunBase = { pos: gun.group.position.clone(), quat: gun.group.quaternion.clone() };
  const shell = gun.addShell({ style: 'sleeve', from: 'nozzleTip', to: 'gripBase', clearance: 3, role: 'load', opacity: 0.30 });
  const LUG = {
    top: shell.attachPoint('housingTop', { side: 'top', role: 'locate', size: 9 }),
    barrel: shell.attachPoint('barrelMid', { side: 'top', role: 'locate', size: 8 }),
    back: shell.attachPoint('housingBack', { side: 'back', role: 'locate', size: 9 }),
  };
  gun.group.updateMatrixWorld(true);
  const lugNom = {}; Object.keys(LUG).forEach(k => { lugNom[k] = { p: LUG[k].world().clone(), n: gun.dir(LUG[k].normal).normalize() }; });
  const xLocalW = gun.dir(V(1, 0, 0)).normalize();
  const dotNom = gun.dotWorld().clone();
  const beamDir = gun.beamDir().clone();
  const cableDir = (gun.cableExit() || { dir: V(0, -1, 0) }).dir.clone().normalize();
  app.label(() => gun.dotWorld(), 'dot', { cls: 'laser' });

  // observer: exact seam offset in the tube's own frame (scene geometry, not a sensor)
  const inv = new THREE.Matrix4();
  function seamNow() { app.scene.updateMatrixWorld(true); inv.copy(ws.tubeGroup.matrixWorld).invert(); const d = gun.dotWorld().applyMatrix4(inv); return { radial: Math.hypot(d.x, d.y) - RI, vertical: d.z - CAPTOP, along: 0, total: 0 }; }
  app.cornerInset({ gun: { dotOffset: () => seamNow(), beamDir: () => gun.beamDir() } });

  // ------------------------------------------------------------------ the arm's drawing (three classes; visibility by branch)
  const armG = new THREE.Group(), scaraG = new THREE.Group(), gantG = new THREE.Group();
  app.scene.add(armG); app.scene.add(scaraG); app.scene.add(gantG);
  const linkRods = [], jointCyl = [];
  for (let i = 0; i < 12; i++) { const r = P.rod(V(0, 0, 0), V(0, 0, 1), i < 6 ? 20 : 17, 'fixed'); linkRods.push(r); armG.add(r); }
  const jr = [30, 30, 27, 21, 21, 21], jh = [70, 72, 60, 48, 46, 40];
  for (let i = 0; i < 6; i++) { const c = P.cyl(jr[i], jh[i], 'actuated', { axis: 'z' }); jointCyl.push(c); armG.add(c); }
  const pedestal = P.rod(V(0, 0, 0), V(0, 0, 1), 42, 'fixed'); app.scene.add(pedestal);
  const basePlate = P.cyl(70, 14, 'fixed', { axis: 'z' }); app.scene.add(basePlate);
  const adaptRod = P.rod(V(0, 0, 0), V(0, 0, 1), 6, 'load'); app.scene.add(adaptRod);
  const flangeDisc = P.cyl(24, 6, 'actuated', { axis: 'z' }); app.scene.add(flangeDisc);
  // SCARA drawing
  const sc = { l1: P.rod(V(0, 0, 0), V(0, 0, 1), 24, 'fixed'), l2: P.rod(V(0, 0, 0), V(0, 0, 1), 19, 'fixed'), quill: P.rod(V(0, 0, 0), V(0, 0, 1), 11, 'fixed'), j1: P.cyl(34, 60, 'actuated', { axis: 'z' }), j2: P.cyl(28, 52, 'actuated', { axis: 'z' }), j4: P.cyl(20, 30, 'actuated', { axis: 'z' }) };
  Object.keys(sc).forEach(k => scaraG.add(sc[k]));
  // gantry drawing (built in a frame rotated by the azimuth)
  const gt = { beam: P.box(20, 600, 24, 'fixed'), carr: P.box(52, 48, 40, 'actuated'), zrod: P.rod(V(0, 0, 0), V(0, 0, 1), 8, 'actuated'), railL: P.rail(V(-300, -290, 0), V(300, -290, 0), { width: 16, height: 8, role: 'fixed' }), railR: P.rail(V(-300, 290, 0), V(300, 290, 0), { width: 16, height: 8, role: 'fixed' }), sl: P.box(50, 40, 40, 'actuated'), sr: P.box(50, 40, 40, 'actuated'), postL: P.rod(V(0, 0, 0), V(0, 0, 1), 12, 'fixed'), postR: P.rod(V(0, 0, 0), V(0, 0, 1), 12, 'fixed') };
  Object.keys(gt).forEach(k => gantG.add(gt[k]));
  // tip stage (between flange and shell) and its label
  const tipBody = P.box(46, 46, 20, 'fixed'), tipPlate = P.box(46, 46, 8, 'actuated'); app.scene.add(tipBody); app.scene.add(tipPlate);
  const NEEDC = '#ff8a1f', FREEC = '#4ade80';
  function makeArrow() {
    const g = new THREE.Group(), mat = new THREE.MeshBasicMaterial({ color: WK.color(NEEDC), depthTest: false, transparent: true, opacity: 0.95 });
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 10), mat), head = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 14), mat);
    g.add(shaft, head); g.renderOrder = 20; shaft.renderOrder = head.renderOrder = 20; g.userData.occludes = false; shaft.userData.occludes = false; head.userData.occludes = false; g.userData.mat = mat;
    g.set = function (o, d, L) { const dv = d.clone().normalize(), hl = Math.min(22, L * 0.35); g.position.copy(o); g.quaternion.setFromUnitVectors(V(0, 1, 0), dv); shaft.scale.set(2.2, Math.max(L - hl, 0.01), 2.2); shaft.position.y = (L - hl) / 2; head.scale.set(6, hl, 6); head.position.y = L - hl / 2; return g; };
    return g;
  }
  const arrows = []; for (let i = 0; i < 6; i++) { const a = makeArrow(); a.visible = false; app.scene.add(a); arrows.push(a); }
  const arrowLabels = []; for (let i = 0; i < 6; i++) arrowLabels.push(app.label(() => arrows[i].userData.tip || V(0, 0, 0), 'err J' + (i + 1), { cls: 'sensor' }));
  app.label(() => flangeDisc.position, 'flange', { cls: 'actuated' });
  const jointLbl = []; for (let i = 0; i < 6; i++) jointLbl.push(app.label(() => jointCyl[i].position, 'J' + (i + 1), { cls: 'actuated' }));
  app.label(() => adaptRod.userData.mid || V(0, 0, 0), 'printed adaptor', { cls: 'load' });

  // ------------------------------------------------------------------ helpers
  const ui = id => app.ui.get(id);
  const perp = (v) => V(-v.y, v.x, 0);
  const CURVE = [[0, 3], [150, 3], [200, 2.5], [250, 2.1], [300, 1.85], [350, 1.6], [400, 1.35], [500, 1.0]];   // UR3e payload chart read by eye (+-0.1 kg): kg against centre-of-gravity offset in mm
  const ratedAt = d => { for (let i = 1; i < CURVE.length; i++) if (d <= CURVE[i][0]) { const a = CURVE[i - 1], b = CURVE[i]; return a[1] + (b[1] - a[1]) * (d - a[0]) / (b[0] - a[0]); } return CURVE[CURVE.length - 1][1]; };

  function flangeTarget(shift) {
    const g = ui('grip'), L = lugNom[g], adapt = ui('adapt');
    const n = L.n, zf = n.clone().multiplyScalar(-1);
    let xr = xLocalW.clone(); xr.addScaledVector(zf, -xr.dot(zf)).normalize();
    const yr = new THREE.Vector3().crossVectors(zf, xr);
    const c = Math.cos(ui('roll') * DEG), s = Math.sin(ui('roll') * DEG);
    const xf = xr.clone().multiplyScalar(c).addScaledVector(yr, s);
    const p = L.p.clone().addScaledVector(n, adapt).add(shift);
    return { p: [p.x, p.y, p.z], z: [zf.x, zf.y, zf.z], x: [xf.x, xf.y, xf.z], lug: L.p.clone().add(shift), n: n };
  }
  const baseXYZ = () => { const psi = ui('psi') * DEG, R = ui('Rb'); return [R * Math.cos(psi), R * Math.sin(psi), BENCH_Z + ui('zb')]; };

  // ------------------------------------------------------------------ the three classes: each returns { ok, axes[], draw(), flange, note }
  // axis: { name, rot: bool, vec (dot motion per rad or per mm), om (gun rotation per rad), cnt (count in rad or mm) }
  let qTaught = null, qCache = null, lastSix = null;
  function solveSix(shift, warm) {
    const b = baseXYZ(), psi = ui('psi') * DEG, base = A.baseMat(b[0], b[1], b[2], psi + Math.PI);
    const tgt = flangeTarget(shift);
    let r;
    if (warm && qCache && qCache.key === b.join(',') + ui('grip') + ui('adapt') + ui('roll')) { r = A.ik(tgt, base, qCache.q, { iters: 80 }); if (r.errPos > 0.05 || r.errRot > 1e-3) r = A.ikBest(tgt, base); }
    else r = A.ikBest(tgt, base);
    if (!r) return { ok: false };
    qCache = { q: r.q.slice(), key: b.join(',') + ui('grip') + ui('adapt') + ui('roll') };
    return { ok: true, r: r, base: base, tgt: tgt, b: b };
  }
  function axesSix(F, dotP) {
    const J = A.jac(F, [dotP.x, dotP.y, dotP.z]), bits = ui('bits'), cnt = 2 * Math.PI / Math.pow(2, bits), out = [];
    for (let i = 0; i < 6; i++) out.push({ name: 'J' + (i + 1), rot: true, vec: V(J[0][i], J[1][i], J[2][i]), om: V(J[3][i], J[4][i], J[5][i]), cnt: cnt });
    return out;
  }
  function drawSix(sol) {
    const F = sol.r.F, o = i => V(F[i][3], F[i][7], F[i][11]), zA = i => V(F[i][2], F[i][6], F[i][10]), xA = i => V(F[i][0], F[i][4], F[i][8]);
    let k = 0;
    for (let i = 1; i <= 6; i++) {
      const p0 = o(i - 1), mid = p0.clone().addScaledVector(zA(i - 1), A.DH[i - 1].d), p1 = o(i);
