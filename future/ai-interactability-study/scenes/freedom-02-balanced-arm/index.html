      proposes:
        '<p>A monitor-style arm is a <b>neutral-equilibrium support</b>: a gas spring cancels the payload’s torque, so any pose is nearly a resting pose and only <b>joint friction</b> keeps it there. Here it carries the gun and its cable. It is not asked to locate anything. A small <b>XZ vernier stage</b> (purple) between the arm tip and the shell moves the gun by ±10 mm, and a camera on the dot closes the loop.</p>' +

        '<p>Try: set the spring to 2.0 kg, the low end of a typical arm\u2019s rating (the arm rises to its stop); add 0.5 kg of ballast; then add a 2 N load change and switch the cable-on-arm option; then switch to the shoulder motor.</p>',

        '<p><b>Payload below the spring’s minimum.</b> Typical gas-spring arms are rated from about 2 kg upward. A 1.2–1.5 kg gun+shell is under it: the spring wins and the arm rises to its stop. Repairs: ballast in the shell (0.5 kg here), a lighter spring, or a spring balancer.</p>' +
        '<p><b>Imperfect balance.</b> A real arm is exact at one angle and drifts elsewhere; the friction window is the range where it stays put. Raise the balance error or lower friction and the window shrinks or disappears.</p>' +

        '<p><b>The window in kilograms (from borrowed’s critique).</b> The arm stays put while the payload and the spring setting differ by less than friction ÷ (g·L·cos θ): ±91 g at 0.4 N·m and 0.45 m, ±51 g at a reach of 0.8 m, ±1.8 kg braked. A quarter of the fibre’s 0.35 kg share is 88 g, all of it. Moving the 1.2 kg gun 10 mm along the arm with the vernier changes the shoulder torque by 0.118 N·m, 29 % of the band, before the cable does anything. Everything on the tip is payload, including the vernier and the camera: with them the payload is about 2.3 kg, not 1.5, and the 0.5 kg ballast of the first repair is already there. The readouts and the “payload from parts” group show these.</p>' +
        '<p><b>Placing and welding are different states.</b> The sequence is release, place inside the window (forgiving the mismatch above), brake, let go. The mismatch that matters is not in mass: it is the force step when the hand lets go (its own holding force, the fibre settling to the clip) and at bead start, which the vernier and the eye take up; the brake keeps the arm from creeping while they do.</p>',

    gArm.appendChild(T(tx - 30, ty - 12, 'vernier XZ stage', { fill: C('actuated') }));

    gArm.appendChild(T(gx + 12, gy + 60, 'weight ' + (a.cur.mTot * 9.80665).toFixed(1) + ' N', { fill: C('load') }));
    gArm.appendChild(svgel('circle', { cx: 1, cy: 1, r: 0 }));

    // ---- torque plot
    clear(gPlot);
    const PX0 = 655, PX1 = 975, PY0 = 40, PY1 = 250, tq = 8, xa = t => PX0 + (t + 20) / 70 * (PX1 - PX0), ya = v => (PY0 + PY1) / 2 - v / tq * (PY1 - PY0) / 2;
    gPlot.appendChild(R(PX0, PY0, PX1 - PX0, PY1 - PY0, '#171e28', { stroke: '#2a3441' }));
    gPlot.appendChild(T(PX0, PY0 - 12, 'Torque about the shoulder vs arm angle (N·m)', { 'font-weight': 600 }));
    gPlot.appendChild(L(PX0, ya(0), PX1, ya(0), '#3a4656', 1));
    const bandTop = ya(a.taf), bandBot = ya(-a.taf);
    gPlot.appendChild(R(PX0, bandTop, PX1 - PX0, bandBot - bandTop, C('locate'), { opacity: 0.18 })); gPlot.appendChild(T(PX0 + 4, bandTop - 4, 'friction band ±' + a.taf.toFixed(2), { fill: C('locate'), 'font-size': 11 }));
    function curve(fn, col, w, dash) { let d = ''; for (let t = -20; t <= 50; t += 1) { const v = Math.max(-tq, Math.min(tq, fn(t))); d += (t === -20 ? 'M' : 'L') + xa(t).toFixed(1) + ' ' + ya(v).toFixed(1); } gPlot.appendChild(svgel('path', { d: d, fill: 'none', stroke: col, 'stroke-width': w, 'stroke-dasharray': dash || '' })); }
    curve(t => A.net(a.p, t).taus, C('compliant'), 2); curve(t => A.net(a.p, t).taug, C('load'), 2); curve(t => A.net(a.p, t).net, '#e6edf6', 2.4);
    a.win.forEach(w => gPlot.appendChild(R(xa(w[0]), PY1 - 8, xa(w[1]) - xa(w[0]), 8, C('locate'), { opacity: 0.9 })));
    gPlot.appendChild(L(xa(theta), PY0, xa(theta), PY1, C('actuated'), 1.6, { 'stroke-dasharray': '4 3' })); gPlot.appendChild(T(xa(theta) + 4, PY0 + 12, 'set ' + theta.toFixed(0) + '°', { fill: C('actuated'), 'font-size': 11 }));
    if (Math.abs(thEq - theta) > 0.3) { gPlot.appendChild(L(xa(thEq), PY0, xa(thEq), PY1, C('laser'), 1.6)); gPlot.appendChild(T(xa(thEq) + 4, PY0 + 26, 'settles ' + thEq.toFixed(0) + '°', { fill: C('laser'), 'font-size': 11 })); }
    [[-20, ''], [0, ''], [30, ''], [50, '']].forEach(k => gPlot.appendChild(T(xa(k[0]) - 8, PY1 + 15, k[0] + '°', { 'font-size': 11, fill: '#94a3b8' })));
    gPlot.appendChild(T(PX0, PY1 + 30, '— spring   — payload   — net (white)   teal bar = window where it stays put', { 'font-size': 11, fill: '#94a3b8' }));

    let ex = cx0 + err.r * sc, ey = cy0 - err.z * sc, off = false; const clampv = (v, lo, hi) => { if (v < lo || v > hi) off = true; return Math.max(lo, Math.min(hi, v)); };

    // ---- readouts, badges, io
    compR(a.cur.net.toFixed(2), 'N·m'); stR(state); winR(a.win.length ? a.win.map(w => w[0].toFixed(0) + '° to ' + w[1].toFixed(0) + '°').join(', ') : 'none');

    const lowPay = a.cur.mTot < S.md * 0.75; app.badge('rate', lowPay ? 'payload ' + a.cur.mTot.toFixed(1) + ' kg is under the spring’s ' + S.md.toFixed(1) + ' kg setting: add ballast or use a lighter spring' : null, 'warn');
    app.badge('reach', Math.hypot(err.r, err.z) > 10 && !stopped ? 'dot is ' + Math.hypot(err.r, err.z).toFixed(0) + ' mm from the seam: outside the vernier’s ±10 mm' : null, 'warn');
    app.io.set({
      commands: [{ name: 'Vernier X / Z (actuators)', value: S.vx.toFixed(1) + ' / ' + S.vz.toFixed(1), unit: 'mm' }].concat(S.drive === 'motor' ? [{ name: 'Shoulder motor angle', value: S.thMotor.toFixed(1), unit: '°' }] : []).concat(S.brake ? [{ name: 'Brake', value: 'engaged' }] : []),
      observes: [
        { name: 'Dot vs seam (camera, proposed; scene truth here)', value: err.r.toFixed(1) + ' / ' + err.z.toFixed(1), unit: 'mm', status: 'partly', note: 'the arm cannot tell you this: pre-sliding hold error is ' + micro.mm.toFixed(0) + ' mm' },
        { name: 'Shoulder angle (encoder, proposed)', value: thEq.toFixed(1), unit: '°', status: 'seen', note: 'says where the arm settled, not where the dot is' },
        { name: 'Vernier position', value: S.vx.toFixed(1) + ' / ' + S.vz.toFixed(1), unit: 'mm', status: 'partly', note: 'open loop from step count unless it has a limit switch' },
        { name: 'Payload / spring match', value: (a.cur.mTot).toFixed(1) + ' vs ' + S.md.toFixed(1), unit: 'kg', status: 'manual', note: 'set at build; the load cell in the vernier could measure the payload' },
        { name: 'Arm friction and stiffness', value: '-', status: 'unresolved', note: 'never measured; every number here is illustrative' }],
      manual: ['Choose or tune the spring; add ballast in the shell', 'Move the arm to the neighbourhood by hand (hand mode)', 'Clip the cable along the arm'] });
  }
  const g = app.ui.group('Arm and payload (scene edits)', { open: true });
  g.slider({ id: 'm', label: 'Payload: gun + shell + stage + cable share', min: 0.6, max: 4, step: 0.1, value: 1.5, unit: 'kg', kind: 'scene', help: 'Illustrative; the gun mass is [unknown].', onChange: v => { S.m = v; update(); } });
  g.slider({ id: 'ballast', label: 'Ballast in the shell', min: 0, max: 3, step: 0.1, value: 0, unit: 'kg', kind: 'scene', help: 'A printed pocket with steel shot: brings the payload up to the spring’s setting.', onChange: v => { S.ballast = v; update(); } });
  g.slider({ id: 'md', label: 'Spring is set for', min: 0.5, max: 8, step: 0.1, value: 1.5, unit: 'kg', kind: 'scene', help: 'Starts matched to the payload. Off-the-shelf monitor arms are rated from about 2 kg up (see sourcing): set 2.0 and the arm rises to its stop.', onChange: v => { S.md = v; update(); } });
  g.slider({ id: 'eps', label: 'Balance error away from the design angle', min: 0, max: 0.5, step: 0.01, value: 0.15, unit: '/rad', kind: 'scene', help: 'Fraction of the payload torque the spring is off per radian from 5°. Illustrative.', onChange: v => { S.eps = v; update(); } });
  g.slider({ id: 'taf', label: 'Joint friction (adjustable tension)', min: 0.05, max: 1.5, step: 0.05, value: 0.4, unit: 'N·m', kind: 'scene', help: 'Illustrative. Holds the arm while the net torque stays below it.', onChange: v => { S.taf = v; update(); } });
  g.toggle({ id: 'cableOnArm', label: 'Cable clipped along the arm', value: false, kind: 'scene', help: 'Adds cable weight to the payload and passes only a quarter of the pull to the gun.', onChange: v => { S.cableOnArm = v; update(); } });
  g.slider({ id: 'dF', label: 'Change in cable pull at the tip', min: 0, max: 5, step: 0.25, value: 0, unit: 'N', kind: 'scene', help: 'What the umbilical does when the tube turns or the cable shifts.', onChange: v => { S.dF = v; update(); } });
  g.toggle({ id: 'brake', label: 'Brake on the joint (state)', value: false, kind: 'state', help: 'Engaged for welding: friction ×20. Widens the window; does not stiffen the tip.', onChange: v => { S.brake = v; update(); } });
  const pg = app.ui.group('Payload counted from parts (scene edits)', { open: false, help: 'borrowed-14: everything on the tip is payload, including the stage that does the locating.' });
  pg.toggle({ id: 'parts', label: 'Count the payload from these parts', value: false, kind: 'scene', noVisual: true, help: 'On: the payload is the sum of the three below (and the slider above follows it). The cable share is the toggle above.', onChange: v => { S.parts = v; app.ui.enable('m', !v); ['mg', 'mvern', 'mcam'].forEach(id => app.ui.enable(id, v)); update(); } });
  pg.slider({ id: 'mg', label: 'Gun and shell', min: 0.6, max: 2.5, step: 0.05, value: 1.2, unit: 'kg', kind: 'scene', help: 'Unknown: weigh it.', onChange: v => { S.mg = v; update(); } });
  pg.slider({ id: 'mvern', label: 'XZ vernier stage with its motors', min: 0, max: 1.5, step: 0.05, value: 0.6, unit: 'kg', kind: 'scene', help: 'Two mini linear rails and motors: about 0.6 kg (illustrative; the listing gives no weight).', onChange: v => { S.mvern = v; update(); } });
  pg.slider({ id: 'mcam', label: 'Camera and bracket', min: 0, max: 0.5, step: 0.01, value: 0.15, unit: 'kg', kind: 'scene', onChange: v => { S.mcam = v; update(); } });
  const d = app.ui.group('Who moves the arm', { open: true });
  d.radio({ id: 'drive', label: 'Arm is moved by', options: [{ value: 'hand', label: 'hand' }, { value: 'motor', label: 'shoulder motor' }], value: 'hand', kind: 'branch', help: 'A spring balance makes a small motor enough: it only has to overcome the residual and friction.', onChange: v => { S.drive = v; app.ui.enable('thHand', v === 'hand'); app.ui.enable('thMotor', v === 'motor'); app.ui.enable('motorT', v === 'motor'); update(); } });
  d.slider({ id: 'thHand', label: 'Arm angle set by hand', min: -30, max: 50, step: 1, value: 5, unit: '°', kind: 'scene', help: 'Where you leave it. It settles where friction can hold it.', onChange: v => { S.thHand = v; update(); } });
  d.slider({ id: 'thMotor', label: 'Shoulder motor command', min: -30, max: 50, step: 0.5, value: 5, unit: '°', kind: 'actuator', help: 'A proposed motor at the shoulder (one axis).', onChange: v => { S.thMotor = v; update(); } });
  d.slider({ id: 'motorT', label: 'Motor torque available at the arm', min: 0.2, max: 8, step: 0.1, value: 1.0, unit: 'N·m', kind: 'scene', help: 'Illustrative: a small stepper with a 1:5 reduction. Below what the arm needs, it stalls and the arm creeps.', onChange: v => { S.motorT = v; update(); } });
  const vg = app.ui.group('Vernier stage (software commands)', { open: true });
  vg.slider({ id: 'vx', label: 'Vernier X (radial)', min: -10, max: 10, step: 0.1, value: 0, unit: 'mm', kind: 'actuator', help: 'Moves the gun toward or away from the tube wall relative to the arm tip.', onChange: v => { S.vx = v; update(); } });
  vg.slider({ id: 'vz', label: 'Vernier Z (vertical)', min: -10, max: 10, step: 0.1, value: 0, unit: 'mm', kind: 'actuator', help: 'Raises or lowers the gun relative to the arm tip.', onChange: v => { S.vz = v; update(); } });
  app.ui.enable('thMotor', false); app.ui.enable('motorT', false); ['mg', 'mvern', 'mcam'].forEach(id => app.ui.enable(id, false));
})();
</script>
