<title>Floating gun leaned on the work</title>
<link rel="stylesheet" href="../../kit/weldkit.css">
<script type="application/json" id="scene-meta">
{
  "id": "freedom-07-floating-on-work",
  "title": "Floating gun leaned on the work: the contact carries the precision while it is engaged",
  "by": "freedom",
  "origin": "swarm",
  "status": "rough",
  "summary": "The gun hangs nearly weightless (balancer or bungees) with a small shoe of two rollers riding the tube: one on the bore wall, one on the rim, pressed by a preload software sets. While engaged, the contact locates the two critical axes and follows the tube's runout for free. It does not know the plate's seat depth, drags a soft gun along the tangent if it slides, and bends the thin wall a little. A rough 2D section with an illustrative error budget.",
  "tags": ["contact", "preload", "rolling vs sliding", "follows runout", "engage and retract"],
  "branchOf": [],
  "combines": [],
  "transferable": ["a preloaded contact as a temporary reference", "rolling contact so a soft axis stays free", "engage and retract as the tube swap"],
  "how": {
    "motion": "preload actuator engages and retracts the shoe; the gun floats on a soft support",
    "load": "balancer or bungees carry the weight; the rollers carry only the preload",
    "reference": "the bore wall (radial) and the rim (vertical) at the moment of contact",
    "observe": "shoe contact force (load cell), electrical continuity to the tube, camera on the dot",
    "use": "engage for the dry-run and the weld, retract to swap tubes"
  },
  "software": {
    "commands": ["preload force (engage, hold, retract)", "vernier for the per-tube offset (optional)"],
    "observes": ["contact force and continuity", "dot vs seam (camera, not drawn)"],
    "manual": ["fitting the shoe and its rollers", "placing the floating gun near the tube"]
  },
  "notes": ["../../explorers/freedom/ideas/freedom-07-floating-on-work.md", "../../explorers/freedom/notebook.md"],
  "sources": ["../../sourcing/freedom.md"]
}
</script>
</head>
<body>
<script src="../../kit/vendor/three.min.js"></script>
<script src="../../kit/vendor/OrbitControls.js"></script>
<script src="../../kit/weldkit.js"></script>
<script>
(function () {
  const app = WK.app({
    stage: 'custom',
    open: ['proposes', 'carries'],
    sections: {
      proposes:
        '<p>Instead of holding the gun still in the room and letting the tube wobble past it, <b>let the gun lean on the tube</b>. A balancer or bungees carry the gun’s weight, so it floats. A small shoe with two rollers rides the tube ahead of the dot: one presses on the <b>bore wall</b>, one on the <b>rim</b>. A preload (software sets its force) holds them in contact. While engaged, the wall roller puts the dot at the wall’s radius wherever the wall is, and the rim roller sets the height from the rim. The tube’s runout is followed for free.</p>' +
        '<p>Left: a section through the seam at the dot, drawn at 10 px/mm; the shoe is amber, the tube grey. Right: radial and vertical error of the dot round one revolution, fixed gun (grey) against shoe-riding (green). The table lists what the contact does <i>not</i> fix.</p>',
      carries:
        '<p>The weight goes to the balancer (not drawn); the two rollers carry only the preload and whatever the umbilical pulls sideways. The rollers are the reference while engaged, and only while engaged. <b>Purple</b>: the preload actuator, the one thing software commands. <b>Teal</b>: the seam.</p>',
      software:
        '<p><b>Commands:</b> preload force, including a retract for tube changes. <b>Observes:</b> contact force (a load cell in the shoe), and <b>electrical continuity</b> between a metal roller and the tube: the same kind of contact the laser’s work interlock uses [manual p. 19: the interlock needs a complete circuit between the clip and the gun; whether the gun’s nozzle, wire or a shoe closes it is [unknown]]. Not observed: the plate’s height relative to the rim, which is what the vertical error is made of.</p>',
      tried:
        '<p><b>Sliding contact drags a soft gun.</b> A skid at 2 N preload with μ 0.3 pulls with 0.6 N along the tangent; a gun on a 350 mm pendulum has 0.034 N/mm sideways stiffness and drifts 18 mm. Repairs: a wheel or a ball-transfer unit (rolling resistance ≈ 2% instead of 30%). The tangent is nearly free for the dot (scene freedom-04) but not for the wire approach, which turns 0.93° per mm.</p>' +
        '<p><b>The rim is not the corner.</b> The plate sits 6.35 mm below the rim by design; how much that varies tube to tube, and how much the plate face tilts relative to the rim, is unknown. The rim roller fixes height from the rim, so those show up as a vertical error the shoe cannot see. Repair: measure once per tube with a dry-run (scene freedom-05) and trim with a vernier.</p>' +
        '<p><b>Pressing bends the reference.</b> A thin 1.65 mm wall gives under a roller. The scene assumes 0.01 mm per newton; that is a placeholder to be measured, not a derived value.</p>' +
        '<p><b>Clearance.</b> The wall roller sits in the space between the nozzle and the wall, next to the beam and the wire guide; the shoe has to be ahead of the puddle without touching either.</p>',
      unresolved:
        '<p>Whether a roller pair fits beside the beam and the wire approach; the plate-to-rim variation; local wall flexibility; wear or marking of the stainless surfaces by the rollers; whether the rim (cut edge) is a clean enough surface; dust and spatter on the rollers; whether contact continuity could stand in for or conflict with the laser interlock.</p>',
      assumptions:
        '<ul><li>Bore wall radius 61.85 mm, wall 1.65 mm, plate 6.35 mm below the rim: [repo]. Runout amplitudes up to 0.125 (radial) and 0.15 (face) if the rig-doc limits are reached: [repo], not measured.</li>' +
        '<li>Plate seat deviation and plate-to-rim tilt: sliders, <b>[unknown]</b>. Wall compliance 0.01 mm/N: <b>illustrative</b>.</li>' +
        '<li>Gun weight 12 N carried by a support with 350 mm effective pendulum length (tangent stiffness 0.034 N/mm): <b>illustrative</b>. Friction μ 0.3 skid, 0.02 ball, 0.01 wheel: <b>illustrative</b>.</li></ul>',
    },
  });
  const C = r => WK.roleHex(r), svgel = WK.svg;
  const S = { contact: 'wheel', engaged: true, N: 2, seat: 0.2, tilt: 0.1, ar: 0.12, az: 0.14, comp: 0.01, pos: 90, stiff: 0.034 };
  const svg = svgel('svg', { viewBox: '0 0 1000 700', width: '100%', role: 'img', 'aria-label': 'section of the seam with a two-roller shoe, and error over a revolution' }); svg.style.display = 'block'; svg.style.minWidth = '820px'; svg.style.maxHeight = '100%';
  app.stageEl.appendChild(svg);
  app.legend([{ role: 'work', label: 'Tube and endcap' }, { role: 'load', label: 'Shoe and rollers' }, { role: 'actuated', label: 'Preload actuator' }, { role: 'locate', label: 'Seam' }, { role: 'laser', label: 'Dot' }, { role: 'ghost', label: 'Fixed gun sees' }, { role: 'compliant', label: 'Shoe-riding sees' }]);
  const T = (x, y, t, o) => svgel('text', Object.assign({ x: x, y: y, fill: '#c8d0da', 'font-size': 12.5, 'font-family': 'system-ui, sans-serif', text: t }, o || {}));
  const L = (x1, y1, x2, y2, col, w, o) => svgel('line', Object.assign({ x1: x1, y1: y1, x2: x2, y2: y2, stroke: col, 'stroke-width': w || 1.5, 'stroke-linecap': 'round' }, o || {}));
  const R = (x, y, w, h, fill, o) => svgel('rect', Object.assign({ x: x, y: y, width: w, height: h, fill: fill }, o || {}));
  const g = svgel('g'); svg.appendChild(g); const clear = () => { while (g.firstChild) g.removeChild(g.firstChild); };
  const D = Math.PI / 180, MUF = { skid: 0.3, ball: 0.02, wheel: 0.01 };
  const errR = app.ui.readout('er', 'Peak radial error: fixed gun / shoe'), errZ = app.ui.readout('ez', 'Peak vertical error: fixed gun / shoe'), drag = app.ui.readout('drag', 'Tangent drag / gun drift'), defl = app.ui.readout('defl', 'Wall pushed by the preload');
  function update() {
    clear();
    const mu = MUF[S.contact] || 0, eng = S.engaged && S.contact !== 'none', N = eng ? S.N : 0;
    const th = S.pos;
    // raw (fixed gun) errors at angle t
    const rawR = t => S.ar * Math.cos((t - 40) * D), rawZ = t => S.seat + S.az * Math.cos((t - 130) * D);   // tube mean offset in z = seat deviation; face runout
    // shoe-riding: radial follows the wall (only the wall deflection remains); vertical follows the rim, leaving seat deviation + plate tilt relative to the rim
    const shoeR = t => S.comp * N, shoeZ = t => S.seat + S.tilt * Math.cos((t - 130) * D);
    const errRfix = rawR, errZfix = rawZ, errRsh = eng ? shoeR : rawR, errZsh = eng ? shoeZ : rawZ;
    // ---- section (left): 10 px/mm
    const K = 10, OX = 260, OY = 250;   // seam at (OX, OY); +x toward the wall (radial), +z up
    g.appendChild(T(20, 30, 'Section through the seam at the dot (10 px per mm; not the whole tube)', { 'font-weight': 600 }));
    g.appendChild(R(20, 46, 470, 330, '#171e28', { stroke: '#2a3441' }));
    // tube wall (radial x from 0 to 1.65, drawn 2x thick), rim 6.35 above the seam, plate 6.35 below it
    const RIM = OY - 6.35 * K;
    g.appendChild(R(OX, RIM, 1.65 * K * 2, 6.35 * K + 150, C('work'), { opacity: 0.95 })); g.appendChild(T(OX + 40, OY + 90, 'tube wall 1.65 mm (drawn 2\u00d7 thick)', { fill: '#94a3b8', 'font-size': 11 }));
    g.appendChild(R(OX - 200, OY, 200, 6.35 * K, C('work'), { opacity: 0.95 })); g.appendChild(T(OX - 190, OY + 6.35 * K + 16, 'endcap plate 6.35 mm', { fill: '#94a3b8', 'font-size': 11 }));
    g.appendChild(svgel('circle', { cx: OX, cy: OY, r: 4, fill: C('locate') })); g.appendChild(T(OX + 10, OY + 20, 'seam', { fill: C('locate') }));
    g.appendChild(L(OX - 210, RIM, OX + 60, RIM, C('locate'), 1, { 'stroke-dasharray': '3 3' })); g.appendChild(T(OX + 40, RIM + 14, 'rim', { fill: '#94a3b8', 'font-size': 11 }));
    const e = eng ? { r: errRsh(th), z: errZsh(th) } : { r: errRfix(th), z: errZfix(th) };
    const ex = OX + e.r * K * 8, ey = OY - e.z * K * 8;
    g.appendChild(T(30, 366, 'The dot\u2019s error is drawn \u00d78 so 0.1 mm is 8 px: r ' + e.r.toFixed(2) + ' mm, z ' + e.z.toFixed(2) + ' mm at ' + th + '\u00b0', { fill: '#94a3b8', 'font-size': 11 }));
    // shoe: wall roller inside the bore against the wall face, rim roller on top of the rim (the two are 6+ mm apart along the tangent, so they overlap only in this view)
    const rw = 28, wallC = [OX - rw, OY - 45], rimC = [OX + 1.65 * K, RIM - rw];
    g.appendChild(L(ex - 150, ey - 130, ex - 8, ey - 6, C('gun'), 16, { opacity: 0.95 }));
    g.appendChild(L(wallC[0], wallC[1], rimC[0], rimC[1], C('load'), 7)); g.appendChild(L(wallC[0], wallC[1], OX - 150, OY - 120, C('load'), 7));
    g.appendChild(svgel('circle', { cx: wallC[0], cy: wallC[1], r: rw, fill: '#1b232e', stroke: C('load'), 'stroke-width': 3 })); g.appendChild(T(wallC[0] - 100, wallC[1] + 4, 'wall roller', { fill: C('load'), 'font-size': 11 }));
    g.appendChild(svgel('circle', { cx: rimC[0], cy: rimC[1], r: rw, fill: '#1b232e', stroke: C('load'), 'stroke-width': 3 })); g.appendChild(T(rimC[0] + 34, rimC[1], 'rim roller', { fill: C('load'), 'font-size': 11 }));
    g.appendChild(svgel('circle', { cx: ex, cy: ey, r: 5, fill: C('laser') })); g.appendChild(T(ex - 46, ey + 22, 'dot', { fill: C('laser') }));
    if (eng) { g.appendChild(L(OX - 215, wallC[1], wallC[0] - rw - 6, wallC[1], C('actuated'), 3)); g.appendChild(T(OX - 235, wallC[1] - 14, 'preload ' + N.toFixed(1) + ' N', { fill: C('actuated') })); g.appendChild(L(rimC[0], RIM - 130, rimC[0], rimC[1] - rw - 4, C('actuated'), 3)); }
    else g.appendChild(T(OX - 220, 90, 'RETRACTED: the shoe is off the tube', { fill: '#ff8a80', 'font-weight': 700 }));
    // ---- plots (right)
    const PX0 = 560, PX1 = 970, ymax = 0.5;
    [{ n: 'Radial error over a revolution (mm)', y0: 46, fx: errRfix, sh: errRsh }, { n: 'Vertical error over a revolution (mm)', y0: 250, fx: errZfix, sh: errZsh }].forEach(P => {
      const H = 150, xa = t => PX0 + t / 360 * (PX1 - PX0), ya = v => P.y0 + H / 2 - Math.max(-ymax, Math.min(ymax, v)) / ymax * H / 2;
      g.appendChild(T(PX0, P.y0 - 8, P.n, { 'font-weight': 600 })); g.appendChild(R(PX0, P.y0, PX1 - PX0, H, '#171e28', { stroke: '#2a3441' })); g.appendChild(L(PX0, ya(0), PX1, ya(0), '#3a4656', 1));
      [-0.4, -0.2, 0.2, 0.4].forEach(v => g.appendChild(T(PX0 - 30, ya(v) + 4, (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1), { fill: '#94a3b8', 'font-size': 10.5 })));
      [0, 90, 180, 270, 360].forEach(t => g.appendChild(T(xa(t) - 8, P.y0 + H + 14, t + '°', { fill: '#94a3b8', 'font-size': 10.5 })));
      const path = f => { let d = ''; for (let t = 0; t <= 360; t += 3) d += (t === 0 ? 'M' : 'L') + xa(t).toFixed(1) + ' ' + ya(f(t)).toFixed(1); return d; };
      g.appendChild(svgel('path', { d: path(P.fx), fill: 'none', stroke: '#8894a6', 'stroke-width': 2 })); g.appendChild(svgel('path', { d: path(P.sh), fill: 'none', stroke: C('compliant'), 'stroke-width': 2.4 }));
      g.appendChild(L(xa(th), P.y0, xa(th), P.y0 + H, C('laser'), 1.5));
    });
    // ---- numbers + table
    const pk = f => { let m = 0; for (let t = 0; t < 360; t += 3) m = Math.max(m, Math.abs(f(t))); return m; };
    const dragN = mu * N, drift = dragN / S.stiff;
    const rows = [
      ['radial', 'wall roller: follows the wall, runout included', eng ? 'fixed by the contact (left: wall bend ' + (S.comp * N).toFixed(3) + ' mm)' : 'not held'],
      ['vertical', 'rim roller: height above the rim', eng ? 'partly: plate seat ' + S.seat.toFixed(2) + ' + tilt ' + S.tilt.toFixed(2) + ' mm remain' : 'not held'],
      ['tangent', 'a sliding contact drags it; rolling does not', mu > 0.1 ? 'drifts ' + drift.toFixed(0) + ' mm' : (eng ? 'free (drag ' + dragN.toFixed(2) + ' N)' : 'free')],
      ['tilts', 'not touched by the shoe', 'set by the support and the shoe geometry'],
    ];
    g.appendChild(T(20, 420, 'What the contact fixes, and what it leaves', { 'font-weight': 600 }));
    rows.forEach((r, i) => { const y = 442 + i * 40; g.appendChild(T(20, y, r[0], { fill: C('locate'), 'font-weight': 600 })); g.appendChild(T(90, y, r[1], { fill: '#c8d0da' })); g.appendChild(T(90, y + 16, r[2], { fill: '#94a3b8', 'font-size': 11.5 })); });
    g.appendChild(T(560, 440, 'Contact mode: ' + (S.contact === 'none' ? 'none (fixed gun)' : S.contact) + '   friction μ ' + mu, { fill: '#c8d0da' }));
    g.appendChild(T(560, 460, 'Tangent drag ' + dragN.toFixed(2) + ' N on a support of ' + S.stiff.toFixed(3) + ' N/mm: ' + (mu > 0.1 && eng ? 'gun drifts ' + drift.toFixed(0) + ' mm' : 'negligible'), { fill: mu > 0.1 && eng ? '#ff8a80' : '#94a3b8' }));
    g.appendChild(T(560, 480, 'The dry-run (scene freedom-05) is still needed for the per-tube vertical offset.', { fill: '#94a3b8', 'font-size': 11.5 }));
    errR(pk(errRfix).toFixed(2) + ' / ' + pk(errRsh).toFixed(2), 'mm'); errZ(pk(errZfix).toFixed(2) + ' / ' + pk(errZsh).toFixed(2), 'mm');
    drag(dragN.toFixed(2) + ' N / ' + (mu > 0.1 && eng ? drift.toFixed(0) + ' mm' : '~0'), ''); defl((S.comp * N).toFixed(3), 'mm');
    app.badge('drift', eng && mu > 0.1 ? 'a sliding contact drags the soft gun ' + drift.toFixed(0) + ' mm along the tangent' : null, 'warn');
    app.badge('ret', !eng && S.contact !== 'none' ? 'shoe retracted: nothing locates the gun; this is the tube-swap state' : null, 'info');
    app.io.set({ commands: [{ name: 'Preload force (actuator on the shoe)', value: eng ? N.toFixed(1) : 'retracted', unit: eng ? 'N' : '', note: 'engage, hold, retract' }],
      observes: [
        { name: 'Contact force (load cell in the shoe, proposed)', value: eng ? N.toFixed(1) : '0', unit: 'N', status: 'seen', note: 'tells engagement, not where the dot is' },
        { name: 'Continuity roller→tube (proposed)', value: eng ? 'closed' : 'open', status: 'seen', note: 'a binary contact signal; interlock interaction is [unknown]' },
        { name: 'Dot vs seam (camera, proposed; scene truth here)', value: e.r.toFixed(2) + ' / ' + e.z.toFixed(2), unit: 'mm', status: 'partly', note: 'the vertical part comes from the plate, which the shoe cannot see' },
        { name: 'Plate seat depth and plate tilt vs the rim', value: '-', status: 'unresolved', note: '[unknown]; a dry-run measures it per tube' }],
      manual: ['Fit the shoe; place the floating gun near the tube', 'Choose roller type'] });
  }
  const tg = app.ui.group('Contact (scene edits and the preload actuator)', { open: true });
  tg.radio({ id: 'contact', label: 'Contact', options: [{ value: 'none', label: 'none' }, { value: 'skid', label: 'sliding skid' }, { value: 'ball', label: 'ball transfer' }, { value: 'wheel', label: 'wheel' }], value: 'wheel', kind: 'branch', help: 'Friction μ 0.3 / 0.02 / 0.01 (illustrative): what a sliding contact does to a soft tangent axis.', onChange: v => { S.contact = v; update(); } });
  tg.toggle({ id: 'engaged', label: 'Shoe engaged (state)', value: true, kind: 'actuator', help: 'Engage for the dry-run and the weld; retract to swap the tube.', onChange: v => { S.engaged = v; update(); } });
  tg.slider({ id: 'N', label: 'Preload', min: 0.2, max: 8, step: 0.1, value: 2, unit: 'N', kind: 'actuator', help: 'A linear actuator or voice coil presses the shoe through a spring. Too little loses contact, too much bends the wall and drags.', onChange: v => { S.N = v; update(); } });
  const wg = app.ui.group('This tube (scene edits, unknowns)', { open: true });
  wg.slider({ id: 'seat', label: 'Plate seat deviation from nominal', min: -0.6, max: 0.6, step: 0.02, value: 0.2, unit: 'mm', kind: 'scene', help: 'How much deeper or shallower than 6.35 mm below the rim this plate sits. Unknown.', onChange: v => { S.seat = v; update(); } });
  wg.slider({ id: 'tilt', label: 'Plate face tilt relative to the rim', min: 0, max: 0.3, step: 0.01, value: 0.1, unit: 'mm', kind: 'scene', help: 'Amplitude of the plate face rising and falling against the rim round the circle. Unknown.', onChange: v => { S.tilt = v; update(); } });
  wg.slider({ id: 'ar', label: 'Rotator radial runout amplitude', min: 0, max: 0.3, step: 0.005, value: 0.12, unit: 'mm', kind: 'scene', help: 'Rig accepts 0.125.', onChange: v => { S.ar = v; update(); } });
  wg.slider({ id: 'az', label: 'Rotator face runout amplitude', min: 0, max: 0.3, step: 0.005, value: 0.14, unit: 'mm', kind: 'scene', help: 'Rig accepts 0.15.', onChange: v => { S.az = v; update(); } });
  wg.slider({ id: 'comp', label: 'Wall compliance under the roller', min: 0, max: 0.05, step: 0.001, value: 0.01, unit: 'mm/N', kind: 'scene', help: 'Placeholder, not derived.', onChange: v => { S.comp = v; update(); } });
  wg.slider({ id: 'pos', label: 'Bead position now', min: 0, max: 360, step: 5, value: 90, unit: '°', kind: 'state', onChange: v => { S.pos = v; update(); } });
})();
</script>
</body>
