        '<p><b>Scan first.</b> Turn the tube once with the laser off and a sensor that could not be there during the bead (a probe, a camera looking straight into the canyon, the dot sweep of eyes-06). The rotator’s degrees index a map of seam offset. During the bead a slow trim axis plays the map back. <b>Look ahead.</b> A camera 35° upstream (37.8 mm of arc, 4.7 s at 8 mm/s) sees the seam before it reaches the dot. <b>At the dot.</b> The gun-borne eye of eyes-01 sees the seam at the dot, including what the heat has done.</p>' +

    const stepTxt = val('start') > 0 ? '<br><br>Bead-start step: ' + val('start').toFixed(2) + ' mm radial, ' + (1.5 * val('start')).toFixed(2) + ' mm vertical. Radial residual over the first 30 mm of bead: peak <span class="sw-n">' + pk30.toFixed(2) + '</span> mm; inside 0.15 mm (plus the bias) from ' + (settle < 0 ? 'never in this bead' : (settle * D * RI).toFixed(0) + ' mm of bead') + '.' : '';

      '<br><br>Seam speed under the gun at most ' + (Math.max(val('trir') / 2, 0.001) * v / RI).toFixed(3) + ' mm/s radial, ' + (Math.max(val('tfz') / 2, 0.001) * v / RI).toFixed(3) + ' mm/s vertical (runout only). A 10 frame per second camera sees ' + ((Math.max(val('trir'), val('tfz')) / 2) * v / RI / 10).toFixed(4) + ' mm of that per frame.' +
      '<br><br>Radial leftovers this strategy cannot remove (rms mm): ' + left + '.<br><br>What this strategy cannot see: ' + ({ none: 'nothing is measured.', scan: 'a tube that was re-seated after the scan, distortion during the bead, any bias of the scan sensor, and the bead-start step unless the dry turn was taken in the weld state (then only its mismatch).', la: 'distortion (the heat has not arrived yet), the bead-start step (a camera on a post does not see the gun move), and any bias of the look-ahead camera.', dot: 'nothing that the eye sees badly at the dot: its own bias and fume/glare at the puddle (unresolved); it corrects a step only after its lag.', lad: 'the bias both eyes share.' })[val('strat')];
    app.io.set({
      commands: [{ name: 'Rotator turned-so-far', value: th, unit: 'deg', note: 'existing controller reports it (0.025 deg step)' }, { name: 'Trim axis: playing the correction', value: (run.cr[th] >= 0 ? '+' : '') + run.cr[th].toFixed(3) + ' / ' + (run.cz[th] >= 0 ? '+' : '') + run.cz[th].toFixed(3), unit: 'mm (r / z)', note: 'proposed slow axis; the scene applies it exactly' }],
      observes: [
        { name: 'Seam map from a dry turn', value: val('strat') === 'scan' ? 'recorded' : '-', status: val('strat') === 'scan' ? 'partly' : 'unresolved', note: 'a sensor that could not be there during the bead' },
        { name: 'Seam ahead of the dot (look-ahead)', value: (val('strat') === 'la' || val('strat') === 'lad') ? 'live' : '-', status: (val('strat') === 'la' || val('strat') === 'lad') ? 'partly' : 'unresolved' },
        { name: 'Offset at the dot', value: (val('strat') === 'dot' || val('strat') === 'lad') ? 'live' : '-', status: (val('strat') === 'dot' || val('strat') === 'lad') ? 'partly' : 'unresolved' },
        { name: 'Thermal distortion during the bead', value: '-', status: (val('strat') === 'dot' || val('strat') === 'lad') ? 'partly' : 'blind', note: 'only an eye at the dot sees it; size unknown' },
        { name: 'Whether the tube was re-seated after the scan', value: '-', status: 'blind', note: 'a second look-ahead reading could check' },
        { name: 'Sensor bias', value: '-', status: 'blind', note: 'needs a ground-truth view (eyes-07)' },
      ],
      manual: ['Seat the tube once and leave it', 'Choose the first tack as the index mark', 'Calibrate the scan sensor'],
    });
    app.invalidate();
  }
  function parts() { const d = [], r = []; for (let i = 0; i < N; i++) { d.push(distort(i, 'r')); r.push(reseat(i % 360, 'r')); } return { dist: rms(d), reseat: rms(r), bias: Math.abs(val('bias')), noise: val('noise') }; }
  function evalRunNone() { const out = { r: [], z: [] }; for (let i = 0; i < N; i++) { const phi = i % 360; out.r.push(seam(phi, 'r') + reseat(phi, 'r') + distort(i, 'r') + val('e0')); out.z.push(seam(phi, 'z') + reseat(phi, 'z') + distort(i, 'z') + val('e0') * 0.4); } return out; }

  const g0 = app.ui.group('Strategy');
  g0.radio({ id: 'strat', label: 'How the eye is used', kind: 'branch', value: 'scan', options: [{ value: 'none', label: 'None' }, { value: 'scan', label: 'Scan first' }, { value: 'la', label: 'Look-ahead' }, { value: 'dot', label: 'At the dot' }, { value: 'lad', label: 'Both' }], help: 'None: uncorrected. Scan first: one dry turn builds a map. Look-ahead: a camera upstream. At the dot: the gun-borne eye of eyes-01. Both: look-ahead plus at the dot.', onChange: update });
  g0.slider({ id: 'th', label: 'Turned so far (dot position on the bead)', min: 0, max: 380, step: 1, value: 120, unit: '°', kind: 'actuator', help: 'The rotator turns the tube; 380 includes the overlap past the first tack. Existing controller.', onChange: update });
  g0.slider({ id: 'v', label: 'Bead travel speed', min: 5, max: 15, step: 0.5, value: 8, unit: 'mm/s', kind: 'actuator', help: 'Existing controller window 5-15 mm/s.', onChange: update });
  g0.slider({ id: 'la', label: 'Look-ahead angle upstream of the dot', min: 10, max: 60, step: 1, value: 35, unit: '°', kind: 'scene', onChange: update });
  const g1 = app.ui.group('The tube (scene edits: illustrative)');
  g1.slider({ id: 'trir', label: 'Radial runout TIR', min: 0, max: 0.25, step: 0.005, value: 0.25, unit: 'mm', kind: 'scene', help: 'Rig acceptance limit 0.25 mm.', onChange: update });
  g1.slider({ id: 'tfz', label: 'Face runout TIR at the weld circle', min: 0, max: 0.3, step: 0.005, value: 0.3, unit: 'mm', kind: 'scene', help: 'Rig acceptance limit 0.30 mm.', onChange: update });
  g1.slider({ id: 'oval', label: 'Ovality (second harmonic)', min: 0, max: 0.15, step: 0.005, value: 0.04, unit: 'mm', kind: 'scene', onChange: update });
  g1.slider({ id: 'tack', label: 'Tack weld bump height (8 tacks)', min: 0, max: 0.2, step: 0.005, value: 0.06, unit: 'mm', kind: 'scene', onChange: update });
  g1.slider({ id: 'dist', label: 'Thermal distortion during the bead', min: 0, max: 0.4, step: 0.01, value: 0.12, unit: 'mm', kind: 'scene', help: 'Unknown for this joint. The unbacked 6.35 mm lip may distort.', onChange: update });
  g1.slider({ id: 'reseat', label: 'Re-seat error between scan and bead', min: 0, max: 0.3, step: 0.01, value: 0.0, unit: 'mm', kind: 'scene', help: 'The nest has 0.2 mm radial clearance; touching the tube can move it.', onChange: update });
  g1.slider({ id: 'e0', label: 'Setup error of the dot (constant)', min: -0.6, max: 0.6, step: 0.05, value: 0.3, unit: 'mm', kind: 'scene', help: 'What manual setup leaves before any correction.', onChange: update });
  const g1b = app.ui.group('The bead start (scene edits: illustrative)');
  g1b.slider({ id: 'start', label: 'Step at the bead start (radial; vertical 1.5x)', min: 0, max: 2, step: 0.05, value: 0.6, unit: 'mm', kind: 'scene', help: 'The support moves once when the wire feeds, the gas starts or the fibre is asked to emit at a larger radius. Freedom’s statics: 1.4 mm per newton of pull change on one elastic, 0.1 mm on the nose seat.', onChange: update });
  g1b.radio({ id: 'dry', label: 'The dry turn was taken with', kind: 'branch', value: 'idle', options: [{ value: 'idle', label: 'idle' }, { value: 'weld', label: 'weld state' }], help: 'Idle: wire retracted, gas off, fibre stored at the tighter radius, hand off. Weld state: wire fed, gas on, fibre at the emitting radius. Only the scan strategy uses the dry turn.', onChange: update });
  g1b.slider({ id: 'mism', label: 'Bead step differs from the dry turn’s by', min: 0, max: 100, step: 5, value: 25, unit: '%', kind: 'scene', help: 'Only matters when the dry turn was taken in the weld state.', onChange: update });
  const g2 = app.ui.group('The eye and the trim axis (scene edits: illustrative)');
  g2.slider({ id: 'noise', label: 'Measurement noise (1 sigma)', min: 0, max: 0.1, step: 0.005, value: 0.03, unit: 'mm', kind: 'scene', onChange: update });
  g2.slider({ id: 'bias', label: 'Calibration bias (radial; vertical is 0.6 of it)', min: -0.5, max: 0.5, step: 0.01, value: 0.1, unit: 'mm', kind: 'scene', onChange: update });
  g2.slider({ id: 'step', label: 'Trim axis step', min: 0, max: 0.1, step: 0.005, value: 0.01, unit: 'mm', kind: 'scene', help: 'Quantisation of the played correction.', onChange: update });
  g2.button({ id: 'renoise', label: 'Draw new noise', kind: 'state', onClick: () => { seed++; update(); } });
  update();
})();
