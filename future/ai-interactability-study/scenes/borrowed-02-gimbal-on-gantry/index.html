    sections: {
      proposes: '<p>Stabiliser gimbals (DJI-style handhelds, drone-camera gimbals) already turn a payload about three axes with direct-drive brushless motors and give its angles back. Their axes meet at one point near the payload’s centre of mass. The gun’s dot is 200 mm or so from that point. So: let the gimbal do the <b>orientation</b>, and let a printer- or CNC-style gantry move the whole gimbal so the <b>dot</b> stays on the seam.</p>' +
        '<p>The maths is short. If the gimbal centre C sits on the line from the dot to the cable exit (the roll axis), the dot is always at <code>C − t·g</code>, where g is the roll axis direction and t the distance from dot to C. The roll angle does not move the dot at all; yaw and pitch move it, and the gantry moves C by <code>t·Δg</code> to cancel that. Switch compensation off to watch the dot swing.</p>',
      carries: '<p>Gun → printed cradle (two lugs on the pitch axis, a roll ring at the grip base) → pitch motors → yaw motor → Z carriage → Y carriage on the beam → X carriages on two rails → posts → bench. Location: the dot follows from the gimbal angles and the gantry position; a camera trims it. Balanced about C, the gimbal motors hold only the residual; the umbilical and wire conduit pull on the cradle instead.</p>',
      software: '<p>Software solves one equation: given a wanted gun orientation, the gantry target is <code>J + t·g(yaw, hole)</code>. It sends a G-code move to the gantry and an angle command to the gimbal controller, reads both back, and lets a camera correct the leftover. The readout shows the G-code and the size of the gantry travel each orientation span costs.</p>',
      tried: '<p><b>Round 1: balance.</b> A gimbal motor is not sized to hold a 250 mm cantilever; the reason handhelds are balanced is that the motors carry only the difference. Change: put the gimbal centre on the roll line and bring the centre of mass to it with ballast. Uncertain: gun mass and centre of mass are unknown, the ballast slider is a stand-in.</p>' +
        '<p><b>Round 2: power loss.</b> A direct-drive gimbal holds only while powered. With any imbalance the gun sags to the hole-axis stop when power drops, and the nozzle end swings toward the tube. Repair tried: the second drive type, a worm-geared head, which does not sag (but backlash and slower). Left standing: the direct-drive version needs a brake or a hard stop that is safe for the tube.</p>' +
        '<p><b>Round 3: precision.</b> The dot is t_c from the pivot, so an angle error of δ costs t_c·δ at the seam: 0.05° at 200 mm is 0.17 mm. The gantry adds its own. Both are sliders; the answer is that angle resolution, not motor size, sets the floor, and a camera must close the rest.</p>' +
        '<p><b>Round 5 (from trials, wave 3): the formula carried a term the sliders did not show.</b> The gantry move assumes the gimbal centre C sits exactly t from the dot on the roll line, in the gun\u2019s own frame. The cradle that holds the gun sets it, and a printed cradle on a hand-balanced gun is a millimetre or so out: three numbers, now three sliders. Because the error is a fixed vector in the gun\u2019s frame that the rotation carries with it, it costs more the further the gun swings: 1 mm in a random direction is 0.19 mm rms at \u00B110\u00B0, 0.37 at \u00B120\u00B0 and 0.54 at \u00B130\u00B0 (trials, calc/gimbal_fixed_point.py), three times the angle-error term at the span this scene\u2019s travel readout is built for. Repairs, all drawn: a <b>fixed-point trial</b> (dot on one board cross from 30 poses, laser off; trials-19) recovers the two components across the beam to about 0.05 mm and the fresh-pose error falls from about 0.4 mm to about 0.02 mm; a <b>three-ball seat</b> makes the error a constant of the cradle and gun pair, so the trial survives a remount (a loose mounting makes every remount a new calibration; the button shows it). Assumption broken: that the cradle is a rigid, exactly known extension of the gun. Left standing: the component along the beam is invisible to a board (it slides the nozzle along its own beam, so the spot does not move) and is what the spot size would tell; the three gimbal axes are only concurrent to what the maker built; the flex of the yoke under gravity.</p>' +
        '<p><b>Round 6 (from trials, wave 3): a power dip kinks the fibre.</b> With direct drive and the power off the gun sags to the hole-axis stop, the dot goes far off scale and the cable badge reads a bend radius well under the manual\u2019s 240 mm stored minimum: the tube is untouched and the fibre is not. Three ways to fail safe, all in the drive radio: a <b>worm-geared head</b> (self-locking; a geared photo head is this class: Manfrotto MHXPRO-3WG, $219, 8.8 lb payload, two-day, sourcing/borrowed.md; backlash and periodic error are not on the listing), <b>spring-applied brakes</b> released by power (a power dip holds the pose; the brake hub shifts a little when it engages), or the mule (trials-06) for the first hundred unattended hours so that the real gun and its fibre only come out for confirming runs. Failing into a dock instead needs a constant holding torque m g e (0.35 N\u00B7m for 1.2 kg at 30 mm), more than a small gimbal motor holds continuously as far as anyone knows [unknown].</p>' +
        '<p><b>Round 4: roll and the fibre.</b> The roll motor of a stock gimbal sits on the roll axis, and here the cable leaves along that axis. The drawn version uses a ring at the grip base so the cable passes through the bore (twist still unresolved).</p>',
      unresolved: '<ul><li>Whether any stock gimbal can carry the gun’s mass and cradle and hold 0.05°; a hobby brushless with a serial controller (SimpleBGC-class) is a candidate, a handheld with a published SDK another.</li><li>Gun mass, centre of mass and umbilical pull.</li><li>Gantry stiffness and repeatability under a 1 to 2 kg hanging load (not calculated).</li><li>The roll ring drive; the cradle geometry; a hard stop that protects the tube.</li><li>Fibre twist under roll (manual p. 20).</li><li>Which of the three cradle offsets to constrain by construction (a keyed, seated cradle) and which to leave to the trial; whether the gimbal centre is defined by the gimbal\u2019s mechanical centre or by the cradle (here: by the cradle, as the sliders show).</li><li>Whether the nine extra numbers of the gimbal\u2019s own axis non-concurrence can be identified from one board.</li></ul>',

  const GRIP_MID = gun.anchor('gripMid');

  // ---------- state

  const rollLine = dashedLine(0xc084fc, 5, 3), yawLine = dashedLine(0xfbbf24, 6, 3), holeLine = dashedLine(0x22d3ee, 4, 3), dotLine = dashedLine(0xff5a4f, 3, 3);

  function travelNeeded() {
    const n = { x: [1e9, -1e9], y: [1e9, -1e9], z: [1e9, -1e9] };
    [-1, 0, 1].forEach(a => [-1, 0, 1].forEach(b => { const c = cFor(homeAngles.v + a * S.span, homeAngles.h + b * S.span); ['x', 'y', 'z'].forEach(k => { n[k][0] = Math.min(n[k][0], c[k]); n[k][1] = Math.max(n[k][1], c[k]); }); }));
    return { x: n.x[1] - n.x[0], y: n.y[1] - n.y[0], z: n.z[1] - n.z[0] };
  }
  // hole angle the gun would sag to with no power (direct drive): centre of mass lowest within the hole-axis stops
  function sagH(v, r, Cw) {
    const dirCog = GRIP_MID.clone().sub(cLocal()).normalize(), cog = cLocal().addScaledVector(dirCog, S.cog);
    let best = null;
    for (let h = -25; h <= 95; h += 1) { const q = dial(v, h, r).quaternion, z = cog.clone().sub(cLocal()).applyQuaternion(q).z; if (!best || z < best.z) best = { h: h, z: z }; }
    return best.h;
  }

  // ---------- apply
  let last = null, lastOk = null;
  function place(o, a, b) { o.setEnds(a, b); }
  function pointMotor(m, face, towards) { m.position.copy(face); m.quaternion.setFromUnitVectors(AXZ, towards.clone().normalize()); }
  function update() {
    if (!S.ready) return;
    // commanded angles; the gimbal turns to commanded + error (unknown to software)
    const cmd = { v: S.v, h: S.h, r: S.r }, act = { v: cmd.v + S.angErr, h: cmd.h + S.angErr, r: cmd.r };
    let Ct = S.comp ? cFor(cmd.v, cmd.h) : cHome();
    if (S.comp && S.corr) Ct = Ct.clone().add(Ehat.clone().applyQuaternion(dial(cmd.v, cmd.h, cmd.r).quaternion));   // software adds what the trial found
    const Cact = Ct.clone().add(V(S.gantErr, 0, S.gantErr));
    let sagged = null;
    if (!S.power && S.drive === 'direct') { const hs = sagH(act.v, act.r, Cact); sagged = hs; act.h = hs; }   // worm and brake types hold the pose
    let pose = poseFor(act.v, act.h, act.r, Cact), bad = limits(Ct);
    if (S.power) bad = bad.concat(issues(pose));
    if (bad.length && lastOk) { app.badge('limit', bad.join('; ') + '. Holding the last valid pose', 'limit'); pose = lastOk.pose; Ct = lastOk.Ct; }
    else { app.badge('limit', null); if (S.power) lastOk = { pose: pose, Ct: Ct }; }
    if (!S.power && S.drive === 'direct') { const bb = issues(pose); app.badge('sag', bb.length ? 'POWER OFF: gun sags to the hole-axis stop (dial ' + sagged + '°) and ' + bb.join(', ') : 'POWER OFF: gun sags to the hole-axis stop (dial ' + sagged + '°)', bb.length ? 'limit' : 'warn'); }
    else app.badge('sag', !S.power ? (S.drive === 'worm' ? 'POWER OFF: worm-geared head holds its pose (self-locking)' : 'POWER OFF: spring-applied brakes hold the pose (they release only while powered)') : null, 'info');
    const C = pose.C;
    cogMark.position.copy(cLocal().addScaledVector(GRIP_MID.clone().sub(cLocal()).normalize(), S.cog));
    [pitA, pitB].forEach(m => m.scale.setScalar(S.drive === 'worm' ? 1.3 : 1));
    HOOK.set(C.x - 10, C.y - 420, Z_RAIL - 90); hd.position.copy(HOOK); boom.setEnds(V(C.x, C.y, Z_RAIL - 20), HOOK);
    gun.setTransform(pose.pos, pose.q);
    // gantry drawing follows C
    const zc = C.z + HC + 11 + 62 + 15;
    xCar.forEach((b, i) => b.position.set(C.x, i === 0 ? -RAILY : RAILY, Z_RAIL));
    beam.setEnds(V(C.x, -RAILY, Z_RAIL), V(C.x, RAILY, Z_RAIL));
    yCar.position.set(C.x, C.y, Z_RAIL - 4); zRail.setEnds(V(C.x, C.y, Z_RAIL - 20), V(C.x, C.y, 330));
    zCar.position.set(C.x, C.y, zc); yawMotor.position.set(C.x, C.y, C.z + HC + 11);
    // yoke
    const y = yoke(pose.v, pose.h, C);
    place(cross, y.crossA, y.crossB); place(armA, y.crossA, y.armAB); place(armB, y.crossB, y.armBB);
    pointMotor(pitA, y.pitA, y.pitB.clone().sub(y.pitA)); pointMotor(pitB, y.pitB, y.pitA.clone().sub(y.pitB));
    { const ax = y.pitB.clone().sub(y.pitA).normalize(); [[brA, y.pitA, -1], [brB, y.pitB, 1]].forEach(a => { a[0].visible = S.drive === 'brake'; a[0].position.copy(a[1]).addScaledVector(ax, a[2] * 34); a[0].quaternion.setFromUnitVectors(AXZ, ax); }); }
    place(shA, y.pitA.clone().lerp(y.lugA, 0.6), y.lugA); place(shB, y.pitB.clone().lerp(y.lugB, 0.6), y.lugB);
    place(crA, y.lugA, y.stA); place(crB, y.lugB, y.stB);
    rollStator.position.copy(y.rc); rollStator.quaternion.setFromUnitVectors(AXZ, y.rn);
    cMark.position.copy(C);
    // helper axes
    yawLine.set(C.clone().add(V(0, 0, -60)), C.clone().add(V(0, 0, 120)));
    const ha = V(Math.cos(pose.v * DEG), Math.sin(pose.v * DEG), 0); holeLine.set(C.clone().addScaledVector(ha, -130), C.clone().addScaledVector(ha, 130));
    const ga = gAxis(pose.v, pose.h, pose.r); rollLine.set(C.clone().addScaledVector(ga, -S.tc), C.clone().addScaledVector(ga, ROLL_D - S.tc + 60));
    dotLine.set(C, gun.dotWorld());
    gun.updateLaser();
    const minR = drawCable(), cb = WK.cableBadge(minR); app.badge('cable', cb.level === 'ok' ? null : cb.text, cb.level);
    placeCam();
    const vis = app.inset.markVisibility('obs', gun.dotWorld()), offs = gun.dotOffset();
    app.cornerInset.setEstimate(vis && vis.visible ? { radial: offs.radial + BIAS.radial, vertical: offs.vertical + BIAS.vertical } : null);
    const tr = travelNeeded(), off0 = C.clone().sub(cHome());
    const swing = { y: cFor(pose.v + 1, pose.h).distanceTo(cFor(pose.v, pose.h)), p: cFor(pose.v, pose.h + 1).distanceTo(cFor(pose.v, pose.h)) };
    app.io.set({
      commands: [
        { name: 'G-code to the gantry', value: 'G1 X' + off0.x.toFixed(1) + ' Y' + off0.y.toFixed(1) + ' Z' + off0.z.toFixed(1) + ' F1500', note: 'relative to the opening pose; ' + (S.comp ? 'cancels the dot swing' : 'compensation off: gantry parked') },
        { name: 'Gimbal angle command (yaw / pitch / roll)', value: cmd.v.toFixed(1) + ' / ' + cmd.h.toFixed(1) + ' / ' + cmd.r.toFixed(1), unit: '°', note: 'serial angle command to the gimbal controller (protocol per product)' },
        { name: 'Distance t from dot to gimbal centre', value: S.tc, unit: 'mm', note: 'set once at build time, not commanded' },
      ],
      observes: [
        { name: 'Gimbal angles read back', value: act.v.toFixed(2) + ' / ' + act.h.toFixed(2) + ' / ' + act.r.toFixed(2), unit: '°', status: 'seen', note: 'encoder or IMU; the angle error slider is what it fails to report' },
        { name: 'Gantry position', value: (C.x - cHome().x).toFixed(1) + ' / ' + (C.y - cHome().y).toFixed(1) + ' / ' + (C.z - cHome().z).toFixed(1), unit: 'mm', status: 'partly', note: 'open-loop steps or scales: the gantry error is not visible to it' },
        { name: 'Dot visible to outside camera', value: vis ? (vis.visible ? 'yes' : (vis.inFov ? 'blocked' : 'out of view')) : '-', status: vis && vis.visible ? 'seen' : 'blind', note: 'drawn-scene line of sight; the gantry and gimbal are occluders' },
        { name: 'Dot vs seam (r, z)', value: vis && vis.visible ? (offs.radial + BIAS.radial).toFixed(2) + ', ' + (offs.vertical + BIAS.vertical).toFixed(2) : '-', unit: vis && vis.visible ? 'mm' : '', status: vis && vis.visible ? 'partly' : 'blind', note: 'estimate has a made-up bias; truth is in the corner inset' },
        { name: 'Dot vs seam, scene truth (r, z)', value: offs.radial.toFixed(2) + ', ' + offs.vertical.toFixed(2), unit: 'mm', status: 'blind', note: 'only the simulation knows this; the cradle error and the angle and gantry errors are in it' },
        { name: 'Cradle correction from the trial (x, y, z)', value: S.corr ? Ehat.x.toFixed(2) + ', ' + Ehat.y.toFixed(2) + ', ' + Ehat.z.toFixed(2) : 'not applied', unit: S.corr ? 'mm' : '', status: S.corr ? 'partly' : 'unresolved', note: 'z is the beam direction: a board cannot see it (the standoff is the focus, seen by the spot size)' },
        { name: 'Gantry travel this orientation span costs (x, y, z)', value: tr.x.toFixed(0) + ' / ' + tr.y.toFixed(0) + ' / ' + tr.z.toFixed(0), unit: 'mm', status: 'seen', note: 'derived from t and the span slider' },
        { name: 'Dot swing per degree if the gantry did not compensate (yaw / pitch)', value: swing.y.toFixed(1) + ' / ' + swing.p.toFixed(1), unit: 'mm per \u00B0', status: 'seen', note: 'derived: t times the change of the roll axis direction' },
        { name: 'Gun mass, centre of mass, cable pull', value: '-', status: 'unresolved', note: 'unknown; the CoG slider is a stand-in' },
      ],
      manual: ['Balance the gun on the gimbal (ballast)', 'Home the gantry so the dot is on the seam at the opening pose', 'Lay the umbilical'],
    });
    app.invalidate();
  }

  // ---------- controls
  const gm = app.ui.group('Gimbal angles (proposed actuators)', { help: 'Same three rotations as the reference gun: yaw about the vertical, hole (pitch) about the level axis, roll about the line to the cable exit.' });
  gm.slider({ id: 'yaw', label: 'Yaw', min: -60, max: 60, step: 1, value: -15, unit: '°', kind: 'actuator', visual: () => [yawMotor, cross], onChange: v => { S.v = v; update(); } });
  gm.slider({ id: 'hole', label: 'Pitch (hole-axis dial)', min: -10, max: 80, step: 1, value: 30, unit: '°', kind: 'actuator', visual: () => [pitA, pitB], onChange: v => { S.h = v; update(); } });
  gm.slider({ id: 'roll', label: 'Roll', min: 0, max: 80, step: 1, value: 45, unit: '°', kind: 'actuator', visual: () => [rollStator, rollRotor], onChange: v => { S.r = v; update(); } });
  const gt = app.ui.group('Gantry (proposed actuators)', { help: 'The gantry has no slider of its own: software derives X, Y, Z from the gimbal angles so the dot stays on the seam.' });
  gt.toggle({ id: 'comp', label: 'Gantry compensates the dot', value: true, kind: 'state', visual: () => [xCar[0], yCar, zCar], help: 'Off: the gantry stays where it was at the opening pose and the dot swings off the seam. Big moves then run the gun into the tube (LIMIT); try small ones.', onChange: v => { S.comp = v; update(); } });
  const bd = app.ui.group('Build choices (scene edits)');
  bd.slider({ id: 'tc', label: 'Gimbal centre C: distance from the dot along the roll line', min: 120, max: 262, step: 1, value: 200, unit: 'mm', kind: 'scene', visual: () => cMark, help: 'Smaller: less gantry travel and less angle-error leverage, but the cradle must reach into the gun.', onChange: v => { S.tc = v; rollRotor.position.copy(DOT_LOCAL).addScaledVector(axisLocal, ROLL_D); update(); } });
  bd.slider({ id: 'span', label: 'Orientation span the gantry must serve (±)', min: 5, max: 60, step: 1, value: 30, unit: '°', kind: 'scene', help: 'Only changes the travel readout: yaw and pitch each swept over ± this much.', onChange: v => { S.span = v; update(); } });
  const br = app.ui.group('Drive type and power');
  br.radio({ id: 'drive', label: 'Drive type', kind: 'branch', value: 'direct', options: [{ value: 'direct', label: 'direct-drive gimbal' }, { value: 'worm', label: 'worm-geared head' }, { value: 'brake', label: 'direct drive + fail-locked brakes' }], help: 'Direct drive: smooth, backlash-free, holds only while powered. Worm: self-locking, backlash, slower (a geared photo head is this class). Brakes: spring-applied, released by power, so a power dip holds the pose instead of dropping the gun; the brake hub adds its own small shift when it engages.', onChange: v => { S.drive = v; update(); } });
  br.toggle({ id: 'power', label: 'Motor power on', value: true, kind: 'state', onChange: v => { S.power = v; update(); } });
  br.slider({ id: 'cog', label: 'Centre of mass offset from C', min: 0, max: 60, step: 1, value: 12, unit: 'mm', kind: 'scene', help: 'Unknown. Balanced to zero the gun stays put at power loss; more offset means more sag (direct drive).', onChange: v => { S.cog = v; update(); } });
  const er = app.ui.group('What the hardware fails to do (scene edits)');
  er.slider({ id: 'angErr', label: 'Gimbal angle error (yaw and pitch)', min: 0, max: 0.3, step: 0.01, value: 0, unit: '°', kind: 'scene', help: 'Read-back error the software does not see. Dot error ≈ t × angle.', onChange: v => { S.angErr = v; update(); } });
  er.slider({ id: 'gantErr', label: 'Gantry position error', min: 0, max: 0.5, step: 0.01, value: 0, unit: 'mm', kind: 'scene', onChange: v => { S.gantErr = v; update(); } });
  function runTrial() { const n = k => { const x = Math.sin((S.mount + 7) * 91.345 + k * 47.31) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; }; Ehat = V(S.cx + 0.04 * n(1), S.cy + 0.04 * n(2), 0); }   // the along-beam component is invisible to a board: it stays at zero
  const cr = app.ui.group('The cradle: where the printed cradle really holds the gun (scene edits; software does not know)', { help: 'The formula assumes the gimbal centre sits exactly t from the dot on the roll line, in the gun\u2019s own frame. A printed cradle and a hand-balanced gun put it a millimetre or so off. Three numbers, in the gun frame (x across the barrel, y toward the grip side, z along the barrel).' });
  cr.slider({ id: 'cx', label: 'Cradle error x', min: -2, max: 2, step: 0.05, value: 1.0, unit: 'mm', kind: 'scene', visual: () => [cMark, rollRotor], onChange: v => { S.cx = v; update(); } });
  cr.slider({ id: 'cy', label: 'Cradle error y', min: -2, max: 2, step: 0.05, value: -0.8, unit: 'mm', kind: 'scene', visual: () => [cMark, rollRotor], onChange: v => { S.cy = v; update(); } });
  cr.slider({ id: 'cz', label: 'Cradle error z (along the barrel)', min: -2, max: 2, step: 0.05, value: 0.6, unit: 'mm', kind: 'scene', visual: () => [cMark, rollRotor], help: 'Slides the gun along its own beam. A camera above a board cannot see this one: the spot on the board does not move, only the standoff does.', onChange: v => { S.cz = v; update(); } });
  cr.radio({ id: 'seat', label: 'How the cradle mounts the gun', kind: 'branch', noVisual: true, value: 'loose', options: [{ value: 'loose', label: 'by hand: each mounting is new' }, { value: 'seated', label: 'three-ball seat: the same every time' }], help: 'A seat makes the cradle error a constant of the shell and cradle pair, so one trial serves every remount. Without it every remount is a new calibration.', onChange: v => { S.seat = v; } });
  cr.button({ id: 'remount', label: 'Take the gun off and put it back', kind: 'state', onClick: function () { S.mount++; const r = k => { const x = Math.sin(S.mount * 12.9898 + k * 78.233) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; }; if (S.seat === 'loose') { S.cx = 1.5 * r(1); S.cy = 1.5 * r(2); S.cz = 1.5 * r(3); } else { S.cx += 0.01 * r(1); S.cy += 0.01 * r(2); S.cz += 0.01 * r(3); } ['cx', 'cy', 'cz'].forEach(k => app.ui.set(k, Math.max(-2, Math.min(2, S[k])), { silent: true })); update(); } });
  cr.button({ id: 'trial', label: 'Run a fixed-point trial now (dot on one board cross, 30 poses, laser off)', kind: 'state', noVisual: true, onClick: function () { runTrial(); update(); } });
  cr.toggle({ id: 'corr', label: 'Software applies the trial\u2019s correction to the gantry target', value: false, kind: 'state', visual: () => [xCar[0], yCar, zCar], help: 'Fits the cradle offset from where the dot fell on the board (trials-19): the two components across the beam come back to about 0.05 mm; the component along the beam is invisible to a board and stays. It goes stale if the gun is remounted loosely.', onChange: v => { S.corr = v; update(); } });
  const rg = app.ui.group('Rotator, tube and camera');
  rg.toggle({ id: 'spin', label: 'Rotator turning', value: false, kind: 'state', visual: () => ws.turntable, onChange: v => { ws.spin.on = v; update(); } });
  rg.toggle({ id: 'runout', label: 'Show indicated runout (rig-doc limits)', value: false, kind: 'scene', visual: () => ws.tubeGroup, onChange: v => { ws.setRunout(v ? WK.RIG.runoutRadialTIR : 0, v ? WK.RIG.runoutFaceTIR : 0, 20); update(); } });
  rg.slider({ id: 'camAz', label: 'Camera azimuth', min: 0, max: 360, step: 1, value: 200, unit: '°', kind: 'scene', visual: 'the blue outside camera and its frustum', onChange: v => { S.camAz = v; update(); } });
  rg.toggle({ id: 'ghost', label: 'See-through tube', value: false, kind: 'view', onChange: v => { ws.setGhost(v); update(); } });

  runTrial(); S.ready = true; update();
})();
</script>
