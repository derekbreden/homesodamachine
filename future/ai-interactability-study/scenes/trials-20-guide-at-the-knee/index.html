    h('div', { class: 'gk-col' }, mkc('Camera view', 'simulated: truth plus noise', cam, status), mkc('Where the dot has been', 'true position, last 60 s (not observable)', trc)),

  const fmt = (v, d) => v == null || !isFinite(v) ? '–' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d == null ? 2 : d);

    const x = pos(), v = vis(x);

    trc.append(S('rect', { x: 0, y: 0, width: TW, height: SH, fill: '#0f141b', rx: 6 }));
    for (let x = -1.5; x <= 0.6; x += 0.5) trc.append(S('line', { x1: x0, y1: YX(x), x2: x1, y2: YX(x), stroke: '#1e2733' }), S('text', { x: 4, y: YX(x) + 3, class: 'sm', text: x.toFixed(1) }));
    trc.append(S('rect', { x: x0, y: YX(0.05), width: x1 - x0, height: YX(-0.05) - YX(0.05), fill: '#14b8a6', opacity: 0.18 }), S('line', { x1: x0, y1: YX(0), x2: x1, y2: YX(0), stroke: '#14b8a6' }), S('text', { x: x1, y: YX(0) - 4, 'text-anchor': 'end', class: 'sm teal', text: 'seam ±0.05 mm' }));
    const w = wid(); trc.append(S('line', { x1: x0, y1: YX(w / 2), x2: x1, y2: YX(w / 2), stroke: '#ff8a80', 'stroke-dasharray': '2 3', opacity: 0.6 }), S('text', { x: x0 + 4, y: YX(w / 2) - 3, class: 'sm red', text: 'dot completely gone from the plate (+w/2)' }));
    const pts = sim.hist.filter(p => t1 - p.t <= T).map(p => XT(p.t).toFixed(1) + ',' + Math.max(yTop, Math.min(yBot, YX(p.x))).toFixed(1));
    if (pts.length > 1) trc.append(S('polyline', { points: pts.join(' '), fill: 'none', stroke: '#e7ebf1', 'stroke-width': 1.5 }));
    trc.append(S('text', { x: 8, y: 14, class: 'b', text: 'dot centre position (mm past the seam) against time' }), S('text', { x: x1, y: 214, 'text-anchor': 'end', class: 'sm', text: '60 s window' }));
    const rec = sim.hist.filter(p => t1 - p.t <= 30);
    if (rec.length > 8) {
      const m = rec.reduce((a, p) => a + p.x, 0) / rec.length, rms = Math.sqrt(rec.reduce((a, p) => a + p.x * p.x, 0) / rec.length), lost = rec.filter(p => p.lost).length / rec.length;
      readout.innerHTML = 'Last 30 s: dot centre on average <b>' + fmt(m, 3) + ' mm</b> from the seam, rms <b>' + rms.toFixed(3) + ' mm</b>' + (lost > 0.02 ? ', out of sight <b>' + Math.round(lost * 100) + ' %</b> of the time' : '') + '. ' + (st.scheme === 'centroid' ? 'The centroid target sits half a dot into the wall.' : 'The fraction target is the centre on the seam.');
    } else readout.innerHTML = 'Press <b>Guide</b> and watch.';
  }
  function io() {
    const m = measure(1), x = pos();
    app.io.set({
      commands: [{ name: 'Axis position', value: sim.steps, unit: 'steps (' + st.step + ' mm each)', note: 'nudge or guide' }, { name: 'Mode', value: sim.mode === 'calibrating' ? 'calibrating' : sim.guide ? 'guiding (' + st.scheme + ')' : 'idle' }],
      observes: [
        { name: 'Centroid of the plate part', value: m.c == null ? 'star lost' : m.c.toFixed(3), unit: m.c == null ? '' : 'mm', status: m.c == null ? 'blind' : 'seen', note: 'noise ' + st.sigC + ' mm' },
        { name: 'Visible fraction', value: Math.round(m.f * 100), unit: '%', status: 'seen', note: 'integrated intensity against the full-plate value' },
        { name: 'Centroid slope from the nudges', value: sim.slope == null ? 'none' : sim.slope.toFixed(2), status: sim.slope == null ? 'unresolved' : 'seen' },
        { name: 'True dot position', value: 'in the trace only', status: 'blind', note: 'no sensor reads this' }],
      manual: ['Mount the camera to see the plate side of the corner', 'Provide the trim axis']
    });
  }

  let ioTick = 0;
  app.onFrame(function (dt) {
    dt = Math.min(dt, 0.1) * st.speed;
    let n = Math.max(1, Math.ceil(dt / 0.05)), hh = dt / n;
    for (let i = 0; i < n; i++) {
      sim.t += hh;
      if (sim.mode === 'calibrating') stepCal(hh);
      if (sim.guide && sim.mode === 'idle') { sim.acc += hh; if (sim.acc >= 0.5) { sim.acc = 0; guideTick(); } }
      sim.hstep = (sim.hstep || 0) + hh; if (sim.hstep >= 0.1) { sim.hstep = 0; const x = pos(); sim.hist.push({ t: sim.t, x: x, lost: vis(x).c == null }); if (sim.hist.length > 900) sim.hist.shift(); }
    }
    drawCam(); drawSignal(); drawTrace(); if ((ioTick++ % 6) === 0) io();
    return true;
  });

  // ------------------------------------------------------------------ controls
  const gs = app.ui.group('Software (proposed actions)', { open: true });
  gs.radio({ id: 'scheme', label: 'What the loop guides on', kind: 'branch', value: 'centroid', options: [{ value: 'centroid', label: 'centroid to the seam pixel (borrowed-05)' }, { value: 'fraction', label: 'fraction to 50 % (trials-03 knee)' }], help: 'The fraction scheme approaches with the centroid, then closes on the visible fraction.', onChange: v => { st.scheme = v; sim.lostCount = 0; } });
  gs.button({ id: 'cal', label: 'Calibrate here: nudge and watch', kind: 'state', onClick: () => startCalibration() });
  gs.toggle({ id: 'guide', label: 'Guide', value: false, kind: 'state', help: 'Runs every 0.5 simulated seconds.', onChange: v => { if (sim.mode === 'idle') sim.guide = v; else { sim.guide = false; } } });
  gs.slider({ id: 'gain', label: 'Guide gain (software setting)', min: 0.2, max: 1.2, step: 0.05, value: 0.6, kind: 'state', help: 'Fraction of the computed correction sent each tick. Above 1 the loop overshoots even with a perfect model.', onChange: v => { st.gain = v; } });
  const ga = app.ui.group('The trim axis (proposed actuator)', { open: true });
  ga.slider({ id: 'axis', label: 'Dot position across the seam', min: -3, max: 1.5, step: 0.01, value: -1.0, unit: 'mm', kind: 'actuator', visual: 'the dot in the camera view', help: 'Drag it to see the signals; the loop moves it when guiding. Negative: on the plate. Positive: on the wall.', onChange: v => { if (sim.mode === 'idle' && !sim.guide) { sim.x0 = v; sim.steps = 0; sim.t0 = sim.t; } } });
  ga.button({ id: 'reset', label: 'Reset time and history', kind: 'state', onClick: () => { sim.hist = []; sim.t = 0; sim.steps = 0; sim.guide = false; sim.mode = 'idle'; sim.calNote = 'not calibrated'; sim.slope = null; sim.calOk = null; app.ui.set('guide', false, { silent: true }); sim.x0 = app.ui.get('axis'); } });
  const gt = app.ui.group('Hidden truth (scene edits)', { open: true });
  gt.slider({ id: 'd', label: 'Dot diameter', min: 0.2, max: 1.2, step: 0.05, value: 0.5, unit: 'mm', kind: 'scene', help: 'The real dot’s size at the plate is unknown. The footprint is 1/cos 32° longer along r.', onChange: v => { st.d = v; } });
  gt.slider({ id: 'sigC', label: 'Centroid noise', min: 0, max: 0.15, step: 0.005, value: 0.025, unit: 'mm', kind: 'scene', onChange: v => { st.sigC = v; } });
  gt.slider({ id: 'sigF', label: 'Fraction noise', min: 0, max: 0.15, step: 0.005, value: 0.02, kind: 'scene', onChange: v => { st.sigF = v; } });
  gt.slider({ id: 'drift', label: 'Slow drift toward the wall', min: 0, max: 1.5, step: 0.05, value: 0.3, unit: 'mm/min', kind: 'scene', onChange: v => { st.drift = v; } });
  const gv = app.ui.group('View');
  gv.slider({ id: 'speed', label: 'Simulation speed', min: 1, max: 6, step: 1, value: 2, unit: '×', kind: 'view', noVisual: true, onChange: v => { st.speed = v; } });
  sim.x0 = -1.0;
})();
</script>
</body>
</html>
