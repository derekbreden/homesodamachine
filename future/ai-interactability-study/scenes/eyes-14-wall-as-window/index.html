      proposes: '<p>room-03 puts the gun inside a laser-safe cabinet, on a rod through a ball in the lid. The outside end of the rod is in the clear air of the room. This scene draws the rod <b>along its own axis</b> (outside on the left, the gun on the right) with the sideways direction stretched so millimetres show.</p>' +
        '<p>What can be known about where the dot is? <b>Step counts</b> know only what was commanded. <b>Two scales</b> outside the lid read the rod\'s sideways position at two stations, so they see the ball\'s play, which step counts cannot. But the rod <b>bends</b>: one bending moment, <i>F&nbsp;d</i>, passes through the ball and bends the inside segment <i>and</i> the tail. A straight line through the two scales then misses the dot. A <b>load cell at the tail actuators</b> reads that moment, so a bend model can be subtracted.</p>' +
        '<p><b>Try:</b> thin the rod (Ø12 to 20 mm) and watch the tail droop and the dot error blow up; thicken it (Ø40 to 50 mm) and the errors fall. Move the play slider: only the scales see it. Switch on the plume: the camera goes blind and the outside reads carry on.</p>',
      carries: '<p>As in room-03: the ball and lid carry the gun through the rod, the counterweight balances gravity about the ball, the actuators hold the tail point at its commanded place. Here the rod is a beam: <b>amber</b> is drawn with its bending exaggerated; <b>dashed</b> is where software believes it is. Scales (blue) read the rod against the lid frame; the load cell (purple) sits at the tail actuators.</p>',
      software: '<p>Software reads two scales, one force, one camera. What each says about the dot is on the bars: <b>step counts</b> (no sensor), <b>two scales on a straight line</b>, <b>two scales plus a bend model with the load taken from the tail force</b>, and the <b>camera</b> (dot against the seam, direct, when it can see). Model errors and noise are sliders. The camera is the only reading that knows where the seam is: the scales say where the gun is in the cabinet, not where the tube is.</p>',
      tried: '<ul><li><b>Assumed (room-03 note 4):</b> the rod is stiff; the counterweight leaves the actuators nothing to carry. <b>Found:</b> the counterweight balances the actuators, not the rod: the same moment F&nbsp;d (about 5 N&nbsp;m for 1.5 kg at 400 mm plus a 2 N cable tug) still runs through the ball and bends both sides. For an aluminium tube Ø20 × 2 mm the tail droops 3.3 mm at 800 mm and the dot ends 2.4 mm off the commanded line; Ø40 gives 0.19 mm; Ø50 0.06. <b>Leaves:</b> real rod ends, clamps and ball compliance add to it.</li>' +
        '<li><b>Assumed:</b> outside scales give the dot by extending their line into the cabinet. <b>Found:</b> for a thin rod the line is worse than step counts, because the tail droops one way and the inside droops the same way but by a different amount (2.4 mm against 2.4 mm at Ø20, 0.26 against 0.19 at Ø40).</li>' +
        '<li><b>Repair:</b> read the moment. The tail force gives F&nbsp;d, the beam model turns it into the bend at both stations and at the dot; at Ø20 the model estimate is 0.13 mm (0.05 of it noise), and it depends on the bending stiffness: 20 % error in EI gives 0.41 mm. One direct look with the camera at two tilts calibrates EI.</li>' +

  // ---------------------------------------------------------------- state

  // ---------------------------------------------------------------- beam model (see calc/wall-window.mjs)
  function model() {

    const yb = (s, F_, EI_) => { F_ = F_ == null ? F : F_; EI_ = EI_ == null ? EI : EI_; return s >= 0 ? -F_ * s * s * (3 * d - s) / (6 * EI_) : -(F_ * d / (Lt * EI_)) * (Lt * s * s / 2 + s ** 3 / 6); };
    const tau = (yb(-Lt) + st.delta) / Lt;
    const y = s => yb(s) + tau * s + st.delta;

  function errors() {

    add('text', { x: dx - 6, y: YM - 138, class: 'g', text: 'at the dot' });
    // legend of the markers
        const leg = [['#f87171', 'truth at the dot'], ['#94a3b8', 'step counts say'], ['#f59e0b', 'scales, straight line say'], ['#2dd4bf', 'scales + bend model say']];

    add('text', { x: X0, y: 88, class: 'g', text: 'moment through the ball F d = ' + (M.F * st.d / 1000).toFixed(2) + ' N m; EI = ' + (M.EI / 1e9).toFixed(2) + ' N m2' });
    drawBars(R);
    io(R);
  }
  function drawBars(R) {
    while (barsSvg.firstChild) barsSvg.removeChild(barsSvg.firstChild);
    const add = (t, a, ...c) => barsSvg.appendChild(S(t, a, ...c));

  }
  function io(R) {
    app.io.set({
      commands: [{ name: "room-03's plate slide, insertion, tail pitch and yaw", value: '(not drawn)', note: 'unchanged; this scene adds readers, not movers' }],

  }

  const g3 = app.ui.group('The readers (proposed)', { help: 'Where they stand and how noisy they are: illustrative.' });
  g3.slider({ id: 'a1', label: 'Scale 1 outside the lid', min: 40, max: 300, step: 10, value: 120, unit: 'mm', kind: 'scene', onChange: upd('a1') });
  g3.slider({ id: 'a2', label: 'Scale 2 outside the lid', min: 200, max: 900, step: 10, value: 400, unit: 'mm', kind: 'scene', onChange: upd('a2') });

  g3.slider({ id: 'eEI', label: 'Error in the assumed bending stiffness EI', min: 0, max: 25, step: 1, value: 5, unit: '%', kind: 'scene', help: 'One direct look at two tilts would calibrate it.', onChange: upd('eEI') });
  g3.slider({ id: 'sC', label: 'Camera noise inside (1 sigma)', min: 0.03, max: 0.3, step: 0.01, value: 0.08, unit: 'mm', kind: 'scene', onChange: upd('sC') });
  const g4 = app.ui.group('State and view', {});
  g4.toggle({ id: 'plume', label: 'Bead running: the plume blinds the camera', value: false, kind: 'state', help: 'The outside readers carry on; the camera does not.', onChange: v => { st.plume = v; draw(); } });
  g4.slider({ id: 'ex', label: 'Sideways exaggeration', min: 5, max: 200, step: 5, value: 40, unit: 'x', kind: 'view', help: 'The axial scale is true; the sideways scale is stretched.', onChange: v => { st.ex = v; draw(); } });
  app.onReady(function () { app.legend([{ color: '#f59e0b', label: 'the rod as it really sits (sideways stretched)' }, { color: '#64748b', label: 'commanded line' }, { color: '#60a5fa', label: 'outside scale / camera' }, { color: '#a855f7', label: 'tail actuators + load cell' }, { color: '#14b8a6', label: 'ball' }]); draw(); });
  window.__errors = () => { const R = errors(); return { steps: R.steps, line: R.line, model: R.model, tail: R.tail, tip: R.tip }; };
})();
</script>
</body>
