(function () {

      proposes:
        '<p><b>Who docks the gun, a hand or a machine?</b> use asked this of travel-14b and found that a hand-run dock leaves no state for software to command. Here a six-axis arm brings the gun to the dock and puts it within capture (a few millimetres); the three-ball seat then locates it. What the arm does next decides whether it helps or fights: <b>hold</b> (position control: it pushes wherever its taught pose differs from the seat’s), <b>brake</b> (stiff, and it shifts as the brakes take), or <b>float</b> (its gravity-compensation mode: it carries the weight and adds almost no force, but whatever declared mass and joint friction it has left is a force on the seat).</p>' +
        '<p>The left drawing is a side elevation with the arm as a spring (or as a small residual force), the gun on two of the three balls, the magnet preload and the umbilical’s load change. The right drawing is the seat from above: each ball’s contact load, red where it has lost contact. The readouts give the dot’s shift from the seat’s <b>translation</b> and from its <b>rocking</b> (a sideways force at the flange, at a height above the balls, tips the plate about the far balls and the dot sits at a lever from that axis). The last row, <b>release</b>, is use-14’s handover shift: how far the gun moves when the arm lets go of it.</p>' +
        '<p>The repair is a sequence: dock, <b>float</b>, read the joint angles (the arm’s encoders now say where the seat is), <b>re-teach</b> the dock pose from them, then hold. Toggle it and watch the arm’s mismatch fall to the encoder’s own error and the seat’s load with it.</p>',

        '<li><b>Hold fights the seat; float leaves a residual; neither is small at these numbers.</b> <i>Conflict:</i> an arm holding a taught pose 0.5 mm off the seat, at 5 N/mm, ends with the dot 352 \u00b5m off and about 1 N still pushing sideways into the seat (2.5 N if the seat were rigid); the brakes 491 \u00b5m; float 444 \u00b5m, with no arm force at all but a residual of 1.5 N of joint friction, 1 N of umbilical change and a 0.1 kg declaration error (1 N up on the gun): the rocking term is nine tenths of each (<code>calc/17</code>). <i>Assumption:</i> the arm\u2019s taught pose is the seat\u2019s. <i>Change:</i> float, read the joints, re-teach, hold: the mismatch falls to 0.08 mm (the encoder\u2019s 0.03 plus 0.05 of drift) and the dot to 131 \u00b5m; with the seat moved to the nozzle end (lever 20 mm, ring 80 mm, flange 60 mm up) 25 \u00b5m; with 400 N/mm contacts instead 23 \u00b5m. <i>Leaves:</i> the drift of an arm as it warms up; the seat\u2019s own repeatability; every number here.</li>' +
        '<li><b>The declared mass is a force.</b> An arm that thinks the gun is 0.1 kg heavier than it is pushes the gun up with 1 N. The preload has to exceed that, plus the umbilical’s change, by the margin the tipping term eats. <i>Leaves:</i> nobody has weighed the gun; the umbilical’s pull changes as the arm floats, because the fibre is not in the payload.</li>' +
        '<li><b>Which arm can do it.</b> The table at the bottom compares the gun mass you set against the payloads of the arms in the sourcing notes. No Prime-listed arm carries a gun of 1 kg; the two in the table that do (the UR3e class and the Fairino FR3) are sold by their makers.</li>' +
        '</ul>',
      unresolved:
        '<ul>' +
        '<li>Every stiffness, force, height, lever and mismatch is <b>illustrative</b>. Gun mass and the umbilical’s pull are <b>[unknown]</b>. Whether a printed groove and a steel ball stay at 40 N/mm under repeated docking, and whether the trunnion housing exists, is open (travel-14b, use-16).</li>' +
        '<li>One horizontal direction (you set it) and the vertical; the seat is three balls at 120°, the balls’ own friction is one coefficient (0.2, illustrative). A crown docks two pins in two V-notches, not three balls: the rocking argument is the same, the geometry is not.</li>' +
        '<li><b>Questions for Derek:</b> the gun’s mass with the shell on; whether you would let a machine put the gun on a dock; whether a printed seat could sit at the nozzle end rather than at the housing.</li>' +
        '</ul>',

  }

    const o = { mode: app.ui.get('mode'), teach: app.ui.get('teach'), m: app.ui.get('m'), mv: app.ui.get('mv'), drift: app.ui.get('drift'), ka: app.ui.get('ka'), kf: app.ui.get('kf'), fr: app.ui.get('fr'), dm: app.ui.get('dm'), dF: app.ui.get('dF'), phi: app.ui.get('phi'), P: app.ui.get('P'), kc: app.ui.get('kc'), rb: app.ui.get('rb'), h: app.ui.get('h'), L: app.ui.get('L'), mass: app.ui.get('mass') };

    R(cx - 42 + sh, gy - 190 - up, 84, 158, '#f5a524', { 'fill-opacity': 0.55 });               // housing

    else { spring(wallX, cx - 26 + sh, fy + 12, '#a855f7', o.mode === 'brake' ? 5 : 7, 8); T(140, fy - 4, (o.mode === 'brake' ? 'brake: ' : 'hold: ') + m.ka.toFixed(0) + ' N/mm, mismatch ' + (m.mEff * 1000).toFixed(0) + ' µm', 'small'); }

    T(PX - 160, Y0 + 6, 'Seat from above: contact load on each ball, N', 'big');
