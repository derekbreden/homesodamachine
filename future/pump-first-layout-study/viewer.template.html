<div id="pump-bay-study" aria-label="Pump-first bay layout study">
  <div class="viz-controls">
    <label class="form-label">Arrangement<select class="form-select" data-control="arrangement"><option value="candidate">Pump first · larger funnel</option><option value="current">Current bay</option><option value="factory">Front closure staging</option><option value="tooling">Funnel casting molds</option></select></label>
    <label class="form-label">View<select class="form-select" data-control="view"><option value="three">Above the core</option><option value="top">Top</option><option value="west">Water side</option><option value="east">Electronics side</option><option value="rear">Rear connections</option></select></label>
    <label class="form-label">Show<select class="form-select" data-control="show"><option value="all">Complete bay</option><option value="pump">Pump and water circuit</option><option value="gas">CO₂ and carbonated water</option><option value="electronics">Electronics and wiring</option><option value="structure">Structure and mounts</option><option value="funnel">Funnel and drain</option></select></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-control="funnel" checked><span class="form-check-label">Funnel</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-control="cover"><span class="form-check-label">Cover</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-control="walls"><span class="form-check-label">Walls and roof</span></label>
    <label class="form-label">Roof electronics<select class="form-select" data-control="roof"><option value="ghost">See through</option><option value="solid">Solid</option><option value="hidden">Hidden</option></select></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-control="labels" checked><span class="form-check-label">Labels</span></label>
  </div>
  <div class="pb-readout tabular-nums" data-readout aria-live="polite"></div>
  <div class="pb-stage" role="img" aria-label="Rotatable native component geometry of the bay above the cold core. Select a component to inspect its name and measured position."></div>
  <div class="pb-legend text-small"></div>
  <div class="viz-controls pb-inspect">
    <div class="pb-inspect-field"><label class="form-label">Inspect<select class="form-select" data-control="inspect"><option value="">All components</option></select></label></div>
    <button type="button" class="btn" data-action="frame">Frame selection</button>
  </div>
  <div class="pb-detail text-small" data-detail aria-live="polite"></div>
  <div class="sr-only">Full component geometry is shown in the existing enclosure coordinates: X is width, positive Y is aft, and Z is height above the cabinet floor. The study is bounded by the cold-core top lid and forward cartridge assembly. Printed fit and endurance qualification are separate from geometric readings.</div>
</div>
<style>
#pump-bay-study .pb-stage{width:100%;height:510px;touch-action:none;position:relative;margin-block:8px}
#pump-bay-study canvas{display:block;width:100%;height:100%}
#pump-bay-study .pb-readout{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:14px;font-weight:500}
#pump-bay-study .pb-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:14px}
#pump-bay-study .pb-legend span{display:inline-flex;align-items:center;gap:6px}
#pump-bay-study .pb-swatch{width:12px;height:12px;display:inline-block}
#pump-bay-study .pb-detail{min-height:42px;margin-top:10px;overflow-wrap:anywhere}
#pump-bay-study .pb-inspect{align-items:end}
#pump-bay-study .pb-inspect-field{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;flex:1 1 260px}
#pump-bay-study .pb-leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:var(--muted-foreground);overflow:hidden}
#pump-bay-study .pb-leaders line{stroke:currentColor;stroke-width:1;opacity:.8;vector-effect:non-scaling-stroke}
#pump-bay-study .pb-label{position:absolute;max-width:170px;pointer-events:none;padding:2px 6px;border:1px solid var(--border);border-radius:3px;background:var(--background);color:var(--foreground);font-size:11px;line-height:1.3;opacity:.94;transform:translate(-50%,-50%)}
@media(max-width:580px){#pump-bay-study .pb-stage{height:390px}}
</style>
