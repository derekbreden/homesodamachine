(() => {
const button = (a,t,c='') => `<button type="button" data-action="${a}" class="${c}">${t}</button>`;
const art = (a,c='') => `<img class="art ${c}" src="${a.url}" alt="${a.name} uploaded artwork">`;
const meter = (f) => `<span class="meter" aria-label="${f?2:3} of 4 level segments">${[0,1,2,3].map(i=>`<i class="${i<(f?2:3)?'full':''}"></i>`).join('')}</span>`;
function twin(s,A) {
const selected = A[s.flavor];
const title = {detail:'Mixing ratio',clean:'Clean',fill:'Fill',prime:'Prime',artwork:'Your images'}[s.page];
const head = `<header><span class="wordmark">HOME SODA MACHINE</span>${button('page:home',s.page==='home'?'Your drinks':'← Your drinks','quiet')}</header>`;
if(s.page==='home') return `<div class="twin">${head}<div class="twin-pair">${A.map((a,f)=>`<section class="label-well ${f===s.flavor?'chosen':''}"><button class="label-art" data-action="select:${f}" aria-label="Select ${a.name}">${art(a)}<span class="selected-tag">${f===s.flavor?'✓ On the faucet':'Tap to select'}</span></button><div class="label-side"><span class="slot">${f?'02':'01'}</span>${meter(f)}<span class="ratio-note">1 : ${s.ratios[f]}</span>${button(`detail:${f}`,'Adjust ↗','open-detail')}</div></section>`).join('')}</div><footer>${button('page:fill','Fill')}${button('page:prime','Prime')}${button('page:clean','Clean')}${button('page:artwork','Images')}</footer></div>`;
let body='';
if(s.page==='detail')body=`<h1>${title}</h1><p>Concentrate : water</p><div class="ratio-controls">${button('ratio:-1','−')}<strong>1 : ${s.ratio}</strong>${button('ratio:1','+')}</div><div class="ratio-guide"><span>More flavor</span><span>Lighter</span></div>${button('page:artwork','Change image ↗','wide secondary')}`;
if(s.page==='artwork')body=`<h1>Your images</h1><div class="image-choices">${globalThis.studyArtwork.map((a,f)=>button(`assign:${f}`,art(a),f===s.assignments[s.flavor]?'picked':'')).join('')}</div>${button('upload','Add images in the app ↗','wide secondary')}`;
if(s.page==='clean')body=s.running?`<span class="eyebrow">CYCLE 2 OF 3</span><h1>Flushing</h1><p>Water is leaving the reservoir.</p><div class="steps"><b></b><b></b><i></i></div>${button('stop','Stop cleaning','wide stop')}`:`<h1>Clean</h1><p>Place a pitcher under the faucet.</p><div class="operation-detail">3 rinse cycles</div>${button('run','Start cleaning →','wide primary')}`;
if(s.page==='fill')body=s.running?`<span class="eyebrow">FILLING</span><h1>Drawing in<br>concentrate</h1>${meter(s.flavor)}${button('stop','Stop filling','wide stop')}`:`<h1>Fill</h1><p>Pour concentrate into the top funnel.</p>${button('run','Start filling →','wide primary')}`;
if(s.page==='prime')body=`<h1>Prime</h1><p>Place a glass under the faucet.</p>${button('hold',s.running?'Priming… release to stop':'Hold to prime','wide primary hold-pad')}`;
return `<div class="twin">${head}<div class="twin-detail"><aside>${art(selected)}<span>${s.flavor?'02':'01'} · Selected image</span></aside><section>${body}</section></div><footer>${button('page:detail','Ratio')}${button('page:fill','Fill')}${button('page:prime','Prime')}${button('page:clean','Clean')}</footer></div>`;
}
function dock(s,A) {
let f=s.flavor; let body='';
const nav=`<nav class="dock-nav"><span class="dock-mark">S/</span>${A.map((a,i)=>button(`select:${i}`,art(a),i===f?'current':'')).join('')}</nav>`;
const heading={home:'At your faucet',detail:'Make it yours',clean:'Clean this flavor',fill:'Fill this flavor',prime:'Prime this flavor',artwork:'Choose an image'}[s.page];
const hero=`<section class="dock-hero">${art(A[f])}<span class="dock-status">${s.page==='home'?'● On the faucet':'● Selected image'}</span></section>`;
if(s.page==='home')body=`<div class="dock-level"><span>Reservoir</span>${meter(f)}</div><div class="dock-ratio"><span>Mixing ratio</span><strong>1:${s.ratio}</strong>${button('page:detail','Adjust →')}</div><div class="dock-actions">${button('page:fill','Fill ↗')}${button('page:clean','Clean ↗')}${button('page:prime','Prime ↗')}${button('page:artwork','Image ↗')}</div>`;
if(s.page==='detail')body=`<span class="dock-label">CONCENTRATE : WATER</span><div class="ratio-circle"><strong>1<span>:</span>${s.ratio}</strong></div><div class="dock-adjust">${button('ratio:-1','− More flavor')}${button('ratio:1','+ Lighter')}</div>${button('page:artwork','Change image →','dock-wide')}`;
if(s.page==='clean')body=s.running?`<span class="dock-label">CYCLE 2 / 3</span><h1>Flushing</h1><div class="dock-cycle"><b>1</b><b>2</b><span>3</span></div><p>Water is leaving the reservoir.</p>${button('stop','Stop cleaning','dock-wide stop')}`:`<h1>A fresh start.</h1><p>Place a pitcher under the faucet.</p><div class="dock-three">3 rinse cycles</div>${button('run','Start cleaning →','dock-wide')}`;
if(s.page==='fill')body=s.running?`<span class="dock-label">FILLING</span><h1>Drawing in<br>concentrate</h1>${meter(f)}${button('stop','Stop filling','dock-wide stop')}`:`<h1>Top it up.</h1><p>Pour concentrate into the top funnel.</p>${button('run','Start filling →','dock-wide')}`;
if(s.page==='prime')body=`<h1>Ready the line.</h1><p>Place a glass under the faucet.</p>${button('hold',s.running?'Priming… release to stop':'Hold to prime','dock-wide hold-pad')}`;
if(s.page==='artwork')body=`<div class="dock-gallery">${globalThis.studyArtwork.map((a,i)=>button(`assign:${i}`,art(a),i===s.assignments[f]?'picked':'')).join('')}</div>${button('upload','Add images in the app →','dock-wide')}`;
return `<div class="dock">${nav}<div class="dock-main"><header><span>${heading}</span>${s.page==='home'?'':button('page:home','Done')}</header><div class="dock-content">${hero}<section class="dock-tools">${body}</section></div></div></div>`;
}
globalThis.baseConcepts=[{id:'twin',name:'Twin labels',tagline:'Two pictures. Equal presence.',render:twin},{id:'dock',name:'Control room',tagline:'One picture anchors every action.',render:dock}];
})();

(() => {
  const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const image = (a, cls='') => `<img class="${cls}" src="${a.url}" alt="${esc(a.name)}">`;
  const button = (action, label, cls='', attrs='') => `<button type="button" class="${cls}" data-action="${action}" ${attrs}>${label}</button>`;
  const level = (n=3) => `<div class="b-level" aria-label="Reservoir level: ${n} of 4 segments">${[0,1,2,3].map(i=>`<i class="${i<n?'lit':''}"></i>`).join('')}</div>`;
  const links = () => `${button('page:fill','Fill')}${button('page:prime','Prime')}${button('page:clean','Clean')}`;
  const back = s => s?.running&&s.page!=='prime'?'<span class="b-running-label">In progress</span>':button('page:home','← Choose','b-back');
  const ratio = s => `<div class="b-ratio-control">${button('ratio:-1','−','','aria-label="Less water per part concentrate"')}<span>1:${s.ratio}</span>${button('ratio:1','+','','aria-label="More water per part concentrate"')}</div>`;
  const progress = page => `<div class="b-progress" aria-label="Operation progress"><i></i></div><div class="b-step">${page==='clean'?'Cycle 2 of 3 · Water out':page==='fill'?'Drawing into the reservoir':'Pump running'}</div>`;
  const operation = (s, kind) => {
    const clean = s.page==='clean', prime = s.page==='prime';
    const name = clean?'Clean':prime?'Prime':'Fill';
    const title = s.running ? (clean?'Cleaning':prime?'Priming':'Filling') : name;
    const intro = clean?'Set a pitcher under the faucet.':prime?'Hold to push concentrate to the faucet.':'Pour concentrate into the funnel on top.';
    const detail = clean?'Three rounds of tap water rinse this flavor.':prime?'Release to stop the pump.':'The pump draws it into this reservoir.';
    return `<div class="b-operation ${s.running?'is-running':''}"><h2>${title}</h2>${s.running?progress(s.page):`<p>${intro}</p><p class="b-note">${detail}</p>`}${button(s.running?'stop':'run',s.running?'Stop':prime?'Hold to prime':clean?'Start cleaning':'Start filling',`b-go ${s.running?'b-stop':''}`,prime?'data-hold="true"':'')}</div>`;
  };
  const artwork = (s,A) => {
    const choices=globalThis.studyArtwork||A;
    const selected=s.assignments?.[s.flavor]??s.flavor;
    return `<h2>Artwork</h2><div class="b-art-options">${choices.map((a,i)=>button('assign:'+i,`${image(a)}<span>${selected===i?'Selected':'Choose'}</span>`,selected===i?'chosen':'',`aria-label="Assign ${esc(a.name)} artwork" aria-pressed="${selected===i}"`)).join('')}</div>${button('upload','Add images in the app','b-upload')}`;
  };
  function poster(s,A) {
    const a=A[s.flavor], other=1-s.flavor;
    let content='';
    if(s.page==='home') {
      content=`<div class="poster-top"><span class="poster-selected">● Selected</span>${button('page:detail','Adjust →','poster-adjust')}</div><div class="poster-readings"><div><span class="b-label">Ratio</span><strong>1:${s.ratio}</strong></div><div><span class="b-label">Reservoir</span>${level(s.flavor===0?3:2)}</div></div>${button('select:'+other,`<span>Choose</span>${image(A[other])}`,'poster-alternate',`aria-label="Select ${esc(A[other].name)}"`)}<nav class="poster-actions">${links()}</nav>`;
    } else if(s.page==='detail') {
      content=`${back()}<h2>Ratio</h2>${ratio(s)}<p class="b-note">Concentrate : water</p>${button('page:artwork','Change artwork →','poster-art-link')}<nav class="poster-actions">${links()}</nav>`;
    } else if(s.page==='artwork') {
      content=`${button('page:detail','← Adjust','b-back')}${artwork(s,A)}`;
    } else {
      content=`${back(s)}${operation(s,'poster')}`;
    }
    return `<section class="poster"><div class="poster-hero">${s.page==='home'?button('select:'+s.flavor,image(a),'poster-hero-button',`aria-label="${esc(a.name)}, selected" aria-pressed="true"`):image(a)}</div><div class="poster-content">${content}</div></section>`;
  }
  function index(s,A) {
    const a=A[s.flavor];
    if(s.page==='home') return `<section class="index"><header class="index-header"><h2>Choose</h2><span>At the faucet</span></header><div class="index-rows">${A.map((a,i)=>`<div class="index-row ${s.flavor===i?'selected':''}">${button('select:'+i,image(a),'index-face',`aria-label="Select ${esc(a.name)}" aria-pressed="${s.flavor===i}"`)}<div class="index-row-info"><span class="index-state">${s.flavor===i?'● Selected':'Available'}</span><div class="index-measure"><strong>1:${s.ratios?.[i]??s.ratio}</strong>${level(i===0?3:2)}</div></div><div class="index-row-actions">${s.flavor===i?button('page:detail','Adjust →')+button('page:fill','Fill'):button('select:'+i,'Choose →','index-choose',`aria-label="Select ${esc(a.name)}"`)}</div></div>`).join('')}</div><nav class="index-home-footer">${button('page:prime','Prime selected flavor')}${button('page:clean','Clean selected flavor')}</nav></section>`;
    const header=`<header class="index-header">${back(s)}<span>${s.page==='detail'?'Adjust':s.page==='artwork'?'Artwork':s.page==='clean'?'Clean':s.page==='prime'?'Prime':'Fill'}</span></header>`;
    let details='';
    if(s.page==='detail') details=`<h2>Make it yours.</h2><div class="index-ratio-label">Concentrate : water</div>${ratio(s)}${button('page:artwork','Change artwork →','index-art-link')}<nav class="index-detail-actions">${links()}</nav>`;
    else if(s.page==='artwork') details=artwork(s,A);
    else details=operation(s,'index');
    return `<section class="index">${header}<div class="index-detail"><div class="index-identity">${image(a)}<span>Selected flavor</span></div><div class="index-detail-content">${details}</div></div></section>`;
  }
  globalThis.extraConcepts = [
    {id:'poster',name:'Poster',tagline:'One flavor takes the stage.',render:poster},
    {id:'index',name:'Index',tagline:'Two flavors. An orderly, open page.',render:index}
  ];
})();

(() => {
const root=document.getElementById('soda-studies');
const state={concept:'twin',page:'home',flavor:0,ratio:20,running:false};
const designs=[...globalThis.baseConcepts,...globalThis.extraConcepts];
const screen=root.querySelector('#study-screen');
const direction=root.querySelector('#study-direction');
const page=root.querySelector('#study-page');
const faucet=root.querySelector('#faucet-image');
const assignments=[0,1];
const ratios=[20,20];
const previews={faucet:true};
direction.innerHTML=designs.map((d,i)=>`<option value="${d.id}">${String(i+1).padStart(2,'0')} · ${d.name}</option>`).join('');
function fit(){screen.style.transform=`scale(${screen.parentElement.clientWidth/800})`;}
function render(){
  const d=designs.find(d=>d.id===state.concept)||designs[0];
  const assigned=assignments.map(i=>globalThis.studyArtwork[i]);
  state.ratio=ratios[state.flavor];
  state.ratios=[...ratios];
  state.assignments=[...assignments];
  screen.innerHTML=d.render(state,assigned);
  faucet.src=assigned[state.flavor].url;
  faucet.alt=assigned[state.flavor].name+' on the faucet';
  direction.value=d.id;page.value=state.page;
  root.querySelector('#study-title').textContent=d.name;
  root.querySelector('#study-caption').textContent=d.tagline;
  root.querySelector('.faucet-preview').style.display=previews.faucet?'':'none';
  root.querySelector('.study-pair').style.gridTemplateColumns=previews.faucet?'':'minmax(0,1fr)';
  root.querySelector('#study-live').textContent=d.name+', '+state.page+', '+assigned[state.flavor].name;
  fit();
}
function showUpload(){
const artwork=globalThis.studyArtwork[assignments[state.flavor]];
const upload=root.querySelector('#study-upload');
upload.hidden=false;
upload.innerHTML=`<div class="app-story" aria-label="Companion app image setup concept"><div class="app-phone"><span class="step-number">01 · CHOOSE</span><h3>Add your image</h3><div class="phone-image"><img src="${artwork.logo}" alt="${artwork.name} logo from your photos"></div><button data-action="phone-next" type="button">Choose from photos</button></div><div class="app-phone"><span class="step-number">02 · COMPOSE</span><h3>Fit it to your faucet</h3><img src="${artwork.url}" alt="Full portrait image preview"><button data-action="phone-next" type="button">Use this image</button></div><div class="app-phone"><span class="step-number">03 · RECOGNIZE</span><h3>On your faucet</h3><img src="${artwork.url}" alt="Same image assigned to faucet"><button data-action="upload-close" type="button">Done</button></div></div><button type="button" data-action="upload-close" class="btn phone-close">Close app preview</button>`;
}
function act(action){
  let [kind,value]=action.split(':');
  if(state.running&&['page','select','detail','assign','ratio','upload'].includes(kind))return;
  if(kind==='page'){state.page=value;state.running=false;}
  if(kind==='select'){state.flavor=Number(value);state.running=false;}
  if(kind==='detail'){state.flavor=Number(value);state.page='detail';state.running=false;}
  if(kind==='assign'){assignments[state.flavor]=Number(value);state.page='detail';}
  if(kind==='ratio')ratios[state.flavor]=Math.max(6,Math.min(24,ratios[state.flavor]+Number(value)));
  if(kind==='run')state.running=true;
  if(kind==='stop')state.running=false;
  if(kind==='upload'){showUpload();return;}
  if(kind==='upload-close'){root.querySelector('#study-upload').hidden=true;return;}
  if(kind==='phone-next'){root.querySelector('#study-live').textContent='Companion app image setup preview';return;}
  render();
}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.matches('[data-hold], [data-action="hold"]'))act(b.dataset.action);});
root.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-hold], [data-action="hold"]');if(b){e.preventDefault();state.running=true;render();}});
globalThis.addEventListener('pointerup',()=>{if(state.page==='prime'&&state.running){state.running=false;render();}});
globalThis.addEventListener('pointercancel',()=>{if(state.page==='prime'&&state.running){state.running=false;render();}});
root.addEventListener('pointermove',e=>{if(state.page==='prime'&&state.running){const pad=root.querySelector('[data-hold], [data-action="hold"]');if(pad){const b=pad.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom){state.running=false;render();}}}});
root.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.matches('[data-hold], [data-action="hold"]')){e.preventDefault();state.running=true;e.target.textContent='Priming… release to stop';}});
root.addEventListener('keyup',e=>{if(state.page==='prime'&&(e.key===' '||e.key==='Enter')){e.preventDefault();state.running=false;render();}});
direction.addEventListener('change',()=>{state.concept=direction.value;state.running=false;render();});
page.addEventListener('change',()=>{state.page=page.value;state.running=false;render();});
root.querySelector('#study-faucet').addEventListener('click',()=>{if(!state.running){state.flavor=1-state.flavor;render();}});
new ResizeObserver(fit).observe(screen.parentElement);
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(previews,'faucet',{label:'Faucet preview'});}
globalThis.study={state,render,act,designs,assignments,ratios};
})();
</script>
