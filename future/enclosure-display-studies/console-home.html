(() => {
const button=(action,label,cls='')=>`<button type="button" data-action="${action}" class="${cls}">${label}</button>`;
const image=a=>`<img src="${a.url}" alt="${a.name}">`;
const meter=f=>`<span class="crb-meter" aria-label="Reservoir level: ${f?2:3} of 4 segments">${[0,1,2,3].map(i=>`<i class="${i<(f?2:3)?'filled':''}"></i>`).join('')}</span>`;
const rail=(s,A)=>`<nav class="crb-rail" aria-label="Choose flavor"><span class="crb-rail-label">Flavors</span>${A.map((a,f)=>`<button type="button" data-action="select:${f}" aria-label="Select ${a.name}" aria-pressed="${s.flavor===f}" class="crb-choice ${s.flavor===f?'chosen':''}">${image(a)}<span>${s.flavor===f?'✓':'○'} ${f+1}</span></button>`).join('')}</nav>`;
const hero=(s,A)=>`<div class="crb-hero"><span class="crb-hero-label">Selected flavor</span>${image(A[s.flavor])}<span class="crb-hero-caption">${s.page==='home'?'At the faucet':'For this action'}</span></div>`;
const ratio=s=>`<div class="crb-ratio-adjust">${button('ratio:-1','−','crb-minus')}<strong>1 : ${s.ratio}</strong>${button('ratio:1','+','crb-plus')}</div><div class="crb-ratio-ends"><span>More flavor</span><span>Lighter</span></div>`;
function letterpress(s,A){
 let body='';
 if(s.page==='home')body=`<header><span class="crb-kicker">HOME SODA MACHINE</span><h1>Your drink.</h1></header><div class="crb-status-row"><div><span>Mixing ratio</span><strong>1 : ${s.ratio}</strong></div>${button('page:detail','Adjust ↗')}</div><div class="crb-level"><span>Reservoir</span>${meter(s.flavor)}</div><div class="crb-action-list">${['fill','prime','clean'].map((p,i)=>button('page:'+p,`<span>${['Fill','Prime','Clean'][i]}</span><span>↗</span>`)).join('')}</div>`;
 if(s.page==='detail')body=`${button('page:home','← Back','crb-back')}<h1>Mixing ratio.</h1><p>Concentrate : water</p>${ratio(s)}${button('page:home','Done','crb-main-action')}`;
 if(s.page==='fill')body=`${button('page:home','← Back','crb-back')}<h1>${s.running?'Filling.':'Fill this flavor.'}</h1><p>${s.running?'Drawing in concentrate.':'Pour concentrate into the top funnel.'}</p><div class="crb-action-space"></div>${button(s.running?'stop':'run',s.running?'Stop filling':'Start filling →','crb-main-action')}`;
 if(s.page==='prime')body=`${button('page:home','← Back','crb-back')}<h1>Prime this flavor.</h1><p>Place a glass under the faucet.</p><div class="crb-action-space"></div>${button('hold',s.running?'Priming… release to stop':'Hold to prime','crb-main-action crb-hold')}`;
 if(s.page==='clean')body=`${button('page:home','← Back','crb-back')}<h1>${s.running?'Flushing.':'Clean this flavor.'}</h1><p>${s.running?'Cycle 2 of 3':'Place a pitcher under the faucet.'}</p><div class="crb-cycle-note">${s.running?'<span class="crb-cycle on">1</span><span class="crb-cycle on">2</span><span class="crb-cycle">3</span>':'3 rinse cycles'}</div>${button(s.running?'stop':'run',s.running?'Stop cleaning':'Start cleaning →','crb-main-action')}`;
 return `<section class="cr-letterpress" aria-label="Letterpress enclosure display">${rail(s,A)}${hero(s,A)}<div class="crb-tools ${s.page==='home'?'crb-home':'crb-operation'}">${body}</div></section>`;
}
function console(s,A){
 const active=s.page==='detail'?'home':s.page;
 const tabs=`<nav class="crb-tabs" aria-label="Flavor actions">${['home','fill','prime','clean'].map((p,i)=>button('page:'+p,['Home','Fill','Prime','Clean'][i],p===active?'active':'')).join('')}</nav>`;
 let body='';
 if(s.page==='home')body=`<span class="crb-kicker">READY TO POUR</span><h1>Make it yours.</h1><button type="button" class="crb-ratio-tile" data-action="page:detail"><span>Mixing ratio</span><strong>1<span>:</span>${s.ratio}</strong><span>Adjust ↗</span></button><div class="crb-level"><span>Reservoir</span>${meter(s.flavor)}</div><div class="crb-operation-links">${button('page:fill','Fill →')}${button('page:prime','Prime →')}${button('page:clean','Clean →')}</div>`;
 if(s.page==='detail')body=`<span class="crb-kicker">MIXING RATIO</span><h1>Concentrate : water</h1>${ratio(s)}${button('page:home','Done →','crb-main-action')}`;
 if(s.page==='fill')body=`<span class="crb-kicker">FILL THIS FLAVOR</span><h1>${s.running?'Drawing in<br>concentrate.':'Top it up.'}</h1><p>${s.running?'Filling is running.':'Pour concentrate into the top funnel.'}</p><div class="crb-action-space"></div>${button(s.running?'stop':'run',s.running?'Stop filling':'Start filling →','crb-main-action')}`;
 if(s.page==='prime')body=`<span class="crb-kicker">PRIME THIS FLAVOR</span><h1>Ready the line.</h1><p>Place a glass under the faucet.</p><div class="crb-action-space"></div>${button('hold',s.running?'Priming… release to stop':'Hold to prime','crb-main-action crb-hold')}`;
 if(s.page==='clean')body=`<span class="crb-kicker">CLEAN THIS FLAVOR</span><h1>${s.running?'Flushing.':'Time to rinse.'}</h1><p>${s.running?'Cycle 2 of 3':'Place a pitcher under the faucet.'}</p><div class="crb-cycle-note">${s.running?'<span class="crb-cycle on">1</span><span class="crb-cycle on">2</span><span class="crb-cycle">3</span>':'3 rinse cycles'}</div>${button(s.running?'stop':'run',s.running?'Stop cleaning':'Start cleaning →','crb-main-action')}`;
 return `<section class="cr-console" aria-label="Console enclosure display">${rail(s,A)}${hero(s,A)}<div class="crb-tools">${tabs}<div class="crb-console-content ${s.page==='home'?'crb-home':'crb-operation'}">${body}</div></div></section>`;
}
 globalThis.controlExtras=[{id:'letterpress',name:'Letterpress',tagline:'Warm paper. Big type. A clear list of actions.',render:letterpress},{id:'console',name:'Console',tagline:'Cobalt geometry with a permanent action strip.',render:console}];
})();

(() => {
const b=(action,label,cls='')=>`<button type="button" data-action="${action}" class="${cls}">${label}</button>`;
const level=s=>`<span class="ch-level" aria-label="Reservoir level ${s.flavor?2:3} of 4 segments">${[0,1,2,3].map(i=>`<i class="${i<(s.flavor?2:3)?'filled':''}"></i>`).join('')}</span>`;
function quiet(s){return `<div class="home-quiet"><h1>On tap.</h1><div class="ch-quiet-bottom"><div class="ch-supply-line"><span>Reservoir</span>${level(s)}</div><div class="ch-quiet-options">${b('page:artwork','Change image →')}${b('page:detail','Ratio →')}</div></div></div>`;}
function supply(s){return `<div class="home-supply"><span class="crb-kicker">THIS FLAVOR</span><h1>In the reservoir.</h1><div class="ch-reservoir" aria-label="Reservoir level ${s.flavor?2:3} of 4 segments">${[3,2,1,0].map(i=>`<div class="${i<(s.flavor?2:3)?'filled':''}"></div>`).join('')}</div><div class="ch-supply-options">${b('page:artwork','Change image →')}${b('page:detail','Ratio →')}</div></div>`;}
globalThis.consoleHomeBase=[{id:'quiet',name:'Quiet',tagline:'An image without captions; Settings in the top bar.',home:quiet},{id:'supply',name:'Reservoir',tagline:'One selection label; Settings beneath the flavor choices.',home:supply}];
})();

  const button = (action, label, className = '') => `<button type="button" data-action="${action}" class="${className}">${label}</button>`;
  const meter = s => {

  };

      <div class="chl-rows">

(() => {

 const A=s.assignments.map(i=>globalThis.homeArtwork[i]);
 const basePage=['home','detail','fill','prime','clean'].includes(s.page)?s.page:'detail';
 const holder=document.createElement('div');holder.innerHTML=base.render({...s,page:basePage},A);
 const device=holder.querySelector('.cr-console');device.classList.add('ch-'+v.id);
 const content=holder.querySelector('.crb-console-content');
 if(s.page==='home')content.innerHTML=`<div class="home-${v.id}">${v.home(s,A)}</div>`;
 if(s.page==='artwork')content.innerHTML=gallery();
 if(s.page==='settings')content.innerHTML=settings();
 if(s.page==='service')content.innerHTML=service();
 if(s.page==='addimage')content.innerHTML=addImage();
 const label=holder.querySelector('.crb-hero-label');
 const caption=holder.querySelector('.crb-hero-caption');
 if(v.id==='quiet'){label.textContent='';caption.textContent='';}
 if(v.id==='supply'){label.textContent='Selected';caption.textContent='';}
 if(v.id==='simple-list'){label.textContent='Your drink';caption.textContent='';}
 if(v.id==='small-footer'){label.textContent='';caption.textContent='✓ Selected';}
 if(v.id==='quiet')holder.querySelector('.crb-tabs').insertAdjacentHTML('beforeend',`<button type="button" class="ch-top-settings ${['settings','service'].includes(s.page)?'active':''}" data-action="page:settings" aria-label="Settings">⚙</button>`);
 if(v.id==='supply')holder.querySelector('.crb-rail').insertAdjacentHTML('beforeend',button('page:settings','Settings','ch-rail-settings'));
 if(['settings','service'].includes(s.page))holder.querySelectorAll('.crb-tabs button:not(.ch-top-settings)').forEach(b=>b.classList.remove('active'));
 canvas.innerHTML=holder.innerHTML;
 canvas.querySelectorAll('[data-action]').forEach(el=>{if(s.running&&!['stop','hold'].includes(el.dataset.action)){el.setAttribute('aria-disabled','true');el.style.cursor='default';}});
 direction.value=v.id;pagePicker.value=[...pagePicker.options].some(o=>o.value===s.page)?s.page:(s.page==='addimage'?'artwork':'settings');
 root.querySelector('#home-title').textContent=v.name;
 const captions={quiet:'No middle captions · persistent Settings',supply:'One middle label · persistent Settings','simple-list':'“Your drink” · Home-only Settings','small-footer':'One lower label · Home-only Settings'};
 root.querySelector('#home-caption').textContent=captions[v.id];
 const faucet=root.querySelector('#home-faucet-image');faucet.src=A[s.flavor].url;faucet.alt=A[s.flavor].name+' on the faucet';
 root.querySelector('.home-faucet').style.display=options.showFaucet?'':'none';
 root.querySelector('.home-pair').style.gridTemplateColumns=options.showFaucet?'':'minmax(0,1fr)';
 root.querySelector('#home-live').textContent=`${v.name}. ${s.page}. ${A[s.flavor].name} selected.`;
 fit();
}
function act(action){
 const[k,v]=action.split(':');if(s.running&&!['stop','hold'].includes(k))return;
 if(k==='select')s.flavor=Number(v);
 if(k==='page'){s.page=v;s.running=false;}
 if(k==='ratio')s.ratios[s.flavor]=Math.max(6,Math.min(24,s.ratio+Number(v)));
 if(k==='assign')s.assignments[s.flavor]=Number(v);
 if(k==='run')s.running=true;
 if(k==='stop')s.running=false;
 render();
}
function stopPrime(){if(s.page==='prime'&&s.running){s.running=false;render();}}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&b.dataset.action!=='hold')act(b.dataset.action);});
root.addEventListener('pointerdown',e=>{if(e.target.closest('[data-action="hold"]')){e.preventDefault();s.running=true;render();}});
globalThis.addEventListener('pointerup',stopPrime);globalThis.addEventListener('pointercancel',stopPrime);
root.addEventListener('pointermove',e=>{if(s.page==='prime'&&s.running){const pad=root.querySelector('[data-action="hold"]');if(pad){const b=pad.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)stopPrime();}}});
root.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.matches('[data-action="hold"]')){e.preventDefault();s.running=true;e.target.textContent='Release to stop';}});
root.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stopPrime();});
direction.addEventListener('change',()=>{s.variant=direction.value;s.running=false;render();});
pagePicker.addEventListener('change',()=>{s.page=pagePicker.value;s.running=false;render();});
root.querySelector('#home-faucet-button').addEventListener('click',()=>act('select:'+(1-s.flavor)));
new ResizeObserver(fit).observe(canvas.parentElement);render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(options,'showFaucet',{label:'Faucet preview'});}
globalThis.homeStudy={state:s,render,act,variants};
})();
</script>
