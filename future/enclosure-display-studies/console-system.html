(() => {
const button=(action,label,cls='')=>`<button type="button" data-action="${action}" class="${cls}">${label}</button>`;
const image=a=>`<img src="${a.url}" alt="${a.name}">`;
const meter=f=>`<span class="crb-meter" aria-label="Reservoir level: ${f?2:3} of 4 segments">${[0,1,2,3].map(i=>`<i class="${i<(f?2:3)?'filled':''}"></i>`).join('')}</span>`;
const rail=(s,A)=>`<nav class="crb-rail" aria-label="Choose flavor"><span class="crb-rail-label">Flavors</span>${A.map((a,f)=>`<button type="button" data-action="select:${f}" aria-label="Select ${a.name}" aria-pressed="${s.flavor===f}" class="crb-choice ${s.flavor===f?'chosen':''}">${image(a)}<span>${s.flavor===f?'✓':'○'} ${f+1}</span></button>`).join('')}</nav>`;
const hero=(s,A)=>`<div class="crb-hero"><span class="crb-hero-label">Selected flavor</span>${image(A[s.flavor])}<span class="crb-hero-caption">${s.page==='home'?'At the faucet':'For this action'}</span></div>`;
const ratio=s=>`<div class="crb-ratio-adjust">${button('ratio:-1','−','crb-minus')}<strong>1 : ${s.ratio}</strong>${button('ratio:1','+','crb-plus')}</div><div class="crb-ratio-ends"><span>More flavor</span><span>Lighter</span></div>`;
function letterpress(s,A){
 let body='';
 if(s.page==='home')body=`<header><span class="crb-kicker">HOME SODA MACHINE</span><h1>Your drink.</h1></header><div class="crb-status-row"><div><span>Mixing ratio</span><strong>1 : ${s.ratio}</strong></div>${button('page:detail','Adjust ↗')}</div><div class="crb-level"><span>Reservoir</span>${meter(s.flavor)}</div><div class="crb-action-list">${['fill','prime','clean'].map((p,i)=>button('page:'+p,`<span>${['Fill','Prime','Clean'][i]}</span><span>↗</span>`)).join('')}</div>`;
 if(s.page==='detail')body=`${button('page:home','← Back','crb-back')}<h1>Mixing ratio.</h1><p>Concentrate : water</p>${ratio(s)}${button('page:home','Done','crb-main-action')}`;
 if(s.page==='fill')body=`${button('page:home','← Back','crb-back')}<h1>${s.running?'Filling.':'Fill this flavor.'}</h1><p>${s.running?'Drawing in concentrate.':'Pour concentrate into the top funnel.'}</p><div class="crb-action-space"></div>${button(s.running?'stop':'run',s.running?'Stop filling':'Start filling →','crb-main-action')}`;
 if(s.page==='prime')body=`${button('page:home','← Back','crb-back')}<h1>Prime this flavor.</h1><p>Place a glass under the faucet.</p><div class="crb-action-space"></div>${button('hold',s.running?'Priming… release to stop':'Hold to prime','crb-main-action crb-hold')}`;
 if(s.page==='clean')body=`${button('page:home','← Back','crb-back')}<h1>${s.running?'Flushing.':'Clean this flavor.'}</h1><p>${s.running?'Cycle 2 of 3':'Place a pitcher under the faucet.'}</p><div class="crb-cycle-note">${s.running?'<span class="crb-cycle on">1</span><span class="crb-cycle on">2</span><span class="crb-cycle">3</span>':'3 rinse cycles'}</div>${button(s.running?'stop':'run',s.running?'Stop cleaning':'Start cleaning →','crb-main-action')}`;
 return `<section class="cr-letterpress" aria-label="Letterpress enclosure display">${rail(s,A)}${hero(s,A)}<div class="crb-tools ${s.page==='home'?'crb-home':'crb-operation'}">${body}</div></section>`;
}
function console(s,A){
 const active=s.page==='detail'?'home':s.page;
 const tabs=`<nav class="crb-tabs" aria-label="Flavor actions">${['home','fill','prime','clean'].map((p,i)=>button('page:'+p,['Home','Fill','Prime','Clean'][i],p===active?'active':'')).join('')}</nav>`;
 let body='';
 if(s.page==='home')body=`<span class="crb-kicker">READY TO POUR</span><h1>Make it yours.</h1><button type="button" class="crb-ratio-tile" data-action="page:detail"><span>Mixing ratio</span><strong>1<span>:</span>${s.ratio}</strong><span>Adjust ↗</span></button><div class="crb-level"><span>Reservoir</span>${meter(s.flavor)}</div><div class="crb-operation-links">${button('page:fill','Fill →')}${button('page:prime','Prime →')}${button('page:clean','Clean →')}</div>`;
 if(s.page==='detail')body=`<span class="crb-kicker">MIXING RATIO</span><h1>Concentrate : water</h1>${ratio(s)}${button('page:home','Done →','crb-main-action')}`;
 if(s.page==='fill')body=`<span class="crb-kicker">FILL THIS FLAVOR</span><h1>${s.running?'Drawing in<br>concentrate.':'Top it up.'}</h1><p>${s.running?'Filling is running.':'Pour concentrate into the top funnel.'}</p><div class="crb-action-space"></div>${button(s.running?'stop':'run',s.running?'Stop filling':'Start filling →','crb-main-action')}`;
 if(s.page==='prime')body=`<span class="crb-kicker">PRIME THIS FLAVOR</span><h1>Ready the line.</h1><p>Place a glass under the faucet.</p><div class="crb-action-space"></div>${button('hold',s.running?'Priming… release to stop':'Hold to prime','crb-main-action crb-hold')}`;
 if(s.page==='clean')body=`<span class="crb-kicker">CLEAN THIS FLAVOR</span><h1>${s.running?'Flushing.':'Time to rinse.'}</h1><p>${s.running?'Cycle 2 of 3':'Place a pitcher under the faucet.'}</p><div class="crb-cycle-note">${s.running?'<span class="crb-cycle on">1</span><span class="crb-cycle on">2</span><span class="crb-cycle">3</span>':'3 rinse cycles'}</div>${button(s.running?'stop':'run',s.running?'Stop cleaning':'Start cleaning →','crb-main-action')}`;
 return `<section class="cr-console" aria-label="Console enclosure display">${rail(s,A)}${hero(s,A)}<div class="crb-tools">${tabs}<div class="crb-console-content ${s.page==='home'?'crb-home':'crb-operation'}">${body}</div></div></section>`;
}
 globalThis.controlExtras=[{id:'letterpress',name:'Letterpress',tagline:'Warm paper. Big type. A clear list of actions.',render:letterpress},{id:'console',name:'Console',tagline:'Cobalt geometry with a permanent action strip.',render:console}];
})();

(() => {
const b=(action,label,cls='')=>`<button type="button" data-action="${action}" class="${cls}">${label}</button>`;
const level=s=>`<span class="ch-level" aria-label="Reservoir level ${s.flavor?2:3} of 4 segments">${[0,1,2,3].map(i=>`<i class="${i<(s.flavor?2:3)?'filled':''}"></i>`).join('')}</span>`;
function quiet(s){return `<div class="home-quiet"><h1>On tap.</h1><div class="ch-quiet-bottom"><div class="ch-supply-line"><span>Reservoir</span>${level(s)}</div><div class="ch-quiet-options">${b('page:artwork','Change image →')}${b('page:detail','Ratio →')}</div></div></div>`;}
function supply(s){return `<div class="home-supply"><span class="crb-kicker">THIS FLAVOR</span><h1>In the reservoir.</h1><div class="ch-reservoir" aria-label="Reservoir level ${s.flavor?2:3} of 4 segments">${[3,2,1,0].map(i=>`<div class="${i<(s.flavor?2:3)?'filled':''}"></div>`).join('')}</div><div class="ch-supply-options">${b('page:artwork','Change image →')}${b('page:detail','Ratio →')}</div></div>`;}
globalThis.consoleHomeBase=[{id:'quiet',name:'Quiet',tagline:'An image without captions; Settings in the top bar.',home:quiet},{id:'supply',name:'Reservoir',tagline:'One selection label; Settings beneath the flavor choices.',home:supply}];
})();

(() => {
 const width=436;
 const scale=(width-4)/462;
 const height=4+361*scale;
 const stations=[297.5,252.5,207.5,162.5];
 const sensors=[...stations.map(y=>[449,y]),...stations.map(y=>[180,y]),[379.25,255.9],[379.25,227.7]];
 const samples={'Snapshot A':(1<<2)|(1<<5)|(1<<8),'Snapshot B':(1<<0)|(1<<7)|(1<<8)|(1<<9),'No reading':0};
 function status(s,options,button){
  const mask=samples[options.statusSample];
  const circles=sensors.map(([x,y],i)=>`<circle class="cs-sensor ${mask&(1<<i)?'on':''}" cx="${x}" cy="${y}" r="${7/scale}"/>`).join('');
  return `<div class="cs-status"><div class="cs-drawing"><svg class="cs-diagram" viewBox="0 0 ${width} ${height}" role="img" aria-label="Enclosure viewed along X, front to the left, with ten sensor indicators"><g transform="translate(2 2) scale(${scale})"><path class="cs-shell" d="M0 361 L0 61.87 L61.87 0 L462 0 L462 361 Z"/><rect class="cs-inner" x="173" y="101.6" width="283" height="253.4" rx="${4/scale}"/><rect class="cs-inner" x="251" y="170.6" width="127" height="152.4" rx="${10/scale}"/><rect class="cs-inner" x="183" y="141.6" width="53" height="211.4" rx="${6/scale}"/><rect class="cs-inner" x="393" y="141.6" width="53" height="211.4" rx="${6/scale}"/>${circles}</g></svg><div class="cs-status-note" aria-live="polite">${options.statusSample==='No reading'?'Not reading the sensors':''}</div></div><div class="cs-status-links">${button('page:service','Pump service →')}</div></div>`;
 }
 function service(s,options,button){
  return `<div class="cs-service"><h1>${s.running?'Drying the lines.':'Dry the lines.'}</h1><p>${s.running?'1 of 4 · Air in':'Before pulling the pump cartridge, set a container under the faucet and dry the lines.'}</p><div class="cs-service-actions">${button('page:settings','← Settings','cs-back')}${button(s.running?'stop':'run',s.running?'Stop drying':'Dry the lines →','crb-main-action')}</div></div>`;
 }
 globalThis.systemPages={status,service};
})();

(() => {
const root=document.getElementById('console-system-studies');
const canvas=root.querySelector('#corners-screen');
const pagePicker=root.querySelector('#corners-page');
const v={id:'corners',name:'Console'};
const base=globalThis.controlExtras.find(d=>d.id==='console');
const quiet=globalThis.consoleHomeBase.find(d=>d.id==='quiet');
const s={page:'fill',flavor:0,ratio:20,ratios:[20,20],assignments:[0,2],running:false,imagePage:0};
const options={showFaucet:true,completionLabel:'Done',statusSample:'Snapshot A'};
const button=(a,t,c='')=>`<button type="button" data-action="${a}" class="${c}">${t}</button>`;
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
function gallery(){
 const start=s.imagePage*4;
 return `<div class="ch-gallery"><h1>Choose an image.</h1><p>For the selected flavor</p><div class="ch-art-grid">${globalThis.cornersArtwork.slice(start,start+4).map((a,j)=>{const i=start+j;return `<button type="button" data-action="assign:${i}" aria-pressed="${s.assignments[s.flavor]===i}" aria-label="Select ${a.name}" class="${s.assignments[s.flavor]===i?'chosen':''}"><img src="${a.url}" alt="${a.name}"><span>${s.assignments[s.flavor]===i?'✓':' '}</span></button>`;}).join('')}</div><div class="cn-pager"><button type="button" data-action="images:-1" aria-label="Previous four images" ${s.imagePage===0?'disabled':''}>${icon('chevron-left')}</button><span class="cn-image-position" aria-live="polite"><small>${s.imagePage===0?'Your images':'Defaults'}</small><span>${start+1}–${start+4} of 8</span></span><button type="button" data-action="images:1" aria-label="Next four images" ${s.imagePage===1?'disabled':''}>${icon('chevron-right')}</button></div></div>`;
}
function fit(){canvas.style.transform=`scale(${canvas.parentElement.clientWidth/800})`;}
function operationLocked(){return s.running&&['fill','clean'].includes(s.page);}
function availableWhileRunning(action){const kind=action.split(':')[0];return operationLocked()?kind==='stop':['stop','hold','done','select'].includes(kind);}
function goHome(flavor=s.flavor){s.running=false;s.flavor=flavor;s.page='idle';}
function render(){
 s.ratio=s.ratios[s.flavor];
 const A=s.assignments.map(i=>globalThis.cornersArtwork[i]);
 const basePage=s.page==='idle'?'home':(['detail','fill','prime','clean'].includes(s.page)?s.page:'detail');
 const holder=document.createElement('div');holder.innerHTML=base.render({...s,page:basePage},A);
 const device=holder.querySelector('.cr-console');device.classList.add('cn-corners');if(s.page==='idle')device.classList.add('cn-idle');if(operationLocked())device.classList.add('cn-locked');
 const content=holder.querySelector('.crb-console-content');
 if(s.page==='idle')content.innerHTML=quiet.home(s,A);
 if(s.page==='artwork')content.innerHTML=gallery();
 if(s.page==='settings')content.innerHTML=globalThis.systemPages.status(s,options,button);
 if(s.page==='service')content.innerHTML=globalThis.systemPages.service(s,options,button);
 holder.querySelector('.crb-hero-label').textContent='';
 holder.querySelector('.crb-hero-caption').textContent='✓ Selected';
 const nav=holder.querySelector('.crb-tabs');
 nav.innerHTML=['fill','prime','clean'].map(p=>button('page:'+p,p[0].toUpperCase()+p.slice(1),s.page===p?'active':'')).join('')+(s.page==='idle'||operationLocked()?'<span aria-hidden="true"></span>':button('done',options.completionLabel,'cn-finish'));
 holder.querySelector('.crb-rail-label').remove();
 holder.querySelector('.crb-rail').insertAdjacentHTML('beforeend',`<button type="button" class="cn-settings ${['settings','service'].includes(s.page)?'active':''}" data-action="page:settings" aria-label="Settings">${icon('settings')}</button>`);
 if(s.page==='detail')content.querySelector('[data-action="page:home"]').remove();
 if(['settings','service'].includes(s.page)){
  device.classList.add('cn-system');
  holder.querySelector('.crb-hero').remove();
  nav.setAttribute('aria-label','Machine settings');
  nav.innerHTML=`<span class="cs-title">${s.page==='settings'?'System status':'Pump service'}</span>`+button('done',options.completionLabel,'cn-finish');
 }

 const hero=holder.querySelector('.crb-hero');
 if(hero){
  const background=document.createElement('button');
  background.type='button';background.className=hero.className;
  background.dataset.action='done';background.setAttribute('aria-label','Return to On tap');
  background.innerHTML=hero.innerHTML;hero.replaceWith(background);
 }
 canvas.innerHTML=holder.innerHTML;
 if(s.running)canvas.querySelectorAll('[data-action]').forEach(el=>{if(!availableWhileRunning(el.dataset.action)){el.disabled=true;}});
 if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:24,height:24}});
 pagePicker.value=s.page;
 const faucet=root.querySelector('#corners-faucet-image');faucet.src=A[s.flavor].url;faucet.alt=A[s.flavor].name+' on the faucet';
 root.querySelector('.corners-faucet').style.display=options.showFaucet?'':'none';
 root.querySelector('.corners-pair').style.gridTemplateColumns=options.showFaucet?'':'minmax(0,1fr)';
 root.querySelector('#corners-faucet-button').disabled=s.running;
 root.querySelector('#corners-live').textContent=`${v.name}. ${s.page}. ${A[s.flavor].name} selected.`;
 fit();
}
function act(action){
 const[k,v]=action.split(':');if(s.running&&!availableWhileRunning(action))return;
 if(k==='select')goHome(Number(v));
 if(k==='faucet'){if(['settings','service'].includes(s.page))s.flavor=1-s.flavor;else goHome(1-s.flavor);}
 if(k==='page'){s.page=v;if(v==='artwork')s.imagePage=0;}
 if(k==='done')goHome();
 if(k==='ratio')s.ratios[s.flavor]=Math.max(6,Math.min(24,s.ratio+Number(v)));
 if(k==='assign')s.assignments[s.flavor]=Number(v);
 if(k==='images')s.imagePage=Math.max(0,Math.min(1,s.imagePage+Number(v)));
 if(k==='run')s.running=true;
 if(k==='stop')s.running=false;
 render();
}
function stopPrime(){if(s.page==='prime'&&s.running){s.running=false;render();}}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){if(!b.disabled&&b.dataset.action!=='hold')act(b.dataset.action);return;}if(e.target.closest('.crb-rail'))act('done');});
root.addEventListener('pointerdown',e=>{if(e.target.closest('[data-action="hold"]')){e.preventDefault();s.running=true;render();}});
root.addEventListener('pointerleave',stopPrime);
document.documentElement.addEventListener('mouseleave',stopPrime);
document.addEventListener('mouseout',e=>{if(e.relatedTarget===null)stopPrime();});
globalThis.addEventListener('pointerup',stopPrime);globalThis.addEventListener('pointercancel',stopPrime);globalThis.addEventListener('blur',stopPrime);
root.addEventListener('pointermove',e=>{if(s.page==='prime'&&s.running){const pad=root.querySelector('[data-action="hold"]');if(pad){const b=pad.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)stopPrime();}}});
root.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.matches('[data-action="hold"]')){e.preventDefault();s.running=true;e.target.textContent='Release to stop';canvas.querySelectorAll('[data-action]').forEach(el=>{if(!availableWhileRunning(el.dataset.action))el.disabled=true;});}});
root.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stopPrime();});
pagePicker.addEventListener('change',()=>{s.page=pagePicker.value;s.running=false;s.imagePage=0;render();});
root.querySelector('#corners-faucet-button').addEventListener('click',()=>act('faucet'));
new ResizeObserver(fit).observe(canvas.parentElement);render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(options,'statusSample',{label:'Sensor snapshot',options:['Snapshot A','Snapshot B','No reading']});tweak.addToggle(options,'showFaucet',{label:'Faucet preview'});tweak.addSelect(options,'completionLabel',{label:'Completion label',options:['Done','Close']});}
globalThis.systemStudy={state:s,render,act,options};
})();
</script>
