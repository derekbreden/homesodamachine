 const board=root.querySelector('#bb-logo-board');
 const heading=root.querySelector('#bb-logo-name');
 const options=root.querySelector('.bb-options');
 const sizes=root.querySelector('.bb-sizes');
 function icon(c,size){
  const holder=document.createElement('div');holder.className='bb-icon';
  const [x,y,side]=c.crop;
  holder.style.setProperty('--image-width',(1536/side*100)+'%');
  holder.style.setProperty('--image-left',(-x/side*100)+'%');
  holder.style.setProperty('--image-top',(-y/side*100)+'%');
  if(size)holder.style.setProperty('--icon-size',size+'px');
  const img=document.createElement('img');img.src=c.src;img.alt=c.title+' app icon';
  holder.append(img);return holder;
 }
 function select(c){
  board.src=c.src;board.alt=c.title+': app icon, standalone logo, wordmark and single-color study';
  heading.textContent=c.n+' · '+c.title;
  root.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.concept===c.n)));
  sizes.replaceChildren();
  [64,48,32,16].forEach(size=>{
   const f=document.createElement('figure');const label=document.createElement('figcaption');
   label.className='text-small text-muted';label.textContent=size+' px';
   f.append(icon(c,size),label);sizes.append(f);
  });
 }
 concepts.forEach(c=>{
  const f=document.createElement('figure');
  const b=document.createElement('button');b.type='button';b.className='btn';b.dataset.concept=c.n;
  b.textContent=c.n+' · '+c.title;b.setAttribute('aria-pressed','false');
  b.setAttribute('aria-controls','bb-logo-board');b.addEventListener('click',()=>select(c));
  const preview=icon(c);preview.addEventListener('click',()=>select(c));
  f.append(preview,b);options.append(f);
 });
 select(concepts[0]);
})();
