 const board=root.querySelector('#gf-logo-board');
 const heading=root.querySelector('#gf-logo-name');
 const sizes=root.querySelector('.gf-sizes');
 function icon(concept,size){
  const holder=document.createElement('div');
  holder.className='gf-icon';
  const [x,y,side]=concept.crop;
  holder.style.setProperty('--image-width',(1536/side*100)+'%');
  holder.style.setProperty('--image-left',(-x/side*100)+'%');
  holder.style.setProperty('--image-top',(-y/side*100)+'%');
  if(size)holder.style.setProperty('--icon-size',size+'px');
  const img=document.createElement('img');
  img.src=concept.src;
  img.alt=concept.title+' app icon';
  holder.append(img);
  return holder;
 }
 function select(concept){
  board.src=concept.src;
  board.alt=concept.title+': app icon, standalone logo, wordmark and single-color study';
  heading.textContent=concept.n+' · '+concept.title;
  root.querySelectorAll('[data-concept]').forEach(button=>{
   button.setAttribute('aria-pressed',String(button.dataset.concept===concept.n));
  });
  sizes.replaceChildren();
  [64,32,16].forEach(size=>{
   const figure=document.createElement('figure');
   const label=document.createElement('figcaption');
   label.className='text-small text-muted';
   label.textContent=size+' px';
   figure.append(icon(concept,size),label);
   sizes.append(figure);
  });
 }
 ['glass','faucet'].forEach(family=>{
  const options=root.querySelector('[data-family="'+family+'"]');
  const original=concepts.find(concept=>concept.family===family&&concept.n.endsWith('0'));
  const originalButton=root.querySelector('[data-original="'+family+'"]');
  if(original){
   originalButton.dataset.concept=original.n;
   originalButton.setAttribute('aria-label','Original '+family+' logo');
   originalButton.addEventListener('click',()=>select(original));
  }else{
   originalButton.hidden=true;
  }
  concepts.filter(concept=>concept.family===family&&!concept.n.endsWith('0')).forEach(concept=>{
   const figure=document.createElement('figure');
   const button=document.createElement('button');
   button.type='button';
   button.className='btn viz-tile';
   button.dataset.concept=concept.n;
   button.textContent=concept.n+' · '+concept.title;
   button.setAttribute('aria-pressed','false');
   button.setAttribute('aria-controls','gf-logo-board');
   button.addEventListener('click',()=>select(concept));
   figure.append(icon(concept),button);
   options.append(figure);
  });
 });
 const initial=concepts.find(concept=>concept.n==='G1')||concepts.find(concept=>!concept.n.endsWith('0'))||concepts[0];
 if(initial)select(initial);
})();
