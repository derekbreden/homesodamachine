<svg xmlns="http://www.w3.org/2000/svg" width="900" height="735" viewBox="0 0 900 735" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="900" height="735" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="bold">C  hexapod with its pivot set at the dot: side view (looking from outside the tube)</text><text x="10" y="694" font-size="12" fill="#111">Six identical NEMA17 lead-screw legs between a base ring (on a manually set arm) and a platform on the shell's outboard face.</text><text x="10" y="709" font-size="12" fill="#111">The pivot is a number: rotations are commanded about the dot, the grip axis, the hole axis, or anything else.</text><text x="10" y="724" font-size="12" fill="#111">Workspace is small (tens of mm, ~+/-10 deg): coarse placement stays manual; the hexapod is the fine, fully actuated last stage.</text><polygon points="0.0,667.0 683.8,667.0 683.8,658.2 0.0,658.2" fill="#caa472" fill-opacity="1.0" stroke="#7a5a2a" stroke-width="1"/><polygon points="70.1,658.2 333.2,658.2 333.2,626.7 70.1,626.7" fill="#e8d9b5" fill-opacity="1.0" stroke="#865" stroke-width="1"/><polygon points="172.3,582.9 283.6,582.9 283.6,449.3 172.3,449.3" fill="#eee" fill-opacity="1.0" stroke="#555" stroke-width="1"/><line x1="172.3" y1="454.8" x2="283.6" y2="454.8" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/><polygon points="233.9,444.2 234.2,444.9 234.9,445.5 235.8,446.0 236.5,446.2 237.0,446.0 252.2,435.0 290.9,388.8 299.4,377.5 299.7,374.8 297.7,371.1 293.9,367.4 289.3,364.7 285.2,363.8 282.6,364.8 274.1,376.1 240.3,426.0 233.9,443.7" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="276.3,356.9 281.0,375.2 305.7,385.4 369.2,301.2 364.5,282.9 339.7,272.7" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="325.1,328.3 326.0,347.4 330.1,363.5 434.7,350.2 433.8,331.1 429.7,315.0" fill="#7f9fc4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><circle cx="227.9" cy="454.8" r="4" fill="#d00"/><line x1="269.2" y1="333.4" x2="371.0" y2="307.1" stroke="#963" stroke-width="6"/><line x1="176.6" y1="185.3" x2="380.3" y2="132.7" stroke="#555" stroke-width="8"/><line x1="269.2" y1="333.4" x2="244.5" y2="167.7" stroke="#2a6" stroke-width="3"/><line x1="320.1" y1="320.2" x2="312.4" y2="150.2" stroke="#2a6" stroke-width="3"/><line x1="371.0" y1="307.1" x2="380.3" y2="132.7" stroke="#2a6" stroke-width="3"/><line x1="269.2" y1="333.4" x2="244.5" y2="167.7" stroke="#2a6" stroke-width="3"/><line x1="320.1" y1="320.2" x2="312.4" y2="150.2" stroke="#2a6" stroke-width="3"/><line x1="371.0" y1="307.1" x2="380.3" y2="132.7" stroke="#2a6" stroke-width="3"/><text x="389.1" y="132.7" font-size="10" text-anchor="start" fill="#111">base ring on a manually set, lockable arm/column</text><text x="381.5" y="315.9" font-size="10" text-anchor="start" fill="#963">platform = kinematic seat on the shell</text><line x1="227.9" y1="454.8" x2="227.9" y2="191.8" stroke="#b00" stroke-width="1" stroke-dasharray="2,4"/><text x="233.2" y="200.6" font-size="10" text-anchor="start" fill="#b00">software pivot (dot)</text></svg>
