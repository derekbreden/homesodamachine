<svg xmlns="http://www.w3.org/2000/svg" width="820" height="587" viewBox="0 0 820 587" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="820" height="587" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="bold">D-s  sense, don't carry: a light stylus on the lip's outside, at the dot's own angle (section)</text><text x="10" y="546" font-size="12" fill="#111">Ceramic ball or wheel, 0.5-1 N spring, 9 mm below the joint level on the tube OD, radially in line with the dot.</text><text x="10" y="561" font-size="12" fill="#111">It reads the wall's radial position where the bead is being laid - runout, ovality and bulk thermal growth - during the weld,</text><text x="10" y="576" font-size="12" fill="#111">when the camera cannot see the red dot. The reading drives X (tube stage in A, gun stage in B). Its stand is on whatever carries the gun.</text><polygon points="382.7,498.7 387.2,498.7 387.2,317.3 382.7,317.3" fill="#bbb" fill-opacity="1.0" stroke="#444" stroke-width="1"/><polygon points="54.7,352.0 382.0,352.0 382.0,334.7 54.7,334.7" fill="#ccc" fill-opacity="1.0" stroke="#444" stroke-width="1"/><text x="68.3" y="345.6" font-size="10" text-anchor="start" fill="#111">endcap plate (6.35 mm, recessed)</text><text x="390.9" y="310.1" font-size="9" text-anchor="start" fill="#111">lip</text><polygon points="187.4,85.7 191.3,94.0 213.6,129.0 316.4,273.0 358.2,307.2 360.1,307.8 362.8,307.2 365.5,305.6 367.5,303.5 368.2,301.4 355.1,250.4 352.4,244.5 264.4,88.8 242.1,53.8 231.4,50.9 216.8,54.1 202.2,62.6 191.4,74.2" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="-7.0,-176.3 160.2,86.4 201.2,118.3 273.2,61.4 106.0,-201.3 64.9,-233.2" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="122.1,-9.7 169.8,50.0 233.4,-0.2 267.3,-41.6 219.5,-101.4 156.0,-51.2" fill="#7f9fc4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><circle cx="382.7" cy="334.7" r="4" fill="#d00"/><text x="300.7" y="312.8" font-size="10" text-anchor="start" fill="#b00">dot</text><circle cx="394.0" cy="359.3" r="6.8" fill="#eee" stroke="#222" stroke-width="1.5"/><line x1="400.8" y1="359.3" x2="574.0" y2="359.3" stroke="#555" stroke-width="3"/><polygon points="574.0,386.6 738.0,386.6 738.0,331.9 574.0,331.9" fill="#c9d6c9" fill-opacity="1.0" stroke="#353" stroke-width="1"/><text x="579.5" y="321.0" font-size="10" text-anchor="start" fill="#111">slide + scale</text><text x="579.5" y="419.4" font-size="9" text-anchor="start" fill="#111">(caliper beam or AS5048 lever)</text><line x1="656.0" y1="386.6" x2="656.0" y2="498.7" stroke="#555" stroke-width="4"/><text x="666.9" y="485.0" font-size="9" text-anchor="start" fill="#111">stand on the gun's frame</text><line x1="464.7" y1="280.0" x2="404.5" y2="353.8" stroke="#888" stroke-width="1"/><text x="470.1" y="274.5" font-size="10" text-anchor="start" fill="#111">0.5-1 N, insulating tip</text><rect x="0" y="0" width="820" height="34" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="bold">D-s  sense, don't carry: a light stylus on the lip's outside, at the dot's own angle (section)</text></svg>
