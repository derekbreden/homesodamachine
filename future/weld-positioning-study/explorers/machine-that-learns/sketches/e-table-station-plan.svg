<svg xmlns="http://www.w3.org/2000/svg" width="900" height="855" viewBox="0 0 900 855" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="900" height="855" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="bold">E  table-opening station: plan (bench long axis along Y; operator at the front, -X)</text><text x="10" y="814" font-size="12" fill="#111">Gantry after workspace-as-structure: Y rails either side of the opening, X beam at y ~ -190 under the gun body, on a drop-in collar.</text><text x="10" y="829" font-size="12" fill="#111">Added here: stylus at the dot's angle (+X gap), joint camera on the collar (+Y, inboard), two PTZ cameras (front across the bore; +Y end),</text><text x="10" y="844" font-size="12" fill="#111">fiducial tags on the collar so every PTZ frame is registered to the collar; cable clamped to the X carriage, then a >=350 mm saddle at the -Y end.</text><polygon points="350.0,789.0 700.0,789.0 700.0,39.0 350.0,39.0" fill="#e8d2a8" fill-opacity="1.0" stroke="#a07a40" stroke-width="1"/><text x="355.0" y="49.0" font-size="10" text-anchor="start" fill="#111">bench top (wood); front edge at -X</text><polygon points="344.1,674.0 594.1,674.0 594.1,314.0 344.1,314.0" fill="#dfe3e8" fill-opacity="1.0" stroke="#556" stroke-width="1"/><text x="346.6" y="321.5" font-size="10" text-anchor="start" fill="#111">drop-in collar (workspace-as-structure)</text><circle cx="469.1" cy="444.0" r="40.0" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="469.1" cy="444.0" r="31.8" fill="none" stroke="#555" stroke-width="2"/><text x="454.1" y="491.5" font-size="9" text-anchor="start" fill="#111">opening D160</text><polygon points="363.6,664.0 369.6,664.0 369.6,324.0 363.6,324.0" fill="#9aa" fill-opacity="1.0" stroke="#344" stroke-width="1"/><polygon points="568.6,664.0 574.6,664.0 574.6,324.0 568.6,324.0" fill="#9aa" fill-opacity="1.0" stroke="#344" stroke-width="1"/><text x="575.1" y="344.0" font-size="10" text-anchor="start" fill="#111">Y rail</text><polygon points="361.6,544.0 576.6,544.0 576.6,534.0 361.6,534.0" fill="#8a9" fill-opacity="1.0" stroke="#243" stroke-width="1"/><text x="346.6" y="569.0" font-size="10" text-anchor="start" fill="#111">X beam (gantry), rides the Y rails</text><polygon points="440.0,551.5 480.0,551.5 480.0,526.5 440.0,526.5" fill="#b8d8a0" fill-opacity="1.0" stroke="#361" stroke-width="1"/><text x="482.5" y="569.0" font-size="9" text-anchor="start" fill="#111">X carriage + roll/tilt head</text><polygon points="464.3,478.3 465.0,480.9 466.9,483.3 469.6,484.7 472.3,484.9 474.3,483.8 478.3,478.9 494.4,457.2 497.2,449.0 497.4,448.6 497.2,448.1 496.9,447.7 496.4,447.4 495.9,447.4 489.3,450.9 487.9,451.7 469.1,471.3 465.0,476.1" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="428.7,510.5 436.2,524.5 449.4,521.9 480.0,485.6 472.5,471.6 459.3,474.2" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="452.3,501.8 458.5,561.4 467.3,561.9 478.9,559.5 472.7,499.9 463.9,499.4" fill="#7f9fc4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><circle cx="500.0" cy="444.0" r="4" fill="#d00"/><circle cx="503.0" cy="444.0" r="1.5" fill="#fff" stroke="#000" stroke-width="1"/><line x1="504.5" y1="444.0" x2="530.0" y2="444.0" stroke="#333" stroke-width="2"/><polygon points="530.0,450.0 560.0,450.0 560.0,438.0 530.0,438.0" fill="#c9d6c9" fill-opacity="1.0" stroke="#353" stroke-width="1"/><text x="562.5" y="446.0" font-size="10" text-anchor="start" fill="#111">stylus + scale</text><polygon points="470.5,414.0 484.5,414.0 484.5,404.0 470.5,404.0" fill="#333" fill-opacity="1.0" stroke="#000" stroke-width="1"/><line x1="477.5" y1="409.0" x2="500.0" y2="444.0" stroke="#b00" stroke-width="1" stroke-dasharray="3,4"/><text x="486.5" y="407.0" font-size="10" text-anchor="start" fill="#111">joint camera</text><polygon points="93.0,449.0 107.0,449.0 107.0,439.0 93.0,439.0" fill="#333" fill-opacity="1.0" stroke="#000" stroke-width="1"/><line x1="100.0" y1="444.0" x2="500.0" y2="444.0" stroke="#b00" stroke-width="1" stroke-dasharray="3,4"/><text x="109.0" y="442.0" font-size="10" text-anchor="start" fill="#111">PTZ 1 (front, high, over the operator)</text><polygon points="378.0,99.0 392.0,99.0 392.0,89.0 378.0,89.0" fill="#333" fill-opacity="1.0" stroke="#000" stroke-width="1"/><line x1="385.0" y1="94.0" x2="500.0" y2="444.0" stroke="#b00" stroke-width="1" stroke-dasharray="3,4"/><text x="394.0" y="92.0" font-size="10" text-anchor="start" fill="#111">PTZ 2 (+Y end, high)</text><polygon points="398.1,390.0 410.1,390.0 410.1,378.0 398.1,378.0" fill="#000" fill-opacity="1.0" stroke="#000" stroke-width="1"/><polygon points="518.1,390.0 530.1,390.0 530.1,378.0 518.1,378.0" fill="#000" fill-opacity="1.0" stroke="#000" stroke-width="1"/><polygon points="398.1,515.0 410.1,515.0 410.1,503.0 398.1,503.0" fill="#000" fill-opacity="1.0" stroke="#000" stroke-width="1"/><polygon points="523.1,510.0 535.1,510.0 535.1,498.0 523.1,498.0" fill="#000" fill-opacity="1.0" stroke="#000" stroke-width="1"/><text x="399.1" y="369.0" font-size="9" text-anchor="start" fill="#111">tags</text><line x1="468.7" y1="560.8" x2="468.7" y2="604.0" stroke="#222" stroke-width="5"/><line x1="468.7" y1="604.0" x2="468.7" y2="784.0" stroke="#222" stroke-width="5"/><polygon points="463.7,609.0 473.7,609.0 473.7,599.0 463.7,599.0" fill="#f2c26b" fill-opacity="1.0" stroke="#963" stroke-width="1"/><text x="475.7" y="609.0" font-size="9" text-anchor="start" fill="#111">cable clamp on the X carriage</text><text x="475.7" y="774.0" font-size="9" text-anchor="start" fill="#111">to the -Y bench end: R>=350 saddle, then the cart</text><line x1="290.0" y1="444.0" x2="340.0" y2="444.0" stroke="#333" stroke-width="1" marker-end="url(#arr)"/><text x="220.0" y="424.0" font-size="10" text-anchor="start" fill="#111">operator (bo