<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="605" viewBox="0 0 1000 605" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="1000" height="605" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="bold">F  the wire path as the spine: fixed feeder, one-bend conduit in a trough, wire camera, finger on the jog button</text><text x="10" y="564" font-size="12" fill="#111">Every sensor here is optical or mechanical with respect to the welder. Nothing connects to the clip lead, ground terminal,</text><text x="10" y="579" font-size="12" fill="#111">feeder connector, feeder buttons' contacts, RS232/DB25, or the wire's electrical path. The finger presses the feeder's own button.</text><text x="10" y="594" font-size="12" fill="#111">Touch-off: the stage (not the feeder) closes on the cap at 0.1-0.5 mm/s; the wire camera sees 1 px of stick-out bend (~0.13 N) and stops.</text><polygon points="0.0,544.2 1000.0,544.2 1000.0,534.0 0.0,534.0" fill="#caa472" fill-opacity="1.0" stroke="#7a5a2a" stroke-width="1"/><polygon points="159.7,519.8 289.3,519.8 289.3,364.3 159.7,364.3" fill="#eee" fill-opacity="1.0" stroke="#555" stroke-width="1"/><line x1="159.7" y1="370.7" x2="289.3" y2="370.7" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/><polygon points="231.4,358.3 231.8,359.1 232.6,359.9 233.6,360.5 234.5,360.7 235.0,360.5 252.8,347.6 297.7,293.9 307.6,280.8 308.0,277.6 305.7,273.3 301.2,269.0 295.9,265.9 291.1,264.8 288.1,266.0 278.2,279.1 238.9,337.2 231.5,357.8" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="280.7,256.8 286.2,278.0 315.0,290.0 388.9,191.9 383.4,170.7 354.6,158.7" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="337.6,223.4 338.6,245.7 343.4,264.5 465.1,249.0 464.1,226.7 459.3,208.0" fill="#7f9fc4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><circle cx="224.5" cy="370.7" r="4" fill="#d00"/><text x="183.7" y="387.1" font-size="10" text-anchor="start" fill="#b00">dot</text><line x1="224.5" y1="370.7" x2="301.8" y2="304.5" stroke="#c60" stroke-width="2"/><line x1="301.8" y1="304.5" x2="387.1" y2="231.5" stroke="#c60" stroke-width="5"/><polyline points="387.6,230.9 389.7,229.2 391.7,227.6 393.8,226.0 395.9,224.5 398.0,222.9 400.2,221.5 402.4,220.0 404.6,218.6 406.8,217.2 409.0,215.9 411.3,214.6 413.6,213.4 416.0,212.2 418.3,211.0 420.7,209.9 423.0,208.8 425.4,207.7 427.9,206.7 430.3,205.8 432.7,204.9 435.2,204.0 437.7,203.1 440.2,202.4 442.7,201.6 445.2,200.9 447.8,200.3 450.3,199.7 452.9,199.1 455.4,198.6 458.0,198.1 460.6,197.7 463.2,197.3 465.8,196.9 468.4,196.6 471.0,196.4 473.6,196.2 476.2,196.0 478.8,195.9 481.4,195.8 484.0,195.8" fill="none" stroke="#c60" stroke-width="5"/><line x1="484.0" y1="195.8" x2="795.9" y2="195.8" stroke="#c60" stroke-width="5"/><polygon points="387.8,210.1 795.9,210.1 795.9,204.0 387.8,204.0" fill="#f2c26b" fill-opacity="1.0" stroke="#963" stroke-width="1"/><text x="479.6" y="224.4" font-size="9" text-anchor="start" fill="#111">printed trough: conduit held along its whole length (one ~50 deg bend)</text><polygon points="795.9,208.1 857.1,208.1 857.1,183.6 795.9,183.6" fill="#ccd" fill-opacity="1.0" stroke="#335" stroke-width="1"/><text x="780.6" y="173.4" font-size="9" text-anchor="start" fill="#111">straightener rollers</text><polygon points="857.1,267.2 979.6,267.2 979.6,144.8 857.1,144.8" fill="#ddd" fill-opacity="1.0" stroke="#333" stroke-width="1"/><circle cx="928.6" cy="206.0" r="45.9" fill="none" stroke="#555" stroke-width="1"/><text x="979.6" y="281.5" font-size="9" text-anchor="end" fill="#111">wire feeder (fixed, on the module)</text><polygon points="938.8,144.8 959.2,144.8 959.2,124.4 938.8,124.4" fill="#963" fill-opacity="1.0" stroke="#000" stroke-width="1"/><text x="933.7" y="132.5" font-size="9" text-anchor="end" fill="#111">servo finger on the Feed / Retract buttons</text><polygon points="253.1,340.1 277.6,340.1 277.6,325.8 253.1,325.8" fill="#333" fill-opacity="1.0" stroke="#000" stroke-width="1"/><line x1="265.3" y1="340.1" x2="228.6" y2="367.7" stroke="#b00" stroke-width="1" stroke-dasharray="2,2"/><text x="102.0" y="309.5" font-size="9" text-anchor="start" fill="#111">wire camera (5.5 mm endoscope) on the shell</text><line x1="222.4" y1="315.6" x2="253.1" y2="332.0" stroke="#888" stroke-width="0.7"/><polygon points="140.8,292.2 165.3,292.2 165.3,275.8 140.8,275.8" fill="#333" fill-opacity="1.0" stroke="#000" stroke-width="1"/><line x1="153.1" y1="284.0" x2="224.5" y2="370.7" stroke="#b00" stroke-width="1" stroke-dasharray="3,3"/><text x="10.2" y="268.7" font-size="9" text-anchor="start" fill="#111">joint camera (+Y, inboard)</text><polygon points="653.1,523.8 979.6,523.8 979.6,432.0 653.1,432.0" fill="none" fill-opacity="1.0" stroke="#c00" stroke-width="1.5" stroke-dasharray="6,4"/><text x="661.2" y="447.3" font-size="10" text-anchor="start" fill="#a00">welder's own circuits - nothing connects:</text><text x="661.2" y="464.6" font-size="9" text-anchor="start" fill="#a00">clip lead + ground terminal, gun-to-work contact,</text><text x="661.2" y="479.9" font-size="9" text-anchor="start" fill="#a00">feeder 6-pin connector, RS232 / DB25, key switch</text><text x="661.2" y="498.3" font-size="9" text-anchor="start" fill="#a00">(the camera may read the unit's screen/LEDs)</text><text x="295.9" y="352.4" font-size="9" text-anchor="start" fill="#a40">stick-out (camera-gauged)</text></svg>
