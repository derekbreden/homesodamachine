<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="430" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="bold">What the joint camera measures at the corner (schematic, not to scale)</text><polygon points="40,60 520,60 520,200 40,230" fill="#d8dde3" stroke="#555"/><text x="50" y="80" font-size="12">tube bore wall (the 6.35 mm lip, seen obliquely)</text><polygon points="40,230 520,200 520,380 40,380" fill="#eceff2" stroke="#555"/><text x="50" y="370" font-size="12">endcap face</text><line x1="40" y1="230" x2="520" y2="200" stroke="#222" stroke-width="2"/><text x="330" y="232" font-size="12">corner line (edge fit: ~1 px)</text><line x1="250" y1="170" x2="300" y2="262" stroke="#e00" stroke-width="5" stroke-linecap="round" opacity="0.8"/><circle cx="275" cy="216" r="5" fill="#e00"/><text x="120" y="160" font-size="12" fill="#b00">red reference beam, swept by the wobble into a line</text><line x1="330" y1="330" x2="283" y2="226" stroke="#c60" stroke-width="3"/><text x="335" y="340" font-size="12" fill="#a40">wire tip (position + scatter as wire is jogged)</text><text x="540" y="80" font-size="12">Per image, per table angle:</text><text x="540" y="100" font-size="12">a  dot/line centre to corner line (mm)</text><text x="540" y="118" font-size="12">b  share of the swept line on wall vs cap</text><text x="540" y="136" font-size="12">c  line length + orientation (wobble axis)</text><text x="540" y="154" font-size="12">d  standoff, by triangulating the dot</text><text x="540" y="172" font-size="12">e  wire tip to the line's leading end</text><text x="540" y="190" font-size="12">f  tack positions -> table angle</text><text x="540" y="226" font-size="12">Over a revolution: a(theta), d(theta)</text><text x="540" y="244" font-size="12">= this tube's runout, as seen at</text><text x="540" y="262" font-size="12">the dot, which X/Z can then follow.</text><text x="540" y="298" font-size="12">Over hours with nothing moving:</text><text x="540" y="316" font-size="12">drift of the station itself (creep,</text><text x="540" y="334" font-size="12">temperature, cable settling).</text></svg>