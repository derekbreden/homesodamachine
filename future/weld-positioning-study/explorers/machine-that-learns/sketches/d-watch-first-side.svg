<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="755" viewBox="0 0 1000 755" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="1000" height="755" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="bold">D  watch-first: gun hangs on a kinematic seat; the station only measures and shows</text><text x="10" y="714" font-size="12" fill="#111">Carries the gun: bridge -> hand-wheel Z -> hand-wheel X -> printed pose block -> kinematic seat (3 balls, 3 grooves, pot-magnet preload) -> shell.</text><text x="10" y="729" font-size="12" fill="#111">The hand no longer holds the pose; it only seats the gun (magnet snap), dials X/Z to what the screen shows, and fires (trigger or Bowden pedal).</text><text x="10" y="744" font-size="12" fill="#111">Rotator on the bench as today: pedal turns the table; the camera logs every revolution. Every part is reused when motors arrive (A or B).</text><polygon points="0.0,686.1 886.6,686.1 886.6,676.3 0.0,676.3" fill="#caa472" fill-opacity="1.0" stroke="#7a5a2a" stroke-width="1"/><polygon points="118.2,676.3 413.7,676.3 413.7,640.8 118.2,640.8" fill="#e8d9b5" fill-opacity="1.0" stroke="#865" stroke-width="1"/><polygon points="120.2,640.8 187.2,640.8 187.2,524.6 120.2,524.6" fill="#e8d9b5" fill-opacity="1.0" stroke="#865" stroke-width="1"/><polygon points="390.1,640.8 411.8,640.8 411.8,563.0 390.1,563.0" fill="#e8d9b5" fill-opacity="1.0" stroke="#865" stroke-width="1"/><polygon points="221.6,640.8 369.4,640.8 369.4,593.5 221.6,593.5" fill="#efe4c8" fill-opacity="1.0" stroke="#865" stroke-width="1"/><text x="226.6" y="617.2" font-size="9" text-anchor="start" fill="#111">existing rotator, unchanged, clamped to the bench</text><polygon points="233.0,591.6 358.1,591.6 358.1,441.5 233.0,441.5" fill="#eee" fill-opacity="1.0" stroke="#555" stroke-width="1"/><line x1="233.0" y1="447.7" 