<svg xmlns="http://www.w3.org/2000/svg" width="820" height="795" viewBox="0 0 820 795" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="820" height="795" fill="#fff"/><text x="10" y="22" font-size="15" font-weight="bold">Observation layer: plan view from above (dot on the +X side of the tube)</text><text x="10" y="754" font-size="12" fill="#111">Joint camera on the +Y side, mirror of the gun across the radial plane: ~69 deg between its view and the beam,</text><text x="10" y="769" font-size="12" fill="#111">so the red dot's image moves 3+ px per 0.1 mm of standoff at 100-120 mm (ELP 16MP, 68 deg lens, cropped).</text><text x="10" y="784" font-size="12" fill="#111">Station camera sees the whole gun, cable, tube and index ring; it reads the gun's LEDs and the table angle.</text><circle cx="261.7" cy="298.2" r="83.9" fill="none" stroke="#555" stroke-width="2"/><circle cx="261.7" cy="298.2" r="81.7" fill="none" stroke="#555" stroke-width="1"/><circle cx="236.5" cy="298.2" r="7.3" fill="none" stroke="#777" stroke-width="1"/><circle cx="286.9" cy="298.2" r="7.3" fill="none" stroke="#777" stroke-width="1"/><text x="222.1" y="314.0" font-size="9" text-anchor="start" fill="#111">cap ports</text><line x1="169.3" y1="298.2" x2="396.2" y2="298.2" stroke="#6a4" stroke-width="1" stroke-dasharray="6,3"/><text x="398.9" y="302.1" font-size="9" text-anchor="start" fill="#361">radial line / hole axis</text><line x1="343.4" y1="496.3" x2="343.4" y2="139.7" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/><text x="348.7" y="152.9" font-size="9" text-anchor="start" fill="#111">tangent</text><polygon points="249.1,388.7 250.9,395.6 256.1,401.8 263.1,405.7 270.2,406.2 275.4,403.2 286.2,390.5 328.7,333.0 336.1,311.3 336.4,310.3 336.1,309.0 335.1,307.9 333.8,307.2 332.5,307.1 315.1,316.5 311.4,318.6 261.8,370.2 251.0,383.0" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="155.1,473.7 174.9,510.9 209.7,503.8 290.5,408.1 270.7,370.9 235.9,378.0" fill="#9bb7d4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><polygon points="217.5,450.8 233.9,608.3 256.9,609.6 287.6,603.3 271.2,445.8 248.2,444.5" fill="#7f9fc4" fill-opacity="0.9" stroke="#234" stroke-width="1"/><circle cx="343.4" cy="298.2" r="4" fill="#d00"/><polygon points="270.8,214.9 297.2,214.9 297.2,196.5 270.8,196.5" fill="#333" fill-opacity="1.0" stroke="#000" stroke-width="1"/><line x1="284.0" y1="205.7" x2="343.4" y2="298.2" stroke="#b00" stroke-width="1" stroke-dasharray="3,3"/><text x="265.5" y="184.6" font-size="10" text-anchor="end" fill="#111">joint camera, 85 mm above the dot, ~120 mm away</text><polygon points="63.4,97.4 95.1,97.4 95.1,76.3 63.4,76.3" fill="#555" fill-opacity="1.0" stroke="#000" stroke-width="1"/><line x1="79.2" y1="86.8" x2="211.3" y2="430.2" stroke="#555" stroke-width="1" stroke-dasharray="2,4"/><line x1="79.2" y1="86.8" x2="396.2" y2="351.0" stroke="#555" stroke-width="1" stroke-dasharray="2,4"/><text x="100.4" y="81.5" font-size="10" text-anchor="start" fill="#111">station camera (wide)</text><line x1="332.8" y1="377.4" x2="340.8" y2="308.7" stroke="#c60" stroke-width="2"/><text x="351.3" y="377.4" font-size="10" text-anchor="start" fill="#a40">wire arrives along -Y side</text><circle cx="261.7" cy="298.2" r="118.9" fill="none" stroke="#48a" stroke-width="1" stroke-dasharray="2,2"/><text x="182.5" y="423.6" font-size="9" text-anchor="start" fill="#236">printed index ring on the turntable (read by the station camera)</text></svg>
