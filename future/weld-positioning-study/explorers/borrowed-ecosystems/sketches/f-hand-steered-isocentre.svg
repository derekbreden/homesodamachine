<text x="235.3" y="339.8" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">m g</text>
<circle cx="180.1" cy="348.4" r="4.0" stroke="#111" fill="#fff" stroke-width="1.2"/>
<circle cx="120.0" cy="310.0" r="6.0" stroke="#111" fill="#dee2e6" stroke-width="1.2"/>
<line x1="180.1" y1="348.4" x2="120.0" y2="310.0" stroke="#b5451b" stroke-width="2"/>
<text x="20.0" y="270.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">anchor b above the pivot</text>
<text x="188.1" y="358.4" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">attach a along the CG line</text>
<text x="10.0" y="500.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">gravity: m g r sin(theta)</text>
<text x="10.0" y="516.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">spring (zero free length):</text>
<text x="10.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">k a b sin(theta)</text>
<text x="10.0" y="546.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="bold">equal for all theta if k a b = m g r</text>
<text x="10.0" y="570.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">The same law holds for roll about the</text>
<text x="10.0" y="584.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">grip axis (0.90 sin(roll) N*m, 1.5 kg).</text>
<text x="10.0" y="608.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">Anglepoise lamps and video fluid heads</text>
<text x="10.0" y="622.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111" text-anchor="start" font-weight="normal">use it; drag makes the hand smooth.</text>
</g>
<text x="14" y="780" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Combines one-knob-one-parameter's isocentric gantry (rotations about the dot, walk test), sequence-of-use's HAND state (the hand as actuator), machine-that-learns' dot camera, and the film/lamp counterbalance.</text>
<text x="14" y="798" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Corrected opening pose. Rotor, spring, tiller and camera placement schematic; gun mass 1.5 kg assumed for the spring numbers.</text>
</svg>