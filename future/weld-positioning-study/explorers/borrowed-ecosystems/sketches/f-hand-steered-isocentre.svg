<text x="663.1" y="449.8" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1b7f3b" text-anchor="start" font-weight="normal">drag: damping-grease film in the hinge housing (~1 N*m*s/rad)</text>
</g>
<g transform="translate(1020,40)">
<rect x="0" y="0" width="330" height="720" fill="none" stroke="#ccc"/>
