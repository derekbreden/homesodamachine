<text x="20.5" y="87.6" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7b2cbf" text-anchor="start" font-weight="normal">zero-length spring (0.9 sin(roll) N*m), drag, tiller, lock</text>
