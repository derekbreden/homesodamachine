<text x="14" y="700" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Corrected opening pose (grip 45, hole dial 30, vertical -15). Gravity torque about the hole axis is 1.4-3.1 N*m and about the grip axis 0.3-0.9 N*m for 1-2 kg over the working range, one sign each.</text>
<text x="14" y="718" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Parts: WEN 81-pc gauge blocks ($105), micrometer head ($16, partner's sourcing), hinged lens-collar/tube-ring clamshells or printed equivalents, deep-groove pivot bearings, printed sleeve and spoke.</text>
