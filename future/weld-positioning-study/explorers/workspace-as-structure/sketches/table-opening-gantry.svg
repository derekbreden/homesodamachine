<text x="790.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="bold">What each motion does at the dot (tangent pose):</text>
<text x="790.0" y="127.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  X (gantry carriage)  across the seam, wall &lt;-&gt; cap</text>
<text x="790.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  Y (gantry on rails)  along the tangent: = a vertical-</text>
<text x="790.0" y="161.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">                         axis turn of 0.93 deg/mm; radial</text>
<text x="790.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">                         error only dy^2/2R</text>
<text x="790.0" y="195.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  Z (shelf)            height / standoff; in this pose</text>
<text x="790.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">                         moves the dot ~0.64 across and</text>
<text x="790.0" y="229.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">                         ~0.75 along the seam per mm</text>
<text x="790.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal"></text>
<text x="790.0" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="bold">Loads:</text>
<text x="790.0" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  gun -&gt; saddle -&gt; carriage -&gt; beam -&gt; Y rails -&gt; top</text>
<text x="790.0" y="297.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  tube -&gt; rotator -&gt; shelf -&gt; 4 posts -&gt; top</text>
<text x="790.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  the loop closes through the wood top</text>
<text x="790.0" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  (drop-in-collar.svg repairs this)</text>
<text x="790.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal"></text>
<text x="790.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="bold">Tube change without touching the gun:</text>
<text x="790.0" y="382.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  crank the shelf down ~70 mm, lift the tube</text>
<text x="790.0" y="399.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  off the nest, slide it out of the open face;</text>
<text x="790.0" y="416.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  reverse; crank back to the recorded number.</text>
<text x="790.0" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal"></text>
<text x="790.0" y="450.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">Top-load alternative: slide the gantry -Y</text>
<text x="790.0" y="467.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">  150+ mm (the insensitive axis) to a stop.</text>
</svg>
