<text x="760.0" y="368.4" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#444" font-weight="bold">OPERATOR (long side)</text>
<text x="740.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Loop: gun support + rotator on the module plate only; the cart's trays and</text>
<text x="752.0" y="395.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">casters carry, never locate.</text>
<text x="740.0" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Cable: unit -&gt; S store -&gt; mast saddle -&gt; one R 375 bend -&gt; clamp on the module</text>
<text x="752.0" y="429.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">-&gt; grip. Same shape every tube.</text>
<text x="740.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Feeder on the module plate under the gun tail: conduit short and in a fixed</text>
<text x="752.0" y="463.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">shape; purge and gun gas from the cart own cylinder.</text>
<text x="740.0" y="482.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Loading from above: gun parks by a hinge through its cable exit (the cable</text>
<text x="752.0" y="497.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">only bends in its own plane).</text>
<text x="740.0" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Rolls to the window fan or a laser-safe corner; the whole station moves as one</text>
<text x="752.0" y="531.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">piece.</text>
