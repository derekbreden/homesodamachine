<text x="760.0" y="166.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#d00000" font-weight="normal">dashed red: the same gun line after the work slides dy along Y</text>
<text x="760.0" y="182.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#d00000" font-weight="normal">   (plus dx = dy^2/2R so the dot lands on the corner again)</text>
<text x="760.0" y="198.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f4e9c" font-weight="normal">blue: local tangent at the new contact point</text>
<text x="900.0" y="507.8" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#111" font-weight="normal">angle between gun line and local tangent = atan(dy/R) = 0.93 deg per mm</text>
<text x="900.0" y="530.2" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#111" font-weight="normal">radial correction dy^2/2R: 1 mm -&gt; 0.008 mm, 10 mm -&gt; 0.8 mm</text>
<text x="900.0" y="552.6" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#444" font-weight="normal">(drawn for dy = 20 mm, 18 deg; R = 61.85 mm bore radius)</text>
