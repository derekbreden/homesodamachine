<text x="60.0" y="850.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Who sets what:  plate centre (pin) -&gt; dot x, y;  plate face (P1, P2 on a line through the dot) -&gt; dot height, tilt across that line;</text>
<text x="60.0" y="866.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">  collar (P3 lift) -&gt; rotation about the line through the dot (exact: the dot is on it);  collar fence -&gt; azimuth (doesn't matter).</text>
<text x="60.0" y="882.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Motors: P3 lift (tilt), roll yoke (grip axis), X and Y micro-slides on the paddle (wall/cap offset, plan-angle trim), shelf Z (LOAD/WELD).</text>
<text x="60.0" y="898.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Feedback: inclinometer for both rotations (gravity is square to the tube), slide counts for X/Y, joint camera for the dot.</text>
<text x="60.0" y="914.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#111" font-weight="normal">Tube length, runout and face tilt never reach the dot: the gun rides the plate.  The shelf only has to bring the plate into range.</text>
</svg>
