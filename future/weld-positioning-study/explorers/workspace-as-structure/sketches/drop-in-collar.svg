<text x="40.0" y="590.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">A lean or bump on the bench tilts the collar as one body: gun and joint move together. The wood top can creep or swell without entering the loop.</text>
