<text x="60.0" y="785.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">               P1, P2 rollers -&gt; z at two points on the dot's radius   (work: plate face)</text>
<text x="60.0" y="800.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">               P3 foot -&gt; z far out under the grip   (room plane)</text>
<text x="60.0" y="815.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">               fence at P3 -&gt; azimuth   (room; the freedom that doesn't matter)</text>
<text x="60.0" y="830.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">The dot lies on the P1-P2 line, so the one rotation the room sets (about that line) does not move it.</text>
<text x="60.0" y="845.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">Dot height = 1.34 x P1 - 0.34 x P2.  Tube length now turns the gun 0.23 deg per mm about the dot's</text>
<text x="60.0" y="860.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">radius instead of moving the dot ~1 mm per mm; a per-tube shelf trim removes even that.</text>
<text x="60.0" y="875.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">Weight, trigger and cable loads land mostly on P3 and the room; the support triangle's inradius</text>
<text x="60.0" y="890.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#111" font-weight="normal">is ~33 mm and a 10 N upward cable pull at the grip is held by the weight alone (A2: 0.09-0.35 N m).</text>
