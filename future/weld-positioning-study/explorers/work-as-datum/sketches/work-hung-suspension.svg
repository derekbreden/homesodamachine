<circle cx="82.3" cy="388.5" r="1.5" fill="#444"/>
<text x="20" y="98.0">base loop (room): Derek's wire in Z;</text>
<text x="20" y="110.0" class="s">X held by a line (out of page, ⊙) with his</text>
<text x="20" y="122.0" class="s">bungee as its preload; bungees alone would</text>
<text x="20" y="134.0" class="s">let 1 N move the dot 1–1.7 mm</text>
<circle cx="261.5" cy="349.2" r="9" fill="none" stroke="#8a6d1f" stroke-width="3"/>
<line x1="261.5" y1="340.2" x2="261.5" y2="197.0" stroke="#444" stroke-width="1.4"/>
<text x="273.5" y="335.2" class="s">third ring (room): roll about the nose–base line</text>
<path class="cable" d="M143.1,406.5 C37.0,395.5 4.0,494.0 -7.0,593.0"/>
<text x="30" y="516.0" fill="#7a3fa0" class="s">umbilical + conduit</text>
<text x="30" y="527.0" fill="#7a3fa0" class="s">on a room saddle, R ≥ 350</text>
<rect x="580" y="155" width="220" height="215" fill="#fff" stroke="#999"/>
<text x="588" y="172" class="s">nose loop, in its own plane (⟂ barrel)</text>
<circle cx="690" cy="250" r="34" fill="#f3e3b5" stroke="#8a6d1f"/>
<circle cx="690" cy="250" r="12" fill="#d9dde3" stroke="#333"/>
<circle cx="704" cy="270" r="3" fill="#666"/>
<text x="662" y="254" class="s">barrel</text>
<text x="709" y="283" class="s">wire guide</text>
<polyline points="630,258 690,298.1 750,258" fill="none" stroke="#2f6b3a" stroke-width="4"/>
<path d="M630,258 A62,62 0 0 1 750,258" fill="none" stroke="#2f6b3a" stroke-width="2" stroke-dasharray="5 3"/>
<circle cx="750" cy="258" r="4" fill="#2f6b3a"/>
<text x="588" y="330" class="s">V flanks: 2 in-plane translations, seated by</text>
<text x="588" y="341" class="s">4.9–7 N of the nose share; groove on the</text>
<text x="588" y="352" class="s">knife-edge ring: axial. Upper half (dashed) is</text>
<text x="588" y="363" class="s">clearance + latch pin: captive, not clamped.</text>
<line x1="690" y1="210" x2="690" y2="240" class="arrow"/>
<text class="t" x="20" y="640">What "fixed" is fixed to</text>
<text x="30" y="658" class="s">nose: height, radius, along-barrel (3)</text><text x="290" y="658" class="s">plate (face + port-pair centre)</text><text x="490" y="658" class="s">V-loop on a stalk from the plate hanger</text>
<text x="30" y="673" class="s">pitch + yaw about the nose (2)</text><text x="290" y="673" class="s">room</text><text x="490" y="673" class="s">base loop: Z wire (ratchet) + X line/bungee</text>
<text x="30" y="688" class="s">roll about the nose–base line (1)</text><text x="290" y="688" class="s">room</text><text x="490" y="688" class="s">third ring's Z wire</text>
<text x="30" y="703" class="s">hub azimuth (harmless)</text><text x="290" y="703" class="s">room</text><text x="490" y="703" class="s">tether line + bungee, one-sided vs stuck-wire drag</text>
<text x="30" y="718" class="s">weight: nose share 49–61 % / rest</text><text x="290" y="718" class="s">plate / room</text><text x="490" y="718" class="s">the plate sees ~10 N at r 48: ~0.4 N·m</text>
<text x="30" y="733" class="s">umbilical + conduit</text><text x="290" y="733" class="s">room</text><text x="490" y="733" class="s">saddle behind the base loop</text>
</svg>
