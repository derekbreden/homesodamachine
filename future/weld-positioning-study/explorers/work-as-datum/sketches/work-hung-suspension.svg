<circle cx="400.0" cy="560.0" r="3" fill="#d22"/>
<text x="406.0" y="574.0" fill="#d22" class="s">dot</text>
<ellipse cx="372.9" cy="524.0" rx="17.6" ry="12.1" transform="rotate(-38 372.9 524.0)" fill="none" stroke="#8a6d1f" stroke-width="3.5"/>
<text x="191.0" y="494.0">nose loop on the work</text>
<text x="191.0" y="506.0" class="s">openable, V-bottom, grooved shell collar</text>
<text x="191.0" y="517.0" class="s">46 mm from the dot; carries 49–61 %</text>
<line class="dim" x1="295.5" y1="496.2" x2="360.9" y2="524.0"/>
<line x1="372.9" y1="508.6" x2="392.9" y2="197.0" stroke="#777" stroke-dasharray="6 4"/>
<text x="398.9" y="285.0" class="s">Derek's tip wire, kept as the</text>
<text x="398.9" y="296.0" class="s">park / lift line: slack while welding</text>
<circle cx="106.3" cy="384.5" r="12" fill="none" stroke="#8a6d1f" stroke-width="3.5"/>
<line x1="106.3" y1="372.5" x2="106.3" y2="197.0" stroke="#444" stroke-width="1.4"/>
<rect x="100.3" y="274.0" width="12" height="16" fill="#fff" stroke="#444"/>
