<path d="M397.8,522.6 l4.4,-3 l-4.4,-3 l4.4,-3" fill="none" stroke="#555"/>
<text x="477.0" y="573.2">plate hanger: port seat + centre pin (x, y),</text>
<text x="477.0" y="585.2" class="s">three stainless wheels on the plate face (height, both tilts),</text>
<text x="477.0" y="596.2" class="s">pin spring clamps hub to plate (~25 N, internal)</text>
