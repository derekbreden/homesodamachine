<text class="t" x="20" y="635">L1. Work-borne lid, parked by the collar (same view)</text>
<text class="s" x="20" y="651">The lid rides the plate and carries the gun's nose ring, a camera and a gas port; the gun's tail rests on the workspace.</text>
