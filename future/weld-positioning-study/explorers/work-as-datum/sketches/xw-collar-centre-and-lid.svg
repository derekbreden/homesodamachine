<text class="t" x="20" y="24">W1. Collar-hung centre inside the table-opening gantry (seen from +X; +Y right)</text>
<text class="s" x="20" y="40">The shelf is cranked up until the plate's own centre meets a plunger hung from the collar. Tube, plate, ports: repo; gun: scene proxy; the rest schematic.</text>
