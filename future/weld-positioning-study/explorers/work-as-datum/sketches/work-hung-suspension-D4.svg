<circle cx="555.5" cy="513.1" r="4.8" fill="#2f6b3a"/>
<rect x="533.9" y="501.8" width="8" height="8" fill="#c05a00"/>
<line x1="555.5" y1="513.1" x2="604.0" y2="479.2" stroke="#8a6d1f" stroke-width="3" stroke-opacity="0.7"/>
