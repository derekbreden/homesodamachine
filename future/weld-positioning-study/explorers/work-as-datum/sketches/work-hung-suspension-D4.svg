<circle class="metal" cx="609.8" cy="461.1" r="6.4"/>
<circle cx="611.0" cy="470.6" r="4.8" fill="#2f6b3a"/>
<rect x="604.6" y="447.7" width="8" height="8" fill="#c05a00"/>
