<text x="20.0" y="205.0" font-size="11" fill="#555" text-anchor="start"> roll, hole: recipe block; yaw: Y slide</text>
<text x="20.0" y="220.0" font-size="11" fill="#555" text-anchor="start">At tau* = 32.5 deg (recipe 45/30/-15):</text>
