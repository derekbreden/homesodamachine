<text x="900.0" y="60.0" font-size="11" fill="#222" text-anchor="start" font-weight="bold">At tau* (1.5 kg proxy gun):</text>
<text x="900.0" y="76.0" font-size="11" fill="#555" text-anchor="start"> gravity torque: hole 1.30 N*m, grip 0.13 N*m (0.77 upright),</text>
<text x="900.0" y="92.0" font-size="11" fill="#555" text-anchor="start">   vertical 0 (always); grip torque crosses zero near tau 38 deg</text>
<text x="900.0" y="108.0" font-size="11" fill="#555" text-anchor="start"> wire at the grip base: 6.8 N from gravity; 16.6 N with 1 kg</text>
<text x="900.0" y="124.0" font-size="11" fill="#555" text-anchor="start">   ballast (11.6 N if the cable pulls up 5 N); cup ~8 N up</text>
<text x="900.0" y="140.0" font-size="11" fill="#555" text-anchor="start"> each support is one knob (one-knob's plane rule):</text>
<text x="900.0" y="156.0" font-size="11" fill="#555" text-anchor="start">   wire meets the grip axis and is parallel to the vertical</text>
<text x="900.0" y="172.0" font-size="11" fill="#555" text-anchor="start">   fork line meets the grip axis and is parallel to the hole axis</text>
<text x="900.0" y="188.0" font-size="11" fill="#555" text-anchor="start">   rings concentric with the grip axis</text>
