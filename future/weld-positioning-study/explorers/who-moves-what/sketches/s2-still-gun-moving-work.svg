<text x="51.0" y="46.5" font-size="10" fill="#b23b3b" text-anchor="start">umbilical + wire conduit: static route to the cart</text>
<text x="1000.0" y="60.0" font-size="11" fill="#222" text-anchor="start" font-weight="bold">Who moves what</text>
<text x="1000.0" y="77.0" font-size="11" fill="#555" text-anchor="start"> gun: nothing after setup</text>
<text x="1000.0" y="94.0" font-size="11" fill="#555" text-anchor="start">   roll, hole tilt = recipe block, per session</text>
<text x="1000.0" y="111.0" font-size="11" fill="#555" text-anchor="start"> work: X radial (cross-slide)</text>
<text x="1000.0" y="128.0" font-size="11" fill="#555" text-anchor="start">   Y = yaw, 1.08 mm per degree (S1)</text>
<text x="1000.0" y="145.0" font-size="11" fill="#555" text-anchor="start">   Z + trim tilt (3 screws under base)</text>
<text x="1000.0" y="162.0" font-size="11" fill="#555" text-anchor="start">   spin (existing rotator)</text>
<text x="1000.0" y="179.0" font-size="11" fill="#555" text-anchor="start">   lift-off: a &gt;=10 mm drop (the wire</text>
<text x="1000.0" y="196.0" font-size="11" fill="#555" text-anchor="start">   tip sits in the corner below the rim)</text>
<text x="1000.0" y="213.0" font-size="11" fill="#555" text-anchor="start">   loading: drop, out toward +X, back</text>
<text x="1000.0" y="230.0" font-size="11" fill="#555" text-anchor="start"> cables: never move -&gt; constant force</text>
<text x="1000.0" y="247.0" font-size="11" fill="#555" text-anchor="start">   -&gt; constant, calibratable sag</text>
<text x="1000.0" y="264.0" font-size="11" fill="#555" text-anchor="start"></text>
<text x="1000.0" y="281.0" font-size="11" fill="#555" text-anchor="start">Heights: joint rises ~150 mm on the</text>
<text x="1000.0" y="298.0" font-size="11" fill="#555" text-anchor="start">stages (estimate). Gun at grip 45 /</text>
<text x="1000.0" y="315.0" font-size="11" fill="#555" text-anchor="start">hole dial 30; tube shifted -16 mm</text>
<text x="1000.0" y="332.0" font-size="11" fill="#555" text-anchor="start">for relative yaw -15.</text>
</svg>
