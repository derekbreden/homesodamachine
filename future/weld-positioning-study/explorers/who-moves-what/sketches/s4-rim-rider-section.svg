<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="600" fill="#fcfcf8"/>
<text x="12" y="22" font-size="15" font-weight="bold" fill="#222">S4 - Rim rider, radial section at the station (schematic)</text>
<polygon points="180.0,311.5 389.2,311.5 389.2,279.7 180.0,279.7" stroke="#8a5a2b" fill="#8a5a2b" stroke-width="1.2" fill-opacity="0.25"/>
<polygon points="389.2,490.0 397.5,490.0 397.5,248.0 389.2,248.0" stroke="#8a5a2b" fill="#8a5a2b" stroke-width="1.2" fill-opacity="0.45"/>
<text x="190.0" y="297.2" font-size="11" fill="#8a5a2b" text-anchor="start">end plate 6.35 (recessed 6.35)</text>
<text x="402.5" y="440.0" font-size="11" fill="#8a5a2b" text-anchor="start">tube wall 1.65</text>
<circle cx="389.2" cy="279.7" r="5.0" stroke="#d00" fill="#d00" stroke-width="1.2" fill-opacity="1.0"/>
<text x="289.2" y="267.2" font-size="11" fill="#d00" text-anchor="start">dot / corner</text>
<circle cx="315.0" cy="240.2" r="39.5" stroke="#2e7d32" fill="none" stroke-width="2" fill-opacity="1.0"/>
<text x="185.0" y="329.7" font-size="11" fill="#2e7d32" text-anchor="start">Z skid, one of a tripod:</text>
<text x="185.0" y="342.2" font-size="10" fill="#2e7d32" text-anchor="start">5/8 in ball transfer, r ~47 mm,</text>
<text x="185.0" y="354.7" font-size="10" fill="#2e7d32" text-anchor="start">inboard of tacks, outside ports,</text>
<text x="185.0" y="367.2" font-size="10" fill="#2e7d32" text-anchor="start">upstream on cold plate</text>
<circle cx="437.5" cy="350.0" r="40.0" stroke="#2e7d32" fill="none" stroke-width="2" fill-opacity="1.0"/>
<text x="487.5" y="345.0" font-size="11" fill="#2e7d32" text-anchor="start">X rollers (pair) on tube OD, below the plate</text>
<text x="487.5" y="357.5" font-size="10" fill="#2e7d32" text-anchor="start">(wall-thickness transfer; ~20 deg upstream)</text>
<polyline points="315.0,200.7 315.0,190.0 437.5,190.0 437.5,310.0" stroke="#2e7d32" fill="none" stroke-width="4" fill-opacity="1.0"/>
<text x="280.0" y="150.0" font-size="11" fill="#2e7d32" text-anchor="start">carriage straddles the lip;</text>
<text x="280.0" y="162.5" font-size="11" fill="#2e7d32" text-anchor="start">carries shell + recipe block</text>
<text x="500.0" y="190.0" font-size="11" fill="#2e7d32" text-anchor="start">hangs free from a balancer; located only by its contacts:</text>
<text x="500.0" y="202.5" font-size="11" fill="#2e7d32" text-anchor="start">tripod on plate face (Z + 2 tilts), 2 OD rollers (X + yaw),</text>
<text x="500.0" y="215.0" font-size="11" fill="#2e7d32" text-anchor="start">soft tether (travel around the tube, the harmless freedom)</text>
<text x="500.0" y="275.0" font-size="11" fill="#2e7d32" text-anchor="start">preload: net weight (tripod), radial spring (rollers)</text>
<line x1="374.2" y1="214.7" x2="349.2" y2="144.7" stroke="#3a6ea5" stroke-width="11.0" stroke-opacity="0.35" stroke-linecap="round"/>
<text x="354.2" y="134.7" font-size="11" fill="#3a6ea5" text-anchor="start">nozzle (proxy, at P)</text>
<text x="330.0" y="500.0" font-size="11" fill="#222" text-anchor="start" font-weight="bold">Runout reaching the dot through each contact (from geometry.py):</text>
<text x="330.0" y="516.0" font-size="11" fill="#555" text-anchor="start"> one contact 20 deg upstream: 0.35 x eccentricity + 0.68 x ovality</text>
<text x="330.0" y="532.0" font-size="11" fill="#555" text-anchor="start"> a pair straddling +/-20 deg, averaged: 0.06 x eccentricity + 0.23 x ovality</text>
<text x="330.0" y="548.0" font-size="11" fill="#555" text-anchor="start"> (the downstream contact then rides freshly welded plate, hot)</text>
</svg>
