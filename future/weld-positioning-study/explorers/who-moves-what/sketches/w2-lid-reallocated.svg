<text x="690.0" y="445.6" font-size="10" fill="#704" text-anchor="start">latch at the rear ball: &gt;= 40 N</text>
<text x="1250.0" y="50.0" font-size="11" fill="#222" text-anchor="start" font-weight="bold">Who owns each freedom, by phase</text>
<text x="1250.0" y="66.0" font-size="11" fill="#555" text-anchor="start"></text>
<text x="1250.0" y="82.0" font-size="11" fill="#555" text-anchor="start">load, indicate, plate, invert:</text>
<text x="1250.0" y="98.0" font-size="11" fill="#555" text-anchor="start">  hinge (lid parked); per-tube Z set</text>
<text x="1250.0" y="114.0" font-size="11" fill="#555" text-anchor="start">  on the work's 3 screws in phase 2</text>
<text x="1250.0" y="130.0" font-size="11" fill="#555" text-anchor="start">tacks: lid seated + H2 (or hand)</text>
<text x="1250.0" y="146.0" font-size="11" fill="#555" text-anchor="start">dry run, weld, stuck wire:</text>
<text x="1250.0" y="162.0" font-size="11" fill="#555" text-anchor="start">  seat + latch (location), rotator (spin)</text>
<text x="1250.0" y="178.0" font-size="11" fill="#555" text-anchor="start">  X, yaw (Y slide), recipe block: locked</text>
<text x="1250.0" y="194.0" font-size="11" fill="#555" text-anchor="start">gun away: hinge</text>
<text x="1250.0" y="210.0" font-size="11" fill="#555" text-anchor="start"></text>
<text x="1250.0" y="226.0" font-size="11" fill="#555" text-anchor="start">Per recipe: block, X, Y(yaw) on the lid</text>
<text x="1250.0" y="242.0" font-size="11" fill="#555" text-anchor="start">Per tube:   work Z (rim back to nominal)</text>
<text x="1250.0" y="258.0" font-size="11" fill="#555" text-anchor="start">Per snip:   stickout (their K3)</text>
<text x="1250.0" y="274.0" font-size="11" fill="#555" text-anchor="start"></text>
<text x="1250.0" y="290.0" font-size="11" fill="#555" text-anchor="start">Checked with their proxy + hinge at the</text>
<text x="1250.0" y="306.0" font-size="11" fill="#555" text-anchor="start">true opening pose (hole dial 30):</text>
<text x="1250.0" y="322.0" font-size="11" fill="#555" text-anchor="start"> every feasible recipe pose escapes</text>
<text x="1250.0" y="338.0" font-size="11" fill="#555" text-anchor="start">   (grip 30-60, hole dial 15-45, yaw</text>
<text x="1250.0" y="354.0" font-size="11" fill="#555" text-anchor="start">   -30..+5 by rotation); yaw by Y slide</text>
<text x="1250.0" y="370.0" font-size="11" fill="#555" text-anchor="start">   escapes -25..+5, near miss at -30</text>
<text x="1250.0" y="386.0" font-size="11" fill="#555" text-anchor="start"> tube +/-3.2 mm escapes if Z is taken</text>
<text x="1250.0" y="402.0" font-size="11" fill="#555" text-anchor="start">   by the work or the lid; untaken +3.2</text>
<text x="1250.0" y="418.0" font-size="11" fill="#555" text-anchor="start">   puts the wire into the plate</text>
<text x="1250.0" y="434.0" font-size="11" fill="#555" text-anchor="start"></text>
<text x="1250.0" y="450.0" font-size="11" fill="#555" text-anchor="start">Seat behind the station, all posts on</text>
<text x="1250.0" y="466.0" font-size="11" fill="#555" text-anchor="start">the subplate outside the rotator base:</text>
<text x="1250.0" y="482.0" font-size="11" fill="#555" text-anchor="start">front pair x=170, rear ball x=300.</text>
<text x="1250.0" y="498.0" font-size="11" fill="#555" text-anchor="start">CG at (-30, -108) is 200 mm outside</text>
<text x="1250.0" y="514.0" font-size="11" fill="#555" text-anchor="start">the front pair: latch at the rear ball</text>
<text x="1250.0" y="530.0" font-size="11" fill="#555" text-anchor="start">&gt;= 33 N, + 7 N for a 5 N cable tug</text>
<text x="1250.0" y="546.0" font-size="11" fill="#555" text-anchor="start">(lid+gun 2.2 kg, their estimate);</text>
<text x="1250.0" y="562.0" font-size="11" fill="#555" text-anchor="start">their 60 N latch gives ~1.5x.</text>
</svg>
