<text x="387.7" y="357.7" font-size="10" fill="#8d6e00" text-anchor="start">2. Y slide = yaw, 1.08 mm/deg</text>
<text x="387.7" y="370.7" font-size="10" fill="#8d6e00" text-anchor="start">3. recipe block (roll, hole)</text>
