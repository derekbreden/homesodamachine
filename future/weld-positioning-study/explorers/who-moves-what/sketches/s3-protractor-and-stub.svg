<text x="478.0" y="501.9" font-size="10" fill="#d00" text-anchor="start">P: dot = arc centre = on the stub axis</text>
<text x="810.0" y="60.0" font-size="11" fill="#222" text-anchor="start" font-weight="bold">What each joint does</text>
<text x="810.0" y="77.0" font-size="11" fill="#555" text-anchor="start"> carriage along the arc:</text>
<text x="810.0" y="94.0" font-size="11" fill="#555" text-anchor="start">   hole-axis tilt (about the X line</text>
<text x="810.0" y="111.0" font-size="11" fill="#555" text-anchor="start">   through P)</text>
<text x="810.0" y="128.0" font-size="11" fill="#555" text-anchor="start"> stub bearing, axis = grip axis</text>
<text x="810.0" y="145.0" font-size="11" fill="#555" text-anchor="start">   (dashed), pointing at P: roll</text>
<text x="810.0" y="162.0" font-size="11" fill="#555" text-anchor="start"> neither moves the dot: both axes</text>
<text x="810.0" y="179.0" font-size="11" fill="#555" text-anchor="start">   pass through P by construction</text>
<text x="810.0" y="196.0" font-size="11" fill="#555" text-anchor="start"> yaw: work slides along Y (S1), or</text>
<text x="810.0" y="213.0" font-size="11" fill="#555" text-anchor="start">   the whole arc rides a gantry Y</text>
<text x="810.0" y="230.0" font-size="11" fill="#555" text-anchor="start"> X, Z: the work, or the arc's base</text>
<text x="810.0" y="247.0" font-size="11" fill="#555" text-anchor="start"></text>
<text x="810.0" y="264.0" font-size="11" fill="#555" text-anchor="start">Loads: gun weight to a balancer on</text>
<text x="810.0" y="281.0" font-size="11" fill="#555" text-anchor="start">the shell near its centre of mass;</text>
<text x="810.0" y="298.0" font-size="11" fill="#555" text-anchor="start">stub + arc only locate. Cable forces</text>
<text x="810.0" y="315.0" font-size="11" fill="#555" text-anchor="start">enter at the stub, next to the QBH.</text>
<text x="810.0" y="332.0" font-size="11" fill="#555" text-anchor="start"></text>
<text x="810.0" y="349.0" font-size="11" fill="#555" text-anchor="start">At room yaw 0 the QBH stays 279.2 mm</text>
<text x="810.0" y="366.0" font-size="11" fill="#555" text-anchor="start">from P in this plane for every hole</text>
<text x="810.0" y="383.0" font-size="11" fill="#555" text-anchor="start">tilt (pose.js), so the arc is exact.</text>
<text x="810.0" y="400.0" font-size="11" fill="#555" text-anchor="start">The QBH sits at (dial) degrees above</text>
<text x="810.0" y="417.0" font-size="11" fill="#555" text-anchor="start">the -Y horizontal: dial 30 -&gt; 30 deg.</text>
<text x="810.0" y="434.0" font-size="11" fill="#555" text-anchor="start">Ghosts: dials 0 and 60.</text>
</svg>
