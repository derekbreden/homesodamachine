<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" font-family="Helvetica, Arial, sans-serif">
<rect width="820" height="600" fill="#fcfcf8"/>
<text x="12" y="22" font-size="15" font-weight="bold" fill="#222">S1 - Plan: sliding the work along the tangent turns the relative yaw (tube symmetry)</text>
<circle cx="230.0" cy="250.0" r="111.3" stroke="#8a5a2b" fill="none" stroke-width="1.3" fill-opacity="1.0"/>
<circle cx="230.0" cy="250.0" r="114.3" stroke="#8a5a2b" fill="none" stroke-width="0.8" fill-opacity="1.0"/>
<circle cx="230.0" cy="250.0" r="2.5" stroke="#8a5a2b" fill="#8a5a2b" stroke-width="1.2" fill-opacity="1.0"/>
<line x1="341.3" y1="376.0" x2="341.3" y2="124.0" stroke="#8a5a2b" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="3,3"/>
<circle cx="233.8" cy="278.8" r="111.3" stroke="#c77d2e" fill="none" stroke-width="1.3" fill-opacity="1.0" stroke-dasharray="6,4"/>
<circle cx="233.8" cy="278.8" r="114.3" stroke="#c77d2e" fill="none" stroke-width="0.8" fill-opacity="1.0" stroke-dasharray="6,4"/>
<circle cx="233.8" cy="278.8" r="2.5" stroke="#c77d2e" fill="#c77d2e" stroke-width="1.2" fill-opacity="1.0"/>
<line x1="373.9" y1="371.7" x2="308.7" y2="128.3" stroke="#c77d2e" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="butt" stroke-dasharray="3,3"/>
<text x="122.0" y="120.4" font-size="11" fill="#8a5a2b" text-anchor="start">tube at phi = 0</text>
<text x="111.2" y="394.0" font-size="11" fill="#c77d2e" text-anchor="start">tube shifted (phi = 15 deg)</text>
<line x1="332.7" y1="268.3" x2="320.3" y2="294.6" stroke="#3a6ea5" stroke-width="19.8" stroke-opacity="0.3" stroke-linecap="round"/>
<line x1="320.3" y1="294.6" x2="303.1" y2="331.2" stroke="#3a6ea5" stroke-width="29.9" stroke-opacity="0.3" stroke-linecap="round"/>
<line x1="303.1" y1="331.2" x2="281.1" y2="378.1" stroke="#3a6ea5" stroke-width="23.0" stroke-opacity="0.3" stroke-linecap="round"/>
<line x1="281.1" y1="378.1" x2="270.9" y2="399.8" stroke="#3a6ea5" stroke-width="41.4" stroke-opacity="0.3" stroke-linecap="round"/>
<line x1="270.9" y1="399.8" x2="199.8" y2="550.8" stroke="#3a6ea5" stroke-width="61.2" stroke-opacity="0.3" stroke-linecap="round"/>
<line x1="248.5" y1="510.1" x2="336.2" y2="681.4" stroke="#3a6ea5" stroke-width="68.4" stroke-opacity="0.3" stroke-linecap="round"/>
<circle cx="341.3" cy="250.0" r="4.0" stroke="#d00" fill="#d00" stroke-width="1.2" fill-opacity="1.0"/>
<text x="281.3" y="100.0" font-size="11" fill="#d00" text-anchor="start">station point P (dot)</text>
<text x="281.3" y="114.0" font-size="11" fill="#d00" text-anchor="start">fixed in the room</text>
<line x1="331.3" y1="118.0" x2="341.3" y2="250.0" stroke="#d00" stroke-width="0.8" stroke-opacity="1.0" stroke-linecap="butt"/>
<text x="14.0" y="520.0" font-size="11" fill="#3a6ea5" text-anchor="start">gun (grip 45, hole dial 30) - orientation fixed in the room</text>
<line x1="230.0" y1="250.0" x2="233.8" y2="278.8" stroke="#c77d2e" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="butt"/>
<polygon points="233.8,278.8 228.8,271.4 236.7,270.3" stroke="#c77d2e" fill="#c77d2e" stroke-width="1.2" fill-opacity="1.0"/>
<text x="440.0" y="70.0" font-size="11.5" fill="#222" text-anchor="start">Rotation about the tube axis changes nothing (the joint</text>
<text x="440.0" y="87.0" font-size="11.5" fill="#222" text-anchor="start">is a circle on that axis). So moving the WORK along</text>
<text x="440.0" y="104.0" font-size="11.5" fill="#222" text-anchor="start">the tangent by r*sin(phi) and toward the station by</text>
<text x="440.0" y="121.0" font-size="11.5" fill="#222" text-anchor="start">r*(1-cos(phi)) keeps the seam through P and turns the</text>
<text x="440.0" y="138.0" font-size="11.5" fill="#222" text-anchor="start">local tangent by phi under a gun that never turns.</text>
<text x="440.0" y="155.0" font-size="11.5" fill="#555" text-anchor="start"></text>
<text x="440.0" y="172.0" font-size="11.5" fill="#555" text-anchor="start">  1.08 mm of slide per degree of yaw (r = 61.85 mm)</text>
<text x="440.0" y="189.0" font-size="11.5" fill="#555" text-anchor="start">  +/-15 deg  = +/-16.0 mm slide, 2.1 mm correction</text>
<text x="440.0" y="206.0" font-size="11.5" fill="#555" text-anchor="start">  +/-30 deg  = +/-30.9 mm slide, 8.3 mm correction</text>
<text x="440.0" y="223.0" font-size="11.5" fill="#555" text-anchor="start"></text>
<text x="440.0" y="240.0" font-size="11.5" fill="#555" text-anchor="start">Consequences:</text>
<text x="440.0" y="257.0" font-size="11.5" fill="#555" text-anchor="start"> - any X/Y carrier (gantry, compound table) already</text>
<text x="440.0" y="274.0" font-size="11.5" fill="#555" text-anchor="start">   owns the vertical-axis rotation; no yaw bearing</text>
<text x="440.0" y="291.0" font-size="11.5" fill="#555" text-anchor="start"> - a 1 mm Y error IS a 0.93 deg yaw error; Y is not</text>
<text x="440.0" y="308.0" font-size="11.5" fill="#555" text-anchor="start">   'free' just because the tube spins</text>
<text x="440.0" y="325.0" font-size="11.5" fill="#555" text-anchor="start"> - yaw is gravity-neutral, so the work can take it</text>
<text x="440.0" y="342.0" font-size="11.5" fill="#555" text-anchor="start">   without changing the downhand puddle</text>
<text x="12.0" y="588.0" font-size="10" fill="#555" text-anchor="start">Plan view, +X right, +Y up. Gun = capsule proxy from the manual drawing (estimate). Tube circles: ID/OD from the repo.</text>
</svg>
