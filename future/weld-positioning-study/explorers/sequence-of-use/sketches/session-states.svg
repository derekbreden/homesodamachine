<text x="10" y="556" font-size="11">Reading across: the gun needs to be completely out of the way (1–4, 11), precisely and stiffly located (7–8), perfectly still (9), and to return to a remembered pose (10→7).</text>
<text x="10" y="572" font-size="11">In B the gun row is solid blue: the tube carries all the state changes. In A the gun alternates between two stored states. In C precision exists only while contacts are loaded.</text>
<text x="10" y="588" font-size="11">Phase 5 is the collision point: any hanger that bridges the rim crosses the station when the table indexes between tacks.</text>
