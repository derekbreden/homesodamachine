<text x="790" y="420">Hook at the CG passes only a vertical force:</text>
<text x="790" y="434">the arm floats the gun (hand mode), and its</text>
<text x="790" y="448">friction joints cannot push the docked shell.</text>
<text x="790" y="476" font-weight="bold">States</text>
<text x="790" y="492">PARK: in the cradle; arm holds nothing precisely</text>
<text x="790" y="507">HAND: lifted out; weightless; hand aims and tacks</text>
<text x="790" y="522">DOCK: balls in vees, latched; arm only floats</text>
<text x="790" y="537">Every change: snip first; stickout at the cradle</text>
<text x="12" y="946">Branch M2 (not drawn): a pole-mount arm high overhead carries a spring balancer whose line holds the bail — Derek's "hook on a wire" with its anchor on his monitor arm.</text>
</svg>