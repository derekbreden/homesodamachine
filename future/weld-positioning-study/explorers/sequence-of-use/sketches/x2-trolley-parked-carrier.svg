<text x="440.6" y="526.0">parked (faded): lines stay vertical,</text><text x="440.6" y="540.0">no pendulum pull back over the tube;</text><text x="440.6" y="554.0">tube column open for loading</text>
<text x="12" y="650">Without the trolley: a 15–20 N gun on 0.8–1.2 m lines pulled 300 mm aside is pulled back with 4–8 N and must be hooked; two separate anchors also yaw it.</text>
<text x="12" y="666">Roll on the rings is not free in practice: the proxy CG sits 85 mm off the grip axis (0.58–1.01 N·m for 0.8–1.4 kg at the true pose). Ring B carries a roll lock.</text>
