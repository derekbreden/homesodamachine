<text x="490.0" y="410" fill="#577">LOAD position (dashed): full access to nest, plate, indicator, float</text>
<text x="12" y="708">Moves with the carriage: rotator, motor + driver cable, copper shoe + work lead, purge hose (2nd closure). Never moves: gun, umbilical, wire conduit, camera.</text>
