<text x="10" y="20" font-size="14" font-weight="bold">Film-grip carrier (borrowed-ecosystems E) with two phase states added: carry pins in the gimbal, two hard stops on the rider Z</text>
<text x="10" y="38" font-size="11">Pins IN lock the gimbal's two non-vertical axes at the recipe attitude (the umbilical, not pendulosity, sets a free gimbal's attitude: 130–640 N·mm vs 1–2 N·mm per degree).</text>
<text x="10" y="54" font-size="11">LAND keeps the wire tip ~10 mm back along the barrel while the undamped arm settles the rider; WELD is the recipe stop. Lift-off reverses the order.</text>
