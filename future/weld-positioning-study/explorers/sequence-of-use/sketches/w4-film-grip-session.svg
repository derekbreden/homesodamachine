<text x="10" y="330" font-size="11">Tacks: with the rider seated a rim-bridge hanger hits its ±60° rim wheels when the table indexes; use the stand-hung plate head (pads inside, arm over the −X rim) and tack as fixture pulses.</text>
<text x="10" y="346" font-size="11">Stuck wire: the tube drags gun + rider round the rim until the tether breakaway opens the pedal loop (a proposed series contact); snip, slide back, re-trim stickout at the cup.</text>
<text x="10" y="362" font-size="11">Second person: pins (coloured rings) and the Z lever (LAND / WELD) show the state; the recipe is the arm tension count, the indexing ring ID and the WELD stop ID.</text>
