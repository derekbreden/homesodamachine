<text x="12" y="730">Five contacts: R1,R2 on the rim top (height, tilt about radius); O1,O2 on the OD near the rim (radius, yaw); O3 lower on the OD (tilt about the tangent).</text>
<text x="12" y="746">Sixth freedom (along the circumference) held by the tether. Weight carried by a balancer; net load chosen to keep all five contacts loaded.</text>
<text x="12" y="762">Angles to scale: R/O at −22° and −52°. The wire crosses over the OD near −54° at ~rim+49 and the barrel near −81° at ~rim+76 (proxy, dial 30).</text>
