<text x="20.0" y="650.0" font-size="10" text-anchor="start" fill="#444">Rules: flexures guide, steel springs preload, steel micrometers set, the carrier (not the flexures) takes the gun's weight where it can;</text>
<text x="20.0" y="665.0" font-size="10" text-anchor="start" fill="#444">leaves run along the gun's weight at the working tilt; the dry run happens at thermal steady state just before the weld.</text>
<text x="20.0" y="680.0" font-size="10" text-anchor="start" fill="#444">Ranges (1095 shim leaves): parallelogram ±4 mm at L 40; remote-centre pivot ±3.4° (L 40) to ±13° (L 80) at D 70. Drift of the remote centre:</text>
<text x="20.0" y="695.0" font-size="10" text-anchor="start" fill="#444">≤ 24–42 µm at ±1°, 96–170 µm at ±2° (D 70). All estimates, flexures.py.</text>
