<text x="20.0" y="668.0" font-size="10" text-anchor="start" fill="#444">Grey dashed (W_x, W_y, W_z): lines through the dot — a virtual ball joint there (carry-and-locate's triad). Set once, then left alone: they make the dot the pivot.</text>
<text x="20.0" y="683.0" font-size="10" text-anchor="start" fill="#444">Blue W_hole: from the grip-base loop, in the vertical plane of the grip axis -> changes only the hole angle.   Green W_vert: from the same loop, along the hole-axis</text>
<text x="20.0" y="698.0" font-size="10" text-anchor="start" fill="#444">direction (in the plane of grip and hole axes) -> changes only the vertical-axis angle.   Red W_grip: from the outrigger, in the vertical radial plane through the dot -> only roll.</text>
<text x="20.0" y="713.0" font-size="10" text-anchor="start" fill="#444">Brown: printed outrigger from the nozzle end of the shell over the rim.  Purple: preloads (Derek's bungees) keep every wire taut; they set no position.</text>
<text x="20.0" y="728.0" font-size="10" text-anchor="start" fill="#444">Dot place (X, Z) is moved at the work (couch slides) so that no wire length has to change for it.  Layout from diagonal_wires.py; anchors ~400 mm out.</text>
</svg>