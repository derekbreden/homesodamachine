<text x="20.0" y="580.0" font-size="10" text-anchor="start" fill="#444">Orange: the printed pose block (one per recipe; generated from the pose math). Dark balls: three 1/4 in G25 balls on the shell, seated in the block's</text>
<text x="20.0" y="595.0" font-size="10" text-anchor="start" fill="#444">upper vees. Grey: the block's lower balls in dowel-pin vees on the stand plate, outboard on −Y, clear of the tube. Dot place (X, Z) and yaw are</text>
<text x="20.0" y="610.0" font-size="10" text-anchor="start" fill="#444">set at the work (couch slides) with the dot camera; branch S puts hardened angle blocks under a hinged plate whose hinge pivots on the dot.</text>
