<text x="20.0" y="780.0" font-size="10" text-anchor="start" fill="#555">Rough sizes: couch stack ~120 mm (4-inch rotary table 80 mm + plate + two slides). Arm spoke 300 mm to the roll bearing. Gun = the scene's illustrative proxy at roll 45°, hole 30°.</text>
<text x="20.0" y="796.0" font-size="10" text-anchor="start" fill="#555">Colours: blue = rotations about the dot; red = beam / grip axis; green = standoff; orange = wire; purple = umbilical.</text>
