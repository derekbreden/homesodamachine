    <span class="elbow-label elbow-tube">Tube socket · 15 mm deep</span>

<style>
  #full-base-print-pose .elbow-controls {padding-right:90px;}
  #full-base-print-pose .elbow-stage {position:relative;width:100%;height:450px;overflow:hidden;}
  #full-base-print-pose canvas {display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  #full-base-print-pose canvas:active {cursor:grabbing;}
  #full-base-print-pose .elbow-label {position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;color:var(--foreground);background:var(--background);padding:3px 5px;}
  #full-base-print-pose .elbow-bed {position:absolute;left:8px;bottom:8px;color:var(--muted-foreground);pointer-events:none;}
  #full-base-print-pose .elbow-gesture {position:absolute;right:8px;bottom:8px;color:var(--muted-foreground);pointer-events:none;}
  #full-base-print-pose .elbow-caption {color:var(--muted-foreground);padding-top:4px;}
  @media(max-width:480px){
    #full-base-print-pose .elbow-stage {height:360px;}
    #full-base-print-pose .elbow-gesture {display:none;}
    #full-base-print-pose .elbow-label {max-width:48%;white-space:normal;}
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(async () => {
  const root = document.getElementById('full-base-print-pose');
  const stage = root.querySelector('.elbow-stage');
  const canvas = document.getElementById('elbow-canvas');
  const select = {value:'discharge'};
  const cut = document.getElementById('elbow-cutaway');
  const caption = root.querySelector('.elbow-caption');
  const labels = [root.querySelector('.elbow-barb'), root.querySelector('.elbow-tube')];
  const models = JSON.parse(document.getElementById('elbow-mesh-data').textContent);
  if (!window.THREE) {
    caption.textContent = 'The 3D library could not load.';
    caption.setAttribute('role', 'alert');
    return;
  }
  const T = window.THREE;
  let renderer;
  try {renderer = new T.WebGLRenderer({canvas, antialias:true, alpha:true});}
  catch(error) {caption.textContent='WebGL is unavailable in this preview.';caption.setAttribute('role','alert');return;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.localClippingEnabled = true;
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(35, 1, 0.1, 500);
  const target = new T.Vector3(0,10,0);
  let yaw=0.12, pitch=0.70, distance=78;
  const group = new T.Group();
  scene.add(group);
  const material = new T.MeshStandardMaterial({roughness:0.73, metalness:0.02, flatShading:true, side:T.DoubleSide});
  const edgeMaterial = new T.LineBasicMaterial({transparent:true,opacity:0.38});
  const bedMaterial = new T.MeshBasicMaterial({transparent:true,opacity:0.055,side:T.DoubleSide,depthWrite:false});
  const bed = new T.Mesh(new T.PlaneGeometry(52,40),bedMaterial);
  bed.rotation.x=-Math.PI/2;
  bed.position.y=-0.04;
  scene.add(bed);
  const grid = new T.GridHelper(50,10);
  grid.position.y=-0.025;
  grid.material.transparent=true;
  grid.material.opacity=0.18;
  scene.add(grid);
  scene.add(new T.HemisphereLight(0xffffff,0xffffff,2.1));
  const key=new T.DirectionalLight(0xffffff,2.8); key.position.set(-20,40,35); scene.add(key);
  const fill=new T.DirectionalLight(0xffffff,1.2); fill.position.set(30,20,-25); scene.add(fill);
  const leaders = new T.LineSegments(new T.BufferGeometry(),new T.LineBasicMaterial({transparent:true,opacity:0.5}));
  scene.add(leaders);
  const geometries={};
  async function typed(value,Type) {
    const raw=atob(value), bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Type(await new Response(stream).arrayBuffer());
  }
  for(const [name,m] of Object.entries(models)) {
    geometries[name]={};
    for(const mode of ['solid','cut']) {
      const source=m[mode];
      const geometry=new T.BufferGeometry();
      geometry.setAttribute('position',new T.BufferAttribute(await typed(source.positions,Float32Array),3));
      geometry.setIndex(new T.BufferAttribute(await typed(source.indices,Uint16Array),1));
      geometry.computeVertexNormals();
      geometries[name][mode]=geometry;
    }
  }
  const resolveColor=(token) => {
    const probe=document.createElement('span');
    probe.style.color=`var(${token})`; root.appendChild(probe);
    const value=getComputedStyle(probe).color; probe.remove();
    return new T.Color(value);
  };
  function theme() {
    const surface=resolveColor('--background'), ink=resolveColor('--foreground');
    material.color.copy(resolveColor('--viz-series-1'));
    edgeMaterial.color.copy(ink);
    bedMaterial.color.copy(ink);
    grid.material.color.copy(ink);
    leaders.material.color.copy(ink);
    scene.children.filter(x=>x.isHemisphereLight).forEach(x=>{x.color.set(0xffffff);x.groundColor.copy(surface).lerp(ink,0.15);});
    draw();
  }
  function replaceMesh() {
    while(group.children.length) {
      const child=group.children[0]; group.remove(child);
      if(child.isLineSegments) child.geometry.dispose();
    }
    const geometry=geometries[select.value][cut.checked?'cut':'solid'];
    group.add(new T.Mesh(geometry,material));
    group.add(new T.LineSegments(new T.EdgesGeometry(geometry,26),edgeMaterial));
    labels[1].textContent=`Tube socket · ${models[select.value].tubeDepth} mm deep`;
    caption.textContent=`${cut.checked?'Centre cutaway':'Actual print mesh'} · 45° rising legs · 448 mm² bed contact`;
    draw();
  }
  function draw() {
    const width=stage.clientWidth, height=stage.clientHeight;
    if(!width || !height) return;
    camera.aspect=width/height;
    camera.position.set(target.x+distance*Math.cos(pitch)*Math.sin(yaw),target.y+distance*Math.sin(pitch),target.z+distance*Math.cos(pitch)*Math.cos(yaw));
    camera.lookAt(target);camera.updateProjectionMatrix();camera.updateMatrixWorld();
    const anchors=models[select.value].mouths;
    const tips=models[select.value].labelTips;
    const line=[];
    anchors.forEach((a,i) => {
      line.push(...a,...tips[i]);
      const p=new T.Vector3(...tips[i]).project(camera);
      const x=(p.x+1)*width/2, y=(1-p.y)*height/2;
      const label=labels[i];
      const maxX=width-label.offsetWidth-4;
      label.style.transform=`translate(${Math.max(4,Math.min(maxX,x-label.offsetWidth/2))}px,${Math.max(4,Math.min(height-48,y-label.offsetHeight))}px)`;
      label.style.display=p.z>1?'none':'';
    });
    leaders.geometry.dispose();
    leaders.geometry=new T.BufferGeometry();
    leaders.geometry.setAttribute('position',new T.Float32BufferAttribute(line,3));
    renderer.render(scene,camera);
  }
  function save() {
    if(!window.openai || !window.openai.setWidgetState) return;
    window.openai.setWidgetState({modelContent:{revision:'full-base-single-v1',cutaway:cut.checked,orientation:'proposed print pose'},privateContent:{yaw,pitch,distance}}).catch(()=>{});
  }
  function restore(state) {
    if(!state) return;
    const m=state.modelContent || {}, p=state.privateContent || {};
    if(m.revision!=='full-base-single-v1') return;
    if(models[m.elbow]) select.value=m.elbow;
    if(typeof m.cutaway==='boolean') cut.checked=m.cutaway;
    if(Number.isFinite(p.yaw)) yaw=p.yaw;
    if(Number.isFinite(p.pitch)) pitch=Math.max(-1.2,Math.min(1.4,p.pitch));
    if(Number.isFinite(p.distance)) distance=Math.max(42,Math.min(150,p.distance));
    replaceMesh();
  }
  cut.addEventListener('change',()=>{replaceMesh();save();});
  const pointers=new Map();let pinch=null;
  canvas.addEventListener('pointerdown',event=>{
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if(pointers.size===2) {const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
  });
  canvas.addEventListener('pointermove',event=>{
    if(!pointers.has(event.pointerId)) return;
    const old=pointers.get(event.pointerId);
    if(pointers.size===1) {yaw-=(event.clientX-old.x)*0.008;pitch=Math.max(-1.2,Math.min(1.4,pitch+(event.clientY-old.y)*0.008));}
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if(pointers.size===2) {
      const p=[...pointers.values()],next=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      if(pinch>0 && next>0) distance=Math.max(42,Math.min(150,distance*pinch/next));
      pinch=next;
    }
    draw();
  });
  const release=event=>{pointers.delete(event.pointerId);pinch=null;save();};
  canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
  canvas.addEventListener('wheel',event=>{event.preventDefault();distance=Math.max(42,Math.min(150,distance*Math.exp(event.deltaY*0.001)));draw();clearTimeout(canvas.saveTimer);canvas.saveTimer=setTimeout(save,250);},{passive:false});
  new ResizeObserver(()=>{renderer.setSize(stage.clientWidth,stage.clientHeight,false);draw();}).observe(stage);
  new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);theme();});
  restore(window.openai?.widgetState);
  replaceMesh();theme();
  root.dataset.ready='true';
})();
</script>
