<style>
  #nameplate-more-study .nameplate-gallery {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px;margin:20px 0 16px}
  #nameplate-more-study .nameplate-gallery.single {grid-template-columns:1fr}
  #nameplate-more-study figure {margin:0;min-width:0}
  #nameplate-more-study figure[hidden] {display:none}
  #nameplate-more-study figcaption {margin-bottom:8px;color:var(--foreground)}
  #nameplate-more-study .nameplate {display:block;width:100%;height:auto}
  #nameplate-more-study.white-field .qr-ground {fill:#dededb}
  #nameplate-more-study.white-field .qr-modules {fill:#1c1e21}
  @media (max-width:580px) {#nameplate-more-study .nameplate-gallery {grid-template-columns:1fr}}
</style>
<script>
  (() => {
    const root = document.getElementById('nameplate-more-study');
    const gallery = root.querySelector('.nameplate-gallery');
    const figures = [...gallery.querySelectorAll('figure')];
    const buttons = [...root.querySelectorAll('[data-show]')];
    const state = {treatment:'reverse'};
    const renderTreatment = () => root.classList.toggle('white-field', state.treatment === 'white');
    buttons.forEach(button => button.addEventListener('click', () => {
      const value = button.dataset.show;
      gallery.classList.toggle('single', value !== 'all');
      figures.forEach(figure => {figure.hidden = value !== 'all' && figure.dataset.layout !== value;});
      buttons.forEach(peer => peer.setAttribute('aria-pressed', String(peer === button)));
    }));
    renderTreatment();
    if (globalThis.Tweak) {
      const tweak = new Tweak({container:root,onChange:renderTreatment});
      tweak.addSelect(state,'treatment',{label:'QR treatment',options:[
        {label:'White on black',value:'reverse'},
        {label:'Black on white',value:'white'}
      ]});
    }
  })();
</script>
